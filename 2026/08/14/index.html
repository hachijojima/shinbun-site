<script type="application/json" id="edition">{"date": "2026-08-14", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T07:35:37+09:00", "prev": "/2026/08/13/", "next": "/2026/08/15/", "alerts": [], "weather": {"issued": "2026-08-14T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "雨", "main": "雨", "hachijo": "雨", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 30}]}, "koyomi": {"sunrise": "5:03", "sunset": "18:29", "moon": 0.8, "tide": {"place": "八丈島(神湊)", "high": [["5:34", 153], ["18:46", 147]], "low": [["12:06", 24]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "島内出産に医師3人・助産師4人", "body": ["町立八丈病院で島内の出産を続けるには、産婦人科医2人、助産師4人、小児科医1人が要る。2025年9月5日の八丈町議会第三回定例会で、菊池裕介病院事務長補佐が山下則子議員の一般質問に答えたことが、町議会の会議録で分かった。病院はこの人数を安定して確保できず、今年4月から出産を島外に移している。", "出産が島外に移ったため、島で子を産む家族は出産の前後の数週間を島の外で過ごす。山下議員は、妊娠34週ごろに上京し、赤ちゃんの1か月健診まで滞在する例を挙げた。往復の交通費と、受け入れ先の病院の宿舎で1日2,000円かかる宿泊費について、全額の助成を求めた。上の子を島に残す家族への支えも求めた。", "山下議員は質問で、医師や助産師が足りないことは前々から分かっていたはずだと述べた。それまでの経過を早くから説明していれば、急だと受け止める人はいなかったとして、事前の説明がなかった点をただした。事務長補佐は、病院は人の確保に長年苦労してきたと答えた。今いる職員が厳しい働き方をしながら出産を続けてきたが、働き方改革や医療の標準の変化で、要る人数がこれまでより多くなったと説明した。島外に移すと判断できた最も早い時期に発表したと述べた。", "病院は2025年6月、周産期医療の提供体制を確保できないとして、今年4月1日から島内での出産をやめると知らせた。山下議員によると、知らせが町のホームページに載ったのは6月2日だった。島内で産めたのは、今年2月28日が出産予定日の妊婦までだった。妊婦健診を含む産婦人科の外来は続けている。同じ議会で菅原宏幸福祉健康課長は、紹介先の病院を視察したと説明した。渡航費や宿泊費の補助を検討しており、12月の補正予算か8年度予算までに案を示したいと答えた。", "町は2026年度予算に、出産の補助として1千万円を計上した。山下奉也町長が3月2日の施政方針で示した。出産予定日が4月1日以降の妊婦に、出産前と出産後に25万円ずつ、1回の出産で計50万円を出す。出産前の補助は、妊娠12週以降に町に住み、町の妊婦面談を受けることが条件になる。あわせて産後ケア事業に500万円を計上し、出産祝金は5万円から50万円に増やした。50万円は出産から1年たった後に出す。問い合わせは町福祉健康課保健係（04996-2-5570）。"], "added": [{"fact": "山下議員の質問に答えたのは病院事務長補佐の菊池裕介氏。福祉健康課長は菅原宏幸氏（会議録4ページの説明員の職氏名と11〜12ページの答弁）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "山下議員は質問の冒頭で、分娩中止の知らせは6月2日に町ホームページで発表されたと述べた（会議録11ページ）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "山下議員は再質問で、医師や助産師の不足は前々から分かっていたはずだとし、以前から経過の説明があれば急だと思う人はいなかったと述べた（会議録13ページ）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "事務長補佐は、人材確保に長年病院で苦労し、今の職員がかなり厳しい働き方をしながら何とか続けてきたと答えた。働き方改革や医療の標準の変化で要る人数がこれまでより多くなったとも述べた（会議録15ページ）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "山下議員は、34週から上京し1か月健診まで滞在する場合の渡航費と、宿舎の1日2,000円の宿泊費の全額助成を求めた。上の子を残す家族への支援も問うた（会議録14ページ）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "福祉健康課長は紹介先の病院を視察し、渡航費・宿泊費の補助を検討中と答えた。12月予算か8年度予算までに案を示すとした（会議録12、18ページ）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "病院の告知によると、周産期医療提供体制の確保が難しいため、令和8年4月1日から島内での分娩を終える。令和8年2月28日が分娩予定日の妊婦までは島内で分娩でき、妊婦健診を含む産婦人科外来は続ける", "url": "https://hachijohospital.jp/wp-content/uploads/2025/06/分娩終了01.pdf"}, {"fact": "2026年度の施政方針で、出産前と出産後に25万円ずつ計50万円を出す補助に総額1千万円、産後ケア事業に500万円を計上した。出産祝金は5万円から50万円に増やし、出産の1年後に出す", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/r7-houshin/"}, {"fact": "島外分娩に係る補助は出産予定日が2026年4月1日以降の人が対象。出産前の補助は、妊娠12週以降の町内居住と妊婦面談が条件。問い合わせは福祉健康課保健係04996-2-5570", "url": "https://www.town.hachijo.tokyo.jp/kosodate-kyouiku/ninshin-shussan-kosodate/ninshin-shussan/ikujishien/n-josehojo/"}], "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=15"}, {"label": "八丈町議会 令和7年第三回定例会会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"label": "町立八丈病院 分娩終了", "url": "https://hachijohospital.jp/wp-content/uploads/2025/06/分娩終了01.pdf"}, {"label": "八丈町 令和8年度施政方針", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/r7-houshin/"}, {"label": "八丈町 島外分娩に係る助成", "url": "https://www.town.hachijo.tokyo.jp/kosodate-kyouiku/ninshin-shussan-kosodate/ninshin-shussan/ikujishien/n-josehojo/"}], "label": "くらし", "audience": "島民", "thread_id": "t20260814-53", "id": "2f58b9", "photo": {"type": "img", "src": "/img/kiji/2f58b9.jpg?v=502d96", "og": "/img/kiji/2f58b9-og.jpg?v=502d96", "s": "/img/kiji/2f58b9-s.jpg?v=502d96", "m": "/img/kiji/2f58b9-m.jpg?v=502d96", "caption": "町立八丈病院", "credit": "", "file": "own/byoin-4.jpg"}}, "side": [], "shorts": [{"headline": "防災対策課の電話 9-5544に", "body": ["八丈町は10日、防災対策課の電話番号を04996-9-5544に変えた。それまでは総務課と同じ04996-2-1121を使っていた。町が13日に町のサイトで知らせた。総務課の番号と、防災対策課の執務室の場所は変わらない。", "町のサイトでは、避難場所・避難所のページと防災行政無線のページが、10日付で問い合わせ先を同課の新しい番号に改めた。防災行政無線のデジタル戸別受信機の受け取りと、受信できないときの相談は、これまでどおり総務課が受ける。受信機は各出張所でも受け取れる。", "防災対策課は今年度に新しくできた課だ。山下奉也町長は3月2日の町議会第1回定例会で今年度の施政方針を述べ、課を設けると表明した。施政方針は、昨年10月の台風22号と23号が記録的な強風と大雨をもたらしたと振り返った。22号では最大瞬間風速54.7メートル、24時間降水量356.5ミリを記録し、大きな土砂災害が起きた。", "そのうえで施政方針は、台風や土砂災害、地震、火山などあらゆる災害を想定して減災に取り組む必要があるとした。同課はそのために置かれ、災害復興計画の進み具合の管理と、地域防災計画の見直しを担う。住民に「自助」「共助」「公助」を呼びかけるほか、新しい防災備蓄拠点として防災倉庫の建設も受け持つ。町の課の一覧では、課の下に防災対策係を置いている。", "ファクス番号は現在、総務課と同じ04996-2-3874。窓口は大賀郷の町役場にあり、開庁時間は8時30分から17時15分まで。土日祝日と12月29日から1月3日までは閉まる。"], "added": [{"fact": "避難場所・避難所のページと防災行政無線のページは、2026年8月10日付で問い合わせ先を防災対策課（04996-9-5544）に改めた", "url": "https://www.town.hachijo.tokyo.jp/bousai-anzen/higorokarano-sonae/hinan/"}, {"fact": "防災行政無線のデジタル戸別受信機は総務課か出張所で受け取る。受信できないときの相談は総務課が受ける", "url": "https://www.town.hachijo.tokyo.jp/bousai-anzen/higorokarano-sonae/musen/"}, {"fact": "課の一覧では、防災対策課の下に防災対策係を置いている。防災対策課のファクス番号は総務課と同じ04996-2-3874", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/otoiawase-ichiran/"}, {"fact": "山下奉也町長は令和8年3月2日の第1回定例会で施政方針を述べた。施政方針は「昨年、10月に発生した台風第22号、第23号は記録的な強風と大雨をもたらしました」と振り返り、22号では最大瞬間風速54.7m、24時間降水量356.5mmを記録して大きな土砂災害が起きたとした。そのうえで、あらゆる災害を想定して減災に取り組む必要があるとし、「そのため」令和8年度より防災対策課を設け、災害復興計画に基づく進捗管理、地域防災計画の見直し、自助・共助・公助の啓発、防災倉庫の建設に取り組むとした", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/r7-houshin/"}, {"fact": "町役場の開庁時間は8時30分から17時15分まで。土日祝日と12月29日から1月3日までは閉まる", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260813/"}], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260813/"}, {"label": "八丈町「避難場所・避難所」", "url": "https://www.town.hachijo.tokyo.jp/bousai-anzen/higorokarano-sonae/hinan/"}, {"label": "八丈町「防災行政無線」", "url": "https://www.town.hachijo.tokyo.jp/bousai-anzen/higorokarano-sonae/musen/"}, {"label": "八丈町「お問い合わせ一覧」", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/otoiawase-ichiran/"}, {"label": "八丈町「令和8年度 施政方針」", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/r7-houshin/"}], "label": "町政", "audience": "島民", "thread_id": "t20260814-52", "id": "38cabe", "photo": {"type": "img", "src": "/img/kiji/38cabe.jpg?v=7e3ec2", "og": "/img/kiji/38cabe-og.jpg?v=7e3ec2", "s": "/img/kiji/38cabe-s.jpg?v=7e3ec2", "m": "/img/kiji/38cabe-m.jpg?v=7e3ec2", "caption": "災害に備える防災セットの俯瞰写真", "credit": "", "file": "ac/34615312.jpg"}}, {"headline": "青ヶ島へ1日以来の船", "body": ["八丈島と青ヶ島を結ぶ伊豆諸島開発株式会社は13日朝、くろしお丸の臨時便を出すと決めた。八丈島9時30分発、青ヶ島12時50分発の1往復で、青ヶ島へ船が通うのは1日以来となった。同日午後、船は青ヶ島に着き、八丈島へ折り返したという。", "同社によると、青ヶ島航路は1日に運航したあと、2日から12日まで船が出なかった。2日・6日・10日・12日は運休日だった。3〜5日は台風13号による海上不良を見込んで全便欠航とし、7日も台風13号の影響で欠航した。8日と11日も欠航し、9日は海上不良で欠航した。", "同社は12日朝、この日を運休日と案内した。同じ日の9時すぎには、13日に臨時運航を予定していると知らせた。出すかどうかは当日の6時30分ごろに決めると案内した。13日朝の運航状況で、同社はこの便を運航とした。八丈島側の発着は八重根漁港とする条件を付けた。", "東京との間も13日に動いた。八丈島観光協会は13日朝、東海汽船の12日夜竹芝発（13日朝八丈島着）の便が9時15分に底土港へ入る予定だと案内した。ANAの羽田—八丈島線は、終日通常運航とした。", "同協会は13日夕方、13日夜竹芝発（14日朝八丈島着）の橘丸について、海や港の状況で接岸できない場合がある条件付きで運航すると案内した。"], "added": [{"fact": "13日午後、くろしお丸が青ヶ島に着き、八丈島へ向けて出港したという", "url": "https://x.com/i/status/2087766550938022179"}, {"fact": "八丈島観光協会は13日朝、くろしお丸（八重根漁港発）は9時30分出港予定、東海汽船の12日夜東京発の便は9時15分に底土港入港予定、ANAは終日通常運航と案内した", "url": "https://x.com/Go_Hachijo_JP/status/2087678106266108262"}, {"fact": "伊豆諸島開発は12日9時すぎ、13日に臨時運航を予定していると知らせ、就航するかどうかは当日6時30分ごろに決めるとした", "url": "https://x.com/izu_shibaura/status/2087332945862525136"}, {"fact": "八丈島観光協会は13日夕方、13日22時30分竹芝発の橘丸を、接岸できない場合がある条件付きで運航すると案内した", "url": "https://x.com/Go_Hachijo_JP/status/2087816859353858164"}, {"fact": "伊豆諸島開発は1日朝、くろしお丸の八丈島（八重根漁港）9時30分発・青ヶ島13時30分発を運航とした", "url": "https://x.com/izu_shibaura/status/2083299571044897083"}, {"fact": "伊豆諸島開発は1日夜、台風13号による海上不良が見込まれるため、2日は運休日、3〜5日は全便欠航、6日は運休日とすると知らせた", "url": "https://x.com/izu_shibaura/status/2083493651930652786"}, {"fact": "伊豆諸島開発は6日の青ヶ島航路を運休日とした", "url": "https://x.com/izu_shibaura/status/2085034381136293941"}, {"fact": "伊豆諸島開発は7日、台風13号の影響で青ヶ島航路を欠航とした", "url": "https://x.com/izu_shibaura/status/2085472976661782667"}, {"fact": "伊豆諸島開発は8日、八丈島—青ヶ島を欠航とした", "url": "https://x.com/izu_shibaura/status/2085838968386736147"}, {"fact": "伊豆諸島開発は9日朝、八重根漁港発で運航を検討するとしたあと、海上不良で欠航とした", "url": "https://x.com/izu_shibaura/status/2086239582191014232"}, {"fact": "伊豆諸島開発は10日のくろしお丸を運休日とした", "url": "https://x.com/izu_shibaura/status/2086562873644560607"}, {"fact": "伊豆諸島開発は11日、青ヶ島航路を欠航とした", "url": "https://x.com/izu_shibaura/status/2086926656737030252"}, {"fact": "伊豆諸島開発は12日朝、八丈島—青ヶ島を運休日とした", "url": "https://x.com/izu_shibaura/status/2087289276728045858"}, {"fact": "伊豆諸島開発は12日9時すぎ、13日に八丈島9時30分発・青ヶ島12時50分発で臨時運航すると知らせた", "url": "https://x.com/izu_shibaura/status/2087331732592947596"}], "sources": [{"label": "伊豆諸島開発", "url": "https://x.com/izu_shibaura/status/2087651891572555814"}, {"label": "伊豆諸島開発 13日のくろしお丸", "url": "https://x.com/i/status/2087766550938022179"}, {"label": "伊豆諸島開発 臨時運航の予定", "url": "https://x.com/izu_shibaura/status/2087332945862525136"}, {"label": "伊豆諸島開発 臨時運航", "url": "https://x.com/izu_shibaura/status/2087331732592947596"}, {"label": "伊豆諸島開発 12日の運航状況", "url": "https://x.com/izu_shibaura/status/2087289276728045858"}, {"label": "伊豆諸島開発 11日の運航状況", "url": "https://x.com/izu_shibaura/status/2086926656737030252"}, {"label": "伊豆諸島開発 10日の運航状況", "url": "https://x.com/izu_shibaura/status/2086562873644560607"}, {"label": "伊豆諸島開発 9日の運航状況", "url": "https://x.com/izu_shibaura/status/2086239582191014232"}], "label": "くらし", "audience": "両方", "thread_id": "t20260802-7", "followup": true, "id": "0ddef6", "photo": {"type": "img", "src": "/img/kiji/0ddef6.jpg?v=d72c73", "og": "/img/kiji/0ddef6-og.jpg?v=d72c73", "s": "/img/kiji/0ddef6-s.jpg?v=d72c73", "m": "/img/kiji/0ddef6-m.jpg?v=d72c73", "caption": "底土港", "credit": "", "file": "ac/34536255.jpg"}}, {"headline": "八丈高女子バレー、合宿6日間に", "body": ["都立八丈高校の女子バレーボール部は13日、台風の影響で延ばしていた内地での夏季合宿の最終日を迎えた。8日から4日間の予定だった合宿は、延泊2日を加えて6日間になった。同校によると、最終日は大田区の都立六郷工科高校で男子バレー部と練習試合をした。部員は飛行機に乗る直前まで練習した。", "島の部活が内地へ遠征すると、日程は船と飛行機の便に左右される。同校によると、同部は2025年度の新人戦を台風の影響で棄権した。今回は帰島を延ばした2日間も内地の高校と練習試合を組み、合宿を続けた。最終日は六郷工科高校が練習場所を提供した。", "同校によると、合宿は8日、町田総合高校との練習試合で始まった。9日と10日は町田市バレーボール協会が主催する武相大会に出た。2日目は各コートの5位のチームによるリーグ戦に回り、2位だった。11日は町田高校と練習試合をし、台風15号の影響で13日まで延泊すると案内した。延泊1日目の12日は松が谷高校と練習試合をし、8セットを戦った。", "八丈島観光協会によると、合宿の間に東海汽船株式会社の橘丸は2晩続けて欠航した。10日夜竹芝発（11日朝八丈島着）の便と、11日夜竹芝発（12日朝着）の便である。11日夜の便は、台風15号による海上不良が欠航の理由だった。12日夜竹芝発（13日朝着）の便は条件付きで運航し、13日9時15分に底土港に入る予定と案内された。", "空の便は、全日本空輸（ANA）の羽田—八丈島線が11日、終日条件付きで運航した。12日は2便と3便に、強風で羽田に引き返す可能性があると案内が出たが、1便から3便まで八丈島に着いた。合宿最終日の13日は終日通常運航で、1便から3便まで着いた。"], "added": [{"fact": "都立六郷工科高校は東京都大田区東六郷にある", "url": "https://www.kyoiku.metro.tokyo.lg.jp/school/designated_and_promotional_school/reformation/priority_support/rokugo"}, {"fact": "女子バレー部は台風の影響で新人戦を棄権した（2026年2月10日の同校の投稿）", "url": "https://x.com/tokyo8jouhs/status/2021174635060924765"}, {"fact": "合宿は8月8日から11日までの4日間の予定で、8日に町田総合高校と練習試合をした。9日と10日は町田市バレーボール協会主催の武相大会に出た", "url": "https://x.com/tokyo8jouhs/status/2086077957249053079"}, {"fact": "武相大会の2日目は、各コートの5位のチームによるリーグ戦で2位だった", "url": "https://x.com/tokyo8jouhs/status/2086822543256846402"}, {"fact": "合宿4日目の11日は町田高校と練習試合をした。台風15号の影響で、合宿を13日まで延泊すると同校が案内した", "url": "https://x.com/tokyo8jouhs/status/2087171860081578309"}, {"fact": "延泊1日目（合宿5日目）の12日は松が谷高校と練習試合をし、8セットを戦った。台風の影響で帰島できなかった", "url": "https://x.com/tokyo8jouhs/status/2087516378031128612"}, {"fact": "11日、ANAは終日条件付きで運航した。10日夜竹芝発（11日朝着）の橘丸は欠航した", "url": "https://x.com/Go_Hachijo_JP/status/2086954292343435478"}, {"fact": "11日朝、定期船は欠航した。1便は八丈島に着いた", "url": "https://x.com/Go_Hachijo_JP/status/2086959883224818128"}, {"fact": "11日夜竹芝発の橘丸は、台風15号の影響による海上不良で欠航した", "url": "https://x.com/Go_Hachijo_JP/status/2087081147335672252"}, {"fact": "12日朝、定期船は欠航した。1便は八丈島に着いた", "url": "https://x.com/Go_Hachijo_JP/status/2087325746926965093"}, {"fact": "12日の2便に、強風で羽田に引き返す可能性があると案内が出た", "url": "https://x.com/Go_Hachijo_JP/status/2087390043384209457"}, {"fact": "12日の2便は八丈島に着いた", "url": "https://x.com/Go_Hachijo_JP/status/2087401743114293711"}, {"fact": "12日の3便に、強風で羽田に引き返す可能性があると案内が出た", "url": "https://x.com/Go_Hachijo_JP/status/2087435917317611914"}, {"fact": "12日の3便は八丈島に着いた", "url": "https://x.com/Go_Hachijo_JP/status/2087453303013880200"}, {"fact": "12日夜竹芝発の橘丸は、接岸できない場合がある条件付きで運航した", "url": "https://x.com/Go_Hachijo_JP/status/2087453492663513363"}, {"fact": "13日、ANAは終日通常運航だった。橘丸は9時15分に底土港に入る予定と案内された", "url": "https://x.com/Go_Hachijo_JP/status/2087678106266108262"}, {"fact": "13日、ANAの1便が八丈島に着いた", "url": "https://x.com/Go_Hachijo_JP/status/2087684582787383521"}, {"fact": "13日、ANAの2便が八丈島に着いた", "url": "https://x.com/Go_Hachijo_JP/status/2087756124242293036"}, {"fact": "13日、ANAの3便が八丈島に着いた", "url": "https://x.com/Go_Hachijo_JP/status/2087808977468051871"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2087827407118204987"}, {"label": "都立八丈高校", "url": "https://x.com/tokyo8jouhs/status/2087516378031128612"}, {"label": "八丈島観光協会", "url": "https://x.com/Go_Hachijo_JP/status/2086954292343435478"}], "label": "教育", "audience": "島民", "thread_id": "t20260811-44", "followup": true, "id": "b17017", "photo": {"type": "img", "src": "/img/kiji/b17017.jpg?v=3ebb69", "og": "/img/kiji/b17017-og.jpg?v=3ebb69", "s": "/img/kiji/b17017-s.jpg?v=3ebb69", "m": "/img/kiji/b17017-m.jpg?v=3ebb69", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-1.jpg"}}, {"headline": "大川導水管断水、井戸で補う答弁", "body": ["八丈町議会の山下巧議員は、2025年3月17日の一般質問で、大川水源から浄水場へ水を引く古い管が壊れたときの断水対策を問うた。町の公営企業管理者は、根田原浄水場の井戸と護神山配水池からのバイパス管で送水すると答えた。管の改修は、2026年度以降に東京都へ計画を出す準備を進めているとした。", "水源から浄水場へ水を送る管を導水管という。大川の導水管を通った水は大川浄水場で浄水される。根田原浄水場の水と合わせて第1・第3・片瀬ヶ首の各配水池へ送られ、家々に配られる。この導水管は、答弁から7か月後の2025年10月、台風22号と23号で被災した。", "町議会が今年3月に公開した会議録によると、山下議員は、地震や土砂崩れで管が壊れたとき、交換工事の間の断水にどう備えるのかを問うた。管理者は、大川水源の導水管は古く、壊れるおそれが高いと認めた。そのうえで、大川配水池系が断水したときの備えとして、三根の根田原浄水場の井戸とバイパス管を挙げた。", "国土交通省によると、台風のあとの10月14日時点で、大川浄水場（1日1800立方メートル）は水源から水を取れなくなった。根田原浄水場は停電の復旧で動き、三根地域は一部が断水した。町全体では当初約4100戸が断水した。", "町の岡野豊広企業課長は、八丈町議会だより（2026年5月25日号）の取材に答えている。倒木などで導水管が4か所で壊れた。三根地域は、崩れた山道の上に導水管を敷いて復旧した。岡野課長は、元に戻るには数年かかると話している。", "大川の導水管は、以前にも議会で取り上げられている。2024年3月18日の一般質問では、淺沼隆章議員が大川浄水場の導水管の改修を問うた。管理者は、水源から浄水場までの導水管が老朽化しており、改修が必要なことは承知していると答えた。改修計画を出すとした2026年度には、すでに入っている。"], "added": [{"fact": "管理者の答弁は「大川水源の導水管は古く破損する可能性が高いと認識」「大川配水池系への断水対策」としてのバックアップで、配水池の表記は「護神山配水池」", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094053/r070525.pdf"}, {"fact": "大川浄水場の水は根田原浄水場から大川配水池へ送る水と合わせ、第1配水池、第3配水池、片瀬ヶ首配水池へ送水される（2024年1月の議会島内視察報告）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094927/r060525.pdf"}, {"fact": "2025年10月14日時点で大川浄水場（1800立方メートル/日）は水源から取水できず、根田原浄水場（770立方メートル/日）は停電復旧で稼働、三根地域は一部断水。八丈町では当初約4100戸が断水", "url": "https://www.mlit.go.jp/common/001964901.pdf"}, {"fact": "岡野豊広企業課長によると、導水管は倒木などで4か所が被害を受け、三根地域は崩れた山道の上に導水管を敷いて復旧。元に戻るには数年かかる", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/05170246/r080525.pdf"}, {"fact": "2024年3月18日の一般質問で淺沼隆章議員が大川浄水場の導水管改修を問い、管理者は水源から浄水場までの導水管の老朽化について改修の必要性を承知していると答えた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094927/r060525.pdf"}, {"fact": "根田原の井戸は三根にある（八丈町の地下水採取の規制地域）", "url": "/Users/cc/codex/shinbun/data/reiki/text/g162RG00000331.txt"}], "sources": [{"label": "八丈町議会の会議録", "url":   const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}

      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}

  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
