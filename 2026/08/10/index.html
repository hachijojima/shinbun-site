<script type="application/json" id="edition">{"date": "2026-08-10", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T07:35:03+09:00", "prev": "/2026/08/09/", "next": "/2026/08/11/", "alerts": [], "weather": {"issued": "2026-08-10T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "", "main": "", "hachijo": "", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 29}]}, "koyomi": {"sunrise": "5:00", "sunset": "18:33", "moon": 26.3, "tide": {"place": "八丈島(神湊)", "high": [["1:40", 135], ["16:56", 141]], "low": [["9:14", 25], ["22:00", 110]]}}, "unko": null, "sora": {"status": "条件付きの可能性", "reason": "強風", "url": "https://x.com/ANA_flight_info/status/2086370648960483542", "at": "2026-08-09T17:35:00+09:00"}, "number": null, "top": {"headline": "あしたば加工工場、来夏の復活へ", "body": ["台風22号で工場が全壊した有限会社あしたば加工工場は9日、自治体などの支援を受けて営業を続けていると明かした。工場が全壊したのは2025年10月9日の台風22号。元に戻るにはまだ時間がかかるとし、来年の同じ日に「復活しました」と言えるよう取り組むとした。", "ABEMA TIMESは2025年11月、社長の山田幸也さんを取材して伝えた。それによると、工場の修繕には2億円近くかかる見込みで、建物が古く保険には入れなかった。被害を免れたのは明日葉の乾燥機だけだった。同工場によると、全壊した建屋はいまも被災当時のまま残っている。7月10日に解体の現地調査があった。建屋が大きく、建てられた時代からアスベストが使われている可能性がある。解体は来年に始まり、半年ほどかかる見込みという。", "同工場は2025年12月の時点で、仮の工場を設けて今年3月に加工を再開することを目指していた。2月には今年の加工を見送ると決め、完全復旧の目標を来年3月に置いた。仮の拠点として春に開いたのが、三根の復興サテライト「結ノ葉」だ。リードアズーロホテルとして使われていた建物のレストラン部分に、事務所と加工所の機能をまとめた。加工品を売り、観光バスの客を迎えている。", "同工場は例年、3月から6月に島の農家から明日葉を受け、乾燥などの加工をしてきた。7月11日の報告では、解体が来年3月の収穫期に間に合わないとした。収穫した明日葉の乾燥を島外の工場に頼むか、島内の空き物件に工場の機能を備えるかを選ばなければならない。明日葉を出してきた農家への影響は示されていない。", "支援の面では、同工場が募ったクラウドファンディングに272人が応じ、目標500万円に対して6,047,000円が集まった。2025年12月の報告では、都の支援で新しい拠点を整えられるのは2〜数年後になる見込みとしていた。どの公的制度を使っているかは示されていない。八丈町は、台風22号・23号で被害を受けた事業者向けの「八丈町産業・観光再建支援金」の申請期限を9月30日まで延ばしている。", "同工場は約40年、明日葉の加工を続けてきた。山田さんは2024年度の東京都優秀技能者（東京マイスター）知事賞を受けている。都は功績に、明日葉のセリ科特有の臭みを和らげ、ふわふわの食感に仕上げた特許製品の開発を挙げた。長く保管できる加工で、明日葉を一年中食べられるようにしたことも挙げている。"], "added": [{"fact": "台風22号が八丈島を襲ったのは2025年10月9日", "url": "https://chikouken.org/report/report_cat05/17947/"}, {"fact": "工場の修繕に2億円近くかかる見込みで、建物の老朽化で保険に入れなかった。被災を免れたのは乾燥機だけだった（ABEMA TIMES、2025年11月21日）", "url": "https://times.abema.tv/articles/-/10210181"}, {"fact": "社長は山田幸也さん。40年続けてきた加工", "url": "https://times.abema.tv/articles/-/10210181"}, {"fact": "7月10日に解体の現地調査。アスベスト使用の可能性があり、解体開始は来年、期間は半年の見込み。来年3月の収穫期に間に合わず、島外の工場での乾燥か島内の空き物件に工場の機能を備えるかを選ぶ必要がある（7月11日の活動報告）", "url": "https://for-good.net/project/1002849/activity/detail/15971"}, {"fact": "2月26日に今年の加工の見送りと、完全復旧の目標を2027年3月とすることを報告。仮の拠点「結ノ葉」はリードアズーロホテルとして使われていた建物のレストラン部分で、事務所と加工所の機能を集約", "url": "https://for-good.net/project/1002849/activity/detail/12639?t=1772060524"}, {"fact": "2025年12月25日の時点で3月の再稼働を目指し仮工場を探していた。都の支援で新拠点を整えられるのは2〜数年後の見込み。例年3月ごろから農家から明日葉の供給を受けて加工する", "url": "https://for-good.net/project/1002849/activity/detail/11302"}, {"fact": "結ノ葉は三根にあり、加工品の販売と観光バス客の案内の場", "url": "https://x.com/ashitabaya8jo/status/2041393262968312121"}, {"fact": "例年3月から6月に加工（乾燥が中心）、7月以降は宣伝や通販", "url": "https://ritokei.com/article/hottopics/36582"}, {"fact": "クラウドファンディングは目標500万円に対し6,047,000円、支援者272人で終了", "url": "https://for-good.net/project/1002849"}, {"fact": "町は八丈町産業・観光再建支援金の申請期間を9月30日まで延長", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260723-01/"}, {"fact": "山田幸也さんは令和6年度東京都優秀技能者（東京マイスター）知事賞を受賞。功績は明日葉の臭みを和らげたふわふわ食感の特許製品の開発と長期保存の加工", "url": "https://www.meister-award.metro.tokyo.lg.jp/shiryo/R06jusyousha.pdf"}], "sources": [{"label": "あしたば加工工場", "url": "https://x.com/ashitabaya8jo/status/2086176809323020577"}, {"label": "ABEMA TIMES", "url": "https://times.abema.tv/articles/-/10210181"}, {"label": "離島経済新聞", "url": "https://ritokei.com/article/hottopics/36582"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260723-01/"}, {"label": "東京都 令和6年度東京マイスター受賞者一覧", "url": "https://www.meister-award.metro.tokyo.lg.jp/shiryo/R06jusyousha.pdf"}, {"label": "大正大学地域構想研究所", "url": "https://chikouken.org/report/report_cat05/17947/"}], "label": "産業", "audience": "島民", "thread_id": "t20260810-39", "id": "1cf9e0", "photo": {"type": "img", "src": "/img/kiji/1cf9e0.jpg?v=df135e", "og": "/img/kiji/1cf9e0-og.jpg?v=df135e", "s": "/img/kiji/1cf9e0-s.jpg?v=df135e", "m": "/img/kiji/1cf9e0-m.jpg?v=df135e", "caption": "明日葉の若葉", "credit": "", "file": "ac/1980839.jpg"}}, "side": [], "shorts": [{"headline": "青ヶ島への船、2日から出ず", "body": ["八丈島と青ヶ島を結ぶ伊豆諸島開発株式会社のくろしお丸は、7日から9日まで3日続けて欠航した。3〜5日の台風13号による欠航と、2日と6日の運休日を合わせると、2日から9日までの8日間、青ヶ島への船は出ていない。最後に八重根漁港を出たのは1日だった。", "同社は1日夜、台風13号で海上不良が見込まれるとして、3〜5日を全便欠航にすると案内した。2日と6日は運休日で、この時点の案内では欠航は5日までだった。同社によると、くろしお丸は6日、東京の辰巳埠頭に停泊していた。7日朝、同社は台風13号の影響で青ヶ島航路を欠航とした。8日も欠航とした。", "9日は、出港の直前に運航が取りやめになった。同社は6時28分、八重根漁港9時30分発と青ヶ島12時50分発の便を案内し、欠航とはしていなかった。八丈島観光協会も8時7分、くろしお丸は9時30分に出港する予定と案内した。同社はその後の8時54分、海上不良のため欠航になったと知らせた。", "八丈島と東京を結ぶ船は、7日から9日まで毎日着いた。東海汽船の便は、6日夜竹芝発から8日夜竹芝発まで3便続けて底土港に入った。気象庁の八丈島の観測で、8日の降水量は0.5ミリ、9日は0ミリだった。", "同社によると、八丈島—青ヶ島航路は81キロで、所要は約3時間。ニッポン旅マガジンによると、くろしお丸は旅客と貨物を運ぶ493トンの船である。島と島をつなぐ足は、ほかに東邦航空のヘリコプター「東京愛らんどシャトル」があり、座席は9席。青ヶ島への貨物や来島者への影響と、10日以降の運航予定は、9日までに同社から示されていない。"], "added": [{"fact": "くろしお丸が最後に運航したのは8月1日（八重根漁港発、伊豆諸島開発が運航と案内）", "url": "https://x.com/izu_shibaura/status/2083299571044897083"}, {"fact": "伊豆諸島開発は1日19時ごろ、台風13号による海上不良の見込みで2日運休日、3〜5日全便欠航、6日運休日と案内した", "url": "https://x.com/izu_shibaura/status/2083493651930652786"}, {"fact": "くろしお丸は6日、東京の辰巳埠頭に停泊していた（同社）", "url": "https://x.com/izu_shibaura/status/2085034381136293941"}, {"fact": "八丈島—青ヶ島航路は81キロ、所要約3時間（伊豆諸島開発の航路ページ）", "url": "https://www.izu-syotou.jp/route01/index.html"}, {"fact": "くろしお丸は493トンの貨客船（ニッポン旅マガジンの記述。総トン数かどうかの明記はない）", "url": "https://tabi-mag.jp/kuroshiomaru/"}, {"fact": "東京愛らんどシャトルは東邦航空が運航する9人乗りのヘリコプターで、八丈島と青ヶ島を結ぶ", "url": "https://trafficnews.jp/post/81695"}], "sources": [{"label": "伊豆諸島開発", "url": "https://x.com/izu_shibaura/status/2086239582191014232"}, {"label": "伊豆諸島開発 8月1日の運航案内", "url": "https://x.com/izu_shibaura/status/2083299571044897083"}, {"label": "伊豆諸島開発 3〜5日欠航の案内", "url": "https://x.com/izu_shibaura/status/2083493651930652786"}, {"label": "伊豆諸島開発 6日の停泊の案内", "url": "https://x.com/izu_shibaura/status/2085034381136293941"}, {"label": "八丈島観光協会 8月9日の交通機関", "url": "https://x.com/Go_Hachijo_JP/status/2086227840039821639"}], "label": "くらし", "audience": "両方", "thread_id": "t20260802-7", "followup": true, "id": "398ce7", "photo": {"type": "img", "src": "/img/kiji/398ce7.jpg?v=41ee76", "og": "/img/kiji/398ce7-og.jpg?v=41ee76", "s": "/img/kiji/398ce7-s.jpg?v=41ee76", "m": "/img/kiji/398ce7-m.jpg?v=41ee76", "caption": "八丈島の底土港に停泊しているあおがしま丸", "credit": "", "file": "ac/29388528.jpg"}}, {"headline": "夏まつり引換券は19日まで", "body": ["八丈町商工会は、第54回八丈島夏まつりで出した商品引換券の使用期限を19日までとしている。券は、7月18、19日に大賀郷の町役場庁舎特設会場で開いた抽選会の景品だ。商工会はホームページに載せた期限の告知を、7日に改めて知らせた。", "抽選の仕組みは、八丈島観光協会が次のように案内した。夏まつり大売出しの加盟店で買い物をすると抽選券がもらえる。それを5枚集めると、会場で1回抽選できる。景品は商品券、ごみ袋、駄菓子だった。商工会は7月10日に大売出しの案内を出し、町によると同じ日までに抽選券の配布が始まっていた。抽選の受付は、初日が20時30分まで、2日目が20時までだった。", "商工会は2023年の第51回と2025年の第53回でも、景品の商品券は大売出しの加盟店で使えると案内した。期限はどちらも8月20日だった。前回は1,000円の買い物ごとに抽選券が1枚配られ、まつりは7月19、20日に開いた。", "引換券を使える加盟店の一覧と問い合わせは、八丈町商工会（04996-2-2121）へ。"], "added": [{"fact": "第54回夏まつりは7月18、19日に八丈町役場庁舎特設会場で開かれた", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260525/"}, {"fact": "抽選券は大売出し加盟店で買い物をすると配られ、5枚で1回抽選。景品は商品券・ごみ袋・駄菓子", "url": "https://www.hachijo.gr.jp/blogs/summer_festival_2026/"}, {"fact": "商工会は7月10日に夏まつり大売出しの案内を出した。町の公式アカウントは同日、抽選券の配布が始まっていると伝えた", "url": "https://x.com/hachisho8"}, {"fact": "抽選会場の受付は7月18日が20時30分まで、19日が20時まで（防災八丈）", "url": "https://x.com/HachijoTown/status/2078316326784000310"}, {"fact": "2023年の第51回は、景品の商品券の使用期限が8月20日で、大売出しの加盟店で使えた", "url": "https://x.com/hachisho8/status/1684740924361052160"}, {"fact": "2025年の第53回は7月19、20日に開催。抽選券は1,000円ごとに1枚配られ、商品引換券は加盟店で使えて期限は8月20日", "url": "https://www.hachijo.gr.jp/blogs/summer_festival_2025/"}, {"fact": "2025年も商工会は利用締切を8月20日と知らせた", "url": "https://x.com/hachisho8/status/1956314329101541692"}, {"fact": "商工会の電話は04996-2-2121", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260525/"}], "sources": [{"label": "八丈町商工会", "url": "https://x.com/hachisho8/status/2085510976636588316"}, {"label": "八丈町 お知らせ", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260525/"}, {"label": "八丈島観光協会 夏まつり2026", "url": "https://www.hachijo.gr.jp/blogs/summer_festival_2026/"}, {"label": "八丈島観光協会 夏まつり2025", "url": "https://www.hachijo.gr.jp/blogs/summer_festival_2025/"}, {"label": "八丈町商工会（X）2023年", "url": "https://x.com/hachisho8/status/1684740924361052160"}, {"label": "八丈町商工会（X）2025年", "url": "https://x.com/hachisho8/status/1956314329101541692"}, {"label": "防災八丈", "url": "https://x.com/HachijoTown/status/2078316326784000310"}], "label": "産業", "audience": "島民", "thread_id": "t20260810-40", "id": "4c27b6", "photo": {"type": "img", "src": "/img/kiji/4c27b6.jpg?v=ab3fc3", "og": "/img/kiji/4c27b6-og.jpg?v=ab3fc3", "s": "/img/kiji/4c27b6-s.jpg?v=ab3fc3", "m": "/img/kiji/4c27b6-m.jpg?v=ab3fc3", "caption": "八丈町商工会", "credit": "", "file": "own/shokokai-1.jpg"}}, {"headline": "八丈高、都立高校EXPOに出展", "body": ["東京都立八丈高等学校は9日、千代田区の東京国際フォーラムで開かれた「都立高校EXPO」に出展した。生徒と一緒に、八丈島で過ごす高校3年間を都内の中学生と保護者に伝えた。都教育委員会と島しょの町村が進める島外生徒受入事業では、2026年度入学で八丈高校の募集はなかった。", "EXPOは都教委が主催し、8日と9日の2日間、各日10時から17時まで開かれた。都教委は4月、都立高校175校が参加すると発表した。対象は中学生と保護者で、事前予約制。都教委は、各校が概要説明や個別相談、在校生との交流で学校ごとの魅力を伝えると案内していた。八丈高校によると、同校のブースは「東京には、もう一つの高校生活があります。」を題に掲げた。", "都教委によると、島しょの都立高校に島外から入る道はいくつかある。島外生徒受入事業では、町村が学力検査の前に独自に行う「島外生徒受入選考」に合格すると、その島の都立高校に応募できる。事業は都教委が2016年度から島しょの町村と進めてきた。事業のほかに、入学日までに保護者の1人以上と島へ転居する方法と、身元引受人になれる島在住の6親等以内の親族と同居する方法がある。受け入れの形は島で異なり、大島高校は町営の「星海寮」、神津高校は村営の「しらすな寮」で生徒が暮らす。", "都教委がまとめた実績では、八丈町の選考は2020年度、募集2人に応募がなかった。2021年度は募集2人に7人が応募して2人が合格した。2022年度は募集1人に応募2人、合格1人。2023年度は選考を行わず、2024年度は2人程度の募集に5人が応募して2人が合格した。2025年10月の都教委の発表では、2026年度入学の選考は大島町（6人程度）と神津島村（4人程度）だけだった。新島高校と八丈高校は募集がなかった。神津島村には2024年度、4人程度の募集に21人が応募している。", "同校は2026年度の学校経営計画（4月1日、町谷光博校長）で、学校広報を経営の第一の課題に置いた。都や町と連携し、ホームステイの受け入れ先の確保や寮の建設などを検討して応募倍率を上げるとしている。園芸科と家政科は応募倍率を10%上げる目標を掲げた。5月16日には港区の島嶼会館で第1回島留学生フォーラムを開いた。会場には保護者2人が来たが、中学生の参加はなかった。島留学生2人と家族で移住した生徒3人が学校からオンラインで加わり、町企画財政課の職員2人も参加した。"], "added": [{"fact": "都立高校EXPOは都教委主催で8月8日・9日、東京国際フォーラムで各日10時〜17時、175校が参加予定、中学生と保護者対象、事前予約制。概要説明や個別相談、在校生交流で学校ごとの魅力を発信すると案内", "url": "https://www.kyoiku.metro.tokyo.lg.jp/ja/information/press/2026/04/2026043003"}, {"fact": "ブースのテーマ「東京には、もう一つの高校生活があります。」", "url": "https://x.com/tokyo8jouhs/status/2086254577226293598"}, {"fact": "島外生徒受入事業:町村が学力検査に先立ち独自に行う島外生徒受入選考に合格すると応募資格が得られる。事業以外に、入学日までに保護者1人以上と島しょへ転居、島しょ在住の身元引受人となり得る6親等以内の親族と同居する方法がある", "url": "https://www.kyoiku.metro.tokyo.lg.jp/school/high_school/islet"}, {"fact": "八丈町の選考実績:2020年度 募集2・応募0・合格0、2021年度 2・7・2、2022年度 1・2・1", "url": "https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/02_236"}, {"fact": "2023年度は八丈町の選考なし、2024年度 募集2名程度・応募5・合格2。神津島村2024年度 4名程度・応募21・合格5", "url": "https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/2025-05-22-193651-961"}, {"fact": "2025年10月の都教委発表:2026年度入学の選考は大島町6名程度（星海寮）・神津島村4名程度（しらすな寮）。新島高と八丈高は募集なし", "url": "https://www.kyoiku.metro.tokyo.lg.jp/information/press/2025/10/2025100202"}, {"fact": "2026年度学校経営計画（4月1日、校長 町谷光博）:学校広報を経営の第一課題とし、ホームステイ受け入れ先の確保、寮建設などを検討して応募者倍率を向上。園芸科・家政科の応募者倍率10%向上が目標", "url": "https://www.metro.ed.jp/hachijo-h/assets/経営計画（08八丈高校全）_.pdf"}, {"fact": "5月16日の第1回島留学生フォーラム（島嶼会館）:保護者2人、中学生0人。島留学生2人と家族移住生徒3人が八丈高校からオンラインで参加、町企画財政課職員2人が参加", "url": "https://www.metro.ed.jp/hachijo-h/assets/R8 第1回島留学生フォーラム報告書.pdf"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2086254577226293598"}, {"label": "東京都教育委員会 都立高校EXPO", "url": "https://www.kyoiku.metro.tokyo.lg.jp/ja/information/press/2026/04/2026043003"}, {"label": "東京都教育委員会 島しょの都立高校への進学", "url": "https://www.kyoiku.metro.tokyo.lg.jp/school/high_school/islet"}, {"label": "東京都教育委員会 島外生徒受入選考の実績", "url": "https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/02_236"}, {"label": "東京都教育委員会 2026年度島外生徒受入選考", "url": "https://www.kyoiku.metro.tokyo.lg.jp/information/press/2025/10/2025100202"}, {"label": "八丈高校 2026年度学校経営計画", "url": "https://www.metro.ed.jp/hachijo-h/assets/経営計画（08八丈高校全）_.pdf"}, {"label": "八丈高校 第1回島留学生フォーラム報告書", "url": "https://www.metro.ed.jp/hachijo-h/assets/R8 第1回島留学生フォーラム報告書.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20260810-41", "id": "cc799e", "photo": {"type": "img", "src": "/img/kiji/cc799e.jpg?v=c040ac", "og": "/img/kiji/cc799e-og.jpg?v=c040ac", "s": "/img/kiji/cc799e-s.jpg?v=c040ac", "m": "/img/kiji/cc799e-m.jpg?v=c040ac", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-3.jpg"}}, {"headline": "ペルセウス座流星群 新月の夜に", "body": ["ペルセウス座流星群が12日夜から14日未明にかけて見ごろになる。国立天文台によると、極大は13日11時ごろの予想で、13日は新月にあたる。月明かりの影響はほとんどない。空の暗い場所では、13日の夜明け前に1時間あたり35個ほどが見込まれる。", "同台によると、多く見えるのは12日夜から13日未明と、13日夜から14日未明の2夜だ。どちらも21時ごろから流れ始め、夜半を過ぎて明け方に近づくほど増える。最も多くなるのは13日の夜明けごろで、東京では3時台にあたる。14日の夜明けごろも1時間あたり30個ほどの予想だ。極大の13日11時ごろは日本では昼のため見えない。", "同台の暦要項では、新月は13日2時37分。流星が最も多くなる時間帯と重なる。2025年は極大が8月13日5時ごろで、明るい月が出ていた。同台は当時、見える数が例年より少なめになると予想した。空の暗い場所で、13日の夜明けごろに1時間あたり30個ほどと発表した。科学技術振興機構のサイエンスポータルによると、この流星群が次に最もよい条件になるのは2029年だ。", "流星はペルセウス座付近の放射点から四方へ流れる。母天体はスイフト・タットル彗星である。同台は、流星は空全体に現れるため広い範囲を見渡すことと、暗さに目を慣らすため15分以上見続けることを挙げる。街明かりの中では見える数が数分の1に減り、放射点が高いほど数は増える。予想からずれた時間に一時的に増えることもある。1時間あたりの数は空の暗い場所での見込みで、実際の見え方は場所や天気、見る人によって変わる。"], "added": [{"fact": "国立天文台の予想で極大は8月13日11時ごろ。日本では昼で見えない", "url": "https://www.nao.ac.jp/astro/sky/2026/08-topics03.html"}, {"fact": "見ごろは12日夜〜13日未明と13日夜〜14日未明。21時ごろから出始め、明け方に近づくほど増える", "url": "https://www.nao.ac.jp/astro/sky/2026/08-topics03.html"}, {"fact": "最も多いのは13日夜明けごろ（東京で3時台）。空の暗い場所で1時間に約35個、14日夜明けごろも同様に約30個", "url": "https://www.nao.ac.jp/astro/sky/2026/08-topics03.html"}, {"fact": "観察のしかたと注意点（広く見渡す、15分以上目を慣らす、街明かりで数分の1に減る、放射点が高いほど多い、予想外の時間に増えることがある）", "url": "https://www.nao.ac.jp/astro/sky/2026/08-topics03.html"}, {"fact": "新月（朔）は8月13日2時37分", "url": "https://eco.mtk.nao.ac.jp/koyomi/yoko/2026/rekiyou263.html"}, {"fact": "2025年は極大が8月13日5時ごろで、明るい月のため例年より少なめと予想され、空の暗い場所で13日の夜明けごろ（東京で3時台）1時間あたり約30個と発表されていた", "url": "https://www.nao.ac.jp/astro/sky/2025/08-topics04.html"}, {"fact": "次に最もよい条件になるのは2029年。母天体はスイフト・タットル彗星。見え方は場所や天気、観察者によって変わる", "url": "https://scienceportal.jst.go.jp/newsflash/20260807_n01/"}], "sources": [{"label": "リードパークリゾート八丈島", "url": "https://x.com/lidohotels8jo/status/2086045758592254148"}, {"label": "国立天文台 ほしぞら情報 ペルセウス座流星群が極大", "url": "https://www.nao.ac.jp/astro/sky/2026/08-topics03.html"}, {"label": "国立天文台 暦要項 2026年 朔弦望", "url": "https://eco.mtk.nao.ac.jp/koyomi/yoko/2026/rekiyou263.html"}, {"label": "国立天文台 ほしぞら情報 ペルセウス座流星群", "url": "https://www.nao.ac.jp/astro/sky/2025/08-topics04.html"}, {"label": "科学技術振興機構 サイエンスポータル", "url": "https://scienceportal.jst.go.jp/newsflash/20260807_n01/"}], "label": "文化", "audience": "両方", "thread_id": "t20260810-42", "id": "976c51", "photo": {"type": "img", "src": "/img/kiji/976c51.jpg?v=36873c", "og": "/img/kiji/976c51-og.jpg?v=36873c", "s": "/img/kiji/976c51-s.jpg?v=36873c", "m": "/img/kiji/976c51-m.jpg?v=36873c", "caption": "八丈島の天の川", "credit": "", "file": "ac/26922211.jpg"}}], "agenda": [{"date": "2026-08-13", "end": "2026-08-15", "text": "各地区の盆踊り(日程は地区ごと)", "url": "https://www.hachijo.gr.jp/blogs/bon-odori_2026/"}, {"date": "2026-08-17", "end": "2026-08-21", "text": "全国離島交流中学生野球大会(島選抜)", "url": "https://x.com/hachijomachi/status/2085558854709108889"}], "letters": [], "corrections": [], "column": null, "kyoku": {"artist": "Moondog", "title": "Bird's Lament", "text": "短い管楽器の節が何度も戻り、その下で打楽器が軽く揺れます。街角で演奏を続けたムーンドッグが、サックス奏者チャーリー・パーカーを悼んで書いた曲。追悼と聞くとゆっくりした悲歌を想像しますが、ここでは拍子が生き生きと跳ねています。いなくなった人を思い出すとき、その人が好きだった速さまで消してしまう必要はない。音楽家らしい別れの挨拶です。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/be/7a/d4/be7ad435-c42f-e8de-8caa-d55817a04a1b/881626546369_cover.jpg/300x300bb.jpg", "album": "Sax Pax For A Sax", "url": "https://music.apple.com/us/album/birds-lament/1470686409?i=1470686508&uo=4"}}, "ronten": null, "weekly": [], "ichimen_week": [{"date": "2026-08-09", "url": "/2026/08/09/182816/", "headlines": ["花の会の介護人手調査 秋に公表"]}, {"date": "2026-08-08", "url": "/2026/08/08/966f26/", "headlines": ["花火大会ステージに八丈太鼓"]}, {"date": "2026-08-07", "url": "/20 <script>
 
const SAMPLE = {

  top:{ headline:"定期船、きょうは条件付き運航", sode:"波高く、寄港地変更の可能性",

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
