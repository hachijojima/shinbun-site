<script type="application/json" id="edition">{"date": "2026-08-20", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T09:18:49+09:00", "prev": "/2026/08/19/", "next": "/2026/09/01/", "alerts": [], "weather": {"issued": "2026-08-20T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "", "main": "", "hachijo": "", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 23, "max": 31}]}, "koyomi": {"sunrise": "5:07", "sunset": "18:23", "moon": 6.8, "tide": {"place": "八丈島(神湊)", "high": [["11:00", 112], ["20:48", 135]], "low": [["3:48", 63], ["14:44", 104]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "八丈病院の耳鼻科、きょうあす", "body": ["町立八丈病院は20日と21日の2日間、耳鼻咽喉科の臨時診療を開く。受付は8時から11時まで。八丈町が19日に防災八丈で案内した。飛行機の欠航などで医師が島に来られない日は休診になる。", "同病院がいつも開いている診療科は、内科・外科・小児科・産婦人科の4つだ。耳鼻咽喉科は臨時の診療科で、同病院によると月に2回、それぞれ2日間開く。予約は要らず、その日に受け付ける。皮膚科と眼科は予約係を通して申し込むが、耳鼻咽喉科は窓口に行けばよい。", "町の防災八丈の案内では、今年は1月から4月までと6月に、月2回ずつ開いた。1月は5日と6日、19日と20日だった。7月は23日と24日の1回だった。今月は6日と7日に続いて2回目になる。昨年の8月は、7日と8日、19日と20日の2回開いた。", "日本医科大学耳鼻咽喉科学教室の医師らは2000年、同病院の耳鼻咽喉科外来の患者を調べた結果を「耳鼻と臨床」に載せた。患者は10歳未満が最も多く、月別では6月が多かった。病気は滲出性中耳炎、慢性副鼻腔炎、耳垢が多かった。ほかの病院に紹介した患者の80%は手術のためだった。", "同病院で初めて受診する人は、受付窓口の横にある新患申込書に書き込み、1番窓口に出す。問い合わせは町立八丈病院(04996-2-1188)へ。"], "added": [{"fact": "同病院がいつも開いている診療科は内科・外科・小児科・産婦人科。耳鼻咽喉科は臨時診療科で月2回・各2日間、予約なしで当日に受け付ける。皮膚科・眼科は予約係を通して申し込む。初めての人は新患申込書を1番窓口に出す。電話は04996-2-1188", "url": "https://hachijohospital.jp/reception/"}, {"fact": "2026年の耳鼻咽喉科の臨時診療は1月5〜6日、1月19〜20日、2月2〜3日、2月19〜20日、3月2〜3日、3月16〜17日、4月2〜3日、4月13〜14日、6月8〜9日、6月25〜26日、7月23〜24日、8月6〜7日に開かれた。2025年8月は7〜8日と19〜20日に開かれた(防災八丈の案内)", "url": "https://x.com/HachijoTown"}, {"fact": "日本医科大学耳鼻咽喉科学教室の渡邊健一氏らは2000年、「耳鼻と臨床」46巻5号に同病院耳鼻咽喉科外来の調査を載せた。患者は10歳未満が最も多く、月別では6月が多かった。病気は滲出性中耳炎・慢性副鼻腔炎・耳垢が多く、他院に紹介した患者の80%は手術のためだった", "url": "https://www.jstage.jst.go.jp/article/jibi1954/46/5/46_399/_article/-char/ja/"}], "figure": {"type": "period", "start": "2026-08-20", "end": "2026-08-21", "label": "耳鼻咽喉科の臨時診療(受付8時〜11時)"}, "sources": [{"label": "八丈町", "url": "https://x.com/HachijoTown/status/2089993272005435637"}, {"label": "町立八丈病院", "url": "https://hachijohospital.jp/reception/"}, {"label": "耳鼻と臨床", "url": "https://doi.org/10.11334/jibi1954.46.5_399"}], "label": "くらし", "audience": "島民", "thread_id": "t20260820-74", "id": "074890", "photo": {"type": "img", "src": "/img/kiji/074890.jpg?v=fc54c5", "og": "/img/kiji/074890-og.jpg?v=fc54c5", "s": "/img/kiji/074890-s.jpg?v=fc54c5", "m": "/img/kiji/074890-m.jpg?v=fc54c5", "caption": "町立八丈病院", "credit": "", "file": "own/byoin-1.jpg"}}, "side": [], "shorts": [{"headline": "空の日催しに白バイ演技走行", "body": ["八丈島空港空の日実行委員会は9月20日、八丈島空港で「空の日」の催しを開く。航空機の展示や化学消防車の放水アーチなど例年の企画に加え、前年の概要になかった白バイの演技走行を予定に入れた。実行委員会に加わる八丈島空港ターミナルビル株式会社が19日、概要を公表した。", "ふだんは入れない駐機場に入り、機体や車両を間近で見られる催しで、年に1度開かれる。同社によると、時間は9時30分から16時で、駐機場は10時から15時まで開ける。自衛隊と警視庁の航空機を展示し、昼の2便(羽田発1893便)が着くときに化学消防車が放水アーチで迎える。ANAはキッズマーシャリング体験やアナウンス体験を開き、機内食を売る。空港ビルでは北海道物産展を開き、キッチンカーの出店やフラダンスもある。", "八丈町は、町のキャラクター「ロベレニくん」をあしらったトートバッグを数量限定で配る。町は7月にバッグの色について投票を呼びかけた。どの色になったかは当日まで明かさない。", "タイムスケジュールと事前申し込みの方法は、同社がホームページとXで追って知らせる。前年の同社の案内では、事前申し込みが要ったのはキッズマーシャリングだった。手信号で飛行機を誘導する仕事の体験で、2025年は小学生を対象に定員10人とし、9月8日から12日にメールで受け付けた。希望が多ければ抽選とした。2024年は小学5年生から中学3年生を対象にした航空教室も事前受け付けだった。", "催しは天気に左右されてきた。2022年9月24日は悪天候で中止した。2023年9月30日に2019年以来4年ぶりに開き、779人が来場した。2024年9月22日は強風で昼の2便が欠航し、キッズマーシャリングを取りやめ、放水アーチを放水訓練の実演に替えた。", "問い合わせは八丈島空港空の日実行委員会事務局(八丈島空港管理事務所、04996-2-0163)。"], "added": [{"fact": "開催時間は9時30分から16時、駐機場開放は10時から15時。主催は八丈島空港空の日実行委員会。内容に自衛隊・警視庁の航空機展示、白バイ演技走行、ANAの機内食販売・アナウンス体験・キッズマーシャリング体験、1893便到着時の化学消防車による歓迎放水アーチ、北海道物産展、キッチンカー、フラダンス", "url": "https://hachijoapo.net/archives/3989"}, {"fact": "2025年の概要は航空機展示、車両展示(化学消防車、パトカー等)、ANA企画、FDAブース、放水アーチ、滑走路ウォーキング、フラダンス、福島県物産展で、白バイの演技走行はなかった", "url": "https://hachijoapo.net/archives/3204"}, {"fact": "2025年のANAキッズマーシャリング体験は小学生対象、定員10人、9月8日から12日にメールで申し込み、多ければ抽選", "url": "https://hachijoapo.net/archives/3239"}, {"fact": "問い合わせ先は八丈島空港空の日実行委員会事務局 04996-2-0163(八丈島空港管理事務所)", "url": "https://hachijoapo.net/archives/3805"}, {"fact": "2024年は9月22日に開き、実行委員会は八丈島空港ターミナルビルなどで構成", "url": "https://www.aviationwire.jp/archives/308001/print/"}, {"fact": "2024年に小学5年生から中学3年生対象の航空教室を事前受け付け。当日は強風で1893/1894便が欠航し、キッズマーシャリングを中止、放水アーチを放水訓練の実演に変更", "url": "https://x.com/HAT_info_8jo"}, {"fact": "2022年9月24日の空の日イベントは悪天候のため中止", "url": "https://x.com/HAT_info_8jo/status/1573445370369126401"}, {"fact": "2023年9月30日に令和元年度以来4年ぶりに開き779人が来場", "url": "https://x.com/HAT_info_8jo"}, {"fact": "町は7月17日にトートバッグの色の投票を呼びかけ、7月23日に色は当日のお楽しみとした", "url": "https://x.com/hachijomachi"}], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2089949371656007900"}, {"label": "八丈島空港ターミナルビル", "url": "https://x.com/HAT_info_8jo/status/2089902731339378815"}, {"label": "Aviation Wire", "url": "https://www.aviationwire.jp/archives/308001/print/"}], "label": "文化", "audience": "両方", "thread_id": "t20260820-75", "id": "97bbce", "photo": {"type": "img", "src": "/img/kiji/97bbce.jpg?v=084996", "og": "/img/kiji/97bbce-og.jpg?v=084996", "s": "/img/kiji/97bbce-s.jpg?v=084996", "m": "/img/kiji/97bbce-m.jpg?v=084996", "caption": "八丈島空港展望デッキ(Hachijojima Airport Observation Deck, Tokyo)", "credit": "", "file": "ac/4920725.jpg"}}, {"headline": "島民大学講座、22日から三根で", "body": ["第90回八丈島民大学講座が22日と23日、三根の三根公民館ホールで開かれる。八丈島文化協会と東京都立大学が共催し、同大学の大橋隆哉学長が宇宙について、西島壮准教授が運動と脳について話す。申し込みは要らず、参加は無料である。", "町は19日、大人も子どもも学べる講座だと案内した。会場へは当日そのまま入れる。オンラインで受けるには事前の連絡が要り、町はその締め切りが近いと呼びかけている。", "1日目は22日19時30分から21時まで。天文学が専門の大橋学長が「ダークでブラックな宇宙」と題して話す。2日目は23日10時から11時30分まで。西島准教授は「最新の脳科学が明かすスポーツのすすめ〜学力向上から認知症予防まで〜」と題して話す。西島准教授は同大学大学院人間健康科学研究科に所属する。運動や体を動かさない状態が脳の働きに与える影響を研究している。", "講座は八丈島文化協会が島外の大学の教員などを講師に招いて開く生涯学習の場で、1980年に始まった。年2回開いており、都立大と共催する回はインターネットで配信し、島の外からも受けられるようにしている。今回は八丈町教育委員会が後援する。", "問い合わせは八丈島民大学講座事務局(電話090-8036-1826)。"], "added": [{"fact": "催しは第90回八丈島民大学講座で、8月22日19時30分〜21時と23日10時〜11時30分に三根公民館ホールで開く。主催は八丈島文化協会と東京都立大学、後援は八丈町教育委員会。参加費は無料", "url": "http://8-daigakukoza.sakura.ne.jp/"}, {"fact": "1日目は大橋隆哉学長(天文学)の「ダークでブラックな宇宙」、2日目は西島壮さん(大学院人間健康科学研究科、スポーツ神経科学)の「最新の脳科学が明かすスポーツのすすめ〜学力向上から認知症予防まで〜」", "url": "http://8-daigakukoza.sakura.ne.jp/"}, {"fact": "講座の問い合わせ先は八丈島民大学講座事務局(電話090-8036-1826)", "url": "http://8-daigakukoza.sakura.ne.jp/"}, {"fact": "西島壮さんは東京都立大学人間健康科学研究科の准教授で、運動や身体不活動が脳機能に与える影響を研究している", "url": "https://www.tmu.ac.jp/stafflist/data/na/681.html"}, {"fact": "講座は島外の大学教授などを講師に招く生涯学習の場で、都立大との共催講座はオンラインで配信し、伊豆諸島や全国から受講できるようにしている", "url": "https://8jobunka.jimdofree.com/%E4%B8%BB%E5%82%AC%E4%BA%8B%E6%A5%AD/%E5%85%AB%E4%B8%88%E5%B3%B6%E6%B0%91%E5%A4%A7%E5%AD%A6%E8%AC%9B%E5%BA%A7/"}, {"fact": "第1回は1980年8月に開かれ、講座は年2回開く", "url": "https://8-daigakukoza.sakura.ne.jp/ayumi.html"}], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2089869171186377141"}, {"label": "八丈島民大学講座", "url": "http://8-daigakukoza.sakura.ne.jp/"}, {"label": "八丈島文化協会", "url": "https://8jobunka.jimdofree.com/%E4%B8%BB%E5%82%AC%E4%BA%8B%E6%A5%AD/%E5%85%AB%E4%B8%88%E5%B3%B6%E6%B0%91%E5%A4%A7%E5%AD%A6%E8%AC%9B%E5%BA%A7/"}, {"label": "東京都立大学", "url": "https://www.tmu.ac.jp/stafflist/data/na/681.html"}], "label": "教育", "audience": "島民", "thread_id": "t20260820-76", "id": "bb052b", "photo": {"type": "img", "src": "/img/kiji/bb052b.jpg?v=21d23f", "og": "/img/kiji/bb052b-og.jpg?v=21d23f", "s": "/img/kiji/bb052b-s.jpg?v=21d23f", "m": "/img/kiji/bb052b-m.jpg?v=21d23f", "caption": "八丈町三根出張所・三根公民館", "credit": "", "file": "own/mitsune-shucchojo-2.jpg"}}, {"headline": "八丈高定時制、星と月を観測", "body": ["都立八丈高等学校定時制の天文部が19日夜、夏の天体観測教室の初日を開いた。同校によると、雲がかかる場面はあったが、参加者と夏の星座や月を観測できた。教室は27日、28日まで、あわせて5日間開く。", "昨年の夏の教室は、前半の2回で星空を観測できなかった。2025年8月7日は曇りで、天文部員や教員の講義と、天体観測室の見学に切り替えた。8日も曇りで講義だけになり、参加者は天体ドームで望遠鏡をのぞいた。冬の教室も12月14日は強風で観測できなかった。12月21日の回は天候が悪くなる見込みで中止し、振り替えなかった。", "今年の残りの回は、きょう20日と21日、27日、28日に開く。同校は7月31日付で学校サイトに案内を載せ、申し込みをインターネットで受け付けている。", "定時制天文部の夏の教室は、2023年は8月7日、8日、28日、29日の4日間だった。広報はちじょう2024年8月号によると、2024年も4日間で、時間は19時から21時、小学3年生以上を勧めた。2025年も4日間で、前半2日を月、後半2日を星の観測に充てた。今年は1日増えて5日間になった。", "問い合わせは同校定時制(04996-2-1181)へ。"], "added": [{"fact": "2026年夏の教室は8月19日〜21日、27日、28日の5日間で、申し込みはURLから", "url": "https://x.com/tokyo8jouhs/status/2082979556265541851"}, {"fact": "同校は7月31日付で学校サイトに「天体観測教室(夏)のお知らせ」を載せた", "url": "https://www.metro.ed.jp/hachijo-he/news/2026/07/newsentry_135.html"}, {"fact": "2025年夏の第1回(8月7日)は曇天で星空を観測できず、講義と天体観測室の見学を行った", "url": "https://www.metro.ed.jp/hachijo-he/news/2025/08/newsentry_59.html"}, {"fact": "2025年夏の第2回(8月8日)も曇天で講義のみとなり、天体ドームで望遠鏡をのぞくなどした", "url": "https://x.com/tokyo8jouhs/status/1953782428478452107"}, {"fact": "2025年夏は8月7日・8日が月、8月21日・22日が星の観測の4日間", "url": "https://x.com/tokyo8jouhs/status/1950753282873344266"}, {"fact": "2025年冬の教室は12月14日が強風で観測できず講義と見学", "url": "https://x.com/tokyo8jouhs/status/2000165307969925243"}, {"fact": "2025年12月21日の冬の教室は天候悪化の見込みで中止し、振替なし", "url": "https://x.com/tokyo8jouhs/status/2002626076946935989"}, {"fact": "2023年夏の教室は8月7日・8日・28日・29日の4日間", "url": "https://x.com/tokyo8jouhs/status/1685808651922178048"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2090055887918710841"}, {"label": "広報はちじょう2024年8月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23121923/hachijo2408.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20260803-14", "followup": true, "id": "f17456", "photo": {"type": "img", "src": "/img/kiji/f17456.jpg?v=24b011", "og": "/img/kiji/f17456-og.jpg?v=24b011", "s": "/img/kiji/f17456-s.jpg?v=24b011", "m": "/img/kiji/f17456-m.jpg?v=24b011", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-4.jpg"}}, {"headline": "島唐辛子、生の実が旬に", "body": ["八丈島で島唐辛子の収穫が盛りを迎え、生の実が島内の店に並んでいる。島内の事業者のカネワ水産によると、17日も朝から実を手で摘んだ。摘んだ実は島内の各スーパーと土産店に納めている。", "雑誌BRUTUSは2014年7月発売の号で、八丈島の習慣を紹介した。島ではわさびが手に入りにくかったため、刺身に青唐辛子を添えるという。島唐辛子の実は小さく、上を向いてつき、土によって辛さや香りが変わるとも書いた。", "麻雀プロの松岡千晶さんのサイト「麻雀プロの八丈島物語」によると、島では昔、半分に切った実を醤油の中でつぶし、刺身をつけて食べた。収穫は7月から11月ごろまで続く。", "カネワ水産によると、いまの実は硬く、香りがあり、辛さが鋭い。同社は食べ方として、刻   あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
 
 
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const MEDAL={"🥇":1,"🥈":2,"🥉":3};
const rankMark = m => MEDAL[m]?`<i class="r${MEDAL[m]}" aria-label="${MEDAL[m]}位">${MEDAL[m]}</i>`:`<i class="r0" aria-hidden="true"></i>`;
 
function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section class="ran" id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h"><a href="/government/members/">町議会議員</a></h2>
    <ol class="giin ichi">${g.map(r=>{const nm=`${rankMark(r.medal)}<b>${esc(r.name)}</b>`;
      return `<li>${r.slug?`<a class="n" href="/government/members/${esc(r.slug)}/">${nm}</a>`:`<span class="n">${nm}</span>`}${r.at?`<a class="ps" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.name+" "+(r.kind?r.kind+" ":"")+(r.what||""))}"><time>${esc(r.when)}</time><q>${r.hs||""}</q></a>`:""}</li>`;}).join("")}</ol><p class="more"><a href="/government/assembly/">議員・議会</a><a href="/government/members/">全員の一覧</a></p></section>`;
}
 
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
 
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u), sora=soraRow(e.sora), ev=evLines(e).slice(0,8);
  const diff=n=>n==null?"":`<small>(${n>0?"+":n<0?"−":"±"}${Math.abs(n).toLocaleString()})</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const st=e.sora&&e.sora.at?ymd(e.sora.at.slice(0,10)):null, sh=e.sora&&e.sora.at?hm(e.sora.at):"";
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
 
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section class="ran" id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h"><a href="/song/">きょうの一曲</a></h2>
    <div class="kk">${a?`<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.img)}" alt="${esc(a.album||k.title)}のジャケット" width="96" height="96" loading="lazy"></a>`:""}
      <div><h3>${k.day?`<a class="hl" href="${esc(k.day)}song/">${esc(k.title)}</a>`:esc(k.title)}</h3><p class="who">${esc(k.artist)}</p></div></div>

}
 
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){

}

  <div class="ichimen" id="ichimen">

      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>

    </section>`:""}
    </div>
