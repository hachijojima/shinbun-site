<script type="application/json" id="edition">{"date": "2026-08-12", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T22:47:26+09:00", "prev": "/2026/08/11/", "next": "/2026/08/13/", "alerts": [], "weather": {"issued": "2026-08-12T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "くもり", "main": "くもり", "hachijo": "くもり", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 22, "max": 30}]}, "koyomi": {"sunrise": "5:01", "sunset": "18:31", "moon": 28.3, "tide": {"place": "八丈島(神湊)", "high": [["3:54", 149], ["17:57", 148]], "low": [["10:51", 13], ["23:16", 89]]}}, "unko": null, "sora": {"status": "条件付きの可能性", "reason": "強風", "url": "https://x.com/ANA_flight_info/status/2087096682706329963", "at": "2026-08-11T17:40:00+09:00"}, "number": null, "top": {"headline": "納涼花火、雨で開始を20時30分に", "body": ["八丈町は11日、第25回八丈島納涼花火大会を底土港周辺で開いた。雨のため、花火の打ち上げ開始を当初の20時11分から20時30分に変えると案内した。町によると、会場には前夜祭より多くの人が集まった。", "町によると、夕方の会場は風が出て、雨が降ったりやんだりしていた。気象庁の八丈島の観測では、11日の降水量は13.5ミリだった。1時間ごとの値では、18時から19時に3.5ミリ、22時から23時に9.0ミリが降った。最高気温は28.1度、最低気温は21.8度だった。", "会場のイベントは16時に始まり、町は18時から21時30分まで会場周辺で交通規制を敷いた。八丈島文化協会は、11日のステージに八丈太鼓はるみ会、檜之扇会、八丈太鼓月曜会、Heat up、コウ リマ ナニ エが出ると伝えていた。このうち、はるみ会、檜之扇会、月曜会は協会の加盟団体である。町によると、会場では太鼓の演奏があり、出店も並んだ。打ち上げの結果、打ち上げ数、来場者数、無料送迎バスの利用者数は、町から示されていない。", "大会の日は島の足も乱れた。東海汽船株式会社の橘丸は、台風15号の影響で10日夜竹芝発（11日朝八丈島着）の便が欠航した。11日夜竹芝発（12日朝着）の便も欠航が決まった。5日から11日までの7日間で、東京からの船は就航4日、欠航3日だった。ANAの羽田—八丈島線は11日、終日条件付きで運航し、1便は遅れて着いた。", "町は2022年の大会を3年ぶりの開催と案内した。2023年の第22回は、前夜祭を10日に開いたが、11日の打ち上げを16日に延期した。2025年の第24回について、町は広報はちじょう8月号で、悪天候のときは12日に順延すると案内した。今年、町は11日夜に、順延ではなく打ち上げ時刻の変更を案内した。"], "added": [{"fact": "気象庁八丈島の11日の1時間降水量は18〜19時に3.5ミリ、22〜23時に9.0ミリ", "url": "https://www.data.jma.go.jp/stats/etrn/view/hourly_s1.php?prec_no=44&block_no=47678&year=2026&month=8&day=11&view="}, {"fact": "気象庁八丈島の11日の日降水量13.5ミリ、最高28.1度、最低21.8度", "url": "https://www.data.jma.go.jp/stats/etrn/view/daily_s1.php?prec_no=44&block_no=47678&year=2026&month=8&day=&view="}, {"fact": "八丈島文化協会は、11日のステージに八丈太鼓はるみ会、檜之扇会、八丈太鼓月曜会、Heat up、コウ リマ ナニ エが出ると伝えた", "url": "https://x.com/8jobunka/status/2086633225590649047"}, {"fact": "10日22時30分竹芝発の橘丸は台風15号による現地海上不良で欠航", "url": "https://x.com/i/web/status/2086728517509870034"}, {"fact": "11日22時30分竹芝発の橘丸も台風15号の影響による海上不良で欠航", "url": "https://x.com/i/web/status/2087081147335672252"}, {"fact": "11日のANA羽田—八丈島線は終日条件付き運航で、1便（1891便）は遅れて到着", "url": "https://x.com/i/web/status/2086959883224818128"}, {"fact": "2023年は、前夜祭を10日に開き、11日の打ち上げを16日に延期した（防災八丈）", "url": "https://x.com/HachijoTown/status/1689837793277820929"}, {"fact": "町は2022年の大会を3年ぶりの開催と案内した", "url": "https://x.com/hachijomachi/status/1543870837018984448"}], "figure": {"type": "place", "name": "底土港"}, "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2087137922948677683"}, {"label": "八丈島文化協会 ステージ出演", "url": "https://x.com/8jobunka/status/2086633225590649047"}, {"label": "気象庁 八丈島 2026年8月 日ごとの値", "url": "https://www.data.jma.go.jp/stats/etrn/view/daily_s1.php?prec_no=44&block_no=47678&year=2026&month=8&day=&view="}, {"label": "気象庁 八丈島 2026年8月11日 1時間ごとの値", "url": "https://www.data.jma.go.jp/stats/etrn/view/hourly_s1.php?prec_no=44&block_no=47678&year=2026&month=8&day=11&view="}, {"label": "東海汽船 10日竹芝発欠航", "url": "https://x.com/i/web/status/2086728517509870034"}, {"label": "東海汽船 11日竹芝発欠航", "url": "https://x.com/i/web/status/2087081147335672252"}], "label": "文化", "audience": "両方", "thread_id": "t20260805-21", "followup": true, "id": "5e00a7", "photo": {"type": "img", "src": "/img/kiji/5e00a7.jpg?v=36b1ff", "og": "/img/kiji/5e00a7-og.jpg?v=36b1ff", "s": "/img/kiji/5e00a7-s.jpg?v=36b1ff", "m": "/img/kiji/5e00a7-m.jpg?v=36b1ff", "caption": "底土港の夜景", "credit": "", "file": "ac/26540704.jpg"}}, "side": [], "shorts": [{"headline": "八丈高女子バレー、13日まで延泊", "body": ["都立八丈高校の女子バレーボール部は、8日から11日までとしていた内地での合宿を、13日まで延泊して続ける。台風15号の影響によるもので、同校が11日夜に案内した。東京から八丈島への船は2晩続けて欠航している。", "八丈島観光協会によると、東海汽船の橘丸は、10日夜竹芝発（11日朝着）の便が欠航した。11日夜竹芝発（12日朝着）の便も、台風15号の影響による海上不良で欠航となった。5日〜11日の7日間では、東京からの船は就航5日、欠航2日だった。", "空の便では、全日本空輸（ANA）の羽田—八丈島線が11日、終日条件付きで運航した。条件付き運航は、天候によって引き返したり欠航したりすることがあるという前提で飛ぶ運航である。同協会によると、この日は1便（ANA1891便）が八丈島に着いた。八丈島と青ヶ島を結ぶくろしお丸は、11日は欠航した。同部が帰島にどの便を使うか、延泊の費用を誰が持つかは、同校から示されていない。", "同校によると、合宿では初日の8日に町田総合高校と練習試合をした。9日と10日は、町田市バレーボール協会が主催する武相大会に出た。1日目は6チームのリーグ戦で5位、2日目は各コートの5位のチームによるリーグ戦で2位だった。4日目の11日は町田高校と練習試合をした。同部は2025年度の新人戦を、台風の影響で棄権している。"], "added": [{"fact": "合宿初日の8日に町田総合高校と練習試合、9日と10日は町田市バレーボール協会主催の武相大会に出場し、1日目5位、2日目は5位リーグで2位。2025年度の新人戦は台風の影響で棄権", "url": "https://shinbun.hachijojima.jp/2026/08/11/435d64/"}, {"fact": "条件付運航は、天候により引き返しや欠航の可能性がある運航（八丈島観光協会の運航案内で「強風のため東京（羽田）空港に引き返す可能性」と添えて使われる）", "url": "https://x.com/Go_Hachijo_JP"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2087171860081578309"}, {"label": "八丈島観光協会", "url": "https://x.com/Go_Hachijo_JP/status/2087081147335672252"}, {"label": "八丈島新聞 8月11日「八丈高女子バレー 5位リーグ2位」", "url": "https://shinbun.hachijojima.jp/2026/08/11/435d64/"}], "label": "教育", "audience": "島民", "thread_id": "t20260811-44", "followup": true, "id": "07ef10", "photo": {"type": "img", "src": "/img/kiji/07ef10.jpg?v=24b011", "og": "/img/kiji/07ef10-og.jpg?v=24b011", "s": "/img/kiji/07ef10-s.jpg?v=24b011", "m": "/img/kiji/07ef10-m.jpg?v=24b011", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-4.jpg"}}, {"headline": "青ヶ島への船、10日間出ず", "body": ["八丈島と青ヶ島を結ぶ伊豆諸島開発株式会社のくろしお丸は11日、青ヶ島航路を欠航した。前日の10日は運休日で、船は出ていない。2日から11日までの10日間、青ヶ島への船は1便も出ていない。同社によると、最後に運航したのは1日で、八重根漁港を9時30分に出る便だった。", "同社が毎朝出す運航状況と、1日の知らせをもとに10日間を並べる。同社は1日、台風13号の影響で海が荒れる見込みだとして、2日と6日を運休日、3〜5日を全便欠航とすると知らせた。6日は知らせのとおり運休日となった。7日は台風13号の影響で欠航した。8日は欠航で、理由は示されていない。9日は朝に9時30分発の運航を見込むと案内したが、その後、海上不良で欠航とした。10日は運休日、11日は欠航で、11日の理由は示されていない。", "東京と八丈島を結ぶ船も11日は着かなかった。八丈島観光協会によると、東海汽船の10日夜竹芝発（11日朝八丈島着）の便が欠航した。東京からの船が八丈島に着いたのは10日が最後で、5日から11日までの7日間では、着いた日が4日、欠航が3日だった。ANAの羽田—八丈島線について、同協会は11日朝、終日条件付きで運航すると案内した。", "12日以降のくろしお丸の運航予定は、11日までに同社から示されていない。"], "added": [{"fact": "10日のくろしお丸は運休日で、運航していない", "url": "https://x.com/izu_shibaura/status/2086562873644560607"}, {"fact": "1日のくろしお丸は八丈島9時30分発・青ヶ島13時30分発、八重根漁港発で運航と案内", "url": "https://x.com/izu_shibaura/status/2083299571044897083"}, {"fact": "同社は1日19時ごろ、台風13号の影響による海上不良が見込まれるとして、8月2日を運休日、3〜5日を全便欠航、6日を運休日と知らせた", "url": "https://x.com/izu_shibaura/status/2083493651930652786"}, {"fact": "6日のくろしお丸は青ヶ島航路運休日", "url": "https://x.com/izu_shibaura/status/2085034381136293941"}, {"fact": "7日のくろしお丸は台風13号の影響で欠航", "url": "https://x.com/izu_shibaura/status/2085472976661782667"}, {"fact": "8日のくろしお丸は八丈島—青ヶ島が欠航（理由の記載なし）", "url": "https://x.com/izu_shibaura/status/2085838968386736147"}, {"fact": "9日朝、八重根漁港9時30分発の運航見込みを案内", "url": "https://x.com/izu_shibaura/status/2086203013367251089"}, {"fact": "9日はその後、海上不良のため欠航とした", "url": "https://x.com/izu_shibaura/status/2086239582191014232"}, {"fact": "11日朝、八丈島観光協会は東海汽船の10日東京発の八丈島着は欠航、ANA便は終日条件付運航、くろしお丸は欠航と案内", "url": "https://x.com/Go_Hachijo_JP/status/2086954292343435478"}], "sources": [{"label": "伊豆諸島開発", "url": "https://x.com/izu_shibaura/status/2086926656737030252"}, {"label": "伊豆諸島開発 8月10日の運航状況", "url": "https://x.com/izu_shibaura/status/2086562873644560607"}, {"label": "伊豆諸島開発 8月1日の運航状況", "url": "https://x.com/izu_shibaura/status/2083299571044897083"}, {"label": "伊豆諸島開発 台風13号に伴う運航", "url": "https://x.com/izu_shibaura/status/2083493651930652786"}, {"label": "伊豆諸島開発 8月6日の運航状況", "url": "https://x.com/izu_shibaura/status/2085034381136293941"}, {"label": "伊豆諸島開発 8月7日の運航状況", "url": "https://x.com/izu_shibaura/status/2085472976661782667"}, {"label": "伊豆諸島開発 8月8日の運航状況", "url": "https://x.com/izu_shibaura/status/2085838968386736147"}, {"label": "伊豆諸島開発 8月9日の運航状況", "url": "https://x.com/izu_shibaura/status/2086203013367251089"}], "label": "くらし", "audience": "両方", "thread_id": "t20260802-7", "followup": true, "id": "c844cb", "photo": {"type": "img", "src": "/img/kiji/c844cb.jpg?v=0bcfec", "og": "/img/kiji/c844cb-og.jpg?v=0bcfec", "s": "/img/kiji/c844cb-s.jpg?v=0bcfec", "m": "/img/kiji/c844cb-m.jpg?v=0bcfec", "caption": "八丈島の漁港", "credit": "", "file": "ac/28416566.jpg"}}, {"headline": "植物公園3番トイレ洋式に", "body": ["八丈ビジターセンターは10日、八丈植物公園（大賀郷）の3番トイレで17日から21日まで洋式化工事があると案内した。東エントランス近くのトイレで、和式便器を洋式に替える。工事中は園内のトイレが一部使えないことがあるという。", "同センターの2022年12月の案内では、園内のトイレは同センター館内を含めて6カ所ある。1番はメインエントランス、2番は同センターからキョン舎へ向かう途中にある。3番は東エントランス近く、4番はキョン舎近く、5番は遊具広場のトイレだ。工事は17日の月曜から21日の金曜まで続く。工事中に使えない時間帯や、園内に残る和式便器の数は示されていない。", "園内では2025年秋からトイレの工事が続いている。2025年10月上旬に2番トイレを改修する工事があり、2025年11月1日からはメインエントランスのトイレで洋式化工事があった。今年は1月26日から同センター館内の和式便器を洋式に替える工事があり、27日に終わった。その間、3番トイレは工事中で使えなかった。", "2025年10月の台風22号では水道が止まり、園内のトイレはすべて使えなくなった。10月15日に同センター館内とメインエントランス、遊具広場のトイレが使えるようになった。台風22号で閉鎖していた公園は、今年1月21日に一部を除いて開放された。", "3番トイレは2016年12月7日から2017年3月17日まで、4番トイレとともに改修工事で使えなかった。2015年11月から2016年3月にはメインエントランスと2番のトイレも改修している。"], "added": [{"fact": "2022年12月の同センターの案内で、園内のトイレは6つ（1番・4番・5番・ビジターセンターにバリアフリートイレ）", "url": "https://x.com/8jo_vc/status/1607281753802313730"}, {"fact": "1番トイレはメインエントランス（正面入口）のトイレ。2016年3月22日に改修工事が終わった", "url": "https://x.com/8jo_vc/status/712087345227411456"}, {"fact": "2番トイレは同センターからキョン舎へ向かう途中にあり、2025年10月1日から8日に改修工事を案内", "url": "https://x.com/8jo_vc/status/1971385245179199537"}, {"fact": "2025年11月1日からメインエントランストイレで洋式化工事", "url": "https://x.com/8jo_vc/status/1984094224510554445"}, {"fact": "2026年1月26日から28日の予定で同センター館内の和式便器洋式化工事があり、その間3番トイレは工事中で使用不可", "url": "https://x.com/8jo_vc/status/2014513060489396525"}, {"fact": "館内のトイレ工事は1月27日に終了", "url": "https://x.com/8jo_vc/status/2016320463904100785"}, {"fact": "台風22号で水道が止まり、園内のトイレがすべて使用不可に", "url": "https://x.com/8jo_vc/status/1976449078126051797"}, {"fact": "2025年10月15日、同センター館内とメインエントランス・遊具広場のトイレが使えるようになった", "url": "https://x.com/8jo_vc/status/1978265726805798972"}, {"fact": "台風22号で閉鎖していた公園は2026年1月21日に一部を除き開放", "url": "https://x.com/8jo_vc/status/2013755921940287635"}, {"fact": "2016年12月7日から2017年3月17日まで3番（東エントランス近く）・4番（キョン舎近く）トイレの改修工事", "url": "https://x.com/8jo_vc/status/806307569010511872"}, {"fact": "2015年11月から2016年3月にメインエントランスと2番トイレの改修工事", "url": "https://x.com/8jo_vc/status/667897678257221632"}, {"fact": "遊具広場のトイレは5番トイレ", "url": "https://x.com/8jo_vc/status/433122686319869953"}, {"fact": "八丈植物公園の所在地は大賀郷", "url": "https://www.tokyo-park.or.jp/park/hachijo/index.html"}], "sources": [{"label": "八丈ビジターセンター", "url": "https://x.com/8jo_vc/status/2086710736617980231"}, {"label": "東京都公園協会 八丈植物公園", "url": "https://www.tokyo-park.or.jp/park/hachijo/index.html"}], "label": "町政", "audience": "両方", "thread_id": "t20260812-47", "id": "569460", "photo": {"type": "img", "src": "/img/kiji/569460.jpg?v=9dfbce", "og": "/img/kiji/569460-og.jpg?v=9dfbce", "s": "/img/kiji/569460-s.jpg?v=9dfbce", "m": "/img/kiji/569460-m.jpg?v=9dfbce", "caption": "青空の下の八丈植物公園と八丈富士", "credit": "", "file": "ac/34178683.jpg"}}, {"headline": "LED化は器具ごと交換を 町消防", "body": ["八丈町消防本部は6日、蛍光灯の器具にLEDランプを付けるときの火災への注意を、町のホームページに載せた。器具とランプの組み合わせが合わないと、発煙や火災につながるおそれがあるとしている。消防本部はランプだけを替えるのではなく、照明器具ごと替えるよう勧めている。器具の交換の目安は約10年としている。", "2023年11月の水俣条約の締約国会議で、一般照明用の蛍光ランプは2027年末までに製造と輸出入をやめることが決まった。水俣条約は水銀の使用と排出を減らすための国際条約である。日本照明工業会によると、直管の蛍光灯器具では、ランプだけをLEDに替える例が近年増えている。総務省消防庁は2024年6月10日、同会のリーフレットを添えて、各地の消防本部に注意を呼びかけるよう求めた。町のページにはこの通知とリーフレットのほか、東京消防庁が示したLED電球とLED蛍光灯の焼損の写真も載っている。", "製品評価技術基盤機構（NITE）は2025年3月、蛍光ランプをLEDランプに付け替えたときの事故についてまとめた。2015年から2024年までの10年間に、不適切な付け替えが要因とされる事故が12件あった。うち8件は火災だった。点灯管を外さずにグロー式の器具に付けた例がある。インバーター式の器具に、グロー式の器具向けのランプを付けた例もある。ラピッドスタート式の器具で、安定器を外す工事をしないまま使った例もあった。", "NITEによると、蛍光灯の器具は点灯の仕組みでグロースターター式、ラピッドスタート式、インバーター式の3つに分かれる。点灯管（グローランプ）が付いていればグロー式である。付いていなければ器具の銘板の表示を見る。インバーター式は「半導体式」「電子式」「Hf式」と書かれることもある。LEDランプがどの方式に対応するかは、箱や説明書に書いてある。日本照明工業会は器具を付けてから10年を「適正交換時期」、15年を「耐用の限度」としている。", "町は3月31日にも同じ注意を出した。4月1日の町の放送でも、町消防団の定期巡回の案内とあわせてこの注意を伝えている。島内で同じような事故があったかは、町のページには示されていない。問い合わせは消防本部予防係（04996-2-0119）。"], "added": [{"fact": "町の注意ページには、総務省消防庁予防課の事務連絡（2024年6月10日）と日本照明工業会のリーフレットが添えられている。事務連絡は、2027年末までの一般照明用蛍光ランプの製造・輸出入禁止を受け、各消防本部に注意を呼びかけるよう求めたもの", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/04224851/LED%E3%83%A9%E3%83%B3%E3%83%97%E4%BA%A4%E6%8F%9B%E6%99%82%E3%81%AB%E3%81%8A%E3%81%91%E3%82%8B%E7%81%AB%E7%81%BD%E3%81%AB%E6%B3%A8%E6%84%8F.pdf"}, {"fact": "日本照明工業会によると、直管蛍光灯器具でランプだけをLEDに替える例が近年増えている。同会は器具を付けてから10年を適正交換時期、15年を耐用の限度としている", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/04224851/LED%E3%83%A9%E3%83%B3%E3%83%97%E4%BA%A4%E6%8F%9B%E6%99%82%E3%81%AB%E3%81%8A%E3%81%91%E3%82%8B%E7%81%AB%E7%81%BD%E3%81%AB%E6%B3%A8%E6%84%8F.pdf"}, {"fact": "町のページには、東京消防庁が示したLED電球とLED蛍光灯の火災の写真が載っている。問い合わせ先は消防本部予防係（04996-2-0119）", "url": "https://www.town.hachijo.tokyo.jp/bousai-anzen/shoubo-honbu/shoubo-oshirase/led-caution/"}, {"fact": "NITEは2025年3月27日、2015〜2024年の10年間に不適切なランプ交換による事故が12件（うち火災8件）あったと発表した。グロー式で点灯管を外さなかった例、インバーター式器具にグロー式向けランプを付けた例、ラピッドスタート式で安定器を外す工事をしなかった例がある", "url": "https://www.nite.go.jp/data/000157280.pdf"}, {"fact": "点灯方式は、点灯管があればグロー式。なければ銘板で確かめる（インバーター式は半導体式・電子式・Hf式とも書かれる）。LEDランプの対応方式は箱や説明書に書かれている", "url": "https://www.nite.go.jp/data/000157280.pdf"}, {"fact": "町は2026年3月31日にも同じ注意を出した", "url": "/Users/cc/codex/shinbun/data/x_history.json"}, {"fact": "4月1日18時30分の町の放送で、町消防団の定期巡回の案内とあわせて、LEDランプへの交換時の発煙・火災に注意するよう伝えた", "url": "/Users/cc/codex/shinbun/site/life/town-broadcast/2026/04/index.html"}], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/bousai-anzen/shoubo-honbu/shoubo-oshirase/led-caution/"}, {"label": "町掲載資料", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/04224851/LED%E3%83%A9%E3%83%B3%E3%83%97%E4%BA%A4%E6%8F%9B%E6%99%82%E3%81%AB%E3%81%8A%E3%81%91%E3%82%8B%E7%81%AB%E7%81%BD%E3%81%AB%E6%B3%A8%E6%84%8F.pdf"}, {"label": "製品評価技術基盤機構（NITE）「さらば蛍光灯、ようこそLED」2025年3月27日", "url": "https://www.nite.go.jp/data/000157280.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20260812-48", "id": "9d7a3b", "photo": {"type": "img", "src": "/img/kiji/9d7a3b.jpg?v=ce2cf0", "og": "/img/kiji/9d7a3b-og.jpg?v=ce2cf0", "s": "/img/kiji/9d7a3b-s.jpg?v=ce2cf0", "m": "/img/kiji/9d7a3b-m.jpg?v=ce2cf0", "caption": "八丈町消防 function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}

    </aside>
  </div>

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
  wabunKakko(document.body);
}
