<script type="application/json" id="edition">{"date": "2026-08-17", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T07:20:27+09:00", "prev": "/2026/08/16/", "next": "/2026/08/18/", "alerts": [], "weather": {"issued": "2026-08-17T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ 時々 雨", "main": "晴れ 時々 雨", "hachijo": "晴れ 時々 雨", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 23, "max": 30}]}, "koyomi": {"sunrise": "5:05", "sunset": "18:26", "moon": 3.8, "tide": {"place": "八丈島(神湊)", "high": [["7:46", 135], ["19:42", 145]], "low": [["1:33", 59], ["13:33", 66]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "八丈島選抜、隠岐の島町に到着", "body": ["第17回全国離島交流中学生野球大会に出る八丈島選抜チームが16日に島を出て、その日のうちに会場の島根県隠岐郡隠岐の島町に着いた。八丈町によると、17日は練習と開会式がある。大会は21日まで開かれる。", "大会は全国の離島の中学生が野球で競い、交流する場で、離島甲子園とも呼ばれる。全国離島交流中学生野球大会実行委員会によると、今回は26自治体から22チームが出る予定。東京都から出るのは大島町と八丈町である。", "試合は18日に始まり、この日に1回戦と2回戦を行う。19日は準々決勝と準決勝、それに交流戦がある。20日に決勝と表彰式を開き、その後、まさかりドリームスによる野球教室と、さよならパーティーを開く。21日は各地へ帰る移動日。会場は隠岐の島町運動公園グラウンド、隠岐高校グラウンド、五箇町民運動場、都万町民運動場の4か所である。", "広報はちじょうによると、2008年の第1回は伊豆大島が会場で、島の選抜16人が出て2戦2敗だった。翌年の第2回は今回と同じ隠岐の島町が会場だった。このときも2戦2敗だったが、ほかの島の選手と交流した。", "今年のチームは、出発に先立って壮行会で送り出された。"], "added": [{"fact": "第17回大会には26自治体22チームが参加予定。東京都からは大島町と八丈町", "url": "https://www.chibanippo.co.jp/prwire/1642020"}, {"fact": "日程は8月17日に開会式と監督・審判会議、18日に1回戦と2回戦、19日に準々決勝・準決勝・交流戦、20日に決勝戦・表彰式・まさかりドリームスによる野球教室・さよならパーティー、21日は移動日", "url": "https://www.chibanippo.co.jp/prwire/1642020"}, {"fact": "会場は隠岐の島町運動公園グラウンド、隠岐高校グラウンド、五箇町民運動場、都万町民運動場の4か所", "url": "https://www.chibanippo.co.jp/prwire/1642020"}, {"fact": "主催は国土交通大臣杯 第17回全国離島交流中学生野球大会実行委員会で、大会の通称は離島甲子園", "url": "https://www.chibanippo.co.jp/prwire/1642020"}, {"fact": "八丈島選抜チームの壮行会が行われたと町が8月7日に伝えた（開いた日と場所の記載はない）", "url": "https://x.com/hachijomachi/status/2085558854709108889"}], "figure": {"type": "period", "start": "2026-08-17", "end": "2026-08-21", "label": "第17回全国離島交流中学生野球大会（隠岐の島町）"}, "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2088918241129517198"}, {"label": "千葉日報", "url": "https://www.chibanippo.co.jp/prwire/1642020"}, {"label": "広報はちじょう", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23150126/hachijo0809.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20260808-33", "followup": true, "id": "4fc858", "photo": {"type": "img", "src": "/img/kiji/4fc858.jpg?v=6e83c7", "og": "/img/kiji/4fc858-og.jpg?v=6e83c7", "s": "/img/kiji/4fc858-s.jpg?v=6e83c7", "m": "/img/kiji/4fc858-m.jpg?v=6e83c7", "caption": "富士グラウンド", "credit": "", "file": "own/fuji-ground-4.jpg"}}, "side": [], "shorts": [{"headline": "植物公園温室、プルメリア開花", "body": ["八丈ビジターセンターは15日、八丈植物公園（大賀郷）の温室で見られる花と実の案内を更新した。温室の実は少しずつ落ち、見られる種類が減ってきた。このため今回は花の紹介が中心になった。黄色の花びらに白い縁取りのあるプルメリアが咲いた。", "東京都公園協会によると、温室には100種類を超える植物が植えられている。ハイビスカスやブーゲンビリアなどの花木のほか、パパイヤやマンゴーなどの果樹もある。同センターは毎月1日と15日ごろ、温室で咲いている花と付いている実を順路の順にホームページで紹介している。", "同センターによると、今回紹介した花は通路沿いに咲いている。ハイビスカスは色の違う4種類が咲き、窓際にはオオバナアリアケカズラの黄色い花がある。ウィニティーは紫色の苞から黄色い花が突き出る形をしている。ストレリチア'イエロー'とキャニモモの花は、4日の前回更新の一覧になく、今回加わった。ヘリコニアの3種類やフウリンブッソウゲ、アマゾンリリーも咲いている。前回の一覧にあったブーゲンビリアやヤモメカズラは外れた。", "実の顔ぶれは、夏の初めから入れ替わってきた。7月1日の更新では、レンブやフトモモが多くの実を付けていた。7月15日の一覧にあったレンブは4日に外れ、15日にはマンゴーも外れた。今はジャックフルーツやパイナップル、コーヒーノキなどに実が付いている。バニラ・プランフォリアの実は、色が変わって甘い香りが出るまでまだかかる。", "温室は9時から16時30分まで開いている。園内では17日から21日まで、東エントランス近くの3番トイレで洋式化工事が予定されている。"], "added": [{"fact": "温室には100種類以上の植物があり、ハイビスカス・ブーゲンビリアなどの花木やパパイヤ・マンゴーなどの果樹を植えている。温室は9時から16時30分まで", "url": "https://www.tokyo-park.or.jp/park/hachijo/index.html"}, {"fact": "8月15日の更新では、実が少しずつ落ちて見られる種類が減り、鑑賞しやすい花が増えたとして、花を中心に紹介した。プルメリアが開花し、ハイビスカス4種類、オオバナアリアケカズラ、ウィニティー、ストレリチア'イエロー'、キャニモモなどが咲いている。バニラ・プランフォリアの実は甘い香りがまだしない", "url": "https://www.tokyo-park.or.jp/park/hachijo/news/greenhouse/2026/2026_8_15.html"}, {"fact": "8月4日の更新では、ブーゲンビリア、ヤモメカズラ、スパティフィラムなどが咲き、マンゴーに実が付いていた。ストレリチア'イエロー'とキャニモモの花、プルメリアは一覧になかった", "url": "https://www.tokyo-park.or.jp/park/hachijo/news/greenhouse/2026/2026_8_4.html"}, {"fact": "7月15日の更新では、レンブやマンゴーに実が付いていた", "url": "https://www.tokyo-park.or.jp/park/hachijo/news/greenhouse/2026/2026_7_15.html"}, {"fact": "7月1日の更新では、レンブやフトモモが多くの実を付け、ジャックフルーツの実が大きくなっていた。「温室の様子」は毎月1日と15日ごろに更新されている", "url": "https://x.com/8jo_vc/status/2072249499683311638"}, {"fact": "3番トイレ（東エントランス近く）の洋式化工事は8月17日から21日まで", "url": "https://x.com/8jo_vc/status/2086710736617980231"}], "sources": [{"label": "八丈ビジターセンター", "url": "https://x.com/8jo_vc/status/2088818395672461659"}, {"label": "東京都公園協会", "url": "https://www.tokyo-park.or.jp/park/hachijo/news/greenhouse/2026/2026_8_15.html"}], "label": "文化", "audience": "両方", "thread_id": "t20260817-64", "id": "a9084e", "photo": {"type": "img", "src": "/img/kiji/a9084e.jpg?v=4f1406", "og": "/img/kiji/a9084e-og.jpg?v=4f1406", "s": "/img/kiji/a9084e-s.jpg?v=4f1406", "m": "/img/kiji/a9084e-m.jpg?v=4f1406", "caption": "植物園のブーゲンビリア", "credit": "", "file": "ac/3693237.jpg"}}, {"headline": "伐採木の持ち込み100トン未満に", "body": ["2024年12月3日の八丈町議会で、住民課長が沖山昇議員の一般質問に答え、伐採木の持ち込みが大きく減ったと述べた。中之郷埋立処分場の受け入れ停止後、八形山リサイクルヤードや南原処理場などへの持ち込みは計100トン未満。処分場には年約3,000トンが運び込まれていた。3月25日公開の会議録に載った。", "中之郷の処分場は、庭木や畑の枝を切った島の世帯が自分で運び込める場所だった。2024年1月の時点では、水曜を除く毎日受け付けていた。第四回定例会の答弁で課長は、年3,000トンの半分の1,500トンと比べても急に減っていると述べた。町が2025年9月25日に開いた自治振興委員の集いでは、切った木を家の周りに置いたままにしていて腐り、害虫が出る元になっているとの声が出た。", "受け入れが止まったのは火災のためだ。処分場では2024年2月2日に、伐採木などがたまって出た発酵熱から火が出た。鎮火まで55日かかり、3月27日に消えた。町は処分場への住民の持ち込みをやめ、今は業者がガラス類を運び込むだけになっている。町は、同じような施設を新しく設けることは法律上できないとしている。", "代わりに町は2024年4月1日から持ち込み先を分けた。一般家庭の伐採木のうち、太さ20センチ・長さ120センチまでのものは八形山リサイクルヤードが受ける。太さ50センチ・長さ3メートルまでのものは南原処理場が有料で受ける。町は、敷地や畑での自己処理と、燃やせるごみとして出すことも案内している。", "同じ質問で沖山議員は、旧クリーンセンター跡地に計画している処理施設の進み具合を尋ね、完成までの住民の利便性に気を配るよう求めた。課長は令和10年度の供用開始を目指すと答えた。ただ、3,000トン近い量を処理する大きな施設は考えておらず、利便性は今より下がるとも述べた。施設では伐採木を砕き、土壌改良材にして使う計画だ。", "この計画は、いま一時中断している。町によると、災害対応のためで、災害廃棄物の処理を終えた後の復興計画で方向を考え直す。仮設プラントの跡地や中之郷の処分場跡地の利用も検討に含める。八形山リサイクルヤードは一時、当分の間毎日終日受け付けるとしていたが、8月からは毎週日曜9時〜17時の受け付けになった。受け入れるのは一般家庭の伐採木だけで、落ち葉や草、竹は持ち込めない。"], "added": [{"fact": "中之郷埋立処分場の火災は2024年2月2日に発生した", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23121949/hachijo2404.pdf"}, {"fact": "2024年4月1日から、一般家庭の伐採木は八形山リサイクルヤード（径20cm・長さ120cmまで）、南原処理場（有料、径50cm・長さ300cmまで）で受け入れる運用に変えた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23121949/hachijo2404.pdf"}, {"fact": "火災は発生から55日かかり、3月27日に鎮火した。処分場は住民の利用をやめ、業者がガラス類を運び込むだけの場所になった。旧クリーンセンター跡地に、伐採木を2次破砕して土壌改良剤にする設備を含む施設を計画している", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23121927/hachijo2407.pdf"}, {"fact": "火災は伐採木などの発酵熱が原因", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114351/hachijo2501.pdf"}, {"fact": "2024年1月の時点で、中之郷埋立処分場は水曜を除いて伐採木を受け付けていた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114351/hachijo2501.pdf"}, {"fact": "同じような施設を新しく設けることは法律上できない。処分方法として自己処理や燃やせるごみとしての排出などを案内している", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114417/hachijo2506.pdf"}, {"fact": "2025年9月25日の自治振興委員の集いで、伐採した木を家の周りに置いたままにしていて腐り、害虫の原因になっているとの要望が出た", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114515/hachijo2511.pdf"}, {"fact": "八形山リサイクルヤードは当分の間、毎日終日、伐採木・枯れ葉・枯草を受け入れていた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114506/hachijo2512.pdf"}, {"fact": "令和10年度に稼働させる予定だった旧クリーンセンター跡地のリサイクルセンター計画は、災害対応のため一時中断した。災害廃棄物の処理を終えた後の復興計画で、仮設プラント跡地や中之郷埋立処分場跡地の利用も含めて方向を考え直す", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/05/27201941/hachijo2604.pdf"}, {"fact": "8月からは八形山リサイクルヤードを毎週日曜9時〜17時に開ける。受け入れるのは一般家庭の伐採木だけで、落ち葉・草・竹・廃材は受け入れない", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/31160020/hachijo2607.pdf"}], "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/25162549/20240401.pdf#page=28"}, {"label": "広報はちじょう", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23121949/hachijo2404.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20260817-65", "id": "9349c0", "photo": {"type": "img", "src": "/img/kiji/9349c0.jpg?v=4aa06d", "og": "/img/kiji/9349c0-og.jpg?v=4aa06d", "s": "/img/kiji/9349c0-s.jpg?v=4aa06d", "m": "/img/kiji/9349c0-m.jpg?v=4aa06d", "caption": "木のトンネルの道", "credit": "", "file": "ac/25894995.jpg"}}, {"headline": "介護初任者研修 島内実施の方向", "body": ["2025年9月5日の八丈町議会第三回定例会の一般質問で、奥山幸子議員が介護職員初任者研修を島外ではなく島内で開くよう求めた。町の福祉健康課長は、島内で実施する方向で、受講料の個人負担はないと答えた。3月に公開された会議録で分かった。", "初任者研修は介護の仕事の入り口になる資格で、介護の基本を130時間かけて学ぶ。町の条例では、夜間や定期の巡回で利用者の家を訪ねる訪問介護員を、介護福祉士かこの研修の修了者に限っている。島内の事業所の人手不足は、2023年12月の定例会でも取り上げられた。島で受講できれば、仕事や家を離れずに資格を取れる。", "会議録と町議会の議会だよりによると、課長が示した研修はオンラインが40時間、島内での実地が約90時間の計130時間。受講料や講師の派遣は東京都が負担し、受講者が払うのはオンライン部分の通信料だけとした。対象は16歳以上で、日程は答弁の時点で決まっていなかった。奥山議員は、資格を持たずに施設で働く人や八丈高校の生徒にも声をかけるよう求めた。課長は、事業が決まった時点で声をかけると答えた。", "町はこれまで委託でこの研修を開いてきたが、2023年度は委託先の人手不足で中止になり、2024年度も開かれなかった。町は2025年6月の補正予算に、島外で受講する場合の2週間分の費用の半額9万円を10人分計上した。この時も議員から、島内で受けられるようにとの要望が出ていた。", "議会だより2025年11月号によると、質問の後、都から、事業者との入札が不調に終わり2025年度の実施を見送るとの報告があった。奥山議員は、前年度に続いて開かれないのは人材確保の点から受け入れられないと訴えた。", "この報告の後、都は株式会社ケアワーク弥生に委託し、2025年度の事業として八丈町で講座を開くと案内した。都が2025年度に始めた「島しょ地域における初任者研修等資格取得支援事業」の一つで、会場は大賀郷の社会福祉法人養和会。期間は2026年1月25日から3月15日までの毎週土曜と日曜のうち15日間で、ほかに自宅学習がある。定員は12人で、受講料はテキスト代を含めて無料とした。町は1月14日に防災無線で受講生を募り、締め切りは1月16日18時だった。町は2026年度当初予算にも介護職員初任者研修事業補助金90万円を計上している。"], "added": [{"fact": "質問の後、都から事業者との入札不調で2025年度は実施見送りとの報告があり、奥山議員は前年度も実施されておらず人材確保の点から受け入れ難いと訴えた（議会だより2025年11月号）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094052/r071125.pdf"}, {"fact": "受講料・講師派遣はすべて都の負担。対象は16歳以上。奥山議員は、資格のない施設職員や八丈高校生への声かけを求め、課長は事業確定時に声をかけると答えた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094052/r071125.pdf"}, {"fact": "2023年度は委託先の人材不足で研修の開催を中止し、委託料を減額した。同じ年の12月の定例会で、島内の介護事業所の介護職不足が取り上げられた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094928/r060225.pdf"}, {"fact": "2025年第二回定例会の補正予算に、島外で受ける2週間分の費用の半額9万円を10人分計上した。島内で受講できるよう要望が出た", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094050/r070825.pdf"}, {"fact": "都の「島しょ地域における初任者研修等資格取得支援事業」（令和7年度新規）。八丈町は2026年1月25日〜3月15日のうち15日間。委託先は株式会社ケアワーク弥生", "url": "https://www.fukushi.metro.tokyo.lg.jp/kourei/hoken/shoninshakenshu-islands"}, {"fact": "講座の募集チラシ:会場は社会福祉法人養和会（八丈町大賀郷）、毎週土日開講で通学15日間と自宅学習（課題提出5回）、定員12人、受講料はテキスト代込みで無料、申し込み締め切りは2026年1月16日18時。都の委託でケアワーク弥生が運営", "url": "https://carework.co.jp/data/202512/bin693bc131b6e4b.pdf"}, {"fact": "町が2026年1月14日に防災無線で介護職員初任者研修講座の受講生を募集。締め切りは1月16日18時", "url": "https://x.com/HachijoTown/status/2011275830090219578"}, {"fact": "町の条例で、定期巡回・夜間対応型の訪問介護員等は介護福祉士か初任者研修課程の修了者と定めている", "url": "/Users/cc/codex/shinbun/data/reiki/text/g162RG00000449.txt"}, {"fact": "2026年度当初予算に介護職員初任者研修事業補助金900千円を計上", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/04/17130551/ipp01.pdf"}], "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=57"}, {"label": "八丈町議会", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094052/r071125.pdf"}, {"label": "東京都福祉局", "url": "https://www.fukushi.metro.tokyo.lg.jp/kourei/hoken/shoninshakenshu-islands"}, {"label": "ケアワーク弥生", "url": "https://carework.co.jp/data/202512/bin693bc131b6e4b.pdf"}, {"label": "八丈町", "url": "https://x.com/HachijoTown/status/2011275830090219578"}], "label": "くらし", "audience": "島民", "thread_id": "t20260817-66", "id": "42e8e4", "photo": {"type": "img", "src": "/img/kiji/42e8e4.jpg?v=d658a1", "og": "/img/kiji/42e8e4-og.jpg?v=d658a1", "s": "/img/kiji/42e8e4-s.jpg?v=d658a1", "m": "/img/kiji/42e8e4-m.jpg?v=d658a1", "caption": "講習会・社員研修・研修で話を聞く受講者", "credit": "", "file": "ac/29316311.jpg"}}, {"headline": "カラス対策、要注意16か所優先", "body": ["八丈町議会の2025年6月10日の第二回定例会で、山下則子議員がカラスによるごみの散乱を防ぐため、ごみ集積所にごみボックスを置くよう求めた。住民課長は、町が要注意とする16か所の改善を先に進め、都の補助事業を使えるか協議会で検討すると答えた。3月24日に公開された会議録に載っている。", "ごみ集積所は、三根・大賀郷・樫立・中之郷・末吉の各地区で、住民がふだんごみを出す場所だ。カラスが袋を破れば、生ごみなどが道に散らばる。山下議員は質問の題を「ゴミの散乱を防ぎ観光地として相応しい八丈町へ」とし、暮らしの問題としてだけでなく、観光で島を訪れる人の目にも触れる問題として取り上げた。", "山下議員はボックスの設置のほかに、ごみの出し方の周知を工夫することと、多言語の看板を置くことも求めた。住民課長は看板について、相談があればできる限り対応すると答えた。", "集積所の設備は、2021年12月6日の定例会でも質問に上った。金川孝幸議員が「ゴミの削減対策及び集積所について」を問い、集積所に置くケージの設置ルールと補助を求めた。このとき住民課長は、公平性を理由にケージへの補助は難しいと答え、全島一斉の周知を検討するとした。今回の答弁では、都の補助事業を使う道を探るとした。"], "added": [{"fact": "2021年12月6日の定例会で金川孝幸議員が「ゴミの削減対策及び集積所について」を問い、集積所のケージ設置ルールと補助などを求めた。住民課長はケージ補助は公平性から困難とし、全島一斉の周知は検討すると答えた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/26124357/20210401.pdf#page=16"}], "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161653/20250610.pdf#page=67"}, {"label": "八丈町議会", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/26124357/20210401.pdf#page=16"}], "label": "くらし", "audience": "島民", "thread_id": "t20260817-67", "id": "aef52b", "photo": {"type": "img", "src": "/img/kiji/aef52b.jpg?v=c76a39", "og": "/img/kiji/aef52b-og.jpg?v=c76a39", "s": "/img/kiji/aef52b-s.jpg?v=c76a39", "m": "/img/kiji/aef52b-m.jpg?v=c76a39", "caption": "八丈町役場・八丈町多目的ホール おじゃれ", "credit": "", "file": "own/yakuba-8.jpg"}}], "agenda": [{"date": "2026-08-17", "end": "2026-08-21", "text": "全国離島交流中学生野球大会(八丈島選抜)", "url": "https://x.com/hachijomachi/status/2085558854709108889"}, {"date": "2026-08-21", "end": null, "text": "末吉応援ミニコンサート(末吉)", "url": "https://x.com/8jobunka/status/2088060046538416621"}, {"date": "2026-08-22", "end": null, "text": "八丈島みんなで海あそび2026", "url": "https://x.com/madoca_Okuyama/status/2077725986909765957"}, {"date": "2026-08-23", "end": null, "text": "八丈ウィンズフェス2026", "url": "https://8jobunka.jimdofree.com/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88/%E5%8D%94%E4%BC%9A%E4%B8%BB%E5%82%AC-%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B92026%E5%8F%82%E5%8A%A0%E8%80%85%E5%8B%9F%E9%9B%86/"}, {"date": "2026-08-24", "end": null, "text": "真夏の星空上映会2026(野外)", "url": "https://x.com/maimai_shinko/status/2083085588148985877"}], "letters": [], "corrections": [], "column": null, "kyoku": {"artist": "Allen Toussaint", "title": "Southern Nights", "text": "南部の夜を歌うとき、Allen Toussaintは観光案内のような景色を並べません。ピアノと夢を見るような歌声が、昔の記憶を少しずつ違う角度から照らしていく。明るい音なのに、過ぎた時間への気持ちがふと滲むことがあります。故郷は地図に書かれた名前だけではなく、そこで過ごした人の声や匂いと一緒に残るものなのでしょう。曲が終わっても、夜の湿り気だけがしばらく耳に残っています。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music/86/6f/e3/mzi.zbgmmwim.jpg/300x300bb.jpg", "album": "Southern Nights", "url": "https://music.apple.com/jp/album/southern-nights/343403727?i=343403733&uo=4"}}, "ronten": null, "weekly": [], "ichimen_week": [{"date": "2026-08-16", "url": "/2026/08/16/7a5ef9/", "headlines": ["転入者の33.7%が4年で島外へ"]}, {"date": "2026-08-15", "url": "/2026/08/15/63a61e/", "headlines": ["東海汽船処分、21日に聴聞へ"]}, {"date": "2026-08-14", "url": "/2026/08/14/2f58b9/", "headlines": ["島内出産に医師3人・助産師4人"]}, {"date": "2026-08-13", "url": "/2026/08/13/a808e6/", "headlines": ["ムロアジ漁 8月に始まる"]}, {"date": "2026-08-12", "url": "/2026/08/12/5e00a7/", "headlines": ["納涼花火、雨で開始を20時30分に"]}, {"date": "2026-08-11", "url": "/2026/08/11/a5c8cd/", "headlines": ["宵酔処らいす 31日で閉店"]}, {"date": "2026-08-10", "url": "/2026/08/10/1cf9e0/", "headlines": ["あしたば加工工場、来夏の復活へ"]}], "population": {"as_of": "2026-08-01", "people": 6541, "people_diff": -13, "households": 4054, "households_diff": -6, "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/07/31155211/hachijo2609.pdf", "ido": {"in": 12, "birth": 5, "out": 22, "death": 8}}, "giin": [], "hyakunen": {"then": {"ago": "100年前", "dt": "1926年8月17日(火)", "pic": "<span class=\"ic\"><svg v function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();

      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}

    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];

    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}

    </section>`:""}
    </div>
    <aside class="rail">
      <section class="ran tv" aria-label="FM八丈島テレビ"><div class="head"><h2 class="band onair"><a href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><i aria-hidden="true"></i>ON AIR</a></h2><a class="chl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div><div class="tvw"><iframe src="https://tv.hachijojima.jp/embed.html" title="FM八丈島テレビ" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></div></section>
      ${(e.ichimen_week||[]).length?`<section class="ran" id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h"><a href="/archive/">今週の一面</a></h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><a href="${esc(w.url)}"><time datetime="${esc(w.date)}">${tsuki(w.date)}</time>${esc(w.headlines[0])}</a></li>`).join("")}</ol>
      </section>`:""}
      ${giinSection(e)}
      ${kyokuSection(e.kyoku&&{...e.kyoku,day:DAY(e)})}
      ${shimaSection(e)}
    </aside>
  </div>

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
  wabunKakko(document.body);
}
