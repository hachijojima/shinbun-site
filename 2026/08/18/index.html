<script type="application/json" id="edition">{"date": "2026-08-18", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T10:23:39+09:00", "prev": "/2026/08/17/", "next": "/2026/08/19/", "alerts": [], "weather": {"issued": "2026-08-18T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 23, "max": 30}]}, "koyomi": {"sunrise": "5:05", "sunset": "18:25", "moon": 4.8, "tide": {"place": "八丈島(神湊)", "high": [["8:33", 126], ["20:01", 143]], "low": [["2:10", 58], ["13:58", 80]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "物流センター、機器のみ更新せず", "body": ["町は2024年12月3日の町議会定例会で、三根の八丈町物流センターについて答弁した。令和7年度にコンサルタントを入れて規模と立地を調べるとし、今の建物のまま冷凍機器だけを替える考えはないとした。一般質問への答えで、会議録と議会だよりに載っている。", "センターは昭和53年に町の条例で設けた施設だ。島でとれた産物の急速冷凍と、生鮮食料品や生活物資の保管を受け持つ。凍結室は零下35度と零下45度の2室で、ほかに冷蔵室が3室と倉庫がある。使用料は重さで決まり、冷蔵室は鮮魚とほかの品で額を分けている。", "答弁で配られた資料によると、平成31年度から令和5年度までの修繕・設備交換・建物補修は計25回、3908万979円に上る。産業観光課長は、利用者に迷惑をかけた時期があったと述べた。品質を保つため、預かった品の引き取りを利用者に頼んだこともあると答えた。町の防災アカウント「防災八丈」は2022年9月、設備の故障で入庫の受け付けを止めていると伝え、同年10月6日に再開した。2024年1月29日には、機械の故障で冷凍品と冷蔵品の受け入れを当面止めると伝えた。", "質問したのは金川孝幸町議。課長は建物の耐用年数を38年とし、完成から45年がたって償却を終えていると答えた。機械設備には償却期間の残るものもある。そのうえで、令和7年度にコンサルタントを入れて規模や立地を調べると答弁した。", "金川町議は、冷凍設備の更新や急速冷凍の導入を問い、利用料金の見直しも尋ねた。課長は、今の設備はフロンガスを使っていると説明し、今の建物での更新は考えていないと答えた。急速冷凍は今の施設ですでに行っていると答えた。", "町長は令和7年度の施政方針で、物流センター事業について、建て替えに向けて規模と立地の調査をすると述べた（広報はちじょう2025年4月号）。", "建て替えは以前にも検討されていた。町は2013年7月24日、「八丈町物流センター建替え基本計画策定業務委託」を国際航業東京支店と609万円で契約した。2014年の町議会でも、建て替え計画やセンターの将来像を問う質問が出た。センターはその後も修繕を重ねて使われてきた。"], "added": [{"fact": "物流センターは昭和53年の条例で設けた。所在地は三根4205番地。島内生産品の急速冷凍、生鮮食料品等の冷蔵保管、生活必需物資の保管を行う。凍結室2室（零下35度・零下45度）、冷蔵室3室、倉庫があり、使用料は重さで決まる（冷蔵室は鮮魚とその他で額が異なる）", "url": "https://www.town.hachijo.tokyo.jp/reiki_int/reiki_honbun/g162RG00000326.html"}, {"fact": "答弁の配布資料では、平成31〜令和5年度の修繕・設備交換・建物補修などが計25回、3908万979円。課長は、迷惑をかけた時期があり、品質保持のため引き取りを頼んだこともあると答えた。建物の耐用年数は38年で完成から45年。機械設備には償却期間が残るものもある。今の設備はフロンガスを使っていて今の建物での更新は考えていない。急速冷凍は今の施設ですでに導入している", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094054/r070225.pdf"}, {"fact": "防災八丈が2022年9月21日、設備故障で物流センターの入庫受付を止めていると伝えた", "url": "https://x.com/HachijoTown/status/1572454576749711360"}, {"fact": "防災八丈が2022年10月5日、入庫受付を翌日から再開すると伝えた", "url": "https://x.com/HachijoTown/status/1577535702111514625"}, {"fact": "防災八丈が2024年1月29日、機械故障で冷凍品・冷蔵品の荷物の受け入れを当面止めると伝えた", "url": "https://x.com/HachijoTown/status/1751889323975479568"}, {"fact": "令和7年度施政方針に「物流センター事業では、建て替えに向け規模や立地に関する調査を実施します」とある", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114400/hachijo2504.pdf"}, {"fact": "2013年7月24日、八丈町物流センター建替え基本計画策定業務委託を国際航業（株）東京支店と609万円で契約（指名）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/25144808/nyuusatsu_kekka_h25_i.pdf"}, {"fact": "議会だより169号（2014年2月）に「物流センターの将来像は」、172号（2014年11月）に「物流センターの建て替え計画は」という質問が載っている", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094054/r070225.pdf"}], "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/25162549/20240401.pdf#page=23"}, {"label": "八丈町議会だより", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094054/r070225.pdf"}, {"label": "八丈町例規集", "url": "https://www.town.hachijo.tokyo.jp/reiki_int/reiki_honbun/g162RG00000326.html"}, {"label": "防災八丈", "url": "https://x.com/HachijoTown/status/1751889323975479568"}, {"label": "広報はちじょう", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114400/hachijo2504.pdf"}, {"label": "八丈町", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/25144808/nyuusatsu_kekka_h25_i.pdf"}], "label": "産業", "audience": "島民", "thread_id": "t20260818-68", "id": "147820", "photo": {"type": "img", "src": "/img/kiji/147820.jpg?v=7b016a", "og": "/img/kiji/147820-og.jpg?v=7b016a", "s": "/img/kiji/147820-s.jpg?v=7b016a", "m": "/img/kiji/147820-m.jpg?v=7b016a", "caption": "八丈町役場・八丈町多目的ホール おじゃれ", "credit": "", "file": "own/yakuba-2.jpg"}}, "side": [], "shorts": [{"headline": "八丈高校図書館 平日も19日まで", "body": ["都立八丈高校（大賀郷）は17日から19日までの3日間、校内の図書館を特別に一般公開している。この夏は週末を中心に地域に開いてきたが、今回は夏休みの平日に開けた。同校が17日に案内した。", "島の人が本を借りに行く先には、三根のコミュニティセンター内にある八丈町立図書館もある。町立図書館は毎週月曜と祝日が休館で、8月は28日も休む。17日は月曜で町立図書館が休みだったが、同校の図書館は開いた。18日と19日はどちらの図書館も開いている。", "同校は図書館を地域に開くとき、本を借りられる人を島内に住む人に限り、館内での飲食を断っている。同校の施設使用規程は2001年9月に施行され、2023年1月に一部が改定された。規程は図書館を視聴覚ホールとともに地域に開く文化施設とし、授業日や学校行事のない日に開くと定める。開館の日時は広報誌などで知らせる。使えるのは、図書館で個人登録をした八丈町民で、借りた本をなくしたときは弁済する。", "この夏、同校は7月18日から20日までの3連休を3日とも開いた。7月25日と26日は都合で休館したが、返却箱は使えた。8月は1日と2日、8日と9日、15日と16日の週末をそれぞれ開いた。6月27日と28日は台風が近づいたため休館し、返却箱も使えなかった。", "町立図書館は7月1日、図書館のホームページに「マイページ」を設けた。借りた本の延長や予約、貸し出しの履歴の確認がホームページからできる。"], "added": [{"fact": "同校の施設使用規程は図書館を視聴覚ホールとともに地域に開く文化施設とし、授業日や学校行事のない日に開放する。借りた本をなくしたときは弁済する", "url": "https://www.metro.ed.jp/hachijo-h/l_pdf/（A）八高施設開放規程（23.1.1)  .pdf"}, {"fact": "同校の施設使用規程は平成13年（2001年）9月1日施行、令和5年（2023年）1月1日に一部改定。図書館の開館日時は広報誌等で周知する。図書館の使用は八丈町民で個人登録（図書室で随時）を行った者とする", "url": "https://www.metro.ed.jp/hachijo-h/l_pdf/（A）八高施設開放規程（23.1.1)  .pdf"}, {"fact": "同校の図書館の地域開放は施設内での飲食が禁止で、貸し出しは島内に住む人に限る", "url": "https://x.com/tokyo8jouhs/status/2088130814878097839"}, {"fact": "八丈町立図書館は三根26-6のコミュニティセンター内にある", "url": "https://mapfan.com/genres/35/13/401"}, {"fact": "八丈高校図書館は7月18日から20日までの3連休を開館、7月25日・26日は都合で休館（返却箱は受け付け）、8月1日・2日、8日・9日、15日・16日に開館、6月27日・28日は台風接近で休館し返却箱も使えなかった", "url": "https://x.com/tokyo8jouhs/status/2088130814878097839"}, {"fact": "町立図書館の8月の休館日は毎週月曜・祝日と28日", "url": "https://x.com/i/web/status/2084421557066068421"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2089153625562247210"}, {"label": "都立八丈高校", "url": "https://x.com/tokyo8jouhs/status/2088130814878097839"}, {"label": "東京都立八丈高等学校施設使用規程", "url": "https://www.metro.ed.jp/hachijo-h/l_pdf/（A）八高施設開放規程（23.1.1)  .pdf"}, {"label": "八丈町立図書館", "url": "https://x.com/i/web/status/2084421557066068421"}, {"label": "広報はちじょう", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/31160020/hachijo2607.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20260815-54", "followup": true, "id": "24d7b0", "photo": {"type": "img", "src": "/img/kiji/24d7b0.jpg?v=245d05", "og": "/img/kiji/24d7b0-og.jpg?v=245d05", "s": "/img/kiji/24d7b0-s.jpg?v=245d05", "m": "/img/kiji/24d7b0-m.jpg?v=245d05", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-5.jpg"}}, {"headline": "八丈高女子バスケ、2連勝で4強", "body": ["都立八丈高校の女子バスケットボール部は17日、夏季大会の2回戦で都立足立高校に47-33で勝った。16日の1回戦に続く2連勝で、Eブロックの準決勝に進んだ。18日は準決勝で都立日本橋高校と対戦する。", "同校によると、この大会が部にとって今年度初めての試合だった。東京都高体連バスケットボール女子専門部の大会結果では、2025年度の夏季大会に同校の名前はない。今年度最初の大会で2つ勝ち、ブロックの4強に入った。", "大会の正式名は東京都高等学校女子バスケットボール夏季大会である。東京都高等学校体育連盟と東京都バスケットボール協会が主催する。支部ごとにブロックを組んで争い、各ブロックの3位までを表彰する。試合は8分のクォーターを4回行う。八丈高はA・C支部合同のEブロックに入った。", "同専門部の大会結果によると、八丈高は16日の1回戦で淑徳巣鴨高校に44-31で勝った。2試合とも会場は港区の都立芝商業高校である。", "18日の準決勝は、世田谷区の東京農業大学第一高校で2試合目に組まれている。開始時刻の目安は10時20分。相手の日本橋高校は、16日にサレジアン国際学園高校を76-22で、17日に桜丘高校を64-31で破った。準決勝の勝者は19日のブロック決勝に進む。", "日本橋高校とは3年前にも対戦している。2023年5月の総合体育大会2回戦で、八丈高は64-51で勝った。同校は当時、この勝利で部の目標だった公式戦2回戦突破を果たしたと伝えていた。"], "added": [{"fact": "2回戦の相手は都立足立高校で、八丈高が47-33で勝った（33点が足立、47点が八丈）", "url": "https://hsw.tokyobasketball.jp/2026/2026_kaki_result.pdf"}, {"fact": "16日の1回戦は淑徳巣鴨高校に44-31で勝った", "url": "https://hsw.tokyobasketball.jp/2026/2026_kaki_result.pdf"}, {"fact": "18日の準決勝の相手は都立日本橋高校。日本橋は16日にサレジアン国際学園を76-22、17日に桜丘を64-31で破った", "url": "https://hsw.tokyobasketball.jp/2026/2026_kaki_result.pdf"}, {"fact": "八丈高はA・C支部合同のEブロック。19日がブロック決勝", "url": "https://hsw.tokyobasketball.jp/2026/2026_kaki_result.pdf"}, {"fact": "大会の正式名は令和8年度東京都高等学校女子バスケットボール夏季大会。主催は東京都高等学校体育連盟と東京都バスケットボール協会。支部別の大会で、各ブロック3位までを表彰する。試合は8分のクォーターを4回", "url": "https://hsw.tokyobasketball.jp/2026/2026_kaki_program.pdf"}, {"fact": "16日と17日の試合の会場は都立芝商業高校（コートA）。18日は東京農業大学第一高校のコートPaの2試合目で、開始時刻の目安は10時20分", "url": "https://hsw.tokyobasketball.jp/2026/2026_kaki_program.pdf"}, {"fact": "2025年度の夏季大会の結果に八丈高校の名前はない", "url": "https://hsw.tokyobasketball.jp/2025/2025_kaki_result.pdf"}, {"fact": "同校によると、今大会が今年度初めての試合だった", "url": "https://x.com/tokyo8jouhs/status/2088955298769932552"}, {"fact": "2023年5月の総合体育大会2回戦で日本橋高校に64-51で勝った。同校は、部の目標だった公式戦2回戦突破を果たしたと伝えた", "url": "https://x.com/tokyo8jouhs"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2089279563696390193"}, {"label": "東京都高体連バスケットボール女子専門部", "url": "https://hsw.tokyobasketball.jp/2026/2026_kaki_result.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20260816-61", "followup": true, "id": "18b7ac", "photo": {"type": "img", "src": "/img/kiji/18b7ac.jpg?v=c040ac", "og": "/img/kiji/18b7ac-og.jpg?v=c040ac", "s": "/img/kiji/18b7ac-s.jpg?v=c040ac", "m": "/img/kiji/18b7ac-m.jpg?v=c040ac", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-3.jpg"}}, {"headline": "創業と承継 八丈島の3人語る", "body": ["東京都商工会連合会は9月4日19時から20時30分まで、島しょ地域で創業や事業承継を考える人向けの無料オンラインセミナーを開く。八丈島で事業を営む3人が、家業を継いだ経験、移住して事業を始めた経験、島と郷里を行き来して働く経験を話す。八丈町商工会が17日にホームページで案内した。", "題名は「わたしらしく しまとくらす」。対象は、島の店や事業を受け継ぐ方法を知りたい人、創業の最初の一歩に迷っている人、離島で事業をするときに使える支援制度を知りたい人だ。連合会は2025年にも同じ趣旨で別のセミナーを開いており、その案内では島しょ地域の課題に事業者の高齢化と後継者不足を挙げていた。八丈町も、島で暮らしを立てる道筋を聞ける場として紹介した。", "話をするのは八丈島の3人。長田商店代表の長田隆弘さんは、くさやを作って売る家業を継いだ2代目で、くさやを通じた食育や島おこしにも取り組む。株式会社欒代表取締役の魚谷孝之さんは2013年に移住した。ジャージー乳を使うチーズブランド「エンケルとハレ」を立ち上げた。グラフィックデザイナーで写真家、映像ディレクターのフルタヨウスケさんは岐阜県美濃市の出身だ。2020年から八丈島を拠点にし、岐阜と行き来して仕事をしている。", "セミナーでは、支援機関が創業と事業承継への支援を説明し、伊豆諸島と小笠原諸島の島ごとの特徴も紹介する。3人の話のあと、島での仕事のつくり方や地域との関わり方を語り合う。企画と運営は、大島町に拠点を置く株式会社TIAMが担う。同社は東京の離島を伝えるウェブサイト「東京都離島区」を運営している。", "連合会とTIAMは2025年9月5日にも同じ趣旨のオンラインセミナーを開いた。前回は、三宅島で営業していた宿を受け継いで開業した事業者と、七島信用組合の専務理事が話した。今回の話し手は3人とも八丈島で事業を営む人だ。", "参加は無料で、Zoomを使う。東京都離島区のセミナーのページにある申し込みフォームから事前に申し込み、参加用のアドレスは後日届く。"], "added": [{"fact": "セミナーの名称「わたしらしく しまとくらす」、9月4日19時〜20時30分、Zoomでのオンライン開催、参加無料、主催は東京都商工会連合会、企画・運営は株式会社TIAM", "url": "https://ritoku.tokyo/news/watashi-rashiku2026/"}, {"fact": "登壇者は長田商店代表の長田隆弘さん（くさやの製造・販売の2代目、食育・島おこし）、株式会社欒代表取締役の魚谷孝之さん（2013年移住、ジャージー乳を使ったチーズブランド「エンケルとハレ」創業）、フルタヨウスケさん（岐阜県美濃市出身、2020年から八丈島拠点の二拠点生活）", "url": "https://ritoku.tokyo/news/watashi-rashiku2026/"}, {"fact": "対象は、事業承継に関心がある人、創業の一歩に迷う人、島の事業や店を受け継ぐ方法を知りたい人、離島の事業に使える制度を知りたい人。内容は支援機関による支援紹介、東京諸島の紹介、ゲストトーク、クロストーク。申し込みはGoogleフォームで、参加URLは後日届く", "url": "https://ritoku.tokyo/news/watashi-rashiku2026/"}, {"fact": "東京都離島区は株式会社TIAMが運営し、大島町に所在する", "url": "https://ritoku.tokyo/"}, {"fact": "2025年9月5日に同じ主催・企画運営で、登壇者の違う別の回のオンラインセミナーを開催。三宅島で宿を承継して開業した事業者と七島信用組合専務理事が登壇。背景として事業者の高齢化と後継者不足を挙げていた", "url": "https://prtimes.jp/main/html/rd/p/000000003.000149619.html"}], "sources": [{"label": "八丈町商工会", "url": "https://x.com/hachisho8/status/2089247087900926241"}, {"label": "八丈町", "url": "https://x.com/hachijomachi/status/2089284589848248610"}, {"label": "東京都離島区", "url": "https://ritoku.tokyo/news/watashi-rashiku2026/"}, {"label": "PR TIMES", "url": "https://prtimes.jp/main/html/rd/p/000000003.000149619.html"}], "label": "産業", "audience": "島民", "thread_id": "t20260818-69", "id": "49f1bf", "photo": {"type": "img", "src": "/img/kiji/49f1bf.jpg?v=ab3fc3", "og": "/img/kiji/49f1bf-og.jpg?v=ab3fc3", "s": "/img/kiji/49f1bf-s.jpg?v=ab3fc3", "m": "/img/kiji/49f1bf-m.jpg?v=ab3fc3", "caption": "八丈町商工会", "credit": "", "file": "own/shokokai-1.jpg"}}, {"headline": "Jアラートの多言語放送は可能", "body": ["2025年9月5日の八丈町議会定例会の一般質問で、淺沼隆章議員がJアラートの警報を防災無線で多言語で流せるかを問うた。総務課長は、受信機に音声を登録しておけば放送できると答えた。外国人には緊急速報メールで伝えたいとも述べた。町議会の会議録で分かった。", "質問は2025年7月30日の地震を受けたものだ。町は9時20分に防災無線で注意を呼びかけ、9時40分にはJアラートで津波警報が流れた。Jアラート（全国瞬時警報システム）は、国が出す警報を自治体の受信機が受けて防災無線から自動で流す仕組みである。放送の内容は国が決める。淺沼議員は、2025年8月1日現在で町の人口6,714人のうち外国人の登録が123人いると示した。訪日客が増えることも挙げ、多言語の放送を求めた。", "総務課長によると、Jアラートによる注意の呼びかけは1回きりで、続けて流すことはできない。天候や場所によっては屋外の放送が聞こえにくいこともある。課長は緊急速報メールの利点として、無料で登録がいらず、受けると警告音が鳴って画面に文が出ることを挙げた。指定した地域に一斉に届く点も示した。", "淺沼議員は、防災無線でも多言語で繰り返し放送するよう重ねて求めた。総務課長は、緊急速報メールはJアラートと連動しておらず、町が通信会社に登録して出していると説明した。国からは、Jアラートを多重化して使う検討を自治体に求める話が来ているとも述べた。そのうえで、まず外国人や観光客に事前の災害情報を伝える取り組みから始めたいと答えた。議員は最後に、翻訳にかかる時間や誤訳のおそれ、どの言語を選ぶかといった課題を挙げ、検討を求めた。", "町は同じ定例会に出した一般会計補正予算案に、Jアラートの新型受信機の整備委託料272万7,000円を計上した。受信機を新しくするための費用である。"], "added": [{"fact": "2025年7月30日の地震で、町は9時20分に防災無線で注意を呼びかけ、9時40分にJアラートで津波警報が流れた。Jアラートの放送内容は国が決め、自動で流れる", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=30"}, {"fact": "淺沼議員は、2025年8月1日現在の町の人口6,714人、登録外国人123人を示し、訪日客の増加も挙げた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=31"}, {"fact": "総務課長は、Jアラートによる注意の呼びかけは1回きりで、屋外の放送は聞こえにくい場合があると答えた。緊急速報メールは無料で登録不要、警告音が鳴る、画面に自動表示される、指定エリアに一斉配信されると利点を挙げた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=31"}, {"fact": "緊急速報メールはJアラートと連動しておらず、町が通信会社に登録して出している。国からJアラートの多重化での利用を考えてほしいとの話が来ている。まず事前の災害情報を伝える取り組みから始めたいと答えた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=31"}, {"fact": "議員は、翻訳にかかる時間、誤訳のおそれ、どの言語を選ぶかという課題を挙げたうえで、検討を求めた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=32"}, {"fact": "同じ定例会に出された一般会計補正予算案（第3号）に、Jアラート新型受信機整備委託料272万7,000円が計上された。受信機の更新整備にあてる", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=73"}], "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=28"}], "label": "くらし", "audience": "両方", "thread_id": "t20260818-409", "id": "21ff8d", "photo": {"type": "img", "src": "/img/kiji/21ff8d.jpg?v=83c20c", "og": "/img/kiji/21ff8d-og.jpg?v=83c20c", "s": "/img/kiji/21ff8d-s.jpg?v=83c20c", "m": "/img/kiji/21ff8d-m.jpg?v=83c20c", "caption": "八丈町役場・八丈町多目的ホール おじゃれ", "credit": "", "file": "own/yakuba-3.jpg"}}], "agenda": [{"date": "2026-08-21", "end": null, "text": "末吉応援ミニコンサート(末吉)", "url": "https://x.com/8jobunka/status/2088060046538416621"}, {"date": "2026-08-22", "end": null, "text": "八丈島みんなで海あそび2026", "url": "https://x.com/madoca_Okuyama/status/2077725986909765957"}, {"date": "2026-08-22", "end": null, "text": "八丈ビジターセンター水槽の解説(八丈学講座)", "url": "https://x.com/hachijomachi/status/2089326709770444879"}, {"date": "2026-08-23", "end": null, "text": "八丈ウィンズフェス2026", "url": "https://8jobunka.jimdofree.com/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88/%E5%8D%94%E4%BC%9A%E4%B8%BB%E5%82%AC-%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B92026%E5%8F%82%E5%8A%A0%E8%80%85%E5%8B%9F%E9%9B%86/"}, {"date": "2026-08-24", "end": null, "text": "真夏の星空上映会2026(マイマイ新子と千年の魔法)", "url": "https://x.com/maimai_shinko/status/2083085588148985877"}], "letters": [], "corrections": [], "column": null, "kyoku": {"artist": "砂原良徳", "title": "SUN SONG '70", "text": "70年代の音を90年代末に作り直す。砂原良徳の電子音には、古い未来図を新しい紙に描き直したような可笑しさがあります。整ったリズムと歌声にあるのは、単純な懐古趣味とは違う軽やかさ。過去の音をそっくり再現するのでなく、当時の人が思い描いた未来をもう一度想像してみる。そのひとひねりが、ポップスの手触りを保ちながら、聴き終えたあとにも残ります。"}, "ronten": null, "weekly": [], "ichimen_week": [{"date": "2026-08-17", "url": "/2026/08/17/4fc858/", "headlines": ["八丈島選抜、隠岐の島町に到着"]}, {"date": "2026-08-16", "url": "/2026/08/16/7a5ef9/", "headlines": ["転入者の33.7%が4年で島外へ"]}, {"date": "2026-08-15", "url": "/2026/08/15/63a61e/", "headlines": ["東海汽船処分、21日に聴聞へ"]}, {"date": "2026-08-14", "url": "/2026/08/14/2f58b9/", "headlines": ["島内出産に医師3人・助産師4人"]}, {"date": "2026-08-13", "url": "/2026/08/13/a808e6/", "headlines": ["ムロアジ漁 8月に始まる"]}, {"date": "2026-08-12", "url": "/2026/08/12/5e00a7/", "headlines": ["納涼花火、雨で開始を20時30分に"]}, {"date": "2026-08-11", "url": "/2026/08/11/a5c8cd/", "headlines": ["宵酔処らいす 31日で閉店"]}], "population": {"as_of": "2026-08-01", "people": 6541, "people_diff": -13, "households": 4054, "households_diff": -6, "url": "https://prd-hach <script>
 
const SAMPLE = {

  top:{ headline:"定期船、きょうは条件付き運航", sode:"波高く、寄港地変更の可能性",

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
