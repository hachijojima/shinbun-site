<script type="application/json" id="edition">{"date": "2026-08-24", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-28T20:34:39+09:00", "prev": "/2026/08/23/", "next": "/2026/09/01/", "alerts": [], "weather": {"issued": "2026-08-24T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 23, "max": 31}]}, "koyomi": {"sunrise": "5:09", "sunset": "18:18", "moon": 10.8, "tide": {"place": "八丈島(神湊)", "high": [["1:28", 124], ["16:31", 133]], "low": [["9:00", 51], ["21:46", 106]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "東海汽船の聴聞開催、処分は未定", "body": ["国土交通省関東運輸局は21日、東海汽船株式会社を処分する前の手続きとして、会社側の言い分を聞く聴聞を開いた。NHKが同日報じた。運輸局は、竹芝—八丈島航路を含む事業の停止などを検討している。24日朝の時点で、処分の内容と時期は発表されていない。聴聞の前日の20日には、山下奉也町長と町議会議長が、ほかの島しょ町村の首長や議長とともに東海汽船の社長と会い、要望書を手渡した。", "聴聞は、行政が不利益な処分を出す前に、相手の弁明を聞くための手続きだ。東京新聞が13日に報じたところでは、運輸局が7月31日に通知した処分案は2つある。東京—八丈島、東京—大島—神津島、熱海—大島の3航路で事業を止めることと、安全統括管理者を解任することだ。同紙によると、東海汽船が事業停止の命令を受けたり、そのための聴聞を経たりしたことは、これまで一度もない。", "20日の面会は、町が21日朝、町の対応をまとめたページに加えて公表し、要望書も載せた。利島村の村山将人村長が自身のブログに書いた報告によると、要望書は東京都島嶼町村会と東京都島嶼町村議会議長会の名で、東海汽船の本社で手渡した。要望の柱は「安心・安全な運航の確保」と「島民生活の保護」の2つで、行政処分を軽くしたり変えたりするよう求めるものではないと書き添えた。面会の後、町村会の会長を務める神津島村の前田村長が報道各社の取材に応じ、安全管理の体制を根本から見直し、再発を防ぐよう求めたと述べた。村山村長によると、会社側は今回の事案を極めて深刻に受け止めていると述べた。そのうえで、特別調査委員会を通じて根本の原因を突き止め、改善計画をつくり、安全管理の体制を立て直すと答えた。", "今後の見通しについて、村山村長は同じ報告で、国の正式な処分が決まるまで、9月中は基本的に今の運航が続く見通しだと記した。東海汽船は9月下旬に、改善計画書を関東運輸局などへ出す予定だという。村山村長は10日に運輸局長と会った際、改善計画の審査には1〜2か月かかるとの説明を受けていた。17〜23日の7日間、竹芝からの船は1日も欠航せず、毎日八丈島に着いた。", "東海汽船は2025年4月1日にも、関東運輸局から2つの命令を受けている。船員法に基づく是正命令と、海上運送法に基づく輸送の安全確保の命令だ。このときは立入検査で、船員の労働時間が法定の上限を超えていたことと、非常時に備えた訓練を長く適切に行っていなかったことが確認された。今回の酒気帯び乗務やアルコール検査の肩代わりといった事案は、その後の検査で見つかった。町と町議会は3日、災害廃棄物の島外搬出や復旧資材の輸送でこの航路が欠かせないとして、代替輸送を確保するよう都に求めている。"], "added": [{"fact": "関東運輸局は予定どおり8月21日に東海汽船への聴聞を開いた。事業停止などの処分を検討中で、処分はまだ決まっていない", "url": "https://news.web.nhk/newsweb/na/nd-20260821de45556"}, {"fact": "8月20日、八丈町長と町議会議長がほかの東京都島嶼町村長・議長とともに東海汽船の代表取締役社長と面会し、要望書を提出した。町は21日に対応ページへこれを加え、要望書のPDFを載せた", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260814/"}, {"fact": "要望書は島嶼町村会と町村議会議長会の名で、「安心・安全な運航の確保」と「島民生活の保護」が柱。処分の軽減や変更は求めていないと明記した。会社側は特別調査委員会で原因を究明し、改善計画をつくると答えた。9月中は基本的に今の運航が続く見通しで、改善計画書は9月下旬に提出の予定", "url": "https://toshimashito.jp/blog-entry-553.html"}, {"fact": "7月31日に通知された処分案は、東京—八丈島など3航路の事業停止と安全統括管理者の解任。東海汽船は事業停止の命令もその聴聞も初めて", "url": "https://www.tokyo-np.co.jp/article/508183"}, {"fact": "東海汽船は2025年4月1日、労働時間の上限超過や非常時の訓練の不実施で、船員法に基づく是正命令と海上運送法に基づく輸送の安全確保命令を受けていた", "url": "https://www.mlit.go.jp/report/press/kaiji06_hh_000343.html"}], "figure": null, "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2090604305418260990"}, {"label": "NHK", "url": "https://news.web.nhk/newsweb/na/nd-20260821de45556"}, {"label": "八丈町「東海汽船株式会社の不適切事案に関する八丈町の対応について」", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260814/"}, {"label": "八丈町掲載の要望書", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/21093256/tokaikisen_R080820.pdf"}, {"label": "利島村長 村山将人ブログ", "url": "https://toshimashito.jp/blog-entry-553.html"}, {"label": "東京新聞", "url": "https://www.tokyo-np.co.jp/article/508183"}, {"label": "国土交通省", "url": "https://www.mlit.go.jp/report/press/kaiji06_hh_000343.html"}, {"label": "写真:Tky_910_A3、CC BY-SA 4.0(Wikimedia Commons。切り抜いて使用)", "url": "https://commons.wikimedia.org/wiki/File:%E6%9D%B1%E6%B5%B7%E6%B1%BD%E8%88%B9%E6%A9%98%E4%B8%B8.jpg"}], "label": "町政", "audience": "両方", "thread_id": "t20260802-6", "followup": true, "id": "ec9442", "photo": {"type": "img", "src": "/img/kiji/ec9442.jpg?v=231e5f", "og": "/img/kiji/ec9442-og.jpg?v=231e5f", "s": "/img/kiji/ec9442-s.jpg?v=231e5f", "m": "/img/kiji/ec9442-m.jpg?v=231e5f", "caption": "東海汽船の橘丸", "credit": "", "file": "commons/a051f9-1.jpg"}}, "side": [], "shorts": [{"headline": "八丈町の旅行割引、9月23日から", "body": ["八丈町の旅行クーポンを使い、八丈島への旅行が最大30%引きになる。対象は9月23日から来年2月28日までの旅行。八丈島観光協会が17日と18日に、るるぶトラベル、skyticket、ビッグホリデー、JTBの4社分を「ご当地クーポン（自治体クーポン）」として紹介した。今年は昨年10月の台風22・23号からの観光復興が課題で、春の都のキャンペーンに続いて、秋から冬の旅行にも割引が付く。", "観光協会の案内では、るるぶトラベルとビッグホリデーは17日、JTBは18日に予約の受け付けを始めた。割引の上限は社ごとに違う。るるぶトラベルは1人1泊あたり7500円まで、ビッグホリデーは1グループ3万5000円まで、宿泊と航空機利用の2種類を出すJTBは1予約あたり7500円から4万5000円までとしている。ビッグホリデーは、飛行機で来島して八丈島に泊まる商品のうち、対象と表示したコースに限る。skyticketは羽田―八丈島の往復航空券と宿泊を組み合わせた商品が対象だ。細かい利用条件は各社のサイトで確かめるよう、観光協会は呼びかけている。島内では、明日葉の加工品を作るあしたば加工工場も21日にXでクーポンを紹介した。", "山下奉也町長は3月2日の町議会定例会で令和8年度の施政方針を述べ、「台風の影響により減少した観光客数を回復するため、東京都と連携してクーポン事業に取り組みます」と表明していた。トラベルボイスが4月に報じたところでは、島の観光客数は台風前の昨年9月には前年同月を11.6%上回っていた。ところが10月は74.8%、11月は63.6%減り、その後も前年を下回っていた。", "台風後の旅行割引では、東京都と東京観光財団が「復幸旅！八丈島」を実施した。2月19日の都の発表によると、オンライン旅行会社を通じて割引クーポン付きの商品を売り、3月3日チェックインから7月31日チェックアウトまでの旅行を最大40%引きにした。クーポンを使った旅行者には、1人1泊3000円分の買い物券も1予約3泊分まで配った。今回の町のクーポンは、割引の上限を最大30%とし、9月下旬から2月末までの旅行を対象にしている。"], "added": [{"fact": "八丈島観光協会のクーポン案内では、9月23日から2027年2月28日までの旅行を対象とする「ご当地クーポン（自治体クーポン）」として、るるぶトラベル（8月17日、1人1泊最大7500円引き）、skyticket（8月17日、航空券と宿泊のセット）、ビッグホリデー（8月17日、1グループ上限3万5000円）、JTB（8月18日、1予約あたり7500〜4万5000円引き）を掲載した。割引は各社とも最大30%で、割引例では「八丈町の旅行クーポン」と記している", "url": "https://www.hachijo.gr.jp/blogs/coupon_2026-2027/"}, {"fact": "山下奉也町長は2026年3月2日の令和8年度施政方針で「台風の影響により減少した観光客数を回復するため、東京都と連携してクーポン事業に取り組みます」と述べた", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/r7-houshin/"}, {"fact": "春の都と東京観光財団の「復幸旅！八丈島」は、オンライン旅行会社経由で最大40%引き、1人1泊3000円の買い物券（1予約3泊分まで）付きで、3月3日チェックインから7月31日チェックアウトまでが対象だった", "url": "https://www.metro.tokyo.lg.jp/information/press/2026/02/2026021917"}, {"fact": "トラベルボイスによると、八丈島の観光客数は2025年9月に前年同月比11.6%増だったが、10月は74.8%減、11月は63.6%減で、その後も前年割れが続いた", "url": "https://www.travelvoice.jp/20260403-159497/print"}], "sources": [{"label": "あしたば加工工場", "url": "https://x.com/ashitabaya8jo/status/2091311260470317082"}, {"label": "八丈島乳業", "url": "https://x.com/milk8jo/status/2091008645232525501"}, {"label": "八丈島観光協会「八丈島への旅にお得な旅行クーポンご案内」", "url": "https://www.hachijo.gr.jp/blogs/coupon_2026-2027/"}, {"label": "八丈町「令和8年度施政方針」", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/r7-houshin/"}, {"label": "東京都報道発表（2026年2月19日）八丈島・青ヶ島観光復興キャンペーン", "url": "https://www.metro.tokyo.lg.jp/information/press/2026/02/2026021917"}, {"label": "トラベルボイス", "url": "https://www.travelvoice.jp/20260403-159497/print"}], "label": "産業", "audience": "両方", "thread_id": "t20260824-94", "id": "4b74ac", "photo": {"type": "img", "src": "/img/kiji/4b74ac.jpg?v=11c2a8", "og": "/img/kiji/4b74ac-og.jpg?v=11c2a8", "s": "/img/kiji/4b74ac-s.jpg?v=11c2a8", "m": "/img/kiji/4b74ac-m.jpg?v=11c2a8", "caption": "東京都・八丈島 南原千畳敷の風景", "credit": "", "file": "ac/29362283.jpg"}}, {"headline": "ウインズフェスに200人超", "body": ["八丈島文化協会が主催する吹奏楽の演奏会「八丈ウインズフェス2026」が23日、大賀郷の八丈町多目的ホール「おじゃれ」で開かれ、200人を超える人が来場した。協会が同日夜にXで報告した。2024年2月以来、2年半ぶりの開催だ。前回に続いて甘粕宏和さんがゲスト指揮者を務めた。", "協会は事前に、島内外の奏者約80人で一日限りの特別合同バンドを組むと告知していた。8月6日の告知によると、都心で活動する演奏家や音大生ら40人以上が来島し、御蔵島からも有志が加わる予定だった。島内の奏者には、島に住む吹奏楽経験者を社会人から小学生まで募った。中学生以下が出るのは一部の曲に限っていた。20日には島内メンバーの練習の写真を投稿し、「本土と御蔵島からのメンバーが加わって80人で演奏します」と書いている。終了後の報告では甘粕さんと島外の奏者に来島の礼を述べたが、実際の出演人数や、島内と島外、小中高生の内訳は示していない。", "甘粕さんはワルシャワ国際吹奏楽指揮者コンクール2021で1位になり、東京五輪の閉会式でも指揮をした。協会のサイトによると、前回の2024年2月25日の会では、島外のゲストと高校生を含む島内の奏者が合同バンドを組んだ。八丈町はこのとき、プロの奏者や音大生も多数来島するとXで案内していた。前回は、協会が作曲家の福島弘和さんに依頼した「吹奏楽のための『おじゃれ』～八丈島民謡による幻想曲」が初演された。春山節やショメ節、八丈太鼓の「すがる」「甚句」の旋律で構成し、中間部には八丈太鼓のアドリブを入れた曲だ。島の民謡や太鼓を吹奏楽の楽譜に残し、島内外に伝えるのが事業の目的だという。今回もこの曲を演奏曲に挙げていた。協会のサイトに前回の来場者数は載っておらず、今回の規模と比べることはできない。", "本番2日前の21日15時からは、プレイベントとして「末吉応援ミニコンサート」を末吉公会堂で開くと、協会が当日朝に告知していた。入場は無料。ゲスト3人が、このコンサートのために編曲した曲を含む3曲を演奏するとしていた。ゲストの名前と曲名、来場者数、「末吉応援」と名づけた理由は、協会の告知にも終了後の報告にも書かれていない。本番の入場料は500円で、高校生以下は無料だった。後援は八丈町と八丈町教育委員会。"], "added": [{"fact": "前回の八丈ウインズフェスは2024年2月25日に「おじゃれ」で開かれ、甘粕宏和さんの指揮で、島外のゲストと高校生を含む島内の奏者が特別合同バンドを組んだ。協会のページに来場者数・出演者数の記載はない", "url": "https://8jobunka.jimdofree.com/%E4%B8%BB%E5%82%AC%E4%BA%8B%E6%A5%AD/%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B9-%E6%96%87%E5%8C%96%E4%BA%A4%E6%B5%81%E4%BA%8B%E6%A5%AD/"}, {"fact": "前回は福島弘和さんへの委嘱作「吹奏楽のための『おじゃれ』～八丈島民謡による幻想曲」が初演された。春山節、八丈太鼓の「すがる」「甚句」、ショメ節の旋律で構成し、中間部に八丈太鼓のアドリブを入れた曲で、民謡や太鼓を吹奏楽の楽譜に残し島内外に伝えるのが事業の目的", "url": "https://8jobunka.jimdofree.com/%E4%B8%BB%E5%82%AC%E4%BA%8B%E6%A5%AD/%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B9-%E6%96%87%E5%8C%96%E4%BA%A4%E6%B5%81%E4%BA%8B%E6%A5%AD/"}, {"fact": "2024年2月24日、八丈町は、甘粕さんのほかプロの奏者や音大生も多数来島するとXで案内していた", "url": "https://x.com/i/status/1761284429291651432"}, {"fact": "2026年の演奏曲には、前回初演の「おじゃれ」が「アルメニアン・ダンス パートⅠ」とともに挙がっていた。中学生以下は一部の曲だけに参加する形だった", "url": "https://8jobunka.jimdofree.com/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88/%E5%8D%94%E4%BC%9A%E4%B8%BB%E5%82%AC-%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B92026%E5%8F%82%E5%8A%A0%E8%80%85%E5%8B%9F%E9%9B%86/"}, {"fact": "終了後の報告には、実際の出演人数とその内訳、ミニコンサートの結果が書かれていない。ミニコンサートのページにも、ゲスト名、曲名、末吉を応援する理由の記載はない", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-ウインズフェスプレイベント末吉応援ミニコンサートのお知らせ/"}], "sources": [{"label": "八丈島文化協会", "url": "https://x.com/8jobunka/status/2091481919544496534"}, {"label": "八丈島文化協会「八丈ウインズフェス2026開催のお知らせ」", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-八丈ウインズフェス2026開催のお知らせ/"}, {"label": "八丈島文化協会「八丈ウインズフェス2026参加者募集・開催概要」", "url": "https://8jobunka.jimdofree.com/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88/%E5%8D%94%E4%BC%9A%E4%B8%BB%E5%82%AC-%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B92026%E5%8F%82%E5%8A%A0%E8%80%85%E5%8B%9F%E9%9B%86/"}, {"label": "八丈島文化協会「ウインズフェスプレイベント末吉応援ミニコンサートのお知らせ」", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-ウインズフェスプレイベント末吉応援ミニコンサートのお知らせ/"}, {"label": "八丈島文化協会「八丈ウインズフェス（文化交流事業）」", "url": "https://8jobunka.jimdofree.com/%E4%B8%BB%E5%82%AC%E4%BA%8B%E6%A5%AD/%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B9-%E6%96%87%E5%8C%96%E4%BA%A4%E6%B5%81%E4%BA%8B%E6%A5%AD/"}, {"label": "写真:Pedroacevedo、CC BY-SA 4.0(Wikimedia Commons。切り抜いて使用)", "url": "https://commons.wikimedia.org/wiki/File:San-francisco-lesbian-gay-freedom-band-40th-anniversary-concert-band.jpg"}], "label": "文化", "audience": "島民", "thread_id": "t20260807-29", "followup": true, "id": "8cbdb7", "photo": {"type": "img", "src": "/img/kiji/8cbdb7.jpg?v=a9663b", "og": "/img/kiji/8cbdb7-og.jpg?v=a9663b", "s": "/img/kiji/8cbdb7-s.jpg?v=a9663b", "m": "/img/kiji/8cbdb7-m.jpg?v=a9663b", "caption": "資料写真:ホールで演奏する吹奏楽団(八丈島の催しの写真ではありません)", "credit": "", "file": "commons/San-francisco-lesbian-gay-freedom-band-40th-anniversary-concert-band.jpg"}}, {"headline": "星空ヨガ、今夏は全5回開催", "body": ["大賀郷のアロマ・ヨガ店「癒香」が西海岸で毎夏開く「星空ヨガ」は23日夜に今季の日程を終え、8月に組んだ5回をすべて開いた。天候しだいで中止になる屋外の催しで、癒香は同じ夜にXで「今年は全回無事に開催できました」と報告した。癒香は今年を開催12年目としている。", "癒香が7月5日に公式サイトで告知した日程は1日、9日、15日、22日、23日の5夜で、時間はいずれも19時から20時30分だった。参加費は3000円で、完全予約制をとる。雨の日は当日17時30分に予約者へ中止を個別に知らせる決まりになっていた。最終日の23日午後の投稿で、癒香は「今年は全5回達成なるでしょうか」と書いた。グループの予約が取り消されて空いた席は、当日の予約を受け付けた。", "予定の日程を開ききれなかった年もある。2024年の終了報告で癒香は、天候に左右されるため予定日のすべては開催できなかったと記していた。2023年は8月12日からの3回を予定していたが、告知の後に台風7号が八丈島を直撃する進路予報となった。癒香は当時、様子を見ながら開催するかどうかを予約者へ個別に連絡するとしていた。", "八丈島観光協会が2019年に載せた告知では「6年目」とされ、新月・上弦・満月・下弦の時期に合わせて8日程を組み、各回の定員を10人としていた。その後の日程は2022年が4回、2023年が3回、2025年と今年が5回だった。会場は西海岸、参加費は3000円で、どちらも2019年から変わっていない。癒香の代表は玉井由木子さんが務める。", "最終夜の23日は、国立天文台の暦によると20日の上弦から3日目で、28日の満月に向けて月が満ちていく時期だった。癒香の投稿にある「月明かりの中でも煌めく星」は、この明るい月のもとでの眺めになる。前夜の22日について癒香は、月の光と金星がそろった空だったと書いた。国立天文台によると、金星は今月、日の入り後の西の低い空で明るく輝き、15日に東方最大離角を迎えた。東方最大離角は、夕方の空で太陽から最も離れて見える時期を指す。"], "added": [{"fact": "今季の日程は8月1日、9日、15日、22日、23日の5夜で、時間は19時〜20時30分。参加費3000円の完全予約制で、雨天中止は当日17時30分に個別連絡。癒香はこの催しを開催12年目としている", "url": "https://yuko.8jyo.info/2026/07/05/2026-%E6%98%9F%E7%A9%BA%E3%83%A8%E3%82%AC%E9%96%8B%E5%82%AC%E3%81%8A%E7%9F%A5%E3%82%89%E3%81%9B-%EF%BD%9E%E6%98%9F%E7%A9%BA%E3%81%AB%E8%87%AA%E5%88%86%E3%82%92%E9%82%84%E3%81%99%E5%A4%9C%EF%BD%9E/"}, {"fact": "2024年の終了報告で、天候に左右されるため予定日のすべては開催できなかったと記している", "url": "https://yuko.8jyo.info/2024/08/25/%e6%98%9f%e7%a9%bayoga-%e7%b5%82%e4%ba%86%e3%81%ae%e3%81%94%e5%a0%b1%e5%91%8a/"}, {"fact": "2023年は8月12日、15日、18日の3回を予定していた", "url": "https://yuko.8jyo.info/2023/07/12/2023-%e6%98%9f%e7%a9%ba%e3%83%a8%e3%82%acin%e5%85%ab%e4%b8%88%e5%b3%b6-%e9%96%8b%e5%82%ac%e3%81%ae%e3%81%8a%e7%9f%a5%e3%82%89%e3%81%9b/"}, {"fact": "2023年8月9日の時点で、台風7号が八丈島を直撃する進路予報となり、開催するかどうかを予約者へ個別に連絡するとしていた", "url": "https://yuko.8jyo.info/2023/08/09/%e3%80%90%e6%9c%80%e6%96%b0%e3%80%91%e6%98%9f%e7%a9%ba%e3%83%a8%e3%82%ac%e3%81%94%e4%ba%88%e7%b4%84%e7%8a%b6%e6%b3%81%e3%81%ab%e3%81%a4%e3%81%84%e3%81%a6%f0%9f%8c%8c/"}, {"fact": "2019年の告知は「6年目」とし、月の満ち欠けに合わせた8日程、各回10人限定、参加費3000円で、会場は西海岸だった", "url": "https://www.hachijo.gr.jp/blogs/%E5%85%AB%E4%B8%88%E5%B3%B6%E6%98%9F%E7%A9%BAyoga%E2%98%852019/"}, {"fact": "2022年は8月12日、13日、20日、27日の4回を開いた", "url": "https://yuko.8jyo.info/2022/07/16/2022-%E6%98%9F%E7%A9%BA%E3%83%A8%E3%82%ACin%E5%85%AB%E4%B8%88%E5%B3%B6/"}, {"fact": "2025年は8月2日、9日、15日、16日、23日の5回だった", "url": "https://yuko.8jyo.info/2025/07/10/2025%E6%98%9F%E7%A9%BAyoga-%E9%96%8B%E5%82%AC-%EF%BD%9E%E4%BB%8A%E5%B9%B4%E3%82%82%E6%98%9F%E7%A9%BA%E3%81%AE%E4%B8%8B%E3%81%A7%EF%BD%9E/"}, {"fact": "癒香の代表は玉井由木子さんで、店は大賀郷にある", "url": "https://yuko.8jyo.info/staff/"}, {"fact": "2026年8月の上弦は20日11時46分、満月は28日13時19分（国立天文台の暦要項）", "url": "https://eco.mtk.nao.ac.jp/koyomi/yoko/2026/rekiyou263.html"}, {"fact": "金星は2026年8月、日の入り後の西の低空で明るく輝き、15日に東方最大離角となった", "url": "https://www.nao.ac.jp/astro/sky/2026/08.html"}], "sources": [{"label": "癒香", "url": "https://x.com/yukou8jo/status/2091492674499236316"}, {"label": "癒香公式サイト「2026 星空ヨガ開催お知らせ」", "url": "https://yuko.8jyo.info/2026/07/05/2026-%E6%98%9F%E7%A9%BA%E3%83%A8%E3%82%AC%E9%96%8B%E5%82%AC%E3%81%8A%E7%9F%A5%E3%82%89%E3%81%9B-%EF%BD%9E%E6%98%9F%E7%A9%BA%E3%81%AB%E8%87%AA%E5%88%86%E3%82%92%E9%82%84%E3%81%99%E5%A4%9C%EF%BD%9E/"}, {"label": "癒香公式サイト「星空YOGA 終了のご報告」", "url": "https://yuko.8jyo.info/2024/08/25/%e6%98%9f%e7%a9%bayoga-%e7%b5%82%e4%ba%86%e3%81%ae%e3%81%94%e5%a0%b1%e5%91%8a/"}, {"label": "癒香公 月を観測する予定だ。暦要項によると満月は28日の13時19分で、2回とも満月の前後にあたる。各回は19時に集まり、21時ごろに解散する。参加は無料で、定員は各日15人。申し込みはフォームか電話で受け付け、先着順で決める。小学生以下は保護者の同伴が必要で、講義があるため小学3年生以上を勧めている。天候によっては講義だけになる。問い合わせ先は同校定時制で、電話は04996-2-1181。"], "added": [{"fact": "20日の教室では天文部員と教員が講義をし、校舎4階の天体ドームで月とアルビレオを観察した後、学校前の大賀郷園地で夏の大三角などを観測した。同校はアルビレオを「白鳥座の頭の部分に位置する2重星」と説明している", "url": "https://www.metro.ed.jp/hachijo-he/news/2026/08/newsentry_136.html"}, {"fact": "国立天文台の暦要項では、2026年8月20日11時46分が上弦、28日13時19分が望（満月）", "url": "https://eco.mtk.nao.ac.jp/koyomi/yoko/2026/rekiyou263.html"}, {"fact": "案内では27・28日は月の観測。定員は各日15人の先着順で、天候によっては講義だけになる場合がある", "url": "https://www.metro.ed.jp/hachijo-he/assets/天体観測教室(夏)のお知らせ.pdf"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2090777687375958200"}, {"label": "都立八丈高等学校定時制「夏の天体観測教室」2026年8月21日", "url": "https://www.metro.ed.jp/hachijo-he/news/2026/08/newsentry_136.html"}, {"label": "都立八丈高等学校定時制「天体観測教室（夏）のお知らせ」PDF", "url": "https://www.metro.ed.jp/hachijo-he/assets/天体観測教室(夏)のお知らせ.pdf"}, {"label": "国立天文台「令和8年（2026）暦要項」", "url": "https://eco.mtk.nao.ac.jp/koyomi/yoko/2026/rekiyou263.html"}, {"label": "都立八丈高等学校定時制「夏の天体観測教室（第2回）」2025年8月", "url": "https://www.metro.ed.jp/hachijo-he/news/2025/08/newsentry_60.html"}], "label": "教育", "audience": "島民", "thread_id": "t20260803-14", "followup": true, "id": "3efecc", "photo": {"type": "img", "src": "/img/kiji/3efecc.jpg?v=c392b5", "og": "/img/kiji/3efecc-og.jpg?v=c392b5", "s": "/img/kiji/3efecc-s.jpg?v=c392b5", "m": "/img/kiji/3efecc-m.jpg?v=c392b5", "caption": "東京都・八丈町+八丈島の星空と夜景", "credit": "", "file": "ac/29272140.jpg"}}], "agenda": [{"date": "2026-08-24", "end": null, "text": "真夏の星空上映会（『マイマイ新子と千年の魔法』）", "url": "https://x.com/maimai_shinko/status/2083085588148985877"}, {"date": "2026-08-28", "end": null, "text": "神湊（底土）港の工事見学会", "url": "https://x.com/ogasawarashicho/status/2090698597444505825"}, {"date": "2026-08-31", "end": null, "text": "乙千代ヶ浜プールの撤収作業", "url": "https://x.com/tomijiro8jo/status/2094400733936578857"}], "letters"     const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}

      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
