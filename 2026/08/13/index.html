<script type="application/json" id="edition">{"date": "2026-08-13", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-26T18:50:10+09:00", "prev": "/2026/08/12/", "next": "/2026/08/14/", "alerts": [], "weather": {"issued": "2026-08-13T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 30}]}, "koyomi": {"sunrise": "5:02", "sunset": "18:30", "moon": 29.3, "tide": {"place": "八丈島(神湊)", "high": [["4:46", 153], ["18:23", 148]], "low": [["11:31", 15], ["23:51", 79]]}}, "unko": null, "sora": {"status": "条件付きの可能性", "reason": "視界不良", "url": "https://x.com/ANA_flight_info/status/2087460329034826062", "at": "2026-08-12T17:45:00+09:00"}, "number": null, "top": {"headline": "ムロアジ漁 8月に始まる", "body": ["島のムロアジ漁が8月に始まった。東京都八丈支庁の「八丈島水産だより」8月号が伝えた。同号は海のルールとマナーのほか、八丈島漁業協同組合女性部が島外の学校給食向けに作ったキハダマグロのミンチを、温度を記録しながら運んでいることも載せている。", "ムロアジは、島では主にくさやの原料になる。漁は長い竹を使う棒受け網漁で行う。棒受け網漁は、群れを船の周りに寄せて網ですくい上げる漁だ。8月号によると、例年8月の初めは体長20センチほどの小型の魚が中心になる。昨年度は30センチを超える魚が漁期の前半から揚がっていた。", "漁が始まる前の6月と7月は、昨年度に好調だったキンメダイの水揚げが伸びなかった。ハマダイは好調だった。漁師は漁場と魚種を考えて操業していると同号は説明している。", "キハダミンチは、島の近海で獲れたキハダマグロをさばいてミンチにし、真空パックで冷凍したもの。支庁が6月号で新商品として紹介した。協同組合関東給食会と組んで、島外の学校給食に売り込む。女性部は2005年度から、ムロアジやトビウオ、メダイをミンチや切り身にして都内の学校給食に届けてきた。キハダミンチはこの取り組みに加わる新しい品目になる。", "8月号は「安心・安全な商品を！」の運送編として、島から送るまでの流れを載せた。商品は冷凍コンテナに入れ、船とトラックで運ぶ。運ぶ間は、温度を自動で記録する機器「データロガー」を商品と一緒に積み、内地の倉庫に着くまでの温度を管理する。前の7月号では、温度測定や簡易検査の様子を伝えていた。"], "added": [{"fact": "例年8月初めは体長20センチ程度の小型魚が中心で、昨年度は30センチを超える魚が前半から漁獲されていた（2026年8月号）", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_8"}, {"fact": "6・7月は昨年度好調だったキンメダイの水揚げが伸び悩み、ハマダイが好調だった。漁師は漁場や魚種を考えて操業している（2026年8月号）", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_8"}, {"fact": "キハダミンチは冷凍コンテナに入れて船とトラックで運び、データロガーを商品と一緒に運んで内地の倉庫までの温度を管理する。協同組合関東給食会と連携（2026年8月号「安心・安全な商品を!運送編」）", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_8"}, {"fact": "キハダミンチは近海で獲れたキハダマグロをさばいてミンチにし、真空パックで冷凍した島外の学校給食向けの新商品（2026年6月号）", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_6"}, {"fact": "漁協女性部が加工した品は関東給食会と連携して販売していく予定（2026年5月号）", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_5"}, {"fact": "7月号の「安心・安全な商品を!」で温度測定・簡易検査の様子を掲載", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_7"}, {"fact": "女性部はムロアジ・トビウオ・メダイをミンチや切り身に加工して都内の学校給食に届けており、平成17年度（2005年度）から続いている", "url": "https://www.soumu.metro.tokyo.lg.jp/09hatijou/g/office-introduction/shigoto_suisan.html"}, {"fact": "ムロアジ漁は長い竹を使った棒受け網漁で行う", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/4775_suisan2020_08"}, {"fact": "八丈ではムロアジは主にくさやの原料になる。棒受け網漁は群れを船の周りに寄せ、網で群れごとすくい上げる", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2025_9"}], "figure": null, "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2087441129302020470"}, {"label": "八丈島水産だより 2026年8月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_8"}, {"label": "八丈島水産だより 2026年7月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_7"}, {"label": "八丈島水産だより 2026年6月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_6"}, {"label": "八丈島水産だより 2026年5月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_5"}, {"label": "八丈島水産だより 2025年9月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2025_9"}, {"label": "八丈島水産だより 2020年8月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/4775_suisan2020_08"}, {"label": "東京都八丈支庁 水産の仕事", "url": "https://www.soumu.metro.tokyo.lg.jp/09hatijou/g/office-introduction/shigoto_suisan.html"}], "label": "産業", "audience": "島民", "thread_id": "t20260813-49", "id": "a808e6", "photo": {"type": "img", "src": "/img/kiji/a808e6.jpg?v=a13202", "og": "/img/kiji/a808e6-og.jpg?v=a13202", "s": "/img/kiji/a808e6-s.jpg?v=a13202", "m": "/img/kiji/a808e6-m.jpg?v=a13202", "caption": "むろあじ アジ 魚 群れ 水族館 群衆", "credit": "", "file": "ac/32276103.jpg"}}, "side": [], "shorts": [{"headline": "青ヶ島へ13日に臨時便", "body": ["八丈島と青ヶ島を結ぶ伊豆諸島開発株式会社は12日、くろしお丸を13日に臨時運航する予定だと知らせた。八丈島を9時30分に出て、青ヶ島を12時50分に出る。12日は運休日で船は出ず、2日から12日までの11日間、青ヶ島への船は1便も出ていない。", "運航するかどうかは、同社が13日6時30分ごろに決める。青ヶ島への船が最後に出たのは1日で、八重根漁港を9時30分に出た便だった。13日に出れば1日以来の運航となり、お盆の入りに青ヶ島との間で人と荷物が動く。", "同社の運航状況によると、11日間のうち2日・6日・10日・12日は運休日で、ほかの日は欠航だった。同社は1日夜、台風13号の影響で海上不良が見込まれるとして、2日と6日を運休日、3〜5日を全便欠航とすると知らせた。7日は台風13号の影響で、9日は海上不良で欠航した。8日と11日の欠航の理由は示されていない。", "東京からの船も12日は着かなかった。八丈島観光協会によると、東海汽船の11日夜竹芝発（12日朝八丈島着）の便が欠航した。東京からの船は11日から2日続けて欠航し、最後に着いたのは10日だった。6日から12日までの7日間では、着いた日が4日、欠航が3日だった。", "空の便では、同協会は12日朝、ANAの羽田—八丈島線の1便（ANA1891便）は条件付きで運航すると案内した。2便（ANA1893便）と3便（ANA1895便）は天候の状況を確かめていると案内した。"], "added": [{"fact": "伊豆諸島開発は12日9時14分ごろ、13日にくろしお丸を八丈島9時30分発・青ヶ島12時50分発で臨時運航すると知らせた", "url": "https://x.com/izu_shibaura/status/2087331732592947596"}, {"fact": "同社は12日9時18分ごろ、13日の八丈島/青ヶ島航路の臨時運航を予定しており、就航か欠航かは当日6時30分ごろに決めると知らせた", "url": "https://x.com/izu_shibaura/status/2087332945862525136"}, {"fact": "同社は1日19時ごろ、台風13号の影響による海上不良が見込まれるため、八丈島/青ヶ島航路を2日運休日、3〜5日全便欠航、6日運休日とすると知らせた", "url": "https://x.com/izu_shibaura/status/2083493651930652786"}, {"fact": "同社は7日朝、台風13号の影響によりくろしお丸の青ヶ島航路が欠航と知らせた", "url": "https://x.com/izu_shibaura/status/2085472976661782667"}, {"fact": "同社は9日朝、くろしお丸の八丈島9時30分発・青ヶ島12時50分発が海上不良のため欠航となったと知らせた", "url": "https://x.com/izu_shibaura/status/2086239582191014232"}], "sources": [{"label": "伊豆諸島開発", "url": "https://x.com/izu_shibaura/status/2087289276728045858"}, {"label": "八丈島観光協会", "url": "https://x.com/Go_Hachijo_JP/status/2087315206326362588"}, {"label": "伊豆諸島開発 13日臨時運航", "url": "https://x.com/izu_shibaura/status/2087331732592947596"}, {"label": "伊豆諸島開発 13日臨時運航の判断時刻", "url": "https://x.com/izu_shibaura/status/2087332945862525136"}, {"label": "伊豆諸島開発 台風13号による運航", "url": "https://x.com/izu_shibaura/status/2083493651930652786"}, {"label": "伊豆諸島開発 8月7日の運航状況", "url": "https://x.com/izu_shibaura/status/2085472976661782667"}, {"label": "伊豆諸島開発 8月9日の運航状況", "url": "https://x.com/izu_shibaura/status/2086239582191014232"}], "label": "くらし", "audience": "両方", "thread_id": "t20260802-7", "followup": true, "id": "8a333e", "photo": {"type": "img", "src": "/img/kiji/8a333e.jpg?v=f9d623", "og": "/img/kiji/8a333e-og.jpg?v=f9d623", "s": "/img/kiji/8a333e-s.jpg?v=f9d623", "m": "/img/kiji/8a333e-m.jpg?v=f9d623", "caption": "青ヶ島の尾山展望公園からの二重カルデラ", "credit": "", "file": "ac/29220104.jpg"}}, {"headline": "海遊びにライフジャケット着用", "body": ["警視庁八丈島警察署は12日、八丈町の防災無線を通じ、釣りや海遊びではライフジャケットを着けるよう呼びかけた。海水浴の前には、遊泳区域と遊泳表示を確かめるよう求めた。同じ内容の放送は2日と10日にも流れ、8月に入って3回目となる。", "呼びかけの前後には、海の警報や注意報も出ている。町によると、4日には台風13号の接近で波浪警報が出され、6日にも波浪注意報が出された。同署は7月4日にも、例年水難事故が起きているとして、海水浴や釣りでのライフジャケット着用を呼びかけていた。", "遊泳表示は旗の色で示される。町の広報はちじょう2023年7月号によると、赤旗は遊泳禁止、黄旗は遊泳注意、青旗は遊泳可能を表す。八丈島観光協会は10日から12日にかけて、三根の底土、大賀郷の旧八重根とヤケンヶ浜、末吉の乙千代ヶ浜の旗の色を知らせた。", "観光協会によると、12日8時30分の時点で底土が黄旗、旧八重根・ヤケンヶ浜・乙千代ヶ浜は赤旗だった。11日朝は4か所とも赤旗で、泳げたのは底土の「どうだまり」と呼ばれる腰の高さほどの区域だけだった。10日午後は、どうだまりも遊泳禁止となった。", "同署はホームページで、島は黒潮に面し、見た目より流れの速い所があると説明している。決められた場所の外で泳ぐのは危険で、急に深くなる浜もある。釣りでは、穏やかな日でも1時間に1、2度は大きな波が来るとして、海に背を向けないことを求め、ライフジャケットと磯靴を持つよう呼びかけている。酒を飲んだ後に泳がないことも求めている。"], "added": [{"fact": "同じ八丈島警察署の海のレジャーの注意事項が8月2日と10日にも防災八丈で放送されていた", "url": "https://x.com/HachijoTown/status/2083704332910751790"}, {"fact": "8月10日9時にも同じ内容の放送", "url": "https://x.com/HachijoTown/status/2086603436146164098"}, {"fact": "7月4日、八丈島警察署が例年水難事故が発生しているとして海水浴・釣りでのライフジャケット着用を呼びかけた", "url": "https://x.com/HachijoTown/status/2073195090265427978"}, {"fact": "8月4日、台風13号の接近で八丈町に波浪警報が発表された", "url": "https://x.com/HachijoTown/status/2084460562784845914"}, {"fact": "8月6日、波浪注意報が発表された", "url": "https://x.com/HachijoTown/status/2085282227253051513"}, {"fact": "赤旗は遊泳禁止、黄旗は遊泳注意、青旗は遊泳可能（広報はちじょう2023年7月号表紙）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23122655/hachijo2307.pdf"}, {"fact": "12日8時30分、底土は黄旗、旧八重根・ヤケンヶ浜・乙千代ヶ浜（湾内・池）は赤旗", "url": "https://x.com/go_hachijo_jp/status/2087322168128647199"}, {"fact": "11日8時20分、4か所とも赤旗で、底土どうだまりエリア（腰高の海水浴場）のみ遊泳可能", "url": "https://x.com/go_hachijo_jp/status/2086955907230085472"}, {"fact": "10日13時、底土どうだまりエリアも遊泳禁止", "url": "https://x.com/go_hachijo_jp/status/2086664201385500714"}, {"fact": "八丈島警察署のページで、黒潮に面し流れが速い所がある、決められた場所以外の海水浴は危険、急に深くなる浜がある、釣りでは1時間に1〜2回大きな波が来る、ライフジャケットと磯靴、飲酒後の遊泳をしないこと", "url": "https://www.keishicho.metro.tokyo.lg.jp/about_mpd/shokai/ichiran/kankatsu/hachijojima/about_ps/kouko.html"}], "sources": [{"label": "八丈町", "url": "https://x.com/HachijoTown/status/2087328213903048744"}, {"label": "広報はちじょう2023年7月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23122655/hachijo2307.pdf"}, {"label": "八丈島観光協会 海況案内 8月12日", "url": "https://x.com/go_hachijo_jp/status/2087322168128647199"}, {"label": "警視庁八丈島警察署", "url": "https://www.keishicho.metro.tokyo.lg.jp/about_mpd/shokai/ichiran/kankatsu/hachijojima/about_ps/kouko.html"}], "label": "くらし", "audience": "両方", "thread_id": "t20260813-50", "id": "67400e", "photo": {"type": "img", "src": "/img/kiji/67400e.jpg?v=5719a3", "og": "/img/kiji/67400e-og.jpg?v=5719a3", "s": "/img/kiji/67400e-s.jpg?v=5719a3", "m": "/img/kiji/67400e-m.jpg?v=5719a3", "caption": "八丈島 底土海水浴場", "credit": "", "file": "ac/2501637.jpg"}}, {"headline": "女子バレー部、延泊中に練習試合", "body": ["都立八丈高校の女子バレーボール部は12日、台風15号の影響で島に戻れないまま、内地で松が谷高校と練習試合をし、8セットを戦った。同校によると、この日は延泊の1日目で、合宿は5日目だった。松が谷高校とは急に話がまとまり、試合を組んだ。延泊は13日も続く。", "八丈島観光協会によると、東海汽船株式会社の橘丸は、12日夜竹芝発（13日朝八丈島着）の便を条件付きで運航すると案内した。海上や港内の状況によっては接岸できない場合があるという条件である。その前の11日夜竹芝発（12日朝八丈島着）の便は欠航した。全日本空輸（ANA）の羽田—八丈島線は12日、1便から3便までが八丈島に着いた。同部がいつ、どの便で帰島するかは、同校から示されていない。"], "added": [{"fact": "八丈島観光協会は12日17時17分、12日22時30分竹芝発の橘丸が、海上・港内の状況などで接岸できない場合がある条件付きの運航になると案内した", "url": "https://x.com/Go_Hachijo_JP/status/2087453492663513363"}, {"fact": "12日はANAの羽田—八丈島線の1便（ANA1891便）、2便（ANA1893便）、3便（ANA1895便）が八丈島に到着した", "url": "https://x.com/Go_Hachijo_JP/status/2087453303013880200" function figure(f){
  if(!f) return "";
  const cap = `<figcaption>${esc(f.caption)}${f.credit?`(${esc(f.credit)})`:""}</figcaption>`;
  if(f.type==="svg") return `<figure class="zu-fig">${f.svg}${cap}</figure>`;
  if(f.type==="table") return `<figure class="zu-fig zu-tbl"><p class="zt-h">${esc(f.title)}</p><table>${f.rows.map(([k,v,w])=>`<tr><th>${esc(k)}</th><td class="${w?"warn":""}">${esc(v)}</td></tr>`).join("")}</table>${cap}</figure>`;
  return `<figure><div class="photo"><img src="${esc(f.src)}" alt="${esc(f.caption)}" loading="lazy"></div></figure>`;   
}

function ichigyo(w){

  return [ten,kaze,d.max!=null?`${esc(d.max)}<span class="deg">°C</span>`:""].filter(Boolean).join(" ");
}

const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){

}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
