<script type="application/json" id="edition">{"date": "2026-08-22", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-28T17:35:26+09:00", "prev": "/2026/08/21/", "next": "/2026/08/23/", "alerts": [], "weather": {"issued": "2026-08-22T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 31}]}, "koyomi": {"sunrise": "5:08", "sunset": "18:20", "moon": 8.8, "tide": {"place": "八丈島(神湊)", "high": [["15:52", 122], ["23:11", 123]], "low": [["6:40", 65], ["19:05", 120]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "台風18号でははじま丸欠航", "body": ["伊豆諸島開発は21日、台風18号の影響で海が荒れる見込みだとして、父島と母島を結ぶははじま丸を24日と25日に欠航にすると発表した。23日はもともとの運休日で、3日続けて船が出ない。同社が八丈島—青ヶ島間で運航するくろしお丸と、東海汽船の八丈島航路では、22日未明までに運航を変えるという発表は確認できなかった。", "台風の予報では、中心は八丈島から遠い南の海上を西へ進む。ウェザーニュースが21日15時51分に配信した予報によると、台風18号は21日15時にマリアナ諸島付近を北北西へ時速20キロで進んでいた。中心気圧は975ヘクトパスカルだった。23〜24日に中心気圧925ヘクトパスカル、最大風速50メートルの非常に強い勢力まで発達し、25日ごろ大東島地方付近を通り、26日には沖縄本島にかなり近づくとみられている。同じ記事が伝えた気象庁の確率は、5日以内に台風の暴風域に入る見込みを地域別に示したものである。大東島地方が62％、奄美地方が50％、小笠原諸島が19％で、伊豆諸島は表に入っていない。前回の本紙記事で伝えた20日15時の確率では、小笠原諸島は43％だった。複数の予測計算は紀伊半島の南の海上まではほぼ一致している。その先は西へ進んで沖縄に向かう予測がやや多いが、北へ向きを変えて九州や朝鮮半島に向かう予測もあるという。", "八丈島でも、海の状態を理由にした予定の変更がある。東京都は21日16時すぎにXで、24日に予定していた底土港のケーソン据え付け工事の見学会を、「海象不良」のため28日に延期すると知らせた。時間と場所は変えない。投稿は台風に触れておらず、据え付け作業そのものの日程は示していない。", "島への物資の船について、東海汽船貨物部の運航日カレンダーを見ると、八丈島行きの貨物船は22日に東京・芝浦を出て23日に着く予定である。その次は25日に東京を出て26日に着く。本紙の計算では、15日から21日までの7日間、東京からの客船は欠航なく毎日八丈島に着いた。"], "added": [{"fact": "21日15時の台風18号はマリアナ諸島付近を北北西へ時速20キロで進み、中心気圧975hPaだった。23〜24日に925hPa・最大風速50m/sまで発達し、25日ごろ大東島地方付近、26日に沖縄本島へ接近する予想。気象庁の5日以内に暴風域に入る確率は大東島地方62％、奄美地方50％、小笠原諸島19％などで、伊豆諸島は表にない。進路の予測は紀伊半島の南まではほぼ一致し、その先は西へ進む予測がやや多い（ウェザーニュース、21日15時51分配信）", "url": "https://weathernews.jp/news/202608/210161/"}, {"fact": "東京都は21日16時12分にXで、神湊（底土）港の工事見学会を海象不良のため24日から28日に延期すると知らせた。時間と場所は変更なし。投稿に台風への言及はない", "url": "https://x.com/i/status/2090698597444505825"}, {"fact": "東海汽船貨物部の2026年8・9月運航日カレンダーでは、八丈島行きの貨物船は8月22日・25日・27日・29日に東京・芝浦を出る。島に着くのは、それぞれ翌日", "url": "https://www.tokaikisen.co.jp/wordpress/wp-content/uploads/2026/08/9c38427bcf0cfa895cae784fe4eea7ba.pdf"}], "figure": {"type": "period", "start": "2026-08-23", "end": "2026-08-25", "label": "ははじま丸の運休・欠航"}, "sources": [{"label": "伊豆諸島開発", "url": "https://x.com/izu_shibaura/status/2090707034048196681"}, {"label": "ウェザーニュース", "url": "https://weathernews.jp/news/202608/210161/"}, {"label": "東京都", "url": "https://x.com/i/status/2090698597444505825"}, {"label": "東海汽船貨物部", "url": "https://www.tokaikisen.co.jp/wordpress/wp-content/uploads/2026/08/9c38427bcf0cfa895cae784fe4eea7ba.pdf"}, {"label": "本紙既報", "url": "https://weathernews.jp/news/202608/200191/"}], "label": "くらし", "audience": "両方", "thread_id": "t20260821-80", "followup": true, "id": "b6edbc", "photo": {"type": "img", "src": "/img/kiji/b6edbc.jpg?v=54beab", "og": "/img/kiji/b6edbc-og.jpg?v=54beab", "s": "/img/kiji/b6edbc-s.jpg?v=54beab", "m": "/img/kiji/b6edbc-m.jpg?v=54beab", "caption": "船上から望む底土港", "credit": "", "file": "ac/34534781.jpg"}}, "side": [], "shorts": [{"headline": "末吉盆踊り、形を変え14日開催", "body": ["末吉地区の盆踊りが14日夜に開かれた。地元で「末盆」と呼ばれる行事だ。今年は八丈島観光協会の盆踊り案内に末吉が載っていなかった。浅沼碧海町議は17日、来場者への礼とともに「形は変わりながらも、なんとか今年も開催する事が出来ました」とXに書いた。何をどう変えたのかは示していない。", "町議の投稿には開催日がない。盆バンドで演奏した参加者が14日朝に「本日末吉盆踊りです」と投稿し、同じ日の夜には来場者が会場から投稿している。来場者の投稿によると、焼きそばは無料でふるまわれた。末吉のカフェライトハウスによると、同店はキッチンカー「はしる！とみじろう」の隣に出店した。盆バンドの参加者は、移住した人やお盆で帰省した人、島に住んでいない人も最後まで片付けを手伝っていたと振り返った。", "観光協会が7月1日に載せた今年の案内は、三根・大賀郷・樫立・中之郷の4地区の日程だけで、末吉の名前はない。昨年の案内では末吉は8月14日18時30分から末吉運動場で開くとあり、2018年と19年の案内では会場が旧末吉小学校の校庭、雨天時は末吉公民館だった。今年載らなかった理由は案内に書かれていない。本紙も11日の記事で、この案内に沿って4地区の日程だけを伝えた。", "末吉は、昨年10月の台風22号・23号で大規模な土砂災害が起きた地区だ。町は3月に示した施政方針で、旧末吉小学校を改装した八丈島の海・山・暮らし館まで大量の土砂が流れ込んだと説明した。島全体で推計約3万トンのがれきや倒木、12万トンの土砂が出ており、「末吉屋外運動場」や南原スポーツ公園、各地域の仮置き場に集められていると記している。町は22号の通過翌日の昨年10月10日にも、旧末吉小学校の校庭に災害廃棄物の仮置き場を設けると放送していた。例年末吉運動場で開く末吉自治会のゲートボール大会も、今年は時期を変えて富士ゲートボール場で開かれたと町が7月に伝えている。ただ、盆踊りの会場や変更点がこうした事情と関係するのかどうかは、主催側の発信では示されていない。", "末吉へ通じる都道も元通りになっていない。東京都によると、三根と末吉を結ぶ登龍道路は台風のあとの通行止めが4月24日に解除されたが、6月8日に一部で土砂崩れが起き、再び通行止めになった。8月6日の時点でも通行止めは続いている。もう一本の汐間道路は、台風が近づくたびに通行止めになっている。直近では4日から通行止めになり、6日9時30分に解除された。", "八丈島文化協会は21日朝、同日15時から末吉公会堂で「末吉応援ミニコンサート」を開くとXで告知していた。23日に大賀郷の八丈町多目的ホール「おじゃれ」で開く吹奏楽の演奏会「八丈ウインズフェス2026」に先立つ催しだ。ゲスト3人が、このコンサートのために編曲した1曲を含む3曲を演奏するとしていた。22日朝までに協会は開催の報告を出しておらず、来場者数、曲名、ゲストの名前、末吉を「応援」する理由は分かっていない。ウインズフェスの本番は23日14時に開演する。"], "added": [{"fact": "八丈島観光協会が7月1日に公開した2026年の盆踊り案内には、三根・大賀郷・樫立・中之郷の4地区だけが載り、末吉の記載はない。理由も書かれていない", "url": "https://hachijo.gr.jp/blogs/bon-odori_2026/"}, {"fact": "2025年の同協会の案内では、末吉盆踊りは8月14日18時30分から末吉運動場で開くとされていた", "url": "https://hachijo.gr.jp/blogs/bon-odori_2025/"}, {"fact": "2019年の同協会の案内では、末吉盆踊りの会場は旧末吉小学校の校庭、雨天時は末吉公民館だった。2018年も同じ", "url": "https://www.hachijo.gr.jp/blogs/%E5%85%AB%E4%B8%88%E5%B3%B6%E5%90%84%E5%9C%B0%E5%8C%BA%E3%80%90%E7%9B%86%E8%B8%8A%E3%82%8A%E3%80%91%E3%81%AE%E3%81%94%E6%A1%88%E5%86%85%E3%80%80813%E7%81%AB%EF%BD%9E15%E6%9C%A8/"}, {"fact": "盆バンドの参加者が14日朝に「本日末吉盆踊りです」と投稿しており、今年の末吉盆踊りは14日夜に開かれたと確認できる", "url": "https://x.com/hachijoyoshino/status/2088066627632091262"}, {"fact": "14日夜に来場者が末吉盆踊りの会場から投稿し、焼きそばが無料だったと書いている", "url": "https://x.com/harurin_yu9/status/2088203932392972471"}, {"fact": "末吉のカフェライトハウスが、キッチンカー「はしる！とみじろう」の隣に出店したと投稿した", "url": "https://x.com/sueyoshirapsodi/status/2089110024744563151"}, {"fact": "町の令和8年度施政方針は、台風で末吉に大規模な土砂災害が起き、海・山・暮らし館まで土砂が流れ込んだと説明している。推計約3万トンのがれき・倒木類と12万トンの土砂が、末吉屋外運動場や南原スポーツ公園などに集められているとも記している", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/r7-houshin/"}, {"fact": "町は2025年10月10日、旧末吉小学校の校庭に台風22号の災害廃棄物の仮置き場を設けると放送した", "url": "https://x.com/hachijotown/status/1976479045090148514"}, {"fact": "例年末吉運動場で開く末吉自治会ゲートボール大会は、2026年は時期を変えて富士ゲートボール場で開かれた", "url": "https://x.com/hachijomachi/status/2075892803889160236"}, {"fact": "登龍道路は4月24日に台風後の通行止めが解除されたが、6月8日に一部で土砂崩れが起き、再び通行止めになった", "url": "https://x.com/ogasawarashicho/status/2063777823152574749"}], "sources": [{"label": "浅沼碧海町議", "url": "https://x.com/aomi_asa/status/2089112253555740720"}, {"label": "八丈島文化協会", "url": "https://x.com/8jobunka/status/2090607383575933116"}, {"label": "盆バンド参加者のX", "url": "https://x.com/hachijoyoshino/status/2088066627632091262"}, {"label": "来場者のX", "url": "https://x.com/harurin_yu9/status/2088203932392972471"}, {"label": "カフェライトハウスのX", "url": "https://x.com/sueyoshirapsodi/status/2089110024744563151"}, {"label": "八丈島観光協会", "url": "https://hachijo.gr.jp/blogs/bon-odori_2026/"}], "label": "文化", "audience": "島民", "thread_id": "t20260807-29", "followup": true, "id": "d3a9e1", "photo": {"type": "img", "src": "/img/kiji/d3a9e1.jpg?v=67746d", "og": "/img/kiji/d3a9e1-og.jpg?v=67746d", "s": "/img/kiji/d3a9e1-s.jpg?v=67746d", "m": "/img/kiji/d3a9e1-m.jpg?v=67746d", "caption": "八丈島灯台", "credit": "", "file": "ac/3186617.jpg"}}, {"headline": "離島甲子園、八丈島から優秀選手", "body": ["島根県隠岐の島町で開かれた第17回全国離島交流中学生野球大会（離島甲子園）で、八丈島選抜の選手が優秀選手賞に選ばれた。八丈町が21日、公式Xで伝えた。賞は20日、大会を締めくくる「さよならパーティー」で発表された。町は「大会参加22チーム中4名の選出」と書き添えている。チームは2戦2敗で大会を終えたが、全国の22チームのなかから個人の働きが評価されたことになる。選手団は21日に帰島した。", "この「4名」は、大会全体で選ばれた受賞者の数である。八丈島選抜から4人が選ばれたわけではない。山陰中央新報は20日、地元の隠岐の島あんやらーずの投手も優秀選手に選ばれたと報じている。同チームは3位だった。町の投稿には、受賞した八丈島の選手の氏名、学年、選ばれた理由は書かれていない。大会の公式サイトにも、選考の基準は示されていない。", "優秀選手賞は、上位のチームだけに贈られる賞ではない。奄美大島で開かれた2023年の第14回大会では、奄美市選抜から1人、3位の瀬戸内町選抜から1人が選ばれたと南海日日新聞が伝えている。少ない枠を、成績の異なる複数のチームの選手が分け合う形になっている。", "八丈島選抜は女子選手も加わる男女混合のチームで、試合では苦戦が続いた。18日の初戦では、のちに優勝する壱岐市選抜（長崎県）に0-28で敗れた。19日には勝ち抜き戦とは別に組まれた交流戦で、三重県鳥羽市のTOBA BLUE OCEANSにも敗れた。決勝は20日に行われ、壱岐市選抜が対馬ヤマネコボーイズ（長崎県対馬市）を4-1で破った。", "町によると、次回の大会は鳥羽市で開かれる。交流戦で対戦したTOBA BLUE OCEANSの地元である。開催の時期は示されていない。八丈島の選抜は2008年の第1回大会から出場を続けている。広報はちじょうによると、今回と同じ隠岐の島町が会場だった2009年の第2回大会でも、2戦2敗だった。"], "added": [{"fact": "優秀選手賞の「22チーム中4名」は大会全体の受賞者数。山陰中央新報（20日19時掲載）は、地元の隠岐の島あんやらーず（3位）の五箇中の投手も優秀選手に選ばれたと報じた", "url": "https://www.sanin-chuo.co.jp/articles/-/1064307"}, {"fact": "2023年の第14回大会（奄美大島）では、奄美市選抜と3位の瀬戸内町選抜から1人ずつが優秀選手賞に選ばれた。賞は上位チームに限られず、複数のチームの選手が少ない枠を分け合っている", "url": "https://www.nankainn.com/news/sports/%E5%A3%B1%E5%B2%90%E5%B8%82%E9%81%B8%E6%8A%9C%E5%84%AA%E5%8B%9D%E3%80%81%E5%A5%84%E7%BE%8E%E5%8B%A2%E3%82%82%E6%B4%BB%E8%BA%8D-%E9%9B%A2%E5%B3%B6%E7%94%B2%E5%AD%90%E5%9C%92%E9%96%89%E4%BC%9A"}, {"fact": "町の投稿によると、次回大会は交流戦で対戦したTOBA BLUE OCEANSの地元、三重県鳥羽市で開かれる。開催時期の記載はない", "url": "https://x.com/hachijomachi/status/2090654911382114390"}], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2090654911382114390"}, {"label": "山陰中央新報", "url": "https://www.sanin-chuo.co.jp/articles/-/1064307"}, {"label": "南海日日新聞", "url": "https://www.nankainn.com/news/sports/%E5%A3%B1%E5%B2%90%E5%B8%82%E9%81%B8%E6%8A%9C%E5%84%AA%E5%8B%9D%E3%80%81%E5%A5%84%E7%BE%8E%E5%8B%A2%E3%82%82%E6%B4%BB%E8%BA%8D-%E9%9B%A2%E5%B3%B6%E7%94%B2%E5%AD%90%E5%9C%92%E9%96%89%E4%BC%9A"}, {"label": "隠岐びとチャンネル", "url": "https://www.okibito.jp/post-12812/"}, {"label": "全国離島交流中学生野球大会実行委員会", "url": "https://www.rito-koshien.net/archives.html"}, {"label": "広報はちじょう2009年9月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23144917/hachijo0909.pdf"}, {"label": "写真:Snap55、CC BY 3.0(Wikimedia Commons。切り抜いて使用)", "url": "https://commons.wikimedia.org/wiki/File:Rosoku-is.jpg"}], "label": "教育", "audience": "島民", "thread_id": "t20260808-33", "followup": true, "id": "f98c27", "photo": {"type": "img", "src": "/img/kiji/f98c27.jpg?v=cb4114", "og": "/img/kiji/f98c27-og.jpg?v=cb4114", "s": "/img/kiji/f98c27-s.jpg?v=cb4114", "m": "/img/kiji/f98c27-m.jpg?v=cb4114", "caption": "隠岐の島町のローソク島", "credit": "", "file": "commons/Rosoku-is.jpg"}}, {"headline": "島しょの小学生、都心で合同体験", "body": ["大島から小笠原までの島しょ9町村の小学4～6年生が都内で合同体験をする「多摩・島しょ子ども体験塾」に、八丈島の子どもたちが参加している。八丈町のXによると、子どもたちは20日に出発式を終えて島を発った。21日はスモールワールズを見学し、劇団四季「ライオンキング」を観劇して、夜はテーブルマナーを学びながら夕食をとった。", "この事業は、9町村でつくる「多摩・島しょ子ども体験塾島しょブロック実行委員会」の「感動体験事業」で、11島の子どもが合同で博物館見学やミュージカル観劇、ホテルでの食事マナー講座を体験する。名前にある「多摩・島しょ」は、東京都市長会と東京都町村会が市町村の連携事業に出す助成金の名称から来ている。この事業に多摩地域の自治体は加わっておらず、子どもたちが一緒に行動する「他の地域の子ども」は、ほかの島の子どもを指す。実行委員会は目的を、都会にしかないミュージアムや観劇に触れる機会が少ない島の子どもに内地の文化や芸術を直接体験させ、団体行動を通じて社会性と協調性を育てることだと説明している。", "町の投稿によると、子どもたちは20日夕方、宿泊先である港区海岸の島嶼会館に着いた。家族と離れて最初は不安そうだったが、到着したころには元気いっぱいだったという。21日午前のスモールワールズでは、ミニチュアの街や乗り物を見ながらSDGsについて学んだ。町の投稿は、八丈島から何人が参加したかには触れていない。", "子ども体験塾として出る助成は、経費の8割で年1200万円が上限となっている。2026年度の計画一覧では、実行委員会は上限と同じ1200万円を申請していた。今の形の事業は2022年度に始まり、今年で5年目になる。八丈町は2026年度当初予算に「こども体験塾負担金」として194万3千円を計上した。2025年度も当初予算は同じ額だったが、3月の最終補正予算で161万8千円を減額している。", "市長会と町村会の実施報告書によると、2025年度は児童136人と引率21人の計157人が参加した。上野の国立科学博物館や東京スカイツリー、スモールワールズ、ライオンキング、インターコンチネンタル東京ベイでの食事を回り、アンケートでは91.9％が満足と答えた。それでも実行委員会の自己評価は70％にとどまった。報告書は、夜遅くまで起きている児童がいて引率者が見回ったこと、食事を残す児童が多いと保健師から連絡があったことを挙げる。最も注意していたアレルギー食の提供でも問題が起き、提供した側から説明を受けたと記している。2024年度の参加児童も136人で、このときは青ヶ島村から参加を希望する児童がおらず、村の子どもは参加しなかった。", "報告書は2026年度の変更点も示している。課題として残った「島の未来を見据えた人材育成」を補うため、江戸の歴史や当時の伊豆諸島とのつながりを学べる江戸東京博物館を見学先に加えるという。町村の枠を超えて班を組み、島どうしで交流する仕組みは続ける。", "島の小学生を都内へ送る取り組みは、今の助成の形になる前から続いてきた。広報はちじょう2011年10月号によると、この年は8月17～20日に島内の小学5年生28人が参加し、羽田空港の国際線ターミナルや日本科学未来館などを見学した。ライオンキングの観劇もこのときから行程に入っていた。"], "added": [{"fact": "体験塾は島しょ9町村でつくる『多摩・島しょ子ども体験塾島しょブロック実行委員会』の感動体験事業で、対象は11島の小学4～6年生。目的は、ミュージアムや観劇に触れる機会が少ない島の子どもに都会の文化を体験させ、団体行動で社会性と協調性を育てること", "url": "https://www.tokyo-mayors.jp/cmsfiles/contents/0000000/236/R8kodomo.pdf"}, {"fact": "2026年度の計画一覧では事業は2022年度に始まり5年目。交付申請額は1200万円で、子ども体験塾区分の上限（経費の8割、年1200万円）と同額", "url": "https://www.tokyo-mayors.jp/cmsfiles/contents/0000000/236/R8kodomo.pdf"}, {"fact": "2025年度は児童136人と引率21人の計157人が参加し、満足と答えた割合は91.9％。自己評価は70％で、夜更かしや食べ残しが多かったこと、アレルギー食の提供で問題が起き提供側から説明を受けたことを報告書に記載", "url": "https://www.tokyo-mayors.jp/cmsfiles/contents/0000000/236/R7houkoku.pdf"}, {"fact": "2026年度は『島の未来を見据えた人材育成』を補うため、江戸の歴史や伊豆諸島とのつながりを学べる江戸東京博物館を見学先に加える計画", "url": "https://www.tokyo-mayors.jp/cmsfiles/contents/0000000/236/R7houkoku.pdf"}, {"fact": "2024年度の参加者は156人（児童136人、引率20人）。青ヶ島村は参加を希望する児童がいなかったため参加しなかった", "url": "https://www.tokyo-mayors.jp/cmsfiles/contents/0000000/236/R6houkoku.pdf"}, {"fact": "八丈町の2026年度当初予算に『こども体験塾負担金』194万3千円を計上", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/04/17130551/ipp01.pdf"}, {"fact": "2025年度も当初予算は194万3千円だったが、3月の最終補正予算で161万8千円を減額", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/05/12214804/ipp10.pdf"}, {"fact": "2011年は8月17～20日に島内の小学5年生28人が参加し、羽田空港の国際線ターミナルや日本科学未来館を見学、ライオンキングも観劇した", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23144217/hachijo1110.pdf"}], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2090325611965510115"}, {"label": "八丈町公式X", "url": "https://x.com/hachijomachi/status/2090779728936677441"}, {"label": "東京都市長会　多摩・島しょ広域連携活動助成事業", "url": "https://www.tokyo-mayors.jp/0000000236.html"}, {"label": "東京都市長会・東京都町村会　令和8年度事業計画一覧", "url": "https://www.tokyo-mayors.jp/cmsfiles/contents/0000000/236/R8kodomo.pdf"}, {"label": "東京都市長会・東京都町村会　令和7年度実施報告書", "url": "https://www.tokyo-mayors.jp/cmsfiles/contents/0000000/236/R7houkoku.pdf"}, {"label": "写真:Mizushimasea、CC BY-SA 4.0(Wikimedia Commons。切り抜いて使用)", "url": "https://commons.wikimedia.org/wiki/File:Small_Worlds_Tokyo_Koto-ku_Tokyo.jpg"}], "label": "教育", "audience": "島民", "thread_id": "t20260822-82", "id": "90e81b", "photo": {"type": "img", "src": "/img/kiji/90e81b.jpg?v=063f6c", "og": "/img/kiji/90e81b-og.jpg?v=063f6c", "s": "/img/kiji/90e81b-s.jpg?v=063f6c", "m": "/img/kiji/90e81b-m.jpg?v=063f6c", "caption": "スモールワールズTOKYO(東京都江東区)", "credit": "", "file": "commons/Small_Worlds_Tokyo_Koto-ku_Tokyo.jpg"}}, {"headline": "底土港の工事見学会、28日に延期", "body": ["東京都八丈支庁港湾課は、24日に底土港で開く予定だった工事見学会を28日に延期した。都が21日にXで知らせた。理由は「海象不良」で、時間と場所は変えない。見学会では、1辺21mのコンクリート製の箱「ケーソン」を海に沈めて護岸を延ばす作業を、ビデオやライブ映像で解説する。", "都の告知は見学会の延期を伝えたもので、ケーソンを沈める作業そのものの日程には触れていない。見学会は、据え付ける当日にその作業を映像で解説する催しである。案内チラシは、気象や海の状況で据え付けの日が変わる場合があるとし、変更はXで知らせるとしていた。都は延期の理由を「海象不良」とだけ説明している。19日に発生した台風18号との関係には触れていない。", "八丈支庁の広報紙「支庁の風」によると、八丈島の港では毎年、東京港で造ったケーソンを海に浮かべて船で引いて運び、据え付けてきた。2010年9月号は、据え付けは「例年、波の穏やかな6月から7月までに行う」と説明している。この年の底土港のケーソンは7月21日に沈め終えた。2015年9月号によると、同年は7月29日に底土港でケーソン工事の見学会が開かれ、16人が参加した。現場の中継のほか、工事の模型やパネルが展示された。今年の見学会は、もともと8月下旬の24日に予定されていた。", "本紙が21日に報じたように、今回据え付けるケーソンは高さ15.5mで、港を波から守る「護岸（防波）Ⅱ」を21m延ばす。工事は五洋・赤間建設共同企業体が税込み4億2130万円で請け負っており、工期は10月13日まで。都港湾局の2024年の事業評価資料によると、護岸（防波）Ⅱは計画171mのうち124mが整備済みだった。事業全体の完成予定は2031年度である。延期によって工期や港の利用に影響が出るかについて、都は説明していない。", "見学会は申し込みが要らず、集合場所は底土船客待合所の2階。希望者が多いと全員を案内できない場合がある。"], "added": [{"fact": "八丈支庁の広報紙「支庁の風」2010年9月号は、ケーソンの据え付けを「例年、波の穏やかな6月から7月までに行う」と説明していた。同年の底土港のケーソンは7月21日に沈め終えた。ケーソンは東京港から海に浮かべ、船で引いて運ぶ", "url": "https://www.soumu.metro.tokyo.lg.jp/09hatijou/g/kaze/100901.pdf"}, {"fact": "2015年7月29日にも底土港でケーソン工事の見学会が開かれ、16人が参加した。現場のライブ中継、工事模型やパネルの展示、ビデオの上映があった", "url": "https://www.soumu.metro.tokyo.lg.jp/09hatijou/g/kaze/150901.pdf"}, {"fact": "21日の都の告知は見学会の延期だけを伝え、理由は「海象不良」としている。据え付け作業の日程や台風18号には触れていない", "url": "https://x.com/ogasawarashicho/status/2090698597444505825"}], "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2090698597444505825"}, {"label": "東京都八丈支庁 見学会案内チラシ", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/d-kowan_0723"}, {"label": "東京都八丈支庁「支庁の風」第57号", "url": "https://www.soumu.metro.tokyo.lg.jp/09hatijou/g/kaze/100901.pdf"}, {"label": "東京都八丈支庁「支庁の風」第87号", "url": "https://www.soumu.metro.tokyo.lg.jp/09hatijou/g/kaze/150901.pdf"}, {"label": "東京都港湾局 事業評価資料", "url": "https://www.kensetsu.metro.tokyo.lg.jp/documents/d/kensetsu/r6-4-explanation-kaminato_pdf"}, {"label": "入札情報サイト", "url": "https://bid.const-ai.com/tokyo/?id=5525&p=project"}, {"label": "ウェザーニュース", "url": "https://weathernews.jp/news/202608/190181/"}], "label": "町政", "audience": "島民", "thread_id": "t20260821-79", "followup": true, "id": "6892de", "photo": {"type": "img", "src": "/img/kiji/6892de.jpg?v=a63e60", "og": "/img/kiji/6892de-og.jpg?v=a63e60", "s": "/img/kiji/6892de-s.jpg?v=a63e60", "m": "/img/kiji/6892de-m.jpg?v=a63e60", "caption": "底土港から望む八丈富士", "credit": "", const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
