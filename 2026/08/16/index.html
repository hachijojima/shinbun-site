<script type="application/json" id="edition">{"date": "2026-08-16", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T06:37:06+09:00", "prev": "/2026/08/15/", "next": "/2026/08/17/", "alerts": [], "weather": {"issued": "2026-08-16T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 23, "max": 29}]}, "koyomi": {"sunrise": "5:04", "sunset": "18:27", "moon": 2.8, "tide": {"place": "八丈島(神湊)", "high": [["7:03", 143], ["19:24", 146]], "low": [["0:58", 63], ["13:07", 51]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "転入者の33.7%が4年で島外へ", "body": ["八丈町議会の会議録によると、島への転入者は10年の平均で年382人で、そのうち33.7%が4年のうちに島を離れている。2025年6月10日の第二回定例会で、奥山幸子議員の一般質問に企画財政課長が答えた。町長は移住者用住宅を整えたいと答え、町は令和8年度当初予算に住宅の改修費を計上した。", "転入者には、仕事の異動で島に来る人も含まれる。町議会の議会だより(2025年8月発行)によると、課長は令和2年に転入した人のうち、4年後も島に住む人の割合(定住率)が66.3%だと答えた。町の人口は2024年1月1日で6,795人。奥山議員は、空き家バンクに登録がなく、町営住宅には所得制限があると指摘した。所得が変わると使用料が跳ね上がる例もあるとして、定住を促す住宅を町が用意するよう求めた。", "同じ答弁で、町の定住支援金の採用は令和3年から順に7件、29件、35件、31件だった。定住支援金は、都内の条件不利地域以外から移住して島で働く人に出す。就業の場合、単身は60万円、2人以上の世帯は100万円。町の移住情報サイト「八丈物語」の閲覧は、目標を年1万件とし、令和4年から毎年1万件ほどある。", "住宅について、町長は、中道住宅を改修するか新築するかも含め、財源次第で移住者用住宅の整備を進めたいと述べた。いつ、どこに、どんな形で建てるかはこれから考える。補助の仕組みは居住年数が3年に限られ、課題があるとも話した。", "2025年9月の第三回定例会では、沖山昇議員が町所有の戸建て住宅の活用を問うた。企画財政課長は、職員住宅だった三根の富士見地区の空き家2軒に浄化槽の設置などをし、移住者住宅として貸し出す考えを示した。空き家の活用策を10月までにまとめ、当初予算への計上を目指すと答えた。", "令和8年度当初予算には、移住者用住宅の改修設計委託料1,500万円と改修工事費4,000万円が載った。議会だより(2026年5月発行)によると、町所有の空き家を改修し、家族で移住する世帯向けの賃貸住宅にする。離島留学を、親子で移り住むファミリー留学に切り替えるための支援策の一つである。定住支援金にも今年度から、18歳未満の子ども1人につき100万円の加算ができた。"], "added": [{"fact": "議会だより第215号:転入者は仕事の異動を含む。令和2年の転入者の定住率(転入後4年経過後)は66.3%。定住支援金の採用は令和3年から7、29、35、31件。八丈物語の閲覧数は目標1万件で令和4年から毎年1万件ほど。町長は、いつどこにどのような様式で建てるかは今後考える、補助の仕組みは居住年数が3年と限られ課題があると答弁。議員は空き家バンクがゼロ、町営住宅は所得制限があり利用料が跳ね上がる例があると指摘", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094050/r070825.pdf"}, {"fact": "2025年9月の第三回定例会で沖山昇議員が町所有の戸建て住宅の活用を質問。企画財政課長は、以前職員住宅だった富士見地区の空き家2軒に浄化槽設置などの整備をして移住者住宅として貸し出すことを考えており、空き家政策を10月までに整えて当初予算に計上したいと答えた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094052/r071125.pdf"}, {"fact": "令和8年度八丈町一般会計当初予算書(議案第12号)に移住者用住宅改修設計委託料15,000千円、移住者用住宅改修工事40,000千円を計上", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/04/17130551/ipp01.pdf"}, {"fact": "議会だより(2026年5月25日発行):離島留学制度からファミリー留学への転換に関する支援策として、町所有の空き家を改修し家族で移住する世帯向けの賃貸住宅にする", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/05170246/r080525.pdf"}, {"fact": "八丈町定住支援金:都内条件不利地域以外から移住し就業またはテレワークをする人が対象。就業は単身60万円、2人以上の世帯100万円。令和8年度から18歳未満の世帯員1人につき100万円を加算", "url": "https://www.town.hachijo.tokyo.jp/iju/iju-guide/teijuu-shienkin/"}, {"fact": "八丈町の人口は令和6年1月1日時点で6,795人(住民基本台帳)", "url": "https://www.hokeniryo.metro.tokyo.lg.jp/shisetsu/jigyosyo/hokenjyo/tousyo/hokenshibosyu/chouson/hachijo"}, {"fact": "富士見地区公会堂は三根にある", "url": "https://www.town.hachijo.tokyo.jp/"}], "figure": null, "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161653/20250610.pdf#page=44"}, {"label": "八丈町議会 議会だより", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27094050/r070825.pdf"}, {"label": "八丈町", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/04/17130551/ipp01.pdf"}, {"label": "東京都保健医療局", "url": "https://www.hokeniryo.metro.tokyo.lg.jp/shisetsu/jigyosyo/hokenjyo/tousyo/hokenshibosyu/chouson/hachijo"}], "label": "町政", "audience": "島民", "thread_id": "t20260816-59", "id": "7a5ef9", "photo": {"type": "img", "src": "/img/kiji/7a5ef9.jpg?v=4a1f64", "og": "/img/kiji/7a5ef9-og.jpg?v=4a1f64", "s": "/img/kiji/7a5ef9-s.jpg?v=4a1f64", "m": "/img/kiji/7a5ef9-m.jpg?v=4a1f64", "caption": "八丈町営住宅", "credit": "", "file": "own/chouei-jutaku-3.jpg"}}, "side": [], "shorts": [{"headline": "観光協会の航空券販売に補助", "body": ["八丈町議会は2025年9月8日、八丈島観光協会が全日本空輸(ANA)の航空券を島内で売る代理店事業への補助897万円と貸付1600万円を含む補正予算を可決した。3月24日に公開された第三回定例会の会議録で、計画の中身が分かった。企画財政課長は当時、12月の開始を目標に挙げた。", "島内でANAの航空券を窓口で売ってきたのは八丈交通だった。その八丈交通が、経営を続けるのが難しいとして閉じることになった。企画財政課長によると、八丈交通の窓口は年に約1万9000件使われていた。2025年4月29日の中之郷地域住民総会では、航空券の購入を手助けしてほしいという要望が出ていた。町はこれに、予約の講習会と観光協会の代理店業務で応えると示した。講習会は7月30、31日に商工会研修室で計4回開き、81人が参加した。", "課長の説明では、観光協会の窓口の利用は年約4800件を見込む。手数料は1件約300円で、年約140万円の収入とする。初期費用は100万円余りで、ほぼ人件費である。事業は3年間に限る。補助の半分には東京都の特選枠を充てる想定で、答弁の時点では決まっていなかった。貸付の1600万円は無利子で、事業が終わるまで貸す。ANAと結ぶ販売店基本契約に保証金の定めがあり、その分に充てる。答弁の時点で、課長はANA、観光協会と準備を進めていると説明した。", "代理店の話は、9月5日の金川孝幸町議の一般質問「航空路線の維持」で出た。ANAの羽田—八丈島線は1日3往復である。金川町議は、減便への町の危機感を問うた。町長は、危機感を持って対応していると答えた。大島経由の便ができたことなどで、過去に減便された経過があるとした。町長は毎年ANAに要望している。航空路の協議会でANAに3年間の計画を出させ、その間の便数を確かめている。3年より先の数字は示されない。町は2025年6月23日にも、町議会と共にANAへ要望した。", "課長は、2000年の規制緩和で路線の設定は航空会社の判断に委ねられたと説明した。一方、国は2004年に「3便ルール」を設け、八丈島線もその枠に入る。決められたグループの中でだけ便の入れ替えを認める国の決まりである。金川町議は空港の愛称も提案した。課長は、2016年のターミナル改修の際に検討し、「八丈島空港」のままにしたと答えた。今後愛称を付けるなら、航空局の助言に沿い、町が主導しない手法が要るとした。金川町議は「3便以上をぜひ死守する」町の行動を求めて質問を終えた。"], "added": [{"fact": "代理店業務は、八丈交通が経営を続けられず閉じることを受けたもの。八丈交通の窓口の利用は年約1万9000件だった", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "議案第48号 令和7年度八丈町一般会計補正予算(第3号)に航空券販売代理店事業補助金897万円と一般社団法人八丈島観光協会貸付金1600万円を計上。1600万円はANAとの販売店基本契約の保証金条項に基づく。貸付は無利子で事業終了まで", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "利用は年約4800件、手数料は1件約300円、年収入は約140万円を見込む。初期費用100万円余りはほぼ人件費。3年間の時限事業。補助の50%に都の特選枠を想定(未確定)", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "議案第48号は2025年9月8日に原案可決", "url": "https://www.town.hachijo.tokyo.jp/chousei/chougikai/katsushin/shingi-kekka/r7-shingikekka/"}, {"fact": "2025年4月29日の中之郷地域住民総会への要望回答として、予約講習会と代理店業務を示した。講習会は7月30・31日に商工会研修室で計4回、81人が参加", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "町長は大島経由便などで減便になった経過があると答えた。航空路の協議会で3年間の計画を出させ確認しているが、3年後の数字は示されない。2025年6月23日に町議会と共にANAへ要望した", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "2000年の規制緩和で路線の設定は航空会社の判断になった。2004年に国の「3便ルール」ができ、八丈島線もその枠に入る。グループ内での便の異動を認める", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "愛称は2016年のターミナル改修の際に検討し、付けないと判断した。今後は航空局の助言に基づき、町が主導しない手法が必要との答弁。金川町議は「3便以上をぜひ死守する」町の行動を求めた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "ANAの羽田—八丈島線は1日3往復", "url": "https://www.hachijo.gr.jp/access"}], "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=20"}, {"label": "八丈町議会 審議結果", "url": "https://www.town.hachijo.tokyo.jp/chousei/chougikai/katsushin/shingi-kekka/r7-shingikekka/"}, {"label": "八丈島観光協会", "url": "https://www.hachijo.gr.jp/access"}], "label": "町政", "audience": "島民", "thread_id": "t20260816-60", "id": "02e975", "photo": {"type": "img", "src": "/img/kiji/02e975.jpg?v=0a7d4e", "og": "/img/kiji/02e975-og.jpg?v=0a7d4e", "s": "/img/kiji/02e975-s.jpg?v=0a7d4e", "m": "/img/kiji/02e975-m.jpg?v=0a7d4e", "caption": "八丈島観光協会", "credit": "", "file": "own/kanko-kyokai-1.jpg"}}, {"headline": "八丈高女子バスケ、夏季大会へ", "body": ["都立八丈高校の女子バスケットボール部は16日から、東京都高等学校女子バスケットボール夏季大会に出る。東京都高体連バスケットボール女子専門部によると、日程は19日まで。同校が15日夜、出場を案内した。", "島から内地の大会に出る運動部は、試合の前に海を越えて上京する。同校によると、男子バスケットボール部は4月の春季大会と5月の総合体育大会に、いずれも試合の前日に飛行機で上京して臨んだ。今月は女子バレーボール部が、台風15号の影響で内地での合宿を2日延ばした。4日間の予定だった合宿は、8日から13日までの6日間になった。同部は2025年度の新人戦を、台風の影響で棄権している。", "女子バスケットボール部のこれまでの成績は、同校によると次の通りだ。2025年5月の総合体育大会予選では、1回戦で女子美術大学付属高校に56-25で勝った。2回戦は武蔵野高校に50-73で敗れ、この大会で当時の3年生が引退した。", "その前の2025年4月の関東大会予選には、他校と組んだ合同チームで出た。富士見丘高校に67-64で勝ち、京華女子高校には19-122で敗れた。同専門部によると、2025年度の夏季大会は8月17日から20日まで開かれた。"], "added": [{"fact": "大会は東京都高体連バスケットボール女子専門部の令和8年度夏季大会で、日程は8月16日から19日まで", "url": "https://hsw.tokyobasketball.jp/taikai.html"}, {"fact": "前年度の大会名は「令和7年度 東京都高等学校女子バスケットボール 夏季大会」で、日程は8月17日から20日まで", "url": "https://hsw.tokyobasketball.jp/2025/2025_kaki_program.pdf"}, {"fact": "女子バスケットボール部は2025年5月の総体予選の1回戦で女子美術大学付属高校に56-25で勝った", "url": "https://x.com/tokyo8jouhs/status/1924312440520818756"}, {"fact": "2回戦で武蔵野高校に50-73で敗れ、3年生が引退した", "url": "https://x.com/tokyo8jouhs/status/1927920377730138215"}, {"fact": "2025年4月の関東予選に合同チームで出て、富士見丘高校に67-64で勝ち、京華女子高校に19-122で敗れた", "url": "https://x.com/tokyo8jouhs/status/1915558084552110364"}, {"fact": "男子バスケットボール部は4月の春季大会で、初戦の前日に飛行機で上京した", "url": "https://x.com/tokyo8jouhs/status/2045645244360986828"}, {"fact": "男子バスケットボール部は5月の総合体育大会で、初戦の前日に飛行機で上京した", "url": "https://x.com/tokyo8jouhs/status/2058106811627225306"}, {"fact": "女子バレーボール部の合宿は、8日からの4日間の予定が延泊2日で6日間になった。同部は2025年度の新人戦を台風の影響で棄権した", "url": "https://shinbun.hachijojima.jp/2026/08/14/b17017/"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2088601449471295621"}, {"label": "東京都高体連バスケットボール女子専門部", "url": "https://hsw.tokyobasketball.jp/taikai.html"}, {"label": "八丈島新聞", "url": "https://shinbun.hachijojima.jp/2026/08/14/b17017/"}], "label": "教育", "audience": "島民", "thread_id": "t20260816-61", "id": "427fea", "photo": {"type": "img", "src": "/img/kiji/427fea.jpg?v=24b011", "og": "/img/kiji/427fea-og.jpg?v=24b011", "s": "/img/kiji/427fea-s.jpg?v=24b011", "m": "/img/kiji/427fea-m.jpg?v=24b011", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-4.jpg"}}, {"headline": "通院助成回数、町「改正考えず」", "body": ["2025年9月5日の八丈町議会第三回定例会で、島外の病院に通う人への交通費の助成が取り上げられた。回数を増やす改正について、菅原宏幸福祉健康課長は「現段階で改正は考えていない」と答えた。手術を受ける人は何度も上京するとして、金川孝幸議員が回数増を求めていた。町議会の会議録で分かった。", "町の助成には年度ごとに回数の上限がある。島内の医師が島外での受診を必要と認めた人は2回、難病や障害のある人は6回で、付き添い1人分も対象になる。金川議員は、手術を受ける場合、事前の検査や術後の確認で何度も上京しなければならないと指摘した。", "菅原課長は、制度を2024年度に6年ぶりに大きく改め、2025年度が2年目だと説明した。2025年度からは2つの病気で使えるようにしたが、回数は2つを合わせて2回とした。金川議員は、受診日の前後2日に限る対象期間を緩めるようにも求めた。課長は、緩和は考えていないと答えた。", "回数の拡大は、2025年3月17日の第一回定例会でも真田幸久議員が問うていた。当時の小野高志福祉健康課長は、大きく改めた制度の1年目の結果を分析してから検討すると答えた。2024年度の助成は1月末時点で831件、約1,180万円だった。前年度より件数で9.4%、金額で24.5%減った。滞在日数の超過で片道分が対象外になった申請は82件あった。327件は基準より安い割引運賃を使っていたため、減額して支払った。小野課長は、予算に余りが出れば、病状に応じた回数の拡大に回すことを検討したいとした。", "町は2026年度予算に通院交通費の助成として1,600万円を計上し、継続して実施するとした。山下奉也町長が3月2日の施政方針で示した。金川議員は9月の質問で、島内で出産できなくなる人の交通費を全額助成するようにも求めていた。課長は、出産の件も含めて、12月の予算か2026年度予算の時までに案を示したいと答えた。町は2026年度予算で、出産1回につき出産の前と後に25万円ずつ、計50万円を補助する。"], "added": [{"fact": "答弁したのは菅原宏幸福祉健康課長(2025年9月5日)、2025年3月17日の答弁は小野高志福祉健康課長", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "助成回数は島内医師が必要と認めた場合年度内2回、難病や障害のある場合6回、付添者1人分も対象(金川議員の質問)", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "制度は2024年度に6年ぶりに大幅改正。2025年度から2疾病でも使えるが、回数は合わせて2回", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "受診日前後2日の対象期間の緩和は考えていないとの答弁", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf"}, {"fact": "2024年度の実績は1月末時点で申請831件(前年度比9.4%減)、交付約1,180万円(24.5%減)。滞在日数超過で片道対象外82件、割引運賃利用で減額327件", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24163310/20250102.pdf"}, {"fact": "予算に余裕が生じれば病状に応じた補助回数の拡大などに回すことを検討したいとの答弁", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24163310/20250102.pdf"}, {"fact": "令和8年度施政方針(2026年3月2日)で通院交通費の一部助成に1,600万円を計上し継続実施。分娩補助は出産前25万円・出産後25万円", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/r7-houshin/"}], "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=20"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/r7-houshin/"}], "label": "くらし", "audience": "島民", "thread_id": "t20260816-62", "id": "19b61a", "photo": {"type": "img", "src": "/img/kiji/19b61a.jpg?v=ba042c", "og": "/img/kiji/19b61a-og.jpg?v=ba042c", "s": "/img/kiji/19b61a-s.jpg?v=ba042c", "m": "/img/kiji/19b61a-m.jpg?v=ba042c", "caption": "八丈町保健福祉センター", "credit": "", "file": "own/hoken-fukushi-3.jpg"}}, {"headline": "八重根の津波計、潮位は非公開", "body": ["大賀郷の八重根には気象庁の巨大津波観測計がある。この観測計は正確な潮位を測れないため、潮位のデータを公開していない。2025年9月5日の八丈町議会第三回定例会で、岩﨑由美議員の一般質問に総務課長が答えた。津波のときは、町が気象庁とのホットラインで値を聞ける。会議録で分かった。", "2025年7月30日のカムチャツカ半島付近の地震では、気象庁が9時40分に伊豆諸島の津波注意報を津波警報に切り替えた。気象庁の地震・火山月報によると、最大の津波は八重根で1.0メートル、海上保安庁が観測する神湊で40センチだった。八重根の観測計は0.1メートル単位で測る。", "岩﨑議員は質問で、八重根の検潮所の潮位データを公開しない理由と、このままでよいのかを問うた。総務課長は、八重根の巨大津波観測計は正確な潮位を測れないため公開していないと答えた。そのうえで、町は気象庁とのホットラインを通じて八重根の値を聞くことができると述べた。", "同じ質問の中で、岩﨑議員はペットを連れた避難の周知も求めた。総務課長によると、おじゃれホールに避難したときは、消防車の車庫をペットの居場所にしている。防災無線でペットの同行避難を案内したことはない。総務課長は、ペット避難のパンフレットを改めて周知すると答えた。"], "added": [{"fact": "2025年7月30日のカムチャツカ半島付近の地震による津波の最大波は、八丈島八重根(気象庁、巨大津波観測計)で1.0m(16時19分)、八丈島神湊(海上保安庁)で40cm(15時27分)", "url": "https://www.data.jma.go.jp/eqev/data/gaikyo/monthly/202507/202507tokushuu_2_3.pdf"}, {"fact": "気象庁は2025年7月30日9時40分に伊豆諸島などを津波警報に切り替えた", "url": "https://www.data.jma.go.jp/eqev/data/gaikyo/monthly/202507/202507tokushuu_2_3.pdf"}, {"fact": "巨大津波観測計による観測は0.1m単位", "url": "https://www.data.jma.go.jp/eqev/data/gaikyo/monthly/202507/202507tokushuu_2_3.pdf"}, {"fact": "おじゃれホールに避難したときは消防車の車庫をペットの居場所にしており、防災無線でペットの同行避難を案内したことはない(総務課長答弁)", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=52"}], "sources": [{"label": "八丈町議会の会議録", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/24161409/20250905.pdf#page=47"}, {"label": "気象庁", "url": "https://www.data.jma.go.jp/eqev/data/gaikyo/monthly/202507/202507tokushuu_2_3.pdf"}], "label": "くらし", "audience": "島民", "thread_id": "t20260816-63", "id": "4bb33e", "photo": {"type": "img", "src": "/img/kiji/4bb33e.jpg?v=0c9a81", "og": "/img/kiji/4bb33e-og.jpg?v=0c9a81", "s": "/img/kiji/4bb33e-s.jpg?v=0c9a81", "m": "/img/kiji/4bb33e-m.jpg?v=0c9a81", "caption": "東京都・八丈島の海", "credit": "", "file": "ac/2478675.jpg"}}], "agenda": [{"date": "2026-08-19", "end": null, "text": "第54回八丈島夏まつり商品引換券の期限", "url": "https://x.com/hachisho8/status/2085510976636588316"}, {"date": "2026-08-21", "end": null, "text": "末吉応援ミニコンサート(末吉)", "url": "https://x.com/8jobunka/status/2088060046538416621"}, {"date": "2026-08-22", "end": null, "text": "八丈島みんなで海あそび2026", "url": "https://x.com/madoca_Okuyama/status/2077725986909765957"}, {"date": "2026-08-23", "end": null, "text": "八丈ウィンズフェス2026", "url": "https://8jobunka.jimdofree.com/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88/%E5%8D%94%E4%BC%9A%E4%B8%BB%E5%82%AC-%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B92026%E5%8F%82%E5%8A%A0%E8%80%85%E5%8B%9F%E9%9B%86/"}], "letters": [], "corrections": [], "column": null, "kyoku": {"artist": "唾奇", "title": "道 -TAO-", "text": "唾奇の「道 -TAO-」には、前へ出ることだけを誇らないラップの身軽さがある。言葉を詰め込みすぎず、余った拍をそのまま残す。目的地を説く声より、歩いてきた道をひとつずつ確かめる声が聞こえます。道という言葉は誰にでも使えるけれど、この人のフロウに乗ると違う道になる。同じ速度のビートに、歩いてきた時間の凸凹が浮かぶ。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/27/2d/2a/272d2ac0-3a61-f317-755c-718faeceb308/4560230526870_cover.jpg/300x300bb.jpg", "album": "Jasmine", "url": "https://music.apple.com/jp/album/%E9%81%93-tao-soulera-remix/1555203769?i=1555204070&uo=4"}}, "ronten": null, "weekly": [{"date": "2026-08-10", "headline": "青ヶ島への船、2日から出ず", "url": "/2026/08/10/"}, {"date": "2026-08-11", "headline": "宵酔処らいす 31日で閉店", "url": "/2026/08/11/"}, {"date": "2026-08-12", "headline": "納涼花火、雨で開始を20時30分に", "url": "/2026/08/12/"}, {"date": "2026-08-13", "headline": "ムロアジ漁 8月に始まる", "url": "/2026/08/13/"}, {"date": "2026-08-14", "headline": "防災対策課の電話 9-5544に", "url": "/2026/08/14/"}, {"date": "2026-08-15", "headline": "東海汽船処分、21日に聴聞へ function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section class="ran" id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h"><a href="/government/members/">町議会議員</a></h2>
    <ol class="giin ichi">${g.map(r=>{const nm=`${rankMark(r.medal)}<b>${esc(r.name)}</b>`;
      return `<li>${r.slug?`<a class="n" href="/government/members/${esc(r.slug)}/">${nm}</a>`:`<span class="n">${nm}</span>`}${r.at?`<a class="ps" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.name+" "+(r.kind?r.kind+" ":"")+(r.what||""))}"><time>${esc(r.when)}</time><q${r.duty?' class="ten2"':""}>${esc(r.what||"")}</q></a>`:""}</li>`;}).join("")}</ol><p class="more"><a href="/government/assembly/">議員・議会</a><a href="/government/members/">全員の一覧</a></p></section>`;
}
 
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
 
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u), sora=soraRow(e.sora), ev=evLines(e).slice(0,8);
  const diff=n=>n==null?"":`<small>(${n>0?"+":n<0?"−":"±"}${Math.abs(n).toLocaleString()})</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const st=e.sora&&e.sora.at?ymd(e.sora.at.slice(0,10)):null, sh=e.sora&&e.sora.at?hm(e.sora.at):"";
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
 
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section class="ran" id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h"><a href="/song/">きょうの一曲</a></h2>
    <div class="kk">${a?`<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.img)}" alt="${esc(a.album||k.title)}のジャケット" width="96" height="96" loading="lazy"></a>`:""}
      <div><h3>${k.day?`<a class="hl" href="${esc(k.day)}song/">${esc(k.title)}</a>`:esc(k.title)}</h3><p class="who">${esc(k.artist)}</p></div></div>
    <p class="txt">${esc(k.text)}</p>
    <p class="kiku"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTubeで聴く</a>${a&&a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Apple Musicで聴く</a>`:""}</p></section>`;
}
 
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){
  if(!c) return "";
  return `<section class="ran" id="tayori" aria-labelledby="tayori-h"><h2 class="band" id="tayori-h"><a href="/column/">${esc(c.name||"島のたより")}</a></h2>
    ${c.title?`<h3>${c.day?`<a class="hl" href="${esc(c.day)}column/">${esc(c.title)}</a>`:esc(c.title)}</h3>`:""}<div class="honbun">${(c.body||[]).map(t=>`<p>${mdLink(t)}</p>`).join("")}</div></section>`;
}

function render(e){
  e={...e}; if(!e.top&&e.side.length){e.top=e.side[0]; e.side=e.side.slice(1);}
  if(!e.top&&e.shorts.length){e.top=e.shorts[0]; e.shorts=e.shorts.slice(1);}
  
  document.title = /^\/\d{4}\/\d{2}\/\d{2}\//.test(location.pathname) ? `八丈島新聞 ${hiduke(e.date)}` : "八丈島新聞";
  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><span class="hi">2026年8月16日(日)</span><h1 class="daiji"><a href="/"><img src="/logo-maru.png" alt="" width="192" height="192">八丈島新聞</a></h1><details class="menu"><summary aria-label="メニュー"><span></span><span></span><span></span></summary><nav aria-label="ページ"><form class="ms" action="/archive/" role="search"><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"><button>検索</button></form><ul class="sg" hidden></ul><div><a href="/">最新号</a><a href="/archive/">バックナンバー</a><a href="/features/">特集</a></div><div><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><a href="/column/">島のたより</a></div><div><a href="/song/">きょうの一曲</a><a class="tvl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener" title="FM八丈島テレビ"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div></nav></details></div><nav class="nb" aria-label="ページ"><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><div class="nbs"><form class="ms" action="/archive/" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"></form><ul class="sg" hidden></ul></div><button class="nbq" type="button" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg></button></nav></header>
  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top" id="a1">
      ${lbl(e.top)}<h2>${hl(e,e.top)}</h2>
      ${figure(e.top.photo)}
      <div class="honbun">${paras(e.top.body)}${src(e.top.sources)}</div>
    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];
      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>
      ${s.id?`<p class="ld">${esc(b[0])}</p>`:`<div class="honbun">${paras(b)}${src(s.sources)}</div>`}
    </article>`;}).join("")}</div>`:""}`:""}
    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}
    ${e.ronten?`<section class="ran men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="ran tv" aria-label="FM八丈島テレビ"><div class="head"><h2 class="band onair"><a href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><i aria-hidden="true"></i>ON AIR</a></h2><a class="chl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div><div class="tvw"><iframe src="https://tv.hachijojima.jp/embed.html" title="FM八丈島テレビ" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></div></section>
      ${(e.ichimen_week||[]).length?`<section class="ran" id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h"><a href="/archive/">今週の一面</a></h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><a href="${esc(w.url)}"><time datetime="${esc(w.date)}">${tsuki(w.date)}</time>${esc(w.headlines[0])}</a></li>`).join("")}</ol>
      </section>`:""}
      ${giinSection(e)}
      ${kyokuSection(e.kyoku&&{...e.kyoku,day:DAY(e)})}
      ${shimaSection(e)}
    </aside>
  </div>

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
}

function kyukan(){
  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><h1 class="daiji"><a href="/"><img src="/logo-maru.png" alt="" width="192" height="192">八丈島新聞</a></h1><details class="menu"><summary aria-label="メニュー"><span></span><span></span><span></span></summary><nav aria-label="ページ"><form class="ms" action="/archive/" role="search"><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"><button>検索</button></form><ul class="sg" hidden></ul><div><a href="/">最新号</a><a href="/archive/">バックナンバー</a><a href="/features/">特集</a></div><div><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><a href="/column/">島のたより</a></div><div><a href="/song/">きょうの一曲</a><a class="tvl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener" title="FM八丈島テレビ"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div></nav></details></div><nav class="nb" aria-label="ページ"><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><div class="nbs"><form class="ms" action="/archive/" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"></form><ul class="sg" hidden></ul></div><button class="nbq" type="button" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg></button></nav></header>
  <section class="kyukan"><h2>本日は休刊です</h2><p>けさの号を組めませんでした。<a href="/archive/">バックナンバー</a>で前の号を読めます。</p></section>`;
}

const EMB = document.getElementById("edition").textContent.trim();
if (EMB.startsWith("{")) render(JSON.parse(EMB)); else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
