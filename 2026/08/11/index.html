<script type="application/json" id="edition">{"date": "2026-08-11", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-26T16:04:29+09:00", "prev": "/2026/08/10/", "next": "/2026/08/12/", "alerts": [], "weather": {"issued": "2026-08-11T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "くもり 時々 雨", "main": "くもり 時々 雨", "hachijo": "くもり 時々 雨", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 22, "max": 28}]}, "koyomi": {"sunrise": "5:00", "sunset": "18:32", "moon": 27.3, "tide": {"place": "八丈島(神湊)", "high": [["2:55", 142], ["17:28", 146]], "low": [["10:06", 17], ["22:40", 100]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://x.com/ANA_flight_info/status/2086765752476921914", "at": "2026-08-10T19:45:00+09:00"}, "number": null, "top": {"headline": "宵酔処らいす 31日で閉店", "body": ["三根の居酒屋「宵酔処らいす」が31日で店を閉める。2018年12月に開き、島魚や明日葉の料理と、馬刺しやモツ鍋などの九州の料理を出してきた。閉店の理由は、昨年の台風で傷んだ所を直せなかったことだ。同店は以前から閉店を知らせており、10日に改めて案内した。", "席が15席の小さな店で、東京都が「東京 島じまん食材使用店」の1つに選んでいる。キハダやアカサバなど旬の島魚の盛り合わせを出してきた。ほかに、明日葉と島唐辛子のチャーハンもある。明日葉はおひたしやゴマ和えのほか、くさやマヨ和えにもした。焼き鳥と島焼酎のほかに、モツ鍋、とんこつラーメン、馬刺し、酢モツも並べてきた。島の素材と九州の味を一つの店で出してきた。", "都の紹介では、島料理や漁師めしが島の人にも喜ばれているとされる。釣った魚を持ち込めば、予約で調理も引き受けてきた。訪れる前の予約を勧められる店だった。客の来店記によると、店主はよいなだめ(ウツボ)が入ると客に知らせていた。そのなだめを、湯引き、たたき、蒲焼、天ぷら、唐揚げ、煮付けなどにして出していた。", "店は閉店の日まで営業を続ける。10日の案内では、常連の客や応援してくれた客への感謝として熊本の馬刺しを用意したという。12日から予約限定で出す。"], "added": [{"fact": "同店は2018年12月15日開店、居酒屋・焼き鳥、営業は17時〜翌3時、火曜定休、所在は三根", "url": "https://tabelog.com/tokyo/A1331/A133101/13230749/"}, {"fact": "台風22号で八丈島は9日未明から昼前が荒天のピーク、最大瞬間風速54.7m/s、50m/s以上は2005年以来。八丈町に大雨・暴風・波浪の特別警報", "url": "https://weathernews.jp/news/202510/090096/"}, {"fact": "八丈島の24時間雨量356.5ミリで観測史上1位を大幅更新、倒木や電柱倒壊で停電が続いた", "url": "https://weathernews.jp/news/202510/090266/"}, {"fact": "都の地域企業再建支援事業は、台風により被災した八丈町・青ヶ島村の中小企業者等の施設・設備の復旧・復興経費を補助", "url": "https://www.sangyo-rodo.metro.tokyo.lg.jp/chushou/shoko/chiikikigyosaiken"}, {"fact": "都の災害復旧資金融資(台風22号・23号関連)は、り災証明書が要件。信用保証料を全額補助し、八丈町の事業者は町の利子補給で実質無利子。受付は2025年12月18日〜2026年3月31日", "url": "https://www.metro.tokyo.lg.jp/information/press/2025/12/2025121706"}], "figure": null, "sources": [{"label": "宵酔処 らいす", "url": "https://x.com/plumtree46/status/2086637613465919564"}, {"label": "食べログ 宵酔処 らいす", "url": "https://tabelog.com/tokyo/A1331/A133101/13230749/"}, {"label": "ウェザーニュース", "url": "https://weathernews.jp/news/202510/090096/"}, {"label": "東京都産業労働局 地域企業再建支援事業", "url": "https://www.sangyo-rodo.metro.tokyo.lg.jp/chushou/shoko/chiikikigyosaiken"}, {"label": "東京都 報道発表", "url": "https://www.metro.tokyo.lg.jp/information/press/2025/12/2025121706"}, {"label": "東京都 東京 島じまん食材使用店 宵酔処 らいす", "url": "https://www.shimajiman.metro.tokyo.lg.jp/02_shop/info_171/"}, {"label": "来店記", "url": "https://ameblo.jp/super-asanuma/entry-12933336574.html"}], "label": "くらし", "audience": "両方", "thread_id": "t20260811-43", "id": "a5c8cd", "edited": "2026-11-26T16:04:26+09:00", "photo": {"type": "img", "src": "/img/kiji/a5c8cd.jpg?v=5adc2c", "og": "/img/kiji/a5c8cd-og.jpg?v=5adc2c", "s": "/img/kiji/a5c8cd-s.jpg?v=5adc2c", "m": "/img/kiji/a5c8cd-m.jpg?v=5adc2c", "caption": "明日葉の天婦羅", "credit": "", "file": "ac/4708540.jpg"}}, "side": [], "shorts": [{"headline": "八丈高女子バレー 5位リーグ2位", "body": ["都立八丈高校の女子バレーボール部は9日と10日、町田市バレーボール協会が主催する武相大会に出場した。同校によると、1日目は6チームのリーグ戦で5位だった。2日目は各コートの5位のチームによるリーグ戦に回り、2位になった。大会は8日に始めた内地での夏季合宿の中で戦った。", "合宿は8日から11日までの4日間。初日の8日は町田総合高校と練習試合をして大会に備えた。同校は大会を振り返り、接戦を勝ちきれない悔しさがあった一方、大きなアリーナで試合ができたことは貴重な経験になったとしている。", "4月19日の春季大会兼関東大会予選は、日大鶴ヶ丘にセットカウント0—2、富士見に1—2で敗れ、本大会に進めなかった。5月24日のインターハイ予選は東亜学園に1—2で敗れた。前日の23日に1便で上京し、都立千歳丘高校と練習試合をしてから臨んだ。この予選は3年生が中心になって戦う最後の大会で、その後は2年生が引き継いだ。", "島内では、八丈島バレーボール協会が主催する大会にも出ている。6月21日の森郁郎杯は3位、7月12日の明祐工販杯は9チーム中5位だった。明祐工販杯では男子選手のいるチームとも対戦した。", "遠征は便の運航に左右される。2025年度の新人戦は台風の影響で棄権し、2026年2月の公立校大会が前年8月以来の公式戦になった。この大会では板橋高校に2—1で勝ち、文京高校に0—2で敗れた。前年8月の夏季大会では7人で戦い、ブロック3位に入っている。"], "added": [{"fact": "2026年4月19日の春季大会兼関東大会予選で日大鶴ヶ丘に0-2、富士見に1-2で敗れ、本大会出場を逃した", "url": "https://x.com/tokyo8jouhs/status/2046522820482806228"}, {"fact": "5月23日に1便で上京し、都立千歳丘高校と練習試合をした。インターハイ予選は3年生が中心の最後の大会だった", "url": "https://x.com/tokyo8jouhs/status/2058123519180030384"}, {"fact": "5月24日のインターハイ予選で東亜学園に1-2で敗れた。その後は2年生が引き継ぐとした", "url": "https://x.com/tokyo8jouhs/status/2058831881228145006"}, {"fact": "6月21日の森郁郎杯(八丈島バレーボール協会主催)で3位", "url": "https://x.com/tokyo8jouhs/status/2068621283609493856"}, {"fact": "7月12日の明祐工販杯(八丈島バレーボール協会主催)で9チーム中5位。男子選手とも対戦した", "url": "https://x.com/tokyo8jouhs/status/2077564271769395426"}, {"fact": "台風の影響で新人戦を棄権し、2026年2月の公立校大会が8月以来の公式戦になった", "url": "https://x.com/tokyo8jouhs/status/2021174635060924765"}, {"fact": "公立校大会で板橋高校に2-1で勝ち、文京高校に0-2で敗れた", "url": "https://x.com/tokyo8jouhs/status/2022191928968897003"}, {"fact": "2025年8月の夏季大会で7人で戦い、ブロック3位", "url": "https://x.com/tokyo8jouhs/status/1957272651153764645"}, {"fact": "1日目のリーグ戦は6チームで行われた。大会の会場は大きなアリーナだった", "url": "https://x.com/tokyo8jouhs/status/2086822543256846402"}, {"fact": "同校は武相大会について、接戦を勝ちきれない悔しさがあった一方、大きなアリーナでバレーに関われたことは貴重な経験になったとしている", "url": "https://x.com/tokyo8jouhs/status/2086822543256846402"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2086822543256846402"}], "label": "教育", "audience": "島民", "thread_id": "t20260811-44", "id": "435d64", "photo": {"type": "img", "src": "/img/kiji/435d64.jpg?v=c040ac", "og": "/img/kiji/435d64-og.jpg?v=c040ac", "s": "/img/kiji/435d64-s.jpg?v=c040ac", "m": "/img/kiji/435d64-m.jpg?v=c040ac", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-3.jpg"}}, {"headline": "しまぽ通貨第1期が完売", "body": ["東京の島を旅する人向けの宿泊旅行商品券「しまぽ通貨」の令和8年度第1期分が完売した。東京都と公益財団法人東京観光財団の公式サイトが10日に知らせた。5月14日に販売を始めた8万セットが売り切れた。次の販売は後日知らせるとしている。", "しまぽ通貨はプレミアム付きの電子商品券だ。1セット7000円で1万円分を使え、差額の3000円は都が助成する。1万円分のうち3000円分は加盟する宿泊施設でしか使えない。残る7000円分は全ての加盟店で使える。使える島は大島から母島までの11島で、八丈島と青ヶ島も入る。加盟店は4月1日時点で570店を超えた。", "買うにはスマートフォンのアプリに会員登録し、マイナンバーカードや運転免許証で本人認証を済ませる。購入できるのは1人8セットまでで、令和9年3月31日までの累計で数える。売り切れた後、購入ボタンを押すと上限に達したと表示され、買えなくなる。都と財団は3日にこの扱いを前もって知らせていた。", "都は4月20日の発表で、令和8年度は計12万セットを売る予定とした。第1期の8万セットはそのうちの分で、追加の販売は改めて知らせるとしている。第2期の時期とセット数は10日の時点で示されていない。", "すでに買った分は、購入日から180日か令和9年3月31日の早い方まで使える。完売後もアプリの会員登録と本人認証はでき、島を回るデジタルスタンプラリーは令和9年3月31日まで続く。", "前の年度は、第1期の7万セットを2025年5月14日に売り出した。完売の後、都は2025年9月22日に第2期以降の販売を発表した。第2期は10月2日から3万セット、第3期は12月22日から2万セットだった。"], "added": [{"fact": "公式サイトの新着情報で、令和8年度第1期の完売のお知らせは2026年8月10日付", "url": "https://shimapo.metro.tokyo.lg.jp/news/"}, {"fact": "8月3日付で第1期の完売時の対応を告知していた(購入ボタンに上限到達の表示、会員登録・本人認証は完売後も可能)", "url": "https://shimapo.metro.tokyo.lg.jp/news/"}, {"fact": "完売のお知らせでは、追加の販売は後日知らせるとし、スタンプラリーは令和9年3月31日まで続く", "url": "https://shimapo.metro.tokyo.lg.jp/news/"}, {"fact": "令和8年度の販売開始は5月14日正午。第1期の予定数は8万セットで、年度の計は12万セット。1セット7000円で1万円分、うち3000円分は宿泊施設用。1人は令和9年3月31日までの累計8セットまで。有効期限は購入日から180日か令和9年3月31日の早い方。対象は11島。追加販売は改めて知らせるとした", "url": "https://www.metro.tokyo.lg.jp/information/press/2026/04/2026042008"}, {"fact": "本人認証にはマイナンバーカードや運転免許証を使う", "url": "https://dc.watch.impress.co.jp/docs/news/2105080.html"}, {"fact": "加盟店は令和8年4月1日時点で570店以上。差額3000円は都の助成", "url": "https://shimapo.metro.tokyo.lg.jp/"}, {"fact": "令和7年度の第1期は7万セット、2025年5月14日正午に販売開始、年度計12万セットの予定", "url": "https://www.metro.tokyo.lg.jp/information/press/2025/04/2025041813"}, {"fact": "2025年9月22日の発表で、第1期が完売したとし、第2期を10月2日から3万セット、第3期を12月22日から2万セット売るとした", "url": "https://www.metro.tokyo.lg.jp/information/press/2025/09/2025092206"}], "sources": [{"label": "あしたば加工工場", "url": "https://x.com/ashitabaya8jo/status/2086624105017864567"}, {"label": "電子しまぽ(しまぽ通貨)新着情報", "url": "https://shimapo.metro.tokyo.lg.jp/news/"}, {"label": "東京都 報道発表(2026年4月20日)令和8年度しまぽ通貨の販売", "url": "https://www.metro.tokyo.lg.jp/information/press/2026/04/2026042008"}, {"label": "東京都 報道発表(2025年4月18日)令和7年度しまぽ通貨の販売", "url": "https://www.metro.tokyo.lg.jp/information/press/2025/04/2025041813"}, {"label": "東京都 報道発表(2025年9月22日)しまぽ通貨第2期以降の販売", "url": "https://www.metro.tokyo.lg.jp/information/press/2025/09/2025092206"}], "label": "産業", "audience": "両方", "thread_id": "t20260811-45", "id": "94dc8f", "photo": {"type": "img", "src": "/img/kiji/94dc8f.jpg?v=47a67e", "og": "/img/kiji/94dc8f-og.jpg?v=47a67e", "s": "/img/kiji/94dc8f-s.jpg?v=47a67e", "m": "/img/kiji/94dc8f-m.jpg?v=47a67e", "caption": "東京都・八丈島 裏見ヶ滝の風景", "credit": "", "file": "ac/29362286.jpg"}}, {"headline": "中之郷盆踊りに七転び八起き", "body": ["キッチンカーの七転び八起きは、13日と15日に中之郷運動場で開かれる中之郷盆踊りに出店する。盆踊りでのアルバイトも募っている。同店によると、営業は7年目に入り、23日に営業を再開する予定。盆踊りへの出店は、その再開に先立つものになる。", "八丈島観光協会の案内によると、中之郷盆踊りは両日とも19時に始まる。お盆の13〜15日には、地区ごとに日程を分けて盆踊りがある。三根は13日と14日の18時から三根小学校の校庭で開き、15日を予備日とする。大賀郷は15日19時から大賀郷小学校の校庭、樫立は3日間とも19時30分から樫立公民館の前で開く。", "盆踊りで同店は焼き鳥、焼きそば、生ビール、かき氷を出す予定。アルバイトの仕事の中身、時給、働く時間の条件、応募の窓口は示されていない。", "同店は村田美奈子さんが2020年に始めたキッチンカー。観光協会によると、営業日と出店場所はSNSで知らせている。村田さんがクラウドファンディングのサイト「For Good」で支援を募った際の説明によると、台風でキッチンカーが破損した。常連客からの申し出をきっかけに賃貸の店舗を借りることになり、2025年12月9日に店舗の契約を結んだ。修理したキッチンカーと店舗の両方で営業する計画を示し、支援は目標の60万円に対し26人から36万円が集まった。店舗の今の営業の状況は示されていない。", "中之郷の盆踊りは、ここ数年天候に左右されてきた。八丈町によると、2023年は台風7号の影響で各地区の盆踊りがすべての日程で中止になった。2024年は悪天候が見込まれたため中之郷は日程を変えたが、8月14日に中止が知らされた。"], "added": [{"fact": "中之郷盆踊りは13日・15日の19時から中之郷運動場で開く。三根・大賀郷・樫立の日時と会場", "url": "https://www.hachijo.gr.jp/blogs/bon-odori_2026"}, {"fact": "七転び八起きは営業日・出店場所をSNSで知らせる移動販売", "url": "https://www.hachijo.gr.jp/restaurant/7korobi8oki/"}, {"fact": "村田美奈子さんが2020年にキッチンカーを始めた。台風でキッチンカーが破損。常連客の申し出がきっかけで賃貸店舗を借りることになり、修理したキッチンカーと賃貸店舗で営業する計画。2025年12月9日に店舗契約。支援は26人から36万円、目標60万円", "url": "https://for-good.net/project/1002850"}, {"fact": "2023年は台風7号の影響で各地域の盆踊りが全日程で中止", "url": "https://x.com/HachijoTown/status/1690226607511011328"}, {"fact": "2024年は悪天候予想で中之郷の盆踊りの日程を変更", "url": "https://x.com/HachijoTown/status/1823194011382776107"}, {"fact": "2024年8月14日、中之郷地域の盆踊りの中止が知らされた", "url": "https://x.com/HachijoTown/status/1823577792178741542"}], "sources": [{"label": "七転び八起き", "url": "https://x.com/murata7koro8oki/status/2085868365512683823"}, {"label": "八丈島観光協会 2026年盆踊り", "url": "https://www.hachijo.gr.jp/blogs/bon-odori_2026"}, {"label": "八丈島観光協会 七転び八起き", "url": "https://www.hachijo.gr.jp/restaurant/7korobi8oki/"} 33437576774713558"}, {"fact": "6月2日、台風6号の接近で藍ヶ江漁港を車両通行止めにし、4日に解除した", "url": "https://x.com/ogasawarashicho/status/2061632460094329000"}, {"fact": "6月4日の解除", "url": "https://x.com/ogasawarashicho/status/2062343118402327026"}, {"fact": "6月8日8時49分、波浪警報が出て波が高い状況が続くとして藍ヶ江漁港を車両通行止めにし、歩行者も立ち入れないようにした", "url": "https://x.com/ogasawarashicho/status/2063770312248898029"}, {"fact": "6月8日17時28分、波浪警報・津波注意報で通行止めにしていた八重根港と藍ヶ江漁港の通行止めを解除した", "url": "https://x.com/ogasawarashicho/status/2063900919788454054"}, {"fact": "6月25日、台風の接近で藍ヶ江漁港を車両通行止めにし、28日に解除した", "url": "https://x.com/ogasawarashicho/status/2070033822364692656"}, {"fact": "6月28日の解除", "url": "https://x.com/ogasawarashicho/status/2071062581654036633"}, {"fact": "7月9日、高波で八重根港と藍ヶ江漁港を車両通行止めにし、14日に解除した", "url": "https://x.com/ogasawarashicho/status/2075101427538465006"}, {"fact": "7月14日の解除", "url": "https://x.com/ogasawarashicho/status/2076842116999778651"}], "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2086617180313936310"}, {"label": "東京都(島しょ) 中之郷(藍ヶ江)漁港通行止め", "url": "https://x.com/ogasawarashicho/status/2084442379436675113"}, {"label": "東京都(島しょ) 汐間道路の通行止め解除", "url": "https://x.com/ogasawarashicho/status/2085162537805385868"}, {"label": "東海汽船 運航", "url": "https://www.tokaikisen.co.jp/news/805075/"}, {"label": "東京都(島しょ) 八重根港・中之郷(藍ヶ江)漁港通行止め解除", "url": "https://x.com/ogasawarashicho/status/2063900919788454054"}], "label": "町政", "audience": "両方", "thread_id": "t20260805-20", "followup": true, "id": "4650fb", "photo": {"type": "img", "src": "/img/kiji/4650fb.jpg?v=75ff6b", "og": "/img/kiji/4650fb-og.jpg?v=75ff6b", "s": "/img/kiji/4650fb-s.jpg?v=75ff6b", "m": "/img/kiji/4650fb-m.jpg?v=75ff6b", "caption": "藍ヶ江漁港", "credit": "", "file": "own/aigae-gyoko-4.jpg"}}], "agenda": [{"date": "2026-08-11", "end": null, "text": "八丈島納涼花火大会", "url": "https://www.hachijo.gr.jp/blogs/hanabi2026/"}, {"date": "2026-08-13", "end": "2026-08-15", "text": "各地区の盆踊り(日程は地区ごと)", "url": "https://www.hachijo.gr.jp/blogs/bon-odori_20 function funeRows(u){
