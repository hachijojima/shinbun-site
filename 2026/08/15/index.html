<script type="application/json" id="edition">{"date": "2026-08-15", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-26T17:48:13+09:00", "prev": "/2026/08/13/", "next": "/2026/09/01/", "alerts": [], "weather": {"issued": "2026-08-15T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ 時々 雨", "main": "晴れ 時々 雨", "hachijo": "晴れ 時々 雨", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 30}]}, "koyomi": {"sunrise": "5:03", "sunset": "18:28", "moon": 1.8, "tide": {"place": "八丈島(神湊)", "high": [["6:19", 150], ["19:06", 146]], "low": [["0:24", 70], ["12:38", 36]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "東海汽船処分、21日に聴聞へ", "body": ["八丈町は14日、東海汽船株式会社の不適切事案に対する町の対応をまとめ、公表した。山下奉也町長は10日、都内のほかの島しょ町村長とともに、国土交通省関東運輸局長と面会した。利島村の村山将人村長によると、運輸局は処分の前に開く聴聞の日を21日と説明した。", "東海汽船の竹芝—八丈島航路は、島の暮らしと物流を支えている。町と町議会が3日に小池百合子知事あてに出した要望書は、この航路に触れている。台風22号・23号からの復旧で災害廃棄物の島外搬出と資材の運搬が増え、海上輸送が逼迫しているという。航路が止まれば暮らしと地域経済に深刻な影響が出るとして、代替輸送の確保などを都に求めた。", "10日の面会には、町長らが東京都島嶼町村会として臨んだ。村山村長によると、処分の現状とこれからの手続きを確かめるためだった。聴聞の通知は7月31日に出ている。運輸局の説明では、東海汽船が改善計画を出し、運輸局がその内容を審査する。審査には1〜2か月かかる見込みだという。村山村長は、9月の連休までの繁忙期は船の運航に大きな変わりはないと受け止めている。ただ、手続きと処分の内容しだいで変わりうるとしている。", "東海汽船は7月31日、国交省が一般旅客定期航路事業の停止処分などに向けた手続きを進めていると発表した。根拠の法律は海上運送法。同社は対象の事案として、船員の酒気帯び乗務、アルコール検査の肩代わり、舷門を閉じないままの運航などを挙げた。外部の専門家による調査委員会も設けた。TOKYO MXによると、小池知事は7日の定例会見で事案を「誠に遺憾」とした。そのうえで、島民生活への影響をできるだけ抑えるよう対応したいと述べた。"], "added": [{"fact": "町の対応のページに、8月10日に八丈町長がほかの東京都島嶼町村長とともに国土交通省関東運輸局長に面会したとの記載", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260814/"}, {"fact": "利島村の村山将人村長が10日、東京都島嶼町村会として関東運輸局長と面会。聴聞は8月21日の予定、通知は7月31日、改善計画の確認・審査に1〜2か月を要する見込み、9月連休までは運航に大きな変化はないとの受け止め", "url": "http://toshimashito.jp/blog-entry-550.html"}, {"fact": "3日の要望書は八丈町長山下奉也と町議会議長山本忠志の連名で、東京都知事小池百合子あて。台風22号・23号からの復旧で海上輸送が逼迫していると記し、代替輸送の確保などを求めた", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/14143049/%E6%9D%B1%E6%B5%B7%E6%B1%BD%E8%88%B9%E6%A0%AA%E5%BC%8F%E4%BC%9A%E7%A4%BE%E3%81%AB%E5%AF%BE%E3%81%99%E3%82%8B%E8%A1%8C%E6%94%BF%E5%87%A6%E5%88%86%E3%81%AB%E9%96%A2%E3%81%99%E3%82%8B%E8%A6%81%E6%9C%9BV6.pdf"}, {"fact": "東海汽船の7月31日の発表:酒気帯び乗務、アルコール検査の肩代わり、舷門未閉鎖の状態での運航など。国交省が海上運送法に基づき事業停止処分等に向けた手続中。外部専門家の調査委員会を設置", "url": "https://www.tokaikisen.co.jp/news/803612/"}, {"fact": "小池知事が8月7日の定例会見で「誠に遺憾」とし、島民生活への影響を抑えるよう対応すると述べた", "url": "https://s.mxtv.jp/tokyomxplus/mx/article/202608101000/detail/"}], "figure": null, "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2088095128624005462"}, {"label": "八丈町 東海汽船株式会社の不適切事案に関する町の対応", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260814/"}, {"label": "八丈町・八丈町議会 東海汽船株式会社に対する行政処分に関する要望", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/14143049/%E6%9D%B1%E6%B5%B7%E6%B1%BD%E8%88%B9%E6%A0%AA%E5%BC%8F%E4%BC%9A%E7%A4%BE%E3%81%AB%E5%AF%BE%E3%81%99%E3%82%8B%E8%A1%8C%E6%94%BF%E5%87%A6%E5%88%86%E3%81%AB%E9%96%A2%E3%81%99%E3%82%8B%E8%A6%81%E6%9C%9BV6.pdf"}, {"label": "利島村長ブログ", "url": "http://toshimashito.jp/blog-entry-550.html"}, {"label": "東海汽船 ニュースリリース", "url": "https://www.tokaikisen.co.jp/news/803612/"}, {"label": "TOKYO MX+", "url": "https://s.mxtv.jp/tokyomxplus/mx/article/202608101000/detail/"}], "label": "町政", "audience": "島民", "thread_id": "t20260802-6", "followup": true, "id": "63a61e", "photo": {"type": "img", "src": "/img/kiji/63a61e.jpg?v=e49e58", "og": "/img/kiji/63a61e-og.jpg?v=e49e58", "s": "/img/kiji/63a61e-s.jpg?v=e49e58", "m": "/img/kiji/63a61e-m.jpg?v=e49e58", "caption": "竹芝で東海汽船の橘丸とレインボーブリッジ", "credit": "", "file": "ac/26160862.jpg"}}, "side": [], "shorts": [{"headline": "八丈高校図書館 15・16日開放", "body": ["都立八丈高校（大賀郷）は15日と16日の両日、校内の図書館を地域に開放する。同校が14日に案内した。本を借りられるのは島内に住む人に限り、館内では飲食できない。", "同校は昨年12月、図書館を毎週土・日曜に開放すると案内した。今回の両日も土曜と日曜にあたる。島にはほかに八丈町立図書館があり、月曜と祝日が休館で、8月は28日も休む。", "同校の施設使用規程は2001年に施行され、2023年1月に一部改定された。規程は図書館を、地域に開く文化施設と位置づけている。使えるのは個人登録をした八丈町民で、借りた本をなくしたときは弁済する。開館日は別に決め、広報誌などで知らせることにしている。", "同校は7月、18日から20日までの3連休を3日とも開いた。一方、5月3日と9日は休館した。3月には、4月に入学する生徒が入学前に取り組む課題本をカウンターに集め、開放日に使うよう呼びかけた。", "都の「令和8年度都立学校学習文化施設開放予定校一覧」（6月25日現在）によると、伊豆諸島と小笠原では大島、新島、三宅、小笠原の各高校も図書室や図書館を開放施設に挙げている。八丈高校は、本や資料の閲覧と貸し出しを行う図書室と、楽器演奏や演劇などの文化活動に使う視聴覚ホールを開放施設に挙げている。"], "added": [{"fact": "同校は2025年12月の案内で、図書館の開放を毎週土・日曜としていた", "url": "https://x.com/tokyo8jouhs/status/1995666344835215463"}, {"fact": "7月18日から20日の3連休を3日とも開いた", "url": "https://x.com/tokyo8jouhs/status/2078017951085777265"}, {"fact": "5月3日と5月9日は休館した", "url": "https://x.com/tokyo8jouhs/status/2052694666706047171"}, {"fact": "3月に入学予定者向けの課題本をカウンターに集め、一般開放日の利用を呼びかけた", "url": "https://x.com/tokyo8jouhs/status/2029814238760386882"}, {"fact": "施設使用規程は2001年9月1日施行、2023年1月1日に一部改定。図書館は文化施設として開放し、使えるのは個人登録をした八丈町民。開館日時は別に定め広報誌等で周知。貸した本を紛失したときは弁済", "url": "https://www.metro.ed.jp/hachijo-h/l_pdf/（A）八高施設開放規程（23.1.1)  .pdf"}, {"fact": "令和8年度都立学校学習文化施設開放予定校一覧（6月25日現在）で、大島・新島・三宅・小笠原の各高校も図書室・図書館を開放施設に挙げ、八丈高校は図書室（図書・資料の閲覧および貸出）と視聴覚ホール（楽器演奏、声楽、演劇、各種文化活動）を挙げる", "url": "https://www.syougai.metro.tokyo.lg.jp/sesaku/kaihou/files/gakushu/r08ichiran0625.pdf"}, {"fact": "八丈町立図書館は月曜と祝日が休館で、8月は28日も休館", "url": "https://x.com/i/web/status/2084421557066068421"}], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2088130814878097839"}, {"label": "都立八丈高校 施設使用規程", "url": "https://www.metro.ed.jp/hachijo-h/l_pdf/（A）八高施設開放規程（23.1.1)  .pdf"}, {"label": "東京都 令和8年度都立学校学習文化施設開放予定校一覧", "url": "https://www.syougai.metro.tokyo.lg.jp/sesaku/kaihou/files/gakushu/r08ichiran0625.pdf"}, {"label": "八丈町立図書館の案内", "url": "https://x.com/i/web/status/2084421557066068421"}], "label": "教育", "audience": "島民", "thread_id": "t20260815-54", "id": "c0d4b7", "photo": {"type": "img", "src": "/img/kiji/c0d4b7.jpg?v=6aea60", "og": "/img/kiji/c0d4b7-og.jpg?v=6aea60", "s": "/img/kiji/c0d4b7-s.jpg?v=6aea60", "m": "/img/kiji/c0d4b7-m.jpg?v=6aea60", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-2.jpg"}}, {"headline": "末吉応援ミニコンサート、21日", "body": ["八丈島文化協会は21日15時から、末吉公会堂で「末吉応援ミニコンサート」を開く。23日の八丈ウインズフェス2026の前に開く催しで、ゲストの3人が3曲を演奏する。うち1曲は、このコンサートのために特別に編曲した。", "ウインズフェスの本番は、大賀郷にある八丈町多目的ホール「おじゃれ」で開く。その2日前に、末吉の公会堂で演奏を聴く場を設けた。協会は、末吉の住民だけでなく、どの地区の人にも来てほしいと案内している。ゲストの名前と曲名、入場料は、協会の案内に載っていない。", "23日の本番は13時30分に開場し、14時に開演する。入場料は500円で、高校生以下は無料。主催は協会と八丈ウインズフェス実行委員会で、八丈町と町教育委員会が後援する。島民と、島外から招いた演奏家や音大生、御蔵島の参加者で合同バンドを組む。人数は80人を超える予定で、島の小中高校生も加わる。指揮は前回に続き甘粕宏和さんが務める。", "協会によると、ウインズフェスは島の子どもたちが一流の指導者から教わる機会をつくり、島内と島外、世代を超えた交流を広げるために開く。協会は今回を「3年ぶり」の開催としている。前回は2024年2月25日におじゃれで開いた。このとき、八丈島の伝統をテーマに書かれた「吹奏楽のための『おじゃれ』〜八丈島民謡による幻想曲〜」が初めて演奏された。今回もこの曲を演奏する。作曲は福島弘和さん。"], "added": [{"fact": "ミニコンサートはゲスト3人による演奏で、協会は末吉の人に限らずどの地域の人にも来場を呼びかけている", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-ウインズフェスプレイベント末吉応援ミニコンサートのお知らせ/"}, {"fact": "ウインズフェス2026は13時30分開場、14時開演、入場料500円(高校生以下無料)。主催は八丈島文化協会と八丈ウインズフェス実行委員会、後援は八丈町と町教育委員会。合同バンドは80人を超える予定で、島の小中高校生も参加する。目的は島の子どもが一流の指導者から教わる機会と、島内外・世代を超えた交流。協会は「3年ぶり」の開催としている", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-八丈ウインズフェス2026開催のお知らせ/"}, {"fact": "前回のウインズフェスは2024年2月25日におじゃれで開かれ、八丈島の伝統をテーマに書き下ろされた「吹奏楽のための『おじゃれ』〜八丈島民謡による幻想曲」が世界初演された", "url": "https://x.com/i/status/1761284426955395539"}, {"fact": "2026年の曲目に、福島弘和「吹奏楽のための『おじゃれ』〜八丈島民謡による幻想曲〜」が入っている", "url": "https://8jobunka.jimdofree.com/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88/%E5%8D%94%E4%BC%9A%E4%B8%BB%E5%82%AC-%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B92026%E5%8F%82%E5%8A%A0%E8%80%85%E5%8B%9F%E9%9B%86/"}], "sources": [{"label": "八丈島文化協会", "url": "https://x.com/8jobunka/status/2088060046538416621"}, {"label": "八丈島文化協会 ウインズフェスプレイベント末吉応援ミニコンサート", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-ウインズフェスプレイベント末吉応援ミニコンサートのお知らせ/"}, {"label": "八丈島文化協会 八丈ウインズフェス2026開催", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-八丈ウインズフェス2026開催のお知らせ/"}, {"label": "八丈島文化協会 八丈ウインズフェス2026参加者募集", "url": "https://8jobunka.jimdofree.com/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88/%E5%8D%94%E4%BC%9A%E4%B8%BB%E5%82%AC-%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B92026%E5%8F%82%E5%8A%A0%E8%80%85%E5%8B%9F%E9%9B%86/"}, {"label": "八丈町(X) 2024年八丈ウインズフェスの案内", "url": "https://x.com/i/status/1761284426955395539"}], "label": "文化", "audience": "両方", "thread_id": "t20260807-29", "followup": true, "id": "e56263", "photo": {"type": "img", "src": "/img/kiji/e56263.jpg?v=70dca9", "og": "/img/kiji/e56263-og.jpg?v=70dca9", "s": "/img/kiji/e56263-s.jpg?v=70dca9", "m": "/img/kiji/e56263-m.jpg?v=70dca9", "caption": "八丈町役場", "credit": "", "file": "own/yakuba-12.jpg"}}, {"headline": "商工会が月10日勤務の職員募集", "body": ["八丈町商工会は14日、町のホームページにある「八丈町おしごと掲示板」に、商工会で働く人の求人が載ったと知らせた。勤務は月10日ほどで、勤務日はその都度相談して決める。主な仕事は島の小規模事業者の記帳指導などの経理事務で、日給は8000円。", "雇用はアルバイト・パートで、期間は9月1日から2027年3月31日まで。更新もある。記帳指導は、小さな店や事業者の帳簿づけを手助けする仕事だ。夏まつりなど商工会の催しの手伝いと、そのほかの商工会の事業も受け持つ。勤務地は大賀郷。", "年齢と学歴は問わない。条件は普通自動車免許と、ワード・エクセル・アウトルックの基本操作ができること。免許は取得見込みでもよい。採用から1年以内に日本商工会議所の簿記検定3級を取る必要があり、試験は島内でも受けられる。", "商工会は今年、職員の募集を重ねている。2月には、仕事の中身と勤務の形がそれぞれ違う3人を掲示板で募った。3月から4月にかけても掲示板に求人を載せた。3日には自らのホームページで、記帳指導員の契約職員の募集を知らせていた。", "掲示板は2016年3月に始まった。2015年度の人口ビジョン・総合戦略の施策の一つで、後継ぎや働き手を探す事業者の情報を集め、島で働きたい人に届ける。業種と雇用形態のほか、町の定住支援金の対象かどうかでも求人を絞り込める。掲示板の問い合わせ先は町企画財政課。", "応募は、電話かメールで問い合わせるか、履歴書を郵送するか持参する。問い合わせは商工会(04996-2-2121)へ。"], "added": [{"fact": "求人の雇い主は八丈町商工会で、雇用形態はアルバイト・パート。仕事は小規模事業者の記帳指導などの経理事務、夏まつりなど商工会の催しの業務、そのほかの商工会事業", "url": "https://www.town.hachijo.tokyo.jp/keijiban/dt00002110/"}, {"fact": "日給8000円。期間は2026年9月1日以降から2027年3月31日まで(更新あり)。勤務地は大賀郷2551-2", "url": "https://www.town.hachijo.tokyo.jp/keijiban/dt00002110/"}, {"fact": "応募資格は年齢・学歴不問、普通自動車免許(取得見込み可)、Word・Excel・Outlookの基本操作。採用後1年以内に日商簿記検定3級の取得が必要(島内受検可)。応募は電話・メールでの問い合わせか、履歴書の郵送・持参。電話04996-2-2121", "url": "https://www.town.hachijo.tokyo.jp/keijiban/dt00002110/"}, {"fact": "おしごと掲示板は平成28年3月に始まり、平成27年度の人口ビジョン・総合戦略の施策の一つ。業種・雇用形態・定住支援金対象で絞り込める。問い合わせ先は企画財政課", "url": "https://www.town.hachijo.tokyo.jp/keijiban/"}, {"fact": "商工会は2026年2月20日に、仕事内容・勤務形態の違う3人の募集を掲示板に載せたと知らせ、3月27日と4月2日にも掲示板への求人掲載を知らせた。8月3日には自らのホームページに契約職員(記帳指導員)募集のお知らせを載せたと知らせた", "url": "https://x.com/hachisho8"}], "sources": [{"label": "八丈町商工会", "url": "https://x.com/hachisho8/status/2088075824264323095"}, {"label": "八丈町おしごと掲示板 求人ページ", "url": "https://www.town.hachijo.tokyo.jp/keijiban/dt00002110/"}, {"label": "八丈町おしごと掲示板", "url": "https://www.town.hachijo.tokyo.jp/keijiban/"}], "label": "産業", "audience": "島民", "thread_id": "t20260815-55", "id": "eb0d57", "photo": {"type": "img", "src": "/img/kiji/eb0d57.jpg?v=e51268", "og": "/img/kiji/eb0d57-og.jpg?v=e51268", "s": "/img/kiji/eb0d57-s.jpg?v=e51268", "m": "/img/kiji/eb0d57-m.jpg?v=e51268", "caption": "八丈町商工会", "credit": "", "file": "own/shokokai-2.jpg"}}, {"headline": "伊豆諸島開発に建造中の船", "body": ["八丈島と青ヶ島を結ぶ船を運航する伊豆諸島開発株式会社(東京都港区)は11日、建造中の船があり、その完成を待っているとした。船名、就く航路、就航の時期は示していない。今の船の代わりになるのかどうかも分からない。", "青ヶ島航路の定期船は、2022年2月からくろしお丸(499トン)が務める。あおがしま丸(460トン)は2014年1月に就航した。2022年3月からは予備の船で、ほかの船がドックに入る間などに青ヶ島航路を受け持つ。同社はこのほかに、2016年7月から父島—母島航路でははじま丸を運航している。", "同社が前に新しく船を造ったのはくろしお丸のときである。この船はゆり丸の代わりとして造られた。同社は2021年3月23日、長崎市の渡辺造船所が受注したこの船の建造を公表した。船は2022年1月5日に完成した。青ヶ島航路の旅客の定員は、ゆり丸の40人から84人に増えた。"], "added": [{"fact": "伊豆諸島開発は2026年8月11日、建造中の船の完成を待っているとした", "url": "https://x.com/izu_shibaura/status/2087115667636101493"}, {"fact": "くろしお丸は2022年2月から八丈島—青ヶ島航路の定期船。あおがしま丸は2022年3月から予備の船で、他船のドック入り中などに青ヶ島航路を受け持つ", "url": "https://ja.wikipedia.org/wiki/あおがしま丸"}, {"fact": "あおがしま丸は460トン、2014年1月就航", "url": "https://funeco.jp/ship/aogashima-maru/"}, {"fact": "くろしお丸はゆり丸の代わりとして長崎市の渡辺造船所で建造。2021年3月23日に、渡辺造船所が受注した新造船の建造を公表。499トン。青ヶ島航路の旅客定員は40人から84人に", "url": "https://funeco.jp/news/news-17315/"}, {"fact": "くろしお丸は2022年1月5日に渡辺造船所で竣工・引き渡し", "url": "https://www.izu-syotou.jp/images/notice/202201071140.pdf"}, {"fact": "ははじま丸は2016年7月に父島—母島航路に就航", "url": "https://www.izu-syotou.jp/ships/newship.html"}, {"fact": "伊豆諸島開発の本社は東京都港区。航路は八丈島—青ヶ島、父島—母島", "url": "https://www.izu-syotou.jp/"}], "sources": [{"lab function ymd(iso){ const [y,m,d]=iso.split("-").map(Number); return {y,m,d,w:new Date(Date.UTC(y,m-1,d)).getUTCDay()}; }
const seireki = iso => { const t=ymd(iso); return `${t.y}年${t.m}月${t.d}日`; };

  return l.length ? `<span class="src">出典 ${l.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(srcName(s.label))}</a>`).join("、")}</span>` : ""; };

/* 天気欄の1行:予報文はおおまかに(題字下と同じ丸め)、降水確率はその日のいちばん高い値、風は「後」の前、波は最初の高さ */
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',

const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };

const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
/* 島の足:東海汽船の表を、島の人が読む形に並べ直す(言葉は表のまま)。「島のいま」の「船」の項になる */
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  // 載せるのは、けさ八丈島に着く東京からの船(昨晩発)と、八丈島→青ヶ島。今晩発・八丈島→東京・青ヶ島→八丈島は載せない(利用者の指定)
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;

    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
