<script type="application/json" id="edition">{"date": "2026-08-21", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-28T17:34:38+09:00", "prev": "/2026/08/20/", "next": "/2026/08/22/", "alerts": [], "weather": {"issued": "2026-08-21T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 23, "max": 31}]}, "koyomi": {"sunrise": "5:07", "sunset": "18:21", "moon": 7.8, "tide": {"place": "八丈島(神湊)", "high": [["21:23", 129]], "low": [["5:04", 66]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "底土港護岸、24日に21m延伸予定", "body": ["東京都は24日、底土港でコンクリート製の箱「ケーソン」1基を海に沈め、港を波から守る護岸を21m延ばす作業を予定している。当日は見学会も開く。1986年度に始まった港の整備事業の一部で、事業全体の完了予定は2028年度から2031年度に延びている。", "都の開札結果をまとめた民間の入札情報サイトによると、作業は「令和7年度神湊港護岸（防波）Ⅱ建設及びその他工事」に含まれる。ケーソンは長さと幅が21m、高さが15.5mで、重さは3万5216キロニュートン、本紙の換算では約3600トンにあたる。開札は2月12日で、入札したのは五洋・赤間建設共同企業体の1者だけだった。同企業体が税込み4億2130万円で落札し、予定価格に対する落札率は99.7%。工期は10月13日まで。", "都八丈支庁はケーソンを「5〜6階建ての建物に相当する」鉄筋コンクリートの箱と説明しており、東京港で造って八丈島まで船で引いてくる。都港湾局の事業評価資料によると、気象や海の条件が厳しい島での作業を据え付けだけにして、費用を抑えるためだ。", "工事の対象は、既にある護岸の先に延ばす171mの区間で、都は「護岸（防波）Ⅱ」と呼んでいる。都の事業名は「神湊港底土地区離島ターミナル整備事業」。港湾局が2024年11月の事業評価委員会に出した資料によると、定期貨客船の大型化に合わせて岸壁を延ばし、護岸と防波堤で港内の波を静めて就航率を上げることや、乗り降りと荷役の安全を高めることが目的で、災害時に避難や物資輸送の拠点として使うことも掲げている。神湊港は島の生活や産業に必要な貨物の大半を扱い、2018〜22年の取扱量は年平均で16万トンだった。", "完成時期は延びてきた。2019年10月の評価で、護岸（防波）Ⅱの整備済み区間は68.5m、事業全体の完了は2028年度、事業費は234億円とされていた。2024年11月の評価では、この5年間に55.5m延びて整備済みは124mとなり、残りは47mだった。完了予定は2031年度に、事業費は239.7億円に改められた。理由について都は、現場の水深が深く波の条件も悪いため、水中作業や潜水作業の効率が想定より低かったと説明している。2019年の評価でも、堤体の幅を当初より広げる必要が分かったとして事業費を63.2億円増やしていた。事業の便益を費用で割った値は、2014年度の評価の2.0から1.4、1.2と下がっている。それでも都は継続が妥当とする原案を示した。護岸の完成後には道路448mの整備が残る。", "今回の据え付けは当初からの計画に沿った工事で、台風被害の復旧とは別だ。国土交通省のまとめによると、昨年10月の台風22号で神湊港の防波堤の一部が動いてずれたが、港の利用に影響はなかった。八丈支庁が7月1日に発行した広報紙「支庁の風」の2026年度事業一覧は、神湊港の工事として護岸（防波）Ⅱのケーソン据え付けと並べ、防波堤（北）の災害復旧工事を別に挙げている。", "都の案内チラシによると、見学会は申し込み不要で、集合場所は底土船客待合所の2階。ケーソンを沈める作業を、ビデオやライブ映像を使って解説する。据え付けの日は天候や海の状況で変わることがあり、変更は都のXで知らせる。希望者が多いと全員を案内できない場合がある。"], "added": [{"fact": "今回据え付けるケーソンは1基で、長さ21m・幅21m・高さ15.5m、重量は3万5216キロニュートン。護岸（防波）Ⅱを施工延長21m分延ばす。工事は五洋・赤間建設共同企業体が4億2130万円（税込）で落札し、入札したのは1者、工期は2026年10月13日まで", "url": "https://bid.const-ai.com/tokyo/?id=5525&p=project"}, {"fact": "護岸（防波）Ⅱは計画171mのうち124mが整備済みで、残りは47m（2024年11月時点）。完成予定は2031年度、事業費は239.7億円。深い水深と悪い波浪条件で水中作業の効率が低く、期間が延び、費用が5.7億円増えた。ケーソンは東京港で製作し、島では据え付けだけを行う", "url": "https://www.kensetsu.metro.tokyo.lg.jp/documents/d/kensetsu/r6-4-explanation-kaminato_pdf"}, {"fact": "2019年の評価では完成予定2028年度・事業費234億円で、当時の整備済みは68.5mだった", "url": "https://www.kensetsu.metro.tokyo.lg.jp/documents/d/kensetsu/000051039"}, {"fact": "2026年度、都は神湊港で護岸（防波）Ⅱのケーソン据付と、台風22号・23号で一部がずれた防波堤（北）の災害復旧工事を別々に計上している", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/hachijosetsumeikai2026"}, {"fact": "見学会は申し込み不要で、集合は底土船客待合所の2階。据え付けの日は天候や海の状況で変わることがあり、変更はXで知らせる", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/d-kowan_0723"}], "figure": {"type": "place", "name": "神湊（底土）港"}, "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2089517673663074446"}, {"label": "東京都 ケーソン据付工事見学会の案内チラシ", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/d-kowan_0723"}, {"label": "入札情報サイト（東京都の開札結果のまとめ）令和7年度神湊港護岸（防波）Ⅱ建設及びその他工事", "url": "https://bid.const-ai.com/tokyo/?id=5525&p=project"}, {"label": "東京都港湾局 令和6年度第4回事業評価委員会資料 神湊港底土地区離島ターミナル整備事業", "url": "https://www.kensetsu.metro.tokyo.lg.jp/documents/d/kensetsu/r6-4-explanation-kaminato_pdf"}, {"label": "東京都港湾局 令和元年度第3回事業評価委員会資料 神湊港底土地区離島ターミナル整備事業", "url": "https://www.kensetsu.metro.tokyo.lg.jp/content/000051039.pdf"}, {"label": "東京都八丈支庁「支庁の風」第145号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/a-260701"}, {"label": "国土交通省 令和7年台風第22号及び第23号による被害状況等について", "url": "https://www.mlit.go.jp/common/001968747.pdf"}, {"label": "東京都八丈支庁 港湾の仕事", "url": "https://www.soumu.metro.tokyo.lg.jp/09hatijou/shokai_top/shigoto_top/shigoto_port"}], "label": "町政", "audience": "両方", "thread_id": "t20260821-79", "id": "b9597e", "photo": {"type": "img", "src": "/img/kiji/b9597e.jpg?v=9a70c7", "og": "/img/kiji/b9597e-og.jpg?v=9a70c7", "s": "/img/kiji/b9597e-s.jpg?v=9a70c7", "m": "/img/kiji/b9597e-m.jpg?v=9a70c7", "caption": "底土港の防波堤整備現場", "credit": "", "file": "ac/27266276.jpg"}, "edited": "2026-11-28T13:54:37+09:00"}, "side": [], "shorts": [{"headline": "台風18号、沖縄方面へ進む予報", "body": ["台風18号（ソウデル）は21日3時、マリアナ諸島を北北西へ時速20キロで進んでいる。ウェザーニュースによると、台風は25日ごろに沖縄県の大東島地方へ近づく予想で、その後の進路はまだ定まっていない。八丈町は20日12時の防災八丈で台風の発生を伝え、今後の気象情報に注意するよう呼びかけた。", "日本気象協会によると、台風は19日12時にトラック諸島近海で発生した。発生時の中心気圧は1002ヘクトパスカル、中心付近の最大風速は18メートルだった。ウェザーニュースによると、21日3時には中心気圧が990ヘクトパスカル、最大風速は25メートル、最大瞬間風速は35メートルまで強まった。21日中に暴風域を伴い、23日までに最大風速45メートルの「非常に強い」勢力になる見込みである。26日の予報円には沖縄本島や奄美大島が入っている。", "ウェザーニュースが伝えた気象庁の確率では、5日先までに暴風域に入る確率は、20日15時の時点で小笠原諸島が43％、大東島地方が24％、奄美地方が12％だった。小笠原諸島は同じ日の朝の35％から上がっている。この確率が挙げた地域に伊豆諸島は入っていない。日本気象協会は19日、台風が23日に小笠原近海へ進むとの見通しを示した。本紙の計算では、八丈島から父島までは南へ約710キロ、南大東島までは南西へ約1160キロある。同協会は、台風の北上につれてうねりが太平洋沿岸に届き、次第に波が高くなる可能性があると指摘した。台風が離れていても、高波やうねりに注意するよう呼びかけている。", "20日の交通は平常どおりだった。八丈島観光協会によると、ANAの羽田—八丈島線は終日通常どおり運航した。東海汽船の橘丸は、19日夜竹芝発（20日朝八丈島着）の便が9時に底土港へ入る予定と案内された。14日から20日までの7日間、東京からの船は7日とも就航した。週明けの24日には、底土港でケーソンを据え付ける作業とその見学会が予定されている。東京都八丈支庁港湾課は、据え付けの日が天候や海の状況で変わることがあり、変更は都のXで知らせるとしている。"], "added": [{"fact": "21日3時、台風18号はマリアナ諸島にあり、北北西へ時速20キロで移動。中心気圧990hPa、最大風速25m/s、最大瞬間風速35m/s。23日に「非常に強い」勢力となり、25日ごろ大東島地方に接近し、26日には予報円に沖縄本島や奄美大島が入る予想。その後の進路は不確実（ウェザーニュース、21日3時40分配信）", "url": "https://weathernews.jp/news/202608/210031/"}, {"fact": "気象庁の20日15時の5日先までに暴風域に入る確率は、小笠原諸島43％、大東島地方24％、奄美地方12％など。挙げられた地域に伊豆諸島はない（ウェザーニュース、20日15時59分配信）", "url": "https://weathernews.jp/news/202608/200191/"}, {"fact": "19日12時の発生時は中心気圧1002hPa、最大風速18m/s。日本気象協会は、台風のうねりで太平洋沿岸の波が高くなる可能性を挙げた", "url": "https://tenki.jp/forecaster/gureweather/2026/08/19/40213.html"}, {"fact": "20日はANAが終日通常運航し、東海汽船の19日東京発の便は9時に底土港へ入港予定（八丈島観光協会）", "url": "https://x.com/Go_Hachijo_JP/status/2090214555943395395"}], "sources": [{"label": "八丈町", "url": "https://x.com/HachijoTown/status/2090272623875780973"}, {"label": "スーパーあさぬま", "url": "https://x.com/umikaze8jo/status/2090221118284296513"}, {"label": "ウェザーニュース", "url": "https://weathernews.jp/news/202608/210031/"}, {"label": "日本気象協会 tenki.jp", "url": "https://tenki.jp/forecaster/gureweather/2026/08/19/40213.html"}, {"label": "八丈島観光協会", "url": "https://x.com/Go_Hachijo_JP/status/2090214555943395395"}, {"label": "東京都八丈支庁港湾課 ケーソン据付工事見学会", "url": "https://www.soumu.metro.tokyo.lg.jp/09hatijou/kakuka_top/d-top/R8caisson2"}], "label": "くらし", "audience": "両方", "thread_id": "t20260821-80", "id": "b901a5", "photo": {"type": "img", "src": "/img/kiji/b901a5.jpg?v=312e0a", "og": "/img/kiji/b901a5-og.jpg?v=312e0a", "s": "/img/kiji/b901a5-s.jpg?v=312e0a", "m": "/img/kiji/b901a5-m.jpg?v=312e0a", "caption": "東京都・八丈島の海", "credit": "", "file": "ac/2478665.jpg"}, "edited": "2026-11-28T11:59:59+09:00"}, {"headline": "島産小ムロのくさや売り出し", "body": ["八丈島で揚がった小型のムロアジ「小ムロ」のくさやを、カネワ水産が20日に干し上げ、同日15時過ぎから売り出すとXで告知した。島のムロアジ漁は8月に始まったばかりだ。東京都は4月にまとめた資源評価で、原料となるこの魚の昨季の資源水準を「中位」から「低位」に引き下げている。", "同社の投稿によると、このくさやは18日から仕込み、20日に干し上がった。同社は、頭から食べられるのはこの時期だけだとしている。18日にも「新鮮とれたてムロアジ」でくさやを作っていると投稿していた。全国発送と電話注文も受け付けている。", "東京都八丈支庁の「八丈島水産だより」8月号によると、ムロアジ漁は8月に始まり、例年8月の初めは体長20センチほどの小型の魚が中心になる。昨年度は30センチを超える魚が漁期の前半から揚がっていた。都島しょ農林水産総合センター八丈事業所が2014年に出した資料は、毎年7〜8月に小ムロが島の周りに来て、翌年まで留まって育ち、大ムロになると推測している。同年7月の調査では、口先から尾びれの付け根までの長さを示す尾叉長は、小ムロが平均21.5センチ、大ムロが28.9センチだった。都の資源評価は、ムロアジの仲間のクサヤモロが1歳で尾叉長18.5センチ、2歳で24.9センチに育つと推定している。同事業所の今泉洋介さんがまとめた研究成果では、島で獲れる魚の重さは8月が最も軽く、11月まで重くなり続けた。", "島での水揚げは大きく減っている。同じ研究成果によると、島の棒受け網漁の漁獲量は2007年の339トンから2021年には17.8トンに減り、操業する船は20年前の約9隻から1隻になった。都の資源評価では、伊豆諸島海域の水揚量は2022年が10トン、2023年が19トンだった。2022年は魚が島の周りに回ってこず、支庁の水産だより10月号の時点でも漁が始まっていなかった。ただ、水揚げの量は資源の多さだけでは決まらない。同事業所の2014年の資料は、くさやの需要が落ち込んでいることを漁獲量が減った理由の一つに挙げていた。都の評価票によると、島の棒受け網漁では魚の値崩れを防ぐため、出荷できる量をもとに船1隻が1日に獲る量を制限している。", "このため都は、船1隻が1日に揚げる量を資源の量の目安にしている。2024年4月の評価では、2023年のこの量が322キロで「低位」とされた。翌2025年4月の評価では、2024年が605.3キロに回復して「中位」に上がった。今年4月の評価では、2025年が338.4キロにとどまった。最も多かった2018年の1104.8キロの3分の1に届かないとして、再び「低位」とされた。本紙の計算では、前年より約44％少ない。直近5年の動きは「横ばい」と評価された。", "今季これまでの島の水揚げ量は公表されていない。島で作るくさやのうち、島で揚がったムロアジを原料にしたものがどれだけかを示す公表資料もない。"], "added": [{"fact": "島のクサヤモロ棒受け網漁の漁獲量は2007年の339トンから2021年に17.8トンへ減り、操業隻数は20年前の約9隻から1隻になった（都島しょ農林水産総合センター八丈事業所の研究成果）。島で獲れる魚の重さは8月が最も軽く、11月まで増え続けた", "url": "https://www.ifarc.metro.tokyo.lg.jp/survey/uploads/15b2219000150f5acd21e1b3e54bfb12.pdf"}, {"fact": "都の資源評価（2026年4月）によると、伊豆諸島海域のクサヤモロ水揚量は2007年の最大364トンから2022年に10トンへ減った。2025年のCPUEは338.4キロで「低位・横ばい」。島の棒受け網漁では、値崩れを防ぐため1隻1日あたりの漁獲を制限している。年齢ごとの体長は1歳18.5センチ、2歳24.9センチ", "url": "https://www.sangyo-rodo.metro.tokyo.lg.jp/documents/d/sangyo-rodo/2026-04-08-160023-920"}, {"fact": "小ムロは毎年7〜8月に島の周りに来て、翌年まで留まって大ムロに育つと推測されている。2014年7月の調査では、平均尾叉長は小ムロ21.5センチ、大ムロ28.9センチ。くさやの需要が落ち込み、漁獲量は200トンを下回っていた", "url": "https://www.ifarc.metro.tokyo.lg.jp/archive/resources/content/14770/20140905-174806.pdf"}], "sources": [{"label": "カネワ水産", "url": "https://x.com/ohakoya18/status/2090279703227871569"}, {"label": "東京都八丈支庁「八丈島水産だより」2026年8月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_8"}, {"label": "東京都八丈支庁「八丈島水産だより」2022年10月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/4753_b-suisan2022_10"}, {"label": "東京都 資源評価票 クサヤモロ（伊豆諸島海域）2026年4月", "url": "https://www.sangyo-rodo.metro.tokyo.lg.jp/documents/d/sangyo-rodo/2026-04-08-160023-920"}, {"label": "東京都 資源評価票 クサヤモロ（伊豆諸島海域）2025年4月", "url": "https://www.sangyo-rodo.metro.tokyo.lg.jp/documents/d/sangyo-rodo/7_-"}, {"label": "東京都 資源評価票 クサヤモロ（伊豆諸島海域）2024年4月", "url": "https://www.sangyo-rodo.metro.tokyo.lg.jp/documents/d/sangyo-rodo/e511151ab13661225be5103c36cfc0d7_1"}, {"label": "東京都島しょ農林水産総合センター八丈事業所「八丈島のクサヤモロ漁に黒潮が与える影響」", "url": "https://www.ifarc.metro.tokyo.lg.jp/survey/uploads/15b2219000150f5acd21e1b3e54bfb12.pdf"}, {"label": "東京都島しょ農林水産総合センター八丈事業所「八丈事業所トピックス」第16号", "url": "https://www.ifarc.metro.tokyo.lg.jp/archive/resources/content/14770/20140905-174806.pdf"}], "label": "産業", "audience": "両方", "thread_id": "t20260821-81", "id": "9c583d", "photo": {"type": "img", "src": "/img/kiji/9c583d.jpg?v=d7357e", "og": "/img/kiji/9c583d-og.jpg?v=d7357e", "s": "/img/kiji/9c583d-s.jpg?v=d7357e", "m": "/img/kiji/9c583d-m.jpg?v=d7357e", "caption": "ムロアジのくさや", "credit": "", "file": "ac/26719199.jpg"}, "edited": "2026-11-28T12:05:51+09:00"}, {"headline": "離島甲子園、八丈島は2戦2敗", "body": ["島根県隠岐の島町で開かれた第17回全国離島交流中学生野球大会（離島甲子園）で、八丈島選抜チームは19日の交流戦でも三重県鳥羽市のTOBA BLUE OCEANSに敗れた。チームは2戦2敗で大会を終えた。18日の初戦で八丈島選抜に勝った壱岐市選抜は、20日の決勝も制して優勝した。", "隠岐の島町の地域情報サイト「隠岐ビト」によると、初戦は都万町民運動場であり、壱岐市選抜が28対0で勝った。八丈島選抜は女子選手を含む男女混合のチームで臨んだ。大会実行委員会の日程では、19日は勝ち抜き戦の準々決勝と準決勝に加えて交流戦が組まれていた。八丈島選抜はこの交流戦に回り、隠岐高校グラウンドでTOBA BLUE OCEANSと対戦した。隠岐ビトが試合中に出した記事では、4回を終えて0対6とリードされていた。八丈町は同じ日の午後、公式Xで「惜しくも敗戦」と伝えたが、最終得点は町の発信にも大会の公式サイトにも載っていない。", "決勝は20日に隠岐の島町運動公園グラウンドであり、壱岐市選抜が本塁打などで小刻みに得点を重ね、長崎県対馬市の対馬ヤマネコボーイズを4対1で破った。共同通信によると、今大会には9都県から22チームが出場した。準優勝の対馬ヤマネコボーイズは、昨年の宮古島大会の第2戦で八丈島選抜が破った相手だった。町によると、八丈島選抜の選手たちも会場で決勝を観戦した。", "決勝の後には閉会式があり、元広島投手の川口和久さんらプロ野球OBでつくる「まさかりドリームス」が出場選手向けに野球教室を開いた。町によると、選手たちはプロの選手とのキャッチボールなどで指導を受けた。大会は対外試合の機会が少ない離島の選手どうしの交流を目的とし、元ロッテ投手の故村田兆治さんが提唱して始まった。", "広報はちじょうによると、八丈島のチームは第1回から大会に出ている。隠岐の島町が会場になった2009年の第2回大会でも2戦2敗で、17年後の今回も同じ成績になった。昨年の宮古島大会は1勝1敗だった。大会の日程では、21日は各チームが地元へ帰る移動日になっている。"], "added": [{"fact": "18日の八丈島選抜の初戦は都万町民運動場で行われ、壱岐市選抜が28-0で勝った。八丈島選抜は女子選手を含む男女混合チーム", "url": "https://www.okibito.jp/post-12812/"}, {"fact": "19日のTOBA BLUE OCEANS戦は隠岐高校グラウンドでの交流戦で、4回終了時点でTOBAが6-0とリードしていた（試合中の記事で、最終スコアの記載はない）", "url": "https://www.okibito.jp/post-12898/"}, {"fact": "TOBA BLUE OCEANSは18日の1回戦でKAMIJIMA（上島町）に8-2で勝った", "url": "https://www.town.kamijima.lg.jp/soshiki/shogai-gakushu/27952.html"}, {"fact": "決勝は20日にあり、壱岐市選抜が対馬ヤマネコボーイズを4-1で破って優勝した。9都県から22チームが参加し、決勝後に川口和久さんらのOBチーム「まさかりドリームス」が野球教室を開いた（共同通信、20日17時28分配信）", "url": "https://kumanichi.com/articles/2027191"}, {"fact": "決勝は隠岐の島町運動公園グラウンドで行われ、壱岐市選抜が4-1で勝った", "url": "https://www.okibito.jp/post-13001/"}], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2090265153485119805"}, {"label": "隠岐ビト", "url": "https://www.okibito.jp/post-12812/"}, {"label": "写真:Kuruman、CC BY 2.0(Wikimedia Commons。切り抜いて使用)", "url": "https://commons.wikimedia.org/wiki/File:Okinoshima_(15066448338).jpg"}], "label": "教育", "audience": "島民", "thread_id": "t20260808-33", "followup": true, "id": "92d0d5", "photo": {"type": "img", "src": "/img/kiji/92d0d5.jpg?v=a6d853", "og": "/img/kiji/92d0d5-og.jpg?v=a6d853", "s": "/img/kiji/92d0d5-s.jpg?v=a6d853", "m": "/img/kiji/92d0d5-m.jpg?v=a6d853", "caption": "隠岐の島町の町並み", "credit": "", "file": "commons/Okinoshima_15066448338_.jpg"}, "edited": "2026-11-28T12:11:04+09:00"}, {"headline": "末吉応援コンサート、きょう無料", "body": ["八丈島文化協会は21日15時から、末吉公会堂で「末吉応援ミニコンサート」を開く。入場は無料。協会が20日朝、Xで明らかにした。23日の吹奏楽演奏会「八丈ウインズフェス2026」に先立つ催しで、ゲスト3人が3曲を演奏する。うち1曲はこのコンサートのために編曲した。", "協会がサイトで出したミニコンサートの案内には、入場料が載っていなかった。20日までの案内でも、ゲスト3人の名前、曲名、末吉を「応援」する理由は明かしていない。協会は、末吉の住民だけでなく、どの地区の人にも来てほしいと呼びかけている。", "23日の本番は、大賀郷の八丈町多目的ホール「おじゃれ」で13時30分に開場し、14時に開演する。入場料は500円で、高校生以下は無料。島の小中高校生と社会人に、都心から来る演奏家や音大生ら40人以上と御蔵島の有志が加わる。この約80人の合同バンドで5曲を演奏する。指揮は、2024年2月の前回に続いて甘粕宏和さんが務める。甘粕さんはワルシャワ国際吹奏楽指揮者コンクール2021で優勝した。前回初めて演奏された、福島弘和さん作曲の「吹奏楽のための『おじゃれ』〜八丈島民謡による幻想曲〜」も今回の曲目に入っている。主催は協会と八丈ウインズフェス実行委員会で、八丈町と町教育委員会が後援する。"], "added": [{"fact": "21日の末吉応援ミニコンサートは入場無料（23日の本番は500円、高校生以下無料）。8月15日の既報時点では、ミニコンサートの入場料は協会の案内に載っていなかった", "url": "https://x.com/8jobunka/status/2090208531899400397"}, {"fact": "協会は20日朝、島内メンバーが練習中で、本番は本土と御蔵島からのメンバーが加わって80人で演奏すると案内した", "url": "https://x.com/8jobunka/status/2090206777526894759"}], "sources": [{"label": "八丈島文化協会", "url": "https://x.com/8jobunka/status/2090206777526894759"}, {"label": "八丈島文化協会 ウインズフェスプレイベント末吉応援ミニコンサート", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-ウインズフェスプレイベント末吉応援ミニコンサートのお知らせ/"}, {"label": "八丈島文化協会 八丈ウインズフェス2026開催", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-八丈ウインズフェス2026       ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
