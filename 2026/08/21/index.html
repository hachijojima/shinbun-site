<script type="application/json" id="edition">{"date": "2026-08-21", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-28T09:03:38+09:00", "prev": "/2026/08/20/", "next": "/2026/08/22/", "alerts": [], "weather": {"issued": "2026-08-21T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 23, "max": 31}]}, "koyomi": {"sunrise": "5:07", "sunset": "18:21", "moon": 7.8, "tide": {"place": "八丈島(神湊)", "high": [["21:23", 129]], "low": [["5:04", 66]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "底土港護岸、24日に21m延伸予定", "body": ["東京都八丈支庁港湾課は24日（月）、神湊（底土）港で「ケーソン」1基を海に沈めて据え付ける作業を予定しており、あわせて見学会を開く。ケーソンは1辺21mのコンクリート製の箱である。都の工事契約によると、高さは15.5mで、港を波から守る「護岸（防波）Ⅱ」を21m延ばす。", "契約では、ケーソンの重量は3万5216キロニュートンとされている。質量に換算すると約3600トン（本紙換算）になる。都港湾局の事業評価資料によると、ケーソンは東京港で造り、八丈島まで船で引いて運ぶ。天候や海の条件が厳しい島での作業を据え付けだけにして、費用を抑えるためである。今回の1基は「令和7年度神湊港護岸（防波）Ⅱ建設及びその他工事」に含まれ、2月12日に開札した。都の入札結果をまとめた入札情報サイトによると、入札したのは五洋・赤間建設共同企業体の1者だけで、同企業体が4億2130万円（税込）で落札した。予定価格に対する落札率は99.7%。工期は10月13日までとなっている。", "この工事は、1986年度に始まった都の「神湊港底土地区離島ターミナル整備事業」の一部である。港湾局が2024年11月の事業評価委員会に出した資料は、目的として、定期貨客船の就航率を高めること、岸壁に波がかぶったり接岸中の船が揺れたりするのを減らして乗り降りと荷役を安全にすることを挙げている。護岸（防波）Ⅱの計画延長は171mで、当時の時点では124mを整備済み、残りは47mだった。2025年度の進み具合は、確認できた資料には示されていない。", "事業の完成時期は延びている。2019年の評価では完成予定を2028年度、事業費を234億円としていた。2024年の評価では完成を2031年度に改め、事業費を239.7億円とした。理由について都は、護岸（防波）Ⅱの現場は水深が深く波の条件も悪いため、水中作業や潜水作業の効率が想定より低かったと説明している。5年間で延びた長さは55.5mで、事業費に対する進み具合は2024年度末時点で80%の見込みだった。投じた費用に対して得られる効果の比率は、前回の1.4から1.2に下がった。", "今回の据え付けは、もともとの計画に基づく工事であり、台風被害の復旧工事ではない。都の2026年度事業説明資料によると、2025年10月の台風22号・23号で、神湊港では防波堤の一部がずれた。2026年度はこれとは別に、防波堤（北）の災害復旧工事を予定している。", "都の評価資料によると、神湊港は島で使う生活物資や産業用の貨物の大半を扱う。貨物量は年平均16万トン（2018〜22年）、船の乗降客は年平均3万3200人（新型コロナの時期を除く2015〜19年）だった。", "見学会の案内チラシによると、申し込みは不要で、集合場所は底土船客待合所の2階。ケーソンを沈める作業を、ビデオやライブ映像を使って解説する。希望者が多いと全員を案内できない場合がある。据え付けの日は天候や海の状況で変わることがあり、変更は都のXで知らせるとしている。"], "added": [{"fact": "今回据え付けるケーソンは1基で、長さ21m・幅21m・高さ15.5m、重量は3万5216キロニュートン。護岸（防波）Ⅱを施工延長21m分延ばす。工事は五洋・赤間建設共同企業体が4億2130万円（税込）で落札し、入札したのは1者、工期は2026年10月13日まで", "url": "https://bid.const-ai.com/tokyo/?id=5525&p=project"}, {"fact": "護岸（防波）Ⅱは計画171mのうち124mが整備済みで、残りは47m（2024年11月時点）。完成予定は2031年度、事業費は239.7億円。深い水深と悪い波浪条件で水中作業の効率が低く、期間が延び、費用が5.7億円増えた。ケーソンは東京港で製作し、島では据え付けだけを行う", "url": "https://www.kensetsu.metro.tokyo.lg.jp/documents/d/kensetsu/r6-4-explanation-kaminato_pdf"}, {"fact": "2019年の評価では完成予定2028年度・事業費234億円で、当時の整備済みは68.5mだった", "url": "https://www.kensetsu.metro.tokyo.lg.jp/documents/d/kensetsu/000051039"}, {"fact": "2026年度、都は神湊港で護岸（防波）Ⅱのケーソン据付と、台風22号・23号で一部がずれた防波堤（北）の災害復旧工事を別々に計上している", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/hachijosetsumeikai2026"}, {"fact": "見学会は申し込み不要で、集合は底土船客待合所の2階。据え付けの日は天候や海の状況で変わることがあり、変更はXで知らせる", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/d-kowan_0723"}], "figure": {"type": "place", "name": "神湊（底土）港"}, "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2089517673663074446"}, {"label": "東京都八丈支庁港湾課「令和8年度神湊（底土）港ケーソン据付工事見学会の開催について」", "url": "https://www.soumu.metro.tokyo.lg.jp/09hatijou/kakuka_top/d-top/R8caisson2"}, {"label": "東京都八丈支庁 見学会チラシ", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/d-kowan_0723"}, {"label": "東京都港湾局 令和6年度第4回事業評価委員会資料 神湊港底土地区離島ターミナル整備事業", "url": "https://www.kensetsu.metro.tokyo.lg.jp/documents/d/kensetsu/r6-4-explanation-kaminato_pdf"}, {"label": "東京都港湾局 令和元年度第3回事業評価委員会資料 神湊港底土地区離島ターミナル整備事業", "url": "https://www.kensetsu.metro.tokyo.lg.jp/documents/d/kensetsu/000051039"}, {"label": "東京都八丈支庁 令和8（2026）年度東京都事業説明資料", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/hachijosetsumeikai2026"}, {"label": "入札情報サイト（東京都の開札結果のまとめ）令和7年度神湊港護岸（防波）Ⅱ建設及びその他工事", "url": "https://bid.const-ai.com/tokyo/?id=5525&p=project"}], "label": "町政", "audience": "両方", "thread_id": "t20260821-79", "id": "b9597e", "photo": {"type": "img", "src": "/img/kiji/b9597e.jpg?v=9a70c7", "og": "/img/kiji/b9597e-og.jpg?v=9a70c7", "s": "/img/kiji/b9597e-s.jpg?v=9a70c7", "m": "/img/kiji/b9597e-m.jpg?v=9a70c7", "caption": "底土港の防波堤整備現場", "credit": "", "file": "ac/27266276.jpg"}}, "side": [], "shorts": [{"headline": "台風18号、沖縄方面へ進む予報", "body": ["台風18号（ソウデル）は、21日3時の時点でマリアナ諸島を北北西に時速20キロで進んでいる。ウェザーニュースによると、25日ごろに沖縄県の大東島地方に近づく予想で、その後の進路は定まっていない。南大東島は八丈島から南西に約1,100キロ離れている（本紙計算）。八丈町は20日12時の防災八丈でこの台風の発生を伝え、今後の気象情報に注意するよう呼びかけた。", "気象庁は19日12時、トラック諸島近海で台風18号が発生したと発表した。21日3時の中心気圧は990ヘクトパスカル、中心付近の最大風速は25メートル、最大瞬間風速は35メートルだった。23日には最大風速45メートルの「非常に強い」勢力になる見込みである。ウェザーニュースが伝えた気象庁の20日15時の確率では、5日先までに暴風域に入る確率は小笠原諸島が43％、大東島地方が24％、奄美地方が12％だった。この確率が挙げた地域に伊豆諸島は入っていない。", "日本気象協会は19日、台風のうねりによって太平洋沿岸で波が高くなる可能性を挙げた。20日の島の交通は平常どおりだった。八丈島観光協会によると、ANAは羽田—八丈島線を終日通常どおり運航し、東海汽船の橘丸は19日夜竹芝発（20日朝八丈島着）の便が9時に底土港に入る予定と案内された。14日から20日までの7日間、東京からの船は7日とも就航した（本紙計算）。"], "added": [{"fact": "21日3時、台風18号はマリアナ諸島にあり、北北西へ時速20キロで移動。中心気圧990hPa、最大風速25m/s、最大瞬間風速35m/s。23日に「非常に強い」勢力となり、25日ごろ大東島地方に接近し、26日には予報円に沖縄本島や奄美大島が入る予想。その後の進路は不確実（ウェザーニュース、21日3時40分配信）", "url": "https://weathernews.jp/news/202608/210031/"}, {"fact": "気象庁の20日15時の5日先までに暴風域に入る確率は、小笠原諸島43％、大東島地方24％、奄美地方12％など。挙げられた地域に伊豆諸島はない（ウェザーニュース、20日15時59分配信）", "url": "https://weathernews.jp/news/202608/200191/"}, {"fact": "19日12時の発生時は中心気圧1002hPa、最大風速18m/s。日本気象協会は、台風のうねりで太平洋沿岸の波が高くなる可能性を挙げた", "url": "https://tenki.jp/forecaster/gureweather/2026/08/19/40213.html"}, {"fact": "20日はANAが終日通常運航し、東海汽船の19日東京発の便は9時に底土港へ入港予定（八丈島観光協会）", "url": "https://x.com/Go_Hachijo_JP/status/2090214555943395395"}], "sources": [{"label": "八丈町", "url": "https://x.com/HachijoTown/status/2090272623875780973"}, {"label": "スーパーあさぬま", "url": "https://x.com/umikaze8jo/status/2090221118284296513"}, {"label": "ウェザーニュース", "url": "https://weathernews.jp/news/202608/210031/"}, {"label": "日本気象協会 tenki.jp", "url": "https://tenki.jp/forecaster/gureweather/2026/08/19/40213.html"}, {"label": "八丈島観光協会", "url": "https://x.com/Go_Hachijo_JP/status/2090214555943395395"}], "label": "くらし", "audience": "両方", "thread_id": "t20260821-80", "id": "b901a5", "photo": {"type": "img", "src": "/img/kiji/b901a5.jpg?v=b82f66", "og": "/img/kiji/b901a5-og.jpg?v=b82f66", "s": "/img/kiji/b901a5-s.jpg?v=b82f66", "m": "/img/kiji/b901a5-m.jpg?v=b82f66", "caption": "東京の離島 伊豆諸島に属する八丈島のふれあい牧場", "credit": "", "file": "ac/23405402.jpg"}}, {"headline": "島産小ムロのくさや、販売始まる", "body": ["八丈島で揚がった小型のムロアジ「小ムロ」を使ったくさやを、カネワ水産が20日に干し上げた。同社は同日15時過ぎから売り出すと告知した。原料のムロアジは島の棒受け網漁で獲る。東京都の調査では、島の漁獲量は2007年の339トンから2021年には17.8トンに減り、操業する船は1隻になった。", "カネワ水産のXへの投稿によると、このくさやは18日から仕込み、20日に干し上がった。同社は、頭から食べられるのはこの時期だけだとしている。18日にも「新鮮とれたてムロアジ」でくさやを作っていると投稿していた。全国発送と電話注文も受け付けている。", "島のムロアジ漁は8月に始まった。東京都八丈支庁の「八丈島水産だより」8月号によると、例年8月の初めは体長20センチほどの小型の魚が中心になる。昨年度は漁期の前半から30センチを超える魚が揚がっていた。都島しょ農林水産総合センター八丈事業所が2014年に出した資料は、毎年7〜8月に小ムロが島の周りに来て、翌年まで留まって育ち、大ムロになると推測している。同年7月の調査では、小ムロの尾叉長（口先から尾びれの付け根までの長さ）は平均21.5センチ、大ムロは28.9センチだった。都の資源評価によると、ムロアジの仲間のクサヤモロは1歳で尾叉長18.5センチ、2歳で24.9センチに育つ。同センターの解析では、島で獲れる魚の重さは8月がいちばん軽く、11月まで重くなり続けた。", "くさやの原料になるこの魚は、島での水揚げが大きく減っている。同センター八丈事業所の今泉洋介さんがまとめた研究成果は、2003年から2021年までの島の棒受け網漁のデータを調べた。漁獲量は2007年の339トンから2021年に17.8トンへ減り、操業する船は20年前の約9隻から1隻になった。2014年の同事業所の資料も、くさやの需要が落ち込んでいることを減少の理由の一つに挙げていた。", "東京都が2026年4月にまとめた資源評価では、伊豆諸島海域のクサヤモロの水揚量は2007年の364トンが最も多く、2022年は10トンだった。資源の量の目安には、船1隻が1日に揚げる量（CPUE）を使う。2025年のCPUEは338.4キロで、最も多かった2018年の1,104.8キロの3分の1に届かず、資源の水準は「低位」とされた。直近5年の動きは「横ばい」と評価した。評価票によると、島の棒受け網漁では魚の値崩れを防ぐため、出荷できる量をもとに船1隻が1日に獲る量を制限している。", "今季これまでの島の水揚げ量は公表されておらず、確認できない。島で作るくさやのうち、島で揚がったムロアジを使う割合を示す公表資料も見当たらない。"], "added": [{"fact": "島のクサヤモロ棒受け網漁の漁獲量は2007年の339トンから2021年に17.8トンへ減り、操業隻数は20年前の約9隻から1隻になった（都島しょ農林水産総合センター八丈事業所の研究成果）。島で獲れる魚の重さは8月が最も軽く、11月まで増え続けた", "url": "https://www.ifarc.metro.tokyo.lg.jp/survey/uploads/15b2219000150f5acd21e1b3e54bfb12.pdf"}, {"fact": "都の資源評価（2026年4月）によると、伊豆諸島海域のクサヤモロ水揚量は2007年の最大364トンから2022年に10トンへ減った。2025年のCPUEは338.4キロで「低位・横ばい」。島の棒受け網漁では、値崩れを防ぐため1隻1日あたりの漁獲を制限している。年齢ごとの体長は1歳18.5センチ、2歳24.9センチ", "url": "https://www.sangyo-rodo.metro.tokyo.lg.jp/documents/d/sangyo-rodo/2026-04-08-160023-920"}, {"fact": "小ムロは毎年7〜8月に島の周りに来て、翌年まで留まって大ムロに育つと推測されている。2014年7月の調査では、平均尾叉長は小ムロ21.5センチ、大ムロ28.9センチ。くさやの需要が落ち込み、漁獲量は200トンを下回っていた", "url": "https://www.ifarc.metro.tokyo.lg.jp/archive/resources/content/14770/20140905-174806.pdf"}], "sources": [{"label": "カネワ水産", "url": "https://x.com/ohakoya18/status/2090279703227871569"}, {"label": "東京都八丈支庁 八丈島水産だより 2026年8月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_8"}, {"label": "東京都八丈支庁 八丈島水産だより 2025年9月号", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2025_9"}, {"label": "東京都島しょ農林水産総合センター 八丈事業所トピックスNo.16", "url": "https://www.ifarc.metro.tokyo.lg.jp/archive/resources/content/14770/20140905-174806.pdf"}, {"label": "東京都島しょ農林水産総合センター 研究成果「八丈島のクサヤモロ漁に黒潮が与える影響」", "url": "https://www.ifarc.metro.tokyo.lg.jp/survey/uploads/15b2219000150f5acd21e1b3e54bfb12.pdf"}, {"label": "東京都 資源評価票 クサヤモロ（伊豆諸島海域）令和8年4月", "url": "https://www.sangyo-rodo.metro.tokyo.lg.jp/documents/d/sangyo-rodo/2026-04-08-160023-920"}], "label": "産業", "audience": "両方", "thread_id": "t20260821-81", "id": "9c583d", "photo": {"type": "img", "src": "/img/kiji/9c583d.jpg?v=d1ab48", "og": "/img/kiji/9c583d-og.jpg?v=d1ab48", "s": "/img/kiji/9c583d-s.jpg?v=d1ab48", "m": "/img/kiji/9c583d-m.jpg?v=d1ab48", "caption": "東京都島しょ農林水産総合センター八丈事業所の案内板", "credit": "", "file": "own/norin-center-1.jpg"}}, {"headline": "離島甲子園、八丈島は2戦2敗", "body": ["島根県隠岐の島町で開かれた第17回全国離島交流中学生野球大会（離島甲子園）が20日に閉幕し、八丈島選抜は2戦2敗で日程を終えた。18日の初戦では、のちに優勝する壱岐市選抜（長崎県）に0-28で敗れた。19日には勝ち抜き戦とは別に組まれた交流戦でTOBA BLUE OCEANS（三重県鳥羽市）と対戦し、これにも敗れた。", "地元の情報サイト「隠岐びとチャンネル」によると、初戦は都万町民運動場で行われ、壱岐市選抜が28-0で勝った。同サイトは八丈島選抜を女子選手も加わる男女混合チームと紹介し、選手は最後まで懸命にプレーしたと伝えた。19日の交流戦は隠岐高校グラウンドで行われ、同サイトの試合中の記事では4回終了時点でTOBAが6-0とリードしていた。最終スコアは、確認できた公表資料には示されていない。八丈町は19日午後、「第2戦」の結果として敗戦を伝えた。上島町（愛媛県）によると、TOBAは18日の1回戦で同町のチーム「KAMIJIMA」に8-2で勝っていた。", "共同通信の配信記事によると、決勝は20日にあり、壱岐市選抜が対馬ヤマネコボーイズ（長崎県対馬市）を4-1で破って優勝した。大会には9都県から22チームが参加した。八丈町によると、八丈島選抜の選手は決勝を観戦し、閉会式に臨んだ。決勝の後には、広島などで活躍した川口和久さんら元プロ野球選手でつくるOBチーム「まさかりドリームス」が野球教室を開いた。町は、選手がプロ選手とキャッチボールをするなどしたと伝えている。", "大会は元ロッテ投手の故村田兆治さんが提唱して始まった。対外試合の機会が少ない離島の中学生が交流することを目的としている。八丈島の選抜は第1回から出場している。広報はちじょうによると、同じ隠岐の島町で開かれた2009年の第2回大会でも2戦2敗だった。前回2025年の宮古島大会では初戦で敗れた後、第2戦で対馬ヤマネコボーイズに勝っていた。大会日程では、21日を各地へ帰る移動日にあてている。"], "added": [{"fact": "18日の八丈島選抜の初戦は都万町民運動場で行われ、壱岐市選抜が28-0で勝った。八丈島選抜は女子選手を含む男女混合チーム", "url": "https://www.okibito.jp/post-12812/"}, {"fact": "19日のTOBA BLUE OCEANS戦は隠岐高校グラウンドでの交流戦で、4回終了時点でTOBAが6-0とリードしていた（試合中の記事で、最終スコアの記載はない）", "url": "https://www.okibito.jp/post-12898/"}, {"fact": "TOBA BLUE OCEANSは18日の1回戦でKAMIJIMA（上島町）に8-2で勝った", "url": "https://www.town.kamijima.lg.jp/soshiki/shogai-gakushu/27952.html"}, {"fact": "決勝は20日にあり、壱岐市選抜が対馬ヤマネコボーイズを4-1で破って優勝した。9都県から22チームが参加し、決勝後に川口和久さんらのOBチーム「まさかりドリームス」が野球教室を開いた（共同通信、20日17時28分配信）", "url": "https://kumanichi.com/articles/2027191"}, {"fact": "決勝は隠岐の島町運動公園グラウンドで行われ、壱岐市選抜が4-1で勝った", "url": "https://www.okibito.jp/post-13001/"}], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2090265153485119805"}, {"label": "隠岐びとチャンネル", "url": "https://www.okibito.jp/post-12812/"}, {"label": "上島町", "url": "https://www.town.kamijima.lg.jp/soshiki/shogai-gakushu/27952.html"}], "label": "教育", "audience": "島民", "thread_id": "t20260808-33", "followup": true, "id": "92d0d5", "photo": {"type": "img", "src": "/img/kiji/92d0d5.jpg?v=2a3569", "og": "/img/kiji/92d0d5-og.jpg?v=2a3569", "s": "/img/kiji/92d0d5-s.jpg?v=2a3569", "m": "/img/kiji/92d0d5-m.jpg?v=2a3569", "caption": "東京の離島 伊豆諸島に属する八丈島のふれあい牧場", "credit": "", "file": "ac/23405393.jpg"}}, {"headline": "末吉応援コンサート、きょう無料", "body": ["八丈島文化協会は21日15時から、末吉公会堂で「末吉応援ミニコンサート」を開く。入場は無料。協会が20日朝、X（旧ツイッター）で案内した。23日に大賀郷の八丈町多目的ホール「おじゃれ」で開く吹奏楽の演奏会「八丈ウインズフェス2026」に先立つ催しで、ゲスト3人が3曲を演奏する。うち1曲はこのコンサートのために編曲した。", "20日までに協会がサイトとXで出した案内には、ゲスト3人の名前も曲名も載っていない。末吉を「応援」する理由も示していない。協会は、末吉の人だけでなく、どの地区の人にも来てほしいとしている。", "23日の本番は13時30分に開場し、14時に開演する。入場料は500円で、高校生以下は無料。協会によると、島内のメンバーに本土と御蔵島からの参加者が加わり、約80人で演奏する。指揮は、2024年2月の前回に続いて甘粕宏和さんが務める。"], "added": [{"fact": "21日の末吉応援ミニコンサートは入場無料（23日の本番は500円、高校生以下無料）。8月15日の既報時点では、ミニコンサートの入場料は協会の案内に載っていなかった", "url": "https://x.com/8jobunka/status/2090208531899400397"}, {"fact": "協会は20日朝、島内メンバーが練習中で、本番は本土と御蔵島からのメンバーが加わって80人で演奏すると案内した", "url": "https://x.com/8jobunka/status/2090206777526894759"}], "sources": [{"label": "八丈島文化協会", "url": "https://x.com/8jobunka/status/2090206777526894759"}, {"label": "八丈島文化協会 ウインズフェスプレイベント末吉応援ミニコンサート", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-ウインズフェスプレイベント末吉応援ミニコンサートのお知らせ/"}, {"label": "八丈島文化協会 八丈ウインズフェス2026開催", "url": "https://8jobunka.jimdofree.com/イベント/終了しました-協会主催-八丈ウインズフェス2026開催のお知らせ/"}], "label": "文化", "audience": "島民", "thread_id": "t20260807-29", "followup": true, "id": "c308c5", "photo": {"type": "img", "src": "/img/kiji/c308c5.jpg?v=a14acd", "og": "/img/kiji/c308c5-og.jpg?v=a14acd", "s": "/img/kiji/c308c5-s.jpg?v=a14acd", "m": "/img/kiji/c308c5-m.jpg?v=a14acd", "caption": "八丈島灯台", "credit": "", "file": "ac/3186774.jpg"}}], "agenda": [{"date": "2026-08-21", "end": null, "text": "末吉応援ミニコンサート（末吉公会堂）", "url": "https://x.com/8jobunka/status/2088060046538416621"}, {"date": "2026-08-22", "end": null, "text": "八丈島みんなで海あそび2026", "url": "https://x.com/madoca_Okuyama/status/2077725986909765957"}, {"date": "2026-08-22", "end": null, "text": "八丈学講座（ビジターセンター水槽）", "url": "https://x.com/hachijomachi/status/2089326709770444879"}, {"date": "2026-08-22", "end": "2026-08-23", "text": "Cafe LeaLeaの夏祭り", "url": "https://x.com/CafeLealea/status/2089869602906083677"}, {"date": "2026-08-23", "end": null, "text": "八丈ウインズフェス2026（甘粕宏和氏ゲスト指揮）", "url": "https://8jobunka.jimdofree.com/%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88/%E5%8D%94%E4%BC%9A%E4%B8%BB%E5%82%AC-%E5%85%AB%E4%B8%88%E3%82%A6%E3%82%A4%E3%83%B3%E3%82%BA%E3%83%95%E3%82%A7%E3%82%B92026%E5%8F%82%E5%8A%A0%E8%80%85%E5%8B%9F%E9%9B%86/"}, {"date": "2026-08-23", "end": "2026-08-30", "text": "ビジターセンターの子供クラフト（日曜）", "url": "https://x.com/8jo_vc/status/2090616606460366940"}, {"d   return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const MEDAL={"🥇":1,"🥈":2,"🥉":3};
const rankMark = m => MEDAL[m]?`<i class="r${MEDAL[m]}" aria-label="${MEDAL[m]}位">${MEDAL[m]}</i>`:`<i class="r0" aria-hidden="true"></i>`;
 
function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section class="ran" id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h"><a href="/government/members/">町議会議員</a></h2>
    <ol class="giin ichi">${g.map(r=>{const nm=`${rankMark(r.medal)}<b>${esc(r.name)}</b>`;
      return `<li>${r.slug?`<a class="n" href="/government/members/${esc(r.slug)}/">${nm}</a>`:`<span class="n">${nm}</span>`}${r.at?`<a class="ps" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.name+" "+(r.kind?r.kind+" ":"")+(r.what||""))}"><time>${esc(r.when)}</time><q>${r.hs||""}</q></a>`:""}</li>`;}).join("")}</ol><p class="more"><a href="/government/assembly/">議員・議会</a><a href="/government/members/">全員の一覧</a></p></section>`;
}
 
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
 
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u), sora=soraRow(e.sora), ev=evLines(e).slice(0,8);
  const diff=n=>n==null?"":`<small>(${n>0?"+":n<0?"−":"±"}${Math.abs(n).toLocaleString()})</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const st=e.sora&&e.sora.at?ymd(e.sora.at.slice(0,10)):null, sh=e.sora&&e.sora.at?hm(e.sora.at):"";
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
 
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section class="ran" id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h"><a href="/song/">きょうの一曲</a></h2>
    <div class="kk">${a?`<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.img)}" alt="${esc(a.album||k.title)}のジャケット" width="96" height="96" loading="lazy"></a>`:""}
      <div><h3>${k.day?`<a class="hl" href="${esc(k.day)}song/">${esc(k.title)}</a>`:esc(k.title)}</h3><p class="who">${esc(k.artist)}</p></div></div>
    <p class="txt">${esc(k.text)}</p>
    <p class="kiku"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTubeで聴く</a>${a&&a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Apple Musicで聴く</a>`:""}</p></section>`;
}
 
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){
  if(!c) return "";
  return `<section class="ran" id="tayori" aria-labelledby="tayori-h"><h2 class="band" id="tayori-h"><a href="/column/">${esc(c.name||"島のたより")}</a></h2>
    ${c.title?`<h3>${c.day?`<a class="hl" href="${esc(c.day)}column/">${esc(c.title)}</a>`:esc(c.title)}</h3>`:""}<div class="honbun">${(c.body||[]).map(t=>`<p>${mdLink(t)}</p>`).join("")}</div></section>`;
}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}

  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top" id="a1">

    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];
      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>
      ${s.id?`<p class="ld">${esc(b[0])}</p>`:`<div class="honbun">${paras(b)}</div>${src(s.sources)}`}
    </article>`;}).join("")}</div>`:""}`:""}
    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}
    ${e.ronten?`<section class="ran men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="ran tv" aria-label="FM八丈島テレビ"><div class="head"><h2 class="band onair"><a href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><i aria-hidden="true"></i>ON AIR</a></h2><a class="chl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div><div class="tvw"><iframe src="https://tv.hachijojima.jp/embed.html" title="FM八丈島テレビ" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></div></section>
      ${(e.ichimen_week||[]).length?`<section class="ran" id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h"><a href="/archive/">今週の一面</a></h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><a href="${esc(w.url)}"><time datetime="${esc(w.date)}">${tsuki(w.date)}</time>${esc(w.headlines[0])}</a></li>`).join("")}</ol>
      </section>`:""}
      ${giinSection(e)}

      ${shimaSection(e)}

  </div>

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
  wabunKakko(document.body);
}
