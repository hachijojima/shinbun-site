<script type="application/json" id="edition">{"date": "2026-08-23", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-28T17:36:14+09:00", "prev": "/2026/08/22/", "next": "/2026/09/01/", "alerts": [], "weather": {"issued": "2026-08-23T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 30}]}, "koyomi": {"sunrise": "5:09", "sunset": "18:19", "moon": 9.8, "tide": {"place": "八丈島(神湊)", "high": [["16:10", 128]], "low": [["8:04", 60], ["21:12", 113]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "台風18号、沖縄方面へ進む予報", "body": ["台風18号は小笠原諸島の南の海上を抜け、沖縄方面へ進む予報になっている。23日5時の時点で、東海汽船と伊豆諸島開発は八丈島を発着する船の欠航を発表していない。22日には台風19号と20号も発生した。19号はベトナム北部沖のトンキン湾、20号は宮古島の近くで生まれ、どちらも数日のうちに熱帯低気圧に変わる見込みだ。", "ウェザーニュースによると、台風18号は22日15時、マリアナ諸島付近を時速20キロで北西へ進んでいた。中心気圧は965ヘクトパスカル、中心付近の最大風速は35メートルだった。予報では、23日3時ごろに非常に強い勢力で小笠原諸島の南の海上を通る。25日に大東島地方へ近づき、その後は勢力をやや弱めながら沖縄や奄美に近づく。同社は、先の日付ほど予報円が大きくなり、進路ははっきりしないとしている。", "島内では「W台風」と言う声も出ている。共同通信によると、19号は22日9時の観測でトンキン湾の熱帯低気圧から変わった。ほとんど動かず、26日までに熱帯低気圧になるとみられる。20号は同日正午、宮古島の北北西約90キロで発生した。西寄りにゆっくり進み、24日までに熱帯低気圧になる見込みだ。", "伊豆諸島開発は21日、台風18号の影響で海が荒れる見込みだとして、父島と母島を結ぶははじま丸を24日と25日に欠航にすると発表している。八丈島と青ヶ島を結ぶくろしお丸は22日、八丈島9時30分発、青ヶ島13時30分発の1往復を運航した。24日以降のくろしお丸について、23日5時までに運航を変えるという告知は出ていない。", "東京からの船は、22日夜に条件付きの運航となった。八丈島観光協会は22日16時49分、同日22時30分竹芝発の橘丸について、海や港内の状況によっては八丈島に接岸できない場合がある「条件付きの運航」だとXで知らせた。前日の21日夜竹芝発の便について、観光協会はこうした告知を出していなかった。", "条件付きの運航は、今月は珍しくない。観光協会の告知を本紙が数えたところ、1日から22日までの22晩の竹芝発のうち、条件付きは13晩、欠航は5晩だった。欠航は、台風13号の影響による3日と5日、海上不良による4日、台風15号の影響による10日と11日の夜竹芝発の便で、12日夜の便からは欠航していない。", "島の西側には22日、うねりが入り始めた。観光協会の海況情報によると、旧八重根の海水浴場は8時15分の時点では遊泳注意の黄旗だったが、14時20分には遊泳禁止の赤旗に変わった。同じ日に催し「八丈島 みんなで海あそび」を開いた主催側は、台風18号のうねりが思ったより早く入り始めたとXに書いた。", "物資を運ぶ貨物船について、東海汽船貨物部が19日付で出した運航日カレンダーでは、八丈島行きの次の東京出航日は25日、その後は27日と29日になっている。島に着くのは、それぞれ東京を出た翌日だ。"], "added": [{"fact": "八丈島観光協会は22日16時49分、同日22時30分竹芝発の橘丸が、海上や港内の状況によっては接岸できない場合がある条件付きの運航になるとXで知らせた。21日夜竹芝発の便には、この告知を出していなかった", "url": "https://x.com/Go_Hachijo_JP/status/2091070205153943642"}, {"fact": "観光協会の告知によると、8月1日から22日までの竹芝発で、条件付き運航は13晩（2・6・7・8・9・12・13・14・15・16・17・19・22日）、欠航は5晩（3・4・5・10・11日）。3日と5日は台風13号、10日と11日は台風15号の影響、4日は海上不良が理由", "url": "https://x.com/Go_Hachijo_JP/status/2087081147335672252"}, {"fact": "共同通信の22日配信によると、台風19号は22日9時にトンキン湾で、20号は同日正午に宮古島の北北西約90キロで発生した。19号は26日まで、20号は24日までに熱帯低気圧になる見込み", "url": "https://kumanichi.com/articles/2027850"}, {"fact": "ウェザーニュースの22日16時52分の記事によると、台風18号は22日15時にマリアナ諸島付近を北西へ時速20キロで進み、中心気圧は965ヘクトパスカル。予報では23日3時ごろに小笠原諸島の南の海上を通り、25日に大東島地方に近づく", "url": "https://weathernews.jp/news/202608/220201/"}, {"fact": "観光協会の海況情報によると、22日の旧八重根は8時15分の黄旗（遊泳注意）から14時20分に赤旗（遊泳禁止）へ変わった", "url": "https://x.com/Go_Hachijo_JP/status/2091032725046354413"}, {"fact": "22日に「八丈島 みんなで海あそび」を開いた主催側が、思ったより早く台風18号のうねりが入り始めたと投稿した", "url": "https://x.com/madoca_Okuyama/status/2091115291413823976"}, {"fact": "東海汽船貨物部の運航日カレンダー（8月19日作成）によると、八丈島行き貨物船の東京出航日は22日の次が25日、27日、29日で、島に着くのは東京を出た翌日", "url": "https://www.tokaikisen.co.jp/wordpress/wp-content/uploads/2026/08/9c38427bcf0cfa895cae784fe4eea7ba.pdf"}], "figure": null, "sources": [{"label": "伊豆諸島開発", "url": "https://x.com/izu_shibaura/status/2090910687891751116"}, {"label": "喫茶 三年目の赤いスイートピー", "url": "https://x.com/kissa3nenme/status/2090918416194666720"}, {"label": "八丈島観光協会", "url": "https://x.com/Go_Hachijo_JP/status/2091070205153943642"}], "label": "くらし", "audience": "両方", "thread_id": "t20260821-80", "followup": true, "id": "c56997", "photo": {"type": "img", "src": "/img/kiji/c56997.jpg?v=d49117", "og": "/img/kiji/c56997-og.jpg?v=d49117", "s": "/img/kiji/c56997-s.jpg?v=d49117", "m": "/img/kiji/c56997-m.jpg?v=d49117", "caption": "橘丸 八丈島 八重根港", "credit": "", "file": "ac/34194385.jpg"}}, "side": [], "shorts": [{"headline": "10年前の台風、1時間86ミリ", "body": ["10年前の22日未明、2016年の台風第9号の中心が八丈島から約35キロのところまで近づいた。気象庁八丈島の観測で、1時間に86ミリの雨と最大瞬間風速40.6メートルを記録した。1時間雨量は1937年以降で6番目の多さだ。60年前の同じ22日にも、台風第14号が約44キロまで近づいていた。", "気象庁のベストトラック（台風の位置と強さを確定した記録）から本紙が計算すると、台風第9号が島に最も近づいたのは22日3時ごろで、中心気圧は975ヘクトパスカルだった。八丈島の10分ごとの観測では、東北東の風が強まり、0時20分から30分までの間に40.6メートルの最大瞬間風速を記録した。0時40分から1時50分にかけては10分ごとに9〜17ミリの雨が降り続き、22日の降水量は124ミリになった。海面気圧は2時20分に986.6ヘクトパスカルまで下がった。そのころを境に、それまで東寄りだった風は南寄りに変わった。台風はその後北上し、同じ日の12時30分ごろ千葉県館山市付近に上陸した。", "86ミリという1時間雨量は、1937年から続く八丈島の観測で6番目に多い。1位は1999年9月4日の129.5ミリで、昨年10月9日に台風第22号が記録した92ミリが2位にあたる。", "島内の被害は町議会でも取り上げられた。議会だより第180号によると、2016年9月6日の一般質問で岩﨑由美議員が「先日の台風9号は予想もしなかった被害が島内のあちこちで起きた」と述べた。八丈富士の鉢巻道路では、登山口の付近に多量の土砂が流れ着いたといわれるとして、議員は土砂が流れた原因と量、対処の方法をただした。産業観光課長は、土砂が流れたのは管理道ではなく登山道だろうと答え、流れた土砂は土のうに詰めて再利用していると説明した。また、八丈富士は全体に土砂流出の危険をはらんでいるとみて、現場を確かめて根本的な対処をしていかなければならないと述べた。", "60年前の1966年に来た台風第14号は、ベストトラックからの本紙計算で22日7時ごろ島から約44キロまで近づき、そのときの中心気圧は990ヘクトパスカルだった。気象庁八丈島のこの日の観測は、最大瞬間風速が南西の風23.6メートル、降水量が30.9ミリ、1時間の最大雨量が12.4ミリだった。風も雨も2016年の台風第9号を大きく下回った。", "本紙が気象庁のベストトラックを集計すると、1951年以降、台風の中心が八丈島から100キロ以内に入ったのは56回ある。最も新しいのは昨年10月13日の台風第23号で、中心が約46キロまで近づき、中心気圧は970ヘクトパスカルだった。"], "added": [{"fact": "2016年8月22日の気象庁八丈島の観測は、最大瞬間風速が東北東の風40.6メートル、1時間の最大雨量が86.0ミリ、日降水量が124.0ミリ。前日の21日にも最大瞬間風速30.1メートルを観測していた", "url": "https://www.data.jma.go.jp/stats/etrn/view/daily_s1.php?prec_no=44&block_no=47678&year=2016&month=8&day=&view="}, {"fact": "10分ごとの観測で、最大瞬間風速40.6メートルは0時20分から30分の間に記録された。0時40分から1時50分には10分ごとに9〜17ミリの雨が降った。海面気圧は2時20分に986.6ヘクトパスカルまで下がり、その前後で風向きが東北東から南南西に変わった", "url": "https://www.data.jma.go.jp/stats/etrn/view/10min_s1.php?prec_no=44&block_no=47678&year=2016&month=8&day=22&view="}, {"fact": "八丈島の1時間降水量の記録（1937年以降）で、2016年8月22日の86.0ミリは6位。1位は1999年9月4日の129.5ミリ、2位は2025年10月9日の92.0ミリ", "url": "https://www.data.jma.go.jp/stats/etrn/view/rank_s.php?prec_no=44&block_no=47678&year=&month=&day=&view="}, {"fact": "2016年9月6日の町議会の一般質問で、岩﨑由美議員が台風9号による島内各地の被害と、八丈富士鉢巻道路の登山口付近への土砂流出を取り上げた。産業観光課長は、流れたのは登山道とみられること、土砂は土のうに詰めて再利用していること、根本的な対処が必要なことを答えた（議会だより第180号、2016年10月25日発行）", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27102426/h281025.pdf"}, {"fact": "1966年8月22日の気象庁八丈島の観測は、最大瞬間風速が南西の風23.6メートル、降水量30.9ミリ、1時間の最大雨量12.4ミリ。最高気温は28.2度で、事実メモにあった「最高30.6度、雨0ミリ」の組はこの日の値と一致しない", "url": "https://www.data.jma.go.jp/stats/etrn/view/daily_s1.php?prec_no=44&block_no=47678&year=1966&month=8&day=&view="}, {"fact": "東京管区気象台の気象速報によると、台風第9号は22日12時30分ごろ千葉県館山市付近に上陸した", "url": "https://www.data.jma.go.jp/tokyo/shosai/chiiki/disaster/2016/20160821-0823_ty1609_tokyo.pdf"}], "sources": [{"label": "気象庁", "url": "https://www.jma.go.jp/jma/jma-eng/jma-center/rsmc-hp-pub-eg/besttrack.html"}, {"label": "気象庁 八丈島 2016年8月 日ごとの値", "url": "https://www.data.jma.go.jp/stats/etrn/view/daily_s1.php?prec_no=44&block_no=47678&year=2016&month=8&day=&view="}, {"label": "気象庁 八丈島 2016年8月22日 10分ごとの値", "url": "https://www.data.jma.go.jp/stats/etrn/view/10min_s1.php?prec_no=44&block_no=47678&year=2016&month=8&day=22&view="}, {"label": "気象庁 八丈島 2016年8月22日 1時間ごとの値", "url": "https://www.data.jma.go.jp/stats/etrn/view/hourly_s1.php?prec_no=44&block_no=47678&year=2016&month=8&day=22&view="}, {"label": "気象庁 八丈島 観測史上1〜10位の値", "url": "https://www.data.jma.go.jp/stats/etrn/view/rank_s.php?prec_no=44&block_no=47678&year=&month=&day=&view="}, {"label": "気象庁 八丈島 1966年8月 日ごとの値", "url": "https://www.data.jma.go.jp/stats/etrn/view/daily_s1.php?prec_no=44&block_no=47678&year=1966&month=8&day=&view="}, {"label": "八丈町議会 議会だより第180号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/27102426/h281025.pdf"}, {"label": "東京管区気象台 気象速報 平成28年台風第9号", "url": "https://www.data.jma.go.jp/tokyo/shosai/chiiki/disaster/2016/20160821-0823_ty1609_tokyo.pdf"}], "label": "文化", "audience": "島民", "thread_id": "t20260823-83", "id": "a54fac", "photo": {"type": "img", "src": "/img/kiji/a54fac.jpg?v=b4f204", "og": "/img/kiji/a54fac-og.jpg?v=b4f204", "s": "/img/kiji/a54fac-s.jpg?v=b4f204", "m": "/img/kiji/a54fac-m.jpg?v=b4f204", "caption": "八丈富士の登山道", "credit": "", "file": "ac/33631518.jpg"}}, {"headline": "星空上映会 椅子の持ち込み可", "body": ["伊豆諸島シネマセンターは24日に樫立で野外上映会「真夏の星空上映会2026」を開く。会場のフリースペースにはキャンプチェアを持ち込める。同団体が22日夜にXで知らせた。場所に限りがあるため、譲り合って使うよう求めている。17時開場で、上映は18時30分ごろから。入場は無料。", "会場は、同団体が「むかしのとみじろう駐車場」と案内している場所。旅行口コミサイトの掲載によると、「むかしの富次朗」は樫立にある富次朗商店の旧店舗で、向かいの新店舗の休憩所やブックカフェとして使われている。20日の告知は会場を駐車場とし、22日の告知はフリースペースとだけ書いているが、22日の告知にも「むかしのとみじろう」のハッシュタグが付いている。", "上映作品「マイマイ新子と千年の魔法」は、片渕須直監督が2009年に公開したアニメ映画。髙樹のぶ子の自伝的小説『マイマイ新子』を原作に、昭和30年代の山口県防府市で暮らす子どもたちを描く。同団体は7月31日の告知で、答えにとらわれずに自由な空想で世界を捉え直す子どもたちの「しなやかな強さ」を描いた作品だと紹介した。映画の公式アカウントは、野外上映ととても相性が良い作品だとしている。", "同団体のサイトによると、伊豆諸島シネマセンターは2021年に八丈島の住民らが設立した任意団体。八丈島をはじめ、常設の映画館がなく映画を見る機会が限られる伊豆諸島の島々で、映画文化を広めることを目的にしている。これまでは「アイランドシアター」として、旧末吉小学校を使った末吉多目的交流施設や三根公民館で、記録映画や子ども向けアニメの上映会を少なくとも5回開いてきた。そのうち第4弾と第5弾は大人1000円などの有料だった。サイトでは、野外上映を今後取り組みたい活動の一つに挙げていた。", "雨の場合にどうするかは、22日夜までの告知には書かれていない。同団体はサイトで、問い合わせをメール（izucinema@gmail.com）で受け付けている。"], "added": [{"fact": "会場の「むかしの富次朗」は樫立にある富次朗商店の旧店舗で、休憩所やブックカフェとして使われている", "url": "https://4travel.jp/dm_shisetsu/11434119"}, {"fact": "富次朗商店は樫立にあり、隣に旧店舗を使った休憩所がある", "url": "https://wanderlog.com/place/details/3065131/tomijiro-store"}, {"fact": "伊豆諸島シネマセンターは2021年に八丈島の住民らが設立した。常設の映画館がない伊豆諸島で映画文化を広めることが目的で、野外上映を今後の活動に挙げていた", "url": "https://izucinema.com/about/"}, {"fact": "これまで「アイランドシアター」として末吉多目的交流施設（旧末吉小学校）や三根公民館で少なくとも5回上映会を開いた。第4弾は1000円、第5弾は中学生以上1000円の有料だった", "url": "https://izucinema.com/"}, {"fact": "アイランドシアター第1〜3回では『廻り神楽』『渦 UZU』『風の王と雷の女王』『ニッポンの、みせものやさん』などを上映した", "url": "https://izucinema.com/islandtheater/"}, {"fact": "映画は片渕須直監督の2009年公開作。髙樹のぶ子の自伝的小説が原作で、舞台は昭和30年代の山口県防府市", "url": "https://ja.wikipedia.org/wiki/マイマイ新子と千年の魔法"}, {"fact": "映画の公式アカウントは7月31日、本作は野外上映ととても相性が良いと投稿した", "url": "https://x.com/maimai_shinko/status/2083085588148985877"}], "sources": [{"label": "伊豆諸島シネマセンター", "url": "https://x.com/izucinema/status/2091146477372670253"}, {"label": "伊豆諸島シネマセンター公式サイト", "url": "https://izucinema.com/about/"}, {"label": "伊豆諸島シネマセンター「アイランドシアター」", "url": "https://izucinema.com/islandtheater/"}, {"label": "映画『マイマイ新子と千年の魔法』公式アカウント", "url": "https://x.com/maimai_shinko/status/2083085588148985877"}, {"label": "4travel.jp「むかしの富次朗」", "url": "https://4travel.jp/dm_shisetsu/11434119"}, {"label": "Wikipedia「マイマイ新子と千年の魔法」", "url": "https://ja.wikipedia.org/wiki/マイマイ新子と千年の魔法"}, {"label": "写真:Daibo Taku、CC BY 3.0(Wikimedia Commons。切り抜いて使用)", "url": "https://commons.wikimedia.org/wiki/File:Kashitate,_Hachijo,_Tokyo_100-1621,_Japan_-_panoramio.jpg"}], "label": "文化", "audience": "両方", "thread_id": "t20260803-15", "followup": true, "id": "3444fa", "photo": {"type": "img", "src": "/img/kiji/3444fa.jpg?v=7e8567", "og": "/img/kiji/3444fa-og.jpg?v=7e8567", "s": "/img/kiji/3444fa-s.jpg?v=7e8567", "m": "/img/kiji/3444fa-m.jpg?v=7e8567", "caption": "樫立", "credit": "", "file": "commons/Kashitate_Hachijo_Tokyo_100-1621_Japan_-_panoramio.jpg"}}, {"headline": "八丈の海も高温、平年差3.4℃", "body": ["八丈島の海は7月下旬、平年より3℃以上高い状態だった。東京都島しょ農林水産総合センター八丈事業所の「八丈海洋ニュース」によると、三根の神湊港で毎朝9時に測る水温は、7月23日に29.0℃、24日に28.9℃だった。両日とも平年を3.4℃上回った。東京都小笠原支庁は20日、7月の小笠原の水温が過去最高を上回ったと伝えたが、八丈島の海も同じ時期に高水温になっていた。", "神湊港の水温は7月に入って上がり続けた。1日は24.5℃で、平年より1.3℃高かった。10日には26.7℃、21日には28.3℃になり、平年との差も2℃台へ広がった。月末の31日も28.5℃で、平年より2.4℃高かった。同センターは7月24日から29日まで、島の周りの海面水温を「28〜30℃台」としていた。調査指導船「たくなん」が27日に島の周辺で測った表層水温は30.0℃だった。", "昨年の夏とは大きく違う。同じ八丈海洋ニュースによると、2025年7月23日の神湊港の水温は22.1℃で、平年より3.2℃低かった。今年の同じ日はこれより6.9℃高い。7月31日で比べても、昨年は23.7℃、今年は28.5℃で、差は4.8℃あった。黒潮の流れ方も違った。センターの海況図では、今年7月下旬の黒潮は御前埼沖から御蔵島と八丈島の間を通り、房総半島沖へ流れていた。昨年7月23日の黒潮は野島埼の南の北緯31度30分付近から北へ向かっており、八丈島の周りの水温は22〜27℃台だった。", "8月に入ると、3日は28.4℃、10日は28.2℃で、平年より約2℃高かった。12日からの3日間は26.5℃、25.5℃、26.2℃となり、平年を0.5〜1.1℃下回った。その後は再び上がり、21日は28.2℃で平年より1.4℃高かった。", "小笠原の高水温は、別の資料でも確かめられる。東京都小笠原水産センターの「おがさわら海の情報」7月号によると、父島の二見湾の7月の平均水温は28.8℃で、過去の平均より2.0℃高かった。7月中旬以降は過去最高値を上回った。気象庁が8月20日に公表した7月の日本近海の海面水温の概況でも、父島と南鳥島の近海は広い範囲で平年よりかなり高かった。八丈島についてセンターの日報が示すのは平年との差で、過去の最高値との比較は載せていない。今年7月の値が八丈島での記録を更新したかどうかは分からない。"], "added": [{"fact": "神湊港の定地水温は2026年7月23日9時に29.0℃で、平年差は+3.4℃。同じ日の海況図では、黒潮が御前埼沖から八丈島と御蔵島の間を通っていた", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/uploads/2026_0723.gif"}, {"fact": "2026年7月24日の神湊港は28.9℃で、平年差は+3.4℃。八丈島周辺の海面水温は28〜30℃台", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/uploads/2026_0724.gif"}, {"fact": "2026年7月1日の神湊港は24.5℃で、平年差は+1.3℃", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/uploads/2026_0701.gif"}, {"fact": "2026年7月27日、たくなんが測った調査地点の表層水温は30.0℃。八丈島周辺は28〜30℃台", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/uploads/2026_0727.gif"}, {"fact": "2026年7月31日の神湊港は28.5℃で、平年差は+2.4℃", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/uploads/2026_0731.gif"}, {"fact": "2025年7月23日の神湊港は22.1℃で、平年差は−3.2℃。八丈島周辺は22〜27℃台で、黒潮は野島埼沖の北緯31度30分付近から北上していた", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/uploads/2025_0723.gif"}, {"fact": "2025年7月31日の神湊港は23.7℃で、平年差は−2.4℃", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/uploads/2025_0731.gif"}, {"fact": "2026年8月13日の神湊港は25.5℃で、平年差は−1.1℃。12日は26.5℃（−0.5℃）、14日は26.2℃（−0.7℃）", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/uploads/2026_0813.gif"}, {"fact": "2026年8月21日の神湊港は28.2℃で、平年差は+1.4℃", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/uploads/2026_0821.gif"}, {"fact": "父島の二見湾の2026年7月の平均水温は28.8℃で、過去平均より2.0℃高かった。中旬以降は過去最高値を上回った（2026年8月5日作成）", "url": "https://www.ifarc.metro.tokyo.lg.jp/survey/uploads/7e5ce58855a3383239770ad93e985c23.pdf"}, {"fact": "気象庁の2026年7月の海面水温の概況（8月20日発表）によると、父島と南鳥島の近海は広い範囲で平年よりかなり高かった", "url": "https://ds.data.jma.go.jp/kaiyou/data/db/kaikyo/archive/c_1/jpn_monthly/2026/07/jpn_monthly_sst.html"}], "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2090363249153782118"}, {"label": "東京都島しょ農林水産総合センター八丈事業所「八丈海洋ニュース」2026年7・8月", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/news/2026/07/index.html"}, {"label": "東京都島しょ農林水産総合センター八丈事業所「八丈海洋ニュース」2026年8月", "url": "https://www.ifarc.metro.tokyo.lg.jp/hachijo/news/2026/08/index.html"}, {"label": "東京都小笠原水産センター「おがさわら海の情報」2026年7月号", "url": "https://www.ifarc.metro.tokyo.lg.jp/survey/uploads/7e5ce58855a3383239770ad93e985c23.pdf"}, {"label": "気象庁 日本近海の海面水温 月の診断", "url": "https://ds.data.jma.go.jp/kaiyou/data/db/kaikyo/archive/c_1/jpn_monthly/2026/07/jpn_monthly_sst.html"}], "label": "産業", "audience": "島民", "thread_id": "t20260823-84", "id": "f66f3b", "photo": {"type": "img", "src": "/img/kiji/f66f3b.jpg?v=bd7a87", "og": "/img/kiji/f66f3b-og.jpg?v=bd7a87", "s": "/img/kiji/f66f3b-s.jpg?v=bd7a87", "m": "/img/kiji/f66f3b-m.jpg?v=bd7a87", "caption": "神湊漁港", "credit": "", "file": "own/kaminato-gyoko-4.jpg"}}, {"headline": "子供クラフト、23日と30日に空き", "body": ["八丈ビジターセンターは、小学生向けの「子供クラフト」をきょう23日と30日に同センターで開く。時間はどちらも13時30分から15時まで、参加費は無料、定員は各回10人。同センターは21日にXで、夏休み最後のクラフト行事にまだ空きがあると告知した。参加には申し込みが必要で、受け付けは同センターの電話04996-2-4811。", "作るものは、23日が「自然の色のクレヨン」、30日が「くるくるアニメ」。同センターと八丈植物公園が6月30日に載せた8月の行事案内に、対象、定員、時間が記されている。クレヨンの色を何から取るのかは、案内にもXにも書かれていない。", "同センターの子供クラフトは昨年8月も日曜日に2回開かれ、メダケを使ったヒンメリや、ペットボトルで作る竜巻を題材にした。対象が小学生で各回10人、無料という形式は昨年と同じ。"], "added": [{"fact": "両日とも13時30分から15時まで、会場は八丈ビジターセンター、対象は小学生、参加費無料、定員各10人。定員のある行事は申し込みが必要で、電話04996-2-4811で受け付ける（2026年6月30日掲載の8月行事案内）", "url": "https://www.tokyo-park.or.jp/park/hachijo/news/event/2026/2026_8.html"}, {"fact": "2025年8月の子供クラフトも日曜2回（17日「メダケでヒンメリを作ろう！」、24日「ペットボトルで竜巻を作ろう！」）で、小学生・定員10人・無料・13時30分から15時までの形式だった", "url": "https://www.tokyo-park.or.jp/park/hachijo/news/event/2025/2025_8.html"}], "sources": [{"label": "八丈ビジターセンター", "url": "https://x.com/8jo_vc/status/2090616606460366940"}, {"label": "八丈植物公園・八丈ビジターセンター「2026年8月の行事」", "url": "https://www.tokyo-park.or.jp/park/hachijo/news/event/2026/2026_8.html"}, {"label": "八丈植物公園・八丈ビジターセンター「2025年8月の行事」", "url": "https://www.tokyo-park.or.jp/park/hachijo/news/event/2025/2025_8.html"}], "label": "教育", "audience": "島民", "thread_id": "t20260823-85", "id": "f6a487", "photo": {"type": "img", "src": "/img/kiji/f6a487.jpg?v=9d75ab", "og": "/img/kiji/f6a487-og.jpg?v=9d75ab", "s": "/img/kiji/f6a487-s.jpg?v=9d75ab", "m": "/img/kiji/f6a487-m.jpg?v=9d75ab", "caption": "八丈島ビジターセンター入口", "credit": "", "file": "ac/5026921.jpg"}}], "agenda": [{"date": "2026-   const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}

      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
