<script type="application/json" id="edition">{"date": "2026-08-19", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T23:03:25+09:00", "prev": "/2026/08/18/", "next": "/2026/08/20/", "alerts": [], "weather": {"issued": "2026-08-19T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 30}]}, "koyomi": {"sunrise": "5:06", "sunset": "18:24", "moon": 5.8, "tide": {"place": "八丈島(神湊)", "high": [["9:30", 118], ["20:23", 140]], "low": [["2:53", 60], ["14:22", 93]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "離島甲子園、八丈島は初戦敗退", "body": ["島根県隠岐の島町で開かれている第17回全国離島交流中学生野球大会（離島甲子園）で18日、八丈島選抜チームが初戦に敗れた。八丈町によると、選手は最後まで全力で戦った。チームはきょう19日も12時30分から試合に臨み、試合はライブ配信される。", "大会は全国の離島の中学生が野球で競い、交流する場である。今回は26自治体から22チームが出ている。都内からの出場は大島町と八丈町だけだ。試合は勝ち抜き戦で行う。全国離島交流中学生野球大会実行委員会の日程では、18日に1回戦と2回戦を行った。19日は準々決勝と準決勝のほか、交流戦を組んでいる。", "チームは16日朝に島を出て、その日のうちに隠岐の島町に着いた。町によると、17日は雨の中で練習した。同じ日の開会式では八丈島選抜の主将が壇上で話した。初戦は18日の昼に始まり、試合はライブ配信された。", "島の選抜は第1回から大会に出ている。広報はちじょうによると、2009年の第2回は今回と同じ隠岐の島町が会場で、2戦2敗だったが、他の島との交流を深めた。2012年の第5回は八丈町が会場を務めた。", "最近の大会でも初戦は苦しい戦いが続いている。町によると、2022年の佐渡大会では1回戦で五島バラモンズに6-7で敗れた。翌日の交流戦では宮古島アララガマボーイズに2-14で敗れた。2025年の宮古島大会では初戦で久米島ゴールデンキングスに敗れ、第2戦で対馬ヤマネコボーイズに勝った。", "大会は20日に決勝と表彰式を行い、まさかりドリームスによる野球教室とさよならパーティーを開く予定。21日は各地へ帰る移動日にあてる。"], "added": [{"fact": "大会は勝ち抜き戦で、18日に1回戦と2回戦、19日に準々決勝・準決勝と交流戦、20日に決勝・表彰式・野球教室・さよならパーティー、21日は移動日。26自治体22チームが参加", "url": "https://www.chibanippo.co.jp/prwire/1642020"}, {"fact": "2022年の佐渡大会で八丈島選抜は1回戦で五島バラモンズに6-7で敗れ、翌日の交流戦で宮古島アララガマボーイズに2-14で敗れた", "url": "https://x.com/hachijomachi/status/1561990076699377664"}, {"fact": "2025年の宮古島大会では初戦で久米島ゴールデンキングスに敗れ、第2戦で対馬ヤマネコボーイズに勝った", "url": "https://x.com/hachijomachi/status/1958082685634752893"}, {"fact": "2012年の第5回大会は八丈町が開催地だった", "url": "https://www.rito-koshien.net/archives.html"}, {"fact": "16日朝に出発して同日に到着、17日は雨の中で練習し、開会式で主将が壇上で話した", "url": "https://x.com/hachijomachi/status/2089212993662067180"}], "figure": {"type": "period", "start": "2026-08-17", "end": "2026-08-21", "label": "第17回離島甲子園（隠岐の島町）"}, "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2089591446060020116"}, {"label": "全国離島交流中学生野球大会", "url": "https://www.rito-koshien.net/year2026.html"}, {"label": "千葉日報", "url": "https://www.chibanippo.co.jp/prwire/1642020"}, {"label": "広報はちじょう", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23144917/hachijo0909.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20260808-33", "followup": true, "id": "49156a", "photo": {"type": "img", "src": "/img/kiji/49156a.jpg?v=52c2b9", "og": "/img/kiji/49156a-og.jpg?v=52c2b9", "s": "/img/kiji/49156a-s.jpg?v=52c2b9", "m": "/img/kiji/49156a-m.jpg?v=52c2b9", "caption": "富士グラウンド", "credit": "", "file": "own/fuji-ground-6.jpg"}}, "side": [], "shorts": [{"headline": "フリージア球根、地区に無料配布", "body": ["八丈町は18日、第61回八丈島フリージアまつりに合わせて、フリージアの球根を希望する地区に無料で配ると案内した。1袋に10球が入る。申し込みは地区ごとに自治振興委員を通して行い、委員への連絡の締め切りは9月16日。配布は10月中旬ごろに始める予定。", "町によると、球根を配るのは、島の人や観光客の目に入る場所でフリージアを育て、まつりを島全体で盛り上げるため。2023年6月の町議会では、山下則子議員が、島の人がまつりの会場で花を摘めない理由を尋ねた。町の産業観光課長は、会場での摘み取りは島外の客を呼ぶための特典で、島の人には球根を配っていると答えた。", "申し込みは地区単位で受け付ける。地区は、ほしい袋の数と植える場所を自治振興委員に伝える。個人が町の産業観光課観光係に直接申し込むことはできない。申し込みが多ければ、町が袋の数を調整する。配布も自治振興委員を通して行い、委員以外から個人で受け取ることはできない。", "今年3月の第60回は、3月20日から4月5日まで大賀郷の八形山の特設会場を主な会場に開いた。球根の配布は町議会でもたびたび取り上げられてきた。2021年3月の町議会では、金川孝幸議員がまつりの予算の効果を問うなかで、球根の配布数を尋ねている。", "問い合わせは町産業観光課観光係（04996-2-1125）へ。"], "added": [{"fact": "申し込みは自治振興委員に袋数と植栽場所を連絡し、締め切りは9月16日。個人で産業観光課観光係への申し込みはできず、申し込みが多ければ数量を調整する。配布は自治振興委員から10月中旬ごろに始める予定で、委員以外から個人で受け取ることはできない。目的は住民や観光客から見える場所で育て、まつりを盛り上げること。問い合わせは産業観光課観光係", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/13151801/%E3%83%95%E3%83%AA%E3%83%BC%E3%82%B8%E3%82%A2%E7%90%83%E6%A0%B9%E9%85%8D%E5%B8%83-%E4%BF%AE%E6%AD%A3-724x1024.png"}, {"fact": "2023年6月14日の町議会で山下則子議員が、会場で町民が花を摘み取れない理由を質問した。産業観光課長は、摘み取りは島外客を呼ぶ特典で、町民には球根を配布していると答弁した", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/25165430/20230201.pdf#page=48"}, {"fact": "2021年3月16日の町議会で金川孝幸議員が、フリージアまつりの予算の効果などとあわせて球根の配布数を質問した", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/26124043/20210102.pdf#page=21"}, {"fact": "第60回八丈島フリージアまつりは2026年3月20日から4月5日まで、八形山の特設会場を主な会場に開かれた", "url": "https://www.gotokyo.org/jp/spot/ev167/index.html"}], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260818/"}, {"label": "八丈町議会", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/25165430/20230201.pdf#page=48"}, {"label": "GO TOKYO", "url": "https://www.gotokyo.org/jp/spot/ev167/index.html"}], "label": "文化", "audience": "島民", "thread_id": "t20260819-70", "id": "232d3c", "photo": {"type": "img", "src": "/img/kiji/232d3c.jpg?v=28f658", "og": "/img/kiji/232d3c-og.jpg?v=28f658", "s": "/img/kiji/232d3c-s.jpg?v=28f658", "m": "/img/kiji/232d3c-m.jpg?v=28f658", "caption": "フリージア", "credit": "", "file": "ac/25574557.jpg"}}, {"headline": "熊本地震の義援金、役場で受付", "body": ["八丈町は、7月に起きた令和8年熊本地震の被災者を支えるため、義援金を受け付けている。募金箱は役場1階の会計係カウンターと各出張所に置いた。受付は10日に始まり、当面の間続ける。町が18日に知らせた。", "島は2025年10月の台風22号と23号で被災し、各地から義援金を受けた。東京都は2025年10月22日から2026年1月31日まで義援金を募り、八丈町と青ヶ島村に送るとした。その島が今度は熊本の被災者へ義援金を集めている。", "地震は気象庁によると7月28日16時27分ごろ、熊本県熊本地方で起きた。規模はM7.1（暫定値）で、宇城市と氷川町で最大震度7を観測した。熊本県は7月29日から義援金の口座を開き、受け付けている。", "町と熊本の縁は今回の地震の前からある。2016年の熊本地震では、町職員が嘉島町と御船町で罹災証明に関わる住家被害認定調査などを支援した。今回も町は6日、職員2人を罹災証明コーディネーターとして氷川町へ送ると知らせた。昨年の台風の後には、罹災証明コーディネーターが町の税務課を支援している。島の加工品とのつながりもある。あしたば加工工場の「八丈島復興 ご当地ラーメン」を作る御船町の肥後そう川も被災し、4日に工場の稼働を再開した。", "募金は日本円に限る。会計係カウンターは役場の正面玄関を入って右側にある。問い合わせは町福祉健康課厚生係（04996-2-5570）。"], "added": [{"fact": "会計係カウンターは役場1階の正面玄関を入って右側。問い合わせは福祉健康課厚生係（04996-2-5570）", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260818-02/"}, {"fact": "東京都は令和7年台風第22号及び第23号の義援金を2025年10月22日から2026年1月31日まで募り、八丈町と青ヶ島村に送るとした", "url": "https://www.fukushi.metro.tokyo.lg.jp/about/soshiki/shidou/shidou/r7_typhoon22and23/r7_typhoon22and23_donation"}, {"fact": "熊本県は2026年7月29日から令和8年熊本地震の義援金口座を開いて受け付けている", "url": "https://www.pref.kumamoto.jp/soshiki/27/274572.html"}, {"fact": "地震は7月28日16時27分ごろ熊本県熊本地方で発生、M7.1（暫定値）、最大震度7を宇城市と氷川町で観測（気象庁）", "url": "https://shinbun.hachijojima.jp/2026/08/05/c84ed0/"}, {"fact": "町は8月6日、職員2人を罹災証明コーディネーターとして氷川町へ送ると知らせた。2016年は嘉島町と御船町で住家被害認定調査などを支援。昨年の台風では罹災証明コーディネーターが町の税務課を支援した", "url": "https://shinbun.hachijojima.jp/2026/08/08/e9332f/"}, {"fact": "復興ラーメンの製造元、御船町の肥後そう川が被災し、8月4日に再稼働した", "url": "https://shinbun.hachijojima.jp/2026/08/05/c84ed0/"}], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260818-02/"}, {"label": "東京都福祉局", "url": "https://www.fukushi.metro.tokyo.lg.jp/about/soshiki/shidou/shidou/r7_typhoon22and23/r7_typhoon22and23_donation"}, {"label": "熊本県", "url": "https://www.pref.kumamoto.jp/soshiki/27/274572.html"}, {"label": "八丈島新聞", "url": "https://shinbun.hachijojima.jp/2026/08/08/e9332f/"}], "label": "町政", "audience": "島民", "thread_id": "t20260819-71", "id": "285229", "photo": {"type": "img", "src": "/img/kiji/285229.jpg?v=c7dba3", "og": "/img/kiji/285229-og.jpg?v=c7dba3", "s": "/img/kiji/285229-s.jpg?v=c7dba3", "m": "/img/kiji/285229-m.jpg?v=c7dba3", "caption": "熊本地震からの復興のシンボル・熊本城", "credit": "", "file": "ac/35429645.jpg"}}, {"headline": "八丈学講座、22日は水槽解説", "body": ["大賀郷の八丈植物公園にある八丈ビジターセンターは、22日13時30分から15時まで、八丈学講座「水槽をじっくり見てみよう」を館内で開く。展示水槽にいる生きものを解説する。", "同センターは月に1回、土曜の午後に八丈学講座を開いている。これまでのテーマは鳥の声、ザトウクジラ、潮だまりの生きもの、着生植物などで、多くは野外で開いてきた。今回は館内の水槽が題材になる。同センターは、館内なら涼しく過ごせて熱中症対策にもなると案内している。町も参加を呼びかけている。", "展示水槽には、潮だまりでの行事で採った生きものも入っている。2025年8月には、その行事で採ったケブカガニ、イモガイヨコエビ、スベスベサンゴヤドカリなどが水槽に加わった。同じ年の7月には、水槽の巣の中にいるツノナシテッポウエビを紹介している。", "今年の夏は海での行事が続けて取りやめになった。潮だまり探検隊は、7月29日の回が雷注意報のため、12日の回が海の状況が悪いため中止された。同センターは、来年は8月上旬に開く予定としている。", "水槽を詳しく解説する講座は、2025年12月27日にも「ディープな水槽解説」として案内された。ビジターセンターは入館無料で、開館は9時から16時45分まで。問い合わせは同センター（04996-2-4811）へ。"], "added": [{"fact": "八丈学講座は月に1回、土曜の午後に開かれ、鳥の声、ザトウクジラ、潮だまり、着生植物などをテーマに多くは野外で開いてきた", "url": "https://x.com/8jo_vc"}, {"fact": "2025年8月の潮だまりでの行事で採ったケブカガニ、イモガイヨコエビ、スベスベサンゴヤドカリなどが展示水槽に入った", "url": "https://x.com/8jo_vc"}, {"fact": "2025年7月、展示水槽で巣の中にいるツノナシテッポウエビを紹介した", "url": "https://x.com/8jo_vc"}, {"fact": "潮だまり探検隊は7月29日が雷注意報で、8月12日が海の状況不良で中止。来年は8月上旬に開く予定", "url": "https://x.com/8jo_vc"}, {"fact": "2025年12月27日13時30分〜15時に八丈学講座「ディープな水槽解説」が案内された", "url": "https://x.com/8jo_vc"}, {"fact": "八丈ビジターセンターは入館無料、開館は9時〜16時45分", "url": "https://www.kankyo1.metro.tokyo.lg.jp/naturepark/know/shisetsu/visitorcenter/hatijo.html"}, {"fact": "八丈植物公園の所在地は八丈町大賀郷", "url": "https://www.navitime.co.jp/category/0101002001/13401002000/"}], "sources": [{"label": "八丈ビジターセンター", "url": "https://x.com/8jo_vc/status/2089284562576900118"}, {"label": "八丈町", "url": "https://x.com/hachijomachi/status/2089326709770444879"}, {"label": "東京都環境局", "url": "https://www.kankyo1.metro.tokyo.lg.jp/naturepark/know/shisetsu/visitorcenter/hatijo.html"}], "label": "文化", "audience": "両方", "thread_id": "t20260819-72", "id": "2d8fb1", "photo": {"type": "img", "src": "/img/kiji/2d8fb1.jpg?v=c87a35", "og": "/img/kiji/2d8fb1-og.jpg?v=c87a35", "s": "/img/kiji/2d8fb1-s.jpg?v=c87a35", "m": "/img/kiji/2d8fb1-m.jpg?v=c87a35", "caption": "八丈植物公園", "credit": "", "file": "ac/284304.jpg"}}, {"headline": "あさぬま、23日は休業", "body": ["大賀郷のスーパーあさぬまは、日曜日の23日に店を休む。同店が18日に知らせた。週末の特売チラシの日程は、20日から22日までの3日間とする。", "同店は8月の休業日として23日を挙げた。前の週の特売は、14日から16日の金曜から日曜だった。今週は木曜から土曜の3日間になる。日曜に買い物をする家庭は、23日は同店では買えない。"], "added": [{"fact": "スーパーあさぬまの店は大賀郷にある", "url": "https://4travel.jp/dm_shisetsu/11434556"}, {"fact": "前の週の特売チラシは8月14日から16日（金曜から日曜）だった", "url": "https://x.com/umikaze8jo/status/2087739114900836636"}], "sources": [{"label": "スーパーあさぬま", "url": "https://x.com/umikaze8jo/status/2089496443115770009"}, {"label": "フォートラベル", "url": "https://4travel.jp/dm_shis const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
