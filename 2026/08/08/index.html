<script type="application/json" id="edition">{"date": "2026-08-08", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-26T06:59:25+09:00", "prev": "/2026/08/07/", "next": "/2026/08/09/", "alerts": [], "weather": {"issued": "2026-08-08T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 30}]}, "koyomi": {"sunrise": "4:58", "sunset": "18:35", "moon": 24.3, "tide": {"place": "八丈島(神湊)", "high": [["15:28", 124], ["23:52", 131]], "low": [["6:48", 47], ["18:46", 120]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "花火大会ステージに八丈太鼓", "body": ["八丈島文化協会によると、第25回八丈島納涼花火大会のステージに、協会加盟団体が出演する。出演は八丈太鼓よされ会、八丈島Soka栄光バンド、八丈太鼓はるみ会、檜之扇会、八丈太鼓月曜会。", "Heat upとコウ リマ ナニ エも出演する。大会は10日が前夜祭、11日が底土海岸での花火大会で、打ち上げは20時11分に始まる。八丈町は夜店が出ると案内している。", "昨年は協会が、前夜祭に八丈太鼓よされ会と八丈島Soka栄光バンドが出ると伝えた。花火大会当日には檜之扇会、加茂川会、八丈太鼓月曜会、コウ リマ ナニ エが出ると伝えた。今回の一覧に加茂川会はなく、八丈太鼓はるみ会とHeat upが加わっている。", "町によると、11日は無料送迎バスを1台運行する。経路は坂上、大賀郷を経由して底土まで。末吉を17時45分ごろ出て18時30分ごろ底土に着き、帰りは21時15分ごろ底土を出る予定。事前予約制で、申し込みは7日に締め切った。乗車の可否と各地区の停留所は、大会前までに希望者へ連絡する。泥酔者は予約済みでも乗車を断られることがあり、車内での飲食は控えるよう案内している。", "町は大会運営費の協賛を募っており、銀行振込でも受け付ける。協力店と観光協会には募金箱を置く。"], "figure": null, "sources": [{"label": "八丈島文化協会", "url": "https://x.com/8jobunka/status/2085581378075435307"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260701-06/"}], "label": "文化", "audience": "両方", "thread_id": "t20260805-21", "followup": true, "id": "966f26", "photo": {"type": "img", "src": "/img/kiji/966f26.jpg?v=f2e746", "og": "/img/kiji/966f26-og.jpg?v=f2e746", "s": "/img/kiji/966f26-s.jpg?v=f2e746", "m": "/img/kiji/966f26-m.jpg?v=f2e746", "caption": "早朝の太陽と底土海水浴場", "credit": "", "file": "ac/27266281.jpg"}}, "side": [], "shorts": [{"headline": "裏見ヶ滝温泉、10日から水風呂", "body": ["八丈島観光協会によると、中之郷の裏見ヶ滝温泉が10日から9月23日まで臨時営業する。浴槽に水道水を張った「水風呂」として開ける。営業時間は9時から21時まで。", "温泉ではなく水道水のため、水は温かくない。混浴のため水着を着る。石けんとシャンプーは使えない。", "裏見ヶ滝温泉と尾越温泉スタンドは、井戸ポンプの故障で7月17日から臨時休業している。八丈町は夏の暑さをしのぐ場として、裏見ヶ滝温泉の浴槽を水風呂にして開ける。町役場の代表番号は04996-2-1121で、受け付けは平日8時30分から17時15分まで。"], "sources": [{"label": "八丈島観光協会", "url": "https://www.hachijo.gr.jp/newsrelease/%e8%a3%8f%e8%a6%8b%e3%83%b6%e6%bb%9d%e6%b8%a9%e6%b3%89%e3%80%8c%e6%b0%b4%e9%a2%a8%e5%91%82%e3%80%8d%e8%87%a8%e6%99%82%e5%96%b6%e6%a5%ad%e3%81%ae%e3%81%8a%e7%9f%a5%e3%82%89%e3%81%9b%e3%80%808-10/"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260717/"}], "label": "くらし", "audience": "両方", "thread_id": "t20260808-31", "id": "88694f", "photo": {"type": "img", "src": "/img/kiji/88694f.jpg?v=9d5d79", "og": "/img/kiji/88694f-og.jpg?v=9d5d79", "s": "/img/kiji/88694f-s.jpg?v=9d5d79", "m": "/img/kiji/88694f-m.jpg?v=9d5d79", "caption": "裏見ヶ滝温泉", "credit": "", "file": "own/uramigataki-onsen-5.jpg"}}, {"headline": "結婚おうえんフェスタに八丈町", "body": ["八丈町によると、東京都生活文化局が8日、港区の麻布台ヒルズで「TOKYO結婚おうえんフェスタ」を開く。町は伊豆諸島・小笠原諸島の物産と八丈島のVR体験コーナーを出展する。第70代ミス八丈島も参加する。", "催しは11時30分から20時30分まで、8日の「はちみつ結びの日」に開く。結婚への機運を都内に広げ、最初の一歩を後押しするのが目的。会場は中央広場、麻布台ヒルズカフェ(タワープラザB1階)、ヒルズハウス(森JPタワー33階)。小池知事の開会、トークショー、ステージ、セミナーがある。", "模擬結婚相談、パーソナルカラー診断、フォト・ヘアアレンジ体験もある。他県や都内の自治体、民間企業も参加し、山梨県は観光PRのブースを出す。東京都の結婚おうえんイベントは参加費が無料で、事前申込制の内容もあり、空きがあれば当日も参加できる。問い合わせは、催しについて同局地域活動推進課(03-5320-4236)。当日はTOKYO結婚おうえんフェスタ事務局(03-6747-4790、平日10時から20時)。", "町は2024年10月19日、板橋区民まつりの八丈島ブースにミス八丈島も参加すると知らせた。2025年5月24日には、島じまん2025の八丈島ブースに町長とミス八丈島が出たと知らせた。2025年9月18日には、9月19日と20日の東京愛らんどフェア2025にミス八丈島も出ると知らせた。町は6日、ミス八丈島が2027年4月から新たな形に変わるとして、新しい名称の募集を知らせた。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2085561728205717794"}, {"label": "東京都", "url": "https://www.metro.tokyo.lg.jp/information/press/2026/07/2026070311"}], "label": "産業", "audience": "両方", "thread_id": "t20260808-32", "id": "671951", "photo": {"type": "img", "src": "/img/kiji/671951.jpg?v=4e316d", "og": "/img/kiji/671951-og.jpg?v=4e316d", "s": "/img/kiji/671951-s.jpg?v=4e316d", "m": "/img/kiji/671951-m.jpg?v=4e316d", "caption": "小笠原諸島・父島の二見港", "credit": "", "file": "ac/35416211.jpg"}}, {"headline": "八丈島選抜、隠岐の島町の大会へ", "body": ["八丈町によると、第17回全国離島交流中学生野球大会に出る八丈島選抜チームの壮行会が開かれた。大会は17日から21日まで、島根県隠岐郡隠岐の島町である。", "広報はちじょう2012年6月号によると、八丈島のチームは第1回大会から参加している。2009年9月号によると、第2回大会も隠岐の島町で開かれ、八丈島の選抜チームは2戦2敗だったが、他島との交流を得た。2012年10月号によると、第5回大会は南原野球場ほかで開かれた。過去最多の21チームが参加し、隠岐の島町が優勝した。", "2025年は宮古島が会場だった。八丈島チームは8月19日の初戦で久米島ゴールデンキングスに敗れ、20日の第2戦で対馬ヤマネコボーイズに勝った。優勝は宮古島アララガマボーイズで、チームは22日に帰島し、空港で仲間や家族に迎えられた。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2085558854709108889"}, {"label": "広報はちじょう2009年9月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23144917/hachijo0909.pdf"}, {"label": "広報はちじょう2012年10月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23143539/hachijo1210.pdf"}, {"label": "広報はちじょう2012年6月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23143554/hachijo1206.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20260808-33", "id": "f9f5cd", "photo": {"type": "img", "src": "/img/kiji/f9f5cd.jpg?v=f6a68a", "og": "/img/kiji/f9f5cd-og.jpg?v=f6a68a", "s": "/img/kiji/f9f5cd-s.jpg?v=f6a68a", "m": "/img/kiji/f9f5cd-m.jpg?v=f6a68a", "caption": "富士グラウンド", "credit": "", "file": "own/fuji-ground-2.jpg"}}, {"headline": "氷川町へ罹災証明の職員2人", "body": ["八丈町は6日、熊本地震の災害支援で、職員2人が罹災証明コーディネーターとして熊本県氷川町へ向かうと知らせた。町によると、町長が職員を激励した。出発の日は示されていない。", "町職員の熊本地震への支援は2016年にもあった。広報はちじょう2016年7月号によると、町職員は嘉島町と御船町で、罹災証明に関わる住家被害認定調査などを支援した。", "町は2025年10月の台風で被災した側でもある。町は同年11月1日、被害家屋の調査が済んだ人を対象に、町役場ギャラリーで罹災証明書の発行受付を始めた。大正大学地域構想研究所の佐藤和彦さんの2026年の報告によると、この台風では1,600棟を超える建物被害が出た。罹災証明コーディネーターが町の税務課を支援したという。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2085231775928999959"}, {"label": "広報はちじょう2016年7月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2 function ichigyo(w){

const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',

const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };

const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
/* 島の足:東海汽船の表を、島の人が読む形に並べ直す(言葉は表のまま)。「島のいま」の「船」の項になる */
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  // 載せるのは、けさ八丈島に着く東京からの船(昨晩発)と、八丈島→青ヶ島。今晩発・八丈島→東京・青ヶ島→八丈島は載せない(利用者の指定)
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    // 定型の案内文は「条件付き」、運休日や更新予定は状態の列へ(言葉は表のまま)
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}

        <div style="position:relative;width:100%;height:0;padding-top:calc(56.25% + 44px)"><iframe src="${TV_EMBED}" title="FM八丈島テレビ" style="position:absolute;inset:0;display:block;width:100%;height:100%;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      </section>

        <h2 class="band" id="week-h"><a href="/archive/">今週の一面</a></h2>

  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};
  [...new Set([...document.querySelectorAll("figure.embed")].map(f=>f.dataset.provider))].forEach(p=>{
    if(!need[p]) return; const sc=document.createElement("script"); sc.src=need[p]; sc.async=true; document.body.appendChild(sc);
  });
}
if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
