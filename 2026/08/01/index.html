<script type="application/json" id="edition">{"date": "2026-08-01", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T07:33:24+09:00", "prev": null, "next": "/2026/08/02/", "alerts": [], "weather": {"issued": "2026-08-01T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "くもり", "main": "くもり", "hachijo": "くもり", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 27, "max": 31}]}, "koyomi": {"sunrise": "4:53", "sunset": "18:41", "moon": 17.3, "tide": {"place": "八丈島(神湊)", "high": [["6:02", 144], ["19:19", 144]], "low": [["0:24", 80], ["12:38", 32]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "八丈町に避難指示 土砂災害警報", "body": ["気象庁は7月29日午前6時31分、八丈町にレベル4の土砂災害危険警報を発表した。町は7時51分、土砂災害警戒区域の住民に避難指示を出し、多目的ホール「おじゃれ」に避難所を開設した。", "気象庁八丈島の29日の降水量は73.5ミリだった。最高気温は29.3度、最低気温は22度だった。この日の朝には、伊豆諸島南部に線状降水帯の直前予測も出ていた。", "ANAの羽田—八丈島線は、1便が雷のため欠航した。八丈島観光協会によると、8時13分の時点で2便は天候状況の確認中、3便は通常運航だった。東海汽船株式会社の28日夜竹芝発の便は、8時55分に底土港へ入港する予定と案内された。八丈島—青ヶ島の定期船くろしお丸は、八重根漁港を9時30分に出港する予定と案内された。", "町によると、やすらぎの湯、みはらしの湯、洞輪沢温泉は午前中を臨時休業とした。八丈島郵便局と中之郷郵便局は、警報の発令中は窓口業務とATMの取り扱いを休止した。都立八丈高等学校は、避難指示が出ていることから、夏季講習、部活動、自習室、文化祭準備など登校して行う活動を中止した。島内での高校の活動も中止した。"], "sources": [{"label": "news.web.nhk", "url": "https://news.web.nhk/newsweb/na/na-k10015189331000"}, {"label": "八丈町", "url": "https://x.com/HachijoTown/status/2082231803805577278"}], "label": "くらし", "audience": "両方", "thread_id": "t20260801-3", "id": "5dc629", "photo": {"type": "img", "src": "/img/kiji/5dc629.jpg?v=d93eb3", "og": "/img/kiji/5dc629-og.jpg?v=d93eb3", "s": "/img/kiji/5dc629-s.jpg?v=d93eb3", "m": "/img/kiji/5dc629-m.jpg?v=d93eb3", "caption": "八丈町役場・八丈町多目的ホール おじゃれ", "credit": "", "file": "own/yakuba-11.jpg"}}, "side": [], "shorts": [{"headline": "林道の全線通行止めを案内", "body": ["八丈島観光協会は7月30日、八丈支庁管内の林道を全線通行止めにすると案内した。八丈富士牧場線(鉢巻道路)の一部区間も、7月29日から通行止めにしていると案内している。", "観光協会は鉢巻道路の通行止めを7月29日に案内し、その翌30日に林道の全線通行止めを案内した。"], "sources": [{"label": "八丈島観光協会", "url": "https://www.hachijo.gr.jp/newsrelease/%e5%85%ab%e4%b8%88%e6%94%af%e5%ba%81%e7%ae%a1%e5%86%85%e3%81%ae%e6%9e%97%e9%81%93-%e5%85%a8%e7%b7%9a%e9%80%9a%e8%a1%8c%e6%ad%a2%e3%82%81%e3%81%ae%e3%81%94%e6%a1%88%e5%86%85%e3%80%807-30%e6%9c%a8/"}], "label": "町政", "audience": "両方", "thread_id": "t20260801-1", "id": "2e2232", "photo": {"type": "img", "src": "/img/kiji/2e2232.jpg?v=435fc5", "og": "/img/kiji/2e2232-og.jpg?v=435fc5", "s": "/img/kiji/2e2232-s.jpg?v=435fc5", "m": "/img/kiji/2e2232-m.jpg?v=435fc5", "caption": "東京都八丈支庁", "credit": "", "file": "own/shicho-3.jpg"}}, {"headline": "文化フェスティバルの出展者募集", "body": ["八丈町によると、第37回八丈島文化フェスティバルの作品展部門の出展者と舞台部門の出演者を、1日から9月1日まで募る。期間内必着。", "作品展部門は2027年1月9日から11日まで、舞台部門は2027年1月17日に開く。", "申し込みは、八丈島文化協会のサイトで募集要項を読んだうえで、Webフォームか、同協会での直接申し込みで行う。Webフォームは舞台部門用と作品部門用がある。", "八丈島文化協会は三根4869-1の富士見地区公会堂の管理事務所内にあり、電話は04996-2-2833。受け付けは月・火・木・金の9時30分から11時30分で、祝日は休み。八丈町役場の電話は04996-2-1121で、平日8時30分から17時15分に受け付ける。", "同協会は、町の補助金を使って主催・共催事業を行っている。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260701-01-2/"}, {"label": "八丈島文化協会", "url": "https://8jobunka.jimdofree.com"}], "label": "文化", "audience": "島民", "thread_id": "t20260801-2", "id": "2f0d68", "photo": {"type": "img", "src": "/img/kiji/2f0d68.jpg?v=82de26", "og": "/img/kiji/2f0d68-og.jpg?v=82de26", "s": "/img/kiji/2f0d68-s.jpg?v=82de26", "m": "/img/kiji/2f0d68-m.jpg?v=82de26", "caption": "八丈町役場・八丈町多目的ホール おじゃれ", "credit": "", "file": "own/yakuba-4.jpg"}}, {"headline": "三根で百徳着物を縫う催し", "body": ["八丈島で1日と2日、布を縫い合わせて「百徳着物」をつくるワークショップが開かれる。会場は三根のみんなのひみつ基地(三根4906-3)。参加費は無料で、予約は要らない。", "主催のチーム百徳によると、布がなくても参加でき、縫う作業だけの参加も受け付ける。古布、端切れ、思い出のある布の持ち寄りも歓迎している。つくった百徳着物は今後、展示・発表する予定という。", "百徳着物は江戸時代から金沢に伝わる産育習俗に由来する。子どもの健やかな成長を願い、徳の高い100軒の家から布をもらい、縫いつないで着物にする。チーム百徳はこの習俗を、「心の中の子ども」や生まれてこなかった命への祈りとしても位置づけている。", "チーム百徳は各地に滞在して、地域の百徳着物をつくっている。過去には2023年の黒崎海水浴場、2024年の葛尾村の百徳がある。今回の催しはアーツカウンシル東京の地域芸術文化活動応援助成を受けている。問い合わせは、チーム百徳の公式サイトの一般お問い合わせフォームで受け付けている。"], "sources": [{"label": "チーム百徳", "url": "https://100toku.net/"}], "label": "文化", "audience": "両方", "thread_id": "t20260801-4", "id": "5659b2", "photo": {"type": "img", "src": "/img/kiji/5659b2.jpg?v=f0adb1", "og": "/img/kiji/5659b2-og.jpg?v=f0adb1", "s": "/img/kiji/5659b2-s.jpg?v=f0adb1", "m": "/img/kiji/5659b2-m.jpg?v=f0adb1", "caption": "着物", "credit": "", "file": "ac/27104545.jpg"}}, {"headline": "いまみれん、メジャーデビューへ", "body": ["八丈島出身の歌手いまみれんさんが、新曲「休もう！」を20日に配信するという。ユニバーサル ミュージック内のCapitol Recordsからメジャーデビューするという。", "リアルサウンドが7月29日21時に伝えた。音楽ナタリーも、同曲でのメジャーデビューを伝えている。"], "sources": [{"label": "島内からの投稿 1件", "url": ""}], "label": "文化", "audience": "両方", "thread_id": "t20260801-5", "id": "01dcfd", "photo": {"type": "img", "src": "/img/kiji/01dcfd.jpg?v=f43334", "og": "/img/kiji/01dcfd-og.jpg?v=f43334", "s": "/img/kiji/01dcfd-s.jpg?v=f43334", "m": "/img/kiji/01dcfd-m.jpg?v=f43334", "caption": "音楽 SING+SONG", "credit": "", "file": "ac/25430666.jpg"}}], "agenda": [{"date": "2026-08-01", "end": "2026-08-02", "text": "百徳布を縫い合わせるイベント", "url": "https://x.com/osakana8kitchen/status/2082389574450557043"}], "letters": [], "corrections": [], "column": null, "kyoku": {"artist": "Shing02", "title": "400", "text": "「400」という数字の意味を解くより、ラップの一小節に耳を澄ませたい。語尾を詰めたり、次の拍まで引き延ばしたりする声の運動が、一定のビートに別の尺度を作る。流れてゆく言葉をすべて捉えようとすると、かえってリズムを見失う。意味と音が同じ速度で届かないことまで含めて、ラップの面白さがあります。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music113/v4/ad/fe/f1/adfef1e9-cf7f-f317-3aaa-0b881c59cdc6/4935228989751_cover.jpg/300x300bb.jpg", "album": "400 - EP", "url": "https://music.apple.com/jp/album/400-vocal/1465862499?i=1465862504&uo=4"}}, "ronten": null, "weekly": [], "ichimen_week": [], "population": {"as_of": "2026-07-01", "people": 6554, "people_diff": 3, "households": 4060, "households_diff": 1, "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/31161410/hachijo2608.pdf", "ido": {"in": 30, "birth": 1, "out": 20, "death": 7}}, "giin": [], "hyakunen"     e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
 
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section class="ran" id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h"><a href="/song/">きょうの一曲</a></h2>
    <div class="kk">${a?`<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.img)}" alt="${esc(a.album||k.title)}のジャケット" width="96" height="96" loading="lazy"></a>`:""}
      <div><h3>${k.day?`<a class="hl" href="${esc(k.day)}song/">${esc(k.title)}</a>`:esc(k.title)}</h3><p class="who">${esc(k.artist)}</p></div></div>
    <p class="txt">${esc(k.text)}</p>
    <p class="kiku"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTubeで聴く</a>${a&&a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Apple Musicで聴く</a>`:""}</p></section>`;
}
 
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){
  if(!c) return "";
  return `<section class="ran" id="tayori" aria-labelledby="tayori-h"><h2 class="band" id="tayori-h"><a href="/column/">${esc(c.name||"島のたより")}</a></h2>
    ${c.title?`<h3>${c.day?`<a class="hl" href="${esc(c.day)}column/">${esc(c.title)}</a>`:esc(c.title)}</h3>`:""}<div class="honbun">${(c.body||[]).map(t=>`<p>${mdLink(t)}</p>`).join("")}</div></section>`;
}

  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top" id="a1">
      ${lbl(e.top)}<h2>${hl(e,e.top)}</h2>
      ${figure(e.top.photo)}
      <div class="honbun">${paras(e.top.body)}${src(e.top.sources)}</div>
    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];
      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>
      ${s.id?`<p class="ld">${esc(b[0])}</p>`:`<div class="honbun">${paras(b)}${src(s.sources)}</div>`}
    </article>`;}).join("")}</div>`:""}`:""}
    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}
    ${e.ronten?`<section class="ran men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">

  </div>

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;

const EMB = document.getElementById("edition").textContent.trim();
if (EMB.startsWith("{")) render(JSON.parse(EMB)); else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
