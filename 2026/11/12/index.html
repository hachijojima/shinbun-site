{"island": "青ヶ島", "direction": "青ヶ島発", "time": "", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": "運休日"}]}, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "八丈島で菌類研究、国際学会で受賞", "body": ["八丈島に生息する菌類と昆虫の関係を調べた研究が、国際学会「Island Biology 2026」でポスター発表賞を受賞した。学会は2日から6日まで静岡県熱海市で開催され、曲雅慧さん(早稲田大学)、末吉昌宏さん(森林総合研究所)、屋宜禎央さん(九州大学)、德田誠さん(佐賀大学)、小林卓也さん(森林総合研究所)、細将貴さん(早稲田大学)の6人による研究が、受賞10件の一つに選ばれた。", "研究対象は、ヤブニッケイの幹や枝に鹿の角のような突起を形成する「ヤブニッケイもち病菌」。学名は「Laurobasidium hachijoense」で、種小名の「hachijoense」は八丈島に由来する。1985年に新種として記載され、2017年の分類見直しで現在の学名となった。", "同じ研究チームが今年3月の日本生態学会で発表した要旨によると、2025年5月から2026年1月にかけて八丈島で調査を実施。菌によって形成された「菌えい」から約20種の昆虫を確認した。菌えいの成長初期には植物を食べる昆虫が見られ、枯死後には腐食性の昆虫が増えるなど、小さな菌えいが多様な昆虫の生息場所となっていることが示された。", "今回の受賞演題は「昆虫群集にとって見過ごされてきた生息地の島としての菌えい」。"], "sources": [{"label": "Island Biology 2026", "url": "https://sites.google.com/view/island-biology-2026/awards"}], "label": "文化", "audience": "島民", "thread_id": "t20261112-70", "id": "46c97e", "edited": "2026-11-12T19:35:03+09:00", "photo": {"type": "img", "src": "/img/kiji/46c97e.jpg?v=9f1eb3", "og": "/img/kiji/46c97e-og.jpg?v=9f1eb3", "s": "/img/kiji/46c97e-s.jpg?v=9f1eb3", "m": "/img/kiji/46c97e-m.jpg?v=9f1eb3", "caption": "森の中の道を進む", "credit": "", "file": "ac/25894994.jpg"}}, "side": [], "shorts": [{"headline": "八丈高校島民会議、申込12日まで", "body": ["都立八丈高等学校は、令和8年度の島民会議の事前申し込みの期限が12日だと案内している。島民会議は21日9時から12時30分まで、八丈高校で開く。時間は変更になることがある。", "島民会議では、高校2年生が八丈島の「価値」と「課題」を地域の方々と協働して深め、解決策を提案する。オープニングセレモニーとして、文化祭で行う予定だった合唱を視聴覚ホール前で行う予定。", "申し込みはQRコード、またはページ内のフォームから行う。当日参加もできるが、希望の分科会を見られない場合がある。学校の代表電話は04996-2-1181。住所は八丈町大賀郷3020。", "同校は2023年12月15日、全日制の2学年が主役の島民会議を開いた。2024年3月26日には、令和5年度の島民会議で取り上げた内容をまとめた意見書を八丈町役場に提出し、町長が直接受け取った。今年は7月14日に、2年生を中心に「進路×探究×八丈」をテーマにしたプレ島民会議を実施している。", "広報はちじょう2023年11月号は、同年の島民会議を12月15日に開くと案内し、協働者を募集した。前年度の学校案内も、島民会議を12月の行事として紹介している。"], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2120427571276046394"}, {"label": "広報はちじょう 2023年11月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23122723/hachijo2311.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20261102-24", "followup": true, "id": "9e3099", "photo": {"type": "img", "src": "/img/kiji/9e3099.jpg?v=3ebb69", "og": "/img/kiji/9e3099-og.jpg?v=3ebb69", "s": "/img/kiji/9e3099-s.jpg?v=3ebb69", "m": "/img/kiji/9e3099-m.jpg?v=3ebb69", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-1.jpg"}, "edited": "2026-11-12T12:37:47+09:00"}, {"headline": "八丈富士ツアー、12日発売", "body": ["東海汽船株式会社は、八丈富士トレッキングと島めぐりを組み合わせた竹芝発3日間のツアーを、12月25日と2027年2月5日の出発で売り出す。予約は12日12時から受け付ける。", "1日目は竹芝客船ターミナルに21時から22時に集合し、22時30分に大型客船で出港する。2日目は8時55分に八丈島に着き、八丈富士七合目登山口からのトレッキングで山頂と浅間神社を回る。その後、八丈島歴史民俗資料館、大里の玉石垣・陣屋跡、大坂トンネル展望台、樫立向里温泉ふれあいの湯などに立ち寄る。宿泊はリードパークリゾート八丈島で、1泊2食付き。3日目は9時40分ごろに島を出て、19時50分ごろに竹芝に着く。", "トレッキングの歩行時間は約200分。累計標高差は300mを超え、東海汽船は健脚者向けのコースとしている。八丈富士の火口を回るお鉢巡りは行程に入っていない。持ち物はトレッキングシューズ、リュックサック、雨具(上下)、防寒着。", "料金は税込みで、大人が2名1室45,000円、1名1室52,250円。子ども(小学校就学児)は2名1室35,000円。伊豆諸島クラブ会員料金もある。募集は各日20名で、最少催行人員は15名。申込みは出発日の5日前までに、東海汽船お客様センター(03-5472-9999、毎日9時30分から18時)で受け付ける。", "東海汽船は2025年12月11日、八丈富士山頂トレッキングの緊急発売を知らせた。島さんぽシリーズに八丈島が初めて加わった時のことである。今回のツアーは東京諸島観光プランの第3弾にあたる。同プランは2026年10月30日の東京諸島観光きっぷに続き、10日に第2弾の販売が始まった。"], "sources": [{"label": "東海汽船", "url": "https://www.tokaikisen.co.jp/news/843880/"}], "label": "産業", "audience": "来島者", "thread_id": "t20261112-65", "id": "fcd1ed", "photo": {"type": "img", "src": "/img/kiji/fcd1ed.jpg?v=7382a2", "og": "/img/kiji/fcd1ed-og.jpg?v=7382a2", "s": "/img/kiji/fcd1ed-s.jpg?v=7382a2", "m": "/img/kiji/fcd1ed-m.jpg?v=7382a2", "caption": "八丈富士のお鉢巡り 天空のトレッキング", "credit": "", "file": "ac/35139524.jpg"}}, {"headline": "登記案内、12月8・9日に", "body": ["東京法務局の職員が12月8日と9日、八丈町役場の相談室5で登記の申請手続を案内する。ウェブ会議システムを通じ、対象は不動産登記と商業・法人登記。完全予約制で、事前に予約した人だけが利用できる。", "相談は午前9時から午後4時まで(正午から午後1時を除く)で、1回20分。12月分の予約は12月7日の正午までで、次回は2027年1月12日と13日。予約の際は「八丈町役場のウェブ会議システムからの利用である」と伝えるよう求めている。", "相続などによる不動産取得の登記申請は、2024年4月1日から義務化され、取得を知った日から3年以内の申請が必要になった。2026年4月1日からは、住所や氏名・名称の変更登記も義務化された。広報はちじょう2025年6月号にも、同種の案内を載せている。", "予約・問い合わせは、不動産登記が東京法務局の不動産登記部門・法規係(03-5213-1330)。商業・法人登記は法人登記部門・法規係(03-5213-1337)。町の問い合わせ先は建設課管財係(04996-2-1124)。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261111/"}, {"label": "広報はちじょう 2025年6月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114417/hachijo2506.pdf"}], "label": "くらし", "audience": "島民", "thread_id": "t20261112-66", "id": "4281ce", "photo": {"type": "img", "src": "/img/kiji/4281ce.jpg?v=948365", "og": "/img/kiji/4281ce-og.jpg?v=948365", "s": "/img/kiji/4281ce-s.jpg?v=948365", "m": "/img/kiji/4281ce-m.jpg?v=948365", "caption": "八丈町役場・八丈町多目的ホール おじゃれ", "credit": "", "file": "own/yakuba-6.jpg"}}, {"headline": "八丈高校家政科がはんばのり弁当", "body": ["都立八丈高等学校の3年家政科が11日、校内でお弁当を販売した。秋をテーマに30食を作り、八丈島の食材「はんばのり」と「島唐醤油」を使った。", "同校家政科は、3年生の授業で大量調理に取り組んできた。2023年11月26日には旬の食材や園芸科の里芋を使った弁当30食を校内で販売し、完売した。2024年6月14日には島の食材を使うことをテーマに50食を販売している。", "2025年11月18日には、3年総合フードデザインの授業で島レモンを使った「レモンチキンピラフ、ミネストローネ」を校内で販売した。3年生にとって最後の大量調理だった。"], "sources": [{"label": "八丈高校", "url": "https://x.com/tokyo8jouhs/status/2120439084669874661"}], "label": "教育", "audience": "島民", "thread_id": "t20261112-67", "id": "eb54d1", "photo": {"type": "img", "src": "/img/kiji/eb54d1.jpg?v=6aea60", "og": "/img/kiji/eb54d1-og.jpg?v=6aea60", "s": "/img/kiji/eb54d1-s.jpg?v=6aea60", "m": "/img/kiji/eb54d1-m.jpg?v=6aea60", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-2.jpg"}}], "agenda": [{"date": "2026-11-14", "end": "2026-11-15", "text": "くりらぼ in八丈(学年別デジタル制作)", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261026/"}, {"date": "2026-11-15", "end": null, "text": "ペット防災と条例のセミナー", "url": "https://x.com/8jo_shimaneko/status/2118885207029973452"}, {"date": "2026-11-15", "end": null, "text": "ニャンサミット2026", "url": "https://x.com/8jo_shimaneko/status/2118884312254935229"}, {"date": "2026-11-17", "end": "2026-11-18", "text": "商工会の税務講習会", "url": "https://x.com/hachisho8/status/2115315856439992492"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "予約した朝のごはん", "body": ["夜、米を研いで炊飯器を予約した。眠いまま水加減を確かめたのは、明日の朝の自分に少し楽をさせるためだ。朝になり蓋を開けると[新米の湯気](https://note.com/rosy_rat/n/n36ae940a98e8)が立ち上った。まだ味噌汁も作っていない台所が、もう半分出来上がったような顔をしていた。", "白い茶碗へご飯をよそい、しゃもじを水に浸す。光を受けた粒はいつもより艶やかで、箸を入れるのが少しもったいない。ふだんなら納豆や卵を探すところだが、まずは何も乗せない一膳を食べることにした。ひと口の中で、米の柔らかさと粒の残り方を確かめる。", "冷蔵庫から漬物を出す。すぐに食べるのではなく、皿へ少しだけ置いておく。最初のひと口には白いご飯だけの場所が欲しい。おかずの用意を後回しにする朝は、手抜きのようでいて少し贅沢だ。", "朝、炊飯器の蓋を開けると、湯気で眼鏡が白くなった。しゃもじを入れ、ひとすくい目を茶碗へ。昨日の夜に決めた時刻どおり、台所に温かい匂いが満ちていた。"]}, "kyoku": {"artist": "時速36km", "title": "七月七日通り", "text": "時速36kmが2018年7月7日にMVを公開した初期の一曲。のちに2026年のメジャー1stアルバムへ改めて収録されました。何年も演奏してきた歌が、新しい作品で再び鳴る。歌い手も客席も変わるから、昔の言葉にも別の光が当たります。古い曲を抱えたまま先へ進むのは、立ち止まることではありません。音楽には、何度でも新しい日付が付くのです。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/22/b9/57/22b95774-99a2-21aa-9173-c1bf86e6398a/dj.jalwkspx.jpg/300x300bb.jpg", "album": "まだ俺になる前の俺に。", "url": "https://music.apple.com/jp/album/%E4%B8%83%E6%9C%88%E4%B8%83%E6%97%A5%E9%80%9A%E3%82%8A/1482484176?i=1482484178&uo=4"}}, "ronten": null, "weekly": [], "ichimen_week": [{"date": "2026-11-11", "url": "/2026/11/11/d8fbed/", "headlines": ["ムロアジ漁10月で終了、水揚量減"]}, {"date": "2026-11-10", "url": "/2026/11/10/e538ec/", "headlines": ["あさぬま、来年から日曜休業"]}, {"date": "2026-11-09", "url": "/2026/11/09/fc42bc/", "headlines": ["船の就航予測、表示基準を改定"]}, {"date": "2026-11-08", "url": "/2026/11/08/2e37ea/", "headlines": ["猫の共生条例、15日にセミナー"]}, {"date": "2026-11-07", "url": "/2026/11/07/bfb2ca/", "headlines": ["ビジネスジェットで海外5社来島"]}, {"date": "2026-11-06", "url": "/2026/11/06/ad8076/", "headlines": ["東海汽船、島民割引きっぷ発売"]}, {"date": "2026-11-05", "url": "/2026/11/05/07bc1d/", "headlines": ["町の申請フォーム、4日使えず"]}], "population": {"as_of": "2026-11-01", "people": 6495, "people_diff": -4, "households": null, "households_diff": null, "url": "https://www.town.ha function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section class="ran" id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h"><a href="/government/members/">町議会議員</a></h2>
    <ol class="giin ichi">${g.map(r=>{const nm=`${rankMark(r.medal)}<b>${esc(r.name)}</b>`;
      return `<li>${r.slug?`<a class="n" href="/government/members/${esc(r.slug)}/">${nm}</a>`:`<span class="n">${nm}</span>`}${r.at?`<a class="ps" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.name+" "+(r.kind?r.kind+" ":"")+(r.what||""))}"><time>${esc(r.when)}</time><q>${r.hs||""}</q></a>`:""}</li>`;}).join("")}</ol><p class="more"><a href="/government/assembly/">議員・議会</a><a href="/government/members/">全員の一覧</a></p></section>`;
}
 
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
 
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u), sora=soraRow(e.sora), ev=evLines(e).slice(0,8);
  const diff=n=>n==null?"":`<small>(${n>0?"+":n<0?"−":"±"}${Math.abs(n).toLocaleString()})</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const st=e.sora&&e.sora.at?ymd(e.sora.at.slice(0,10)):null, sh=e.sora&&e.sora.at?hm(e.sora.at):"";
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
 
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section class="ran" id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h"><a href="/song/">きょうの一曲</a></h2>
    <div class="kk">${a?`<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.img)}" alt="${esc(a.album||k.title)}のジャケット" width="96" height="96" loading="lazy"></a>`:""}
      <div><h3>${k.day?`<a class="hl" href="${esc(k.day)}song/">${esc(k.title)}</a>`:esc(k.title)}</h3><p class="who">${esc(k.artist)}</p></div></div>
    <p class="txt">${esc(k.text)}</p>
    <p class="kiku"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTubeで聴く</a>${a&&a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Apple Musicで聴く</a>`:""}</p></section>`;
}
 
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){
  if(!c) return "";
  return `<section class="ran" id="tayori" aria-labelledby="tayori-h"><h2 class="band" id="tayori-h"><a href="/column/">${esc(c.name||"島のたより")}</a></h2>
    ${c.title?`<h3>${c.day?`<a class="hl" href="${esc(c.day)}column/">${esc(c.title)}</a>`:esc(c.title)}</h3>`:""}<div class="honbun">${(c.body||[]).map(t=>`<p>${mdLink(t)}</p>`).join("")}</div></section>`;
}

function render(e){
  e={...e}; if(!e.top&&e.side.length){e.top=e.side[0]; e.side=e.side.slice(1);}
  if(!e.top&&e.shorts.length){e.top=e.shorts[0]; e.shorts=e.shorts.slice(1);}
  
  document.title = /^\/\d{4}\/\d{2}\/\d{2}\//.test(location.pathname) ? `八丈島新聞 ${hiduke(e.date)}` : "八丈島新聞";
  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><span class="hi">2026年11月12日(木)</span><h1 class="daiji"><a href="/"><img src="/logo-maru.png" alt="" width="192" height="192">八丈島新聞</a></h1><details class="menu"><summary aria-label="メニュー"><span></span><span></span><span></span></summary><nav aria-label="ページ"><form class="ms" action="/archive/" role="search"><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"><button>検索</button></form><ul class="sg" hidden></ul><div><a href="/">最新号</a><a href="/archive/">バックナンバー</a><a href="/features/">特集</a></div><div><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><a href="/column/">島のたより</a></div><div><a href="/song/">きょうの一曲</a><a class="tvl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener" title="FM八丈島テレビ"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div></nav></details></div><nav class="nb" aria-label="ページ"><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><div class="nbs"><form class="ms" action="/archive/" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"></form><ul class="sg" hidden></ul></div><button class="nbq" type="button" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg></button></nav></header>
  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top" id="a1">
      ${lbl(e.top)}<h2>${hl(e,e.top)}</h2>
      ${figure(e.top.photo)}
      <div class="honbun">${paras(e.top.body)}${src(e.top.sources)}</div>
    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];
      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>
      ${s.id?`<p class="ld">${esc(b[0])}</p>`:`<div class="honbun">${paras(b)}${src(s.sources)}</div>`}
    </article>`;}).join("")}</div>`:""}`:""}
    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}
    ${e.ronten?`<section class="ran men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="ran tv" aria-label="FM八丈島テレビ"><div class="head"><h2 class="band onair"><a href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><i aria-hidden="true"></i>ON AIR</a></h2><a class="chl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div><div class="tvw"><iframe src="https://tv.hachijojima.jp/embed.html" title="FM八丈島テレビ" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></div></section>
      ${(e.ichimen_week||[]).length?`<section class="ran" id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h"><a href="/archive/">今週の一面</a></h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><a href="${esc(w.url)}"><time datetime="${esc(w.date)}">${tsuki(w.date)}</time>${esc(w.headlines[0])}</a></li>`).join("")}</ol>
      </section>`:""}
      ${giinSection(e)}
      ${kyokuSection(e.kyoku&&{...e.kyoku,day:DAY(e)})}
      ${shimaSection(e)}
    </aside>
  </div>

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
}

function kyukan(){
  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><h1 class="daiji"><a href="/"><img src="/logo-maru.png" alt="" width="192" height="192">八丈島新聞</a></h1><details class="menu"><summary aria-label="メニュー"><span></span><span></span><span></span></summary><nav aria-label="ページ"><form class="ms" action="/archive/" role="search"><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"><button>検索</button></form><ul class="sg" hidden></ul><div><a href="/">最新号</a><a href="/archive/">バックナンバー</a><a href="/features/">特集</a></div><div><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><a href="/column/">島のたより</a></div><div><a href="/song/">きょうの一曲</a><a class="tvl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener" title="FM八丈島テレビ"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div></nav></details></div><nav class="nb" aria-label="ページ"><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><div class="nbs"><form class="ms" action="/archive/" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"></form><ul class="sg" hidden></ul></div><button class="nbq" type="button" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg></button></nav></header>
  <section class="kyukan"><h2>本日は休刊です</h2><p>けさの号を組めませんでした。<a href="/archive/">バックナンバー</a>で前の号を読めます。</p></section>`;
}

const EMB = document.getElementById("edition").textContent.trim();
if (EMB.startsWith("{")) render(JSON.parse(EMB)); else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
