しま丸", "port": "---", "status": "---", "note": ""}, {"island": "青ヶ島", "direction": "青ヶ島発", "time": "12:50", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}]}, "sora": null, "number": null, "top": {"headline": "愛らんどシャトル、収支改善協議", "body": ["八丈町が20日に公表した第三回定例会の会議録によると、山下奉也町長は9月4日の行政報告で、赤字が続く東京愛らんどシャトルの収支改善に向けた検討が始まったと説明した。町長は6月29日の収支改善検討委員会に出席。広報や予約キャンセル、今後の運営の仕組みなどを課題に挙げた。", "東京愛らんどシャトルは、八丈島を拠点に青ヶ島、御蔵島、三宅島、大島、利島の6島を結ぶ定期ヘリ路線。東邦航空が運航し、東京都が島しょ振興公社を通じて運航を支援している。公社が都から補助金を受け、運航会社に支出する仕組みで、島民の生活交通を公費で支えている。", "公社の2025年度決算によると、ヘリの運航支援を中心とする交通関連事業の支出は約14億3414万円。前年度の約11億356万円から約3億3058万円増加した。運航会社への支援を中心とする支払負担金も約14億3285万円に上る。ただし、これはシャトル単独の赤字額ではない。", "一方、2025年の搭乗者数は1万8097人で、前年より595人減少した。提供座席数も3万861席から2万9565席に減ったため、平均搭乗率は60.6%から61.2%に上昇。公社が掲げる61%以上の目標を達成したものの、就航率は92.5%から87.7%に低下した。", "利用面では、区間による需要の偏りが課題となっている。公社の2025年2月の理事会では、予約が取れないという声が多い一方、平均搭乗率が約6割にとどまる理由が議論された。公社側は、予約開始後すぐに満席となる区間がある反面、搭乗率の低い区間もあると説明。利島村の理事からは、キャンセルを減らす対策が必要との意見も出された。空席がある区間と予約の取りにくい区間が併存している。", "利用改善策として、2025年5月から青ヶ島村民の優先予約を開始し、同年10月には八丈島―青ヶ島間で木曜夕方の便を増やした。キャンセル料については、乗り継ぐ船や飛行機が欠航した場合にも負担が生じる問題があり、東京都町村会などが免除に向けた財政支援を都に要望している。", "運営の仕組みも以前から検討課題となっている。2024年6月の公社理事会では、シャトル事業を公社から切り離し、都が直接担う案が過去に議論されていたことが明らかになった。当時は公社による支援を継続する前提と説明されたが、2025年策定の中期実施計画でも、都と連携した事業の仕組みの検討を掲げている。同計画では、運航会社が積算する経費を精査し、必要な支援を行う方針も示した。", "機材面では、老朽化したS76C++型機の後継としてAW139型機の導入が決まっており、2026年度冬の就航を予定している。八丈島の格納庫も老朽化が進み、大規模修繕を計画している。いずれも今回の収支改善検討会に先立つ既定の方針で、運航の維持には今後も設備面での対応が必要となる。", "大島町の公務日程には、11月11日に第2回収支改善検討会があると記載されている。運賃やダイヤ、予約制度、運営主体を変更するかどうかは明らかになっておらず、増加する公的負担をどのように抑え、必要な路線を維持するのか、具体策はまだ示されていない。"], "figure": null, "sources": [{"label": "八丈町議会", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/11/18135731/%EF%BC%91%E5%8F%B7-R8.9.4.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20261123-306", "edited": "2026-11-23T16:18:32+09:00", "id": "df41de", "photo": {"type": "img", "src": "/img/kiji/df41de.jpg?v=8049b9", "og": "/img/kiji/df41de-og.jpg?v=8049b9", "s": "/img/kiji/df41de-s.jpg?v=8049b9", "m": "/img/kiji/df41de-m.jpg?v=8049b9", "caption": "八丈島空港", "credit": "", "file": "ac/26619779.jpg"}}, "side": [], "shorts": [{"headline": "八丈高生、農業鑑定全国大会に出場", "body": ["東京都立八丈高等学校の園芸科3年生1人が、10月に高知県と徳島県で開かれた第77回日本学校農業クラブ全国大会に出場した。同校が13日に公開した「園芸科通信」第4号で、大会への参加と生徒の感想を紹介している。", "出場したのは、農業に関する専門知識や技術を競う農業鑑定競技。10月21日に高知県立高知農業高校で行われ、出題された問題に原則20秒、計算問題は40秒で解答する。日頃の授業や実習、農業クラブ活動で培った知識の正確さが問われる。", "参加した生徒は、事前に勉強を重ねて全国大会に挑戦。問題の難しさを実感する一方、他校の生徒との交流や農業クラブの雰囲気に触れられたことを大きな収穫として挙げた。優秀賞には届かなかったものの、全国の仲間と競い合った経験を「なかなかできない貴重な体験」と振り返り、後輩にも伝えていきたいと語っている。", "生徒は20日に八丈島を出発し、21日の競技後に徳島県へ移動。22日の大会式典に参加した後、船の欠航により東京で予定外の1泊を余儀なくされたが、23日の航空便で無事帰島した。", "日本学校農業クラブは、全国の農業高校や農業系学科で学ぶ高校生の組織。農業の発展や地域社会への貢献を目指し、研究成果の発表や専門技術を競う大会を開いている。来年度の全国大会は滋賀県などで開かれる「びわ湖・近畿大会」となる。"], "sources": [{"label": "八丈高校", "url": "https://www.metro.ed.jp/hachijo-h/news/2026/11/vol.html"}], "label": "教育", "audience": "島民", "thread_id": "t20261123-308", "id": "3e5a54", "photo": {"type": "img", "src": "/img/kiji/3e5a54.jpg?v=6aea60", "og": "/img/kiji/3e5a54-og.jpg?v=6aea60", "s": "/img/kiji/3e5a54-s.jpg?v=6aea60", "m": "/img/kiji/3e5a54-m.jpg?v=6aea60", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-2.jpg"}, "edited": "2026-11-23T17:16:26+09:00"}, {"headline": "議会改革2年、基本条例持ち越し", "body": ["八丈町が20日に公表した第三回定例会の会議録によると、町議会の議会改革特別委員会は9月4日、約2年間の調査を終えて最終報告を行った。議会資料の電子化や一般質問方式の見直しなどを実現した一方、当初の主要課題だった議会基本条例の制定には至らなかった。真田幸久委員長は、次期議会に新たな「議会制度調査特別委員会」を設置し、改革を継続するよう提言した。", "委員会は2024年9月、住民に開かれた議会の構築と政策機能の強化を目的に設置された。議会基本条例の制定は、前任の奥山幸子議長も目指していた。2022年11月には、当時の山本忠志議長が議会基本条例の制定と議員研修の充実を議会運営委員会に諮問し、その後の改革議論につながった。", "成果の一つは議会資料の電子化。導入費用は当初計画の約990万円から約157万円に抑えられ、2025年6月には紙資料からタブレットへの完全移行を実現した。一般質問では一問一答方式や町長らの反問権を試験導入し、今年10月から正式な運用を始めた。", "一方、議会基本条例については制定の必要性そのものを今後判断するとしており、結論を持ち越した。一般質問以外を含む議会全体のライブ配信も、費用と視聴需要の兼ね合いから導入を見送った。委員会は審議内容の迅速な公開、住民との意見交換を担う広報広聴委員会の設置、議会モニター制度や夜間・休日議会の検討などを今後の課題に挙げた。", "政策機能の強化では、議員間討論の充実や各種行政計画を議決対象に加えることの検討、委員会による政策提言の推進を求めた。議会事務局が1人欠員となっていることも指摘し、政策立案を支える専門人材の確保や、議員報酬・政務活動費のあり方について検討を促した。", "委員会は10月の議員任期満了をもって役割を終えた。最終報告では、より広範な制度改革を扱う新たな特別委員会の設置と、災害時にも議会機能を維持する議会BCP(業務継続計画)の策定を次期議会に提言した。提言が実現するかは今後の判断に委ねられている。"], "sources": [{"label": "八丈町議会", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/11/18135731/%EF%BC%91%E5%8F%B7-R8.9.4.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20261123-309", "id": "4c34e8", "photo": {"type": "img", "src": "/img/kiji/4c34e8.jpg?v=70dca9", "og": "/img/kiji/4c34e8-og.jpg?v=70dca9", "s": "/img/kiji/4c34e8-s.jpg?v=70dca9", "m": "/img/kiji/4c34e8-m.jpg?v=70dca9", "caption": "八丈町役場", "credit": "", "file": "own/yakuba-12.jpg"}, "edited": "2026-11-23T16:24:24+09:00"}, {"headline": "三原小かんも掘り、収穫増", "body": ["八丈町立三原小学校の児童が「かんも掘り」を行った。今年は、台風の影響を受けた前年より多く収穫できたという。", "「かんも」は八丈島でサツマイモを指す言葉。島では江戸時代にサツマイモが広まり、食料が不足する時期を支える作物として暮らしに根づいてきた。現在も学校や地域の畑で栽培され、島の食文化を学ぶ題材になっている。", "前年の被災を経て収穫量が戻ったことを、児童自身が畑で実感する機会になった。"], "sources": [{"label": "三原小", "url": "https://mihara-es.8jo.ed.jp/n/n856b235b8c2d"}, {"label": "八丈島観光協会", "url": "https://ameblo.jp/team8jo/entry-11984182596.html"}], "label": "教育", "audience": "島民", "thread_id": "t20261123-307", "id": "7bd615", "photo": {"type": "img", "src": "/img/kiji/7bd615.jpg?v=573b80", "og": "/img/kiji/7bd615-og.jpg?v=573b80", "s": "/img/kiji/7bd615-s.jpg?v=573b80", "m": "/img/kiji/7bd615-m.jpg?v=573b80", "caption": "八丈町立三原中学校", "credit": "", "file": "own/mihara-chu-10.jpg"}}, {"headline": "家政科の第2回体験授業を終える", "body": ["都立八丈高校家政科は21日、第2回の体験授業を開いた。島内の中学生4人が参加し、被服分野の実習でオリジナルのサコッシュを作った。", "参加者は好みの生地やアクセサリーを選び、家政科の生徒に教わりながら自分の作品を完成させた。体験授業は、授業公開日の園芸科・家政科の企画として行われ、中学生が入学後の実習を実際に試せる機会になっている。", "今年度に予定した家政科の体験授業は今回で終了。今後、学科の見学を希望する人には個別に対応する。問い合わせは八丈高校(04996-2-1181)。"], "sources": [{"label": "八丈高校", "url": "https://www.metro.ed.jp/hachijo-h/news/2026/11/2_11.html"}], "label": "教育", "audience": "島民", "thread_id": "t20261102-24", "followup": true, "id": "0fec2d", "photo": {"type": "img", "src": "/img/kiji/0fec2d.jpg?v=3ebb69", "og": "/img/kiji/0fec2d-og.jpg?v=3ebb69", "s": "/img/kiji/0fec2d-s.jpg?v=3ebb69", "m": "/img/kiji/0fec2d-m.jpg?v=3ebb69", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-1.jpg"}}], "agenda": [{"date": "2026-11-23", "end": null, "text": "おもちゃであそぼう(八丈町)", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261005-2/"}, {"date": "2026-11-24", "end": null, "text": "大賀郷小学校150周年テニピン教室", "url": "https://okago-es.8jo.ed.jp/n/nd953a4de67f8"}, {"date": "2026-11-25", "end": null, "text": "ザトウクジラ調査報告会", "url": "https://x.com/Go_Hachijo_JP/status/2123252603979174351"}, {"date": "2026-11-26", "end": null, "text": "大賀郷小学校の持久走記録会", "url": "https://okago-es.8jo.ed.jp/n/n40c128d3393e"}, {"date": "2026-11-28", "end": null, "text": "食育セミナー(包丁研ぎ・地産地消)", "url": "https://x.com/hachijomachi/status/2117134618420023736"}, {"date": "2026-11-29", "end": null, "text": "中井貴惠さんの読み聞かせの会", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261101-3/"}, {"date": "2026-11-29", "end": null, "text": "大型絵本と朗読の公演(入場無料)", "url": "https://x.com/funarin8jo/status/2117595434747400488"}, {"date": "2026-11-29", "end": "2026-11-30", "text": "こころの健康づくり講演会", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261116/"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "議事録に残った質問", "body": ["会議の終わりに「何となく、うまくいかない気がする」と誰かが言う。理由を尋ねても答えが出ない。そこで「根拠がないなら次へ」と進めれば早いが、最後の疑問は置き去りになる。", "[嫌な予感](https://note.com/chock/n/n471894a6f576)は、それだけで結論にはならない。だからこそ聞き手は、正しいかどうかを即座に判定する代わりに、何が気になったか尋ねてみる。「数字が途中で変わった気がする」「前の案件で似た説明を聞いた」。断片なら、あとから調べられる。", "調べて何もなければ、それでいい。分からない感覚へ権威を与えるより、確かめられることを探すほうが、本人にも周囲にも役立つ。反対に、小さな疑問から本当に不足していた条件が見つかることもある。", "議事録に「不安あり」と書くより、「費用の算定根拠を確認」と書く。一人の感覚が、会議全体の仕事へ変わる瞬間である。"]}, "kyoku": {"artist": "ゆらゆら帝国", "title": "昆虫ロック", "text": "奇妙に跳ねるリズムが、小さな生き物のせわしない動きを思わせます。人間には虫の足音は聞こえませんが、拡大したら案外騒がしいのかもしれません。地面に近づけば、人間から見て小さな世界にも、忙しい生活が続いている。しゃがみ込んで目線を少し下げるだけで、普段の道がまったく違う景色になります。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/4b/5b/31/     ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
 
 
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const MEDAL={"🥇":1,"🥈":2,"🥉":3};
const rankMark = m => MEDAL[m]?`<i class="r${MEDAL[m]}" aria-label="${MEDAL[m]}位">${MEDAL[m]}</i>`:`<i class="r0" aria-hidden="true"></i>`;
 
function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section class="ran" id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h"><a href="/government/members/">町議会議員</a></h2>
    <ol class="giin ichi">${g.map(r=>{const nm=`${rankMark(r.medal)}<b>${esc(r.name)}</b>`;
      return `<li>${r.slug?`<a class="n" href="/government/members/${esc(r.slug)}/">${nm}</a>`:`<span class="n">${nm}</span>`}${r.at?`<a class="ps" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.name+" "+(r.kind?r.kind+" ":"")+(r.what||""))}"><time>${esc(r.when)}</time><q>${r.hs||""}</q></a>`:""}</li>`;}).join("")}</ol><p class="more"><a href="/government/assembly/">議員・議会</a><a href="/government/members/">全員の一覧</a></p></section>`;
}
 
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
 
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u), sora=soraRow(e.sora), ev=evLines(e).slice(0,8);
  const diff=n=>n==null?"":`<small>(${n>0?"+":n<0?"−":"±"}${Math.abs(n).toLocaleString()})</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const st=e.sora&&e.sora.at?ymd(e.sora.at.slice(0,10)):null, sh=e.sora&&e.sora.at?hm(e.sora.at):"";
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
 
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section class="ran" id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h"><a href="/song/">きょうの一曲</a></h2>
    <div class="kk">${a?`<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.img)}" alt="${esc(a.album||k.title)}のジャケット" width="96" height="96" loading="lazy"></a>`:""}
      <div><h3>${k.day?`<a class="hl" href="${esc(k.day)}song/">${esc(k.title)}</a>`:esc(k.title)}</h3><p class="who">${esc(k.artist)}</p></div></div>
    <p class="txt">${esc(k.text)}</p>
    <p class="kiku"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTubeで聴く</a>${a&&a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Apple Musicで聴く</a>`:""}</p></section>`;
}
 
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){
  if(!c) return "";
  return `<section class="ran" id="tayori" aria-labelledby="tayori-h"><h2 class="band" id="tayori-h"><a href="/column/">${esc(c.name||"島のたより")}</a></h2>
    ${c.title?`<h3>${c.day?`<a class="hl" href="${esc(c.day)}column/">${esc(c.title)}</a>`:esc(c.title)}</h3>`:""}<div class="honbun">${(c.body||[]).map(t=>`<p>${mdLink(t)}</p>`).join("")}</div></section>`;
}

function render(e){
  e={...e}; if(!e.top&&e.side.length){e.top=e.side[0]; e.side=e.side.slice(1);}
  if(!e.top&&e.shorts.length){e.top=e.shorts[0]; e.shorts=e.shorts.slice(1);}
  
  document.title = /^\/\d{4}\/\d{2}\/\d{2}\//.test(location.pathname) ? `八丈島新聞 ${hiduke(e.date)}` : "八丈島新聞";

  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top" id="a1">
      <div class="hd">${lbl(e.top)}<h2>${hl(e,e.top)}</h2></div>
      ${figure(e.top.photo)}
      <div class="honbun">${paras(e.top.body)}</div>${src(e.top.sources)}
    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];
      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>
      ${s.id?`<p class="ld">${esc(b[0])}</p>`:`<div class="honbun">${paras(b)}</div>${src(s.sources)}`}
    </article>`;}).join("")}</div>`:""}`:""}
    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}
    ${e.ronten?`<section class="ran men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="ran tv" aria-label="FM八丈島テレビ"><div class="head"><h2 class="band onair"><a href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><i aria-hidden="true"></i>ON AIR</a></h2><a class="chl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div><div class="tvw"><iframe src="https://tv.hachijojima.jp/embed.html" title="FM八丈島テレビ" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></div></section>
      ${(e.ichimen_week||[]).length?`<section class="ran" id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h"><a href="/archive/">今週の一面</a></h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><a href="${esc(w.url)}"><time datetime="${esc(w.date)}">${tsuki(w.date)}</time>${esc(w.headlines[0])}</a></li>`).join("")}</ol>
      </section>`:""}
      ${giinSection(e)}
      ${kyokuSection(e.kyoku&&{...e.kyoku,day:DAY(e)})}
      ${shimaSection(e)}
    </aside>
  </div>

  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
}

  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><h1 class="daiji"><a href="/"><img src="/logo-maru.png" alt="" width="192" height="192">八丈島新聞</a></h1><details class="menu"><summary aria-label="メニュー"><span></span><span></span><span></span></summary><nav aria-label="ページ"><form class="ms" action="/archive/" role="search"><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"><button>検索</button></form><ul class="sg" hidden></ul><div><a href="/">最新号</a><a href="/archive/">バックナンバー</a><a href="/features/">特集</a></div><div><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><a href="/column/">島のたより</a></div><div><a href="/song/">きょうの一曲</a><a class="tvl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener" title="FM八丈島テレビ"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div></nav></details></div><nav class="nb" aria-label="ページ"><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><div class="nbs"><form class="ms" action="/archive/" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"></form><ul class="sg" hidden></ul></div><button class="nbq" type="button" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg></button></nav></header>

}

const EMB = document.getElementById("edition").textContent.trim();
if (EMB.startsWith("{")) render(JSON.parse(EMB)); else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
