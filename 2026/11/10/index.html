te": "現地海上・港内状況不良のため"}, {"island": "青ヶ島", "direction": "青ヶ島行き", "time": "09:30", "place": "八丈島発", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}, {"island": "青ヶ島", "direction": "青ヶ島発", "time": "12:50", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}]}, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "あさぬま、来年から日曜休業", "body": ["大賀郷のスーパーあさぬまは2027年1月から、毎週日曜日を定休日にする。同店が9日に知らせた。12月は6日が休み、毎週定休日となる最初の日曜日は1月3日になる。", "同店は2024年9月から、働き方改革の取り組みとして従業員の休みを確保するため、月に1回、日曜日に店を休んできた。始めた当初は8月と12月を除くとしていたが、12月は2024年から毎年休んでいる。ことしは8月23日、10月18日、11月8日も休業日だった。月に1回だった日曜の休みが、毎週になる。", "休業日のある週は、ふだん金・土・日曜日に出す週末特売のチラシを、木曜日から土曜日の日程に繰り上げてきた。休業日の前日には、買い置きを呼びかけてきた。", "同店の末吉店は、2025年5月の時点で日・月・木曜日を休みにして営業していた。2025年10月の台風22号のあと営業再開が未定となり、2026年3月に閉店した。八丈島観光協会によると、三根の八丈ストアは木曜日と元日が定休日。", "同店は「お客様には大変ご不便をおかけいたしますが、何卒ご理解を賜りますようお願い申し上げます」とし、週末に来島する観光客にも不便をわびている。"], "figure": null, "sources": [{"label": "スーパーあさぬま", "url": "https://x.com/umikaze8jo/status/2119724275573870839"}], "label": "くらし", "audience": "両方", "thread_id": "t20261110-60", "id": "e538ec", "photo": {"type": "img", "src": "/img/kiji/e538ec.jpg?v=441a5a", "og": "/img/kiji/e538ec-og.jpg?v=441a5a", "s": "/img/kiji/e538ec-s.jpg?v=441a5a", "m": "/img/kiji/e538ec-m.jpg?v=441a5a", "caption": "スーパーあさぬま", "credit": "", "file": "own/asanuma-4.jpg"}, "edited": "2026-11-10T21:25:22+09:00"}, "side": [], "shorts": [{"headline": "町営住宅の入居募集、16日まで", "body": ["八丈町は9日から、町営住宅の入居者募集（令和8年度第4回）の受付を始めた。受付は16日までで、郵送は期間内必着。町が案内した。", "抽選会は18日13時から、町役場1階相談室4で行う。当選者には、あとから入居の説明がある。", "応募できるのは、住宅に困っている世帯。島内外に持ち家がないこと、税金・保険料・使用料の滞納がないこと、暴力団員でないことも条件になる。世帯の月額所得の基準は15万8000円。中学校卒業前までの子がいる世帯は25万9000円、高齢者世帯と若年夫婦世帯は21万4000円。", "必要な書類は、世帯全員の住民票（続柄・世帯主を省略しないもの）、世帯全員の最新の課税（非課税）証明書、印鑑。住民票と課税証明書は原本が必要で、コピーは受け付けない。転入して間もない人は勤務先の収入見込証明、島外から離職して来た人は退職日の証明も要る。障害のある世帯員がいれば手帳の写し、生活保護を受けていれば受給証明書も出す。", "申込書は、町のページから「町営住宅入居者募集（R8年度第4回）」のPDFで入手できる。問い合わせは建設課建設係（電話 04996-2-1124）。広報はちじょう2026年1月号によると、町は令和7年度第5回の募集でも、受付期間と抽選会の日程を案内した。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261109/"}, {"label": "広報はちじょう 2026年1月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/22181235/hachijo2601.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20261110-56", "id": "ce88d1", "photo": {"type": "img", "src": "/img/kiji/ce88d1.jpg?v=4a0112", "og": "/img/kiji/ce88d1-og.jpg?v=4a0112", "s": "/img/kiji/ce88d1-s.jpg?v=4a0112", "m": "/img/kiji/ce88d1-m.jpg?v=4a0112", "caption": "八丈町営住宅", "credit": "", "file": "own/chouei-jutaku-1.jpg"}}, {"headline": "町の観光アプリ、新規DL停止", "body": ["八丈町は1日から、公式観光アプリの新規ダウンロードを当面の間できなくしている。町は9日にお知らせのページを更新した。終了時期は示されていない。", "町によると、アプリを使い続けるには大がかりな改修が要るようになり、提供元と調整しているという。すでにインストールしている人は、引き続き利用できる。今回の停止は、プログラミング言語の脆弱性をめぐる問題とは無関係だと町は記している。", "問い合わせは町企画財政課DX推進係（電話04996-2-1120）。町役場の代表番号は04996-2-1121で、受付は8時30分から17時15分。土日祝日と12月29日〜1月3日は休み。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261109-2/"}], "label": "町政", "audience": "両方", "thread_id": "t20261110-57", "id": "3d88eb", "photo": {"type": "img", "src": "/img/kiji/3d88eb.jpg?v=c76a39", "og": "/img/kiji/3d88eb-og.jpg?v=c76a39", "s": "/img/kiji/3d88eb-s.jpg?v=c76a39", "m": "/img/kiji/3d88eb-m.jpg?v=c76a39", "caption": "八丈町役場・八丈町多目的ホール おじゃれ", "credit": "", "file": "own/yakuba-8.jpg"}}, {"headline": "藍ヶ江漁港の通行止め解除", "body": ["八丈町は、藍ヶ江漁港で続けていた車両通行止めを解除した。高波の影響を受けて安全確保のため通行を止めていた区間で、状況を確認したうえで再開した。"], "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2119588852910215345"}], "label": "くらし", "audience": "両方", "thread_id": "t20261103-28", "followup": true, "id": "32a52e", "photo": {"type": "img", "src": "/img/kiji/32a52e.jpg?v=75ff6b", "og": "/img/kiji/32a52e-og.jpg?v=75ff6b", "s": "/img/kiji/32a52e-s.jpg?v=75ff6b", "m": "/img/kiji/32a52e-m.jpg?v=75ff6b", "caption": "藍ヶ江漁港", "credit": "", "file": "own/aigae-gyoko-4.jpg" function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;

const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
