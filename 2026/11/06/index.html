id": "t20261026-3", "followup": true, "edited": "2026-11-06T08:41:59+09:00", "id": "44d450", "photo": {"type": "img", "src": "/img/kiji/44d450.jpg?v=2efec8", "og": "/img/kiji/44d450-og.jpg?v=2efec8", "s": "/img/kiji/44d450-s.jpg?v=2efec8", "m": "/img/kiji/44d450-m.jpg?v=2efec8", "caption": "八丈島・優婆夷宝明神社の社殿", "credit": "", "file": "ac/24824871.jpg"}}, {"headline": "あしたば加工工場の一部商品休止", "body": ["八丈島の「あしたば加工工場」は、2025年10月の台風被災から1年を迎えたが、元の工場の再開時期はなお決まっていない。一部商品の製造・販売を休止しながら、別拠点で営業を続けている。", "同工場は台風22号・23号で被害を受けた後、三根の拠点「結ノ葉」などを使って活動を継続。手元の在庫や限られた設備を使いながら、催事への出店や新しい明日葉商品の開発も進めてきた。", "「元通り」になるのを待つのではなく、営業を続けながら再建する状態が長期化している。休止商品の再開は設備の復旧状況を見ながら判断する。"], "sources": [{"label": "あしたば加工工場", "url": "https://x.com/ashitabaya8jo/status/2118141742818238956"}], "label": "産業", "audience": "両方", "thread_id": "t20261106-43", "id": "f83412", "photo": {"type": "img", "src": "/img/kiji/f83412.jpg?v=09f9e1", "og": "/img/kiji/f83412-og.jpg?v=09f9e1", "s": "/img/kiji/f83412-s.jpg?v=09f9e1", "m": "/img/kiji/f83412-m.jpg?v=09f9e1", "caption": "明日葉", "credit": "", "file": "ac/4086596.jpg"}}, {"headline": "生徒がショメ節を創作、大賀郷中", "body": ["八丈町立大賀郷中学校の2年生が、島言葉を使って八丈島の民謡「ショメ節」の歌詞をつくった。島言葉辞典を引きながら、七・七・七・五の調子に言葉を組み合わせた。", "ショメ節は八丈島を代表する民謡の一つで、東京都の無形民俗文化財に指定されている。八丈語はユネスコが消滅の危機にある言語として挙げており、学校や地域で継承の取り組みが続く。", "辞書で意味を覚えるだけでなく、今も踊りや行事で使われる民謡の歌詞を自分たちでつくることで、島言葉を「使う」学習につなげた。"], "sources": [{"label": "大賀郷中", "url": "https://okago-jhs.8jo.ed.jp/n/ncbd49c792d9b"}, {"label": "広報はちじょう 2025年2月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114354/hachijo2502.pdf"}, {"label": "東京都教育委員会", "url": "https://www.kyoiku.metro.tokyo.lg.jp/about/hatijyou/cultural_property"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/kanko-bunka/bunka-rekishi/hachijo-hougen/shimakotoba/"}], "label": "教育", "audience": "島民", "thread_id": "t20261028-10", "followup": true, "id": "24e58e", "photo": {"type": "img", "src": "/img/kiji/24e58e.jpg?v=d53855", "og": "/img/kiji/24e58e-og.jpg?v=d53 function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}

}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
