:30", "place": "八丈島発", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}, {"island": "青ヶ島", "direction": "青ヶ島発", "time": "13:30", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}]}, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "ビジネスジェットで海外5社来島", "body": ["八丈町によると、ビジネスジェットで八丈島を訪れた海外旅行会社のエージェントが、お魚捌きや島ずし作りなどを体験した。次の目的地は伊豆大島という。", "東京都によると、このファムトリップは1日から12日まで。富山県、八丈島、大島、佐賀県をめぐる広域周遊で、招かれたエージェントは欧州2社、北米2社、アジア1社の5名。移動は金浦国際空港（韓国）、富山空港、八丈島空港、大島空港、九州佐賀国際空港の間をビジネスジェットで行う。協力はエアロトヨタ株式会社。", "八丈島での内容として、黄八丈の着付け体験と酒造見学等が発表されている。今年度は地方国際空港を持つ富山県、佐賀県と連携する。富山県・佐賀県・東京の島しょ地域を結ぶ広域周遊モデルコースを検証する。海外富裕層向けの旅行商品づくりにつなげるのが目的。", "都は令和5年度から、富裕層向け旅行商品を扱う海外エージェントを八丈島に招き、モデルツアーを続けている。前年の2025年度は9月5日から9日に八丈島と大島で実施した。海外旅行会社エージェント9名と海外インフルエンサー1名を招いた。問い合わせ先は東京都総務局行政部振興課（電話 03-5388-2444）。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2118559028414734462"}, {"label": "東京都", "url": "https://www.metro.tokyo.lg.jp/information/press/2026/10/2026101525"}], "label": "産業", "audience": "両方", "thread_id": "t20261107-49", "id": "bfb2ca", "edited": "2026-11-07T07:06:33+09:00", "photo": {"type": "img", "src": "/img/kiji/bfb2ca.jpg?v=bfcb06", "og": "/img/kiji/bfb2ca-og.jpg?v=bfcb06", "s": "/img/kiji/bfb2ca-s.jpg?v=bfcb06", "m": "/img/kiji/bfb2ca-m.jpg?v=bfcb06", "caption": "八丈島 八丈島空港", "credit": "", "file": "ac/27920122.jpg"}}, "side": [], "shorts": [{"headline": "支庁100周年 風景の島民投票", "body": ["八丈支庁が100周年記念の島民投票「100年後に残したい八丈島・青ヶ島の風景」を開いている。支庁職員が八丈島と青ヶ島から3作品ずつ選び、島民の投票で大賞を決める。大賞は八丈支庁展示ホールに大型パネルとして展示される。", "八丈町によると、候補の写真は八丈支庁展示ホールに掲示している。"], "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2118244451738927393"}, {"label": "八丈町", "url": "https://x.com/hachijomachi/status/2118613933691187537"}], "label": "文化", "audience": "両方", "thread_id": "t20261107-48", "id": "9d59cc", "edited": "2026-11-07T19:58:09+09:00", "photo": {"type": "img", "src": "/img/kiji/9d59cc.jpg?v=50753b", "og": "/img/kiji/9d59cc-og.jpg?v=50753b", "s": "/img/kiji/9d59cc-s.jpg?v=50753b", "m": "/img/kiji/9d59cc-m.jpg?v=50753b", "caption": "東京都八丈支庁", "credit": "", "file": "own/shicho-1.jpg"}}, {"headline": "徳里山のキンモクセイ満開", "body": ["徳里山のキンモクセイが6日、満開を迎えたと八丈植物公園・八丈ビジターセンターが伝えた。", "今年は開花が例年より半月以上遅れ、センターでも「咲かないのでは」と心配していたという。小さな橙色の花がまとまって咲き、周囲には甘い香りが広がっている。", "見頃や園内の場所はビジターセンターに問い合わせる。"], "sources": [{"label": "八丈ビジターセンター", "url": "https://www.tokyo-park.or.jp/park/hachijo/news/info/2026/hachijo_info_203.html"}], "label": "文化", "audience": "両方", "thread_id": "t20261107-46", "id": "ef2568", "photo": {"type": "img", "src": "/img/kiji/ef2568.jpg?v=990439", "og": "/img/kiji/ef2568-og.jpg?v=990439", "s": "/img/kiji/ef2568-s.jpg?v=990439", "m": "/img/kiji/ef2568-m.jpg?v=990439", "caption": "キンモクセイの花 アップ写真", "credit": "", "file": "ac/35448651.jpg"}}, {"headline": "三根会が8日、島でよさろー", "body": ["三根地区にゆかりのある人でつくる「三根会」は8日、八丈島で交流会「島でよさろー」を開く。島内外の会員や関係者が集まり、故郷とのつながりを深める。", "三根会は1982年に発足。三根小・富士中の卒業生だけでなく、三根に縁のある人が参加し、島外にも会員の輪を広げてきた。「島でよさろー」は島側で開く交流企画で、2023年に第1回が行われた。", "今回は2回目。島外で暮らす出身者と現在島で暮らす人をつなぐ機会になる。"], "sources": [{"label": "八丈島三根会", "url": "http://mitsunekai.sakura.ne.jp/n2schedule.html"}], "label": "文化", "audience": "両方", "thread_id": "t20261107-45", "id": "e490ca", "photo": {"type": "img", "src": "/img/kiji/e490ca.jpg?v=826797", "og": "/img/kiji/e490ca-og.jpg?v=826797", "s": "/img/kiji/e490ca-s.jpg?v=826797", "m": "/img/kiji/e490ca-m.jpg?v=826797", "caption": "三根小学校の体育館", "credit": "", "file": "own/mitsune-sho-taiikukan-1.jpg"}}, {"headline": "八丈島ロードレース、受付終了", "body": ["八丈島観光協会は、第46回八丈島パブリックロードレースのエントリーを、定員に達したため締め切った。大会は2027年1月10日に開く。受付は10月1日に始まっていた。", "同協会によると、募集定員はレース参加者850名、懇親会参加者700名で、先着順だった。種目はハーフ（21.0975km）、10km、3km。今大会からコースが変わった。開会式とスタート・ゴールの会場、大会本部は東京都立八丈高等学校に置く。主催は八丈島パブリックロードレース実行委員会。", "参加費は一般男女が全種目6,500円。中学生・高校生はハーフ3,500円、10kmと3kmが3,000円。小学生は3kmのみで2,000円。参加者には大会オリジナルTシャツと町営温泉の入浴チケットが付き、島料理の大懇親会がある。問い合わせは同協会、電話04996-2-1377。", "広報はちじょう2025年 function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
