s": "---", "note": ""}, {"island": "青ヶ島", "direction": "青ヶ島発", "time": "12:50", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}]}, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "三根小と大賀郷小、3日に運動会", "body": ["八丈町立三根小学校と大賀郷小学校は3日、それぞれ運動会を開く。大賀郷小は創立150周年記念の大運動会で、8時30分に始まる。", "大賀郷小によると、校庭が狭く駐車場が少ないことを案内している。体育館は昼食場所として開放する。三根小は保護者に来場を呼びかけ、プログラムをPDFで公開している。三根小は2日、4・5・6年生が会場準備を手伝い、低学年、中学年、高学年の順にリハーサルをした。", "大賀郷小では、児童と教職員の手形が入った150周年の横断幕が完成した。生活委員会が考えて制作し、運動会のほか、学芸会、開校記念フェスティバルで掲示する。広報はちじょう2026年6月号によると、同校は今年度、創立150周年を迎える。"], "sources": [{"label": "大賀郷小", "url": "https://okago-es.8jo.ed.jp/n/n85b18c64280d"}, {"label": "三根小", "url": "https://mitsune-es.8jo.ed.jp/n/n9a393a91dbf4"}, {"label": "広報はちじょう 2026年6月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/05/27202107/hachijo2606.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20261031-21", "followup": true, "id": "e7b7e9", "edited": "2026-11-03T20:02:49+09:00", "photo": {"type": "img", "src": "/img/kiji/e7b7e9.jpg?v=db0591", "og": "/img/kiji/e7b7e9-og.jpg?v=db0591", "s": "/img/kiji/e7b7e9-s.jpg?v=db0591", "m": "/img/kiji/e7b7e9-m.jpg?v=db0591", "caption": "八丈町立三根小学校", "credit": "", "file": "own/mitsune-sho-4.jpg"}}, "side": [], "shorts": [{"headline": "ロベ茂る農地、サツマイモ畑へ", "body": ["大賀郷で、ロベが高さ4.5mほどに育ち、しばらく耕作されていない農地がある。新しく農業を始める人がこの農地を借り、畑に戻す計画を、町農業委員会が8月25日の総会で承認した。町が公開した議事録で分かった。", "事務局の説明によると、農地を借りるのは認定新規就農者で、農地中間管理機構を通して利用権の設定を受ける。計画では、権利の取得後に「未来に残す東京の農地プロジェクト」の再生事業を活用する。事業が終わったら、サツマイモを栽培するという。", "総会に先立つ8月18日、大賀郷地域の推進委員が事務局や農業委員と現地を確かめた。4.5mほどのロベが並んでいたと総会で報告した。", "総会は町役場大会議室で開かれ、委員13人が出席した。この計画への質疑はなく、異議なしの声が多数で承認された。"], "sources": [{"label": "八丈町", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/15140245/R080825.pdf"}], "label": "産業", "audience": "島民", "thread_id": "t20261103-34", "edited": "2026-11-03T17:03:34+09:00", "id": "90f1fd", "photo": {"type": "img", "src": "/img/kiji/90f1fd.jpg?v=1eaa61", "og": "/img/kiji/90f1fd-og.jpg?v=1eaa61", "s": "/img/kiji/90f1fd-s.jpg?v=1eaa61", "m": "/img/kiji/90f1fd-m.jpg?v=1eaa61", "caption": "フェニックスロベレニー", "credit": "", "file": "ac/27447099.jpg"}}, {"headline": "藍ヶ江漁港が車両通行止め", "body": ["中之郷の藍ヶ江漁港が2日、波が高く危険なため車両通行止めとなった。東京都 島しょによると、港に近づくと危険なため、歩行者も立ち入れない。", "通行止めの解除の目処は、2日の時点で未定とされた。"], "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2117145221829996912"}], "label": "くらし", "audience": "両方", "thread_id": "t20261103-28", "id": "9092bc", "photo": {"type": "img", "src": "/img/kiji/9092bc.jpg?v=828c62", "og": "/img/kiji/9092bc-og.jpg?v=828c62", "s": "/img/kiji/9092bc-s.jpg?v=828c62", "m": "/img/kiji/9092bc-m.jpg?v=828c62", "caption": "藍ヶ江漁港", "credit": "", "file": "own/aigae-gyoko-2.jpg"}}, {"headline": "発酵中フェス、来場1,090人", "body": ["八丈町によると、1日に大賀郷の町役場多目的ホール「おじゃれ」で発酵中フェス2026が開かれた。来場者数は合計1,090人だった。", "フェスは10時から17時まで開き、入場は無料だった。町が主催し、東京七島酒造組合八丈島支部と八丈島水産加工業協同組合が共催した。島焼酎は4つの蔵元が杯売りをし、当日限定の4蔵ブレンド焼酎も売った。くさやは島内の加工場が集まり、食べ比べや新しい食べ方の提案をした。ステージではトークライブと検定クイズを行った。VR体験と焼酎診断アプリ「I♡焼酎診断」もあった。八丈島歴史民俗資料館の学芸員によるパネル展示「出張はちれき」もあった。", "エンケルとハレによると、会場でくさや液由来の乳酸菌と明日葉由来の乳酸菌でつくったヨーグルトドリンク「くさヨ」を売った。売り切れはしなかったという。買った人からは、いつから売るのか、どこで買えるのかと尋ねる声があったという。", "八丈町議会は9月7日に「2杯目は八丈島焼酎にしようを推進する条例」を可決し、条例は1日に施行された。フェスは施行日に合わせた初めての開催だった。広報はちじょう2026年10月号によると、島焼酎とくさやを中心に食を楽しむ体験イベントとして開くとしていた。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2117171577704087915"}, {"label": "エンケルとハレ", "url": "https://x.com/enkel_to_hare/status/2117117900482039965"}, {"label": "広報はちじょう 2026年10月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf"}], "label": "文化", "audience": "両方", "thread_id": "t20261030-15", "followup": true, "id": "7ee3f6", "photo": {"type": "img", "src": "/img/kiji/7ee3f6.jpg?v=df4759", "og": "/img/kiji/7ee3f6-og.jpg?v=df4759", "s": "/img/kiji/7ee3f6-s.jpg?v=df4759", "m": "/img/kij うした遠回りが、見慣れた通りをたまに知らない道へ変える。", "見えないものに気づいて、見えるものを探しに戻る。いつもの道を歩いているだけなのに、そんな小さな探検が起きる。花の咲く家を覚えたら、翌日もつい同じ道を選んでしまう。住人は誰かも知らないのに、通行人の暦をひそかに引き受けている木がある。", "喫茶店に寄り、温かいりんごの紅茶を飲んだ。湯気にシナモンの香りが混じる。街では甘い匂いが一つから別の一つへ移り、帰りには何を探していたのか少し曖昧になった。それでも、翌年またあの角で足が止まれば、木の場所は思い出せるはずだ。"]}, "kyoku": {"artist": "MONO NO AWARE", "title": "異邦人", "text": "MONO NO AWAREの4thアルバム『行列のできる方舟』に収められた「異邦人」。知らない土地にいる人だけが異邦人なのではなく、よく知っている場所でふと自分だけがずれたように感じる瞬間もあります。居場所は住所だけでは決まらない。馴染んだ景色ほど、ときどきこちらを他人にします。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/5f/e1/4c/5fe14c31-8e89-1f33-b3ef-305aaacd8e72/4538182956229_cov.jpg/300x300bb.jpg", "album": "行列のできる方舟", "url": "https://music.apple.com/jp/album/%E7%95%B0%E9%82%A6%E4%BA%BA/1565889558?i=1565889562&uo=4"}}, "ronten": null, "weekly": [], "ichimen_week": [{"date": "2026-11-02", "url": "/2026/11/02/16ecab/", "headlines": ["八丈高校、16日から授業公開"]}, {"date": "2026-11-01", "url": "/2026/11/01/64395a/", "headlines": ["発酵中フェス、役場で開催"]}, {"date": "2026-10-31", "url": "/2026/10/31/e7f9db/", "headlines": ["JA八丈島、7年度は黒字に"]}, {"date": "2026-10-30", "url": "/2026/10/30/4ce2d9/", "headlines": ["橘丸、修理終え東京へ回航"]}, {"date": "2026-10-29", "url": "/2026/10/29/d20c8f/", "headlines": ["東海汽船が改善計画の進捗を報告"]}, {"date": "2026-10-28", "url": "/2026/10/28/1881b6/", "headlines": ["さるびあ丸、28日朝着の便が欠航"]}, {"date": "2026-10-27", "url": "/2026/10/27/2b621d/", "headlines": ["橘丸、28日出渠を目指す"]}], "population": {"as_of": "2026-10-01", "people": 6499, "people_diff": -24, "households": 4028, "households_diff": -21, "url": "https://www.town.hachijo.tokyo.jp/", "ido": {"in": 6, "birth": 2, "out": 19, "death": 10}}, "giin": [{"name": "伊藤奨", "slug": "ito-sho", "at": "2026-11-02T23:55:07+09:00", "url": "https://note.com/itosho_hachijo/n/n972e1afd6a58", "what": "活動報告の開始", "kind": "活動", "duty": true, "when": "きのう", "day": "2026-11-02", "pt": 2, "medal": "🥇", "hs": "<span class=\"hs ten2\">活動 活動報告の開始<\/span>"}, {"name": "佐々木丈", "slug": "sasaki-takeshi", "at": "2026-11-02T10:22:27+09:00", "url" function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}

}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
