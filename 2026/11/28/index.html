//www2.njss.info/offers/view/33802173"}, {"fact": "入札参加者は間仁田建設の1者のみ。入札額は税抜10億円（税込11億円）", "url": "https://bid.const-ai.com/tokyo/?id=228&p=project"}, {"fact": "2025年11月7日の知事会見で、TBSの記者が次の点を指摘した。末吉第二住宅は2019年に土砂災害特別警戒区域に指定され、出張所は2022年・2023年に大規模改修を要求していた。教育庁福利厚生部は、新住宅の建設がコロナ禍と入札不調で遅れ、来年度の着工を目指していると説明していた。知事は、新築を進めてきたが不調が続き遅れていると認めた", "url": "https://www.metro.tokyo.lg.jp/governor/kishakaiken/2025/11/07"}, {"fact": "間仁田建設は2026年5月28日、教育庁が発注した東京都教職員八丈（大賀郷第三）住宅（8）外壁その他改修工事を税込1億5,510万円で落札した", "url": "https://www.nikoukei.co.jp/bid_result/detail/013638050"}], "figure": {"type": "place", "name": "八丈町大賀郷（西見）"}, "sources": [{"label": "東京都議会", "url": "https://www.gikai.metro.tokyo.lg.jp/bill/reg2026-4.html"}, {"label": "東京都 入札結果", "url": "https://bid.const-ai.com/tokyo/?id=228&p=project"}, {"label": "NJSS 入札案件 東京都教職員八丈（西見）住宅（仮称）（8）新築工事その2", "url": "https://www2.njss.info/offers/view/33802173"}, {"label": "東京都 小池知事記者会見", "url": "https://www.metro.tokyo.lg.jp/governor/kishakaiken/2025/11/07"}, {"label": "TBS NEWS DIG（Yahoo!ニュース配信）「八丈島・土石流被害の教職員住宅は『土砂災害特別警戒区域』指定も都は入居者に説明せず」", "url": "https://news.yahoo.co.jp/articles/8487ac6ffb1014c5d8b867141c38234d0009f955"}, {"label": "日刊建設工業経済新聞 入札結果 東京都教職員八丈（大賀郷第三）住宅（8）外壁その他改修工事", "url": "https://www.nikoukei.co.jp/bid_result/detail/013638050"}], "label": "町政", "audience": "島民", "thread_id": "t20261128-409", "id": "d165a4", "photo": {"type": "img", "src": "/img/kiji/d165a4.jpg?v=baa772", "og": "/img/kiji/d165a4-og.jpg?v=baa772", "s": "/img/kiji/d165a4-s.jpg?v=baa772", "m": "/img/kiji/d165a4-m.jpg?v=baa772", "caption": "八丈島の大賀郷と樫立を結ぶ大坂トンネル", "credit": "", "file": "ac/24702422.jpg"}}, "side": [], "shorts": [{"headline": "島民の東京発片道、2等6,500円", "body": ["東海汽船は28日の出発分から、島しょに住む人に限って東京発の大型客船の片道運賃を割り引く「島民特別割引 片道きっぷ」を設定した。27日に公表した料金表によると、東京―八丈島の大人は2等和室6,500円、特2等10,500円、1等13,300円。11月の通常運賃より約4割安い。対象は2027年1月31日の出発分まで。", "東海汽船の運賃表によると、11月の東京―八丈島の通常運賃（大人片道、燃料油価格変動調整金込み）は、2等11,620円、特2等17,430円、1等23,240円。片道きっぷはこれより、それぞれ5,120円、6,930円、9,940円安い。島民がふだん使う島しょ在住者割引は、大型客船の割引率が7月1日乗船分から40%から35%に下がった。この割引率を11月の運賃に当てはめると、2等は約7,550円になり、片道きっぷはそれより約1,050円安い（本紙計算）。特2等では約830円、1等では約1,810円の差になる。通常運賃は月ごとに定められるため、12月・1月出発分の差額は変わる場合がある。", "東海汽船は6日から「島民特別割引 往復きっぷ」も扱っている。島から船で東京へ出て船で戻る往復が対象で、八丈島は往復とも2等で13,000円、有効期間は最長7日間。今回の片道きっぷの2等6,500円は、この往復きっぷの半額と同じ水準になる。空路で上京して船で帰る人や、滞在が7日を超える人も、帰りの船だけを同じ水準で買える。片道きっぷは特別プランのため、ほかの割引とは併用できない。東京都人材支援事業団が発行する運賃割引券は使える。", "東海汽船は案内のチラシで、島の住民をはじめ多くの利用者に迷惑をかけたとわびた。そのうえで、アルコール基準の見直しを含めて安全管理体制とコンプライアンス体制を強化し、サービスの改善にも取り組むとしている。国土交通省関東運輸局は10月2日、酒気帯びでの航海当直などを理由に、橘丸など3隻について、9日から28日まで20日間の使用停止を命じていた。割引を設定した理由や費用の負担者、改善計画との関係は、公表資料には示されていない。", "利用するには、発券時に現住所を確認できる本人確認書類が必要になる。予約は出発日の2か月前の同じ日から前日まで受け付け、窓口は東海汽船お客様センター（03-5472-9999）。高速ジェット船は対象外。子どもの料金は大人の半額で、子どもだけでは予約できない。"], "added": [{"fact": "八丈島区間の料金は大人2等6,500円、特2等10,500円、1等13,300円（子ども3,250円、5,250円、6,650円）。ほかの割引とは併用できない（東京都人材支援事業団の割引券は使える）。八丈島航路には適用除外日がない。チラシには、迷惑をかけたことへのおわびと、アルコール基準の見直しを含む安全管理強化の方針が載っている", "url": "https://www.tokaikisen.co.jp/wordpress/wp-content/uploads/2026/11/90c54fa9aba0ed6832eab8737743b3da.pdf"}, {"fact": "2026年11月の東京―八丈島の通常運賃（大人片道、燃料油価格変動調整金込み）は、2等11,620円、特2等17,430円、1等23,240円", "url": "https://www.tokaikisen.co.jp/boarding/fare/"}, {"fact": "島しょ在住者割引の割引率は、2026年7月1日乗船分から大型客船で40%→35%、高速ジェット船で35%→30%に下がった。運賃改定に伴う2年間の暫定的な引き上げが終わったため", "url": "https://www.tokaikisen.co.jp/news/769035/"}, {"fact": "関東運輸局は10月2日、酒気帯びでの航海当直などの違反を理由に、橘丸・セブンアイランド結・セブンアイランド友の使用停止を命じた（10月9日〜28日）", "url": "https://www.mlit.go.jp/report/press/content/002025375.pdf"}, {"fact": "【デスク向け・本文不採用】2018年4月11日の国土交通大臣答弁にある「八丈島は昨年9月から離島住民向け割引運賃を引下げ」は、松原仁委員による航空運賃の質問への答弁で、船の運賃のことではない。船の島民割引の財源の根拠にはならないため、本文には使っていない", "url": "https://kokkai.ndl.go.jp/api/speech?issueID=119604319X00820180411&speechNumber=102&recordPacking=json"}], "sources": [{"label": "東海汽船", "url": "https://www.tokaikisen.co.jp/news/850416/"}, {"label": "国会会議録", "url": "https://kokkai.ndl.go.jp/txt/119604319X00820180411/103"}, {"label": "東海汽船「島民特別割引 片道きっぷ」チラシ", "url": "https://www.tokaikisen.co.jp/wordpress/wp-content/uploads/2026/11/90c54fa9aba0ed6832eab8737743b3da.pdf"}, {"label": "東海汽船 運賃表", "url": "https://www.tokaikisen.co.jp/boarding/fare/"}, {"label": "東海汽船「島しょ在住者割引 割引率改定について」", "url": "https://www.tokaikisen.co.jp/news/769035/"}, {"label": "東海汽船「島民特別割引 往復きっぷ」", "url": "https://www.tokaikisen.co.jp/news/840711/"}, {"label": "国土交通省関東運輸局 行政処分の発表", "url": "https://www.mlit.go.jp/report/press/content/002025375.pdf"}], "label": "くらし", "audience": "島民", "thread_id": "t20261128-410", "followup": true, "id": "e8b601", "photo": {"type": "img", "src": "/img/kiji/e8b601.jpg?v=5bbf34", "og": "/img/kiji/e8b601-og.jpg?v=5bbf34", "s": "/img/kiji/e8b601-s.jpg?v=5bbf34", "m": "/img/kiji/e8b601-m.jpg?v=5bbf34", "caption": "橘丸 八丈島 八重根港", "credit": "", "file": "ac/34194382.jpg"}, "edited": "2026-11-28T08:26:19+09:00"}, {"headline": "読みきかせ、1・2便欠航なら中止", "body": ["八丈島文化協会は27日夜、Xで告知を出した。29日13時から八丈町多目的ホール「おじゃれ」で開く「中井貴惠with大人と子供のための読みきかせの会in八丈島」は、28日のANA羽田―八丈島線の1便と2便が欠航した場合、公演を中止する。その場合は絵本紹介コーナーの展示だけを12時から14時まで開く。", "28日は天候による欠航のおそれがある。ANAは27日17時40分、八丈島空港は強風のため28日は条件付きの運航となる可能性があるとXで知らせた。海の便では、東海汽船の27日夜竹芝発（28日朝八丈島着）の便が「現地港湾状況不良」で欠航し、折り返しの上り便も欠航となった。", "中止の条件に挙げたのは朝の1便と昼の2便で、夕方の3便は含まれていない。中止を決める時刻と、決まったことを知らせる方法は告知に示されていない。町の案内では、問い合わせ先は町教育課生涯学習係（04996-2-7071）となっている。", "公演は八丈島あそびと文化のNPOあびの実が主催し、文化協会が共催、町教育委員会が後援する。入場は無料で、事前の申し込みはいらない。開場は12時30分で、定員は400人。あびの実によると、演目は「おおきなかぶ」と「おかあちゃんがつくったる」。同時に開く絵本紹介コーナーは町役場内の八丈町民ギャラリーが会場で、絵本専門士の西條真由美さんが担当する。予定では開演前の12時からと、終演後から16時まで開く。あびの実の公演としては108回目になり、本紙は11月8日号で予告した。"], "added": [{"fact": "ANAは27日17時40分、八丈島空港は強風のため28日は条件付き運航となる可能性があると告知した", "url": "https://x.com/ANA_flight_info/status/2126234572111442101"}, {"fact": "東海汽船の27日夜竹芝発（28日朝八丈島着）の橘丸は「現地港湾状況不良」で欠航し、28日の八丈島発の上り便も欠航した（28日3時39分時点）", "url": "https://www.tokaikisen.co.jp/schedule/"}, {"fact": "絵本紹介コーナーは町役場内の八丈町民ギャラリーで絵本専門士の西條真由美さんが担当する。予定は開演前の12時からと終演後から16時まで。演目は「おおきなかぶ」「おかあちゃんがつくったる」", "url": "https://abinomi.sakura.ne.jp/kansyo.html"}, {"fact": "町の案内では、主催はNPOあびの実、共催は八丈島文化協会、後援は町教育委員会。定員400人、事前申し込み不要で、問い合わせ先は町教育課生涯学習係（04996-2-7071）。中止条件は書かれていない", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261101-3/"}, {"fact": "八丈島乳業の中止告知は削蹄見学会にしか触れておらず、7日に案内した餌やり体験の扱いは書かれていない", "url": "https://x.com/milk8jo/status/2125536752123428937"}], "sources": [{"label": "八丈島乳業", "url": "https://x.com/milk8jo/status/2125536752123428937"}, {"label": "八丈島文化協会", "url": "https://x.com/8jobunka/status/2126275236387815794"}, {"label": "ANA運航情報", "url": "https://x.com/ANA_flight_info/status/2126234572111442101"}, {"label": "東海汽船 運航状況", "url": "https://www.tokaikisen.co.jp/schedule/"}, {"label": "八丈町 お知らせ", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261101-3/"}, {"label": "八丈島あそびと文化のNPOあびの実", "url": "https://abinomi.sakura.ne.jp/kansyo.html"}], "label": "くらし", "audience": "両方", "thread_id": "t20261128-411", "followup": true, "id": "bc786b", "photo": {"type": "img", "src": "/img/kiji/bc786b.jpg?v=83c20c", "og": "/img/kiji/bc786b-og.jpg?v=83c20c", "s": "/img/kiji/bc786b-s.jpg?v=83c20c", "m": "/img/kiji/bc786b-m.jpg?v=83c20c", "caption": "八丈町役場・八丈町多目的ホール おじゃれ", "credit": "", "file": "own/yakuba-3.jpg"}, "edited": "2026-11-28T08:26:19+09:00"}, {"headline": "八重根防波堤改良に鋼枠1億円", "body": ["東京都港湾局が8月26日に開札した「八重根漁港（1）防波堤（改良）鋼枠製作」は、6社が同額で入札し、くじ引きの結果、五栄土木が1億99万円（税込み）で落札した。都は今年度から6年間で20億円余りをかけ、八重根漁港の防波堤をかさ上げする計画を立てている。鋼枠はその防波堤を改良する名目で発注された。", "開札結果によると、契約の内容は長さ5.0m、幅2.5m、高さ5.7mの鋼枠ブロック10函（3段）と、上部連結材20基の製作・輸送だ。予定価格は1億1,299万円で、落札率は89.4%だった。10社が参加し、五栄土木、高田機工、エム・エムブリッジ、楢崎製作所、巴コーポレーション、三井住友建設鉄構エンジニアリングの6社が税抜き9,181万円の同額で並んだ。残る4社の入札額は示されていない。引き渡し場所は江東区海の森三丁目で、工期は2027年3月3日まで。鋼枠は本土で造って都内で引き渡す契約で、島での据え付けは含まない。据え付けの時期は開札結果にも都の公表資料にも示されていない。", "水産庁が4月8日に公表した事前評価書によると、都は八重根漁港で令和8〜13年度（2026〜31年度）に事業費20億6,200万円の改良事業を計画している。柱は（1）防波堤170mのかさ上げと堤体の拡幅で、事業費は11億8,467万円。護岸83m（7億9,782万円）と道路179m（8,000万円）の改良も含む。八重根漁港は、八丈島のほかの港の漁船や周辺で操業する船が逃げ込む避難港の役割を持つ第4種漁港だ。評価書は、荒天時には防波堤を越えた波で港内に安全に停泊できず、周辺の漁船の多くが島陰での錨泊を余儀なくされていると課題を挙げる。改良後の防波堤は、津波にも「粘り強い構造」にするという。費用便益比は1.22としている。", "護岸の改良は、八重根漁港を母港とする青ヶ島航路の定期船のためだ。評価書は、荒天時には岸壁の背後から波が越えて接岸できず、定期船が東京港へ避難している現状を記す。くろしお丸の就航率は2014〜24年の平均で63.0%だった。整備後は欠航が年22日減ると見積もっている。", "防波堤の改良は前年度から動いている。港湾局は2025年8月、（1）防波堤の延長35m分の基本設計・実施設計をセンク21に891万円で発注した。1月には、港外側の洗掘（波で海底が削られること）を防ぐ工事を浅沼組に7,928万円で発注した。この工事では消波ブロック82個の製作・据え付けなどを行い、工期は10月16日までだった。東京都八丈支庁が5月にまとめた令和8年度の事業説明資料も、八重根漁港の（1）防波堤の改良工事と消波ブロックの製作・据え付けを今年度の事業に挙げている。"], "added": [{"fact": "八重根漁港の鋼枠製作には10社が参加し、6社が同額（税抜き9,181万円）で並んでくじ引きで落札者が決まった。契約は長さ5.0m・幅2.5m・高さ5.7mの鋼枠ブロック10函と上部連結材20基の製作・輸送で、引き渡し場所は江東区海の森三丁目、工期は2027年3月3日まで", "url": "https://bid.const-ai.com/tokyo/?id=349&p=project"}, {"fact": "水産庁の事前評価書（2026年4月8日公表）によると、都は八重根漁港で令和8〜13年度に事業費20億6,200万円の改良を計画している。（1）防波堤170mのかさ上げ・拡幅（11億8,467万円）、護岸83m、道路179mが対象。荒天時に越波で港内に停泊できず、周辺の漁船の多くが島陰での錨泊を余儀なくされている。費用便益比は1.22", "url": "https://www.jfa.maff.go.jp/j/gyosei/assess/hyouka/attach/pdf/r7_260408_1-13.pdf"}, {"fact": "同評価書によると、青ヶ島航路の定期船は荒天時に岸壁を越える波で接岸できず、東京港へ避難している。くろしお丸の就航率は63.0%（2014〜24年平均）で、整備後は欠航が年22日減ると見積もっている", "url": "https://www.jfa.maff.go.jp/j/gyosei/assess/hyouka/attach/pdf/r7_260408_1-13.pdf"}, {"fact": "評価書の公表日は2026年4月8日（令和7年度水産関係公共事業の評価検討結果）", "url": "https://www.jfa.maff.go.jp/j/gyosei/assess/hyouka/koukyou_index.html"}, {"fact": "港湾局は2025年8月に（1）防波堤35m分の基本設計・実施設計をセンク21に891万円で発注していた", "url": "https://bid.const-ai.com/tokyo/?id=8674&p=project"}, {"fact": "港湾局は2026年1月に、港外側の洗掘防止工事（消波ブロック82個など、工期10月16日まで）を浅沼組に7,928万円で発注していた", "url": "https://bid.const-ai.com/tokyo/?id=6154&p=project"}, {"fact": "空港の場周柵改修は、柵144mを保安強化型に取り替え、照明基礎の補修と侵入防止柵3枚の設置を行う。参加は7社で、入札額が分かるのは赤間建設だけ", "url": "https://bid.const-ai.com/tokyo/?id=780&p=project"}, {"fact": "空港の場周柵は、2025年8月に34m分（八生建設、690万円）、2026年2月に「復旧」の名目で66m分（赤間建設、1,283万円、予定価格と同額）が発注されていた", "url": "https://bid.const-ai.com/tokyo/?id=5522&p=project"}, {"fact": "2025年8月発注の場周柵34m分（八生建設、690万円）の開札結果", "url": "https://bid.const-ai.com/tokyo/?id=8453&p=project"}, {"fact": "都の令和8年度事業説明資料は、こん沢林道で台風22号の被害箇所を復旧する工事を予定に挙げている。空港の場周柵取り替えは保安機能の強化、八重根漁港は（1）防波堤の改良と消波の製作・据え付けが事業内容。自然公園施設の整備は大賀郷園地の便所改修だけを挙げている", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/hachijosetsumeikai2026"}, {"fact": "西見の電線共同溝設計は総合評価方式で決まり、最も安い札を入れたのは和建設計事務所だった", "url": "https://bid.const-ai.com/tokyo/?id=950&p=project"}, {"fact": "西見・八重根の延長2,100mの電線共同溝予備設計（その2）を9月18日の開札でテクニカルエイトが1,128万円で落札した", "url": "https://bid.const-ai.com/tokyo/?id=9490&p=project"}, {"fact": "こん沢林道の延長160mの測量設計委託を8月27日の開札でつ建が1,371万円で落札した", "url": "https://bid.const-ai.com/tokyo/?id=695&p=project"}], "sources": [{"label": "東京都", "url": "https://bid.const-ai.com/tokyo/?id=349&p=project"}, {"label": "東京都（開札結果）こん沢林道改良工事", "url": "https://bid.const-ai.com/tokyo/?id=781&p=project"}, {"label": "水産庁 事前評価書 八重根地区", "url": "https://www.jfa.maff.go.jp/j/gyosei/assess/hyouka/attach/pdf/r7_260408_1-13.pdf"}, {"label": "東京都八丈支庁 令和8年度東京都事業説明資料", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/hachijosetsumeikai2026"}], "label": "町政", "audience": "島民", "thread_id": "t20261128-412", "id": "0e31af", "photo": {"type": "img", "src": "/img/kiji/0e31af.jpg?v=ce3773", "og": "/img/kiji/0e31af-og.jpg?v=ce3773", "s": "/img/kiji/0e31af-s.jpg?v=ce3773", "m": "/img/kiji/0e31af-m.jpg?v=ce3773", "caption": "八丈富士から望む八重根港", "credit": "", "file": "ac/34534916.jpg"}, "edited": "2026-11-28T08:26:19+09:00"}, {"headline": "八丈高定時制、1500mで都2位", "body": ["都立八丈高等学校定時制の総合トレーニング部の生徒が21日、駒沢オリンピック公園陸上競技場で開かれた第64回東京都高等学校定時制通信制総合体育大会陸上競技大会の男子1500mで2位に入った。同校が大会当日に伝えた。", "同校からは2人が1500mに出場した。学校によると、2人は大会に向けて放課後も残って練習していた。東京陸上競技協会のサイトに載った公式記録によると、男子1500mは決勝1本だけで行われ、13人が完走した。", "2027年度入学生向けの学校案内によると、総合トレーニング部は同校定時制にある5つの部活動の一つで、ほかは天文部、自然愛好部、芸術部、学習部である。"], "added": [{"fact": "男子1500mの公式記録では、八丈の3年生は5分07秒56で2位、優勝者は5分05秒87だった。16人が申し込み、3人が欠場して13人が完走した。八丈のもう1人の4年生は5分54秒14で10位だった", "url": "https://gold.jaic.org/jaic/member/tokyo/2026r/1121koma/rel014.html"}, {"fact": "全国定通陸上の東京都代表を決める選考会は6月14日に駒沢で開かれ、全国大会は8月15、16日に夢の島競技場で行われた。11月の大会は全国予選ではない", "url": "https://toriku.or.jp/competition/"}, {"fact": "6月の選考会の男子1500m（12人完走、1位は4分32秒79）の結果に八丈の名前はない", "url": "https://gold.jaic.org/jaic/member/tokyo/202 function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}

  document.title=fix(document.title);
}
