note": "運休日"}, {"island": "青ヶ島", "direction": "青ヶ島発", "time": "", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": "運休日"}]}, "sora": {"status": "条件付きの可能性", "reason": "強風", "url": "https://x.com/ANA_flight_info/status/2121522271873335393", "at": "2026-11-14T17:35:00+09:00"}, "number": null, "top": {"headline": "台風ごみ13%、完了28年3月", "body": ["昨年10月の台風第22号・第23号で発生した災害廃棄物について、八丈町は処理完了の目標を当初の今年12月末から2028年3月末に延期している。町が9月に公表した処理実行計画の第3版によると、8月末時点で約1万7600トンの処理対象のうち、処理を終えたのは約2300トン、全体の13%にとどまる。遅れていた廃木材などの破砕・選別施設は、今月の本格稼働を予定している。", "町によると、海況悪化に伴う船舶の積載制限などで島外への輸送量が計画を下回ったほか、倒木などを選別・破砕する二次仮置場の整備が遅れた。施設整備の入札不調や設計変更も重なり、当初6月に予定していた本格稼働は11月にずれ込んだ。公費解体も所有者との連絡や書類審査に時間を要している。", "廃木材の島外搬出は1月に定期貨物船で始まり、5月にはチャーター船も投入された。廃木材は東京港を経由して江東区のリサイクル施設へ運び、木質ボードなどに再資源化する。7月末までの廃木材の島外処理実績は605トン。枝葉などの可燃性廃棄物についても、7月末から東京23区の清掃工場への搬入を開始した。", "町は処理の迅速化に向け、島内施設の活用拡大や輸送計画の見直しを進める。片付けごみは年内、公費解体に伴う廃棄物は来年6月末までの処理を目指し、倒木や枝葉などの処理完了は2028年3月末を見込んでいる。"], "sources": [{"label": "八丈町 災害廃棄物等処理実行計画", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260902-3/"}, {"label": "八丈町 概要版PDF", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/09/09083426/haikibutsu_summary_version2.pdf"}, {"label": "東京都環境局", "url": "https://www.metro.tokyo.lg.jp/information/press/2026/05/2026052106"}], "label": "くらし", "audience": "島民", "thread_id": "t20261115-145", "id": "78475d", "edited": "2026-11-15T07:16:33+09:00", "photo": {"type": "img", "src": "/img/kiji/78475d.jpg?v=91fb1b", "og": "/img/kiji/78475d-og.jpg?v=91fb1b", "s": "/img/kiji/78475d-s.jpg?v=91fb1b", "m": "/img/kiji/78475d-m.jpg?v=91fb1b", "caption": "八丈島の港", "credit": "", "file": "ac/34512705.jpg"}}, "side": [], "shorts": [{"headline": "三根小体育館で福祉バザー", "body": ["八丈町社会福祉協議会の福祉バザーが15日、9時から11時まで三根小学校体育館で開かれる。売り物はすべて島の人から寄付された品で、売り上げは社協の移送サービスと給食サービスの事業費に充てる。寄付の品の受付は10月末で締め切った。", "社協によると、移送サービスは車いすの人の通院や老人ホームのショートステイへの送り迎えを手伝う事業。給食サービスは一人暮らしの高齢者や障害のある人に毎週水曜の昼の弁当を届け、安否も確かめている。バザーは例年11月中旬に開いている。", "運営は住民の手伝いで成り立っている。社協は、前日の準備から当日の販売、片付けまで延べ200人以上が協力していると説明する。2023年は、締め切り間際に集まった寄付の品を婦人会が仕分けした。今年のおもちゃ・ベビーコーナーは八丈島あそびと文化のNPOあびの実が受け持ち、体育館の一番奥の左側に置く。", "バザーは新型コロナの影響で中止が続き、2023年11月に久しぶりに開かれた。あびの実によると、昨年は開かれなかったため、今年は品物が多いという。"], "sources": [{"label": "八丈町社会福祉協議会", "url": "https://8jo-syakyo.or.jp/jigyo/chiiki/bazaar/"}, {"label": "あびの実", "url": "https://x.com/abinomi8jo/status/2121457803990827246"}, {"label": "しゃきょう 2023年10月号", "url": "https://8jo-syakyo.or.jp/wp/wp-content/uploads/2023/11/f774843041935c02a9db2c6096e6b014.pdf"}, {"label": "しゃきょう 2023年12月号", "url": "https://8jo-syakyo.or.jp/wp/wp-content/uploads/2024/06/35c780b68444054b48c68eb2cf2d0091.pdf"}], "label": "くらし", "audience": "両方", "thread_id": "t20261115-141", "id": "1dc703", "photo": {"type": "img", "src": "/img/kiji/1dc703.jpg?v=826797", "og": "/img/kiji/1dc703-og.jpg?v=826797", "s": "/img/kiji/1dc703-s.jpg?v=826797", "m": "/img/kiji/1dc703-m.jpg?v=826797", "caption": "三根小学校の体育館", "credit": "", "file": "own/mitsune-sho-taiikukan-1.jpg"}, "edited": "2026-11-15T16:57:23+09:00"}, {"headline": "富士中2年がムロアジ調理", "body": ["八丈町立富士中学校の2年生が家庭科で、八丈島のムロアジを使った調理実習に取り組んだ。町の産業・観光関係者や漁業に関わる人から、魚の扱い方や島の水産業について学びながら調理した。", "ムロアジは八丈島の代表的な加工品「くさや」の主な原料でもある。一方、近年は漁獲量の減少が課題となっており、島の食文化と漁業をどうつなぐかが身近なテーマになっている。", "自分たちで魚をさばいて食べる授業を通じ、食材だけでなく、それを取る仕事や加工文化まで学ぶ機会になった。"], "sources": [{"label": "富士中", "url": "https://fuji-jhs.8jo.ed.jp/n/na33da891d9f5"}], "label": "教育", "audience": "島民", "thread_id": "t20261115-142", "id": "b97328", "photo": {"type": "img", "src": "/img/kiji/b97328.jpg?v=d7357e", "og": "/img/kiji/b97328-og.jpg?v=d7357e", "s": "/img/kiji/b97328-s.jpg?v=d7357e", "m": "/img/kiji/b97328-m.jpg?v=d7357e", "caption": "ムロアジのくさや", "credit": "", "file": "ac/26719199.jpg"}}, {"headline": "ウインドアンサンブルが部員募集", "body": ["八丈町立三根小学校のウインドアンサンブルが13日朝、3年生の新入部員を募る発表をした。フルート、サックス、クラリネット、トロンボーン、チューバ、打楽器などを紹介し、「ひょっこりひょうたん島」を演奏した。司会進行も子どもたちが担当した。", "学校は10日、楽器紹介でチューバが「ぞうさん」を演奏すると伝え、チューバの部員が増えることを期待していた。11日には発表に向けた練習があり、児童が一つの場面の難しさを感想に書いた。", "学校によると、基礎合奏の練習について、児童は音のキープとロングトーンが難しいと書いた。3年生が入ってくるので良い手本になりたいとも記した。"], "sources": [{"label": "三根小", "url": "https://mitsune-es.8jo.ed.jp/n/nde62005506b6"}], "label": "教育", "audience": "島民", "thread_id": "t20261115-146", "id": "cdf897", "photo": {"type": "img", "src": "/img/kiji/cdf897.jpg?v=858ef4", "og": "/img/kiji/cdf897-og.jpg?v=858ef4", "s": "/img/kiji/cdf897-s.jpg?v=858ef4", "m": "/img/kiji/cdf897-m.jpg?v=858ef4", "caption": "八丈町立三根小学校", "credit": "", "file": "own/mitsune-sho-7.jpg"}}, {"headline": "大賀郷小、昔の学校を聞く集会", "body": ["八丈町立大賀郷小学校で13日、創立150周年を記念した児童集会が開かれた。用務主事から昔の学校生活を聞き、当時は1クラスに約50人の児童がいたことや、遊びの様子を学んだ。", "大賀郷小の創立は1877(明治10)年3月31日。島の学校として約150年続く時間を、年表ではなく実際の学校生活の記憶からたどる企画になった。紹介された「こま回し鬼ごっこ」と「馬跳び」には代表児童も挑戦した。", "計画委員会が企画し、児童からは昔の子どものバランス感覚に驚く声が出た。周年を、学校の歴史を自分たちの生活と比べて考える機会にしている。"], "sources": [{"label": "大賀郷小", "url": "https://okago-es.8jo.ed.jp/n/n0c4b44fd0566"}, {"label": "広報はちじょう 2026年6月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/05/27202107/hachijo2606.pdf"}, {"label": "東京都教育委員会", "url": "https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/2026-03-09-094538-378"}], "label": "教育", "audience": "島民", "thread_id": "t20261028-34", "followup": true, "id": "769591", "photo": {"type": "img", "src": "/img/kiji/769591.jpg?v=d2d4af", "og": "/img/kiji/769591-og.jpg?v=d2d4af", "s": "/img/kiji/769591-s.jpg?v=d2d4af", "m": "/img/kiji/769591-m.jpg?v=d2d4af", "caption": "八丈町立大賀郷小学校", "credit": "", "file": "own/okago-sho-2.jpg"}}], "agenda": [{"date": "2026-11-15", "end": null, "text": "ペット防災と条例のセミナー", "url": "https://x.com/8jo_shimaneko/status/2118885207029973452"}, {"date": "2026-11-15", "end": null, "text": "ニャンサミット2026", "url": "https://x.com/8jo_shimaneko/status/2118884312254935229"}, {"date": "2026-11-15", "end": null, "text": "あびの実の福祉バザー", "url": "https://x.com/abinomi8jo/status/2121457803990827246"}, {"date": "2026-11-17", "end": "2026-11-18", "text": "八丈町商工会の税務講習会", "url": "https://x.com/hachisho8/status/2115315856439992492"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "夜のガジュマルの根", "body": ["懐中電灯を木へ向けると、枝から細い紐のような根が下がっている。昼間は葉や幹にまぎれていたものが、暗い時間には長い影を落とす。見慣れた木も、光の当て方で別の姿になる。", "[ガジュマルの気根](https://note.com/hachijojima/n/n8cb8d8b5aaa2)は、空中で止まった雨の筋のようにも見える。根は地面から伸びるものだと思っていると、枝から垂れるその姿に少し戸惑う。木がこちらの常識と違う順序で体を支えていることを、懐中電灯の光が教えてくれる。", "植物を眺めるとき、立派な花や大きな枝に目が向きがちだ。しかし生き延びるための工夫は、根や葉の裏側にも現れている。目立たない部分こそ、その場所の湿り気や光を受け止めている。明るい昼の写真に写る木と、夜の光で浮かぶ根が、同じ一本の植物だというのも面白い。", "暗い場所で木を見るなら、足元と周囲に注意して無理をしないこと。遠くから照らした枝の影だけでも、十分に不思議な景色だ。"]}, "kyoku": {"artist": "My Bloody Valentine", "title": "When You Sleep", "text": "My Bloody Valentineの音は、ギターの輪郭を溶かし、歌声まで一つの霞にしてしまいます。『When You Sleep』では、甘いメロディーが轟音の中から浮かび上がる。眠っている人には、こちらの声がどこまで届くのでしょうか。誰かを近くに感じていても、夢の中へはついていけません。その距離が、柔らかい音の壁になっているようです。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/4c/e1/51/4ce15131-7ac5-daf5-bf62-0202f27d691d/887830015998.png/300x300bb.jpg", "album": "loveless", "url": "https://music.apple.com/jp/album/when-you-sleep/1556921230?i=1556921235&uo=4"}}, "ronten": null, "weekly": [{"date": "2026-11-09", "headline": "秋の火災予防運動、9日から15日", "url": "/2026/11/09/"}, {"date": "2026-11-10", "headline": "スーパーあさぬま 毎週日曜定休へ", "url": "/2026/11/10/"}, {"date": "2026-11-11", "headline": "ムロアジ漁10月で終了、水揚量減", "url": "/2026/11/11/"}, {"date": "2026-11-12", "headline": "八丈島で菌類研究、国際学会で受賞", "url": "/2026/11/12/"}, {"date": "2026-11-13", "headline": "おさかな朝市、年内最後は12月5日", "url": "/2026/11/13/"}, {"date": "2026-11-14", "headline": "アイランダー2026に八丈島出展", "url": "/2026/11/14/"}], "ichimen_week": [{"date": "2026-11-14", "url": "/2026/11/14/bee383/", "headlines": ["アイランダー2026に八丈島出展"]}, {"date": "2026-11-13", "url": "/2026/11/13/1bf95c/", "headlines": ["おさかな朝市、年内最後12月5日"]}, {"date": "2026-11-12", "url": "/2026/11/12/46c97e/", "headlines": ["八丈島で菌類研究、国際学会で受賞"]}, {"date": "2026-11-11", "url": "/2026/11/11/d8fbed/", "headlines": ["ムロアジ漁10月で終了、水揚量減"]}, {"date": "2026-11-10", "url": "/2026/11/10/e538ec/", "headlines": ["あさぬま、来年から日曜休
