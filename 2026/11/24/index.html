licoさん、宿で朝食提供", "body": ["一棟貸しの宿「グリーンポスト八丈島」は23日、URUCRAFTWORKSのElico(漆原江理子)さんによる出張朝食サービスを始めた。初日は明日葉のポタージュや岩海苔のおにぎりなど、島の食材を取り入れた朝食を提供した。", "Elicoさんは2010年に八丈島へ移住。フラワーアレンジや木工、店舗ディスプレイ、インテリアなどの制作を続け、コロナ禍に始めたキッチンカーをきっかけに、お菓子、デリ、弁当など「食」の仕事も手がけるようになった。", "2025年の台風で自宅兼厨房やアトリエが被災し、2026年1月には火災で自宅兼厨房を失った。現在は、アトリエと食品製造・飲食スペースを備えた新拠点の整備を進めている。宿への朝食提供は、その再建の途中で続ける「食」の仕事と、島を訪れる人の滞在をつなぐ取り組みになる。"], "sources": [{"label": "グリーンポスト八丈島", "url": "https://x.com/8jo_greenpost/status/2124645011740672440"}, {"label": "URUCRAFTWORKS | Elico", "url": "https://for-good.net/project/1003804"}, {"label": "For Goodプロフィール", "url": "https://www.for-good.net/profile/297342"}], "label": "産業", "audience": "来島者", "thread_id": "t20261124-312", "id": "9b3ac7", "photo": {"type": "img", "src": "/img/kiji/9b3ac7.jpg?v=3963c0", "og": "/img/kiji/9b3ac7-og.jpg?v=3963c0", "s": "/img/kiji/9b3ac7-s.jpg?v=3963c0", "m": "/img/kiji/9b3ac7-m.jpg?v=3963c0", "caption": "明日葉", "credit": "", "file": "ac/4086583.jpg"}}, {"headline": "大賀郷小、12月1日にレモン教室", "body": ["大賀郷小学校は12月1日、創立150周年を記念して、5・6年生を対象にレモン教室を開く。講師はポッカサッポロフード&ビバレッジ株式会社の社員が務める。", "時間は午前10時40分から11時25分まで。場所は校舎3階の5年生教室。保護者や地域の人も自由に参観できる。大賀郷小学校が23日に案内した。", "内容は、レモンの歴史、世界の食文化の中のレモン、健康に役立つレモンの力。", "広報はちじょう2026年6月号によると、同校は今年度に創立150周年を迎える。同号は運動会、学芸会、記念フェスティバルの予定を紹介している。"], "sources": [{"label": "大賀郷小", "url": "https://okago-es.8jo.ed.jp/n/n2afded791bea"}, {"label": "広報はちじょう 2026年6月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/05/27202107/hachijo2606.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20261028-34", "followup": true, "id": "5072cf", "photo": {"type": "img", "src": "/img/kiji/5072cf.jpg?v=c9dbed", "og": "/img/kiji/5072cf-og.jpg?v=c9dbed", "s": "/img/kiji/5072cf-s.jpg?v=c9dbed", "m": "/img/kiji/5072cf-m.jpg?v=c9dbed", "caption": "八丈町立大賀郷小学校", "credit": "", "file": "own/okago-sho-3.jpg"}}, {"headline": "国産モリンガ 募集は24日まで", "body": ["株式会社モリンガルウィンは、八丈島などで育てる国産モリンガを商品化するクラウドファンディング「THE NIPPON MORINGA」を24日23時59分まで募っている。23日時点で支援額は532,660円、支援者52人、目標100万円に対する達成率は53%だった。", "同社は東京都渋谷区に本社を置き、八丈島にも栽培拠点を持つ。プロジェクトは国内で育てたモリンガの葉をパウダーとして商品化し、12月に届ける計画。集めた資金はブランドづくりと八丈島での栽培に使うとしている。", "八丈島産については、島の工芸品と組み合わせた限定版「THE TOKYO MORINGA」も用意する。伝統工芸品付き・シリアル番号入りの限定版は10点を予定し、2027年11月末までに届ける。通常の国産パウダーは30グラム入りで、商品を受け取らずに支援だけするコースもある。", "狙いは輸入原料を販売することではなく、日本で育て、加工し、産地の物語まで含めた国産ブランドをつくること。八丈島をモリンガの生産地として育てられるかを問う取り組みになる。"], "sources": [{"label": "For Good", "url": "https://for-good.net/project/1004582"}], "label": "産業", "audience": "島民", "thread_id": "t20261124-313", "id": "0ba932", "photo": {"type": "img", "src": "/img/kiji/0ba932.jpg?v=80dce4", "og": "/img/kiji/0ba932-og.jpg?v=80dce4", "s": "/img/kiji/0ba932-s.jpg?v=80dce4", "m": "/img/kiji/0ba932-m.jpg?v=80dce4", "caption": "渋谷 街並み", "credit": "", "file": "ac/35583022.jpg"}}], "agenda": [{"date": "2026-11-24", "end": null, "text": "大賀郷小学校150周年記念テニピン教室", "url": "https://okago-es.8jo.ed.jp/n/nd953a4de67f8"}, {"date": "2026-11-25", "end": null, "text": "ザトウクジラ調査報告会", "url": "https://x.com/Go_Hachijo_JP/status/2123252603979174351"}, {"date": "2026-11-26", "end": null, "text": "大賀郷小学校の持久走記録会", "url": "https://okago-es.8jo.ed.jp/n/n40c128d3393e"}, {"date": "2026-11-26", "end": null, "text": "八丈島テーマの島飲み会", "url": "https://visit-minato-city.tokyo/ja-jp/membernews/23"}, {"date": "2026-11-29", "end": null, "text": "中井貴恵さんの読み聞かせの会", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261101-3/"}, {"date": "2026-11-29", "end": "2026-11-30", "text": "こころの健康づくり講演会", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261116/"}, {"date": "2026-12-01", "end": null, "text": "三原小学校持久走大会の交通規制", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261102-01/"}, {"date": "2026-12-01", "end": null, "text": "大賀郷小学校創立150周年レモン教室", "url": "https://okago-es.8jo.ed.jp/n/n2afded791bea"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "つながって見える朝", "body": ["昨日までは無関係だと思っていた人や出来事が、ある朝、一本の線でつながったように感じることがある。仕事の話をしていたら、昔の友人の名前が出てきた。別々だった const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const srcName = l => String(l||"").replace(/(?:[(（][^()（）]*[)）])?[(（]X[)）]$/,"");   
const src = list => { const seen=new Set(), l=(list||[]).filter(s=>{const n=srcName(s.label); return !seen.has(n)&&seen.add(n);});   
  return l.length ? `<span class="src">出典 ${l.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(srcName(s.label))}</a>`).join("、")}</span>` : ""; };
 
const DAY = e => e.proof?"":`/${e.date.replace(/-/g,"/")}/`;   
const hl = (e,a) => a.id?`<a class="hl" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/">${esc(a.headline)}</a>`:esc(a.headline);
const GENRE={"町政": "government", "産業": "industry", "くらし": "life", "教育": "education", "文化": "culture"};   
const lbl = a => a.label?`<p class="kick">${GENRE[a.label]?`<a href="/${GENRE[a.label]}/">${esc(a.label)}</a>`:esc(a.label)}</p>`:"";   
const paras = b => (Array.isArray(b)?b:[b]).map(p=>`<p>${esc(p)}</p>`).join("");

function figure(f){
  if(!f) return "";
  const cap = `<figcaption>${esc(f.caption)}${f.credit?`(${esc(f.credit)})`:""}</figcaption>`;
  if(f.type==="svg") return `<figure class="zu-fig">${f.svg}${cap}</figure>`;
  if(f.type==="table") return `<figure class="zu-fig zu-tbl"><p class="zt-h">${esc(f.title)}</p><table>${f.rows.map(([k,v,w])=>`<tr><th>${esc(k)}</th><td class="${w?"warn":""}">${esc(v)}</td></tr>`).join("")}</table>${cap}</figure>`;
  return `<figure><div class="photo"><img src="${esc(f.src)}" alt="${esc(f.caption)}" loading="lazy"></div></figure>`;   
}
 
const thumb = (e,a) => { const f=a.photo; if(!f||f.type!=="img") return "";
  const img=`<img src="${esc(f.src)}"${f.m?` srcset="${esc(f.m)} 240w, ${esc(f.src)} 1200w" sizes="(min-width:1000px) 380px, 120px"`:""} alt="${esc(f.caption)}" width="1200" height="800" loading="lazy">`;
  return a.id?`<a class="kp" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/" tabindex="-1">${img}</a>`:`<span class="kp">${img}</span>`; };
 
function ichigyo(w){
  const d=(w.days||[])[0]||{}, t=String(d.hachijo??d.main??d.weather??"");
  const ten=tenOf(t);
  
  const o=w.obs, dir=o?(o.wind_dir.length===3?o.wind_dir[0]:o.wind_dir):"";
  const kaze=o?(dir==="静穏"?"静穏":esc(`${dir}風${Math.round(Number(o.wind))}m`)):"";
  return [ten,kaze,d.max!=null?`${esc(d.max)}<span class="deg">°C</span>`:""].filter(Boolean).join(" ");
}
 
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  くもり:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 7 18z"/></svg>',
  あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
 
 
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>

  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
