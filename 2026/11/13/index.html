tatus": "---", "note": ""}, {"island": "青ヶ島", "direction": "青ヶ島発", "time": "13:30", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}]}, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "おさかな朝市、年内最後12月5日", "body": ["八丈島漁業協同組合女性部が開く「おさかな朝市」は、11月の開催を休み、12月5日が今年最後となる。同女性部が案内した。朝市では島ずしやムロアジのメンチカツ、トビウオのすり身など、島の魚を使った料理や加工品を販売してきた。", "今年は4月18日、5月16日などに開催したが、6月は台風の影響を考慮して中止、8月も休みとなった。直近の10月24日は、加工場の人手が限られるため、用意できる数量での販売となった。船客待合所の厨房が急きょ使えなくなり、すり身汁の提供も見送った。", "朝市を担う女性部の「八丈産おさかな研究会」は2004年に発足。地元で獲れた魚を加工し、島内外の学校給食や飲食店などにも出荷している。東京都八丈支庁の今年1月の「水産だより」によると、八丈島産キハダを使った新商品の開発にも取り組むほか、小中学校で魚や島の暮らしを伝える出前授業も続けている。"], "figure": null, "sources": [{"label": "八丈島漁業協同組合女性部", "url": "https://x.com/8gyokyoujoseibu/status/2120775919275299272"}], "label": "産業", "audience": "両方", "thread_id": "t20261113-81", "id": "1bf95c", "photo": {"type": "img", "src": "/img/kiji/1bf95c.jpg?v=3ce853", "og": "/img/kiji/1bf95c-og.jpg?v=3ce853", "s": "/img/kiji/1bf95c-s.jpg?v=3ce853", "m": "/img/kiji/1bf95c-m.jpg?v=3ce853", "caption": "八丈島漁協女性部", "credit": "", "file": "own/gyokyo-joseibu-1.jpg"}, "edited": "2026-11-13T12:02:59+09:00"}, "side": [], "shorts": [{"headline": "台風被災企業の相談会 25日に", "body": ["東京都産業労働局は、台風第22号・第23号で被災した中小企業等向けの支援事業の相談会を、八丈支庁で開く。日程は25日、12月9日、12月23日。八丈島観光協会によると、時間は各回9時30分から16時まで。", "相談会は予約制で、事前に電話(03-5320-4744)で申し込む。問い合わせ先は同局商工部調整課で、番号は同じ。補助対象経費や支給額は、地域企業再建支援事業補助金のチラシ(11・12月分)で案内している。事業の完了期限と報告期限は、令和9年3月12日まで延長されている。今後の予定は改めて知らせるという。", "同局は2025年12月22日に大賀郷公民館で事業説明会を開き、2026年1月14日と15日に八丈支庁で相談会を開いた。5月から7月、9月(9日と30日)にも八丈支庁で開いている。"], "sources": [{"label": "八丈島観光協会", "url": "https://x.com/Go_Hachijo_JP/status/2117858916923220433"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261022-2/"}], "label": "産業", "audience": "島民", "thread_id": "t20261030-30", "followup": true, "id": "224085", "photo": {"type": "img", "src": "/img/kiji/224085.jpg?v=435fc5", "og": "/img/kiji/224085-og.jpg?v=435fc5", "s": "/img/kiji/224085-s.jpg?v=435fc5", "m": "/img/kiji/224085-m.jpg?v=435fc5", "caption": "東京都八丈支庁", "credit": "", "file": "own/shicho-3.jpg"}}, {"headline": "優婆夷宝明神社、きょう例祭式典", "body": ["優婆夷宝明神社は13日11時から、令和8年の例祭式典を行う。7日の神輿、8日の演芸・夜店・抽選会に続く、今年の例祭日程の締めくくりとなる。", "優婆夷宝明神社は八丈島の総社とされる。", "神社は10月23日に今年の日程を公表していた。"], "sources": [{"label": "優婆夷宝明神社", "url": "https://ubai-houmei.tokyo/%E4%BB%A4%E5%92%8C8%E5%B9%B4%E5%84%AA%E5%A9%86%E5%A4%B7%E5%AF%B6%E6%98%8E%E7%A5%9E%E7%A4%BE%E4%BE%8B%E7%A5%AD%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6/"}], "label": "文化", "audience": "島民", "thread_id": "t20261113-85", "id": "38d86a", "photo": {"type": "img", "src": "/img/kiji/38d86a.jpg?v=2efec8", "og": "/img/kiji/38d86a-og.jpg?v=2efec8", "s": "/img/kiji/38d86a-s.jpg?v=2efec8", "m": "/img/kiji/38d86a-m.jpg?v=2efec8", "caption": "優婆夷宝明神社の社殿", "credit": "", "file": "ac/24824871.jpg"}}, {"headline": "ピアノステップ 申込16日まで", "body": ["ピティナ・ピアノステップ八丈島地区が12月20日、大賀郷の八丈町多目的ホール「おじゃれ」で開かれる。参加申込は16日まで。", "ピアノステップはコンクールとは異なり、年齢や経験を問わず参加できる「アドバイスつきの公開ステージ」。参加者にはアドバイザーから演奏への直筆メッセージが渡され、日頃の練習を次につなげる。23段階の課題曲に挑む「23ステップ」と、規定時間内で自由に曲を選ぶ「フリーステップ」がある。", "八丈島地区ではフリー15分と15分を組み合わせた申込もでき、団体登録にも対応する。ピアノはヤマハS6Bで、足台と補助ペダルを用意。アドバイザーは東京都と兵庫県から来島予定で、参加者数により人数が変わる場合がある。", "開催事務局は八丈島Anettaiステーション。文部科学省、八丈島文化協会、八丈町教育委員会などが後援する。問い合わせは04996-2-1185。"], "sources": [{"label": "ピティナ", "url": "https://entry.piano.or.jp/step/holds/detail/202672762"}, {"label": "ピティナ・ピアノステップとは", "url": "https://step.piano.or.jp/about/detail.html"}], "label": "文化", "audience": "島民", "thread_id": "t20261113-82", "id": "93230b", "edited": "2026-11-13T08:40:41+09:00", "photo": {"type": "img", "src": "/img/kiji/93230b.jpg?v=639778", "og": "/img/kiji/93230b-og.jpg?v=639778", "s": "/img/kiji/93230b-s.jpg?v=639778", "m": "/img/kiji/93230b-m.jpg?v=639778", "caption": "八丈町役場・八丈町多目的ホール おじゃれ", "credit": "", "file": "own/yakuba-10.jpg"}}, {"headline": "植物公園でツルソバ開花", "body": ["八丈植物公園の「八丈の森」で、ツルソバの白い花が咲いている。八丈ビジターセンターと東京都公園協会が12日、植物公園情報として紹介   if(f.type==="table") return `<figure class="zu-fig zu-tbl"><p class="zt-h">${esc(f.title)}</p><table>${f.rows.map(([k,v,w])=>`<tr><th>${esc(k)}</th><td class="${w?"warn":""}">${esc(v)}</td></tr>`).join("")}</table>${cap}</figure>`;
  return `<figure><div class="photo"><img src="${esc(f.src)}" alt="${esc(f.caption)}" loading="lazy"></div></figure>`;   
}
 
const thumb = (e,a) => { const f=a.photo; if(!f||f.type!=="img") return "";
  const img=`<img src="${esc(f.src)}"${f.m?` srcset="${esc(f.m)} 240w, ${esc(f.src)} 1200w" sizes="(min-width:1000px) 380px, 120px"`:""} alt="${esc(f.caption)}" width="1200" height="800" loading="lazy">`;
  return a.id?`<a class="kp" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/" tabindex="-1">${img}</a>`:`<span class="kp">${img}</span>`; };
 
function ichigyo(w){
  const d=(w.days||[])[0]||{}, t=String(d.hachijo??d.main??d.weather??"");
  const ten=tenOf(t);
  
  const o=w.obs, dir=o?(o.wind_dir.length===3?o.wind_dir[0]:o.wind_dir):"";
  const kaze=o?(dir==="静穏"?"静穏":esc(`${dir}風${Math.round(Number(o.wind))}m`)):"";
  return [ten,kaze,d.max!=null?`${esc(d.max)}<span class="deg">°C</span>`:""].filter(Boolean).join(" ");
}
 
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  くもり:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 7 18z"/></svg>',
  あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
 
 
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const MEDAL={"🥇":1,"🥈":2,"🥉":3};

function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>

function shimaSection(e){

  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}

      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
