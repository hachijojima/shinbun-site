""}, {"island": "青ヶ島", "direction": "青ヶ島行き", "time": "09:30", "place": "八丈島発", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}, {"island": "青ヶ島", "direction": "青ヶ島発", "time": "12:50", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}]}, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "ロベの集荷減続く、単価は回復", "body": ["JA八丈島が11日に公表した10月後半の切葉市況によると、主力のフェニックス・ロベレニーは集荷量が例年を下回る一方、平均単価は持ち直している。10月23～30日の販売数量は10万4000枚、平均単価は29.25円で、9月後半の24.41円から4.84円上昇した。", "4月以降の累計数量は196万3950枚、平均単価は32.73円。前年までの同じ時期の累計は、2024年が314万3600枚、2025年が260万5050枚だった。出荷規模の縮小が続いている。昨年10月の台風第22号・第23号では畑や栽培施設が大きな被害を受け、JAは復興に相当な時間がかかるとの見通しを示していた。", "ほかの切葉では、ルスカスが6万8325本、平均35.51円。10月中旬から出荷が増え、単価は落ち着いた。レザーファンは2万4920枚、平均48.54円で、集荷量は減少傾向ながら単価は安定している。金額はいずれも市場売値で、消費税を含まない。"], "figure": {"type": "period", "start": "2026-10-23", "end": "2026-10-30", "label": "切葉の週間販売実績の期間"}, "sources": [{"label": "JA八丈島", "url": "https://www.jahachijo.jp/news/r8/month-11/sikyo20261111.html"}], "label": "産業", "audience": "島民", "thread_id": "t20261116-180", "id": "b8ffc3", "edited": "2026-11-16T13:08:19+09:00", "photo": {"type": "img", "src": "/img/kiji/b8ffc3.jpg?v=1eaa61", "og": "/img/kiji/b8ffc3-og.jpg?v=1eaa61", "s": "/img/kiji/b8ffc3-s.jpg?v=1eaa61", "m": "/img/kiji/b8ffc3-m.jpg?v=1eaa61", "caption": "フェニックスロベレニー", "credit": "", "file": "ac/27447099.jpg"}}, "side": [], "shorts": [{"headline": "八丈島で88.5ミリの雨", "body": ["気象庁によると、八丈島の15日の降水量は88.5ミリだった。最高気温は22.0度、最低気温は17.6度。まとまった雨の一日となった。"], "sources": [{"label": "気象庁", "url": "https://www.data.jma.go.jp/stats/etrn/view/daily_s1.php?block_no=47678&day=&month=11&prec_no=44&view=p1&year=2026"}], "label": "くらし", "audience": "両方", "thread_id": "t20261116-181", "id": "d1df17", "photo": {"type": "img", "src": "/img/kiji/d1df17.jpg?v=bdfd22", "og": "/img/kiji/d1df17-og.jpg?v=bdfd22", "s": "/img/kiji/d1df17-s.jpg?v=bdfd22", "m": "/img/kiji/d1df17-m.jpg?v=bdfd22", "caption": "海の中/八丈島", "credit": "", "file": "ac/4272244.jpg"}}, {"headline": "バービーさん一家の八丈島旅", "body": ["お笑いコンビ「フォーリンラブ」のバービーさん一家が八丈島を訪れ、夫の「つーたん」さんが家族旅行を連載で振り返った。バービーさんとつーたんさんは2021年に結婚している。", "旅はつーたんさんの誕生日祝い。自身が島好きで、娘が海の歌や映像を喜ぶことから、羽田から約1時間で行ける八丈島を選んだという。ところが実際の海を前に娘は怖がり、宿では「おうちで寝たい」と口にした。", "帰宅後、娘は星を探すようになり、八丈島で食べたかき氷や宿泊の思い出を自分から話したという。"], "sources": [{"label": "現代ビジネス", "url": "https://news.livedoor.com/article/detail/32815260/"}], "label": "産業", "audience": "両方", "thread_id": "t20261116-195", "id": "321139", "photo": {"type": "img", "src": "/img/kiji/321139.jpg?v=9112df", "og": "/img/kiji/321139-og.jpg?v=9112df", "s": "/img/kiji/321139-s.jpg?v=9112df", "m": "/img/kiji/321139-m.jpg?v=9112df", "caption": "朝焼けと底土海水浴場の砂浜", "credit": "", "file": "ac/27266328.jpg"}}, {"headline": "ハンドメイドマルシェ、底土で", "body": ["「八丈ハンドメイドマルシェ」が、12月5日に底土船客待合所で開かれる。八丈島のハンドメイド作家が手仕事の雑貨やアクセサリーを販売する。主催の八丈ハンドメイドマルシェが案内した。", "八丈島の手仕事作家による1日限りのマルシェで、ワークショップも多数開く。", "同マルシェは2021年に、大賀郷の旧山田昇商店で期間限定ショップとして始まった。八丈島で暮らす作家が集まり、手づくりの布小物やアクセサリー、雑貨を8月1日から9月20日まで販売した。2024年12月8日には底土船客待合所3階で開き、中学校の美術部を中心とした子ども作家の枠を新たに設けた。参加は大人と合わせて23人で、ワークショップは過去最多の8種類。大人のメンバー5組が講師を務めた。", "2025年10月26日に予定していた開催は、台風22号による被害を受けて延期した。延期した催しは2026年2月28日に底土船客待合所3階で開き、子ども作家として中高生が参加した。今回の子ども作家は、手芸や工作が好きな小学4年生から高校生を10月23日まで募集した。"], "sources": [{"label": "八丈ハンドメイドマルシェ", "url": "https://x.com/8johandmade/status/2121903486787096957"}], "label": "文化", "audience": "両方", "thread_id": "t20261116-182", "id": "180e5d", "edited": "2026-11-16T13:03:08+09:00", "photo": {"type": "img", "src": "/img/kiji/180e5d.jpg?v=2d5004", "og": "/img/kiji/180e5d-og.jpg?v=2d5004", "s": "/img/kiji/180e5d-s.jpg?v=2d5004", "m": "/img/kiji/180e5d-m.jpg?v=2d5004", "caption": "八丈島・底土港客船待合所", "credit": "", "file": "ac/4917189.jpg"}}, {"headline": "観光きっぷ、来春まで延長", "body": ["東海汽船は、伊豆諸島向けの「東京諸島観光応援船旅きっぷ」の設定期間を2027年4月4日帰着分まで延長する。", "八丈島発着の往復は大人13,000円、子ども6,500円。往路・復路とも2等利用で、設定除外日がある。これまで12月27日までとしていた期間を春休みまで広げ、冬から年度末にかけても島への船旅を促す。", "利用日や予約条件は東海汽船の案内で確認する。"], "sources": [{"label" function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
