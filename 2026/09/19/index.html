<script type="application/json" id="edition">{"date": "2026-09-19", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-24T10:49:43+09:00", "prev": "/2026/09/18/", "next": "/2026/09/20/", "alerts": [], "weather": {"issued": "2026-09-19T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "雨", "main": "雨", "hachijo": "雨", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 28}]}, "koyomi": {"sunrise": "5:26", "sunset": "17:43", "moon": 7.3, "tide": {"place": "八丈島(神湊)", "high": [["20:08", 119]], "low": [["3:59", 58]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "ANA八丈島便 20日は全便欠航", "body": ["ANA(全日本空輸)によると、台風25号の影響で、20日の八丈島空港発着便は全便の欠航が決まった。羽田発着便は、21日午前に運航への影響が懸念されるという。", "八丈島観光協会によると、18日は羽田発のANA1891便(1便)が八丈島に到着した。東海汽船株式会社の東京—八丈島間の定期船は、17日夜竹芝発(18日朝八丈島着)の便が欠航した。台風接近に伴う警戒態勢の発令による。八丈島—青ヶ島の定期船も欠航した。気象庁によると、八丈島の18日の降水量は23ミリだった。", "気象庁のベストトラックによると、1951年以降、台風の中心が八丈島から100キロ以内に来たのは56回ある。前回は2025年の台風第23号で、2025年10月13日に約46キロの距離を通り、中心気圧は970ヘクトパスカルだった。", "リードパークリゾート八丈島は、台風25号の接近に伴い、19日から21日の八丈島発着便にかかわる宿泊予約を、キャンセル料なしで取り消せると案内している。"], "figure": null, "sources": [{"label": "ANA", "url": "https://x.com/ANA_flight_info/status/2100901927831953552"}, {"label": "八丈島観光協会", "url": "https://x.com/Go_Hachijo_JP/status/2100731838692294978"}], "label": "くらし", "audience": "両方", "thread_id": "t20260917-60", "followup": true, "id": "f73869", "photo": {"type": "img", "src": "/img/kiji/f73869.jpg?v=09d7da", "og": "/img/kiji/f73869-og.jpg?v=09d7da", "s": "/img/kiji/f73869-s.jpg?v=09d7da", "m": "/img/kiji/f73869-m.jpg?v=09d7da", "caption": "もうすぐ離陸 八丈島空港", "credit": "", "file": "ac/35548164.jpg"}}, "side": [], "shorts": [{"headline": "八丈島空港の空の日、20日は中止", "body": ["八丈島空港ターミナルビルは18日、20日の空の日イベントの中止を案内した。台風の接近に伴う判断である。一部の催しは延期しての開催を検討していて、詳細は後日案内するという。", "主催は八丈島空港空の日実行委員会で、会場は駐機場とターミナルビル。時間は9時30分から16時と案内した。駐機場の開放は10時から15時とした。", "内容は自衛隊と警視庁の航空機展示、白バイの演技走行、ANAの機内食販売やアナウンス体験などを案内した。2便(1893便)の到着時には、化学消防車の放水アーチを行うとした。北海道物産展、キッチンカーの出店、フラダンスの披露も案内した。", "ターミナルビルは17日、実施の可否を18日中に発表すると知らせた。実施する場合も屋外イベントは中止するなど、規模を縮小する見込みと説明した。気象警報や避難指示が出れば、ビル内のイベントも中止とする方針も示した。11日には、自衛隊の機体や隊員・職員の活動の写真を展示すると知らせた。2025年の台風22・23号の直後に、災害支援で来島した際の写真である。", "2024年9月22日の空の日イベントでは、強風でANA2便が欠航した。キッズマーシャリングを中止し、放水アーチは放水訓練の実演に変えた。自衛隊と警視庁のヘリなどの来港も取りやめになった。2025年9月20日は、悪天候で警視庁航空隊ヘリなどの来港が取りやめになった。", "問い合わせは八丈島空港空の日実行委員会事務局(八丈島空港管理事務所、04996-2-0163)へ。"], "sources": [{"label": "八丈島空港ターミナルビル", "url": "https://x.com/HAT_info_8jo/status/2100860323880403407"}], "label": "文化", "audience": "両方", "thread_id": "t20260910-38", "followup": true, "id": "53eead", "photo": {"type": "img", "src": "/img/kiji/53eead.jpg?v=9ea9c6", "og": "/img/kiji/53eead-og.jpg?v=9ea9c6", "s": "/img/kiji/53eead-s.jpg?v=9ea9c6", "m": "/img/kiji/53eead-m.jpg?v=9ea9c6", "caption": "初夏の南国 八丈島空港", "credit": "", "file": "ac/35130486.jpg"}}, {"headline": "八丈高校園芸科の販売会 24日に", "body": ["都立八丈高校園芸科の生産品販売会は、24日14時から16時へ延期された。当初は18日に予定していた。八丈町が18日に日程変更を案内した。", "園芸科は授業や実習で育てた農産物や草花、加工品を地域向けに販売している。9月3日公開の園芸科通信では、夏季実習で野菜や草花を管理し、販売会に向けた加工実習にも取り組む様子を紹介していた。", "生徒にとって販売会は、育てるところから加工、販売までをつなぐ実習の場でもある。購入を予定していた人は、変更後の日付と時間に注意したい。"], "sources": [{"label": "八丈町", "url": "https://x.com/HachijoTown/status/2100729011785593052"}, {"label": "八丈高校「園芸科通信vol.1」", "url": "https://www.metro.ed.jp/hachijo-h/news/2026/09/vol_1_3.html"}], "label": "教育", "audience": "島民", "thread_id": "t20260919-67", "id": "ba029f", "photo": {"type": "img", "src": "/img/kiji/ba029f.jpg?v=c040ac", "og": "/img/kiji/ba029f-og.jpg?v=c040ac", "s": "/img/kiji/ba029f-s.jpg?v=c040ac", "m": "/img/kiji/ba029f-m.jpg?v=c040ac", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-3.jpg"}}, {"headline": "三原小が連合音楽会で合奏と合唱", "body": ["八丈町立三原小学校の4、5年生は18日、島内小学校の連合音楽会で、合奏「ルパン三世のテーマ」と合唱「空のうた」「海のうた」を披露した。", "児童は1学期から学年合同で練習を重ね、16日には本番を聴けない校内の児童へ同じ演奏を披露していた。本番には保護者や地域の人も多く来場し、練習してきた三曲を届けた。", "連合音楽会は、島内の小学校が学校ごとの音楽活動の成果を持ち寄る場。三原小の4、5年生にとっては、学年を越 /* 一面の下の記事の写真(PC は列の幅で見出しの上、スマホは右に 120×80。押すと記事へ) */
const thumb = (e,a) => { const f=a.photo; if(!f||f.type!=="img") return "";

/* 題字下の1行:天気はおおまかに(のち・時々・一時は省く)、風はアメダスの観測、気温はきょうの最高。半角スペースで区切る */
function ichigyo(w){
  const d=(w.days||[])[0]||{}, t=String(d.hachijo??d.main??d.weather??"");
  const ten=tenOf(t);
  // 風向は3文字の向きを丸める(南南西→南、東北東→東)。風速は四捨五入した整数(利用者の指定、2026-10-25)
  const o=w.obs, dir=o?(o.wind_dir.length===3?o.wind_dir[0]:o.wind_dir):"";
  const kaze=o?(dir==="静穏"?"静穏":esc(`${dir}風${Math.round(Number(o.wind))}m`)):"";
  return [ten,kaze,d.max!=null?`${esc(d.max)}<span class="deg">°C</span>`:""].filter(Boolean).join(" ");
}
/* 天気欄の1行:予報文はおおまかに(題字下と同じ丸め)、降水確率はその日のいちばん高い値、風は「後」の前、波は最初の高さ */
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  くもり:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 7 18z"/></svg>',
  あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
/* 島の足:東海汽船の表を、島の人が読む形に並べ直す(言葉は表のまま)。「島のいま」の「船」の項になる */
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  // 載せるのは、けさ八丈島に着く東京からの船(昨晩発)と、八丈島→青ヶ島。今晩発・八丈島→東京・青ヶ島→八丈島は載せない(利用者の指定)
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    // 定型の案内文は「条件付き」、運休日や更新予定は状態の列へ(言葉は表のまま)
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
/* 島のいまの「催し」:先7日の催しを数行(夜に重なりをまとめた desk/korekara)。前の形(today/soon)の号もそのまま並べる */
/* 催しの日:曜日を必ず添える(人は曜日で予定を捉える。2026-10-29 利用者)。発行月なら「31日(土)」、別の月は「11月1日(日)」 */
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};
  [...new Set([...document.querySelectorAll("figure.embed")].map(f=>f.dataset.provider))].forEach(p=>{
    if(!need[p]) return; const sc=document.createElement("script"); sc.src=need[p]; sc.async=true; document.body.appendChild(sc);
  });
}
if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
