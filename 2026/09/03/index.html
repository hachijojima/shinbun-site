<script type="application/json" id="edition">{"date": "2026-09-03", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-28T18:15:35+09:00", "prev": "/2026/09/02/", "next": "/2026/09/04/", "alerts": [], "weather": {"issued": "2026-09-03T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 25, "max": 30}]}, "koyomi": {"sunrise": "5:16", "sunset": "18:05", "moon": 20.8, "tide": {"place": "八丈島(神湊)", "high": [["9:17", 121], ["20:00", 138]], "low": [["2:31", 42], ["14:07", 93]]}}, "unko": null, "sora": {"status": "条件付きの可能性", "reason": "強風", "url": "https://x.com/ANA_flight_info/status/2095066701763080338", "at": "2026-09-02T17:30:00+09:00"}, "number": null, "top": {"headline": "災害ごみ処理、完了を28年3月に", "body": ["八丈町は2日、令和7年台風第22号・23号の災害廃棄物について、第3版の災害廃棄物等処理実行計画を公表した。処理の完了時期は、令和8年12月末から令和10年3月末に見直された。", "町によると、工程が予定より進まず、目標としていた令和8年12月末の完了が難しくなった。処理を早める方法も検討したという。台風第23号は2025年10月13日、八丈島から約46キロを通った。", "計画の本体（PDF、1.8MB）と概要版（PDF、613KB）は、町のページで公開している。問い合わせは町住民課環境係（電話04996-2-1123）。"], "figure": null, "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260902-3/"}, {"label": "写真:国土交通省TEC-FORCE（テックフォース）撮影(2025年11月、八丈町。切り抜いて使用)", "url": "https://www.tecforce.jp/202510/index.html"}], "label": "くらし", "audience": "島民", "thread_id": "t20260903-11", "id": "786be3", "photo": {"type": "img", "src": "/img/kiji/786be3.jpg?v=24a782", "og": "/img/kiji/786be3-og.jpg?v=24a782", "s": "/img/kiji/786be3-s.jpg?v=24a782", "m": "/img/kiji/786be3-m.jpg?v=24a782", "caption": "台風で倒れた木を調べる職員(八丈町、2025年11月)", "credit": "", "file": "commons/tecforce-202510-H001.jpg"}}, "side": [], "shorts": [{"headline": "富士中、12日の運動会へ練習", "body": ["八丈町立富士中学校は12日に運動会を開く。同校によると、開閉会式、100m走、全校リレー、大縄跳びの練習を始めた。", "練習は暑い中で行った。"], "sources": [{"label": "富士中", "url": "https://fuji-jhs.8jo.ed.jp/n/nd7a3a7ed09ee"}], "label": "教育", "audience": "島民", "thread_id": "t20260903-178", "id": "08b5f9", "photo": {"type": "img", "src": "/img/kiji/08b5f9.jpg?v=288866", "og": "/img/kiji/08b5f9-og.jpg?v=288866", "s": "/img/kiji/08b5f9-s.jpg?v=288866", "m": "/img/kiji/08b5f9-m.jpg?v=288866", "caption": "八丈町立富士中学校", "credit": "", "file": "own/fuji-chu-1.jpg"}}, {"headline": "雇用拡充補助、11月公募", "body": ["八丈町は、令和8年度雇用機会拡充事業補助金の募集を11月2日から25日まで受け付ける。雇用を増やしながら創業や事業拡大をする民間事業者に、事業資金の一部を補助する。午後5時必着で、町が1日付で公表した。", "目的は、特定有人国境離島地域で人が住み続けられる環境を整えること。選考の観点は、島外の需要を取り込んで島内の経済と雇用を広げる事業。島外事業者への依存を減らす島内の生活・産業に不可欠な商品やサービスの事業。島への転入者増加に直接つながる事業である。", "事業実施期間は2027年4月1日から2028年2月29日で、終期は当初の2028年3月31日から変更された。国と町の令和9年度予算の成立前に募集するのは、成立後すぐに事業を始められるようにするため。事業の実施は予算の成立が前提となる。雇用の事実確認や支出の証拠書類について、国から厳しい指示を受けている。町は応募前に会計検査の指摘事項を確認するよう案内している。", "募集期間中は事前相談を受け付ける。予約のうえ役場に行く。問い合わせは役場企画財政課企画係（04996-2-1120）。申請書と計画書の様式は、町サイトの「予算・財政」ページからダウンロードする。広報はちじょう2024年9月号によると、令和7年度分の募集は11月1日から20日だった。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260901-08/"}, {"label": "広報はちじょう 2024年9月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23121919/hachijo2409.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20260903-179", "id": "f613ae", "photo": {"type": "img", "src": "/img/kiji/f613ae.jpg?v=f9e6a6", "og": "/img/kiji/f613ae-og.jpg?v=f9e6a6", "s": "/img/kiji/f613ae-s.jpg?v=f9e6a6", "m": "/img/kiji/f613ae-m.jpg?v=f9e6a6", "caption": "八丈町役場の中", "credit": "", "file": "own/yakuba-naka-4.jpg"}}, {"headline": "被災事業者の相談会 9日と30日", "body": ["東京都産業労働局が、被災した中小企業等向けの相談会を9日と30日に八丈支庁で開く。対象は令和7年の台風第22号・第23号で被災した中小企業等。時間はいずれも9時30分から16時まで。予約制で、事前に電話で申し込む。", "問い合わせ先は産業労働局商工部調整課（電話03-5320-4744）。八丈町商工会（大賀郷2551番地2、町役場庁舎内、電話04996-2-2121）も、2日にホームページに案内を載せた。", "東京都の地域企業再建支援事業は、台風第22号・第23号の被害を受けた事業者向けの補助事業。補助上限は5,000万円、補助率は4/5。第1期の申請期間は2025年12月22日から2026年3月19日までだった。", "商工会は2026年1月13日に、説明会（13日・20日）と相談会（14日・15日）の実施を知らせた。6月1日に6月〜8月版、7月30日に8月版の相談会の案内を載せた。"], "sources": [{"label": "八丈町商工会", "url": "https://x.com/hachisho8/status/2094947974912909349"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260902-2/"}, {"label": "東京都産業労働局", "url": "https://www.sangyo-rodo.metro.tokyo.lg.jp/documents/d/sangyo-rodo/2026-01-27-161504-161"}], "label": "産業", "audience": "島民", "thread_id": "t20260903-176", "id": "264b0e", "photo": {"type": "img", "src": "/img/kiji/264b0e.jpg?v=50753b", "og": "/img/kiji/264b0e-og.jpg?v=50753b", "s": "/img/kiji/264b0e-s.jpg?v=50753b", "m": "/img/kiji/264b0e-m.jpg?v=50753b", "caption": "東京都八丈支庁", "credit": "", "file": "own/shicho-1.jpg"}}, {"headline": "八丈町、幸福度2年連続1位", "body": ["大東建託が2日に発表した「街の幸福度&住み続けたい街ランキング2026＜東京都版＞」で、八丈町が自治体の1位になった。2年連続の1位。", "2位は港区、3位は中央区で、ともに2年連続。八丈町は東京都版のトップ20で唯一、郡部に属する「町」で、偏差値は70台だった。首都圏版では八丈町が2位。1位は神奈川県の葉山町（昨年2位）、3位は港区だった。", "幸福度は「全体としてみて、あなたは現在、幸せですか、あるいは不幸せですか」という設問に1〜10点で答えてもらう。その平均値を10倍し、100点満点にした値である。東京都版は東京都在住の20歳以上が対象で、インターネットで調べた。2026年の回答者は20,088人、2022〜2026年の合計は97,344人。自治体の集計は回答者50人以上が対象で、企画と分析は大東建託賃貸未来研究所が担当した。", "町は、首都圏版の前回調査で初めてランクインして1位になったと2025年9月4日に伝えた。全国版で初めてランクインして4位になったとは、2026年2月18日に伝えた。"], "sources": [{"label": "大東建託", "url": "https://prtimes.jp/main/html/rd/p/000001628.000035668.html"}], "label": "くらし", "audience": "両方", "thread_id": "t20260903-177", "id": "462184", "photo": {"type": "img", "src": "/img/kiji/462184.jpg?v=6fae12", "og": "/img/kiji/462184-og.jpg?v=6fae12", "s": "/img/kiji/462184-s.jpg?v=6fae12", "m": "/img/kiji/462184-m.jpg?v=6fae12", "caption": "東京都八丈町 高台から眺める八丈島の風景", "credit": "", "file": "ac/28821682.jpg"}}], "agenda": [{"date": "2026-09-05", "end": "2026-09-06", "text": "都立八丈高校の八高祭", "url": "https://x.com/tokyo8jouhs/status/2094680584543228289"}], "letters": [], "corrections": [], "column": null, "kyoku": {"artist": "Houy Meas & Dara Chom Chan", "title": "Nek Na Min Rom (Who Isn't Dancing)", "text": "「Nek Na Min Rom」は、カンボジアの歌手Houy MeasとDara Chom Chanによる録音です。題名は「踊らないのは誰？」と問いかけるような意味を持ち、演奏には人々を輪へ誘う軽やかさがあります。古い録音を聴くとき、その後に起きた歴史だけで曲を見ないことも大切です。ここには確かに、誰かと踊り、楽しんでいた人たちの時間が残っています。", "art       ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
