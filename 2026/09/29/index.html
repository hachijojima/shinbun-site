<script type="application/json" id="edition">{"date": "2026-09-29", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-24T10:51:43+09:00", "prev": "/2026/09/28/", "next": "/2026/09/30/", "alerts": [], "weather": {"issued": "2026-09-29T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "雨", "main": "雨", "hachijo": "雨", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 21, "max": 29}]}, "koyomi": {"sunrise": "5:33", "sunset": "17:30", "moon": 17.3, "tide": {"place": "八丈島(神湊)", "high": [["6:38", 139], ["18:07", 140]], "low": [["0:05", 20], ["12:19", 62]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "台風26号に備え町が呼びかけ", "body": ["八丈町は、台風26号が八丈島へ接近する予報を受け、早めの備えを呼びかけている。家の周りの飛びやすい物を固定すること、防災無線戸別受信機の電池や雨戸の確認、水の汲み置きなどを挙げ、今後の気象情報に注意するよう求めた。", "島では前週、台風25号の接近で航空・船便の欠航や町道の通行止め、温泉施設の休業などが相次いだ。復旧作業の直後に次の台風へ備える状況となっている。", "今回の呼びかけは、風雨が強まってからではなく、その前に家庭でできる準備を済ませることが中心。町は防災無線や公式情報で最新の進路、警報、避難情報を確認するよう求めている。"], "figure": null, "sources": [{"label": "八丈町", "url": "https://x.com/HachijoTown/status/2104451039495962797"}], "label": "くらし", "audience": "両方", "thread_id": "t20260929-100", "id": "dc592e", "photo": {"type": "img", "src": "/img/kiji/dc592e.jpg?v=6a5f24", "og": "/img/kiji/dc592e-og.jpg?v=6a5f24", "s": "/img/kiji/dc592e-s.jpg?v=6a5f24", "m": "/img/kiji/dc592e-m.jpg?v=6a5f24", "caption": "神湊漁港", "credit": "", "file": "own/kaminato-gyoko-1.jpg"}}, "side": [], "shorts": [{"headline": "日商簿記検定174回が中止", "body": ["八丈町商工会は28日、11月15日に予定していた第174回日商簿記検定試験を中止すると発表した。理由は、検定試験委員の確保が困難になったためとしている。", "商工会は3月に2026年度の日程を公表し、第174回は9月28日から10月15日まで申し込みを受け付ける予定だった。受付開始日に中止を知らせる形となった。", "次回の第175回は2027年2月28日に実施予定。申し込みは1月4日から21日までで、2級は5,500円、3級は3,300円。島内で統一試験を受ける予定だった人は、次回日程を確認する必要がある。"], "sources": [{"label": "八丈町商工会", "url": "https://x.com/hachisho8/status/2104359072644604371"}], "label": "産業", "audience": "島民", "thread_id": "t20260929-103", "id": "a17b3c", "photo": {"type": "img", "src": "/img/kiji/a17b3c.jpg?v=e51268", "og": "/img/kiji/a17b3c-og.jpg?v=e51268", "s": "/img/kiji/a17b3c-s.jpg?v=e51268", "m": "/img/kiji/a17b3c-m.jpg?v=e51268", "caption": "八丈町商工会", "credit": "", "file": "own/shokokai-2.jpg"}}, {"headline": "大賀郷小で八丈方言週間の授業", "body": ["大賀郷小学校は28日、「八丈方言週間」を始めた。1年生は「八丈方言かるた」から気になる言葉を探して発表し、「ねずみ」など動物の呼び方に関心を示した。今週は全学年で方言の授業を行い、地域の人が教室に入って発音や言葉を伝える。", "八丈方言は、ユネスコの「世界消滅危機言語地図」で日本国内の8言語の一つに挙げられ、危機の度合いは「危険」とされている。八丈町教育委員会も音声資料の公開や方言大会など、保存・継承の取り組みを進めている。", "学校で地域の話者から直接教わる方言週間は、子どもが島ことばを「昔の言葉」として知るだけでなく、実際に声に出して受け継ぐ機会となる。"], "sources": [{"label": "大賀郷小", "url": "https://okago-es.8jo.ed.jp/n/nfec5dcffc87d"}, {"label": "広報はちじょう 2021年1月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23130343/hachijo2101.pdf"}, {"label": "文化庁・消滅の危機にある言語・方言", "url": "https://www.bunka.go.jp/seisaku/kokugo_nihongo/kokugo_shisaku/kikigengo/"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/kanko-bunka/bunka-rekishi/hachijo-hougen/shimakotoba/"}], "label": "教育", "audience": "島民", "thread_id": "t20260929-101", "id": "505f6c", "photo": {"type": "img", "src": "/img/kiji/505f6c.jpg?v=22291e", "og": "/img/kiji/505f6c-og.jpg?v=22291e", "s": "/img/kiji/505f6c-s.jpg?v=22291e", "m": "/img/kiji/505f6c-m.jpg?v=22291e", "caption": "八丈町立大賀郷小学校", "credit": "", "file": "own/okago-sho-7.jpg"}}, {"headline": "八丈島ブース、すみだまつりに", "body": ["八丈島観光協会によると、10月3、4日に東京・墨田区で開かれる「第51回すみだまつり・第56回こどもまつり」に、八丈島の物産ブースが出展する。", "会場は錦糸公園、ひがしんアリーナ、楽天地ビルなど。両日とも10時に始まり、すみだまつりは17時、こどもまつりは16時まで。入場は無料。", "会場では物産展や模擬店、行政・企業のPR、スポーツ体験、子ども向け企画などを実施する。ステージでは音楽や芸能、下町寄席なども予定されている。島外で八丈島の特産品を紹介する機会となる。"], "sources": [{"label": "八丈島観光協会", "url": "https://www.hachijo.gr.jp/2026?post_type=events"}, {"label": "墨田区観光協会", "url": "https://visit-sumida.jp/event/sumidamatsuri51kodomomaturi56/"}], "label": "産業", "audience": "両方", "thread_id": "t20260929-102", "id": "be6890", "photo": {"type": "img", "src": "/img/kiji/be6890.jp /* 島の足:東海汽船の表を、島の人が読む形に並べ直す(言葉は表のまま)。「島のいま」の「船」の項になる */
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  // 載せるのは、けさ八丈島に着く東京からの船(昨晩発)と、八丈島→青ヶ島。今晩発・八丈島→東京・青ヶ島→八丈島は載せない(利用者の指定)
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    // 定型の案内文は「条件付き」、運休日や更新予定は状態の列へ(言葉は表のまま)
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
/* 島のいまの「催し」:先7日の催しを数行(夜に重なりをまとめた desk/korekara)。前の形(today/soon)の号もそのまま並べる */
/* 催しの日:曜日を必ず添える(人は曜日で予定を捉える。2026-10-29 利用者)。発行月なら「31日(土)」、別の月は「11月1日(日)」 */
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const MEDAL={"🥇":1,"🥈":2,"🥉":3};
const rankMark = m => MEDAL[m]?`<i class="r${MEDAL[m]}" aria-label="${MEDAL[m]}位">${MEDAL[m]}</i>`:`<i class="r0" aria-hidden="true"></i>`;
/* 議員動静:1日ごと。直近の発信の日が新しい順、同じ日は pt(議員の仕事の日2、ほか1)の多い順に上位5人。日と pt が同じ人は同じメダル。「分類：題材」で1行。1人1行、本人の投稿へのリンク */
function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h"><a href="/government/members/">町議会議員</a></h2>
    <ol class="giin">${g.map(r=>{const nm=`${rankMark(r.medal)}<b>${esc(r.name)}</b>`;
      return `<li>${r.slug?`<a class="nm" href="/government/members/${esc(r.slug)}/">${nm}</a>`:`<span class="nm">${nm}</span>`}${r.at?`<a class="ps" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.name+" "+(r.kind?r.kind+" ":"")+(r.what||""))}"><time>${esc(r.when)}</time><q${r.duty?' class="ten2"':""}>${r.kind?`${esc(r.kind)} `:""}${esc(r.what||"")}</q></a>`:`<span class="ps"><time>発信なし</time></span>`}</li>`;}).join("")}</ol><p class="more"><a href="/government/assembly/">議員・議会</a><a href="/government/members/">全員の一覧</a></p></section>`;
}
/* 100年前のきょうと、きょう(edition の hyakunen。絵は組むときに作ってある)。上が最高、下が最低 */
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
/* 島のいま:注意報・天気・暦・船・人口を1つの欄に。値は発表のまま */
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u), sora=soraRow(e.sora), ev=evLines(e).slice(0,8);
  const diff=n=>n==null?"":`<small>(${n>0?"+":n<0?"−":"±"}${Math.abs(n).toLocaleString()})</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const st=e.sora&&e.sora.at?ymd(e.sora.at.slice(0,10)):null, sh=e.sora&&e.sora.at?hm(e.sora.at):"";
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
/* きょうの一曲:CSV の文章のまま。ジャケットは見つかった日だけ(Apple の画像を Apple Music へのリンクつきで) */
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h"><a href="/song/">きょうの一曲</a></h2>
    <div class="kk">${a?`<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.img)}" alt="${esc(a.album||k.title)}のジャケット" width="96" height="96" loading="lazy"></a>`:""}
      <div><h3>${k.day?`<a class="hl" href="${esc(k.day)}song/">${esc(k.title)}</a>`:esc(k.title)}</h3><p class="who">${esc(k.artist)}</p></div></div>
    <p class="txt">${esc(k.text)}</p>
    <p class="kiku"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTubeで聴く</a>${a&&a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Apple Musicで聴く</a>`:""}</p></section>`;
}
/* 島のたより:CSV の文章のまま。本文の [語](URL) だけリンクにする */
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){
  if(!c) return "";
  return `<section id="tayori" aria-labelledby="tayori-h"><h2 class="band" id="tayori-h"><a href="/column/">${esc(c.name||"島のたより")}</a></h2>
    ${c.title?`<h3>${c.day?`<a class="hl" href="${esc(c.day)}column/">${esc(c.title)}</a>`:esc(c.title)}</h3>`:""}<div class="honbun">${(c.body||[]).map(t=>`<p>${mdLink(t)}</p>`).join("")}</div></section>`;
}

function render(e){
  e={...e}; if(!e.top&&e.side.length){e.top=e.side[0]; e.side=e.side.slice(1);}
  if(!e.top&&e.shorts.length){e.top=e.shorts[0]; e.shorts=e.shorts.slice(1);}
  // 最新号(トップ)は題字だけ、日付のページは日付を添える
  document.title = /^\/\d{4}\/\d{2}\/\d{2}\//.test(location.pathname) ? `八丈島新聞 ${hiduke(e.date)}` : "八丈島新聞";
  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><span class="hi">2026年9月29日(火)</span><h1 class="daiji"><a href="/"><img src="/logo-maru.png" alt="" width="192" height="192">八丈島新聞</a></h1><details class="menu"><summary aria-label="メニュー"><span></span><span></span><span></span></summary><nav aria-label="ページ"><form class="ms" action="/archive/" role="search"><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"><button>検索</button></form><ul class="sg" hidden></ul><div><a href="/">最新号</a><a href="/archive/">バックナンバー</a><a href="/features/">特集</a></div><div><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><a href="/column/">島のたより</a></div><div><a href="/song/">きょうの一曲</a><a class="tvl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener" title="FM八丈島テレビ"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div></nav></details></div><nav class="nb" aria-label="ページ"><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><div class="nbs"><form class="ms" action="/archive/" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"></form><ul class="sg" hidden></ul></div><button class="nbq" type="button" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg></button></nav></header>
  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top" id="a1">
      ${lbl(e.top)}<h2>${hl(e,e.top)}</h2>
      ${figure(e.top.photo)}
      <div class="honbun">${paras(e.top.body)}${src(e.top.sources)}</div>
    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];
      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>
      ${s.id?`<p class="ld">${esc(b[0])}</p>`:`<div class="honbun">${paras(b)}${src(s.sources)}</div>`}
    </article>`;}).join("")}</div>`:""}`:""}
    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}
    ${e.ronten?`<section class="men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="tv" aria-label="FM八丈島テレビ">
        <div class="head"><h2 class="band onair"><a href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><i aria-hidden="true"></i>ON AIR</a></h2><a class="chl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><img class="ch" src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div>
        <div style="position:relative;width:100%;height:0;padding-top:calc(56.25% + 44px)"><iframe src="${TV_EMBED}" title="FM八丈島テレビ" style="position:absolute;inset:0;display:block;width:100%;height:100%;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      </section>
      ${(e.ichimen_week||[]).length?`<section id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h"><a href="/archive/">今週の一面</a></h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><a href="${esc(w.url)}"><time datetime="${esc(w.date)}">${tsuki(w.date)}</time>${esc(w.headlines[0])}</a></li>`).join("")}</ol>
      </section>`:""}
      ${giinSection(e)}
      ${kyokuSection(e.kyoku&&{...e.kyoku,day:DAY(e)})}
      ${shimaSection(e)}
    </aside>
  </div>

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
}

function kyukan(){
  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><h1 class="daiji"><a href="/"><img src="/logo-maru.png" alt="" width="192" height="192">八丈島新聞</a></h1><details class="menu"><summary aria-label="メニュー"><span></span><span></span><span></span></summary><nav aria-label="ページ"><form class="ms" action="/archive/" role="search"><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"><button>検索</button></form><ul class="sg" hidden></ul><div><a href="/">最新号</a><a href="/archive/">バックナンバー</a><a href="/features/">特集</a></div><div><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><a href="/column/">島のたより</a></div><div><a href="/song/">きょうの一曲</a><a class="tvl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener" title="FM八丈島テレビ"><img src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div></nav></details></div><nav class="nb" aria-label="ページ"><a href="/government/">町政</a><a href="/industry/">産業</a><a href="/life/">くらし</a><a href="/education/">教育</a><a href="/culture/">文化</a><div class="nbs"><form class="ms" action="/archive/" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg><input type="search" name="q" placeholder="記事・議決・契約・事業者などを探す" aria-label="検索" autocomplete="off" enterkeyhint="search"></form><ul class="sg" hidden></ul></div><button class="nbq" type="button" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21" stroke-linecap="round"/></svg></button></nav></header>
  <section class="kyukan"><h2>本日は休刊です</h2><p>けさの号を組めませんでした。<a href="/archive/">バックナンバー</a>で前の号を読めます。</p></section>`;
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};
  [...new Set([...document.querySelectorAll("figure.embed")].map(f=>f.dataset.provider))].forEach(p=>{
    if(!need[p]) return; const sc=document.createElement("script"); sc.src=need[p]; sc.async=true; document.body.appendChild(sc);
  });
}
if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
