<script type="application/json" id="edition">{"date": "2026-09-08", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T10:16:10+09:00", "prev": "/2026/09/07/", "next": "/2026/09/09/", "alerts": [], "weather": {"issued": "2026-09-08T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ 時々 雨", "main": "晴れ 時々 雨", "hachijo": "晴れ 時々 雨", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 25, "max": 30}]}, "koyomi": {"sunrise": "5:19", "sunset": "17:59", "moon": 25.8, "tide": {"place": "八丈島(神湊)", "high": [["2:01", 127], ["16:29", 136]], "low": [["9:09", 30], ["21:56", 92]]}}, "unko": null, "sora": {"status": "条件付きの可能性", "reason": "強風", "url": "https://x.com/ANA_flight_info/status/2096878638742523920", "at": "2026-09-07T17:30:00+09:00"}, "number": null, "top": {"headline": "八丈島の24時間雨量 史上1位", "body": ["気象庁によると、八丈島の24時間降水量は7日0時40分までに364.5ミリとなり、観測史上1位を更新した。", "従来の1位は2025年10月9日の356.5ミリ。9月の1位も、2003年9月22日の267ミリから更新した。八重見ヶ原は333.0ミリで、観測史上1位と9月の1位をともに更新した。従来は観測史上が2006年7月20日の285ミリ、9月が2019年9月18日の239.0ミリだった。値は速報値で、修正されることがある。八丈島の7日の降水量は28ミリだった。", "八丈町によると、7日に土砂災害警戒区域の避難指示を解除した。土砂などが道路上に流入している場合があるとして、通行時の注意を案内した。同日、開設していた全ての避難所を閉鎖すると告知した。", "東京都島しょによると、7日に大雨による土砂の除去作業のため、汐間道路（都道）を通行止めにしたと告知した。作業が終わったら知らせるという。汐間道路は8月にも台風の接近で、8月4日10時から8月6日9時30分まで通行止めになった。"], "figure": {"type": "place", "name": "汐間道路"}, "sources": [{"label": "東京都", "url": "https://x.com/ogasawarashicho/status/2096793387286380600"}, {"label": "気象庁", "url": "https://www.data.jma.go.jp/stats/mdrr/periodstat/20260904a/20260907/24/rank_update.html"}, {"label": "八丈町", "url": "https://x.com/HachijoTown/status/2096727660399673842"}], "label": "くらし", "audience": "両方", "thread_id": "t20260907-28", "followup": true, "id": "1afe6e", "photo": {"type": "img", "src": "/img/kiji/1afe6e.jpg?v=3f483e", "og": "/img/kiji/1afe6e-og.jpg?v=3f483e", "s": "/img/kiji/1afe6e-s.jpg?v=3f483e", "m": "/img/kiji/1afe6e-m.jpg?v=3f483e", "caption": "向こうは大雨 夕立迫る南国の島の主要道路", "credit": "", "file": "ac/35523156.jpg"}}, "side": [], "shorts": [{"headline": "青ヶ島航路 10日まで欠航・運休", "body": ["伊豆諸島開発によると、八丈島—青ヶ島航路は8日が欠航、9日と10日が運休日となる。台風24号の影響で「海上不良」が見込まれるため、運航を変更すると発表した。", "7日は、八丈島の空と海の便がそろって止まった。八丈島観光協会によると、羽田—八丈島のANA便は1便、2便、3便とも強風で欠航した。東京—八丈島の定期船も東海汽船が欠航した。八丈島—青ヶ島のくろしお丸も、八丈島9時30分発と青ヶ島12時50分発が欠航した。", "東京からの船は6日から2日続けて欠航している。1日から7日の7日間では、就航5日、欠航2日だった。", "気象庁によると、八丈島の7日の観測は、最高気温29.4度、最低気温24.5度、降水量28ミリだった。1951年以降、台風の中心が八丈島から100キロ以内に来たのは56回だった。前回は2025年の台風第23号（10月13日、約46キロ、970ヘクトパスカル）だった。"], "sources": [{"label": "八丈島観光協会", "url": "https://x.com/Go_Hachijo_JP/status/2096737664192172179"}], "label": "くらし", "audience": "両方", "thread_id": "t20260908-32", "id": "7779d6", "photo": {"type": "img", "src": "/img/kiji/7779d6.jpg?v=48d000", "og": "/img/kiji/7779d6-og.jpg?v=48d000", "s": "/img/kiji/7779d6-s.jpg?v=48d000", "m": "/img/kiji/7779d6-m.jpg?v=48d000", "caption": "迫る台風 荒れる八丈島の海", "credit": "", "file": "ac/3158090.jpg"}}, {"headline": "八丈病院、レスパイト入院を案内", "body": ["町立八丈病院は、在宅介護を担う家族が一時的に介護を続けられないときに利用できる「レスパイト入院」を行っている。八丈町が7日に案内した。", "レスパイト入院は、介護者の休養や急な事情などで在宅介護が難しくなった場合に、医療保険を使って短期間入院できる制度。島内で在宅生活を続ける本人だけでなく、介護する家族を支える仕組みでもある。", "病院は3日に案内を更新した。予約は町立八丈病院（04996-2-1188）で受け付け、受付時間は8時30分から12時まで。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2096881365275029786"}, {"label": "八丈病院", "url": "https://hachijohospital.jp/"}, {"label": "町立八丈病院 入院・面会", "url": "https://hachijohospital.jp/hospitalization/"}], "label": "くらし", "audience": "島民", "thread_id": "t20260908-33", "id": "240314", "photo": {"type": "img", "src": "/img/kiji/240314.jpg?v=ae10ff", "og": "/img/kiji/240314-og.jpg?v=ae10ff", "s": "/img/kiji/240314-s.jpg?v=ae10ff", "m": "/img/kiji/240314-m.jpg?v=ae10ff", "caption": "町立八丈病院", "credit": "", "file": "own/byoin-3.jpg"}}, {"headline": "八丈高校、噴火想定の避難訓練", "body": ["都立八丈高等学校は1日、全日制で2学期の始業式を行い、噴火を想定した避難訓練を実施した。個人や部活動の表彰も行われた。", "定時制でも同じ1日に2学期の始業式があった。", "同校は2024年9月2日の全日制の始業式でも、八丈富士が噴火したという想定の避難訓練を行った。専門家による八丈島の火山の講義も受けた。2025年9月1日の始業式後は、八高祭に向けた準備が始まった。", "1学 function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}

const EMB = document.getElementById("edition").textContent.trim();
if (EMB.startsWith("{")) render(JSON.parse(EMB)); else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
