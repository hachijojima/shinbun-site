<script type="application/json" id="edition">{"date": "2026-09-27", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-24T10:51:18+09:00", "prev": "/2026/09/26/", "next": "/2026/09/28/", "alerts": [], "weather": {"issued": "2026-09-27T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "雨", "main": "雨", "hachijo": "雨", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 22, "max": 28}]}, "koyomi": {"sunrise": "5:31", "sunset": "17:32", "moon": 15.3, "tide": {"place": "八丈島(神湊)", "high": [["5:13", 141], ["17:22", 139]], "low": [["11:18", 42], ["23:31", 28]]}}, "unko": null, "sora": {"status": "条件付きの可能性", "reason": "強風", "url": "https://x.com/ANA_flight_info/status/2103765266328895777", "at": "2026-09-26T17:35:00+09:00"}, "number": null, "top": {"headline": "町の医療証 10月1日に更新", "body": ["八丈町は10月1日から、乳幼児・義務教育就学児・高校生等の医療証を更新する。新しい医療証はうぐいす色で、9月下旬に各家庭へ発送する。町が25日に伝えた。", "古い医療証はうすいだいだい色。福祉健康課厚生係に返却するか、自分で裁断して破棄する。10月中旬までに新しい医療証が届かない場合は、厚生係に問い合わせる。ひとり親等医療証は更新の時期が別で、1月1日に更新する。", "問い合わせ先は福祉健康課厚生係（直通04996-2-5570）。役場代表は04996-2-1121。窓口は大賀郷の役場内で、受付は8時30分から17時15分。土日祝日と12月29日から1月3日は休み。", "広報はちじょう2025年10月号によると、2025年も10月1日に乳幼児・義務教育就学児の医療証を更新した。2024年10月号によると、2024年も10月1日に乳幼児・義務教育・高校生等の医療証を更新した。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260925/"}, {"label": "広報はちじょう 2024年10月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23121934/hachijo2410.pdf"}, {"label": "広報はちじょう 2025年10月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114458/hachijo2510.pdf"}], "label": "くらし", "audience": "島民", "thread_id": "t20260927-93", "id": "f9b197", "photo": {"type": "img", "src": "/img/kiji/f9b197.jpg?v=88876c", "og": "/img/kiji/f9b197-og.jpg?v=88876c", "s": "/img/kiji/f9b197-s.jpg?v=88876c", "m": "/img/kiji/f9b197-m.jpg?v=88876c", "caption": "八丈町役場の中", "credit": "", "file": "own/yakuba-naka-2.jpg"}}, "side": [], "shorts": [{"headline": "タコスカップ、27日ファイナル", "body": ["八丈町は27日8時30分から、汐間海岸で第43回タコスカップ（サーフィン大会）のファイナルを開く。町によると、天候不良で開催が心配されていたが、開催が決まったという。", "タコスカップは年に一度、島内外のサーファーが八丈島の波で競う大会で、26日と27日の2日間の日程。26日に開幕した。", "町の案内では、汐間海岸は島で唯一のサーフポイントで、海に向かって左から「カイザー」「サントス」「タコス」の3か所がある。底は玉石や溶岩質の岩のリーフで、中級以上から上級者向けとされ、リーフブーツの着用が勧められている。島の中心部から車で約30分かかり、駐車場は約10台分。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2103752473001550044"}, {"label": "八丈島観光協会", "url": "https://www.hachijo.gr.jp/specials/surfing/"}], "label": "文化", "audience": "両方", "thread_id": "t20260926-88", "followup": true, "id": "21274a", "photo": {"type": "img", "src": "/img/kiji/21274a.jpg?v=3d092e", "og": "/img/kiji/21274a-og.jpg?v=3d092e", "s": "/img/kiji/21274a-s.jpg?v=3d092e", "m": "/img/kiji/21274a-m.jpg?v=3d092e", "caption": "荒れ狂う八丈島の海 岩で砕ける波頭", "credit": "", "file": "ac/2904811.jpg"}}, {"headline": "三原小6年、八丈小島を調査", "body": ["八丈町立三原小学校の6年生が25日、総合的な学習の時間に八丈小島へ渡り、現地調査をした。小島で暮らした人から、当時の生活と全員離島までの経緯を聞いた。", "八丈小島では過疎化が進み、水道や医療、子どもの教育など生活条件の問題を背景に、住民が1966年3月、全員離島を求める請願書を八丈町議会へ提出した。町勢要覧によると、1969年1月から離島が始まり、同年6月には24世帯91人が島を離れて無人島となった。", "児童は資料だけでなく、実際の島に立ち、そこで暮らした人の記憶から歴史を聞いた。学校は今回の学びを、今後の八丈町のまちづくり学習へ生かすとしている。"], "sources": [{"label": "三原小", "url": "https://mihara-es.8jo.ed.jp/n/ne135d15bda8b"}, {"label": "広報はちじょう 2019年2月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23133640/hachijo1902.pdf"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/chousei/hachijojima-g/h-gaiyoh/"}, {"label": "八丈町「町勢要覧2024」", "url": "https://www.town.hachijo.tokyo.jp/toukei-siryou/pdf/hachijo2024.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20260927-92", "id": "9ed1ab", "photo": {"type": "img", "src": "/img/kiji/9ed1ab.jpg?v=29c05e", "og": "/img/kiji/9ed1ab-og.jpg?v=29c05e", "s": "/img/kiji/9ed1ab-s.jpg?v=29c05e", "m": "/img/kiji/9ed1ab-m.jpg?v=29c05e", "caption": "八丈富士と八丈小島", "credit": "", "file": "ac/3243860.jpg"}}, {"headline": "愛らんどフェアで八丈の3品完売", "body": ["東京愛らんどフェア2026（秋）の八丈島ブースで、ジャージープリン、くさや、うみかぜ椎茸が完売した。フェアは25日と26日に有楽町駅前広場で開かれ、八丈町が参加した。町によると、二日間で多くの人が訪れた。", "フェアは伊豆諸島・小笠原諸島の特産品を集めた催しで、島ごとにブースを出して展示と販売をする。時間は25日が11時から19時、26日が11時から18時で、入場は無料。26日の八丈島ブースでは、ジャージープリン、うみかぜ椎茸、ストレチアを売った。おすすめの島焼酎がわかる診断と、島焼酎の試飲もあった。島焼酎の販売もあった。", "町によると、5月の春のフェアでも八丈島ブースは全ての物販が完売した。今回の秋のフェアでは、25日の初日から多くの人が訪れた。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2103802826074009924"}, {"label": "東京観光財団", "url": "https://www.gotokyo.org/jp/spot/ev210/index.html"}, {"label": "東京愛らんど", "url": "https://x.com/tokyo_islands_/status/2103725019880898693"}], "label": "産業", "audience": "両方", "thread_id": "t20260917-61", "followup": true, "id": "9c659b", "photo": {"type": "img", "src": "/img/kiji/9c659b.jpg?v=73ec3f", "og": "/img/kiji/9c659b-og.jpg?v=73ec3f", "s": "/img/kiji/9c659b-s.jpg?v=73ec3f", "m": "/img/kiji/9c659b-m.jpg?v=73ec3f", "caption": "有楽町駅前の風景3", "credit": "", "file": "ac/28360861.jpg"}}, {"headline": "浅草カフェ、9月末で一時休業", "body": ["八丈島産ジャージー牛乳のソフトクリームやパフェを東京・浅草で出してきた浅草ジャージーカフェが、9月末で営業を一旦終える。来年4月の再開を予定している。同店が26日に伝えた。", "同店は7月17日に開業を知らせた。7月24日から31日に先行して営業し、8月1日から本開業とした。営業時間は12時から17時、月曜定休と案内した。八丈島ジャージー牛乳のソフトクリーム、明日葉のフレーバー、パフェを出すと案内した。", "1日には、9月は定休日なしで毎日営業すると知らせた。4日と10日には、ミルク、明日葉、両方を合わせたミックスのソフトクリームを毎日12時から17時に出すと伝えていた。同店は期間限定の店としている。"], "sources": [{"label": "浅草ジャージーカフェ", "url": "https://x.com/asakusa_jersey/status/2103666010821681228"}], "label": "産業", "audience": "両方", "thread_id": "t20260927-94", "id": "3a9a9f", "photo": {"type": "img", "src": "/img/kiji/3a9a9f.jpg?v=6db7fa", "og": "/img/kiji/3a9a9f-og.jpg?v=6db7fa", "s": "/img/kiji/3a9a9f-s.jpg?v=6db7fa", "m": "/img/kiji/3a9a9f-m.jpg?v=6db7fa", "caption": "八丈島の明日葉ソフト", "credit": "", "file": "ac/3194390.jpg"}}], "agenda": [{"date": "2026-09-27", "end": null, "text": "健康づくり講演会(フェルデンクライス)", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260901/"}, {"date": "2026-09-27", "end": null, "text": "タコスカップ2026 ファイナル", "url": "https://x.com/hachijomachi/status/2103752473001550 const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
