<script type="application/json" id="edition">{"date": "2026-09-14", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-24T10:48:39+09:00", "prev": "/2026/09/13/", "next": "/2026/09/15/", "alerts": [], "weather": {"issued": "2026-09-14T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 24, "max": 30}]}, "koyomi": {"sunrise": "5:23", "sunset": "17:50", "moon": 2.3, "tide": {"place": "八丈島(神湊)", "high": [["6:52", 139], ["18:28", 143]], "low": [["0:24", 40], ["12:34", 63]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "町議選は10月18日投票", "body": ["八丈町議会議員選挙が10月13日に告示され、18日に投票される。投票時間は午前7時から午後6時まで。", "NPO法人八丈島花の会によると、投票所は三根公民館、八丈町役場、樫立公民館、中之郷公民館、末吉公民館の5か所。期日前投票は10月14日から17日の午前8時30分から午後8時まで、八丈町役場で行う。投票所入場券を持参し、裏面の必要事項を先に記入しておく。", "町外にいる人の不在者投票は、八丈町選挙管理委員会へ郵送で請求する。告示日前でも請求できる。", "開票は投票日の午後8時から、役場の大会議室で始まり、一般の人も見られる。問い合わせは八丈町選挙管理委員会事務局（総務課）、電話04996-2-1121。"], "figure": {"type": "period", "start": "2026-10-13", "end": "2026-10-18", "label": "町議会議員選挙 告示から投票まで"}, "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/chousei/senkyo/chogisen/"}], "label": "町政", "audience": "島民", "thread_id": "t20260914-51", "id": "c99dbc", "photo": {"type": "img", "src": "/img/kiji/c99dbc.jpg?v=04627e", "og": "/img/kiji/c99dbc-og.jpg?v=04627e", "s": "/img/kiji/c99dbc-s.jpg?v=04627e", "m": "/img/kiji/c99dbc-m.jpg?v=04627e", "caption": "八丈町中之郷出張所・中之郷公民館", "credit": "", "file": "own/nakanogo-shucchojo-1.jpg"}}, "side": [], "shorts": [{"headline": "SUN HATCH、12日開店", "body": ["農家のキッチンカー「SUN HATCH」が12日、底土港近くの八丈興発前で営業を始めた。この日は16時まで開店すると案内した。", "SUN HATCHは9日に今月から営業を始めると伝えていた。ユリの栽培・直売をする八丈島西野園芸によると、12日が営業初日だった。", "13日は三根の民芸あき本店の向かいで、16時まで営業すると知らせた。SUN HATCHによると、初日には多くの客が来た。"], "sources": [{"label": "西野園芸", "url": "https://x.com/lily_8jo/status/2098620185632711075"}, {"label": "SUN HATCH", "url": "https://x.com/SUNHATCH_8jo"}], "label": "産業", "audience": "両方", "thread_id": "t20260914-52", "id": "563331", "photo": {"type": "img", "src": "/img/kiji/563331.jpg?v=eafee6", "og": "/img/kiji/563331-og.jpg?v=eafee6", "s": "/img/kiji/563331-s.jpg?v=eafee6", "m": "/img/kiji/563331-m.jpg?v=eafee6", "caption": "八丈島 底土港", "credit": "", "file": "ac/34536109.jpg"}}, {"headline": "リードパーク、夏の催し22日まで", "body": ["リードパークリゾート八丈島は、ディナーバイキングとプールが22日までと案内した。底土海水浴場への送迎は23日ごろまでという。同ホテルは、NPO法人八丈島観光レクリエーション研究会主催の光るキノコのナイトウォークも30日までと案内した。", "同ホテルは、8月より人が少なくなるとしている。同ホテルは2025年12月23日、2026年夏シーズンを7月18日から9月22日として宿泊予約の受け付けを始めた。サマーバイキング、海水浴場送迎、星空観賞会付きのプランを用意するとした。7月17日には、翌18日からプールを開き、送迎バスの運行と屋上での星を見る会が始まると知らせた。", "送迎バスは、7月20日の案内でホテル発が10時30分前後、帰りは16時前後の予定。ディナーバイキングは、8月4日の案内で17時50分開店、ラスト入場は19時15分。", "光るキノコナイトウォーク2026は、研究会が主催する。東京都の東京宝島事業の一つとして行う。期間は7月25日から9月30日まで。時間は19時30分から20時30分で、集合は19時30分。遅れると途中からは参加できない。雨天でも行うが、荒天時や安全の確保が難しい場合は中止になる。", "光るキノコの森は2025年10月の台風22号・23号で大きな被害を受け、ツアーは休止していた。"], "sources": [{"label": "リードパークリゾート八丈島", "url": "https://x.com/lidohotels8jo/status/2093654142069662117"}, {"label": "東京都「光るキノコナイトウォーク2026」", "url": "https://www.t-treasureislands.metro.tokyo.lg.jp/news/npo2026725.pdf"}], "label": "産業", "audience": "両方", "thread_id": "t20260914-53", "id": "8e5e79", "photo": {"type": "img", "src": "/img/kiji/8e5e79.jpg?v=717587", "og": "/img/kiji/8e5e79-og.jpg?v=717587", "s": "/img/kiji/8e5e79-s.jpg?v=717587", "m": "/img/kiji/8e5e79-m.jpg?v=717587", "caption": "リードパークリゾート八丈島", "credit": "", "file": "own/lido-park-1.jpg"}}, {"headline": "三原中1年が探究の中間発表", "body": ["八丈町立三原中学校は11日、1年生が探究学習の中間発表として意見発表会を開いた。生徒は探究テーマに取り組む理由、現時点までの学び、自分の考えを発表した。", "同校によると、発表は以前の弁論大会の形式ではなく、探究学習のプレゼン形式で行った。ゴールには届いていない段階での発表で、発表後にグループ討議をした。これから必要な視点やゴールの決め方について、多くのヒントを得たという。", "1年生の成果物には「冒険という名の探究」という言葉があった。同校は3月に学習発表会を予定している。"], "sources": [{"label": "三原中", "url": "https://mihara-jhs.8jo.ed.jp/n/n6ef30ed001c0"}], "label": "教育", "audience": "島民", "thread_id   return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}

      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
