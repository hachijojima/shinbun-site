<script type="application/json" id="edition">{"date": "2026-10-15", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-27T16:44:58+09:00", "prev": "/2026/10/14/", "next": "/2026/10/16/", "alerts": [], "weather": {"issued": "2026-10-15T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 18, "max": 26}]}, "koyomi": {"sunrise": "5:44", "sunset": "17:09", "moon": 3.7, "tide": {"place": "八丈島(神湊)", "high": [["7:58", 119], ["18:27", 129]], "low": [["0:57", 20], ["12:59", 83]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "八丈町議選、12議席に15人", "body": ["八丈町議会議員選挙（定数12）は13日に告示され、現職8人、元職1人、新人6人の計15人が立候補を届け出た。3人が落選する選挙戦となり、18日に投票と開票が行われる。12日時点の選挙人名簿登録者は5603人。", "15人が12の席を争う形は、4年前の2022年と同じだ。その前の2018年は定数14に14人しか立たず、無投票で全員が当選した。定数は2022年に14から12に減っている。2回続けて選挙戦となり、島の有権者が18日、12人を選ぶ。", "東京新聞によると、立候補者は届け出順に、岩崎由美氏（66、無所属、現職）、沖山恵子氏（64、無所属、元職）、伊藤奨氏（35、無所属、新人）、前崎隆氏（56、都民ファーストの会、新人）、浅沼憲春氏（71、自民党、現職）、佐々木丈氏（57、無所属、新人）、山下則子氏（71、公明党、現職）、金川孝幸氏（71、無所属、現職）、伊勢崎唯氏（55、無所属、新人）、佐藤誠氏（76、無所属、新人）、山下巧氏（73、無所属、現職）、沖山賢吾氏（49、無所属、新人）、沖山昇氏（65、無所属、現職）、浅沼清孝氏（75、無所属、現職）、浅沼碧海氏（38、無所属、現職）。最も若いのは伊藤氏の35歳、最も年上は佐藤氏の76歳となっている。選挙ドットコムの候補者一覧によると、女性は岩崎、沖山恵子、山下則子の3氏。", "2022年に当選した12人のうち、再び立ったのは8人だ。真田幸久、山本ただし、奥山さちこ、浅沼たかあきの4氏は立候補していない。2022年は公明党が山下則子、山本の両氏で2議席を得たが、今回の同党の候補は山下氏1人となった。2022年に現職ながら次点で落選した沖山恵子氏は、元職として再び挑む。", "2022年の選挙では、現職10人と新人5人の計15人が立ち、そのうち女性が5人だった。投票率は67.57%で、選挙戦となった2014年より11.1ポイント低かった。当日有権者は5970人。最も多く票を集めたのは新人だった浅沼碧海氏の520票で、真田氏の460票、沖山昇氏の約395票が続いた。12位で当選した金川氏は165票。次点の沖山恵子氏は約140票、浅沼れつ氏は122票、現職のみやざき陽子氏は106票で落選した。当選12人は現職8人と新人4人で、女性は3人、平均年齢は61.67歳だった。", "有権者は減り続けている。2022年の告示時点の名簿登録者は6035人で、今回は5603人になった。2022年の選挙は、12位と次点の差が約25票だった。", "投票は18日7時から18時まで、三根公民館、八丈町役場、樫立公民館、中之郷公民館、末吉公民館の5か所で受け付ける。期日前投票は17日まで、役場で8時30分から20時まで受け付けている。開票は18日20時から役場の大会議室で始まり、一般の人も見ることができる。"], "figure": null, "sources": [{"label": "東京新聞", "url": "https://www.tokyo-np.co.jp/article/521446"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/chousei/senkyo/chogisen/"}, {"label": "広報はちじょう 2022年4月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23125707/hachijo2204.pdf"}, {"label": "選挙ドットコム", "url": "https://go2senkyo.com/local/senkyo/26406"}, {"label": "政治山", "url": "https://seijiyama.jp/article/news/el20221011-29.html"}], "label": "町政", "audience": "島民", "thread_id": "t20261003-15", "followup": true, "id": "30d910", "photo": {"type": "img", "src": "/img/kiji/30d910.jpg?v=6f58c5", "og": "/img/kiji/30d910-og.jpg?v=6f58c5", "s": "/img/kiji/30d910-s.jpg?v=6f58c5", "m": "/img/kiji/30d910-m.jpg?v=6f58c5", "caption": "選挙+投票箱", "credit": "", "file": "ac/3607816.jpg"}, "edited": "2026-11-27T16:44:53+09:00"}, "side": [], "shorts": [{"headline": "八丈病院、一般病床の稼働5割", "body": ["町立八丈病院の一般病床52床に対し、入院は25人で5割程度だと、病院が8月7日の運営協議会で答えた。運営協議会は病院会議室で開かれ、令和7年度決算などを議題にした。広報はちじょう2026年10月号の議事要旨に載った。", "病院は、入院患者の減少は収入に大きく影響するので経営会議で検討していると答えた。減った要因には、人口の減少、外来で済むケースの増加、島外の病院で急性期の治療後にリハビリも済ませて帰る人の増加を挙げた。", "令和7年度の分娩は14件。今年4月から6月24日の出産は5件で、広尾病院が1件、東京女子医大が1件、都外が3件だった。今後の予定19件のうち広尾病院は6件で、ほか13件は未定。広尾病院は敷地内の宿泊施設の建て替えのため、近隣のホテルを借り上げ、島外で出産する人の宿泊先にした。家族も泊まれる。", "看護師は年度の初めは足りていたが、その後の退職で欠員となり、派遣看護師で解消する見込み。派遣の経費は正職員と同程度という。訪問看護は実人数10数名を訪問していて、今は医療保険の使える人だけだが、介護保険の人も訪問できるよう整備を進める。入院に必要な衣類などは、入院セットを提供する㈱エランが対応できるようになった。料金は㈱エランに直接支払う。大腸検査で下剤を飲むときの待機場所の近くのトイレも使えるようにした。"], "sources": [{"label": "八丈町", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=23"}], "label": "くらし", "audience": "島民", "thread_id": "t20261015-129", "id": "30010f", "photo": {"type": "img", "src": "/img/kiji/30010f.jpg?v=6aa5a7", "og": "/img/kiji/30010f-og.jpg?v=6aa5a7", "s": "/img/kiji/30010f-s.jpg?v=6aa5a7", "m": "/img/kiji/30010f-m.jpg?v=6aa5a7", "caption": "町立八丈病院", "credit": "", "file": "own/byoin-2.jpg"}}, {"headline": "八丈島の観光客7.3%増", "body": ["八丈町産業観光課が推計をまとめた。2026年4月から8月の八丈島の観光客は48,855人だった。前年同期の45,531人から7.3%増えた。広報はちじょう2026年10月号が伝えた。", "同じ期間の来島者は、空路49,990人、海路9,990人の合計59,980人。前年同期は空路45,797人、海路10,378人の合計56,175人だった。海路の4月と7月の数には、大型客船の寄港分が含まれる。", "来島者の合計は、4月10,200人、5月12,141人、6月7,534人だった。7月は13,994人、8月は16,111人だった。観光客の前年比は、4月6.3%増、5月24.9%増、6月7.1%減、7月13.9%増、8月2.1%減だった。", "広報はちじょう2026年7月号によると、4月と5月の観光客推計は前年同期比で17.2%増えていた。"], "sources": [{"label": "八丈町", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=24"}, {"label": "広報はちじょう 2026年7月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/31160020/hachijo2607.pdf"}], "label": "産業", "audience": "両方", "thread_id": "t20261015-130", "id": "bb9a40", "photo": {"type": "img", "src": "/img/kiji/bb9a40.jpg?v=0a7d4e", "og": "/img/kiji/bb9a40-og.jpg?v=0a7d4e", "s": "/img/kiji/bb9a40-s.jpg?v=0a7d4e", "m": "/img/kiji/bb9a40-m.jpg?v=0a7d4e", "caption": "八丈島観光協会", "credit": "", "file": "own/kanko-kyokai-1.jpg"}}, {"headline": "法務局の登記案内、11月に役場", "body": ["八丈町によると、東京法務局の職員が役場のウェブ会議システムを通じて、登記申請の手続を案内する。「登記手続案内」は11月10日と11日に、役場の相談室5で行う。完全予約制で、予約した人だけが対象になる。", "案内するのは不動産登記と商業・法人登記の申請手続。相談は9時から16時（12時から13時を除く）で、1回20分。予約のときに「八丈町役場のウェブ会議システムからの利用」と伝える。11月分の予約は11月9日12時まで。次は12月8日と9日の予定。", "問い合わせは、東京法務局の不動産登記が03-5213-1330、商業・法人登記が03-5213-1337。町の窓口は建設課管財係の04996-2-1124。", "相続登記は2024年4月1日から義務化され、相続で取得したことを知った日から3年以内に申請する。住所等の変更登記も2026年4月1日から義務化された。広報はちじょう2026年2月号にも、同様の手続案内の記事が載っている。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261014/"}, {"label": "広報はちじょう 2026年2月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/22181202/hachijo2602.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20261015-53", "id": "cca278", "photo": {"type": "img", "src": "/img/kiji/cca278.jpg?v=81f8d3", "og": "/img/kiji/cca278-og.jpg?v=81f8d3", "s": "/img/kiji/cca278-s.jpg?v=81f8d3", "m": "/img/kiji/cca278-m.jpg?v=81f8d3", "caption": "住宅の登記", "credit": "", "file": "ac/29624062.jpg"}}, {"headline": "東京からの船、3日ぶり入港", "body": ["14日朝、東京からの船が八丈島に着き、11日以来3日ぶりの入港となった。13日夜発（14日朝八丈島着）の東海汽船株式会社のさるびあ丸の便だ。八丈島観光協会は、底土港への入港を9時15分、出港を9時40分の予定と案内した。", "13日朝着の便は欠航だった。ANAは羽田発の1便（1891便）が14日に到着し、終日通常運航だったと同協会が案内した。", "東海汽船の八丈島営業所は、あおがしま丸が八重根漁港から就航し、乗船客は9時ごろまでに来るよう案内した。八丈島観光協会は、あおがしま丸の出港を9時30分の予定と案内した。"], "sources": [{"label": "八丈島観光協会", "url": "https://x.com/i/status/2110144814687846499"}], "label": "くらし", "audience": "両方", "thread_id": "t20261015-136", "id": "9679a0", "photo": {"type": "img", "src": "/img/kiji/9679a0.jpg?v=4d43c1", "og": "/img/kiji/9679a0-og.jpg?v=4d43c1", "s": "/img/kiji/9679a0-s.jpg?v=4d43c1", "m": "/img/kiji/9679a0-m.jpg?v=4d43c1", "caption": "底土港", "credit": "", "file": "ac/1972114.jpg"}}], "agenda": [{"date": "2026-10-16", "end": null, "text": "個人演説会", "url": "https://x.com/okymkng/status/2110027648575648188"}, {"date": "2026-10-17", "end": null, "text": "こどもワクワクおうえんプロジェクト(親子向け)", "url": "https://okago-es.8jo.ed.jp/n/n6ef23a1674c0"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "雨の日の美術館の窓", "body": ["雨の日の美術館では、入口の傘立てが混み合う。濡れた傘を置き、靴の底を少し拭いて展示室へ入る。絵の前で長く立っても、外が雨であることを忘れられる。[雨の日の美術館](https://note.com/rosy_rat/n/n80d4762b55c9)には、晴天の休日と違う歩幅がある。", "展示を終えてカフェへ入ると、大きな窓の外に庭が広がっていた。濡れた葉の緑は濃く、枝先には水滴が残っている。絵の具を使った作品を見てきたばかりなので、その色が妙に気になる。ガラス越しの庭にも額縁があるようで、飲みかけのカフェラテをしばらく置いた。", "テーブルの上のカップを持ち上げると、窓の向こうに自分の手が映った。絵の外にいるつもりだったのに、ガラス一枚を通して部屋の景色へ入り込んでいた。", "作品名も作家名もない庭の景色は、雨がやめば別の姿になる。展示室の作品は来週も同じ位置に掛かっているだろう。窓の外だけは次に来ても同じものを見ることができない。少し得をした気がして、帰りは傘を忘れずに持った。"]}, "kyoku": {"artist": "BO GUMBOS", "title": "泥んこ道を二人", "text": "ニューオーリンズの泥臭いリズムが、BO GUMBOSの音に賑やかな体温を与えています。きれいな舗装路ではなく、靴が汚れるような道を二人で行く。その景色を、どんとの歌声が絵葉書のようには歌いません。笑いと寂しさが一緒くたになり、前へ進むほど余計な格好が落ちていく。道が悪いからこそ足取りを合わせる。二人で歩く歌には、そんな優しさもあります。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/cc/8b/2e/cc8b2ebe-8cb3-ca0c-2f19-4c64e54b57bc/jacket_MHCL30291B00Z_550.jpg/300x300bb.jpg", "al function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}

      ${shimaSection(e)}
    </aside>
  </div>

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
  wabunKakko(document.body);
}
