<script type="application/json" id="edition">{"date": "2026-10-15", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-24T10:54:49+09:00", "prev": "/2026/10/14/", "next": "/2026/10/16/", "alerts": [], "weather": {"issued": "2026-10-15T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 18, "max": 26}]}, "koyomi": {"sunrise": "5:44", "sunset": "17:09", "moon": 3.7, "tide": {"place": "八丈島(神湊)", "high": [["7:58", 119], ["18:27", 129]], "low": [["0:57", 20], ["12:59", 83]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "町議選に15人が立候補", "body": ["八丈町議会議員選挙(定数12)が13日に告示され、15人が立候補を届け出た。東京新聞デジタルによると、内訳は現職8人、元職1人、新人6人。差し引き3人が議席を得られない。", "投票日は18日で、投票時間は7時から18時まで。期日前投票は14日から17日まで、8時30分から20時まで、八丈町役場で行っている。", "広報はちじょう2022年4月号によると、町議会議員選挙の定数は2022年10月の選挙に向けて12名に改正された。問い合わせは八丈町選挙管理委員会事務局(総務課内)、電話04996-2-1121。"], "figure": null, "sources": [{"label": "東京新聞", "url": "https://www.tokyo-np.co.jp/article/521446"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/chousei/senkyo/chogisen/"}, {"label": "広報はちじょう 2022年4月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23125707/hachijo2204.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20261003-15", "followup": true, "id": "30d910", "photo": {"type": "img", "src": "/img/kiji/30d910.jpg?v=6f58c5", "og": "/img/kiji/30d910-og.jpg?v=6f58c5", "s": "/img/kiji/30d910-s.jpg?v=6f58c5", "m": "/img/kiji/30d910-m.jpg?v=6f58c5", "caption": "選挙+投票箱", "credit": "", "file": "ac/3607816.jpg"}}, "side": [], "shorts": [{"headline": "八丈病院、一般病床の稼働5割", "body": ["町立八丈病院の一般病床52床に対し、入院は25人で5割程度だと、病院が8月7日の運営協議会で答えた。運営協議会は病院会議室で開かれ、令和7年度決算などを議題にした。広報はちじょう2026年10月号の議事要旨に載った。", "病院は、入院患者の減少は収入に大きく影響するので経営会議で検討していると答えた。減った要因には、人口の減少、外来で済むケースの増加、島外の病院で急性期の治療後にリハビリも済ませて帰る人の増加を挙げた。", "令和7年度の分娩は14件。今年4月から6月24日の出産は5件で、広尾病院が1件、東京女子医大が1件、都外が3件だった。今後の予定19件のうち広尾病院は6件で、ほか13件は未定。広尾病院は敷地内の宿泊施設の建て替えのため、近隣のホテルを借り上げ、島外で出産する人の宿泊先にした。家族も泊まれる。", "看護師は年度の初めは足りていたが、その後の退職で欠員となり、派遣看護師で解消する見込み。派遣の経費は正職員と同程度という。訪問看護は実人数10数名を訪問していて、今は医療保険の使える人だけだが、介護保険の人も訪問できるよう整備を進める。入院に必要な衣類などは、入院セットを提供する㈱エランが対応できるようになった。料金は㈱エランに直接支払う。大腸検査で下剤を飲むときの待機場所の近くのトイレも使えるようにした。"], "sources": [{"label": "八丈町", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=23"}], "label": "くらし", "audience": "島民", "thread_id": "t20261015-129", "id": "30010f", "photo": {"type": "img", "src": "/img/kiji/30010f.jpg?v=6aa5a7", "og": "/img/kiji/30010f-og.jpg?v=6aa5a7", "s": "/img/kiji/30010f-s.jpg?v=6aa5a7", "m": "/img/kiji/30010f-m.jpg?v=6aa5a7", "caption": "町立八丈病院", "credit": "", "file": "own/byoin-2.jpg"}}, {"headline": "八丈島の観光客7.3%増", "body": ["八丈町産業観光課が推計をまとめた。2026年4月から8月の八丈島の観光客は48,855人だった。前年同期の45,531人から7.3%増えた。広報はちじょう2026年10月号が伝えた。", "同じ期間の来島者は、空路49,990人、海路9,990人の合計59,980人。前年同期は空路45,797人、海路10,378人の合計56,175人だった。海路の4月と7月の数には、大型客船の寄港分が含まれる。", "来島者の合計は、4月10,200人、5月12,141人、6月7,534人だった。7月は13,994人、8月は16,111人だった。観光客の前年比は、4月6.3%増、5月24.9%増、6月7.1%減、7月13.9%増、8月2.1%減だった。", "広報はちじょう2026年7月号によると、4月と5月の観光客推計は前年同期比で17.2%増えていた。"], "sources": [{"label": "八丈町", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=24"}, {"label": "広報はちじょう 2026年7月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/31160020/hachijo2607.pdf"}], "label": "産業", "audience": "両方", "thread_id": "t20261015-130", "id": "bb9a40", "photo": {"type": "img", "src": "/img/kiji/bb9a40.jpg?v=0a7d4e", "og": "/img/kiji/bb9a40-og.jpg?v=0a7d4e", "s": "/img/kiji/bb9a40-s.jpg?v=0a7d4e", "m": "/img/kiji/bb9a40-m.jpg?v=0a7d4e", "caption": "八丈島観光協会", "credit": "", "file": "own/kanko-kyokai-1.jpg"}}, {"headline": "法務局の登記案内、11月に役場", "body": ["八丈町によると、東京法務局の職員が役場のウェブ会議システムを通じて、登記申請の手続を案内する。「登記手続案内」は11月10日と11日に、役場の相談室5で行う。完全予約制で、予約した人だけが対象になる。", "案内するのは不動産登記と商業・法人登記の申請手続。相談は9時から16時(12時から13時を除く)で、1回20分。予約のときに「八丈町役場のウェブ会議システムからの利用」と伝える。11月分の予約は11月9日12時まで。次は12月8日と9日の予定。", "問い合わせは、東京法務局の不動産登記が03-5213-1330、商業・法人登記が03-5213-1337。町の窓口は建設課管財係の04996-2-1124。", "相続登記は2024年4月1日から義務化され、相続で取得したことを知った日から3年以内に申請する。住所等の変更登記も2026年4月1日から義務化された。広報はちじょう2026年2月号にも、同様の手続案内の記事が載っている。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261014/"}, {"label": "広報はちじょう 2026年2月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/22181202/hachijo2602.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20261015-53", "id": "cca278", "photo": {"type": "img", "src": "/img/kiji/cca278.jpg?v=81f8d3", "og": "/img/kiji/cca278-og.jpg?v=81f8d3", "s": "/img/kiji/cca278-s.jpg?v=81f8d3", "m": "/img/kiji/cca278-m.jpg?v=81f8d3", "caption": "住宅の登記", "credit": "", "file": "ac/29624062.jpg"}}, {"headline": "東京からの船、3日ぶり入港", "body": ["14日朝、東京からの船が八丈島に着き、11日以来3日ぶりの入港となった。13日夜発(14日朝八丈島着)の東海汽船株式会社のさるびあ丸の便だ。八丈島観光協会は、底土港への入港を9時15分、出港を9時40分の予定と案内した。", "13日朝着の便は欠航だった。ANAは羽田発の1便(1891便)が14日に到着し、終日通常運航だったと同協会が案内した。", "東海汽船の八丈島営業所は、あおがしま丸が八重根漁港から就航し、乗船客は9時ごろまでに来るよう案内した。八丈島観光協会は、あおがしま丸の出港を9時30分の予定と案内した。"], "sources": [{"label": "八丈島観光協会", "url": "https://x.com/i/status/2110144814687846499"}], "label": "くらし", "audience": "両方", "thread_id": "t20261015-136", "id": "9679a0", "photo": {"type": "img", "src": "/img/kiji/9679a0.jpg?v=4d43c1", "og": "/img/kiji/9679a0-og.jpg?v=4d43c1", "s": "/img/kiji/9679a0-s.jpg?v=4d43c1", "m": "/img/kiji/9679a0-m.jpg?v=4d43c1", "caption": "底土港", "credit": "", "file": "ac/1972114.jpg"}}], "agenda": [{"date": "2026-10-16", "end": null, "text": "個人演説会", "url": "https://x.com/okymkng/status/2110027648575648188"}, {"date": "2026-10-17", "end": null, "text": "こどもワクワクおうえんプロジェクト(親子向け)", "url": "https://okago-es.8jo.ed.jp/n/n6ef23a1674c0"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "雨の日の美術館の窓", "body": ["雨の日の美術館では、入口の傘立てが混み合う。濡れた傘を置き、靴の底を少し拭いて展示室へ入る。絵の前で長く立っても、外が雨であることを忘れられる。[雨の日の美術館](https://note.com/rosy_rat/n/n80d4762b55c9)には、晴天の休日と違う歩幅がある。", "展示を終えてカフェへ入ると、大きな窓の外に庭が広がっていた。濡れた葉の緑は濃く、枝先には水滴が残っている。絵の具を使った作品を見てきたばかりなので、その色が妙に気になる。ガラス越しの庭にも額縁があるようで、飲みかけのカフェラテをしばらく置いた。", "テーブルの上のカップを持ち上げると、窓の向こうに自分の手が映った。絵の外にいるつもりだったのに、ガラス一枚を通して部屋の景色へ入り込んでいた。", "作品名も作家名もない庭の景色は、雨がやめば別の姿になる。展示室の作品は来週も同じ位置に掛かっているだろう。窓の外だけは次に来ても同じものを見ることができない。少し得をした気がして、帰りは傘を忘れずに持った。"]}, "kyoku": {"artist": "BO GUMBOS", "title": "泥んこ道を二人", "text": "ニューオーリンズの泥臭いリズムが、BO GUMBOSの音に賑やかな体温を与えています。きれいな舗装路ではなく、靴が汚れるような道を二人で行く。その景色を、どんとの歌声が絵葉書のようには歌いません。笑いと寂しさが一緒くたになり、前へ進むほど余計な格好が落ちていく。道が悪いからこそ足取りを合わせる。二人で歩く歌には、そんな優しさもあります。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/cc/8b/2e/cc8b2ebe-8cb3-ca0c-2f19-4c64e54b57bc/jacket_MHCL30291B00Z_550.jpg/300x300bb.jpg", "album": "1989", "url": "https://music.apple.com/jp/album/%E6%B3%A5%E3%82%93%E3%81%93%E9%81%93%E3%82%92%E4%BA%8C%E4%BA%BA/1536787188?i=1536787192&uo=4"}}, "ronten": null, "weekly": [], "ichimen_week": [{"date": "2026-10-14", "url": "/2026/10/14/0adb3b/", "headlines": ["町議選が告示、18日投開票"]}, {"date": "2026-10-13", "url": "/2026/10/13/ed42a4/", "headlines": ["八丈高チームが明日葉料理で入賞"]}, {"date": "2026-10-12", "url": "/2026/10/12/f37a9a/", "headlines": ["あさぬま、生鮮入荷なし"]}, {"date": "2026-10-11", "url": "/2026/10/11/9bd852/", "headlines": ["あさぬま、じゃがいも売り切れ"]}, {"date": "2026-10-10", "url": "/2026/10/10/09b163/", "headlines": ["NHKが台風1年の八丈島を放送"]}, {"date": "2026-10-09", "url": "/2026/10/09/02ced7/", "headlines": ["さるびあ丸、8日朝の入港を案内"]}, {"date": "2026-10-08", "url": "/2026/10/08/fa54e0/", "headlines": ["災害ごみ、搬入先を南原へ"]}], "population": {"as_of": "2026-10-01", "people": 6499, "people_diff": -24, "households": 4028, "households_diff": -21, "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/10/30114611/hachijo2611.pdf", "ido": {"in": 6, "birth": 2, "out": 19, "death": 10}}, "giin": [], "hyakunen": {"then": {"a   あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
/* 島の足:東海汽船の表を、島の人が読む形に並べ直す(言葉は表のまま)。「島のいま」の「船」の項になる */
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  // 載せるのは、けさ八丈島に着く東京からの船(昨晩発)と、八丈島→青ヶ島。今晩発・八丈島→東京・青ヶ島→八丈島は載せない(利用者の指定)
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    // 定型の案内文は「条件付き」、運休日や更新予定は状態の列へ(言葉は表のまま)
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
/* 島のいまの「催し」:先7日の催しを数行(夜に重なりをまとめた desk/korekara)。前の形(today/soon)の号もそのまま並べる */
/* 催しの日:曜日を必ず添える(人は曜日で予定を捉える。2026-10-29 利用者)。発行月なら「31日(土)」、別の月は「11月1日(日)」 */
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const MEDAL={"🥇":1,"🥈":2,"🥉":3};
const rankMark = m => MEDAL[m]?`<i class="r${MEDAL[m]}" aria-label="${MEDAL[m]}位">${MEDAL[m]}</i>`:`<i class="r0" aria-hidden="true"></i>`;
/* 議員動静:1日ごと。直近の発信の日が新しい順、同じ日は pt(議員の仕事の日2、ほか1)の多い順に上位5人。日と pt が同じ人は同じメダル。「分類：題材」で1行。1人1行、本人の投稿へのリンク */
function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h"><a href="/government/members/">議員動静</a></h2>
    <ol class="giin">${g.map(r=>{const nm=`${rankMark(r.medal)}<b>${esc(r.name)}</b>`;
      return `<li>${r.slug?`<a class="nm" href="/government/members/${esc(r.slug)}/">${nm}</a>`:`<span class="nm">${nm}</span>`}${r.at?`<a class="ps${r.kind&&!r.duty?" nd":""}" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.name+" "+(r.kind?r.kind+" ":"")+(r.what||""))}"><time>${esc(r.when)}</time><q>${r.kind?`<span class="ik${r.duty?"":" nd"}">${esc(r.kind)}</span> `:""}${esc(r.what||"")}</q></a>`:`<span class="ps"><time>発信なし</time></span>`}</li>`;}).join("")}</ol><p class="more"><a href="/government/assembly/">議員・議会</a><a href="/government/members/" style="margin-left:1.2em">全員の一覧</a></p></section>`;
}
/* 100年前のきょうと、きょう(edition の hyakunen。絵は組むときに作ってある)。上が最高、下が最低 */
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
/* 島のいま:注意報・天気・暦・船・人口を1つの欄に。値は発表のまま */
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u), sora=soraRow(e.sora), ev=evLines(e).slice(0,8);
  const diff=n=>n==null?"":`<small>(${n>0?"+":n<0?"−":"±"}${Math.abs(n).toLocaleString()})</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const st=e.sora&&e.sora.at?ymd(e.sora.at.slice(0,10)):null, sh=e.sora&&e.sora.at?hm(e.sora.at):"";
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
/* きょうの一曲:CSV の文章のまま。ジャケットは見つかった日だけ(Apple の画像を Apple Music へのリンクつきで) */
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section class="kyoku" id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h"><a href="/song/">きょうの一曲</a></h2>

      <div><h3>${k.day?`<a class="hl" href="${esc(k.day)}song/">${esc(k.title)}</a>`:esc(k.title)}</h3><p class="who">${esc(k.artist)}</p></div></div>
    <p class="txt">${esc(k.text)}</p>
    <p class="kiku"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTubeで聴く</a>${a&&a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Apple Musicで聴く</a>`:""}</p></section>`;
}
/* 島のたより:CSV の文章のまま。本文の [語](URL) だけリンクにする */
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){

}

  document.title = /^\/\d{4}\/\d{2}\/\d{2}\//.test(location.pathname) ? `八丈島新聞 ${hiduke(e.date)}` : "八丈島新聞";

  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top" id="a1">
      ${lbl(e.top)}<h2>${hl(e,e.top)}</h2>
      ${figure(e.top.photo)}
      <div class="honbun">${paras(e.top.body)}${src(e.top.sources)}</div>
    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];
      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>
      ${s.id?`<p class="ld">${esc(b[0])}</p>`:`<div class="honbun">${paras(b)}${src(s.sources)}</div>`}
    </article>`;}).join("")}</div>`:""}`:""}
    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}
    ${e.ronten?`<section class="men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="tv" aria-label="FM八丈島テレビ">
        <div class="head"><h2 class="band onair"><a href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><i aria-hidden="true"></i>ON AIR</a></h2><a class="chl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><img class="ch" src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div>
        <div style="position:relative;width:100%;height:0;padding-top:calc(56.25% + 44px)"><iframe src="${TV_EMBED}" title="FM八丈島テレビ" style="position:absolute;inset:0;display:block;width:100%;height:100%;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      </section>

      </section>`:""}

  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};
  [...new Set([...document.querySelectorAll("figure.embed")].map(f=>f.dataset.provider))].forEach(p=>{
    if(!need[p]) return; const sc=document.createElement("script"); sc.src=need[p]; sc.async=true; document.body.appendChild(sc);
  });
}
if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
