<style>
:root{
  --paper:#ffffff; --ink:#000000; --ink-2:#4d4d4d; --ink-3:#8a8a8a; --rule:#000000; --hair:#c8c8c8;
  --band-bg:#000000; --band-ink:#ffffff; --red:#d1001f; --photo:#e4e4e4;
  --min:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --goth:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  color-scheme:only light; box-sizing:border-box;   /* いつも白地(端末のダークモードに合わせない。2026-10-24 決定) */
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--min);font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:.2em}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 40px}

/* ── 題字と耳 ── */
.mast{padding:18px 0 10px}
.daiji{font-weight:800;font-size:clamp(44px,11vw,96px);line-height:1;letter-spacing:-.02em;text-align:center;white-space:nowrap}
.dateline{display:flex;justify-content:space-between;align-items:baseline;gap:1em;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:6px 0;font-family:var(--goth);font-size:clamp(14px,3.8vw,21px);font-weight:700;white-space:nowrap}   /* スマホでも1行 */
.deg{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:600}   /* 和文の書体だと「°」が全角幅で間が空く */

/* ── 帯見出し(白抜き) ── */
.band{display:inline-block;background:var(--band-bg);color:var(--band-ink);font-family:var(--goth);font-weight:900;
  font-size:13px;letter-spacing:.08em;padding:2px 10px 3px;margin:0 0 12px}
.men{padding-top:20px}

/* ── 一面 ── */
.ichimen{display:grid;gap:20px;padding-top:18px}
.top h2{font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1.22;letter-spacing:-.01em;margin-bottom:10px}   /* 一面の2本は同じ大きさ */
@media (min-width:720px){.top h2{font-size:clamp(38px,5.2vw,50px)}}
.top2{border-top:1px solid var(--rule);margin-top:28px;padding-top:20px}
.top .sode{font-family:var(--goth);font-weight:700;font-size:17px;line-height:1.5;margin-bottom:14px}
figure{margin:0 0 12px}
.photo{aspect-ratio:3/2;background:var(--photo);display:grid;place-items:center;color:var(--ink-3);font-family:var(--goth);font-size:13px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.zu{display:block;width:100%;height:auto;max-width:520px}
.zu text{font-family:var(--goth);fill:var(--ink)}
.zu .zt{font-size:17px;font-weight:900}
.zu .zs{font-size:13px;fill:var(--ink-2)}
.zu .zn{font-size:26px;font-weight:900;fill:var(--red)}
.zu .zm{font-size:13px;font-weight:700}
.zu .zw{font-size:11px;fill:var(--ink-3)}
.zu rect.on{fill:var(--ink)}
.zu rect.off{fill:none;stroke:var(--hair)}
.zu rect.today{fill:none;stroke:var(--red);stroke-width:3}
.zu .don{fill:var(--paper);font-size:12px;font-weight:700}
.zu .doff{font-size:12px;fill:var(--ink-2)}
.zu-fig{border-top:1px solid var(--rule);padding-top:10px}
.zt-h{font-family:var(--goth);font-weight:900;font-size:17px;margin-bottom:6px}
.zu-tbl td{font-weight:700;white-space:nowrap}
.zu-tbl td.warn{color:var(--red)}
.zu-tbl th{white-space:normal;font-weight:500}
.embed{max-width:540px}
.embed>blockquote{margin:0 !important;min-width:0 !important}
figcaption{font-family:var(--goth);font-size:12px;line-height:1.5;color:var(--ink-2);padding-top:5px}
.honbun p{text-indent:1em;text-align:justify}
.honbun p+p{margin-top:.15em}
.src{display:block;margin-top:6px;font-family:var(--goth);font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.src a{text-decoration:underline;text-underline-offset:.15em}
.rail{display:grid;gap:26px;align-content:start}
.rail .band{width:9.5em}   /* 右の列の帯見出しは同じ長さ */
.top3 h2{font-size:clamp(22px,4.4vw,30px)}   /* 短報:一面と同じ組み方で、見出しは一回り小さく */
@media (min-width:720px){.top3 h2{font-size:clamp(26px,2.6vw,32px)}}

/* テレビ小窓 */
.band.onair{display:inline-flex;align-items:center;gap:6px;background:var(--red)}   /* 帯見出しと同じ形で、放送中だけ赤 */
.onair i{width:7px;height:7px;border-radius:50%;background:var(--band-ink);display:inline-block}
@media (prefers-reduced-motion:no-preference){.onair i{animation:blink 2s steps(1) infinite}}
.tv .ch{font-family:var(--goth);font-size:13px;font-weight:900;letter-spacing:.08em;margin-left:10px}
@keyframes blink{50%{opacity:.25}}
/* 島の足 */
.ashi th{white-space:normal;font-weight:700}
.ashi td.st{font-weight:700;white-space:nowrap;text-align:right}
.ashi small{display:block;color:var(--ink-2);font-size:12px}
.ashi .note{font-family:var(--goth);font-size:11.5px;color:var(--ink-3);margin-top:4px}

/* 天気(右の列):1日1行 */
.wx-row{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--hair);font-family:var(--goth);font-size:14px;line-height:1.5}
.wx-row b{min-width:2.6em;font-weight:900}
.wx-row .ic{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.wx-row svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wx-row .t{font-weight:700}.wx-row .t small{color:var(--ink-3);font-weight:500}
.wx-row .s{color:var(--ink-2)}
/* 今週の一面・人口 */
.week{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:14px;line-height:1.5}
.week li{padding:7px 0;border-bottom:1px solid var(--hair)}
.week time{display:block;font-size:12px;color:var(--ink-3)}
.week a{display:block;font-weight:700}
.jinko{font-family:var(--goth);font-size:14px;line-height:1.7}
.jinko b{font-size:20px;font-weight:900;margin-right:2px}
.jinko small{color:var(--ink-2);font-size:12.5px;margin-left:6px}

/* ── 表組み ── */
table{width:100%;border-collapse:collapse;font-family:var(--goth);font-size:13.5px;line-height:1.5}
th,td{padding:6px 4px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
th{font-weight:700;white-space:nowrap}
tr.day th{white-space:normal;font-size:15px;font-weight:900;border-bottom:1px solid var(--rule);padding-top:12px}
tr.day:first-child th{padding-top:0}
.keiho{color:var(--red);font-weight:900;font-family:var(--goth);font-size:15px;margin-bottom:8px}
.note{font-family:var(--goth);font-size:11.5px;line-height:1.6;color:var(--ink-3);margin-top:8px}
.note a{text-decoration:underline}
.koyomi{margin-top:14px}
.koyomi td{white-space:nowrap}
/* 一面コラム:広い画面では縦組み、段落は▼でつなぐ */
.column{margin-top:22px;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0;display:grid;gap:10px}
.col-name{font-weight:800;font-size:22px;letter-spacing:.2em}
.col-text p{font-size:16px;line-height:1.9;text-align:justify;text-indent:1em}
.tri{display:inline-block;margin:0 .15em;font-size:.8em}
.tcy{text-combine-upright:all}
.up{text-orientation:upright;letter-spacing:-.05em}
.ronten-t{font-weight:800;font-size:24px;line-height:1.35;margin-bottom:10px}
.ronten-g{display:grid;gap:4px 28px}
.ronten-g h4{margin:0 0 6px;font-family:var(--goth);font-weight:900;font-size:14px;border-bottom:1px solid var(--rule);padding-bottom:3px}
.ronten-g ul{margin:0 0 12px;padding:0;list-style:none;font-size:15px;line-height:1.7}
.ronten-g li{padding:4px 0;border-bottom:1px solid var(--hair)}
.yotei{display:grid;gap:4px 28px}
.rail .yotei{grid-template-columns:1fr !important}
.yotei h3{font-family:var(--goth);font-weight:900;font-size:14px;border-bottom:1px solid var(--rule);padding-bottom:3px;margin-bottom:6px}
.yotei ul{list-style:none;margin:0 0 12px;padding:0;font-family:var(--goth);font-size:14px;line-height:1.55}
.yotei li{padding:5px 0;border-bottom:1px solid var(--hair)}
.yotei li span{display:block;font-size:12px;color:var(--ink-3)}
.yotei b{color:var(--red)}
.yotei p{font-family:var(--goth);font-size:13px;color:var(--ink-3)}
.weekly{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:15px;font-weight:700}
.weekly li{border-bottom:1px solid var(--hair);padding:7px 0}
.weekly span{display:inline-block;width:5.5em;font-weight:500;color:var(--ink-3);font-size:13px}

/* ── 奥付 ── */
.oku{margin-top:28px;border-top:3px solid var(--rule);padding-top:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;
  font-family:var(--goth);font-size:12.5px}
.oku nav{display:flex;gap:18px;font-weight:700}
.oku .meta{color:var(--ink-3)}
.kyukan{text-align:center;padding:72px 0;border-bottom:1px solid var(--rule)}
.kyukan h2{font-weight:800;font-size:32px;margin-bottom:8px}

/* ── 段組み(広い画面)── */
@media (min-width:720px){
}
@media (min-width:1000px){
  .ichimen{grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:36px}
  .top-body{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px}
  .top-body figure{order:2}
  .top-body.nophoto{display:block}   /* 一面の本文は1列で列の幅いっぱい(段組みは画面では読みにくい) */
  .yotei{grid-template-columns:repeat(3,1fr)}
  .ronten-g{grid-template-columns:repeat(4,1fr)}
  .column{grid-template-columns:auto 1fr;align-items:start}
  .col-name{writing-mode:vertical-rl;padding:4px 10px 4px 0;border-right:1px solid var(--rule);order:2}
  .col-text{order:1;overflow-x:auto;direction:rtl}
  .col-text p{writing-mode:vertical-rl;direction:ltr;height:19em;margin:0;text-indent:1em}
}
</style>

  const li=x=>`<li>${x.url?`<a href="${esc(x.url)}" rel="noopener">${esc(x.what)}</a>`:esc(x.what)}</li>`;
  const blocks=[];
  if(a.ongoing.length) blocks.push(`<div><h3>続いていること</h3><ul>${a.ongoing.map(x=>`<li>${esc(x.what)} <b>残り${x.left}日</b></li>`).join("")}</ul></div>`);
  if(a.today.length) blocks.push(`<div><h3>きょう</h3><ul>${a.today.map(li).join("")}</ul></div>`);
  if(a.soon.length) blocks.push(`<div><h3>近日</h3><ul>${a.soon.map(x=>`<li><span>${md(x.date)}${x.end?`〜${md(x.end)}`:""}</span>${x.url?`<a href="${esc(x.url)}" rel="noopener">${esc(x.what)}</a>`:esc(x.what)}</li>`).join("")}</ul></div>`);
  if(!blocks.length) return "";
  return `<section id="yotei" aria-labelledby="yotei-h"><h2 class="band" id="yotei-h">イベント</h2><div class="yotei">${blocks.join("")}</div></section>`;
}

/* 人口:町の発表の値のまま。前月比の符号だけ「増・減」に */
function jinkoSection(p){
  if(!p) return "";
  const diff=(n,u)=>n==null?"":`前月比 ${n===0?"増減なし":`${Math.abs(n).toLocaleString()}${u}${n<0?"減":"増"}`}`;
  const t=ymd(p.as_of);
  return `<section id="jinko" aria-labelledby="jinko-h"><h2 class="band" id="jinko-h">人口</h2>
    <p class="jinko"><b>${Number(p.people).toLocaleString()}</b>人<small>${diff(p.people_diff,"人")}</small><br>
    ${p.households!=null?`<b>${Number(p.households).toLocaleString()}</b>世帯<small>${diff(p.households_diff,"世帯")}</small>`:""}</p>
    <p class="note"><a href="${esc(p.url)}" rel="noopener">八丈町</a> ${t.m}月${t.d}日現在</p></section>`;
}

function render(e){
  e={...e}; if(!e.top&&e.side.length){e.top=e.side[0]; e.side=e.side.slice(1);}
  if(!e.top&&e.shorts.length){e.top=e.shorts[0]; e.shorts=e.shorts.slice(1);}
  const days = e.weather.days;
  // 最新号(トップ)は題字だけ、日付のページは日付を添える
  document.title = /^\/\d{4}\/\d{2}\/\d{2}\//.test(location.pathname) ? `八丈島新聞 ${hiduke(e.date)}` : "八丈島新聞";
  document.getElementById("paper").innerHTML = `
  <header>
    <div class="mast"><h1 class="daiji">八丈島新聞</h1></div>
    <div class="dateline"><span>${hiduke(e.date)}</span><span>${ichigyo(e.weather)}</span></div>
  </header>

  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top">
      <h2>${esc(e.top.headline)}</h2>
      ${e.top.sode?`<p class="sode">${esc(e.top.sode)}</p>`:""}
      <div class="top-body${e.top.photo?"":" nophoto"}">
        ${figure(e.top.photo)}
        <div class="honbun">${paras(e.top.body)}${src(e.top.sources)}</div>
      </div>
    </article>${[...e.side.map(s=>[s,"top2"]),...e.shorts.map(s=>[s,"top2 top3"])].map(([s,c])=>`<article class="top ${c}">
      <h2>${esc(s.headline)}</h2>
      ${s.sode?`<p class="sode">${esc(s.sode)}</p>`:""}
      <div class="top-body nophoto"><div class="honbun">${paras(s.body)}${src(s.sources)}</div></div>
    </article>`).join("")}`:""}
    ${e.column?`<section class="column" id="column" aria-labelledby="column-h">
      <h2 class="col-name" id="column-h">${esc(e.column.name)}</h2>
      <div class="col-text"><p>${e.column.body.map(t=>esc(t).replace(/\d+(?:\.\d+)?/g,m=>m.length<=2?`<span class="tcy">${m}</span>`:`<span class="up">${m}</span>`)).join('<span class="tri">▼</span>')}</p></div>
    </section>`:""}
    ${e.ronten?`<section class="men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="tv" aria-label="FM八丈島テレビ">
        <div><h2 class="band onair"><i aria-hidden="true"></i>ON AIR</h2><span class="ch">FM八丈島テレビ</span></div>
        <div style="position:relative;width:100%;height:0;padding-top:calc(56.25% + 44px)"><iframe src="${TV_EMBED}" title="FM八丈島テレビ" style="position:absolute;inset:0;display:block;width:100%;height:100%;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      </section>
      ${ashiSection(e)}
      <section id="tenki" aria-labelledby="tenki-h">
        <h2 class="band" id="tenki-h">天気</h2>
        ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>esc(a.kind)).join("・")}</p>`:""}
        ${days.map(wxRow).join("")}
        ${e.koyomi?`<table class="koyomi">
          <tr><th>日の出</th><td>${esc(e.koyomi.sunrise)}</td><th>日の入り</th><td>${esc(e.koyomi.sunset)}</td></tr>
          ${e.koyomi.tide?`<tr><th>満潮</th><td>${e.koyomi.tide.high.map(([t])=>t).join("<br>")}</td><th>干潮</th><td>${e.koyomi.tide.low.map(([t])=>t).join("<br>")}</td></tr>`:""}
          <tr><th>月齢</th><td colspan="3">${esc(e.koyomi.moon)}</td></tr>
        </table>`:""}
        <p class="note"><a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表</p>
      </section>
      ${agendaSection(e)}
      ${(e.ichimen_week||[]).length?`<section id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h">今週の一面</h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><time datetime="${esc(w.date)}">${ymd(w.date).m}月${ymd(w.date).d}日(${WD[ymd(w.date).w]})</time>${w.headlines.map(h=>`<a href="${esc(w.url)}">${esc(h)}</a>`).join("")}</li>`).join("")}</ol>
      </section>`:""}
      ${jinkoSection(e.population)}
    </aside>
  </div>

  <footer class="oku">
    <nav aria-label="号">${e.prev?`<a href="${esc(e.prev)}">前の号</a>`:""}<a href="/shukusatsu/">縮刷版</a>${e.next?`<a href="${esc(e.next)}">次の号</a>`:""}</nav>
    <span class="meta">八丈島新聞 ${hiduke(e.date)}${e.sample?" この紙面は見本データで組んでいます":""}${e.proof?" この号は試し刷りです":""}</span>
  </footer>`;
}

function kyukan(){
  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><div></div><h1 class="daiji">八丈島新聞</h1><div></div></div></header>
  <section class="kyukan"><h2>本日は休刊です</h2><p>けさの号を組めませんでした。<a href="/shukusatsu/">縮刷版</a>で前の号を読めます。</p></section>`;
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};
  [...new Set([...document.querySelectorAll("figure.embed")].map(f=>f.dataset.provider))].forEach(p=>{
    if(!need[p]) return; const sc=document.createElement("script"); sc.src=need[p]; sc.async=true; document.body.appendChild(sc);
  });
}
if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
</body>
</html>
