<style>
:root{
  --paper:#ffffff; --ink:#000000; --ink-2:#4d4d4d; --ink-3:#8a8a8a; --rule:#000000; --hair:#c8c8c8;
  --band-bg:#000000; --band-ink:#ffffff; --red:#d1001f; --photo:#e4e4e4;
  --min:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --goth:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  color-scheme:only light; box-sizing:border-box;   /* いつも白地(端末のダークモードに合わせない。2026-10-24 決定) */
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--min);font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:.2em}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 40px}

/* ── 題字と耳 ── */
.mast{display:grid;grid-template-columns:auto auto;justify-content:space-between;align-items:end;gap:10px 12px;padding:18px 0 8px;border-bottom:3px solid var(--rule)}
.mast .daiji{grid-column:1/-1;grid-row:1}
.daiji{font-weight:800;font-size:clamp(44px,11vw,96px);line-height:1;letter-spacing:-.02em;text-align:center;white-space:nowrap}
.daiji a:hover{text-decoration:none}
.mast .hi,.mast .ten{font-family:var(--goth);font-size:clamp(14px,3.8vw,21px);font-weight:700;line-height:1.4;white-space:nowrap}   /* 字の大きさは前のまま。スマホでも1行 */
.mast .ten{text-align:right}
@media (min-width:920px){.mast{grid-template-columns:1fr auto 1fr}.mast .daiji{grid-column:2}.mast .hi,.mast .ten{grid-row:1;padding-bottom:6px}}
.deg{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:600}   /* 和文の書体だと「°」が全角幅で間が空く */

/* ── 帯見出し(白抜き) ── */
.band{display:inline-block;background:var(--band-bg);color:var(--band-ink);font-family:var(--goth);font-weight:900;
  font-size:13px;letter-spacing:.08em;padding:2px 10px 3px;margin:0 0 12px}
.men{padding-top:20px}

/* ── 一面 ── */
.ichimen{display:grid;gap:20px;padding-top:18px}
.top h2{font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1.22;letter-spacing:-.01em;margin-bottom:10px}   /* 一面の2本は同じ大きさ */
@media (min-width:720px){.top h2{font-size:clamp(38px,5.2vw,50px)}}
.label{display:inline-block;font-family:var(--goth);font-weight:700;font-size:12px;line-height:1.4;letter-spacing:.06em;border:1px solid var(--ink);padding:1px 7px;margin-bottom:8px}
.top2{border-top:1px solid var(--rule);margin-top:28px;padding-top:20px}
.top .sode{font-family:var(--goth);font-weight:700;font-size:17px;line-height:1.5;margin-bottom:14px}
figure{margin:0 0 12px}
.photo{aspect-ratio:3/2;background:var(--photo);display:grid;place-items:center;color:var(--ink-3);font-family:var(--goth);font-size:13px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.zu{display:block;width:100%;height:auto;max-width:520px}
.zu text{font-family:var(--goth);fill:var(--ink)}
.zu .zt{font-size:17px;font-weight:900}
.zu .zs{font-size:13px;fill:var(--ink-2)}
.zu .zn{font-size:26px;font-weight:900;fill:var(--red)}
.zu .zm{font-size:13px;font-weight:700}
.zu .zw{font-size:11px;fill:var(--ink-3)}
.zu rect.on{fill:var(--ink)}
.zu rect.off{fill:none;stroke:var(--hair)}
.zu rect.today{fill:none;stroke:var(--red);stroke-width:3}
.zu .don{fill:var(--paper);font-size:12px;font-weight:700}
.zu .doff{font-size:12px;fill:var(--ink-2)}
.zu-fig{border-top:1px solid var(--rule);padding-top:10px}
.zt-h{font-family:var(--goth);font-weight:900;font-size:17px;margin-bottom:6px}
.zu-tbl td{font-weight:700;white-space:nowrap}
.zu-tbl td.warn{color:var(--red)}
.zu-tbl th{white-space:normal;font-weight:500}
.embed{max-width:540px}
.embed>blockquote{margin:0 !important;min-width:0 !important}
figcaption{font-family:var(--goth);font-size:12px;line-height:1.5;color:var(--ink-2);padding-top:5px}
.honbun p{text-indent:1em;text-align:justify}
.honbun p+p{margin-top:.15em}
.src{display:block;margin-top:6px;font-family:var(--goth);font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.src a{text-decoration:underline;text-underline-offset:.15em}
.rail{display:grid;gap:26px;align-content:start}
.rail .band{width:9.5em}   /* 右の列の帯見出しは同じ長さ */

/* テレビ小窓 */
.band.onair{display:inline-flex;align-items:center;gap:6px;background:var(--red)}   /* 帯見出しと同じ形で、放送中だけ赤 */
.onair i{width:7px;height:7px;border-radius:50%;background:var(--band-ink);display:inline-block}
@media (prefers-reduced-motion:no-preference){.onair i{animation:blink 2s steps(1) infinite}}
.tv .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.tv .head .band{margin:0}
.tv .ch{height:30px;width:auto;display:block}   /* ON AIR の帯と同じ高さに見える大きさ */
@keyframes blink{50%{opacity:.25}}
/* 島の足 */
.ashi th{white-space:normal;font-weight:700}
.ashi td.st{font-weight:700;white-space:nowrap;text-align:right}
.ashi small{display:block;color:var(--ink-2);font-size:12px}
.ashi .note{font-family:var(--goth);font-size:11.5px;color:var(--ink-3);margin-top:4px}

/* 天気(右の列):1日1行 */
.wx-row{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--hair);font-family:var(--goth);font-size:14px;line-height:1.5}
.wx-row b{min-width:2.6em;font-weight:900}
.wx-row .ic{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.wx-row svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wx-row .t{font-weight:700}.wx-row .t small{color:var(--ink-3);font-weight:500}
.wx-row .s{color:var(--ink-2)}
/* 今週の一面・人口 */
.week{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:15.5px;line-height:1.5}
.week li{padding:3px 0}
.week a{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 1日1行 */
.week time{display:inline-block;width:2.6em;font-weight:500;color:var(--ink-3);font-size:13.5px}
.giin{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:15.5px;line-height:1.5}
.giin li{padding:3px 0}
.giin a,.giin span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.giin i{display:inline-block;width:1.6em;font-style:normal}
.giin b{font-weight:900;margin-right:.6em}
.giin time{color:var(--ink-3);font-size:13.5px;margin-right:.6em}
/* 島のいま:天気・暦・船・人口を1つの欄に。見出しは左の小さな列 */
.kurashi{display:grid;grid-template-columns:3.2em 1fr;margin:6px 0 0;font-family:var(--goth);font-size:14px;line-height:1.5}
.kurashi dt,.kurashi dd{margin:0;padding:6px 0;border-bottom:1px solid var(--hair)}
.kurashi dt{font-weight:900}
.kurashi dd b{font-weight:900}.kurashi .fune b{white-space:nowrap}
.kurashi small{color:var(--ink-2);font-size:12.5px}
.kurashi .fune{display:flex;justify-content:space-between;gap:8px}
.kurashi .fune+.fune{margin-top:4px}
/* 注意報は黄、警報は赤、特別警報は紫(気象庁の色分けにならう) */
.keiho{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:8px;font-family:var(--goth);font-weight:900;font-size:14px}
.keiho span{padding:1px 8px}
.keiho .lv1{background:#f2d000;color:#000}
.keiho .lv2{background:var(--red);color:#fff}
.keiho .lv3{background:#6a1b9a;color:#fff}
/* きょうの一曲 */
.kyoku .kk{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.kyoku img{width:96px;height:96px;object-fit:cover;flex:none;display:block;background:var(--photo)}
.kyoku h3{font-weight:800;font-size:19px;line-height:1.35}
.kyoku .who{font-family:var(--goth);font-weight:700;font-size:14px;line-height:1.5;margin-top:2px}
.kyoku .who small{display:block;color:var(--ink-3);font-weight:500;font-size:12.5px}
.kyoku p.txt{font-size:15px;line-height:1.8;text-align:justify}
.kyoku .kiku{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-family:var(--goth);font-size:13px;font-weight:700}
.kyoku .kiku a{text-decoration:underline;text-underline-offset:.2em}
/* 島のたより */
.tayori{border-top:3px solid var(--rule);margin-top:28px;padding-top:12px}
.tayori h3{font-weight:800;font-size:clamp(22px,4vw,28px);line-height:1.3;margin-bottom:10px}
.tayori .honbun a{text-decoration:underline;text-underline-offset:.2em;text-decoration-color:var(--ink-3)}

/* ── 表組み ── */
table{width:100%;border-collapse:collapse;font-family:var(--goth);font-size:13.5px;line-height:1.5}
th,td{padding:6px 4px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
th{font-weight:700;white-space:nowrap}
tr.day th{white-space:normal;font-size:15px;font-weight:900;border-bottom:1px solid var(--rule);padding-top:12px}
tr.day:first-child th{padding-top:0}
.note{font-family:var(--goth);font-size:11.5px;line-height:1.6;color:var(--ink-3);margin-top:8px}
.note a{text-decoration:underline}
.koyomi{margin-top:14px}
.koyomi td{white-space:nowrap}
.ronten-t{font-weight:800;font-size:24px;line-height:1.35;margin-bottom:10px}
.ronten-g{display:grid;gap:4px 28px}
.ronten-g h4{margin:0 0 6px;font-family:var(--goth);font-weight:900;font-size:14px;border-bottom:1px solid var(--rule);padding-bottom:3px}
.ronten-g ul{margin:0 0 12px;padding:0;list-style:none;font-size:15px;line-height:1.7}
.ronten-g li{padding:4px 0;border-bottom:1px solid var(--hair)}
.yotei{display:grid;gap:4px 28px}
.rail .yotei{grid-template-columns:1fr !important}
.yotei ul{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:14px;line-height:1.55}
.yotei li{padding:5px 0;border-bottom:1px solid var(--hair)}
.yotei li span{display:block;font-size:12px;color:var(--ink-3)}
.yotei b{color:var(--red)}
.yotei p{font-family:var(--goth);font-size:13px;color:var(--ink-3)}
.weekly{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:15px;font-weight:700}
.weekly li{border-bottom:1px solid var(--hair);padding:7px 0}
.weekly span{display:inline-block;width:5.5em;font-weight:500;color:var(--ink-3);font-size:13px}

/* ── 奥付 ── */
.oku{margin-top:28px;border-top:3px solid var(--rule);padding-top:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;
  font-family:var(--goth);font-size:12.5px}
.oku nav{display:flex;gap:18px;font-weight:700}
.oku .meta{color:var(--ink-3)}
.kyukan{text-align:center;padding:72px 0;border-bottom:1px solid var(--rule)}
.kyukan h2{font-weight:800;font-size:32px;margin-bottom:8px}

/* ── スマホ・狭い画面の並び(左右の列をほどいて order で並べる)── */
@media (max-width:999px){
  .ichimen{display:flex;flex-direction:column;gap:30px}
  .ichimen-main,.rail{display:contents}
  .ichimen .top2,.ichimen .tayori{margin-top:0}
  #week{order:2} #giin{order:3} .side{order:4} .short{order:5} .tayori,.ronten{order:6}
  .tv{order:7} .kyoku{order:8} #yotei{order:9} #shima{order:10}
}
/* ── 段組み(広い画面)── */
@media (min-width:1000px){
  .ichimen{grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:36px}
  .top-body{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px}
  .top-body figure{order:2}
  .top-body.nophoto{display:block}   /* 一面の本文は1列で列の幅いっぱい(段組みは画面では読みにくい) */
  .yotei{grid-template-columns:repeat(3,1fr)}
  .ronten-g{grid-template-columns:repeat(4,1fr)}
}
</style>

/* 天気欄の1行:予報文はおおまかに(題字下と同じ丸め)、降水確率はその日のいちばん高い値、風は「後」の前、波は最初の高さ */
const ICON={

    // 定型の案内文は「条件付き」、運休日や更新予定は状態の列へ(言葉は表のまま)
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}${note?` ${esc(note)}`:""}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function agendaSection(e){
  const a=e.agenda; if(!a) return "";
  const md=d=>{const t=ymd(d);return `${t.m}月${t.d}日(${WD[t.w]})`;};
  const what=x=>x.url?`<a href="${esc(x.url)}" rel="noopener">${esc(x.what)}</a>`:esc(x.what);
  const items=[...(a.today||[]).map(x=>`<li><span><b>きょう</b></span>${what(x)}</li>`),
               ...(a.soon||[]).map(x=>`<li><span>${md(x.date)}${x.end?`〜${md(x.end)}`:""}</span>${what(x)}</li>`)];
  if(!items.length) return "";
  return `<section id="yotei" aria-labelledby="yotei-h"><h2 class="band" id="yotei-h">イベント</h2><div class="yotei"><ul>${items.join("")}</ul></div></section>`;
}

/* 議員動静:中身のある発信の新しい順に上位5人(同じ日は同じメダル)。1人1行、本人の投稿へのリンク */
function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h">議員動静</h2>
    <ol class="giin">${g.map(r=>`<li>${r.at?`<a href="${esc(r.url)}" rel="noopener">`:"<span>"}<i>${r.medal||""}</i><b>${esc(r.name)}</b>${r.at?`<time>${esc(r.when)}</time>${esc(r.what||"")}`:`<time>発信なし</time>`}${r.at?"</a>":"</span>"}</li>`).join("")}</ol></section>`;
}
/* 島のいま:注意報・天気・暦・船・人口を1つの欄に。値は発表のまま */
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u);
  const diff=(n,u)=>n==null?"":` <small>前月比 ${n===0?"増減なし":`${Math.abs(n).toLocaleString()}${u}${n<0?"減":"増"}`}</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    fune?`<a href="${esc(u.url)}" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:""].filter(Boolean);
  return `<section id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h">島のいま</h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join("・")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join("・")}</b></dd>`:""}
      ${k?`<dt>月齢</dt><dd>${esc(k.moon)}</dd>`:""}
      ${p?`<dt>人口</dt><dd><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff,"人")}${p.households!=null?`<br><b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff,"世帯")}`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.join("、")}</p></section>`;
}
/* きょうの一曲:CSV の文章のまま。ジャケットは見つかった日だけ(Apple の画像を Apple Music へのリンクつきで) */
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section class="kyoku" id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h">きょうの一曲</h2>
    <div class="kk">${a?`<a href="${esc(a.url)}" rel="noopener"><img src="${esc(a.img)}" alt="${esc(a.album||k.title)}のジャケット" width="96" height="96" loading="lazy"></a>`:""}
      <div><h3>${esc(k.title)}</h3><p class="who">${esc(k.artist)}${a&&a.album?`<small>${esc(a.album)}</small>`:""}</p></div></div>
    <p class="txt">${esc(k.text)}</p>
    <p class="kiku"><a href="https://www.youtube.com/results?search_query=${q}" rel="noopener">YouTubeで聴く</a>${a&&a.url?`<a href="${esc(a.url)}" rel="noopener">Apple Musicで聴く</a>`:""}</p></section>`;
}
/* 島のたより:CSV の文章のまま。本文の [語](URL) だけリンクにする */
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" rel="noopener">${w}</a>`);
function tayoriSection(c){
  if(!c) return "";
  return `<section class="tayori" id="tayori" aria-labelledby="tayori-h"><h2 class="band" id="tayori-h">${esc(c.name||"島のたより")}</h2>
    ${c.title?`<h3>${esc(c.title)}</h3>`:""}<div class="honbun">${(c.body||[]).map(t=>`<p>${mdLink(t)}</p>`).join("")}</div></section>`;
}

function render(e){
  e={...e}; if(!e.top&&e.side.length){e.top=e.side[0]; e.side=e.side.slice(1);}
  if(!e.top&&e.shorts.length){e.top=e.shorts[0]; e.shorts=e.shorts.slice(1);}
  // 最新号(トップ)は題字だけ、日付のページは日付を添える
  document.title = /^\/\d{4}\/\d{2}\/\d{2}\//.test(location.pathname) ? `八丈島新聞 ${hiduke(e.date)}` : "八丈島新聞";
  document.getElementById("paper").innerHTML = `
  <header>
    <div class="mast"><span class="hi">${hiduke(e.date)}</span><h1 class="daiji"><a href="/">八丈島新聞</a></h1><span class="ten">${ichigyo(e.weather)}</span></div>
  </header>

  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top">
      ${lbl(e.top)}<h2>${esc(e.top.headline)}</h2>
      ${e.top.sode?`<p class="sode">${esc(e.top.sode)}</p>`:""}
      <div class="top-body${e.top.photo?"":" nophoto"}">
        ${figure(e.top.photo)}
        <div class="honbun">${paras(e.top.body)}${src(e.top.sources)}</div>
      </div>
    </article>${[...e.side.map(s=>[s,"top2 side"]),...e.shorts.map(s=>[s,"top2 top3 short"])].map(([s,c])=>`<article class="top ${c}">
      ${lbl(s)}<h2>${esc(s.headline)}</h2>
      ${s.sode?`<p class="sode">${esc(s.sode)}</p>`:""}
      <div class="top-body nophoto"><div class="honbun">${paras(s.body)}${src(s.sources)}</div></div>
    </article>`).join("")}`:""}
    ${tayoriSection(e.column)}
    ${e.ronten?`<section class="men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="tv" aria-label="FM八丈島テレビ">
        <div class="head"><h2 class="band onair"><i aria-hidden="true"></i>ON AIR</h2><img class="ch" src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></div>
        <div style="position:relative;width:100%;height:0;padding-top:calc(56.25% + 44px)"><iframe src="${TV_EMBED}" title="FM八丈島テレビ" style="position:absolute;inset:0;display:block;width:100%;height:100%;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      </section>
      ${(e.ichimen_week||[]).length?`<section id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h">今週の一面</h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><a href="${esc(w.url)}"><time datetime="${esc(w.date)}">${ymd(w.date).d}日</time>${esc(w.headlines[0])}</a></li>`).join("")}</ol>
      </section>`:""}
      ${giinSection(e)}
      ${kyokuSection(e.kyoku)}
      ${agendaSection(e)}
      ${shimaSection(e)}
    </aside>
  </div>

  <footer class="oku">
    <nav aria-label="号">${e.prev?`<a href="${esc(e.prev)}">前の号</a>`:""}<a href="/shukusatsu/">縮刷版</a>${e.next?`<a href="${esc(e.next)}">次の号</a>`:""}</nav>
    <span class="meta">八丈島新聞 ${hiduke(e.date)}${e.sample?" この紙面は見本データで組んでいます":""}${e.proof?" この号は試し刷りです":""}</span>
  </footer>`;
}

function kyukan(){
  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><h1 class="daiji"><a href="/">八丈島新聞</a></h1></div></header>
  <section class="kyukan"><h2>本日は休刊です</h2><p>けさの号を組めませんでした。<a href="/shukusatsu/">縮刷版</a>で前の号を読めます。</p></section>`;
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};
  [...new Set([...document.querySelectorAll("figure.embed")].map(f=>f.dataset.provider))].forEach(p=>{
    if(!need[p]) return; const sc=document.createElement("script"); sc.src=need[p]; sc.async=true; document.body.appendChild(sc);
  });
}
if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
</body>
</html>
