<script type="application/json" id="edition">{"date": "2026-10-20", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-28T18:54:03+09:00", "prev": "/2026/10/19/", "next": "/2026/10/21/", "alerts": [], "weather": {"issued": "2026-10-20T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 22, "max": 28}]}, "koyomi": {"sunrise": "5:48", "sunset": "17:03", "moon": 8.7, "tide": {"place": "八丈島(神湊)", "high": [["14:12", 106]], "low": [["5:59", 52], ["20:14", 85]]}}, "unko": null, "sora": {"status": "条件付きの可能性", "reason": "強風", "url": "https://x.com/ANA_flight_info/status/2112101445499576468", "at": "2026-10-19T17:40:00+09:00"}, "number": null, "top": {"headline": "ネパール中学生が八高生と交流", "body": ["日本とネパールの外交関係樹立70周年を記念して来日したネパールの代表中学生が19日、八丈島を訪れ、八丈高校の生徒らと交流した。", "八丈高校では八丈太鼓同好会の生徒と太鼓を体験。地元の太鼓会の協力も得て、最後はネパールの太鼓と八丈太鼓を合わせるセッションも行った。言葉だけでなく、それぞれの地域にある打楽器を介して交流する時間となった。", "一行は町役場も訪れ、山下町長とネパールや八丈島について懇談した。19日と20日は島内観光や島の中高生との交流が組まれており、20日には大賀郷中学校の授業や八丈ビジターセンター、歴史民俗資料館も訪れる予定。", "2026年は日本とネパールの外交関係樹立70周年。国同士の節目を、島の中学生・高校生が同世代と直接会い、地域文化を交換する機会にした。"], "figure": null, "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2112087646021546427"}, {"label": "伊勢崎唯町議", "url": "https://x.com/YuiIsezaki8jo/status/2112101764405375082"}], "label": "教育", "audience": "島民", "thread_id": "t20261020-71", "id": "f601d6", "photo": {"type": "img", "src": "/img/kiji/f601d6.jpg?v=c9a62f", "og": "/img/kiji/f601d6-og.jpg?v=c9a62f", "s": "/img/kiji/f601d6-s.jpg?v=c9a62f", "m": "/img/kiji/f601d6-m.jpg?v=c9a62f", "caption": "八丈太鼓", "credit": "", "file": "own/hachijo-taiko-2.jpg"}}, "side": [], "shorts": [{"headline": "三原中生が島言葉の指導", "body": ["八丈町立三原中学校の生徒が19日、ガーデン荘で島言葉の指導を受けた。同校によると、1年生は3時間目、2・3年生は4時間目だった。", "生徒はオリジナルの「ショメ節」を島言葉にするため、相談した。「島に来る」の「来る」は、人には「おじゃる」を使うが船には使わないと教わった。「ありがとう」は、目上の人には「おかげさまよぉい」と教わったという。", "広報はちじょう2010年3月号の教育委員会だよりは、八丈方言の取り組みを取り上げた。教育委員会は2010年度も、八丈方言を知り伝える取り組みを続け、高齢者の語りの記録にも取り組むと伝えた。"], "sources": [{"label": "三原中", "url": "https://mihara-jhs.8jo.ed.jp/n/nd0b6c56083ff"}, {"label": "広報はちじょう 2010年3月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23144610/hachijo1003.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20261020-72", "id": "de4aee", "photo": {"type": "img", "src": "/img/kiji/de4aee.jpg?v=b3907c", "og": "/img/kiji/de4aee-og.jpg?v=b3907c", "s": "/img/kiji/de4aee-s.jpg?v=b3907c", "m": "/img/kiji/de4aee-m.jpg?v=b3907c", "caption": "八丈町立三原中学校", "credit": "", "file": "own/mihara-chu-2.jpg"}}, {"headline": "大賀郷小、150周年企画始動", "body": ["八丈町立大賀郷小学校は19日の全校朝会で、創立150周年を盛り上げる「大小サンキュー＆スマイルプロジェクト」を発表した。計画委員会の子どもたちが中心となり、全校で記念の横断幕と動画を制作する。", "プロジェクトには、学校を支えてきた地域や関係者への感謝を形にする狙いがある。同校は今年度、創立150周年を迎え、運動会や学芸会、記念フェスティバルなど節目の行事を予定している。", "この日の朝会では、全員で四股を踏んで体を動かし、一週間をスタートした。日常の学校活動の中に150周年の企画を組み込みながら、子どもたち自身が節目をつくっていく取り組みが始まっている。"], "sources": [{"label": "大賀郷小", "url": "https://okago-es.8jo.ed.jp/n/n0d0c7cf20225"}, {"label": "広報はちじょう 2026年6月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/05/27202107/hachijo2606.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20261020-73", "id": "bb9622", "photo": {"type": "img", "src": "/img/kiji/bb9622.jpg?v=d2d4af", "og": "/img/kiji/bb9622-og.jpg?v=d2d4af", "s": "/img/kiji/bb9622-s.jpg?v=d2d4af", "m": "/img/kiji/bb9622-m.jpg?v=d2d4af", "caption": "八丈町立大賀郷小学校", "credit": "", "file": "own/okago-sho-2.jpg"}}, {"headline": "三根小、運動会のスローガン発表", "body": ["八丈町立三根小学校は19日、運動会実行委員が今年の運動会のスローガン「全力でみんなが主役の運動会」を発表したと伝えた。各学級から集めたキーワードをもとに決めたという。", "同校によると、この日は応援団長と副団長を紹介し、応援のポイントを練習した。体育主任は、ケガに注意するよう話した。", "これに先立つ18日には、PTA施設部が企画・運営して校庭整備をした。児童と教職員も草刈りと樹木の剪定をし、道路周りも整って、運動会の準備ができたという。"], "sources": [{"label": "三根小", "url": "https://mitsune-es.8jo.ed.jp/n/nbd7166e0a5f5"}], "label": "教育", "audience": "島民", "thread_id": "t20261018-67", "followup": true, "id": "2fbbe8", "photo": {"type": "img", "src": "/img/kiji/2fbbe8.jpg?v=25a99d", "og": "/img/kiji/2fbbe8-og.jpg?v=25a99d", "s": "/img/kiji/2fbbe8-s.jpg?v=25a99d", "m": "/img/kiji/2fbbe8-m.jpg?v=25a99d", "caption": "八丈町立三根小学校", "credit": "", "file": "own/mitsune-sho-3.jpg"}}, {"headline": "富士中2年生が親子レク", "body": ["八丈町立富士中学校は17日、2年生の親子レクリエーションを開いた。親子で「はぁっていうゲーム」とジェスチャーゲームに取り組んだ。", "同校によると、前年度は台風による休校で親子レクを開けなかった。このため2年生にとって今回は初めてで、中学校生活では最後の親子レクにもなった。前年に実施できなかった行事が1年越しで実現した。"], "sources": [{"label": "富士中", "url": "https://fuji-jhs.8jo.ed.jp/n/n56fae9dc7287"}], "label": "教育", "audience": "島民", "thread_id": "t20261020-161", "id": "dabfa5", "photo": {"type": "img", "src": "/img/kiji/dabfa5.jpg?v=3277d8", "og": "/img/kiji/dabfa5-og.jpg?v=3277d8", "s": "/img/kiji/dabfa5-s.jpg?v=3277d8", "m": "/img/kiji/dabfa5-m.jpg?v=3277d8", "caption": "八丈町立富士中学校", "credit": "", "file": "own/fuji-chu-6.jpg"}}], "agenda": [{"date": "2026-10-20", "end": null, "text": "ショメ節の舞台", "url": "https://x.com/hattoriyashiki/status/2112106490869727672"}, {"date": "2026-10-24", "end": "2026-10-25", "text": "ショメ節の催し", "url": "https://x.com/hattoriyashiki/status/2113918424401273081"}, {"date": "2026-10-24", "end": null, "text": "講演会「天然記念物の鳥たち」", "url": "https://x.com/8jo_vc/status/2113905421979455887"}, {"date": "2026-10-24", "end": null, "text": "地域おこし協力隊のイベント", "url": "https://x.com/hachijomachi/status/2115020119265177942"}, {"date": "2026-10-24", "end": null, "text": "大賀郷中学校の音楽会", "url": "https://okago-jhs.8jo.ed.jp/n/n648dd1195f6c"}, {"date": "2026-10-24", "end": null, "text": "国立公園90周年のPRイベント", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261016/"}, {"date": "2026-10-25", "end": null, "text": "NPOと町長の懇談会", "url": "https://x.com/8johana2417/status/2110482768270598479"}, {"date": "2026-10-26", "end": "2026-10-27", "text": "服部屋敷のショメ節と踊り", "url": "https://x.com/hattoriyashiki/status/2114643202837750241"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "三回聞いた話題", "body": ["本の帯にあった言葉が、翌日の会話でも出てくる。広告にまで同じ語が現れれば、何か const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
