s/2026/05/27201940/hachijo2605.pdf"}], "label": "町政", "audience": "島民", "thread_id": "t20261030-16", "id": "b03b30", "photo": {"type": "img", "src": "/img/kiji/b03b30.jpg?v=86015f", "og": "/img/kiji/b03b30-og.jpg?v=86015f", "s": "/img/kiji/b03b30-s.jpg?v=86015f", "m": "/img/kiji/b03b30-m.jpg?v=86015f", "caption": "水道メーター", "credit": "", "file": "ac/31708009.jpg"}}, {"headline": "台風支援制度、11月に個別相談会", "body": ["八丈町商工会は11月5日、6日、25日、26日の4日、八丈町役場1階で個別相談会を開く。東京都が台風第22号・第23号を受けて設けた支援制度が対象で、令和8年度も専門家が対応する。", "時間は5日と25日が10時から12時と13時から16時、6日と26日が10時から12時。会場は商工会研修室または相談室。1回の相談は1時間で、無料。事前予約制で、申し込みは商工会の担当者に連絡する。質問のみの申し込みもできる。", "専門家は中小企業診断士など。制度の質問のほか、申請・実績報告・再建事業計画の確認と指導を商工会経営指導員が受け持つ。経営全般の相談にも今年度は応じる。必要書類がそろっていなくても相談できる。持ち物は、申請用の書類と、相談する内容にかかわる書類。申請様式のデータを入れたモバイル機器もあれば持っていく。", "新たに申請する場合は、東京都産業労働局の相談会への事前参加が必要になった。会場は八丈支庁で、予約と問い合わせは03-5320-4744。商工会への連絡は04996-2-2121（平日8時30分から17時）。12月以降の開催は調整中という。"], "sources": [{"label": "八丈町商工会", "url": "https://hachisho.princia.net/news/view/442"}], "label": "産業", "audience": "島民", "thread_id": "t20261030-30", "id": "6fb8c2", "photo": {"type": "img", "src": "/img/kiji/6fb8c2.jpg?v=0188cb", "og": "/img/kiji/6fb8c2-og.jpg?v=0188cb", "s": "/img/kiji/6fb8c2-s.jpg?v=0188cb", "m": "/img/kiji/6fb8c2-m.jpg?v=0188cb", "caption": "八丈町商工会の研修室", "credit": "", "file": "own/shokokai-kenshu-1.jpg"}}, {"headline": "川崎市民祭りに八丈島の物産展が出展", "body": ["第47回かわさき市民祭りが30日から11月1日まで、川崎区の富士見公園一帯で開かれ、八丈島の物産展が出展する。", "開催は3日間とも10時から16時30分。雨天でも実施し、荒天の場合は中止となる。会場には各地の物産や飲食、ステージ、体験企画などが並び、八丈島も島外イベントの一つとして特産品を販売する。"], "sources": [{"label": "八丈島観光協会", "url": "https://www.hachijo.gr.jp/2026?post_type=events"}, {"label": "川崎市", "url": "https://www.city.kawasaki.jp/280/page/0000177109.html"}], "label": "産業", "audience": "島民", "thread_id": "t20261030-163", "id": "5071a1", "photo": {"type": "img", "src": "/img/kiji/5071a1.jpg?v=111b34", "og": "/img/kiji/5071a1-og.jpg?v=111b34", "s": "/img/kiji/5071a1-s.jpg?v=111b34", "m": "/img/kiji/5071a1-m.jpg?v=111b34", "caption": "富士見公園の富士通スタジアム川崎", "credit": "", "file": "ac/31972120.jpg"}}, {"headline": "林野火災注意報、1月から運用", "body": ["八丈町消防本部は、林野火災注意報と林野火災警報の運用を2027年1月1日から始める。運用期間は毎年1月1日から5月31日まで。対象は八丈町全域。", "町によると、気象条件などの発令指標を満たすと発令され、防災行政無線で放送される。有効期間は発令当日の1日だけで、連日発令されるときは毎日放送される。指標には、乾燥注意報（伊豆諸島南部）の最小湿度35%・実効湿度65%がある。強風注意報（伊豆諸島南部）は平均風速15m/sである。", "警報が出ている間は、八丈町火災予防条例第29条に基づき、山林・原野などでの火入れや煙火の消費が制限される。屋外での火遊びやたき火、可燃物付近での喫煙、残火（吸い殻を含む）の不始末も対象になる。取灰・火粉の不始末や、火粉が飛散する屋外での裸火の使用も対象になる。", "制限の対象になる例は、たき火、落ち葉の焼却、キャンプファイヤー、田畑の火入れ、どんと焼き。剪定枝や枯草の焼却もたき火に当たる。バーベキュー台、七輪、ガスコンロは、使用方法に従い火の粉が飛散しない形状のものなら対象にならない。", "2025年2月に岩手県大船渡市で大規模な林野火災があった。国は、林野火災が多発する時期に一定の気象条件を満たしたら注意報・警報を出し、予防の実効性を高める必要があるとした。問い合わせは八丈町消防本部予防係（04996-2-0119）。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/bousai-anzen/shoubo-honbu/shoubo-oshirase/rinya-kasai/"}], "label": "町政", "audience": "島民", "thread_id": "t20261030-317", "id": "c8ca28", "photo": {"type": "img", "src": "/img/kiji/c8ca28.jpg?v=06a5a8", "og": "/img/kiji/c8ca28-og.jpg?v=06a5a8", "s": "/img/kiji/c8ca28-s.jpg?v=06a5a8", "m": "/img/kiji/c8ca28-m.jpg?v=06a5a8", "caption": "東京都・八丈島 八丈富士からの風景", "credit": "", "file": "ac/29362291.jpg"}}], "agenda": [{"date": "2026-10-31", "end": null, "text": "八丈島の民謡 公開練習会(大賀郷)", "url": "https://www.kyoiku.metro.tokyo.lg.jp/about/hatijyou/cultural_propert/week/2026"}, {"date": "2026-10-31", "end": null, "text": "富士中学校の合唱コンクール", "url": "https://fuji-jhs.8jo.ed.jp/n/n28db719f7a29"}, {"date": "2026-10-31", "end": null, "text": "三原小学校の大運動会", "url": "https://mihara-es.8jo.ed.jp/n/nab03fe05249e"}, {"date": "2026-11-01", "end": null, "text": "クルーズ客船「三井オーシャンサクラ」寄港", "url": "https://www.mitsuioceancruises.com/"}, {"date": "2026-11-01", "end": null, "text": "発酵中フェス", "url": "https://www.hachijo.gr.jp/blogs/fermentation-fes-2026/"}, {"date": "2026-11-03", "end": null, "text": "小学校の運動会(三根・大賀郷)", "url": "https://mitsune-es.8jo.ed.jp/n/n88afbd584229"}, {"date": "2026-11-06", "end": null, "text": "大賀郷小学校 創立150周年記念講演会", "url": "https://okago-es.8jo.ed.jp/n/n function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}
