 "9:30頃更新"}, {"island": "八丈島", "direction": "八丈島発", "time": "09:40", "place": "東京行", "ship": "大型客船 2400便橘丸", "port": "---", "status": "---", "note": ""}, {"island": "青ヶ島", "direction": "青ヶ島行き", "time": "09:30", "place": "八丈島発", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}, {"island": "青ヶ島", "direction": "青ヶ島発", "time": "13:30", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": ""}]}, "sora": {"status": "条件付きの可能性", "reason": "視界不良", "url": "https://x.com/ANA_flight_info/status/2116088970211963336", "at": "2026-10-30T17:45:00+09:00"}, "number": null, "top": {"headline": "JA八丈島、7年度は黒字に", "body": ["JA八丈島が公表した2026年版ディスクロージャー誌によると、令和7年度の当期剰余金は7,699千円の黒字だった。令和6年度は11,972千円の赤字で、黒字に転じた。", "令和7年度の事業利益は24,668千円の赤字、経常利益は14,343千円の赤字だった。令和6年度は事業利益が21,058千円の赤字、経常利益が3,941千円の赤字だった。", "事業別では、購買事業総利益が60,188千円から67,272千円に増えた。販売事業総利益は24,918千円から20,280千円に減った。事業管理費は184,459千円から184,481千円で、ほぼ変わらなかった。", "特別利益は134,005千円、特別損失は111,672千円だった。JAは事業利益の24百万円、経常利益の14百万円の赤字について、購買と販売の収益が減ったことが影響したと説明している。", "人件費などを減らす計画が思うように進まなかったことも挙げている。そこに大賀郷店の移転に関わる分と台風災害の共済金が加わり、当期利益は約8百万円になったという。"], "sources": [{"label": "JA八丈島", "url": "https://www.jahachijo.jp/date/dis7.pdf"}], "label": "産業", "audience": "島民", "thread_id": "t20261031-20", "id": "e7f9db", "photo": {"type": "img", "src": "/img/kiji/e7f9db.jpg?v=8a2104", "og": "/img/kiji/e7f9db-og.jpg?v=8a2104", "s": "/img/kiji/e7f9db-s.jpg?v=8a2104", "m": "/img/kiji/e7f9db-m.jpg?v=8a2104", "caption": "JA東京島しょ 八丈", "credit": "", "file": "own/ja-1.jpg"}}, "side": [], "shorts": [{"headline": "9月来島者9800人、19%減", "body": ["八丈島の9月の来島者は9,800人で、前年同月の12,063人から2,263人、18.8%減った。八丈島観光協会がまとめた。内訳は航空路8,244人、海路1,556人。観光客数の推計は8,170人だった。", "一方、4〜9月の来島者は計69,780人。前年同期は、4〜8月の56,175人に9月の12,063人を加えた68,238人で、今年度上半期は1,542人、約2.3%上回る。9月単月では前年を大きく下回ったものの、年度前半の累計では前年水準を維持した形になる。"], "sources": [{"label": "広報はちじょう 2026年11月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/10/30114611/hachijo2611.pdf"}, {"label": "広報はちじょう 2026年9月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/07/31155211/hachijo2609.pdf"}, {"label": "広報はちじょう 2026年10月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=24"}], "label": "産業", "audience": "島民", "thread_id": "t20261031-17", "id": "1d87a4", "photo": {"type": "img", "src": "/img/kiji/1d87a4.jpg?v=ceda46", "og": "/img/kiji/1d87a4-og.jpg?v=ceda46", "s": "/img/kiji/1d87a4-s.jpg?v=ceda46", "m": "/img/kiji/1d87a4-m.jpg?v=ceda46", "caption": "八丈島 藍ヶ江港の海", "credit": "", "file": "ac/1505277.jpg"}}, {"headline": "三原大運動会を11月1日へ延期", "body": ["八丈町立三原小学校・三原中学校は、31日に予定していた合同の「三原大運動会」を11月1日に延期する。雨の影響で校庭の状態が整わないためで、三原中が31日に知らせた。", "三原地区では小学校と中学校が一緒に運動会をつくり、児童・生徒が同じ会場で競技や応援に取り組む。今年のテーマは「盛々堂々」。小学生と中学生が学年を越えて動く行事だけに、ぬかるんだ校庭で無理に実施せず、安全に競技できる状態を優先した。"], "sources": [{"label": "三原中", "url": "https://mihara-jhs.8jo.ed.jp/n/n29943fb9d15e"}], "label": "教育", "audience": "島民", "thread_id": "t20261031-21", "id": "bdd6fd", "photo": {"type": "img", "src": "/img/kiji/bdd6fd.jpg?v=d623df", "og": "/img/kiji/bdd6fd-og.jpg?v=d623df", "s": "/img/kiji/bdd6fd-s.jpg?v=d623df", "m": "/img/kiji/bdd6fd-m.jpg?v=d623df", "caption": "三原学園(三原小学校・三原中学校)", "credit": "", "file": "own/mihara-chu-8.jpg"}}, {"headline": "東海汽船が観光きっぷ予約開始", "body": ["東海汽船株式会社は31日9時30分から、東京諸島観光きっぷ(東京諸島観光プラン第1弾)の予約受付を始める。対象は11月1日から12月27日帰着の旅程である。", "東京から三宅島、御蔵島、八丈島へは、往復2等和室で大人13,000円、子ども6,500円(税込)である。出発日が金曜日の場合は対象から除かれる。有効期間は出発日から最大7日間である。", "予約は出発日の前日まで受け付ける。東海汽船お客様センターへの電話か、インターネットで申し込む。"], "sources": [{"label": "東海汽船", "url": "https://www.tokaikisen.co.jp/news/839135/"}], "label": "産業", "audience": "両方", "thread_id": "t20261031-18", "id": "151b52", "photo": {"type": "img", "src": "/img/kiji/151b52.jpg?v=d33535", "og": "/img/kiji/151b52-og.jpg?v=d33535", "s": "/img/kiji/151b52-s.jpg?v=d33535", "m": "/img/kiji/151b52-m.jpg?v=d33535", "caption": "東海汽船「橘丸」", "credit": "", "file": "ac/4915538.jpg"}}, {"headline": "八丈島の   return l.length ? `<details class="tatami"><summary>出典</summary><p class="src">${l.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(srcName(s.label))}</a>`).join("、")}</p></details>` : ""; };   
 
const DAY = e => e.proof?"":`/${e.date.replace(/-/g,"/")}/`;   
const hl = (e,a) => a.id?`<a class="hl" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/">${esc(a.headline)}</a>`:esc(a.headline);
const GENRE={"町政": "government", "産業": "industry", "くらし": "life", "教育": "education", "文化": "culture"};

const paras = b => (Array.isArray(b)?b:[b]).map(p=>`<p>${esc(p)}</p>`).join("");

function figure(f){
  if(!f) return "";
  const cap = `<figcaption>${esc(f.caption)}${f.credit?`(${esc(f.credit)})`:""}</figcaption>`;
  if(f.type==="svg") return `<figure class="zu-fig">${f.svg}${cap}</figure>`;
  if(f.type==="table") return `<figure class="zu-fig zu-tbl"><p class="zt-h">${esc(f.title)}</p><table>${f.rows.map(([k,v,w])=>`<tr><th>${esc(k)}</th><td class="${w?"warn":""}">${esc(v)}</td></tr>`).join("")}</table>${cap}</figure>`;
  return `<figure><div class="photo"><img src="${esc(f.src)}" alt="${esc(f.caption)}" loading="lazy"></div></figure>`;   
}
 
const thumb = (e,a) => { const f=a.photo; if(!f||f.type!=="img") return "";
  const img=`<img src="${esc(f.src)}"${f.m?` srcset="${esc(f.m)} 240w, ${esc(f.src)} 1200w" sizes="(min-width:1000px) 380px, 120px"`:""} alt="${esc(f.caption)}" width="1200" height="800" loading="lazy">`;
  return a.id?`<a class="kp" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/" tabindex="-1">${img}</a>`:`<span class="kp">${img}</span>`; };
 
function ichigyo(w){
  const d=(w.days||[])[0]||{}, t=String(d.hachijo??d.main??d.weather??"");
  const ten=tenOf(t);
  
  const o=w.obs, dir=o?(o.wind_dir.length===3?o.wind_dir[0]:o.wind_dir):"";
  const kaze=o?(dir==="静穏"?"静穏":esc(`${dir}風${Math.round(Number(o.wind))}m`)):"";
  return [ten,kaze,d.max!=null?`${esc(d.max)}<span class="deg">°C</span>`:""].filter(Boolean).join(" ");
}
 
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  くもり:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 7 18z"/></svg>',
  あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
 
 
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
