<script type="application/json" id="edition">{"date": "2026-10-02", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-24T10:52:17+09:00", "prev": "/2026/10/01/", "next": "/2026/10/03/", "alerts": [], "weather": {"issued": "2026-10-02T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 23, "max": 29}]}, "koyomi": {"sunrise": "5:35", "sunset": "17:26", "moon": 20.3, "tide": {"place": "八丈島(神湊)", "high": [["9:26", 113], ["19:18", 130]], "low": [["2:09", 22], ["13:40", 95]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "災害ごみ、5日から南原へ", "body": ["八丈町によると、台風22号・23号による災害廃棄物の受入先が、5日から有明興業八丈島営業所(南原処理場)に変わる。受入期間は12月30日まで。", "受付時間は9時から17時まで。12時から13時は休止する。施設の休業日は第1・3・5土曜日と日曜日。", "搬入には、町役場環境係で発行する災害廃棄物搬入許可証が要る。提示すれば無償で受け入れるが、回数と数量に制限がある。問い合わせは八丈町住民課環境係(04996-2-1123)。町役場の代表は04996-2-1121で、開庁時間は8時30分から17時15分。土日祝と12月29日から1月3日は除く。", "広報はちじょう2024年3月号は、4月1日から南原処理場の受付時間が変わり、休業日が日曜日と第1・3・5土曜日になると伝えている。"], "figure": {"type": "place", "name": "南原処理場"}, "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261001/"}, {"label": "広報はちじょう 2024年3月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23121910/hachijo2403.pdf"}], "label": "くらし", "audience": "島民", "thread_id": "t20261002-6", "id": "0cc87f", "photo": {"type": "img", "src": "/img/kiji/0cc87f.jpg?v=dca1d0", "og": "/img/kiji/0cc87f-og.jpg?v=dca1d0", "s": "/img/kiji/0cc87f-s.jpg?v=dca1d0", "m": "/img/kiji/0cc87f-m.jpg?v=dca1d0", "caption": "台風後の八丈島", "credit": "", "file": "ac/3595112.jpg"}}, "side": [], "shorts": [{"headline": "資料館1周年、為朝のトート配布", "body": ["八丈町は1日から7日まで、八丈島歴史民俗資料館の入館者に、源為朝が描かれた限定トートバッグを配っている。改装を終えて再開してから、1日で1年になった。各日数量限定。", "広報はちじょう2025年11月号によると、資料館は昭和50年の開館。耐震工事と展示刷新を経て、2025年10月1日に再開した。再開の日は、記念の式典のあと数量限定のクリアファイルを配った。", "町は2026年2月13日、来館者が累計5,000人を超えたと知らせた。4月27日には1万人を超えたと知らせ、4月28日から先着1,000人にオリジナルのしおりを配ると案内した。", "1周年を記念した企画展示「再生へのあゆみ展」は9月1日から開いている。1975年の開館から2025年に生まれ変わるまでの舞台裏を展示し、会期は11月30日まで。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi/status/2105440054734618946"}, {"label": "広報はちじょう 2025年11月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114515/hachijo2511.pdf"}], "label": "文化", "audience": "両方", "thread_id": "t20261002-7", "id": "efb39e", "photo": {"type": "img", "src": "/img/kiji/efb39e.jpg?v=680e4c", "og": "/img/kiji/efb39e-og.jpg?v=680e4c", "s": "/img/kiji/efb39e-s.jpg?v=680e4c", "m": "/img/kiji/efb39e-m.jpg?v=680e4c", "caption": "八丈島歴史民俗資料館", "credit": "", "file": "own/rekimin-1.jpg"}}, {"headline": "脳の健康度、きょう測定", "body": ["八丈町は2日、保健福祉センターで「脳の健康度(ブレインパフォーマンス)測定」を行う。時間は9時15分から16時までで、予約制。", "町は、脳の機能は働き盛りの世代から少しずつ変化するとして、身体の健康と同じように日頃から脳の状態にも目を向けるよう呼びかけている。症状が出てから対応するのではなく、自分では見えにくい状態を測定し、健康を意識するきっかけにする企画。", "予約は9月18日から受け付けている。場所は八丈町保健福祉センター。問い合わせと予約は福祉健康課高齢福祉係、電話04996-2-5570。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20260831/"}], "label": "くらし", "audience": "両方", "thread_id": "t20261002-8", "id": "989fa9", "photo": {"type": "img", "src": "/img/kiji/989fa9.jpg?v=877950", "og": "/img/kiji/989fa9-og.jpg?v=877950", "s": "/img/kiji/989fa9-s.jpg?v=877950", "m": "/img/kiji/989fa9-m.jpg?v=877950", "caption": "八丈町保健福祉センター", "credit": "", "file": "own/hoken-fukushi-2.jpg"}}, {"headline": "島の共有サービス「allo」公開", "body": ["八丈島にいる人だけが見られる共有ボード「allo(あろ)」が、allo.tokyoで公開されている。八丈在住の写真・映像カメラマン、平田龍乃介さんが企画した。おすそわけ、不用品、おたすけ(手伝いの依頼)、イベント情報を載せる。", "投稿は三根、大賀郷、樫立、中之郷、末吉の地区ごとに分かれる。投稿欄のほか、ごみ収集日、天気、船と飛行機の運航状況、クジラの情報、町からのお知らせ、「島の人に質問」の欄がある。運航状況は信号の色で示し、ごみ収集日は登録した地区に合わせて出る。災害時のモードでは、公的な発表と住民からの道路状況の報告をつなぐ。", "島内にいるかどうかは、スマートフォンの位置情報で見分ける。登録にはメールアドレス、パスワード、姓名が要り、ニックネームと集落(永郷、向里、洞輪沢ほか)は任意。登録時にはガイドラインの第5項(通報と支援の仕組み)と第6項(自己責任の原則)への同意が要る。問い合わせは、サイトのお問い合わせページと、ご意見フォームで受ける。", "サイトには、台風22号・23号で大きな被害を受けたと書かれている。行政の支援には限りがあり、近所どうしの助け合いが大切だと考えたという。電気通信事業の届出は2026年9月15日に済んでいる。平田さんは、島版ジモティーが欲しいと思った2年前の考えを、台風を経て企画し直したという。2025年10月25日、八丈町社会福祉協議会のあすなろボランティアへの依頼がオンラインでできるようになったと知らせた。2025年11月12日には、「草刈機あいてる」「午後なら時間ある」など、負担なく助け合える仕組みを目指すと投稿していた。"], "sources": [{"label": "allo", "url": "https://allo.tokyo/"}, {"label": "平田 龍乃介 🐲 八丈写真館", "url": "https://x.com/hachijophoto/status/2105560409877213610"}], "label": "くらし", "audience": "島民", "thread_id": "t20261002-9", "id": "8ae9ca", "photo": {"type": "img", "src": "/img/kiji/8ae9ca.jpg?v=1ce467", "og": "/img/kiji/8ae9ca-og.jpg?v=1ce467", "s": "/img/kiji/8ae9ca-s.jpg?v=1ce467", "m": "/img/kiji/8ae9ca-m.jpg?v=1ce467", "caption": "八丈町社会福祉協議会", "credit": "", "file": "own/shakyo-1.jpg"}}, {"headline": "八丈ビューホテルでナイトプール", "body": ["八丈ビューホテルで3日、ナイトプールイベント「八丈ビューホテル×OreOre Island」が17時30分から22時まで開かれる。入場無料。プールは会場演出に使い、遊泳はできない。", "OreOre Island Cafe/Bar ～八丈島～が1日に告知した。音楽と光でプールサイドを演出し、キッチンカー、OreOre Island Bar、SUNHATCHが出店する。", "同ホテルの屋外プールは夏季営業の施設で、2026年は7月18日から10月12日まで開設。今回は通常の昼間の遊泳とは別に、夜のプールサイドを飲食と音楽の場として使う企画となる。"], "sources": [{"label": "OreOre Island Cafe", "url": "https://x.com/OreOre_Island/status/2105471926009471073"}], "label": "文化", "audience": "両方", "thread_id": "t20261002-10", "id": "d8e2bb", "photo": {"type": "img", "src": "/img/kiji/d8e2bb.jpg?v=567798", "og": "/img/kiji/d8e2bb-og.jpg?v=567798", "s": "/img/kiji/d8e2bb-s.jpg?v=567798", "m": "/img/kiji/d8e2bb-m.jpg?v=567798", "caption": "八丈ビューホテル", "credit": "", "file": "own/view-hotel-1.jpg"}}], "agenda": [{"date": "2026-10-03", "end": null, "text": "八丈ビューホテル ナイトプール", "url": "https://x.com/OreOre_Island/status/2105471926009471073"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "閉じた窓の空気", "body": ["窓も開けず、冷房もつけていない部屋で、急に空気が違って感じられる。温度は同じなのに、その場所の気配だけが変わったように思える。", "[空気が変わった夜](https://note.com/uchu0216/n/n7944c930a92c)という言い方には、測定値に表れない体験を何とか残したい気持ちがある。密度が違う、気配が違う。正体を断定するより、どんな感覚だったかを記す方が、文章としては伝わることがある。", "たとえば雨の前なら匂いが変わることがあるし、廊下で誰かが動けば床の音が伝わる。微かな手がかりを、意識より先に拾っていたのかもしれない。何が起きたか知りたいなら、まず窓や扉、周囲の音を確かめる方が早い。", "それでも「何かが違う」と思った経験まで消す必要はない。どんな時間で、何をしていたかを書き留めれば、あとから思い出す手がかりになる。", "説明できないことの記録は、説明の代わりにはならない。だが、感じたことを丁寧に残す文章には、別の役割がある。"]}, "kyoku": {"artist": "松原みき", "title": "真夜中のドア～Stay With Me", "text": "1979年の松原みきのデビュー曲が、何十年も後に世界中で聴かれるようになりました。都会の夜の切なさを描く歌は、時代も国境も越えて、別れを惜しむ人の胸へ届きます。帰ってほしくない、と言い出すには遅すぎる時刻。真夜中の扉の向こうに、誰かを見送った記憶がある人も多いでしょう。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/4e/96/c5/4e96c53f-0e15-e1f6-e21e-86b85f52e389/PA00204088_0_234545_jacket.jpg/300x300bb.jpg", "album": "松原みき ベスト・コレクション", "url": "https://music.apple.com/jp/album/%E7%9C%9F%E5%A4%9C%E4%B8%AD%E3%81%AE%E3%83%89%E3%82%A2-stay-with-me/1858846278?i=1858846444&uo=4"}}, "ronten": null, "weekly": [], "ichimen_week": [{"date": "2026-10-01", "url": "/2026/10/01/bab712/", "headlines": ["台風26号、八丈島南を北東へ"]}, {"date": "2026-09-30", "url": "/2026/09/30/5f40dd/", "headlines": ["台風26号で休演・休業へ"]}, {"date": "2026-09-29", "url": "/2026/09/29/dc592e/", "headlines": ["台風26号に備え町が呼びかけ"]}, {"date": "2026-09-28", "url": "/2026/09/28/662149/", "headlines": ["愛らんどリーグ2026の映像"]}, {"date": "2026-09-27", "url": "/2026/09/27/f9b197/", "headlines": ["町の医療証 10月1日に更新"]}, {"date": "2026-09-26", "url": "/2026/09/26/b91f68/", "headlines": ["こころみクリニックで接種開始"]}, {"date": "2026-09-25", "url": "/2026/09/25/05a2a8/", "headlines": ["台風被害、家屋は税務課へ"]}], "population": {"as_of": "2026-10-01", "people": 6499, "people_diff": -24, "households": 4028, "households_diff": -21, "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/10/30114611/hachijo2611.pdf", "ido": {"in": 6, "birth": 2, "out": 19, "death": 10}}, "giin": [], "hyakunen": {"then": {"ago": "100年前", "dt": "1926年10月2日(土)", "pic": "", "hi": "25", "lo": "20", "rn": "雨 0.2mm"}, "now": {"ago": "きょう", "dt": "2026年10月2日(金)", "pic": "<span class=\"ic\"><svg viewBox=\"0 0 48 48\"><g stroke=\"#f08c00\" stroke-width=\"3.2\" stroke-linecap=\"round\"><path d=\"M24 3v6M24 39v6M3 24h6M39 24h6M9.2 9.2l4.2 4.2M34.6 34.6l4.2 4.2M9.2 38.8l4.2-4.2M34.6 13.4l4.2-4.2\"/><\/g><circle cx=\"24\" cy=\"24\" r=\"10\" fill=\"#f7a21b\"/><\/svg><\/span>", "hi": "29", "lo": "23", "rn": ""}, "src": "https://www.data.jma.go.jp/stats/etrn/view/daily_s1.php?prec_no=44&block_no=47678&year=1926&month=10"}, "chrome": "a2b78a307074"}</script>

const KD="〇一二三四五六七八九", WD="日月火水木金土";
function kan(n){ n=Number(n); if(!n) return "〇"; let s=""; for(const [c,v] of [["千",1000],["百",100],["十",10]]){const d=Math.floor(n/v); if(d){s+=(d===1?"":KD[d])+c; n%=v;}} return s+(n?KD[n]:""); }
function ymd(iso){ const [y,m,d]=iso.split("-").map(Number); return {y,m,d,w:new Date(Date.UTC(y,m-1,d)).getUTCDay()}; }
const seireki = iso => { const t=ymd(iso); return `${t.y}年${t.m}月${t.d}日`; };

const hm = iso => { const [h,m]=(iso.split("T")[1]||"").split(":"); return `${Number(h)}時${Number(m)?Number(m)+"分":""}`; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const srcName = l => String(l||"").replace(/(?:[(（][^()（）]*[)）])?[(（]X[)）]$/,"");   // 愛称と「(X)」は出さない

  return l.length ? `<span class="src">出典 ${l.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(srcName(s.label))}</a>`).join("、")}</span>` : ""; };
/* 見出しから記事のページへ(1本ずつのページ。共有するとその記事の見出しが出る) */
const DAY = e => e.proof?"":`/${e.date.replace(/-/g,"/")}/`;   // その日の号の URL(一曲・たよりの個別のページはこの下)
const hl = (e,a) => a.id?`<a class="hl" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/">${esc(a.headline)}</a>`:esc(a.headline);
const GENRE={"町政": "government", "産業": "industry", "くらし": "life", "教育": "education", "文化": "culture"};   // 記事のラベル → 分野のページ /slug/(chrome.LABEL_SLUG)
const lbl = a => a.label?`<p class="kick">${GENRE[a.label]?`<a href="/${GENRE[a.label]}/">${esc(a.label)}</a>`:esc(a.label)}</p>`:"";   // 記事の分野(町政・交通・防災・くらし・教育・文化・産業)
const paras = b => (Array.isArray(b)?b:[b]).map(p=>`<p>${esc(p)}</p>`).join("");

function figure(f){
  if(!f) return "";
  const cap = `<figcaption>${esc(f.caption)}${f.credit?`(${esc(f.credit)})`:""}</figcaption>`;
  if(f.type==="svg") return `<figure class="zu-fig">${f.svg}${cap}</figure>`;
  if(f.type==="table") return `<figure class="zu-fig zu-tbl"><p class="zt-h">${esc(f.title)}</p><table>${f.rows.map(([k,v,w])=>`<tr><th>${esc(k)}</th><td class="${w?"warn":""}">${esc(v)}</td></tr>`).join("")}</table>${cap}</figure>`;
  if(f.type==="embed") return `<figure class="embed" data-provider="${esc(f.provider)}">${f.html}
    <noscript><a href="${esc(f.url)}" target="_blank" rel="noopener">元の投稿を見る</a></noscript>${cap}</figure>`;
  return `<figure><div class="photo"><img src="${esc(f.src)}" alt="${esc(f.caption)}" loading="lazy"></div></figure>`;   // 写真の下の説明は出さない(alt だけ。2026-11-10 利用者)
}
/* 一面の下の記事の写真(PC は列の幅で見出しの上、スマホは右に 120×80。押すと記事へ) */

/* 題字下の1行:天気はおおまかに(のち・時々・一時は省く)、風はアメダスの観測、気温はきょうの最高。半角スペースで区切る */
function ichigyo(w){
  const d=(w.days||[])[0]||{}, t=String(d.hachijo??d.main??d.weather??"");
  const ten=tenOf(t);
  // 風向は3文字の向きを丸める(南南西→南、東北東→東)。風速は四捨五入した整数(利用者の指定、2026-10-25)
  const o=w.obs, dir=o?(o.wind_dir.length===3?o.wind_dir[0]:o.wind_dir):"";

}
/* 天気欄の1行:予報文はおおまかに(題字下と同じ丸め)、降水確率はその日のいちばん高い値、風は「後」の前、波は最初の高さ */
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',

  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){

  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
/* 島の足:東海汽船の表を、島の人が読む形に並べ直す(言葉は表のまま)。「島のいま」の「船」の項になる */
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  // 載せるのは、けさ八丈島に着く東京からの船(昨晩発)と、八丈島→青ヶ島。今晩発・八丈島→東京・青ヶ島→八丈島は載せない(利用者の指定)
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    // 定型の案内文は「条件付き」、運休日や更新予定は状態の列へ(言葉は表のまま)
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
/* 島のいまの「催し」:先7日の催しを数行(夜に重なりをまとめた desk/korekara)。前の形(today/soon)の号もそのまま並べる */
/* 催しの日:曜日を必ず添える(人は曜日で予定を捉える。2026-10-29 利用者)。発行月なら「31日(土)」、別の月は「11月1日(日)」 */
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const MEDAL={"🥇":1,"🥈":2,"🥉":3};
const rankMark = m => MEDAL[m]?`<i class="r${MEDAL[m]}" aria-label="${MEDAL[m]}位">${MEDAL[m]}</i>`:`<i class="r0" aria-hidden="true"></i>`;
/* 議員動静:1日ごと。直近の発信の日が新しい順、同じ日は pt(議員の仕事の日2、ほか1)の多い順に上位5人。日と pt が同じ人は同じメダル。「分類：題材」で1行。1人1行、本人の投稿へのリンク */
function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h"><a href="/government/members/">町議会議員</a></h2>
    <ol class="giin">${g.map(r=>{const nm=`${rankMark(r.medal)}<b>${esc(r.name)}</b>`;
      return `<li>${r.slug?`<a class="nm" href="/government/members/${esc(r.slug)}/">${nm}</a>`:`<span class="nm">${nm}</span>`}${r.at?`<a class="ps" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.name+" "+(r.kind?r.kind+" ":"")+(r.what||""))}"><time>${esc(r.when)}</time><q${r.duty?' class="ten2"':""}>${r.kind?`${esc(r.kind)} `:""}${esc(r.what||"")}</q></a>`:`<span class="ps"><time>発信なし</time></span>`}</li>`;}).join("")}</ol><p class="more"><a href="/government/assembly/">議員・議会</a><a href="/government/members/">全員の一覧</a></p></section>`;
}
/* 100年前のきょうと、きょう(edition の hyakunen。絵は組むときに作ってある)。上が最高、下が最低 */
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
/* 島のいま:注意報・天気・暦・船・人口を1つの欄に。値は発表のまま */
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u), sora=soraRow(e.sora), ev=evLines(e).slice(0,8);
  const diff=n=>n==null?"":`<small>(${n>0?"+":n<0?"−":"±"}${Math.abs(n).toLocaleString()})</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const st=e.sora&&e.sora.at?ymd(e.sora.at.slice(0,10)):null, sh=e.sora&&e.sora.at?hm(e.sora.at):"";
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
/* きょうの一曲:CSV の文章のまま。ジャケットは見つかった日だけ(Apple の画像を Apple Music へのリンクつきで) */

}
/* 島のたより:CSV の文章のまま。本文の [語](URL) だけリンクにする */
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);

}

  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top" id="a1">
      ${lbl(e.top)}<h2>${hl(e,e.top)}</h2>

    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];
      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>
      ${s.id?`<p class="ld">${esc(b[0])}</p>`:`<div class="honbun">${paras(b)}${src(s.sources)}</div>`}
    </article>`;}).join("")}</div>`:""}`:""}
    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}
    ${e.ronten?`<section class="men ronten" id="ronten" aria-labelledby="ronten-h">

      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>

    </div>

  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};

if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
