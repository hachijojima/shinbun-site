/uploads/2026/03/23141556/hachijo1511.pdf"}], "label": "くらし", "audience": "両方", "thread_id": "t20261014-48", "id": "db5f09", "photo": {"type": "img", "src": "/img/kiji/db5f09.jpg?v=73b0d6", "og": "/img/kiji/db5f09-og.jpg?v=73b0d6", "s": "/img/kiji/db5f09-s.jpg?v=73b0d6", "m": "/img/kiji/db5f09-m.jpg?v=73b0d6", "caption": "裏見ヶ滝温泉", "credit": "", "file": "own/uramigataki-onsen-2.jpg"}}, {"headline": "あさぬま、牛乳など入荷", "body": ["スーパーあさぬまは14日、納豆・豆腐・牛乳・乳製品とアイスクリームが入荷したと同店が伝えた。13日は定期船の欠航が2日目で、納豆・豆腐・牛乳が欠品していた。", "同店によると、13日は欠航が続き、欠品をすべて埋められなかった。通常の2日目より欠品が多く、野菜はある程度そろっていたという。14日もドライ商品は空きスペースが多いという。", "東海汽船株式会社の大型客船「橘丸」は9月28日にプロペラ装置の不具合が起き、入渠での修理が必要と判断された。東海汽船の2日付のお知らせによると、橘丸は主機が使えない。補助推進のみでは大幅に低速となるため、旅客の運航を休止している。再開は、修理と検査のあとに改めて知らせるとしている。", "東海汽船への船舶の使用停止命令は、橘丸、セブンアイランド結、セブンアイランド友の3隻が対象。期間は9日から28日までの20日間。代替運航は8日夜の出航から始まり、さるびあ丸、セブンアイランド大漁、くろしお丸、おがさわら丸が使われている。", "あさぬまは2日、台風27号の影響で9日まで生鮮品の入荷がない可能性があると知らせた。9日にはサラダ油など1週間以上届いていない物があると書いた。10日には商品不足のため八丈DAYを中止し、島市だけ出すと知らせた。"], "sources": [{"label": "スーパーあさぬま", "url": "https://x.com/umikaze8jo/status/2109837812812185730"}, {"label": "東海汽船", "url": "https://www.tokaikisen.co.jp/news/825542/"}], "label": "くらし", "audience": "両方", "thread_id": "t20261003-12", "followup": true, "id": "2414ac", "photo": {"type": "img", "src": "/img/kiji/2414ac.jpg?v=9c1b78", "og": "/img/kiji/2414ac-og.jpg?v=9c1b78", "s": "/img/kiji/2414ac-s.jpg?v=9c1b78", "m": "/img/kiji/2414ac-m.jpg?v=9c1b78", "caption": "スーパーあさぬまの店内", "credit": "", "file": "own/asanuma-5.jpg"}}, {"headline": "三原中、運動会の準備に", "body": ["三原中学校は13日、10月末の三原大運動会へ向けた準備を本格化させた。小学校と中学校が一緒につくる三原学園の運動会で、中学生は競技だけでなく学園全体を動かす側にも回る。", "生徒たちは直前の町民体育大会にも、樫立・中之郷それぞれの地域の一員として参加した。地域の運動会を終え、次は学校の小中合同運動会へ切り替える。", "三原学園では9学年が一緒に行事をつくる。中学生が年下の児童と関わりながら準備する過程も、競技当日と同じく小中一貫教育の一部となっている。"], "sources": [{"label": "三原中", "url": "https://mihara-jhs.8jo.ed.jp/n/n77c5fc40e4ed"}, {"label": "広報はちじょう 2016年10月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23135942/hachijo1610.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20261014-49", "id": "c57272", "photo": {"type": "img", "src": "/img/kiji/c57272.jpg?v=faf6fc", "og": "/img/kiji/c57272-og.jpg?v=faf6fc", "s": "/img/kiji/c57272-s.jpg?v=faf6fc", "m": "/img/kiji/c57272-m.jpg?v=faf6fc", "caption": "八丈町立三原中学校", "credit": "", "file": "own/mihara-chu-1.jpg"}}, {"headline": "MX、台風被災1年を特集", "body": ["TOKYO MX NEWSは12日、八丈島の台風被災から1年を追う特集「少しずつ戻る日常と、変わらぬ課題とは」を公開した。", "番組では、大賀郷の中華料理店「菜々屋」が昨年の台風で全壊し、半年以上を経て今年6月に営業を再開した経緯を紹介。壁や屋根などに大きな被害を受けたホテルが、東京都の支援を受けながら約1年遅れで営業を再開した様子も伝えた。", "昨年10月の台風22号・23号では、住宅や店舗だけでなく、農業施設、道路、電気・水道など島の生活基盤にも被害が広がった。その後、農業施設の再建や事業者向け支援、税の減免など複数の制度が設けられている。", "特集が映したのは「復旧したか、していないか」という二分ではない。営業を再開した店がある一方、修繕や資金、生活基盤の課題は残る。発災から1年の八丈島を、戻ってきた日常と復興途上の現実の両方から捉えている。"], "sources": [{"label": "TOKYO MX", "url": "https://s.mxtv.jp/tokyomxplus/mx/article/202610121000/"}, {"label": "東京都", "url": "https://www.metro.tokyo.lg.jp/information/press/2025/12/2025121707"}, {"label": "広報はちじょう 2026年1月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/22181235/hachijo2601.pdf"}], "label": "くらし", "audience": "島民", "thread_id": "t20261014-127", "id": "e49aee", "photo": {"type": "img", "src": "/img/kiji/e49aee.jpg?v=48d000", "og": "/img/kiji/e49aee-og.jpg?v=48d000", "s": "/img/kiji/e49aee-s.jpg?v=48d000", "m": "/img/kiji/e49aee-m.jpg?v=48d000", "caption": "迫る台風 荒れる八丈島の海", "credit": "", "file": "ac/3158090.jpg"}}], "agenda": [{"date": "2026-10-17", "end": null, "text": "こどもワクワクおうえんプロジェクト", "url": "https://okago-es.8jo.ed.jp/n/n6ef23a1674c0"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "休日を支えた人たち", "body": ["目覚ましを鳴らさなかった土曜日に、玄関の呼び鈴だけが鳴る。届いたのは注文していた水の箱。休みを奪われたような気がして扉を開けると、こちらが寝間着のままでいる時間に、誰かはもう重い荷物を運んでいる。", "[予定のない休日](https://note.com/not4u/n/n7101c0afd04f)とは、誰も働いていない日のことではない。手挽きのコーヒー、本、ソファでのうたた寝。どれも人の手を通って家まで届いたものだと考えると、何もしない一日が急に大掛かりなものに見えてくる。", "しかし、そのことに気づくたび恐縮していたら、休みは休みでなくなる。必要なのは感謝の儀式ではなく、相手の時間を自分の都合だけで使わないことだろう。", "配達の人に長話を求めない。休日の同僚へ、急ぎでもない返事を催促しない。自分の静けさが、誰かの無理でできていないかを、ときどき考える。", "箱から水を一本出し、コーヒーを淹れる。午後の予定はまだ白紙だ。誰かの仕事に支えられた白紙だからこそ、そこへ何も書かずにおく。"]}, "kyoku": {"artist": "New Order", "title": "Regret", "text": "ニュー・オーダーの「Regret」は、きらめくギターと軽快なビートの下に、後悔という重い言葉を忍ばせます。何かを失ったあとで、ようやく大切さに気づくことがあります。でも、戻れないからといって先へ進めないわけではない。悲しみと明るい旋律が矛盾せず一緒に鳴るところに、このバンドらしい美しさがあります。後悔を連れて出かける朝もあるのです。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/95/41/cd/9541cddd-682b-0a63-9f80-6f9a0429e713/mzm.zbliccga.jpg/300x300bb.jpg", "album": "Republic", "url": "https://music.apple.com/us/album/regret/1040965893?i=1040966395&uo=4"}}, "ronten": null, "weekly": [], "ichimen_week": [{"date": "2026-10-13", "url": "/2026/10/13/ed42a4/", "headlines": ["八丈高チームが明日葉料理で入賞"]}, {"date": "2026-10-12", "url": "/2026/10/12/f37a9a/", "headlines": ["あさぬま、生鮮入荷なし"]}, {"date": "2026-10-11", "url": "/2026/10/11/9bd852/", "headlines": ["あさぬま、じゃがいも売り切れ"]}, {"date": "2026-10-10", "url": "/2026/10/10/09b163/", "headlines": ["NHKが台風1年の八丈島を放送"]}, {"date": "2026-10-09", "url": "/2026/10/09/02ced7/", "headlines": ["さるびあ丸、8日朝の入港を案内"]}, {"date": "2026-10-08", "url": "/2026/10/08/fa54e0/", "headlines": ["災害ごみ、搬入先を南原へ"]}, {"date": "2026-10-07", "url": "/2026/10/07/098c76/", "headlines": ["菜々屋、欠航続きの入荷事情"]}], "population": {"as_of": "2026-10-01", "people": 6499, "people_diff": -24, "households": 4028, "households_diff": -21, "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/10/30114611/hachijo2611.pdf", "ido": {"in": 6, "birth": 2, "out": 19, "death": 10}}, "giin": [], "hyakunen": {"then": {"ago": "100年前", "dt": "1926年10月14日(木)", "pic": "", "hi": "23", "lo": "16", "rn": "降水なし"}, "now": {"ago": "きょう", "dt": "2026年10月14日(水)", "pic": "<span class=\"ic\"><svg viewBox=\"0 0 48 48\"><g stroke=\"#f08c00\" stroke-width=\"3.2\" stroke-linecap=\"round\"><path d=\"M24 3v6M24 39v6M3 24h6M39 24h6M9.2 9.2l4.2 4.2M34.6 34.6l4.2 4.2M9.2 38.8l4.2-4.2M34.6 13.4l4.2-4.2\"/><\/g><circle cx=\"24\" cy=\"24\" r=\"10\" fill   return a.id?`<a class="kp" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/" tabindex="-1">${img}</a>`:`<span class="kp">${img}</span>`; };
 
function ichigyo(w){
  const d=(w.days||[])[0]||{}, t=String(d.hachijo??d.main??d.weather??"");
  const ten=tenOf(t);
  
  const o=w.obs, dir=o?(o.wind_dir.length===3?o.wind_dir[0]:o.wind_dir):"";
  const kaze=o?(dir==="静穏"?"静穏":esc(`${dir}風${Math.round(Number(o.wind))}m`)):"";
  return [ten,kaze,d.max!=null?`${esc(d.max)}<span class="deg">°C</span>`:""].filter(Boolean).join(" ");
}
 
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  くもり:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 7 18z"/></svg>',
  あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
 
 
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>

function shimaSection(e){

  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}

      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
