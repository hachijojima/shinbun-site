<script type="application/json" id="edition">{"date": "2026-10-04", "edition": "朝刊", "published": "05:30", "proof": false, "built": "2026-11-24T10:52:42+09:00", "prev": "/2026/10/03/", "next": "/2026/10/05/", "alerts": [], "weather": {"issued": "2026-10-04T05:00", "area": "伊豆諸島南部", "days": [{"label": "きょう", "weather": "晴れ", "main": "晴れ", "hachijo": "晴れ", "wind": "", "wave": "", "wind_full": "", "wave_full": "", "pops": [], "min": 21, "max": 25}]}, "koyomi": {"sunrise": "5:36", "sunset": "17:23", "moon": 22.3, "tide": {"place": "八丈島(神湊)", "high": [["17:26", 110]], "low": [["4:35", 38]]}}, "unko": null, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "8人、約14キロ流され救助", "body": ["3日に八丈島沖で一時行方不明となったダイバー8人は、潜水地点から北東へ約14キロ離れた海上で発見され、全員が救助された。客7人とインストラクター1人は11時30分ごろ潜水を始め、予定時刻を過ぎても浮上しなかったため、船長が118番通報した。", "潜ったのは大越鼻灯台の西約8.6キロの海域。巡視船や航空機が捜索し、17時30分ごろまでに8人をヘリコプターで救助した。全員が病院へ搬送されたが、命に別条はないという。", "下田海上保安部は、潮流などで流された可能性があるとみて経緯を調べている。"], "figure": null, "sources": [{"label": "NHK", "url": "https://news.web.nhk/newsweb/na/nd-20261003de54066"}], "label": "くらし", "audience": "両方", "thread_id": "t20261004-16", "id": "6f7de1", "photo": {"type": "img", "src": "/img/kiji/6f7de1.jpg?v=bdfd22", "og": "/img/kiji/6f7de1-og.jpg?v=bdfd22", "s": "/img/kiji/6f7de1-s.jpg?v=bdfd22", "m": "/img/kiji/6f7de1-m.jpg?v=bdfd22", "caption": "海の中/八丈島", "credit": "", "file": "ac/4272244.jpg"}}, "side": [], "shorts": [{"headline": "大賀郷小、運動会の紅白決定", "body": ["八丈町立大賀郷小学校は2日、朝の集会で運動会のスローガン「全員の心を燃やせ 最高で楽しい150周年大運動会」を発表した。紅組と白組も決めた。実行委員会がスローガンを発表し、応援団長がくじを引いた。", "応援団長はA・Bグループに分かれてくじを引いた。紅組と白組はそれぞれまとまり、大きな声をあげた。運動会の準備は1日に始まり、係活動が動き出した。応援団も結成され、団長と副団長が決意を表明した。学校の150周年を記念した大会のアイディアも出ている。", "運動会は11月3日に実施する予定。天候などで難しい場合は、11月4日、5日、6日の順に順延する。順延すると授業、給食、振替休日が変わるため、学校は保護者向けに「天候等による順延について」の通知を出している。予定を変更する場合は、保護者にメールで知らせる。", "広報はちじょう2026年6月号によると、同校は今年度、創立150周年を迎え、運動会、学芸会、記念フェスティバルを予定している。"], "sources": [{"label": "大賀郷小", "url": "https://okago-es.8jo.ed.jp/n/n20b6dd51ffea"}, {"label": "広報はちじょう 2026年6月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/05/27202107/hachijo2606.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20261004-17", "id": "ec46cf", "photo": {"type": "img", "src": "/img/kiji/ec46cf.jpg?v=d2d4af", "og": "/img/kiji/ec46cf-og.jpg?v=d2d4af", "s": "/img/kiji/ec46cf-s.jpg?v=d2d4af", "m": "/img/kiji/ec46cf-m.jpg?v=d2d4af", "caption": "八丈町立大賀郷小学校", "credit": "", "file": "own/okago-sho-2.jpg"}}, {"headline": "インフル予防接種、予約を前倒し", "body": ["八丈島こころみクリニック(三根)が、インフルエンザの予防接種を始めた。島内で感染者が増えたため、予約と接種を9月25日から前倒しで受け付けている。", "同クリニックによると、3日に続き、4日午前も診療する。診療は水~日曜の午前と水~土曜の午後で、飛行機の欠航で休診になることがある。八丈町の案内では、個別接種は同クリニック(三根306-1)で14日から11月15日まで。予約は診療時間内に電話(04996-9-5535)で受け付ける。13歳以上の予約期間は3日から11日までで、小児は9月15日から24日までだった。前年は令和7年度の予約を9月20日から始めると知らせていた。", "集団接種は、三根公民館(小児のみ)が10日10時から11時まで。大賀郷公民館が25日9時から10時30分まで。樫立公民館が24日15時から16時まで。中之郷公民館が24日13時から14時まで。末吉公民館が24日10時から11時まで。1便が欠航した場合は末吉・中之郷が、2便が欠航した場合は樫立も中止になる。予約はクリニックへの電話か、各出張所の窓口(土日祝を除く9時から12時、13時から16時)で受け付ける。", "インフルエンザの自己負担は、65歳以上などの定期接種対象者(注射1回)が3,000円、生活保護受給者は無料。生後6か月から12歳の注射は1回2,000円で2回接種する。2歳以上の経鼻ワクチンは5,000円。これ以外は注射5,000円、経鼻(18歳まで)11,000円。コロナワクチン(小学生以上)は定期接種対象者が12,000円、これ以外は15,000円。広報はちじょう9月号9ページのコロナワクチンの接種費用に誤りがあり、町が訂正している。接種当日は、住所と生年月日を確認できる身分証明書が要る。忘れると全額自己負担になる。問い合わせは町福祉健康課保健係(04996-2-5570)。"], "sources": [{"label": "八丈島こころみクリニック", "url": "https://x.com/cocoromi_island/status/2106167310390353965"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/kenko-fukushi/yobo-sesshu/oshirase-20260901-07-2/"}], "label": "くらし", "audience": "島民", "thread_id": "t20261004-18", "id": "f031a7", "photo": {"type": "img", "src": "/img/kiji/f031a7.jpg?v=6aab92", "og": "/img/kiji/f031a7-og.jpg?v=6aab92", "s": "/img/kiji/f031a7-s.jpg?v=6aab92", "m": "/img/kiji/f031a7-m.jpg?v=6aab92", "caption": "インフルエンザ予防接種 予診票", "credit": "", "file": "ac/35450624.jpg"}}, {"headline": "光るキノコナイトウォーク終了", "body": ["八丈島観光レクリエーション研究会は1日、「光るキノコナイトウォーク2026」が今シーズンの開催を終えたと案内した。夜の森で光る生きものを観察する催しで、来シーズンも開催する予定という。", "開催期間は7月25日から9月30日まで。集合・受付は19時30分で、定員は20人の先着順だった。料金は大人(中学生以上)4,000円、子ども(5歳〜小学生)3,000円。8月は毎週土曜に、生物発光のしくみをLL反応の実験で解説する「プレミアムナイトラボ」も開いた。", "同会は2024年7月25日に「光るキノコガイドウォーク」の開催を知らせ、9月8日に今季の営業を終えた。当時の料金は大人3,000円、小学生2,000円だった。", "「ヘゴの森遊歩道」と「光るキノコの森」は台風で大きな被害を受けた。同会は2026年1月8日に未来へつなぐためのクラウドファンディングを公開し、2月20日に終えた。2026年9月は荒天や台風25号の影響で中止が続いた。最終日の30日も台風26号の影響で中止となった。"], "sources": [{"label": "八丈島観光レクリエーション研究会", "url": "https://x.com/hachijolab/status/2105481131118481752"}], "label": "文化", "audience": "両方", "thread_id": "t20261004-19", "id": "273695", "photo": {"type": "img", "src": "/img/kiji/273695.jpg?v=8aa489", "og": "/img/kiji/273695-og.jpg?v=8aa489", "s": "/img/kiji/273695-s.jpg?v=8aa489", "m": "/img/kiji/273695-m.jpg?v=8aa489", "caption": "八丈島の光るキノコ(スマホ撮影)", "credit": "", "file": "ac/33348311.jpg"}}, {"headline": "二十歳のつどい、1月5日に", "body": ["八丈町は、令和9年「二十歳のつどい」を2027年1月5日に八丈町多目的ホール「おじゃれ」で開く。受付は9時45分から、開式は10時30分。", "対象は、2006年4月2日から2007年4月1日までに生まれ、町に住所を有したことがある人。通知の送付対象は、2021年4月2日以降に町に住所を有していた人で、案内は9月中旬に発送した。案内が届かない場合は、宛先不明などで返送された可能性があるため、問い合わせ先へ連絡するよう案内している。", "島外へ転出していて出席を希望する人は、12月11日までに連絡する。問い合わせ先は町教育課生涯学習係(電話04996-2-7071)。", "広報はちじょう2025年12月号によると、成年年齢の引き下げ後も20歳を対象に、成人祝賀式を「二十歳のつどい」として開いている。"], "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-0928/"}, {"label": "広報はちじょう 2025年12月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114506/hachijo2512.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20261004-20", "id": "6c9a96", "photo": {"type": "img", "src": "/img/kiji/6c9a96.jpg?v=70dca9", "og": "/img/kiji/6c9a96-og.jpg?v=70dca9", "s": "/img/kiji/6c9a96-s.jpg?v=70dca9", "m": "/img/kiji/6c9a96-m.jpg?v=70dca9", "caption": "八丈町役場", "credit": "", "file": "own/yakuba-12.jpg"}}], "agenda": [{"date": "2026-10-09", "end": null, "text": "寄での郷土料理の催し", "url": "https://x.com/sasaosou/status/2106178855216218308"}, {"date": "2026-10-10", "end": "2026-10-12"   if(f.type==="table") return `<figure class="zu-fig zu-tbl"><p class="zt-h">${esc(f.title)}</p><table>${f.rows.map(([k,v,w])=>`<tr><th>${esc(k)}</th><td class="${w?"warn":""}">${esc(v)}</td></tr>`).join("")}</table>${cap}</figure>`;
  return `<figure><div class="photo"><img src="${esc(f.src)}" alt="${esc(f.caption)}" loading="lazy"></div></figure>`;   
}
 
const thumb = (e,a) => { const f=a.photo; if(!f||f.type!=="img") return "";
  const img=`<img src="${esc(f.src)}"${f.m?` srcset="${esc(f.m)} 240w, ${esc(f.src)} 1200w" sizes="(min-width:1000px) 380px, 120px"`:""} alt="${esc(f.caption)}" width="1200" height="800" loading="lazy">`;
  return a.id?`<a class="kp" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/" tabindex="-1">${img}</a>`:`<span class="kp">${img}</span>`; };
 
function ichigyo(w){
  const d=(w.days||[])[0]||{}, t=String(d.hachijo??d.main??d.weather??"");
  const ten=tenOf(t);
  
  const o=w.obs, dir=o?(o.wind_dir.length===3?o.wind_dir[0]:o.wind_dir):"";
  const kaze=o?(dir==="静穏"?"静穏":esc(`${dir}風${Math.round(Number(o.wind))}m`)):"";
  return [ten,kaze,d.max!=null?`${esc(d.max)}<span class="deg">°C</span>`:""].filter(Boolean).join(" ");
}
 
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  くもり:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 7 18z"/></svg>',
  あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
 
 
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const MEDAL={"🥇":1,"🥈":2,"🥉":3};
const rankMark = m => MEDAL[m]?`<i class="r${MEDAL[m]}" aria-label="${MEDAL[m]}位">${MEDAL[m]}</i>`:`<i class="r0" aria-hidden="true"></i>`;

}
 
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>

function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";

  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}

      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
