<style>

:root{
  --paper:#ffffff; --ink:#1f1f1f; --ink-2:#555555; --ink-3:#8a8a8a; --rule:#000000; --hair:#c8c8c8;
  --band-bg:#000000; --band-ink:#ffffff; --tamamushi:#00562B;   /* 社の色(玉虫色) */ --red:#d1001f; --photo:#e4e4e4;
  --min:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --goth:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;   /* 端末の標準のゴシック(主な新聞社サイトと同じ。2026-10-27) */
  /* 文字の大きさは4つだけ(題字と題字の左右は別):見出し・小見出し・本文・添え書き。2026-10-27 */
  /* 書体:明朝は題字と見出しだけ。本文・一覧・添え書きはゴシック(新聞社サイトの記事本文と同じ。2026-10-27) */
  --fs-h:clamp(24px,5.6vw,34px); --fs-s:clamp(18px,4.4vw,21px); --fs-b:17px; --fs-m:13px;
  color-scheme:only light; box-sizing:border-box;   /* いつも白地(端末のダークモードに合わせない。2026-10-24 決定) */
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--goth);font-size:var(--fs-b);line-height:1.8;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:.2em}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 40px}

/* 題字の段:PC は左に日付、中央に題字、右に天気(紙面の外のページは題字だけ) */
.mast{display:grid;grid-template-columns:auto auto;justify-content:space-between;align-items:baseline;gap:10px 12px;padding:18px 0 8px;border-bottom:3px solid var(--rule)}
.mast .daiji{grid-column:1/-1;grid-row:1}
.daiji{font-family:var(--min);font-weight:800;font-size:clamp(40px,8vw,76px);line-height:1;letter-spacing:-.02em;text-align:center;white-space:nowrap}
.daiji a:hover{text-decoration:none}
.mast .hi,.mast .ten{font-family:var(--goth);font-size:clamp(14px,3.8vw,21px);font-weight:700;line-height:1.4;white-space:nowrap}   /* 字の大きさは前のまま。スマホでも1行 */
.mast .ten{text-align:right}
@media (min-width:920px){.mast{grid-template-columns:1fr auto 1fr}.mast .daiji{grid-column:2}.mast .hi,.mast .ten{grid-row:1}}
.mast{position:relative}
/* 帯見出しと記事のラベル(同じ形。ラベルは色を反転) */
.band{display:inline-block;min-width:9.5em;white-space:nowrap;background:var(--paper);color:var(--tamamushi);border:1px solid var(--tamamushi);font-family:var(--goth);font-weight:900;
  font-size:var(--fs-b);letter-spacing:.06em;padding:1px 9px 2px;margin:0 0 12px}   /* 欄の見出し:白地に玉虫色。どの欄も同じ長さ。字は本文と同じ大きさ(2026-10-28) */
.label{display:inline-block;width:9.5em;font-family:var(--goth);font-weight:900;font-size:var(--fs-b);letter-spacing:.06em;background:var(--tamamushi);color:var(--band-ink);border:1px solid var(--tamamushi);padding:1px 9px 2px}
a.label,.band:not(.onair) a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}   /* 押せるラベルと帯見出しには下線 */
a.label:hover,.band:not(.onair) a:hover{opacity:.85}
.band.solid{background:var(--tamamushi);color:var(--band-ink)}.band.solid a{color:var(--band-ink)}
/* 議員動静の順位の印(金・銀・銅の丸数字。紙面と一覧で同じ) */
.giin i{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;margin-right:.45em;border-radius:50%;
  font-style:normal;font-size:var(--fs-m);font-weight:700;color:#fff;vertical-align:.1em;font-feature-settings:"tnum"}
.giin i.r1{background:#b8912f}.giin i.r2{background:#8e9499}.giin i.r3{background:#a5673f}.giin i.r0{background:none}
/* PC:題字の下にページの帯(スマホでは隠して ☰) */
.nb{display:flex;align-items:center;gap:0 16px;padding:9px 0;border-bottom:1px solid var(--hair);font-family:var(--goth);
  font-size:14px;font-weight:700;letter-spacing:0;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.nb::-webkit-scrollbar{display:none}.nb a{color:var(--ink)}.nb a[aria-current]{color:var(--tamamushi)}
.nb i{flex:none;width:1px;height:1em;background:var(--hair)}.nb .bn{margin-left:auto;padding-left:16px;color:var(--ink-3)}
.tvl{display:block;flex:none;line-height:0}.tvl img{display:block;height:20px;width:auto}.tvl:hover{opacity:.8}   /* ロゴは帯の字と同じくらいの高さ */
@media (max-width:1100px){.nb{font-size:13px;gap:0 10px}.tvl img{height:17px}}   /* 収まらない幅では帯を横にずらせる */
.menu,.sbar{display:none}
@media (max-width:999px){   /* 帯が1行に入らない幅(タブレットの縦など)からは ☰ */
  .nb{display:none}
  .menu{display:block;position:absolute;right:-8px;top:16px}
  .menu summary{list-style:none;cursor:pointer;width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 8px}
  .menu summary::-webkit-details-marker{display:none}.menu summary span{display:block;height:2px;background:var(--ink)}
  .menu[open] summary span:nth-child(1){transform:translateY(8px) rotate(45deg)}.menu[open] summary span:nth-child(2){opacity:0}
  .menu[open] summary span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
  .menu nav{position:absolute;right:0;top:46px;z-index:10;width:min(86vw,330px);background:var(--paper);border:1px solid var(--ink);
    padding:4px 0;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .menu nav div{display:grid;grid-template-columns:1fr 1fr;padding:4px 0}.menu nav div+div{border-top:1px solid var(--hair)}
  .menu nav a{display:block;padding:8px 16px;font-family:var(--goth);font-size:16px;font-weight:700;letter-spacing:0;text-align:left;white-space:nowrap}
  .menu nav a[aria-current]{color:var(--tamamushi)}
  .menu nav a.tvl{display:flex;align-items:center}.menu nav .tvl img{height:18px}
  /* 上へ戻したときだけ出る細い帯(小さな題字と ☰) */
  .sbar{display:block;position:fixed;left:0;right:0;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);
    padding-top:env(safe-area-inset-top,0px);transform:translateY(-110%);transition:transform .2s}.sbar.on{transform:none}
  .sbar .in{position:relative;height:46px;margin:0 16px;display:flex;align-items:center;justify-content:center}
  .sbar .daiji{font-size:24px}.sbar .menu{top:3px}
}
/* 紙面の外のページ:枠(題字の段・帯・足元)は紙面と同じ幅、中身だけ狭い段 */
/* 足元:細い線 → © → 断り書き(灰色で1行。狭い画面では字を小さく) */
.sf{margin-top:32px;border-top:1px solid var(--hair);padding-top:10px;font-family:var(--goth);color:var(--ink-3)}
.sf p{margin:0;font-size:var(--fs-m);line-height:1.7}
.sf .kotowari{white-space:nowrap;font-size:clamp(9px,calc((100vw - 32px) / 33),13px);letter-spacing:0}
   /* 色・書体・題字の段・帯・☰・足元は shinbun/build/chrome.py(全ページ共通) */

.deg{line-height:1;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:600}   /* 和文の書体だと「°」が全角幅で間が空く */

/* ── 帯見出し(白抜き) ── */
.men{padding-top:20px}

/* ── 一面 ── */
.ichimen{display:grid;gap:20px;padding-top:18px}
.top h2{font-family:var(--goth);font-weight:700;font-feature-settings:"palt";letter-spacing:.01em;font-size:var(--fs-h);line-height:1.4;margin-bottom:8px}   /* 見出しはゴシックの太字、約物を詰める(新聞社サイトの作法) */

/* 記事のラベル:欄の見出しと同じ形と大きさで、色を反転(玉虫色の地に白) */
.labels{display:flex;gap:6px;margin-bottom:8px}
a.hl{color:inherit}a.hl:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.15em}
.more{margin:4px 0 0;text-align:right;font-family:var(--goth);font-size:var(--fs-m)}.more a{text-decoration:underline}
.top2{border-top:1px solid var(--rule);margin-top:28px;padding-top:20px}
figure{margin:0 0 12px}
.photo{aspect-ratio:3/2;background:var(--photo);display:grid;place-items:center;color:var(--ink-3);font-family:var(--goth);font-size:var(--fs-m)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.zu{display:block;width:100%;height:auto;max-width:520px}
.zu text{font-family:var(--goth);fill:var(--ink)}
.zu .zt{font-size:17px;font-weight:900}
.zu .zs{font-size:13px;fill:var(--ink-2)}
.zu .zn{font-size:26px;font-weight:900;fill:var(--red)}
.zu .zm{font-size:13px;font-weight:700}
.zu .zw{font-size:11px;fill:var(--ink-3)}
.zu rect.on{fill:var(--ink)}
.zu rect.off{fill:none;stroke:var(--hair)}
.zu rect.today{fill:none;stroke:var(--red);stroke-width:3}
.zu .don{fill:var(--paper);font-size:12px;font-weight:700}
.zu .doff{font-size:12px;fill:var(--ink-2)}
.zu-fig{border-top:1px solid var(--rule);padding-top:10px}
.zt-h{font-family:var(--goth);font-weight:900;font-size:var(--fs-s);margin-bottom:6px}
.zu-tbl td{font-weight:700;white-space:nowrap}
.zu-tbl td.warn{color:var(--red)}
.zu-tbl th{white-space:normal;font-weight:500}
.embed{max-width:540px}
.embed>blockquote{margin:0 !important;min-width:0 !important}
figcaption{font-family:var(--goth);font-size:var(--fs-m);line-height:1.5;color:var(--ink-2);padding-top:5px}
.honbun p{text-indent:1em;text-align:justify}
.honbun p+p{margin-top:.15em}
.src{display:block;margin-top:6px;font-family:var(--goth);font-size:var(--fs-m);line-height:1.5;color:var(--ink-3)}
.src a{text-decoration:underline;text-underline-offset:.15em}
.rail{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-content:start}

/* テレビ小窓 */
.band.onair{display:inline-flex;align-items:center;gap:6px;background:var(--red);border-color:var(--red);color:var(--band-ink)}   /* 帯見出しと同じ形で、放送中だけ赤 */
.band.onair a{display:inline-flex;align-items:center;gap:6px;color:inherit}
.onair i{width:7px;height:7px;border-radius:50%;background:var(--band-ink);display:inline-block}
@media (prefers-reduced-motion:no-preference){.onair i{animation:blink 2s steps(1) infinite}}
.tv .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.tv .head .band{margin:0}
.tv .chl{display:block}.tv .ch{height:30px;width:auto;display:block}   /* ON AIR の帯と同じ高さに見える大きさ */
@keyframes blink{50%{opacity:.25}}
/* 島の足 */
.ashi th{white-space:normal;font-weight:700}
.ashi td.st{font-weight:700;white-space:nowrap;text-align:right}
.ashi small{display:block;color:var(--ink-2);font-size:var(--fs-m)}
.ashi .note{font-family:var(--goth);font-size:var(--fs-m);color:var(--ink-3);margin-top:4px}

/* 天気(右の列):1日1行 */
.wx-row{display:flex;flex-wrap:nowrap;align-items:center;gap:2px 9px;white-space:nowrap;padding:7px 0;border-bottom:1px solid var(--hair);font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
.wx-row b{min-width:2.6em;font-weight:900}
.wx-row .ic{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.wx-row svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wx-row .t{font-weight:700}.wx-row .t small{color:var(--ink-3);font-weight:500}
.wx-row .s{color:var(--ink-2);font-size:var(--fs-m);min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 今週の一面・人口 */
.week{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
.week li{padding:3px 0}
.week a{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 1日1行 */
.week time{display:inline-block;width:7.6em;color:var(--ink-3);font-size:var(--fs-m);font-weight:400}
.giin{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
.giin li{padding:3px 0;display:flex;align-items:baseline}
.giin .nm{flex:none;white-space:nowrap}.giin a.nm{text-decoration:underline;text-underline-offset:.15em}   /* 議員のページへ(2026-10-28 利用者と決めた) */
.giin .ps{flex:1;min-width:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.giin q{quotes:none}
.giin b{font-weight:900;margin-right:.6em}
.giin time{color:var(--ink-3);font-size:var(--fs-m);margin-right:.6em}
.giin .ik{font-weight:700}.giin .ik.nd{font-weight:400}.giin .ps.nd q{color:var(--ink-3)}.giin .ps:not(.nd) q{font-weight:700}   /* 分類。本来の仕事は太字、加点しない発信は灰色 */
/* 島のいま:天気・暦・船・人口を1つの欄に。見出しは左の小さな列 */
.kurashi{display:grid;grid-template-columns:2.6em minmax(0,1fr);margin:6px 0 0;font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
.kurashi dt,.kurashi dd{margin:0;padding:6px 0;border-bottom:1px solid var(--hair)}
.kurashi dt{font-weight:900}
.kurashi dd b{font-weight:900}.kurashi .fune b{white-space:nowrap}
.kurashi small{color:var(--ink-2);font-size:var(--fs-m)}
.kurashi .fune{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.kurashi .fune span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kurashi .fune+.fune{margin-top:4px}
.kurashi dd{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.kurashi .fune b{flex:none}
.kurashi .ev{white-space:normal}.kurashi .ev+.ev{margin-top:4px}.kurashi .ev time{color:var(--ink-2);margin-right:.2em}.kurashi .ev a{color:inherit}
.note .nw{white-space:nowrap}
/* 注意報は黄、警報は赤、特別警報は紫(気象庁の色分けにならう) */
.keiho{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:8px;font-family:var(--goth);font-weight:900;font-size:var(--fs-b)}
.keiho span{padding:1px 8px}
.keiho .lv1{background:#f2d000;color:#000}
.keiho .lv2{background:var(--red);color:#fff}
.keiho .lv3{background:#6a1b9a;color:#fff}
/* きょうの一曲 */
.kyoku .kk{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.kyoku img{width:96px;height:96px;object-fit:cover;flex:none;display:block;background:var(--photo)}
.kyoku h3{font-family:var(--goth);font-weight:700;font-feature-settings:"palt";letter-spacing:.01em;font-size:var(--fs-s);line-height:1.4}
.kyoku .who{font-family:var(--goth);font-weight:700;font-size:var(--fs-b);line-height:1.5;margin-top:2px}
.kyoku .who small{display:block;color:var(--ink-3);font-weight:500;font-size:var(--fs-m)}
.kyoku p.txt{font-size:var(--fs-b);line-height:1.8;text-align:justify}
.kyoku .kiku{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-family:var(--goth);font-size:var(--fs-m);font-weight:700}
.kyoku .kiku a{text-decoration:underline;text-underline-offset:.2em}
/* 島のたより */
.tayori{border-top:1px solid var(--rule);margin-top:28px;padding-top:20px}   /* 記事の間の線と同じ */
.tayori h3{font-family:var(--goth);font-weight:700;font-feature-settings:"palt";letter-spacing:.01em;font-size:var(--fs-h);line-height:1.4;margin-bottom:8px}   /* 記事の見出しと同じ */
.tayori .honbun a{text-decoration:underline;text-underline-offset:.2em;text-decoration-color:var(--ink-3)}

/* ── 表組み ── */
table{width:100%;border-collapse:collapse;font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
th,td{padding:6px 4px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
th{font-weight:700;white-space:nowrap}
tr.day th{white-space:normal;font-size:var(--fs-b);font-weight:900;border-bottom:1px solid var(--rule);padding-top:12px}
tr.day:first-child th{padding-top:0}
.note{font-family:var(--goth);font-size:var(--fs-m);line-height:1.6;color:var(--ink-3);margin-top:8px}
.note a{text-decoration:underline}
.koyomi{margin-top:14px}
.koyomi td{white-space:nowrap}
.ronten-t{font-family:var(--goth);font-weight:700;font-size:var(--fs-s);line-height:1.35;margin-bottom:10px}
.ronten-g{display:grid;gap:4px 28px}
.ronten-g h4{margin:0 0 6px;font-family:var(--goth);font-weight:900;font-size:var(--fs-b);border-bottom:1px solid var(--rule);padding-bottom:3px}
.ronten-g ul{margin:0 0 12px;padding:0;list-style:none;font-size:var(--fs-b);line-height:1.7}
.ronten-g li{padding:4px 0;border-bottom:1px solid var(--hair)}
.weekly{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:var(--fs-b);font-weight:700}
.weekly li{border-bottom:1px solid var(--hair);padding:7px 0}
.weekly span{display:inline-block;width:5.5em;font-weight:500;color:var(--ink-3);font-size:var(--fs-m)}

/* ── 号の送り(足元は chrome の全ページ共通) ── */

const KD="〇一二三四五六七八九", WD="日月火水木金土";
function kan(n){ n=Number(n); if(!n) return "〇"; let s=""; for(const [c,v] of [["千",1000],["百",100],["十",10]]){const d=Math.floor(n/v); if(d){s+=(d===1?"":KD[d])+c; n%=v;}} return s+(n?KD[n]:""); }
function ymd(iso){ const [y,m,d]=iso.split("-").map(Number); return {y,m,d,w:new Date(Date.UTC(y,m-1,d)).getUTCDay()}; }
const seireki = iso => { const t=ymd(iso); return `${t.y}年${t.m}月${t.d}日`; };
const tsuki = iso => { const t=ymd(iso); return `${t.m}月${t.d}日(${WD[t.w]})`; };   // 欄の中の日付はこの書き方
const hiduke = iso => `${seireki(iso)}(${WD[ymd(iso).w]})`;   // 紙面の日付はこの書き方ひとつ
const hm = iso => { const [h,m]=(iso.split("T")[1]||"").split(":"); return `${Number(h)}時${Number(m)?Number(m)+"分":""}`; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const srcName = l => String(l||"").replace(/(?:[(（][^()（）]*[)）])?[(（]X[)）]$/,"");   // 愛称と「(X)」は出さない
const src = list => { const seen=new Set(), l=(list||[]).filter(s=>{const n=srcName(s.label); return !seen.has(n)&&seen.add(n);});   // 同じ名前は1回だけ
  return l.length ? `<span class="src">出典 ${l.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(srcName(s.label))}</a>`).join("、")}</span>` : ""; };
/* 見出しから記事のページへ(1本ずつのページ。共有するとその記事の見出しが出る) */
const DAY = e => e.proof?"":`/${e.date.replace(/-/g,"/")}/`;   // その日の号の URL(一曲・たよりの個別のページはこの下)
const hl = (e,a) => a.id?`<a class="hl" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/">${esc(a.headline)}</a>`:esc(a.headline);
const GENRE={"町政": "chosei", "交通・防災": "kotsu-bosai", "暮らし": "kurashi", "産業": "sangyo", "文化・催し": "moyooshi-bunka"};   // 記事のラベル → /bunrui/slug/(chrome.LABEL_SLUG)
const lbl = a => a.label?`<p class="labels">${GENRE[a.label]?`<a class="label" href="/bunrui/${GENRE[a.label]}/">${esc(a.label)}</a>`:`<span class="label">${esc(a.label)}</span>`}</p>`:"";   // 記事のラベル(町政・交通・防災・暮らし・産業・文化・催し)
const paras = b => (Array.isArray(b)?b:[b]).map(p=>`<p>${esc(p)}</p>`).join("");

function figure(f){
  if(!f) return "";
  const cap = `<figcaption>${esc(f.caption)}(${esc(f.credit)})</figcaption>`;
  if(f.type==="svg") return `<figure class="zu-fig">${f.svg}${cap}</figure>`;

/* 題字下の1行:天気はおおまかに(のち・時々・一時は省く)、風はアメダスの観測、気温はきょうの最高。半角スペースで区切る */
function ichigyo(w){
  const d=(w.days||[])[0]||{}, t=String(d.hachijo??d.main??d.weather??"");
  const ten=tenOf(t);
  // 風向は3文字の向きを丸める(南南西→南、東北東→東)。風速は四捨五入した整数(利用者の指定、2026-10-25)
  const o=w.obs, dir=o?(o.wind_dir.length===3?o.wind_dir[0]:o.wind_dir):"";
  const kaze=o?(dir==="静穏"?"静穏":esc(`${dir}風${Math.round(Number(o.wind))}m`)):"";
  return [ten,kaze,d.max!=null?`${esc(d.max)}<span class="deg">°C</span>`:""].filter(Boolean).join(" ");
}
/* 天気欄の1行:予報文はおおまかに(題字下と同じ丸め)、降水確率はその日のいちばん高い値、風は「後」の前、波は最初の高さ */
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  くもり:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 7 18z"/></svg>',
  あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
/* 島の足:東海汽船の表を、島の人が読む形に並べ直す(言葉は表のまま)。「島のいま」の「船」の項になる */
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  // 載せるのは、けさ八丈島に着く東京からの船(昨晩発)と、八丈島→青ヶ島。今晩発・八丈島→東京・青ヶ島→八丈島は載せない(利用者の指定)
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    // 定型の案内文は「条件付き」、運休日や更新予定は状態の列へ(言葉は表のまま)
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;

/* 島のいまの「催し」:先7日の催しを数行(夜に重なりをまとめた desk/korekara)。前の形(today/soon)の号もそのまま並べる */
/* 催しの日:曜日を必ず添える(人は曜日で予定を捉える。2026-10-29 利用者)。発行月なら「31日(土)」、別の月は「11月1日(日)」 */
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];

function evLines(e){

/* 島のいま:注意報・天気・暦・船・人口を1つの欄に。値は発表のまま */
function shimaSection(e){

      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="tv" aria-label="FM八丈島テレビ">

        <div style="position:relative;width:100%;height:0;padding-top:calc(56.25% + 44px)"><iframe src="${TV_EMBED}" title="FM八丈島テレビ" style="position:absolute;inset:0;display:block;width:100%;height:100%;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      </section>
      ${(e.ichimen_week||[]).length?`<section id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h"><a href="/bunrui/ichimen/">今週の一面</a></h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><a href="${esc(w.url)}"><time datetime="${esc(w.date)}">${tsuki(w.date)}</time>${esc(w.headlines[0])}</a></li>`).join("")}</ol>
      </section>`:""}
      ${giinSection(e)}
      ${kyokuSection(e.kyoku&&{...e.kyoku,day:DAY(e)})}
      ${shimaSection(e)}

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};
  [...new Set([...document.querySelectorAll("figure.embed")].map(f=>f.dataset.provider))].forEach(p=>{
    if(!need[p]) return; const sc=document.createElement("script"); sc.src=need[p]; sc.async=true; document.body.appendChild(sc);
  });
}
if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
