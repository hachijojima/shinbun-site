あおがしま丸", "port": "三宝港", "status": "欠航", "note": ""}]}, "number": null, "top": {"headline": "119ライデンに不正アクセス", "body": ["八丈町は23日、消防向けの一斉連絡用システム「119ライデン」と緊急通報システム「NET119」に11日、第三者による不正アクセスがあったと明らかにした。登録されていたメールアドレス5件の流出が確認された。", "町は14日、サービス提供事業者アルカディアのホームページで情報を把握した。同日、契約代理店からも連絡を受けた。19日に事業者から報告があり、流出が確認された。11日という発生日は、事業者のホームページによる。", "町は把握した時点で、被害が出たかどうかを問わず登録者に速報を送り、注意を呼びかけた。被害の範囲が固まった後は、対象者に個別に追加で報告した。事業者の対処で不正アクセスは遮断され、サービスは復旧作業中である。今後の利用は、事業者の情報を見ながら町が随時対応する。", "アルカディアは、自社サービスへの不正アクセスで個人情報が外部に流れた可能性があると公表している。詳細は状況に応じて別のページで報告するとしている。", "問い合わせは八丈町消防本部(04996-2-0119)と八丈町役場(04996-2-1121)で受ける。役場の開庁は8時30分から17時15分で、土日祝と12月29日から1月3日は休む。"], "figure": null, "sources": [{"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261023/"}, {"label": "アルカディア", "url": "https://www.arcadia.co.jp/info/4076"}], "label": "町政", "audience": "両方", "id": "825bc2", "photo": {"type": "img", "src": "/img/kiji/825bc2.jpg?v=ea37c2", "og": "/img/kiji/825bc2-og.jpg?v=ea37c2", "s": "/img/kiji/825bc2-s.jpg?v=ea37c2", "m": "/img/kiji/825bc2-m.jpg?v=ea37c2", "caption": "パソコンと虫メガネで表す情報セキュリティ", "credit": "", "file": "ac/35531700.jpg"}}, "side": [], "shorts": [{"headline": "集団接種で24日と25日休診", "body": ["八丈島こころみクリニックは24日と25日、インフルエンザの集団接種に対応するため外来診療を休診する。休診中は電話対応もしない。", "町の集団接種は24日に末吉、中之郷、樫立の各公民館、25日に大賀郷公民館で予定されている。通常診療とは別に地域を回る接種日程へ対応するための休診となる。"], "sources": [{"label": "八丈島こころみクリニック", "url": "https://x.com/cocoromi_island"}, {"label": "八丈町", "url": "https://www.town.hachijo.tokyo.jp/kenko-fukushi/yobo-sesshu/oshirase-20260901-07-2/"}], "label": "くらし", "audience": "両方", "id": "c5c324", "photo": {"type": "img", "src": "/img/kiji/c5c324.jpg?v=a1f31c", "og": "/img/kiji/c5c324-og.jpg?v=a1f31c", "s": "/img/kiji/c5c324-s.jpg?v=a1f31c", "m": "/img/kiji/c5c324-m.jpg?v=a1f31c", "caption": "こころみクリニック", "credit": "", "file": "own/kokoromi-clinic-2.jpg"}}, {"headline": "資料館がグッドデザイン賞に", "body": ["八丈町によると、八丈島歴史民俗資料館が22日までに2026年度グッドデザイン賞を受賞した。", "資料館の建物は1939年に東京都八丈支庁の庁舎として完成した。前年の台風で大きな被害を受けた旧庁舎に代わるものだった。1943年には建物の西側に新館が増築された。", "1971年に支庁が現在の場所へ移った。1975年5月、東京都所有のまま町に無償で貸し出され、資料館として開館した。展示資料は1,500点余りだった。本館は1999年に国登録有形文化財に登録された。戦前の木造の新館も2021年に登録された。", "2017年に移転・整備の検討委員会が開かれた。2018年、老朽化と耐震性の問題から機能の一部が八丈支庁の展示ホールへ移り、建物は閉館した。2019年に町が建物と敷地を取得し、2021年に大規模改修工事に入った。2025年10月1日に「建物の文化的価値を生かした新しい八丈島歴史民俗資料館」として、改装を終えて再開した。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi"}], "label": "文化", "audience": "両方", "id": "024e63", "photo": {"type": "img", "src": "/img/kiji/024e63.jpg?v=680e4c", "og": "/img/kiji/024e63-og.jpg?v=680e4c", "s": "/img/kiji/024e63-s.jpg?v=680e4c", "m": "/img/kiji/024e63-m.jpg?v=680e4c", "caption": "八丈島歴史民俗資料館", "credit": "", "file": "own/rekimin-1.jpg"}}, {"headline": "文化財ウィーク、島内で公開", "body": ["東京都教育庁八丈出張所によると、東京文化財ウィークの公開事業が24日、島内で始まった。樫立踊《場踊》は11月3日まで、服部屋敷で公開される。", "場踊は午前10時から10時30分まで。主催は樫立踊保存会で、料金は大人350円、子供200円。障がいのある方は無料。団体予約がない日は休演する場合がある。同じ樫立踊の「手踊」も、同じ時間・会場・料金で通年公開されている。", "「八丈島の民謡」の公開練習会は、31日の午後1時30分から4時まで、大賀郷公民館で開かれる。主催は八丈島民謡保存会で、料金は無料。場踊と公開練習会の問い合わせは、出張所(電話04996-2-0742)へ。", "八丈島民政資料は、24日から11月3日まで、八丈支庁展示ホールで特別公開される。時間は午前9時から午後4時30分まで。主催は八丈支庁総務課。"], "sources": [{"label": "東京都教育庁八丈出張所", "url": "https://www.kyoiku.metro.tokyo.lg.jp/about/hatijyou/cultural_propert/week/2026"}, {"label": "八丈島文化協会", "url": "https://x.com/8jobunka"}], "label": "文化", "audience": "両方", "id": "915257", "photo": {"type": "img", "src": "/img/kiji/915257.jpg?v=bda148", "og": "/img/kiji/915257-og.jpg?v=bda148", "s": "/img/kiji/915257-s.jpg?v=bda148", "m": "/img/kiji/915257-m.jpg?v=bda148", "caption": "服部屋敷", "credit": "", "file": "own/hattori-yashiki-3.jpg"}}, {"headline": "大型客船が11月1日寄港", "body": ["クルーズ客船「三井オーシャンサクラ」が11月1日、八丈島に寄港する予定となっている。八丈町が案内した。", "宮古市が10月20日に公表したデビュークルーズの行程では、船は30日に宮古港を出発し、31日に大洗へ寄港。11月1日は八丈島へ9時に入り、17時に出港し、翌2日に横浜へ到着する予定。八丈島では通船で上陸し、ふれあい牧場、南原千畳岩、八丈植物公園、登龍峠などを巡るオプショナルツアーや自由散策が組まれている。", "船は総トン数3万2477トン、全長198メートル、乗客定員458人。就航直後のデビュークルーズで八丈島が寄港地の一つとなる。"], "sources": [{"label": "八丈町", "url": "https://x.com/hachijomachi"}, {"label": "宮古市「客船『三井オーシャンサクラ』入港歓迎事業概要」", "url": "https://www.city.miyako.iwate.jp/material/files/group/1/portfes2026.pdf"}], "label": "産業", "audience": "両方", "id": "d18050", "photo": {"type": "img", "src": "/img/kiji/d18050.jpg?v=775ad9", "og": "/img/kiji/d18050-og.jpg?v=775ad9", "s": "/img/kiji/d18050-s.jpg?v=775ad9", "m": "/img/kiji/d18050-m.jpg?v=775ad9", "caption": "港 八丈島", "credit": "", "file": "ac/586682.jpg"}}], "agenda": {"today": [], "soon": [{"date": "2026-10-31", "end": null, "what": "東京文化財ウィーク2026公開事業 八丈島の民謡（大賀郷公民館）", "url": "https://www.kyoiku.metro.tokyo.lg.jp/about/hatijyou/cultural_propert/week/2026", "src": "八丈島観光協会"}, {"date": "2026-11-01", "end": null, "what": "クルーズ客船「三井オーシャンサクラ」寄港", "url": "https://www.mitsuioceancruises.com/", "src": "八丈島観光協会"}, {"date": "2026-11-01", "end": null, "what": "発酵中フェス2026", "url": "https://www.hachijo.gr.jp/blogs/fermentation-fes-2026/", "src": "八丈島観光協会"}, {"date": "2026-11-07", "end": null, "what": "優婆夷宝明神社例祭 （7日神輿､8日芸能大会､13日例祭式典）", "url": "https://x.com/go_sha1113/status/2108363943085539389?s=20", "src": "八丈島観光協会"}], "ongoing": [{"date": "2026-09-14", "end": "2027-01-11", "what": "実証事業 AIデマンドタクシー （9月14日～1月11日）", "url": "https://x.com/hachijodemand", "src": "八丈島観光協会", "left": 80}]}, "letters": [], "corrections": ["24日の号の一面「大賀郷と樫立で民謡・場踊り公開」で、八丈島の民謡の公開を24日から11月3日までとしたのは誤りで、31日の公開練習会1日だけでした。また「ダイバー8人、全員救助」の記事で、救助を22日としたのは誤りで、救助は10月3日、22日は海上保安本部がその映像を公開した日でした。どちらの記事も書き直しました。また、記事の出典などで「八丈島文化財協会」としたのは「八丈島文化協会」の誤りでした。短報「山下人形こころみ、2日間休診」で、医院の名前を「山下人形こころみクリニック」としたのは「八丈島こころみクリニック」の誤りでした。おわびして訂正します。"], "column": {"name": "島のたより", "title": "引っ越しを知らせない日", "body": ["新しい町に引っ越した。住所変更の手続きを済ませ、荷物をほどく。なのに知人へ「引っ越しました」と送る文章だけ、なかなか書けない。近況の報告には、理由まで説明しなければならない気がするからだ。", "人生の[変化を静かに引き受ける](https://note.com/urasettei/n/n7f52cf6f0e07)人は、決断の意味が言葉になるまで少し置いておける。以前の職場を悪く言う必要も、新しい生活をすぐ成功談に仕立てる必要もない。変わった事実と、それを誰にどう話すかは別の問題だ。", "もちろん知らせないと困る人には伝えなければならない。家族、仕事の相手、郵便が届く相手。義務としての連絡と、気持ちの整理としての報告を分ければ、焦りは少し減る。", "段ボールを一つ片づける。住所を一つ書き換える。外に向けた宣言より先に、新しい暮らしはそんな細かな手続きで始まっている。"]}, const KD="〇一二三四五六七八九", WD="日月火水木金土";
function kan(n){ n=Number(n); if(!n) return "〇"; let s=""; for(const [c,v] of [["千",1000],["百",100],["十",10]]){const d=Math.floor(n/v); if(d){s+=(d===1?"":KD[d])+c; n%=v;}} return s+(n?KD[n]:""); }
function ymd(iso){ const [y,m,d]=iso.split("-").map(Number); return {y,m,d,w:new Date(Date.UTC(y,m-1,d)).getUTCDay()}; }
const seireki = iso => { const t=ymd(iso); return `${t.y}年${t.m}月${t.d}日`; };
const tsuki = iso => { const t=ymd(iso); return `${t.m}月${t.d}日(${WD[t.w]})`; };   // 欄の中の日付はこの書き方
const hiduke = iso => `${seireki(iso)}(${WD[ymd(iso).w]})`;   // 紙面の日付はこの書き方ひとつ
const hm = iso => { const [h,m]=(iso.split("T")[1]||"").split(":"); return `${Number(h)}時${Number(m)?Number(m)+"分":""}`; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const srcName = l => String(l||"").replace(/(?:[(（][^()（）]*[)）])?[(（]X[)）]$/,"");   // 愛称と「(X)」は出さない
const src = list => { const seen=new Set(), l=(list||[]).filter(s=>{const n=srcName(s.label); return !seen.has(n)&&seen.add(n);});   // 同じ名前は1回だけ
  return l.length ? `<span class="src">出典 ${l.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(srcName(s.label))}</a>`).join("、")}</span>` : ""; };
/* 見出しから記事のページへ(1本ずつのページ。共有するとその記事の見出しが出る) */
const DAY = e => e.proof?"":`/${e.date.replace(/-/g,"/")}/`;   // その日の号の URL(一曲・たよりの個別のページはこの下)
const hl = (e,a) => a.id?`<a class="hl" href="/${e.date.replace(/-/g,"/")}/${esc(a.id)}/">${esc(a.headline)}</a>`:esc(a.headline);
const GENRE={"町政": "government", "産業": "industry", "くらし": "life", "教育": "education", "文化": "culture"};   // 記事のラベル → 分野のページ /slug/(chrome.LABEL_SLUG)
const lbl = a => a.label?`<p class="kick">${GENRE[a.label]?`<a href="/${GENRE[a.label]}/">${esc(a.label)}</a>`:esc(a.label)}</p>`:"";   // 記事の分野(町政・交通・防災・くらし・教育・文化・産業)
const paras = b => (Array.isArray(b)?b:[b]).map(p=>`<p>${esc(p)}</p>`).join("");

function figure(f){
  if(!f) return "";
  const cap = `<figcaption>${esc(f.caption)}${f.credit?`(${esc(f.credit)})`:""}</figcaption>`;
  if(f.type==="svg") return `<figure class="zu-fig">${f.svg}${cap}</figure>`;
  if(f.type==="table") return `<figure class="zu-fig zu-tbl"><p class="zt-h">${esc(f.title)}</p><table>${f.rows.map(([k,v,w])=>`<tr><th>${esc(k)}</th><td class="${w?"warn":""}">${esc(v)}</td></tr>`).join("")}</table>${cap}</figure>`;
  if(f.type==="embed") return `<figure class="embed" data-provider="${esc(f.provider)}">${f.html}
    <noscript><a href="${esc(f.url)}" target="_blank" rel="noopener">元の投稿を見る</a></noscript>${cap}</figure>`;
  return `<figure><div class="photo"><img src="${esc(f.src)}" alt="${esc(f.caption)}" loading="lazy"></div></figure>`;   // 写真の下の説明は出さない(alt だけ。2026-11-10 利用者)
}
/* 一面の下の記事の写真(PC は列の幅で見出しの上、スマホは右に 120×80。押すと記事へ) */
const thumb = (e,a) => { const f=a.photo; if(!f||f.type!=="img") return "";
  const img=`<img src="${esc(f.src)}"${f.m?` srcset="${esc(f.m)} 240w, ${esc(f.src)} 1200w" sizes="(min-width:1000px) 380px, 120px"`:""} alt="${esc(f.caption)}" width="1200" height="800" loading="lazy">`;

/* 題字下の1行:天気はおおまかに(のち・時々・一時は省く)、風はアメダスの観測、気温はきょうの最高。半角スペースで区切る */
function ichigyo(w){
  const d=(w.days||[])[0]||{}, t=String(d.hachijo??d.main??d.weather??"");
  const ten=tenOf(t);
  // 風向は3文字の向きを丸める(南南西→南、東北東→東)。風速は四捨五入した整数(利用者の指定、2026-10-25)
  const o=w.obs, dir=o?(o.wind_dir.length===3?o.wind_dir[0]:o.wind_dir):"";
  const kaze=o?(dir==="静穏"?"静穏":esc(`${dir}風${Math.round(Number(o.wind))}m`)):"";
  return [ten,kaze,d.max!=null?`${esc(d.max)}<span class="deg">°C</span>`:""].filter(Boolean).join(" ");
}
/* 天気欄の1行:予報文はおおまかに(題字下と同じ丸め)、降水確率はその日のいちばん高い値、風は「後」の前、波は最初の高さ */
const ICON={
  はれ:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  くもり:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 7 18z"/></svg>',
  あめ:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 7 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  ゆき:'<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>'};
const tenOf = t => { const m=String(t||"").match(/^(晴|くもり|曇|雨|雪)/); return m?{晴:"はれ",くもり:"くもり",曇:"くもり",雨:"あめ",雪:"ゆき"}[m[1]]:""; };
function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
/* 島の足:東海汽船の表を、島の人が読む形に並べ直す(言葉は表のまま)。「島のいま」の「船」の項になる */
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  // 載せるのは、けさ八丈島に着く東京からの船(昨晩発)と、八丈島→青ヶ島。今晩発・八丈島→東京・青ヶ島→八丈島は載せない(利用者の指定)
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    // 定型の案内文は「条件付き」、運休日や更新予定は状態の列へ(言葉は表のまま)
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
/* 島のいまの「催し」:先7日の催しを数行(夜に重なりをまとめた desk/korekara)。前の形(today/soon)の号もそのまま並べる */
/* 催しの日:曜日を必ず添える(人は曜日で予定を捉える。2026-10-29 利用者)。発行月なら「31日(土)」、別の月は「11月1日(日)」 */
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];

/* 島のいま:注意報・天気・暦・船・人口を1つの欄に。値は発表のまま */

  return `<section id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>

function render(e){

}
