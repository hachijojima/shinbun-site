<style>
:root{
  --paper:#ffffff; --ink:#000000; --ink-2:#4d4d4d; --ink-3:#8a8a8a; --rule:#000000; --hair:#c8c8c8;
  --band-bg:#000000; --band-ink:#ffffff; --red:#d1001f; --photo:#e4e4e4;
  --min:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --goth:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  color-scheme:only light; box-sizing:border-box;   /* いつも白地(端末のダークモードに合わせない。2026-10-24 決定) */
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--min);font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:.2em}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 40px}

/* ── 題字と耳 ── */
.mast{display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:10px 12px;padding:18px 0 10px}
.mast .daiji{grid-column:1/-1;grid-row:1}
@media (min-width:720px){.mast{grid-template-columns:1fr auto 1fr}.mast .daiji{grid-column:2;grid-row:1}}
.mimi{font-family:var(--goth);font-size:12px;line-height:1.5;color:var(--ink-2)}
.mimi b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.mimi.r{text-align:right}
.daiji{font-weight:800;font-size:clamp(44px,11vw,96px);line-height:1;letter-spacing:-.02em;text-align:center;white-space:nowrap}
.dateline{display:flex;justify-content:space-between;gap:12px;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:5px 0;font-family:var(--goth);font-size:12.5px;font-weight:500}
.dateline .c{font-weight:700}
@media (max-width:719px){.dateline .seireki{display:none}}
.kyo{display:flex;flex-wrap:wrap;gap:4px 18px;padding:8px 0;border-bottom:1px solid var(--rule);font-family:var(--goth);font-size:13px}
.kyo span{color:var(--ink-3)}
.kyo a{font-weight:700}

/* ── 警報 ── */
.keiho{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-family:var(--goth);font-size:14px}
.keiho b{color:var(--red)}
.keiho small{color:var(--ink-3);font-size:12px}

/* ── 帯見出し(白抜き) ── */
.band{display:inline-block;background:var(--band-bg);color:var(--band-ink);font-family:var(--goth);font-weight:900;
  font-size:13px;letter-spacing:.08em;padding:2px 10px 3px;margin:0 0 12px}
.men{padding-top:20px}

/* ── 一面 ── */
.ichimen{display:grid;gap:20px;padding-top:18px}
.top h2{font-weight:800;font-size:clamp(30px,6.4vw,50px);line-height:1.22;letter-spacing:-.01em;margin-bottom:10px}
.top .sode{font-family:var(--goth);font-weight:700;font-size:17px;line-height:1.5;margin-bottom:14px}
figure{margin:0 0 12px}
.photo{aspect-ratio:3/2;background:var(--photo);display:grid;place-items:center;color:var(--ink-3);font-family:var(--goth);font-size:13px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.zu{display:block;width:100%;height:auto;max-width:520px}
.zu text{font-family:var(--goth);fill:var(--ink)}
.zu .zt{font-size:17px;font-weight:900}
.zu .zs{font-size:13px;fill:var(--ink-2)}
.zu .zn{font-size:26px;font-weight:900;fill:var(--red)}
.zu .zm{font-size:13px;font-weight:700}
.zu .zw{font-size:11px;fill:var(--ink-3)}
.zu rect.on{fill:var(--ink)}
.zu rect.off{fill:none;stroke:var(--hair)}
.zu rect.today{fill:none;stroke:var(--red);stroke-width:3}
.zu .don{fill:var(--paper);font-size:12px;font-weight:700}
.zu .doff{font-size:12px;fill:var(--ink-2)}
.zu-fig{border-top:1px solid var(--rule);padding-top:10px}
.zt-h{font-family:var(--goth);font-weight:900;font-size:17px;margin-bottom:6px}
.zu-tbl td{font-weight:700;white-space:nowrap}
.zu-tbl td.warn{color:var(--red)}
.zu-tbl th{white-space:normal;font-weight:500}
.embed{max-width:540px}
.embed>blockquote{margin:0 !important;min-width:0 !important}
figcaption{font-family:var(--goth);font-size:12px;line-height:1.5;color:var(--ink-2);padding-top:5px}
.honbun p{text-indent:1em;text-align:justify}
.honbun p+p{margin-top:.15em}
.src{display:block;margin-top:6px;font-family:var(--goth);font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.src a{text-decoration:underline;text-underline-offset:.15em}
.side>*+*{border-top:1px solid var(--rule);margin-top:16px;padding-top:16px}
.side h3{font-weight:800;font-size:22px;line-height:1.35;margin-bottom:6px}

/* テレビ小窓 */
.tv .live{display:flex;align-items:center;gap:6px;font-family:var(--goth);font-size:12px;font-weight:700;margin-bottom:6px}
.tv .live i{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
@media (prefers-reduced-motion:no-preference){.tv .live i{animation:blink 2s steps(1) infinite}}
@keyframes blink{50%{opacity:.25}}
.tv .now{font-family:var(--goth);font-size:13px;line-height:1.5;padding-top:6px}
.tv .now a{font-weight:700}

/* ── 短報(ベタ記事)── */
.beta{columns:1;column-gap:28px;column-rule:1px solid var(--hair)}
.beta article{break-inside:avoid;padding:0 0 12px;margin:0 0 12px;border-bottom:1px solid var(--hair)}
.beta h3{font-family:var(--goth);font-weight:900;font-size:15.5px;line-height:1.45;margin-bottom:3px}
.beta p{font-size:14.5px;line-height:1.75;text-align:justify;text-indent:0}

/* ── 表組み ── */
table{width:100%;border-collapse:collapse;font-family:var(--goth);font-size:13.5px;line-height:1.5}
th,td{padding:6px 4px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
th{font-weight:700;white-space:nowrap}
tr.day th{white-space:normal;font-size:15px;font-weight:900;border-bottom:1px solid var(--rule);padding-top:12px}
tr.day:first-child th{padding-top:0}
.pop{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.pop span{display:block;font-size:10.5px;color:var(--ink-3)}
.note{font-family:var(--goth);font-size:11.5px;line-height:1.6;color:var(--ink-3);margin-top:8px}
.note a{text-decoration:underline}
.koe p{font-size:15px}
.koyomi{margin-top:14px}
/* 一面コラム:広い画面では縦組み、段落は▼でつなぐ */
.column{margin-top:22px;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0;display:grid;gap:10px}
.col-name{font-weight:800;font-size:22px;letter-spacing:.2em}
.col-text p{font-size:16px;line-height:1.9;text-align:justify;text-indent:1em}
.tri{display:inline-block;margin:0 .15em;font-size:.8em}
.tcy{text-combine-upright:all}
.up{text-orientation:upright;letter-spacing:-.05em}
.ronten-t{font-weight:800;font-size:24px;line-height:1.35;margin-bottom:10px}
.ronten-g{display:grid;gap:4px 28px}
.ronten-g h4{margin:0 0 6px;font-family:var(--goth);font-weight:900;font-size:14px;border-bottom:1px solid var(--rule);padding-bottom:3px}
.ronten-g ul{margin:0 0 12px;padding:0;list-style:none;font-size:15px;line-height:1.7}
.ronten-g li{padding:4px 0;border-bottom:1px solid var(--hair)}
.yotei{display:grid;gap:4px 28px}
.yotei h3{font-family:var(--goth);font-weight:900;font-size:14px;border-bottom:1px solid var(--rule);padding-bottom:3px;margin-bottom:6px}
.yotei ul{list-style:none;margin:0 0 12px;padding:0;font-family:var(--goth);font-size:14px;line-height:1.55}
.yotei li{padding:5px 0;border-bottom:1px solid var(--hair)}
.yotei li span{display:block;font-size:12px;color:var(--ink-3)}
.yotei b{color:var(--red)}
.yotei p{font-family:var(--goth);font-size:13px;color:var(--ink-3)}
.weekly{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:15px;font-weight:700}
.weekly li{border-bottom:1px solid var(--hair);padding:7px 0}
.weekly span{display:inline-block;width:5.5em;font-weight:500;color:var(--ink-3);font-size:13px}
.koe cite{display:block;font-style:normal;font-family:var(--goth);font-size:12px;color:var(--ink-3);margin:2px 0 12px}
.teisei b{font-family:var(--goth)}

/* ── 奥付 ── */
.oku{margin-top:28px;border-top:3px solid var(--rule);padding-top:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;
  font-family:var(--goth);font-size:12.5px}
.oku nav{display:flex;gap:18px;font-weight:700}
.oku .meta{color:var(--ink-3)}
.kyukan{text-align:center;padding:72px 0;border-bottom:1px solid var(--rule)}
.kyukan h2{font-weight:800;font-size:32px;margin-bottom:8px}

/* ── 段組み(広い画面)── */
.lower{display:grid;gap:0 28px}
@media (min-width:720px){
  .beta{columns:2}
  .lower{grid-template-columns:1fr 1fr}
}
@media (min-width:1000px){
  .ichimen{grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:28px}
  .ichimen .side{border-left:1px solid var(--rule);padding-left:28px}
  .top-body{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px}
  .top-body figure{order:2}
  .top-body.nophoto{display:block;columns:2;column-gap:28px;column-rule:1px solid var(--hair)}
  .beta{columns:4}
  .yotei{grid-template-columns:repeat(3,1fr)}
  .ronten-g{grid-template-columns:repeat(4,1fr)}
  .column{grid-template-columns:auto 1fr;align-items:start}
  .col-name{writing-mode:vertical-rl;padding:4px 10px 4px 0;border-right:1px solid var(--rule);order:2}
  .col-text{order:1;overflow-x:auto;direction:rtl}
  .col-text p{writing-mode:vertical-rl;direction:ltr;height:19em;margin:0;text-indent:1em}
  .lower{grid-template-columns:4fr 5fr 3fr}
  .lower>section+section{border-left:1px solid var(--hair);padding-left:28px}
  .lower2{grid-template-columns:8fr 4fr}
  .lower-yt{grid-template-columns:7fr 5fr}
}
</style>

const hm = iso => { const [h,m]=(iso.split("T")[1]||"").split(":"); return `${Number(h)}時${Number(m)?Number(m)+"分":""}`; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const src = list => list && list.length ? `<span class="src">出典 ${list.map(s=>`<a href="${esc(s.url)}" rel="noopener">${esc(s.label)}</a>`).join("、")}</span>` : "";
const paras = b => (Array.isArray(b)?b:[b]).map(p=>`<p>${esc(p)}</p>`).join("");

function figure(f){
  if(!f) return "";
  const cap = `<figcaption>${esc(f.caption)}(${esc(f.credit)})</figcaption>`;
  if(f.type==="svg") return `<figure class="zu-fig">${f.svg}${cap}</figure>`;
  if(f.type==="table") return `<figure class="zu-fig zu-tbl"><p class="zt-h">${esc(f.title)}</p><table>${f.rows.map(([k,v,w])=>`<tr><th>${esc(k)}</th><td class="${w?"warn":""}">${esc(v)}</td></tr>`).join("")}</table>${cap}</figure>`;
  if(f.type==="embed") return `<figure class="embed" data-provider="${esc(f.provider)}">${f.html}
    <noscript><a href="${esc(f.url)}">元の投稿を見る</a></noscript>${cap}</figure>`;
  return `<figure><div class="photo"><img src="${esc(f.src)}" alt="${esc(f.caption)}" loading="lazy"></div>${cap}</figure>`;
}
const temps = d => [d.max!=null?`最高 ${d.max}度`:"", d.min!=null?`最低 ${d.min}度`:""].filter(Boolean).join(" / ");
function agendaSection(e){
  const a=e.agenda; if(!a) return "";
  const md=d=>{const t=ymd(d);return `${t.m}月${t.d}日(${WD[t.w]})`;};
  const li=x=>`<li>${x.url?`<a href="${esc(x.url)}" rel="noopener">${esc(x.what)}</a>`:esc(x.what)}</li>`;
  const blocks=[];
  if(a.ongoing.length) blocks.push(`<div><h3>続いていること</h3><ul>${a.ongoing.map(x=>`<li>${esc(x.what)} <b>残り${x.left}日</b></li>`).join("")}</ul></div>`);
  blocks.push(`<div><h3>きょう</h3>${a.today.length?`<ul>${a.today.map(li).join("")}</ul>`:"<p>きょうの予定は届いていません。</p>"}</div>`);
  if(a.soon.length) blocks.push(`<div><h3>近日</h3><ul>${a.soon.map(x=>`<li><span>${md(x.date)}${x.end?`〜${md(x.end)}`:""}</span>${x.url?`<a href="${esc(x.url)}" rel="noopener">${esc(x.what)}</a>`:esc(x.what)}</li>`).join("")}</ul></div>`);
  return `<section class="men" id="yotei" aria-labelledby="yotei-h"><h2 class="band" id="yotei-h">予定</h2><div class="yotei">${blocks.join("")}</div></section>`;
}

function render(e){
  const w0 = e.weather.days[0];
  document.title = `八丈島新聞 ${seireki(e.date)} ${e.edition}`;
  document.getElementById("paper").innerHTML = `
  <header>
    <div class="mast">
      <div class="mimi"><b>${esc((w0.hachijo??w0.main??w0.weather).replace(/\sただし.*$/,""))}</b>${temps(w0)?temps(w0)+"<br>":""}降水確率 ${w0.pops.filter(([,v])=>v&&v!=="—").map(([,v])=>v+"%").join("・")}</div>
      <h1 class="daiji">八丈島新聞</h1>
      <div class="mimi r"><b>発行 FM八丈島</b>${hm(e.date+"T"+e.published)}発行</div>
    </div>
    <div class="dateline"><span>${wareki(e.date)}</span><span class="c seireki">${seireki(e.date)}</span><span>${e.edition}</span></div>
    <nav class="kyo" aria-label="きょうの紙面"><span>きょうの紙面</span>
      <a href="#ichimen">一面</a>${e.column?`<a href="#column">${esc(e.column.name)}</a>`:""}${e.ronten?'<a href="#ronten">論点</a>':""}<a href="#beta">短報</a><a href="#yotei">予定</a><a href="#tenki">天気</a><a href="#koe">島の声</a><a href="#shakoku">社告</a>
      <a href="/shukusatsu/">縮刷版</a>
    </nav>
    ${e.alerts.map(a=>`<div class="keiho" role="status"><b>${esc(a.area)}に${esc(a.kind)}</b><small>気象庁 ${hm(a.issued)}発表。発行後に変わっていることがあります。</small></div>`).join("")}
  </header>

  <section class="ichimen" id="ichimen" aria-label="一面">
    ${e.top?`<article class="top">
      <h2>${esc(e.top.headline)}</h2>
      ${e.top.sode?`<p class="sode">${esc(e.top.sode)}</p>`:""}
      <div class="top-body${e.top.photo?"":" nophoto"}">
        ${figure(e.top.photo)}
        <div class="honbun">${paras(e.top.body)}${src(e.top.sources)}</div>
      </div>
    </article>`:`<article class="top"><h2>けさは大きな話題がありません</h2><p>短報と予定、天気をどうぞ。</p></article>`}
    <aside class="side">
      <section class="tv" aria-label="FM八丈島テレビ">
        <div class="live"><i aria-hidden="true"></i>FM八丈島テレビ いま放送中</div>
        <iframe src="${TV_EMBED}" title="FM八丈島テレビ" style="display:block;width:100%;aspect-ratio:16/9;border:0" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>
        <p class="now"><a href="https://tv.hachijojima.jp/" rel="noopener">テレビで大きく観る</a></p>
      </section>
      ${e.side.map(s=>`<article><h3>${esc(s.headline)}</h3><div class="honbun">${paras(s.body)}</div>${src(s.sources)}</article>`).join("")}
    </aside>
  </section>

  ${e.column?`<section class="column" id="column" aria-labelledby="column-h">
    <h2 class="col-name" id="column-h">${esc(e.column.name)}</h2>
    <div class="col-text"><p>${e.column.body.map(t=>esc(t).replace(/\d+(?:\.\d+)?/g,m=>m.length<=2?`<span class="tcy">${m}</span>`:`<span class="up">${m}</span>`)).join('<span class="tri">▼</span>')}</p></div>
  </section>`:""}
  ${e.ronten?`<section class="men ronten" id="ronten" aria-labelledby="ronten-h">
    <h2 class="band" id="ronten-h">論点</h2>
    <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
    <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
    <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
  </section>`:""}
  ${(e.weekly||[]).length?`<section class="men" id="shuukan" aria-labelledby="shuukan-h">
    <h2 class="band" id="shuukan-h">今週の島</h2>
    <ol class="weekly">${e.weekly.map(w=>`<li><a href="${esc(w.url)}"><span>${ymd(w.date).m}月${ymd(w.date).d}日</span>${esc(w.headline)}</a></li>`).join("")}</ol>
  </section>`:""}
  <section class="men" id="beta" aria-labelledby="beta-h">
    <h2 class="band" id="beta-h">短報</h2>
    <div class="beta">${e.shorts.length?e.shorts.map(s=>`<article><h3>${esc(s.headline)}</h3>${paras(s.body)}${src(s.sources)}</article>`).join(""):"<p>けさの短報はありません。</p>"}</div>
  </section>

  <div class="lower lower-yt">
  ${agendaSection(e)}
    <section class="men" id="tenki" aria-labelledby="tenki-h">
      <h2 class="band" id="tenki-h">天気</h2>
      <table>${e.weather.days.map(d=>`
        <tr class="day"><th colspan="2">${d.label} ${esc(d.hachijo??d.main??d.weather)}</th></tr>
        ${temps(d)?`<tr><th>気温</th><td>${temps(d)}</td></tr>`:""}
        <tr><th>降水</th><td><div class="pop" style="grid-template-columns:repeat(${Math.max(d.pops.length,1)},1fr)">${d.pops.length?d.pops.map(([l,v])=>`<div><span>${esc(l)}</span>${v===""?"—":esc(v)+"%"}</div>`).join(""):"<div>—</div>"}</div></td></tr>
        <tr><th>風</th><td>${esc(d.wind)}</td></tr><tr><th>波</th><td>${esc(d.wave)}</td></tr>`).join("")}
      </table>
      ${e.koyomi?`<table class="koyomi">
        <tr class="day"><th colspan="2">暦</th></tr>
        <tr><th>日の出</th><td>${esc(e.koyomi.sunrise)}</td></tr><tr><th>日の入り</th><td>${esc(e.koyomi.sunset)}</td></tr>
        <tr><th>月齢</th><td>${esc(e.koyomi.moon)}</td></tr>
        ${e.koyomi.tide?`<tr><th>満潮</th><td>${e.koyomi.tide.high.map(([t,c])=>`${t}(${c}cm)`).join("　")}</td></tr>
        <tr><th>干潮</th><td>${e.koyomi.tide.low.map(([t,c])=>`${t}(${c}cm)`).join("　")}</td></tr>`:""}
      </table>`:""}
      <p class="note">気象庁 ${hm(e.weather.issued)}発表。${e.koyomi&&e.koyomi.tide?`潮は${esc(e.koyomi.tide.place)}の推算値。`:""}日の出入りと月齢は本紙の計算。最新は<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" rel="noopener">気象庁</a>で。</p>
    </section>
  </div>

  <div class="lower lower2">
    <section class="men koe" id="koe" aria-labelledby="koe-h">
      <h2 class="band" id="koe-h">島の声</h2>
      ${e.letters.length?e.letters.map(l=>`<p>${esc(l.body)}</p><cite>${esc(l.from)}</cite>`).join(""):"<p>投書をお待ちしています。</p>"}
    </section>
    <section class="men" id="shakoku" aria-labelledby="shakoku-h">
      <h2 class="band" id="shakoku-h">社告</h2>
      ${e.corrections.length?`<div class="teisei"><b>おわびと訂正</b>${e.corrections.map(c=>`<p>${esc(c)}</p>`).join("")}</div>`:""}
      <p>本紙の記事は、間違えることがあります。お気づきの点は島の声へ。確かめたうえで、この欄で訂正します。</p>
    </section>
  </div>

  <footer class="oku">
    <nav aria-label="号">${e.prev?`<a href="${esc(e.prev)}">前の号</a>`:""}<a href="/shukusatsu/">縮刷版</a>${e.next?`<a href="${esc(e.next)}">次の号</a>`:""}</nav>
    <span class="meta">八丈島新聞 毎朝五時半発行 発行所 FM八丈島 本紙へのご連絡は<a href="#koe">島の声</a>へ${e.sample?" この紙面は見本データで組んでいます":""}${e.proof?" この号は試し刷りです":""}</span>
  </footer>`;
}

function kyukan(){
  document.getElementById("paper").innerHTML = `
  <header><div class="mast"><div></div><h1 class="daiji">八丈島新聞</h1><div></div></div></header>
  <section class="kyukan"><h2>本日は休刊です</h2><p>けさの号を組めませんでした。<a href="/shukusatsu/">縮刷版</a>で前の号を読めます。</p></section>`;
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};
  [...new Set([...document.querySelectorAll("figure.embed")].map(f=>f.dataset.provider))].forEach(p=>{
    if(!need[p]) return; const sc=document.createElement("script"); sc.src=need[p]; sc.async=true; document.body.appendChild(sc);
  });
}
if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
</body>
</html>
