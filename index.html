橘丸", "port": "---", "status": "欠航", "note": "11/27(金)発便 現地港湾状況不良のため"}, {"island": "八丈島", "direction": "八丈島行き", "time": "22:30", "place": "東京発（今晩）発", "ship": "大型客船 3400便橘丸", "port": "---", "status": "---", "note": "9:30頃更新"}, {"island": "八丈島", "direction": "八丈島発", "time": "09:40", "place": "東京行", "ship": "大型客船 2400便橘丸", "port": "---", "status": "欠航", "note": "現地港湾状況不良のため"}, {"island": "青ヶ島", "direction": "青ヶ島行き", "time": "09:30", "place": "八丈島発", "ship": "客船 くろしお丸", "port": "---", "status": "欠航", "note": ""}, {"island": "青ヶ島", "direction": "青ヶ島発", "time": "13:30", "place": "八丈島行", "ship": "客船 くろしお丸", "port": "---", "status": "欠航", "note": ""}]}, "sora": {"status": "条件付きの可能性", "reason": "強風", "url": "https://x.com/ANA_flight_info/status/2126234572111442101", "at": "2026-11-27T17:40:00+09:00"}, "number": null, "top": {"headline": "西見の教職員住宅 11億円で新築へ", "body": ["東京都は、大賀郷西見に教職員住宅を新築する工事について、三根の間仁田建設と税込み11億円で請負契約を結ぶ議案を、12月1日に開会する都議会第4回定例会に出した。都は2023年にも同じ土地で同じ床面積の住宅の新築を届け出ていた。当時の着工予定は2024年9月下旬だった。", "議案は知事が提出した第220号議案で、議決はまだ出ていない。財務局が8月7日に出した一般競争入札の公告によると、建物は鉄筋コンクリート造の地上3階・塔屋1階建てで、延べ床面積は1703.05平方メートルある。外構などの工事も含み、工期は契約確定の翌日から2029年2月28日までとしている。公告には何戸の住宅になるかは書かれていない。10月8日の開札で間仁田建設が落札した。予定価格は税込み11億5272万円で、落札額はその約95.4%にあたる。都議会の予定表では、12月10、11、14日に常任委員会で審査し、12月16日の最終本会議で採決する。", "計画自体は数年前からあった。都市整備局が公表している中高層建築物の標識設置届の一覧に「東京都教職員八丈（西見）住宅（仮称）（6）新築工事」が載っている。それによると、2023年8月12日に工事予定地へ標識が立てられ、同月17日に届け出が受理された。所在地の地番は今回と重なり、延べ床面積も1703.05平方メートルで同じだった。高さは11.45メートル、着工予定は2024年9月下旬とされていた。2025年10月の台風22号・23号より前からあった計画で、着工は当初の予定より2年以上遅れることになる。今回の工事名には「その2」と付いているが、「その1」に当たる工事が何かは都の公表資料からは分からない。", "島の教職員住宅は古いものが多い。教育庁八丈出張所の2024年度の管内概要によると、同年4月1日時点で同出張所が管理する八丈町内の教職員住宅は9か所148戸あった。最も古い大賀郷第二住宅は1978年の建築で、1996年度に大規模改修した。最も新しいのは1998年4月建築の樫立第二住宅だった。八丈支庁の2026年度事業説明資料には、同出張所の取り組みとして台風被害の復旧や計画的な改修の調整が挙がっているが、西見の新築には触れていない。議案と入札公告にも、新しい住宅をどの学校の教職員が使うのか、既存の住宅を建て替えたり集めたりするのかは書かれていない。", "入札情報を集めている民間サイトによると、この入札に参加したのは間仁田建設の1者だけだった。同社は5月28日に教育庁が行った大賀郷第三住宅の外壁などの改修工事の入札でも落札している。"], "added": [{"fact": "建物は鉄筋コンクリート造・地上3階塔屋1階建て、延べ床面積1,703.05平方メートル。外構工事を含む。工期は契約確定の翌日から2029年2月28日まで", "url": "https://www2.njss.info/offers/view/33802173"}, {"fact": "入札参加者は間仁田建設の1者のみ。入札額は税抜10億円（税込11億円）", "url": "https://bid.const-ai.com/tokyo/?id=228&p=project"}, {"fact": "2025年11月7日の知事会見で、TBSの記者が次の点を指摘した。末吉第二住宅は2019年に土砂災害特別警戒区域に指定され、出張所は2022年・2023年に大規模改修を要求していた。教育庁福利厚生部は、新住宅の建設がコロナ禍と入札不調で遅れ、来年度の着工を目指していると説明していた。知事は、新築を進めてきたが不調が続き遅れていると認めた", "url": "https://www.metro.tokyo.lg.jp/governor/kishakaiken/2025/11/07"}, {"fact": "間仁田建設は2026年5月28日、教育庁が発注した東京都教職員八丈（大賀郷第三）住宅（8）外壁その他改修工事を税込1億5,510万円で落札した", "url": "https://www.nikoukei.co.jp/bid_result/detail/013638050"}], "figure": {"type": "place", "name": "八丈町大賀郷（西見）"}, "sources": [{"label": "東京都議会", "url": "https://www.gikai.metro.tokyo.lg.jp/bill/reg2026-4.html"}, {"label": "東京都議会 第4回定例会予定表", "url": "https://www.gikai.metro.tokyo.lg.jp/schedule/plenary-session.html"}, {"label": "入札公告（財務局経理部契約第一課、契約番号08-00295）を掲載したNJSS", "url": "https://www2.njss.info/offers/view/33802173"}, {"label": "東京都入札結果の集計", "url": "https://bid.const-ai.com/tokyo/?id=228&p=project"}, {"label": "東京都都市整備局 中高層建築物の標識設置届一覧", "url": "https://www.toshiseibi.metro.tokyo.lg.jp/documents/d/toshiseibi/pdf_kenchiku_hunsou_hun_13"}, {"label": "東京都教育庁八丈出張所 令和6年度管内概要", "url": "https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/overview_2024"}, {"label": "東京都八丈支庁 令和8年度東京都事業説明資料", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/hachijosetsumeikai2026"}, {"label": "日刊建設工業経済新聞 入札結果", "url": "https://www.nikoukei.co.jp/bid_result/detail/013638050"}], "label": "町政", "audience": "島民", "thread_id": "t20261128-409", "edited": "2026-11-28T14:47:09+09:00", "id": "d165a4", "photo": {"type": "img", "src": "/img/kiji/d165a4.jpg?v=b3d5ee", "og": "/img/kiji/d165a4-og.jpg?v=b3d5ee", "s": "/img/kiji/d165a4-s.jpg?v=b3d5ee", "m": "/img/kiji/d165a4-m.jpg?v=b3d5ee", "caption": "八重根港から見る夕焼け空(横)", "credit": "", "file": "ac/31251764.jpg"}}, "side": [], "shorts": [{"headline": "富士中生、エクアドル公使と交流", "body": ["八丈町立富士中学校は、駐日エクアドル共和国大使館で大使に次ぐ地位にある公使を招き、国際交流プログラムを開いた。生徒はクイズやダンスを通してエクアドルの文化を学び、英語で八丈島を紹介した。東京都教育委員会の「笑顔と学びの体験活動プロジェクト」の一環で、同校が27日に公式サイトで伝えた。", "同校の投稿によると、まず公使がエクアドルについて発表し、その後に生徒がクイズやダンスで同国の文化や特色に触れた。生徒は英語で八丈島を紹介し、エクアドルについて質問もした。学校は、授業で学んでいる英語を実際のやりとりに生かし、島の魅力を海外の人に伝える機会になったとしている。同校は20日の1年生の投稿で、11月中に予定する行事としてこの交流を挙げていた。ただ、実施日、参加した学年や人数、公使の氏名、エクアドル大使館を招いた経緯は公表していない。", "都教委の事業ページによると、このプロジェクトは2023年度に始まり、都内の公立学校の子どもに、ふだんの教育活動では難しい多様な体験の機会を提供している。2026年度は、学校が選んで実施できるプログラムを68種類用意した。", "富士中はこの事業を毎年使っている。八丈町教育委員会が広報はちじょう2025年12月号で紹介した内容によると、23年度はアテネと北京の五輪柔道で金メダルを取った谷本歩実さんを招いて講演と実技指導を受け、24年度は歌舞伎教室、25年度は「学校からの脱出」という謎解きイベントを実施した。紹介された3年度はスポーツ、伝統芸能、謎解きで、外国の外交官を迎えた交流は、4年目の今年度が初めてとなる。"], "added": [{"fact": "「笑顔と学びの体験活動プロジェクト」は都教委が2023年度から都内の公立学校を対象に始めた事業で、都が用意した体験プログラムから学校が選んで実施する。事業ページには1校あたりの費用負担は示されていない", "url": "https://www.kyoiku.metro.tokyo.lg.jp/school/content/experience_activities_project"}, {"fact": "2023年度の同プロジェクトには、4月末時点で都内の公立学校2,132校のうち1,732校（81.2％）が申し込んだ（都教委指導部、2023年5月25日付資料）", "url": "https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/02_356"}, {"fact": "同プロジェクトでは2023年12月9日に品川区立御殿山小学校で「大使館との交流プログラム」があり、駐日セネガル大使による国の紹介、外交官によるクイズや民族衣装の説明が行われた（都教委の実施レポート）", "url": "https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/report020_2"}], "sources": [{"label": "富士中", "url": "https://fuji-jhs.8jo.ed.jp/n/n44f6b2b83a5e"}, {"label": "八丈町立富士中学校「（１年）期末考査が終わりました」", "url": "https://fuji-jhs.8jo.ed.jp/n/ncc0879504514"}, {"label": "東京都教育委員会「笑顔と学びの体験活動プロジェクト」", "url": "https://www.kyoiku.metro.tokyo.lg.jp/school/content/experience_activities_project"}, {"label": "八丈町「広報はちじょう」2025年12月号 教育委員会だより", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23114506/hachijo2512.pdf"}], "label": "教育", "audience": "島民", "thread_id": "t20261128-414", "id": "60a210", "photo": {"type": "img", "src": "/img/kiji/60a210.jpg?v=288866", "og": "/img/kiji/60a210-og.jpg?v=288866", "s": "/img/kiji/60a210-s.jpg?v=288866", "m": "/img/kiji/60a210-m.jpg?v=288866", "caption": "八丈町立富士中学校", "credit": "", "file": "own/fuji-chu-1.jpg"}, "edited": "2026-11-28T11:32:47+09:00"}, {"headline": "東京発の島民片道、2等6,500円", "body": ["東海汽船は28日の出発分から、島しょに住む人だけが買える東京発の大型客船の片道割引「島民特別割引 片道きっぷ」を設定した。27日に公表した料金表によると、東京―八丈島の大人料金は2等6,500円、特2等10,500円、1等13,300円。12月の通常運賃より44〜48%安い。2027年1月31日の出発分までが対象となる。", "東海汽船の運賃表によると、燃料油価格変動調整金を含む東京―八丈島の大人片道運賃は、12月が2等12,400円、特2等18,600円、1等24,800円で、片道きっぷとの差は5,900円、8,100円、11,500円になる。29日から30日の出発に当たる11月の運賃は2等11,620円、特2等17,430円、1等23,240円で、差は5,120〜9,940円。島民がふだん使う島しょ在住者割引は、2024年5月の運賃改定に合わせて2年間40%に引き上げていたが、7月1日乗船分から35%に下がった。この割引は調整金にもかかるため、12月の運賃に当てはめると本紙の計算で2等は約8,060円となり、片道きっぷのほうが約1,560円安い。特2等では約1,590円、1等では約2,820円の差になる。片道きっぷは特別プランのため、ほかの割引とは併用できない。東京都人材支援事業団が発行する運賃割引券は使える。", "東海汽船は6日から「島民特別割引 往復きっぷ」も扱っている。島から2等和室で東京へ出て大型客船で戻る往復が対象で、八丈島は往復とも2等なら13,000円。片道きっぷの2等6,500円は、その半額と同じ水準になる。ただ、往復きっぷは有効期間が出発日から最長7日間で、島民以外も買える。これに対し片道きっぷは島民に限り、往路の条件もない。空路で上京した人や、7日を超えて東京に滞在した人も、帰りの船を同じ水準で買えるようになる。", "両方のきっぷのチラシには、島の住民をはじめ多くの利用者に迷惑をかけたことへのおわびが載っている。アルコール基準の見直しを含めて安全管理とコンプライアンスの体制を強め、サービス改善にも取り組むとしている。国土交通省関東運輸局は10月2日、元日に橘丸とさるびあ丸の船長を含む乗組員が航行中に飲酒し、検査をしないまま航海当直に就いたことなどを海上運送法違反と認定した。そのうえで、東京―八丈島航路の橘丸を含む3隻に、9日から28日まで20日間の使用停止を命じていた。東海汽船の発表によると、同社は11月19日、島しょの町村長と議長に改善計画の進捗を報告し、島民向けサービス施策の取り組み状況も説明した。出席者からは、島民や観光客が利用しやすい料金設定を求める意見が出たという。片道きっぷがこの施策に当たるのか、割引の費用をだれが負担するのかは、公表資料では明らかにされていない。", "利用するには、発券時に現住所を確認できる本人確認書類を示す必要がある。予約は出発日の2か月前の同じ日から前日まで受け付け、窓口は東海汽船お客様センター。対象は東京22時30分発、八丈島8時55分着の便で、八丈島航路には適用除外日がない。高速ジェット船は対象外。子どもの料金は大人の半額で、子どもだけでは予約できない。"], "added": [{"fact": "八丈島区間の料金は大人2等6,500円、特2等10,500円、1等13,300円（子ども3,250円、5,250円、6,650円）。ほかの割引とは併用できない（東京都人材支援事業団の割引券は使える）。八丈島航路には適用除外日がない。チラシには、迷惑をかけたことへのおわびと、アルコール基準の見直しを含む安全管理強化の方針が載っている", "url": "https://www.tokaikisen.co.jp/wordpress/wp-content/uploads/2026/11/90c54fa9aba0ed6832eab8737743b3da.pdf"}, {"fact": "2026年11月の東京―八丈島の通常運賃（大人片道、燃料油価格変動調整金込み）は、2等11,620円、特2等17,430円、1等23,240円", "url": "https://www.tokaikisen.co.jp/boarding/fare/"}, {"fact": "島しょ在住者割引の割引率は、2026年7月1日乗船分から大型客船で40%→35%、高速ジェット船で35%→30%に下がった。運賃改定に伴う2年間の暫定的な引き上げが終わったため", "url": "https://www.tokaikisen.co.jp/news/769035/"}, {"fact": "関東運輸局は10月2日、酒気帯びでの航海当直などの違反を理由に、橘丸・セブンアイランド結・セブンアイランド友の使用停止を命じた（10月9日〜28日）", "url": "https://www.mlit.go.jp/report/press/content/002025375.pdf"}, {"fact": "【デスク向け・本文不採用】2018年4月11日の国土交通大臣答弁にある「八丈島は昨年9月から離島住民向け割引運賃を引下げ」は、松原仁委員による航空運賃の質問への答弁で、船の運賃のことではない。船の島民割引の財源の根拠にはならないため、本文には使っていない", "url": "https://kokkai.ndl.go.jp/api/speech?issueID=119604319X00820180411&speechNumber=102&recordPacking=json"}], "sources": [{"label": "東海汽船", "url": "https://www.tokaikisen.co.jp/news/850416/"}, {"label": "国会会議録", "url": "https://kokkai.ndl.go.jp/txt/119604319X00820180411/103"}, {"label": "東海汽船「島民特別割引 片道きっぷ」チラシ", "url": "https://www.tokaikisen.co.jp/wordpress/wp-content/uploads/2026/11/90c54fa9aba0ed6832eab8737743b3da.pdf"}, {"label": "東海汽船「島民特別割引 往復きっぷ」チラシ", "url": "https://www.tokaikisen.co.jp/wordpress/wp-content/uploads/2026/11/45bf68ecdaeabe5e88356d5565e4c6a3.pdf"}, {"label": "東海汽船 運賃表 2026年11月", "url": "https://www.tokaikisen.co.jp/boarding/fare/"}, {"label": "東海汽船 運賃表 2026年12月", "url": "https://www.tokaikisen.co.jp/boarding/fare/2026%e5%b9%b412%e6%9c%88/"}, {"label": "東海汽船「島しょ在住者割引 割引率改定について」", "url": "https://www.tokaikisen.co.jp/news/769035/"}, {"label": "東海汽船 運賃及び料金の適用方", "url": "https://www.tokaikisen.co.jp/farerule/"}], "label": "くらし", "audience": "島民", "thread_id": "t20261128-410", "followup": true, "edited": "2026-11-28T11:38:44+09:00", "id": "e8b601", "photo": {"type": "img", "src": "/img/kiji/e8b601.jpg?v=5bbf34", "og": "/img/kiji/e8b601-og.jpg?v=5bbf34", "s": "/img/kiji/e8b601-s.jpg?v=5bbf34", "m": "/img/kiji/e8b601-m.jpg?v=5bbf34", "caption": "橘丸 八丈島 八重根港", "credit": "", "file": "ac/34194382.jpg"}}, {"headline": "八重根防波堤の鋼枠に1億円", "body": ["東京都港湾局は、八重根漁港の（1）防波堤を改良するための鋼枠の製作を、税込み1億99万円で五栄土木に発注した。8月26日の開札で6社が同じ額で並び、くじで決まった。都はこの防波堤のかさ上げを柱に、2031年度までの6年間で約20億6千万円をかける漁港の改良事業を計画している。", "開札結果によると、契約の内容は長さ5.0メートル、幅2.5メートル、高さ5.7メートルの鋼枠ブロック10函と、上部連結材20基の製作・輸送だ。引き渡し場所は江東区海の森三丁目で、工期は2027年3月3日まで。島での据え付けは契約に含まれず、その時期は八丈支庁が5月にまとめた今年度の事業説明資料にも書かれていない。入札には10社が参加し、五栄土木、高田機工、エム・エムブリッジ、楢崎製作所、巴コーポレーション、三井住友建設鉄構エンジニアリングの6社が税抜き9181万円で並んだ。予定価格は税込み1億1299万円で、落札率は89.4%だった。", "水産庁が4月8日に公表した事前評価書によると、事業主体は都で、期間は2026〜31年度、事業費は20億6200万円。内訳は、（1）防波堤170メートルのかさ上げと堤体の拡幅が11億8467万円、護岸83メートルの改良が7億9782万円、道路179メートルの改良が8000万円だ。八重根漁港は、島内のほかの港に所属する漁船や周辺で操業する漁船の避難先となる第4種漁港だ。しかし評価書は、荒天時には防波堤を越える波で港内に安全に停泊できず、漁船は島陰での錨泊を余儀なくされ「極めて危険」だと記す。改良する防波堤は、津波にも「粘り強い構造」にするという。", "護岸の改良は、八重根漁港を母港とする青ヶ島航路の定期船のためだ。評価書によると、定期船が使う岸壁は荒天時に背後から頻繁に波が越えて接岸できず、定期船は東京港へ避難している。2014〜24年の平均就航率は63.0%で、評価書は年312日の運航予定のうち115日が欠航すると算定し、護岸の整備で欠航が年22日減ると見積もる。費用便益比は1.22だった。八丈島漁業協同組合、連絡船の運航会社、地元企業から意見を聞き、八丈町とも調整を済ませたとしている。", "防波堤の改良は、2025年10月の台風22号・23号より前から動いていた。港湾局は2025年8月6日の開札で、（1）防波堤35メートル分の基本設計と実施設計をセンク21に891万円で発注した。1月7日の開札では、（1）防波堤の改良工事を予定価格と同額の7928万円で浅沼組に発注した。波で海底が削られるのを防ぐマットを敷き、10トン型の消波ブロック82個を製作・据え付けるなどの工事で、工期は10月16日までだった。", "八丈支庁も8月に、島内の工事と設計の4件を発注した。金額はいずれも税込み。八丈島空港の場周柵改修では、空港を囲む柵144メートルを、保安対策を強めた柵に取り替える。エプロン灯4基と飛行場灯台1基の基礎の補修や、侵入防止柵3枚の設置も含む。8月19日の開札では、指名された7社のうち赤間建設が予定価格と同じ2510万円で落札した。開札結果で入札額が示されているのは同社だけだ。場周柵の取り替えは2025年8月に34メートル分を八生建設が690万円で受注した。2月には『復旧』の名目で66メートル分が発注され、赤間建設が予定価格と同じ1283万円で落札していた。事業説明資料は、空港整備の目的の一つに保安機能の強化を挙げている。", "このほか、末吉のこん沢林道の改良工事は、高橋建設が予定価格1759万円に対し1749万円で落札した。事業説明資料は、この林道で台風22号の被害を受けた箇所の復旧工事を今年度の予定に挙げている。大賀郷の西見では、電線を地中に収める電線共同溝の延長340メートル分の予備設計と詳細設計を、中央コンサルタンツが1909万円で受注した。価格に過去の設計実績の評価を加える総合評価方式で、最も安い額を入れたのは別の会社だった。大潟浦園地の休憩舎を鉄筋コンクリート平屋の約40平方メートルに建て替える基本設計と実施設計は、飛鳥設計が360万円で落札した。"], "added": [{"fact": "八重根漁港の鋼枠製作には10社が参加し、6社が同額（税抜き9,181万円）で並んでくじ引きで落札者が決まった。契約は長さ5.0m・幅2.5m・高さ5.7mの鋼枠ブロック10函と上部連結材20基の製作・輸送で、引き渡し場所は江東区海の森三丁目、工期は2027年3月3日まで", "url": "https://bid.const-ai.com/tokyo/?id=349&p=project"}, {"fact": "水産庁の事前評価書（2026年4月8日公表）によると、都は八重根漁港で令和8〜13年度に事業費20億6,200万円の改良を計画している。（1）防波堤170mのかさ上げ・拡幅（11億8,467万円）、護岸83m、道路179mが対象。荒天時に越波で港内に停泊できず、周辺の漁船の多くが島陰での錨泊を余儀なくされている。費用便益比は1.22", "url": "https://www.jfa.maff.go.jp/j/gyosei/assess/hyouka/attach/pdf/r7_260408_1-13.pdf"}, {"fact": "同評価書によると、青ヶ島航路の定期船は荒天時に岸壁を越える波で接岸できず、東京港へ避難している。くろしお丸の就航率は63.0%（2014〜24年平均）で、整備後は欠航が年22日減ると見積もっている", "url": "https://www.jfa.maff.go.jp/j/gyosei/assess/hyouka/attach/pdf/r7_260408_1-13.pdf"}, {"fact": "評価書の公表日は2026年4月8日（令和7年度水産関係公共事業の評価検討結果）", "url": "https://www.jfa.maff.go.jp/j/gyosei/assess/hyouka/koukyou_index.html"}, {"fact": "港湾局は2025年8月に（1）防波堤35m分の基本設計・実施設計をセンク21に891万円で発注していた", "url": "https://bid.const-ai.com/tokyo/?id=8674&p=project"}, {"fact": "港湾局は2026年1月に、港外側の洗掘防止工事（消波ブロック82個など、工期10月16日まで）を浅沼組に7,928万円で発注していた", "url": "https://bid.const-ai.com/tokyo/?id=6154&p=project"}, {"fact": "空港の場周柵改修は、柵144mを保安強化型に取り替え、照明基礎の補修と侵入防止柵3枚の設置を行う。参加は7社で、入札額が分かるのは赤間建設だけ", "url": "https://bid.const-ai.com/tokyo/?id=780&p=project"}, {"fact": "空港の場周柵は、2025年8月に34m分（八生建設、690万円）、2026年2月に「復旧」の名目で66m分（赤間建設、1,283万円、予定価格と同額）が発注されていた", "url": "https://bid.const-ai.com/tokyo/?id=5522&p=project"}, {"fact": "2025年8月発注の場周柵34m分（八生建設、690万円）の開札結果", "url": "https://bid.const-ai.com/tokyo/?id=8453&p=project"}, {"fact": "都の令和8年度事業説明資料は、こん沢林道で台風22号の被害箇所を復旧する工事を予定に挙げている。空港の場周柵取り替えは保安機能の強化、八重根漁港は（1）防波堤の改良と消波の製作・据え付けが事業内容。自然公園施設の整備は大賀郷園地の便所改修だけを挙げている", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/hachijosetsumeikai2026"}, {"fact": "西見の電線共同溝設計は総合評価方式で決まり、最も安い札を入れたのは和建設計事務所だった", "url": "https://bid.const-ai.com/tokyo/?id=950&p=project"}, {"fact": "西見・八重根の延長2,100mの電線共同溝予備設計（その2）を9月18日の開札でテクニカルエイトが1,128万円で落札した", "url": "https://bid.const-ai.com/tokyo/?id=9490&p=project"}, {"fact": "こん沢林道の延長160mの測量設計委託を8月27日の開札でつ建が1,371万円で落札した", "url": "https://bid.const-ai.com/tokyo/?id=695&p=project"}], "sources": [{"label": "東京都", "url": "https://bid.const-ai.com/tokyo/?id=349&p=project"}, {"label": "水産庁 事前評価書 八重根地区", "url": "https://www.jfa.maff.go.jp/j/gyosei/assess/hyouka/attach/pdf/r7_260408_1-13.pdf"}, {"label": "東京都八丈支庁 令和8年度東京都事業説明資料", "url": "https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/hachijosetsumeikai2026"}, {"label": "東京都 開札結果", "url": "https://bid.const-ai.com/tokyo/?id=781&p=project"}], "label": "町政", "audience": "島民", "thread_id": "t20261128-412", "edited": "2026-11-28T11:45:51+09:00", "id": "0e31af", "photo": {"type": "img", "src": "/img/kiji/0e31af.jpg?v=809f84", "og": "/img/kiji/0e31af-og.jpg?v=809f84", "s": "/img/kiji/0e31af-s.jpg?v=809f84", "m": "/img/kiji/0e31af-m.jpg?v=809f84", "caption": "八丈島・八重根港ターミナル", "credit": "", "file": "ac/4939567.jpg"}}, {"headline": "八丈高定時制、1500mで都2位", "body": ["東京都立八丈高等学校定時制の総合トレーニング部の生徒が21日、駒沢オリンピック公園総合運動場陸上競技場で開かれた第64回東京都高等学校定時制通信制総合体育大会陸上競技大会の男子1500mで2位に入った。東京陸上競技協会の速報記録によると、タイムは5分07秒56だった。優勝した選手との差は1秒69だった。", "同校は大会当日に公式サイトで、部の生徒2人が1500mに出場し、1人が2位に入ったと伝えた。協会の記録によると、男子1500mは予選がなく決勝1本で行われた。16人がエントリーし、3人が欠場、13人が完走した。同校のもう1人は5分54秒14で10位だった。3位とは1秒02の差だった。", "学校によると、2人は大会に向けて放課後も学校に残って練習していた。同校の公式Xによると、部員は8月28日と9月9日に、学校が「エンジョイスポーツプロジェクト」の一環として招いた講師から指導を受けた。9月9日は3人がインターバルトレーニングに取り組んだ。10月29日の放課後には陸上の指導を受け、11月の大会に向けて仕上げた。定時制の公式サイトの学校紹介では、総合トレーニング部は定時制で唯一の運動系の部活動である。", "同校定時制は毎年、秋の定通陸上大会に生徒を出場させている。公式Xによると、2020年は3人が円盤投で5〜8位に入った。21年は出場した4人全員が入賞し、男子走高跳と女子砲丸投で2位だった。22年は男子円盤投で1位、3000m障害と女子砲丸投で2位に入った。23年は女子100mハードルで2位、女子円盤投で5位だった。24年は5人、25年は3人が出場した。学校は1500mを含む出場種目や、全員が自己記録を更新したことを伝えたが、順位には触れていなかった。"], "added": [{"fact": "男子1500mの公式記録では、八丈の3年生は5分07秒56で2位、優勝者は5分05秒87だった。16人が申し込み、3人が欠場して13人が完走した。八丈のもう1人の4年生は5分54秒14で10位だった", "url": "https://gold.jaic.org/jaic/member/tokyo/2026r/1121koma/rel014.html"}, {"fact": "全国定通陸上の東京都代表を決める選考会は6月14日に駒沢で開かれ、全国大会は8月15、16日に夢の島競技場で行われた。11月の大会は全国予選ではない", "url": "https://toriku.or.jp/competition/"}, {"fact": "6月の選考会の男子1500m（12人完走、1位は4分32秒79）の結果に八丈の名前はない", "url": "https://gold.jaic.org/jaic/member/tokyo/2026r/0614koma/rel009.html"}, {"fact": "第61回全国大会に出場した東京都の19校の一覧に八丈はない", "url": "https://gold.jaic.org/teitsu/61/mast009.html"}, {"fact": "総合トレーニング部は、同校定時制の5つの部活動（天文部、自然愛好部、芸術部、学習部、総合トレーニング部）の一つである", "url": "https://www.toritsuko.metro.tokyo.lg.jp/wp/wp-content/uploads/2025/10/令和8年度版学校パンフレット八丈定）.pdf"}, {"fact": "2025年度末時点で、定時制の4年生は3人だった", "url": "https://www.metro.ed.jp/hachijo-he/assets/令和７年度定時制課程学校経営報告.pdf"}], "sources": [{"label": "東京都立八丈高等学校 定時制", "url": "https://www.metro.ed.jp/hachijo-he/news/2026/11/newsentry_155.html"}, {"label": "東京陸上競技協会 速報 第64回東京都高等学校定時制通信制総合体育大会陸上競技大会 男子1500m", "url": "https://flash-report.toriku.or.jp/cyuukou26/38/rel014.html"}, {"label": "東京陸上競技協会 同大会 所属別一覧", "url": "https://flash-report.toriku.or.jp/cyuukou26/38/mast003.html"}, {"label": "東京陸上競技協会 2026年度公認競技会一覧", "url": "https://toriku.or.jp/competition/"}, {"label": "八丈高校公式X", "url": "https://x.com/tokyo8jouhs/status/2125461527729934746"}], "label": "教育", "audience": "島民", "thread_id": "t20261128-413", "edited": "2026-11-28T11:53:51+09:00", "id": "916bbb", "photo": {"type": "img", "src": "/img/kiji/916bbb.jpg?v=c040ac", "og": "/img/kiji/916bbb-og.jpg?v=c040ac", "s": "/img/kiji/916bbb-s.jpg?v=c040ac", "m": "/img/kiji/916bbb-m.jpg?v=c040ac", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-3.jpg"}}], "agenda": [{"date": "2026-11-28", "end": null, "text": "食育セミナー（包丁研ぎ・地産地消）", "url": "https://x.com/hachijomachi/status/2117134618420023736"}, {"date": "2026-11-29", "end": null, "text": "中井貴惠さんの読み聞かせの会", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261101-3/"}, {"date": "2026-11-29", "end": null, "text": "大型絵本と朗読の公演（入場無料）", "url": "https://x.com/funarin8jo/status/2117595434747400488"}, {"date": "2026-11-29", "end": "2026-11-30", "text": "こころの健康づくり講演会", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261116/"}, {"date": "2026-12-01", "end": null, "text": "小学校の行事（三原・大賀郷）", "url": "https://www.town.hachijo.tokyo.jp/articles/oshirase-20261102-01/"}, {"date": "2026-12-05", "end": null, "text": "八丈おさかな朝市（漁協女性部）", "url": "https://x.com/8gyokyoujoseibu/status/2120775919275299272"}, {"date": "2026-12-05", "end": null, "text": "八丈ハンドメイドマルシェ", "url": "https://x.com/8johandmade/status/2121903486787096957"}], "letters": [], "corrections": [], "column": {"name": "島のたより", "title": "届かない注文書", "body": ["やりたい仕事の条件を書き出す。収入、場所、働く時間、始める時期。書いたときは、あとは機会が来るのを待つだけに思える。二 function wxRow(d){
  const ten=tenOf(d.hachijo??d.main??d.weather);
  const pops=d.pops.map(([,v])=>v).filter(v=>v!=null&&v!==""&&v!=="—").map(Number).filter(v=>!isNaN(v)), pop=pops.length?Math.max(...pops):null;
  const kaze=String(d.wind||"").split(/\s後\s/)[0].replace("の風","").replace(/\s+/g," ").trim();
  const nami=(String(d.wave||"").match(/([\d.]+)メートル/)||[])[1];
  const t=[d.max!=null?esc(d.max):"",d.min!=null?esc(d.min):""];
  return `<div class="wx-row"><b>${esc(d.label)}</b><span class="ic">${ICON[ten]||""}${esc(ten)}</span>
    ${d.max!=null||d.min!=null?`<span class="t">${t.filter(Boolean).join("/")}<span class="deg">°C</span></span>`:""}
    ${pop!=null?`<span>降水 ${pop}%</span>`:""}${nami||kaze?`<span class="s" title="${esc([d.wind,d.wave].filter(Boolean).join(" "))}">${nami?`波 ${esc(nami)}m `:""}${esc(kaze)}</span>`:""}</div>`;
}
const JOKEN = /(出航いたしますが、?)?海上・港内状況等により接岸できない場合があります。?/;
 
function funeRows(u){
  if(!u||!(u.routes||[]).length) return "";
  const strip=t=>String(t||"").replace(/[（(][^）)]*[）)]/g,"").replace(/[発行]+$/,"").trim();
  const ship=t=>String(t||"").replace(/^(大型)?客船\s*/,"").replace(/^\d+便/,"");
  
  const keep=u.routes.filter(r=>/行き$/.test(r.direction)&&!/今晩/.test(r.place));
  return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
 
 
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
 
function shimaSection(e){

  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section class="ran" id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/archive/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}

    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}

const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){

}

function wabunKakko(root){
  const URL_=/(?:https?:\/\/|www\.)(?:[!-'*-~]|\([!-'*-~]*\))+/g, ASC=/^[ -~]*$/, LAT=/[A-Za-z0-9.,'"!?]/;
  const one=s=>{const o=[...s],st=[],keep=new Set();
    for(let k=0;k<s.length;k++){const c=s[k];
      if(c==="(")st.push(k);
      else if(c===")"&&st.length){const i=st.pop();
        if(ASC.test(s.slice(i+1,k))&&i>=2&&s[i-1]===" "&&LAT.test(s[i-2])){keep.add(i);keep.add(k);}}}
    for(let k=0;k<s.length;k++){if((s[k]==="("||s[k]===")")&&!keep.has(k))o[k]=s[k]==="("?"（":"）";}
    return o.join("");};
  const fix=s=>{if(!s||!/[()]/.test(s))return s;let out="",at=0;
    for(const m of s.matchAll(URL_)){out+=one(s.slice(at,m.index))+m[0];at=m.index+m[0].length;}
    return out+one(s.slice(at));};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,pre,code,textarea")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;(n=w.nextNode());){const v=fix(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  root.querySelectorAll("[alt],[title],[aria-label]").forEach(el=>{for(const a of["alt","title","aria-label"]){const v=el.getAttribute(a);if(v!=null){const f=fix(v);if(f!==v)el.setAttribute(a,f);}}});
  document.title=fix(document.title);
}

  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
