<style>

:root{
  --paper:#ffffff; --ink:#1f1f1f; --ink-2:#555555; --ink-3:#8a8a8a; --rule:#000000; --hair:#c8c8c8;
  --band-bg:#000000; --band-ink:#ffffff; --tamamushi:#00562B;   /* 社の色(玉虫色) */ --red:#d1001f; --sh:18px;   /* ヘッダーの下の間。並びの間も同じ(2026-11-04 利用者「全部18に」) */
  --cols-ichi:minmax(0,8fr) minmax(0,4fr);   /* PC の左右:トップと1本もの(個別記事・一曲・たより・議員) */
  --cols-bun:minmax(0,1fr) minmax(0,1fr);   /* PC の左右:5つの分野とその下の一覧のページ */
  --gut:36px;   /* PC の左右の間。どの組みも同じ(2026-11-04 利用者「比率は2種類」) */
  --photo:#e4e4e4;
  --min:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --goth:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;   /* 端末の標準のゴシック(主な新聞社サイトと同じ。2026-10-27) */
  /* 文字の大きさは4つだけ(題字と題字の左右は別):見出し・小見出し・本文・添え書き。2026-10-27 */
  /* 書体:明朝は題字と見出しだけ。本文・一覧・添え書きはゴシック(新聞社サイトの記事本文と同じ。2026-10-27) */
  --fs-h:clamp(24px,5.6vw,34px); --fs-s:clamp(18px,4.4vw,21px); --fs-b:17px; --fs-m:13px;
  --fs-in:16px;   /* 入力欄とスマホの ☰ の字(iPhone は16px未満の入力欄を拡大する) */
  --fs-2xs:11px;   /* グラフの目盛り */
  /* 数字と名前を大きく見せる字(はちしん指数の点・就任○日目・法人の件数など)。2026-11-04 */
  --fs-n1:20px; --fs-n2:24px; --fs-n3:28px; --fs-n4:34px; --fs-n5:44px; --fs-n6:52px; --fs-n7:80px;
  /* 余白:字の間 4・部品の中 8・部品の中の大きい間 12・端と枠の中の左右 16・並びの間 --sh 18・欄の間 28・段の間 --gut 36・大きい間 56。2026-11-04 */
  --sp-xs:4px; --sp-s:8px; --sp-m:12px; --edge:16px; --sp-l:28px; --sp-xl:56px;
  --fs-ui:15px; --fs-xs:12px;   /* 読む文章の4つのほか:一覧・注記・ナビの字(15px)、表やグラフの小さい字(12px)。2026-11-04 */
  color-scheme:only light; box-sizing:border-box;   /* いつも白地(端末のダークモードに合わせない。2026-10-24 決定) */
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--goth);font-size:var(--fs-b);line-height:1.8;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:.2em}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--edge) var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}   /* 読み上げだけの見出し(帯の地で今いる分野が分かるページ) */

/* 題字の段:PC は中央に題字、右に日付(紙面の外のページは題字だけ) */
.mast{display:grid;grid-template-columns:auto auto;justify-content:space-between;align-items:baseline;gap:10px 12px;padding:18px 0 8px;border-bottom:3px solid var(--rule)}
.mast .daiji{grid-column:1/-1;grid-row:1}
.daiji{font-family:var(--min);font-weight:800;font-size:clamp(40px,8vw,76px);line-height:1;letter-spacing:-.02em;text-align:center;white-space:nowrap}
.daiji a:hover{text-decoration:none}
.daiji img{display:inline-block;width:.96em;height:.96em;margin:0 .14em 0 0;vertical-align:-.1em}   /* 題字の左の丸い印:漢字1字と同じ大きさに見えるように(2026-11-10 利用者) */
.mast .hi{font-family:var(--goth);font-size:clamp(14px,3.8vw,21px);font-weight:700;line-height:1.4;white-space:nowrap}   /* 字の大きさは前のまま。スマホでも1行 */
.mast .ten{text-align:right}
/* 号の日付:PC もスマホも題字の右 */
@media (min-width:920px){.mast{grid-template-columns:1fr auto 1fr}.mast .daiji{grid-column:2}.mast .hi{grid-column:3;grid-row:1;text-align:right;line-height:1}}   /* 日付は PC も右。行の高さは字だけ(帯の下の線を日付のないページと同じ位置に) */
.mast{position:relative}
/* 帯見出しと記事のラベル(同じ形。ラベルは色を反転) */
.band{display:inline-block;min-width:9.5em;white-space:nowrap;background:var(--paper);color:var(--tamamushi);border:1px solid var(--tamamushi);font-family:var(--goth);font-weight:900;
  font-size:var(--fs-b);letter-spacing:.06em;padding:1px var(--sp-s) 2px;margin:0 0 var(--sp-m)}   /* 欄の見出し:白地に玉虫色。どの欄も同じ長さ。字は本文と同じ大きさ(2026-10-28) */
.label{display:inline-block;width:9.5em;font-family:var(--goth);font-weight:900;font-size:var(--fs-b);letter-spacing:.06em;background:var(--tamamushi);color:var(--band-ink);border:1px solid var(--tamamushi);padding:1px var(--sp-s) 2px}
a.label,.band:not(.onair) a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}   /* 押せるラベルと帯見出しには下線 */
a.label:hover,.band:not(.onair) a:hover{opacity:.85}
.band.solid{background:var(--tamamushi);color:var(--band-ink)}.band.solid a{color:var(--band-ink)}
/* 議員動静の順位の印(金・銀・銅の丸数字。紙面の決まり。議員動静と議員・議会のページは玉虫色の四角に置き換える) */
.giin i{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;margin-right:.45em;border-radius:50%;
  font-style:normal;font-size:var(--fs-m);font-weight:700;color:#fff;vertical-align:.1em;font-feature-settings:"tnum"}
.giin i.r1{background:#b8912f}.giin i.r2{background:#8e9499}.giin i.r3{background:#a5673f}.giin i.r0{background:none}
/* 題字の下にページの帯(分野とバックナンバー。スマホも出し、☰ にはほかのページも) */
.nb{display:flex;align-items:center;gap:0 8px;padding:9px 0;border-bottom:1px solid var(--hair);font-family:var(--goth);
  font-size:var(--fs-ui);font-weight:700;letter-spacing:0;white-space:nowrap;overflow-x:auto;scrollbar-width:none}   /* 分野は5つなので字は本文に近く(2026-11-04) */
.nb::-webkit-scrollbar{display:none}.nb a{color:var(--ink);padding:3px 9px}.nb a[aria-current]{background:var(--tamamushi);color:var(--band-ink)}.nb a[aria-current]:hover{text-decoration:none}   /* 今いる分野は玉虫色の地(分野のページの帯見出しの代わり。2026-11-04) */
.tvl{display:block;flex:none;line-height:0}.tvl img{display:block;height:20px;width:auto}.tvl:hover{opacity:.8}   /* ロゴは帯の字と同じくらいの高さ */
@media (max-width:1100px){.tvl img{height:17px}}
.menu,.sbar{display:none}
@media (max-width:999px){   /* 帯が1行に入らない幅(タブレットの縦など)からは ☰ */
  /* スマホも帯は出す(分野は5つ+バックナンバー)。テレビのロゴは ☰ の中だけ */
  .nb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px;font-size:16px;padding:6px 0;overflow:visible}
  .nb a{margin:0;padding:3px 6px}
  .menu{display:block;position:absolute;right:-8px;top:16px}
  .menu summary{list-style:none;cursor:pointer;width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 8px}
  .menu summary::-webkit-details-marker{display:none}.menu summary span{display:block;height:2px;background:var(--ink)}
  .menu[open] summary span:nth-child(1){transform:translateY(8px) rotate(45deg)}.menu[open] summary span:nth-child(2){opacity:0}
  .menu[open] summary span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
  .menu nav{position:absolute;right:0;top:46px;z-index:10;width:min(86vw,330px);background:var(--paper);border:1px solid var(--ink);
    padding:var(--sp-xs) 0;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .menu nav div{display:grid;grid-template-columns:1fr 1fr;padding:4px 0}.menu nav div+div{border-top:1px solid var(--hair)}
  .menu nav a{display:block;padding:8px 16px;font-family:var(--goth);font-size:16px;font-weight:700;letter-spacing:0;text-align:left;white-space:nowrap}
  .menu nav a[aria-current]{color:var(--tamamushi)}
  .menu nav a.tvl{display:flex;align-items:center}.menu nav .tvl img{height:18px}
  /* 上へ戻したときだけ出る細い帯(小さな題字と ☰) */
  .sbar{display:block;position:fixed;left:0;right:0;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);
    padding-top:env(safe-area-inset-top,0px);transform:translateY(-110%);transition:transform .2s}.sbar.on{transform:none}
  .sbar .in{position:relative;height:46px;margin:0 16px;display:flex;align-items:center;justify-content:center}
  .sbar .daiji{font-size:24px}.sbar .menu{top:3px}
}
/* スマホ:新聞社サイトのスマホ版に寄せる(2026-11-04 利用者。朝日新聞のスマホ版の動き)。
   ヘッダーは細い帯(題字・号の日付・☰)と分野のタブ1行。下へ送ると隠れ、上へ戻すとタブごと出る。☰ は帯の下いっぱいに開き、頭に検索窓 */
@media (max-width:919px){
  header{position:sticky;top:0;z-index:1100;background:var(--paper);padding-top:env(safe-area-inset-top,0px);margin:0 -16px;padding-inline:16px;transition:transform .2s}
  header.hide{transform:translateY(-100%)}
  .mast{position:static;grid-template-columns:1fr auto auto;align-items:center;gap:0 12px;height:46px;padding:0;border-bottom:1px solid var(--ink)}
  .mast .daiji{grid-column:1;grid-row:1;font-size:24px;text-align:left}
  .mast .hi{display:block;grid-column:2;grid-row:1;font-size:var(--fs-m)}
  .mast{grid-template-rows:46px;align-items:center}.mast .menu{position:static;grid-column:3;grid-row:1;margin-right:-8px}
  .mast .hi{align-self:end;margin-bottom:12px;line-height:1}   /* 日付は題字の下にそろえる。漢字は数字の下の線より少し下まであるので、数字を2px上に */
  .mast .menu nav{left:0;right:0;top:100%;width:auto;border:0;border-bottom:1px solid var(--ink);max-height:calc(100dvh - 92px);overflow-y:auto}
  .nb{position:relative;display:flex;gap:0;padding:0;overflow-x:auto;font-size:var(--fs-ui)}
  .nb a{flex:none;padding:9px 6px}   /* 390px で5つと虫眼鏡が1行に */
  .nb .nbq{display:block;flex:none;margin-left:auto;position:sticky;right:0;align-self:stretch;padding:0 0 0 8px;background:linear-gradient(to right,transparent,var(--paper) 6px);border:0;color:var(--ink);cursor:pointer;line-height:0}   /* タブの右端の虫眼鏡:☰ と同じく開く */
  .nbq svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4}
  .sbar{display:none!important}
}
/* FM八丈島テレビの欄(紙面のトップと個別記事):ON AIR の帯とロゴ、下に埋め込みのプレーヤー */
.band.onair{display:inline-flex;align-items:center;gap:var(--sp-s);background:var(--red);border-color:var(--red);color:var(--band-ink)}   /* 帯見出しと同じ形で、放送中だけ赤 */
.band.onair a{display:inline-flex;align-items:center;gap:var(--sp-s);color:inherit}
.onair i{width:7px;height:7px;border-radius:50%;background:var(--band-ink);display:inline-block}
@media (prefers-reduced-motion:no-preference){.onair i{animation:blink 2s steps(1) infinite}}
.tv .head{display:flex;align-items:center;gap:var(--sp-m);margin-bottom:var(--sp-m)}.tv .head .band{margin:0}
.tv .chl{display:block;min-width:0}.tv .ch{width:auto;height:auto;max-height:30px;max-width:100%;display:block}   /* ON AIR の帯と同じ高さに見える大きさ。360px 幅では列に収まるまで縮める */
@keyframes blink{50%{opacity:.25}}
/* ☰ の頭の検索窓。打つと下に候補(「○○で検索」と当たった題名)。検索の結果はバックナンバーのページ */
.ms{display:flex;gap:8px;padding:12px 16px;background:#f3f3f1}
.ms input{flex:1;min-width:0;font:inherit;font-size:var(--fs-in);padding:8px 10px;border:1px solid var(--ink-3);border-radius:0;background:var(--paper)}
.ms button{font:inherit;font-size:var(--fs-ui);font-weight:700;padding:0 14px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
.sg{list-style:none;margin:0;padding:0 0 4px;border-bottom:1px solid var(--hair);background:var(--paper)}
.menu nav .sg a,.nbs .sg a{display:flex;gap:8px;align-items:baseline;padding:9px 16px;font-family:var(--goth);font-size:var(--fs-ui);font-weight:400;letter-spacing:0;white-space:normal;line-height:1.45;color:var(--ink)}
.sg a b{font-weight:700}.sg small{flex:none;font-size:var(--fs-xs);font-weight:700;color:var(--tamamushi)}
.sg li+li{border-top:1px solid #eee}.sg a.on,.nbs .sg a:hover{background:#f3f3f1;text-decoration:none}
/* PC の帯の検索欄:角の丸い入力欄に虫眼鏡。候補は欄の下に重ねて出す */
.nbq{display:none}
.nbs{position:relative;margin-left:auto;flex:0 1 340px}
.nbs .ms{display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--paper);border:1px solid var(--hair);border-radius:999px}
.nbs .ms:focus-within{border-color:var(--ink-3);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.nbs .ms svg{flex:none;width:15px;height:15px;fill:none;stroke:var(--ink-3);stroke-width:2.4}
.nbs .ms input{border:0;padding:6px 0;font-size:var(--fs-ui);font-weight:400;outline:0;background:none}
.nbs .sg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;border:1px solid var(--hair);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:4px 0;overflow:hidden}
@media (max-width:999px){.nbs{display:none}}   /* ☰ の幅では検索は ☰ の頭 */
@media (min-width:1000px){.nb{overflow:visible}}   /* 候補を帯の下へ出す(帯は1行に収まる幅) */
/* 紙面の外のページ:枠(題字の段・帯・足元)は紙面と同じ幅、中身だけ狭い段 */
/* 足元:細い線 → © → 断り書き(灰色で1行。狭い画面では字を小さく) */
.sf{margin-top:var(--sp-l);border-top:1px solid var(--hair);padding-top:var(--sp-m);font-family:var(--goth);color:var(--ink-3)}
.sf p{margin:0;font-size:var(--fs-m);line-height:1.7}
.sf .kotowari{white-space:nowrap;font-size:clamp(9px,calc((100vw - 32px) / 33),13px);letter-spacing:0}
   /* 色・書体・題字の段・帯・☰・足元は shinbun/build/chrome.py(全ページ共通) */

.deg{line-height:1;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:600}   /* 和文の書体だと「°」が全角幅で間が空く */

/* ── 帯見出し(白抜き) ── */
.men{padding-top:var(--sh)}

/* ── 一面 ── */
.ichimen{display:grid;gap:var(--sh);padding-top:var(--sh)}   /* ヘッダーの下の間はどのページも --sh(chrome) */
.top h2{font-family:var(--goth);font-weight:700;font-feature-settings:"palt";letter-spacing:.01em;font-size:var(--fs-h);line-height:1.4;margin-bottom:var(--sp-m)}   /* 見出しはゴシックの太字、約物を詰める(新聞社サイトの作法) */

/* 記事の分野:見出しの上に玉虫色の字で小さく(一面だけ。帯を並べると重くなる) */
.kick{margin:0 0 var(--sp-xs);font-family:var(--goth);font-size:var(--fs-m);font-weight:900;letter-spacing:.06em;line-height:1.4;color:var(--tamamushi)}
.top .kick{font-size:var(--fs-ui)}
.kick a{color:inherit}.kick a:hover{text-decoration:underline;text-underline-offset:3px}
a.hl{color:inherit}a.hl:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.15em}
.more{margin:var(--sp-xs) 0 0;text-align:right;font-family:var(--goth);font-size:var(--fs-m)}.more a{text-decoration:underline}
/* 一面の下の記事:写真・分野・見出し・書き出し3行(続きは記事のページ) */
.yon{display:grid;gap:var(--sp-l);border-top:1px solid var(--rule);margin-top:var(--sp-l);padding-top:var(--sh)}
.kiji{display:flex;flex-direction:column;gap:var(--sp-s);min-width:0}
.kiji .ph{display:block;aspect-ratio:3/2;background:var(--photo);overflow:hidden}
.kiji .ph img{display:block;width:100%;height:100%;object-fit:cover}
.kiji h3{font-family:var(--goth);font-weight:700;font-feature-settings:"palt";letter-spacing:.01em;font-size:var(--fs-s);line-height:1.45}
.kiji .ld{font-size:var(--fs-b);line-height:1.7;text-align:justify;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kiji .honbun{font-size:var(--fs-b)}
figure{margin:0 0 var(--sp-m)}
.photo{aspect-ratio:3/2;background:var(--photo);display:grid;place-items:center;color:var(--ink-3);font-family:var(--goth);font-size:var(--fs-m)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.zu{display:block;width:100%;height:auto;max-width:520px}
.zu text{font-family:var(--goth);fill:var(--ink)}
.zu .zt{font-size:var(--fs-b);font-weight:900}
.zu .zs{font-size:var(--fs-m);fill:var(--ink-2)}
.zu .zn{font-size:var(--fs-n2);font-weight:900;fill:var(--red)}
.zu .zm{font-size:var(--fs-m);font-weight:700}
.zu .zw{font-size:var(--fs-2xs);fill:var(--ink-3)}
.zu rect.on{fill:var(--ink)}
.zu rect.off{fill:none;stroke:var(--hair)}
.zu rect.today{fill:none;stroke:var(--red);stroke-width:3}
.zu .don{fill:var(--paper);font-size:var(--fs-xs);font-weight:700}
.zu .doff{font-size:var(--fs-xs);fill:var(--ink-2)}
.zu-fig{border-top:1px solid var(--rule);padding-top:var(--sp-m)}
.zt-h{font-family:var(--goth);font-weight:900;font-size:var(--fs-s);margin-bottom:var(--sp-s)}
.zu-tbl td{font-weight:700;white-space:nowrap}
.zu-tbl td.warn{color:var(--red)}
.zu-tbl th{white-space:normal;font-weight:500}
.embed{max-width:540px}
.embed>blockquote{margin:0 !important;min-width:0 !important}
figcaption{font-family:var(--goth);font-size:var(--fs-m);line-height:1.5;color:var(--ink-2);padding-top:var(--sp-xs)}
.honbun p{text-indent:1em;text-align:justify}
.honbun p+p{margin-top:.15em}
.src{display:block;margin-top:var(--sp-s);font-family:var(--goth);font-size:var(--fs-m);line-height:1.5;color:var(--ink-3)}
.src a{text-decoration:underline;text-underline-offset:.15em}
.rail{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-l);align-content:start}

/* テレビ小窓 */
/* テレビの欄(ON AIR の帯・ロゴ)は chrome(個別記事と同じ) */
/* 島の足 */
.ashi th{white-space:normal;font-weight:700}
.ashi td.st{font-weight:700;white-space:nowrap;text-align:right}
.ashi small{display:block;color:var(--ink-2);font-size:var(--fs-m)}
.ashi .note{font-family:var(--goth);font-size:var(--fs-m);color:var(--ink-3);margin-top:var(--sp-xs)}

/* 天気(右の列):1日1行 */
.wx-row{display:flex;flex-wrap:nowrap;align-items:center;gap:2px var(--sp-s);white-space:nowrap;padding:var(--sp-s) 0;border-bottom:1px solid var(--hair);font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
.wx-row b{min-width:2.6em;font-weight:900}
.wx-row .ic{display:inline-flex;align-items:center;gap:var(--sp-xs);font-weight:700}
.wx-row svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wx-row .t{font-weight:700}.wx-row .t small{color:var(--ink-3);font-weight:500}
.wx-row .s{color:var(--ink-2);font-size:var(--fs-m);min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 100年前ときょう:島のむかしの「○月○日の八丈島」と同じ見せ方で2つ並べる */
.hn{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--hair);font-family:var(--goth);text-align:center}
.hn>div{padding:var(--sp-s) var(--sp-s) var(--sp-m)}.hn>div+div{background:#fff7e0;border-left:2px solid var(--ink)}
.hn .ago{font-weight:900;font-size:var(--fs-b);margin:0}.hn .dt{font-size:var(--fs-m);color:var(--ink-2);margin:0}
.hn .pic{height:52px;display:flex;align-items:center;justify-content:center;gap:2px;margin:var(--sp-xs) 0 2px}
.hn .pic .ic svg{width:48px;height:48px}.hn .pic .ic.s svg{width:34px;height:34px}.hn .pic .c{font-style:normal;color:var(--ink-3)}
.hn .pic .no{font-weight:700;color:var(--ink-2);font-size:var(--fs-b)}
.hn .tp{margin:0;line-height:1.15;font-size:var(--fs-h);font-weight:900;font-feature-settings:"tnum";display:flex;justify-content:center;gap:.6em}
.hn .hi{color:#d1401f}.hn .lo{color:#1f63c4}.hn .tp small{font-size:var(--fs-m);font-weight:500;margin-left:2px}
/* 今週の一面・人口 */
.week{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
.week li{padding:3px 0}
.week a{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 1日1行 */
.week time{display:inline-block;width:7.6em;color:var(--ink-3);font-size:var(--fs-m);font-weight:400}
.giin{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
.giin li{padding:3px 0;display:flex;align-items:baseline}
.giin .nm{flex:none;white-space:nowrap}.giin a.nm{text-decoration:underline;text-underline-offset:.15em}   /* 議員のページへ(2026-10-28 利用者と決めた) */
.giin .ps{flex:1;min-width:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.giin q{quotes:none}
.giin b{font-weight:900;margin-right:.6em}
.giin time{color:var(--ink-3);font-size:var(--fs-m);margin-right:.6em}
.giin .ik{font-weight:700}.giin .ik.nd{font-weight:400}.giin .ps.nd q{color:var(--ink-3)}.giin .ps:not(.nd) q{font-weight:700}   /* 分類。本来の仕事は太字、加点しない発信は灰色 */
/* 島のいま:天気・暦・船・人口を1つの欄に。見出しは左の小さな列 */
.kurashi{display:grid;grid-template-columns:2.6em minmax(0,1fr);margin:var(--sp-s) 0 0;font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
.kurashi dt,.kurashi dd{margin:0;padding:var(--sp-s) 0;border-bottom:1px solid var(--hair)}
.kurashi dt{font-weight:900}
.kurashi dd b{font-weight:900}.kurashi .fune b{white-space:nowrap}
.kurashi small{color:var(--ink-2);font-size:var(--fs-m)}
.kurashi .fune{display:flex;justify-content:space-between;gap:var(--sp-s);white-space:nowrap}
.kurashi .fune span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kurashi .fune+.fune{margin-top:var(--sp-xs)}
.kurashi dd{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.kurashi .fune b{flex:none}
.kurashi .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kurashi .ev+.ev{margin-top:var(--sp-xs)}   /* 1件1行、はみ出す分は省略(2026-11-04 利用者) */.kurashi .ev time{color:var(--ink-2);margin-right:.2em}.kurashi .ev a{color:inherit}
.kurashi .ido{display:block;color:var(--ink-2);font-size:var(--fs-m)}   /* 人口の内訳(広報の期間内の異動) */
.note .nw{white-space:nowrap}
/* 注意報は黄、警報は赤、特別警報は紫(気象庁の色分けにならう) */
.keiho{display:flex;flex-wrap:wrap;gap:var(--sp-xs) var(--sp-s);margin-bottom:var(--sp-s);font-family:var(--goth);font-weight:900;font-size:var(--fs-b)}
.keiho span{padding:1px var(--sp-s)}
.keiho .lv1{background:#f2d000;color:#000}
.keiho .lv2{background:var(--red);color:#fff}
.keiho .lv3{background:#6a1b9a;color:#fff}
/* きょうの一曲 */
.kyoku .kk{display:flex;gap:var(--sp-m);align-items:flex-start;margin-bottom:var(--sp-s)}
.kyoku img{width:96px;height:96px;object-fit:cover;flex:none;display:block;background:var(--photo)}
.kyoku h3{font-family:var(--goth);font-weight:700;font-feature-settings:"palt";letter-spacing:.01em;font-size:var(--fs-s);line-height:1.4}
.kyoku .who{font-family:var(--goth);font-weight:700;font-size:var(--fs-b);line-height:1.5;margin-top:2px}
.kyoku .who small{display:block;color:var(--ink-3);font-weight:500;font-size:var(--fs-m)}
.kyoku p.txt{font-size:var(--fs-b);line-height:1.8;text-align:justify}
.kyoku .kiku{display:flex;flex-wrap:wrap;gap:var(--sp-xs) var(--edge);margin-top:var(--sp-s);font-family:var(--goth);font-size:var(--fs-m);font-weight:700}
.kyoku .kiku a{text-decoration:underline;text-underline-offset:.2em}
/* 島のたより */
.tayori{border-top:1px solid var(--rule);margin-top:var(--sp-l);padding-top:var(--sh)}   /* 記事の間の線と同じ */
.tayori h3{font-family:var(--goth);font-weight:700;font-feature-settings:"palt";letter-spacing:.01em;font-size:var(--fs-s);line-height:1.45;margin-bottom:var(--sp-s)}   /* 一面の下の記事の見出しと同じ */
.tayori .honbun a{text-decoration:underline;text-underline-offset:.2em;text-decoration-color:var(--ink-3)}

/* ── 表組み ── */
table{width:100%;border-collapse:collapse;font-family:var(--goth);font-size:var(--fs-b);line-height:1.5}
th,td{padding:var(--sp-s) var(--sp-xs);border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
th{font-weight:700;white-space:nowrap}
tr.day th{white-space:normal;font-size:var(--fs-b);font-weight:900;border-bottom:1px solid var(--rule);padding-top:var(--sp-m)}
tr.day:first-child th{padding-top:0}
.note{font-family:var(--goth);font-size:var(--fs-m);line-height:1.6;color:var(--ink-3);margin-top:var(--sp-s)}
.note a{text-decoration:underline}
.koyomi{margin-top:var(--sp-m)}
.koyomi td{white-space:nowrap}
.ronten-t{font-family:var(--goth);font-weight:700;font-size:var(--fs-s);line-height:1.35;margin-bottom:var(--sp-m)}
.ronten-g{display:grid;gap:var(--sp-xs) var(--sp-l)}
.ronten-g h4{margin:0 0 var(--sp-s);font-family:var(--goth);font-weight:900;font-size:var(--fs-b);border-bottom:1px solid var(--rule);padding-bottom:3px}
.ronten-g ul{margin:0 0 var(--sp-m);padding:0;list-style:none;font-size:var(--fs-b);line-height:1.7}
.ronten-g li{padding:var(--sp-xs) 0;border-bottom:1px solid var(--hair)}
.weekly{list-style:none;margin:0;padding:0;font-family:var(--goth);font-size:var(--fs-b);font-weight:700}
.weekly li{border-bottom:1px solid var(--hair);padding:var(--sp-s) 0}
.weekly span{display:inline-block;width:5.5em;font-weight:500;color:var(--ink-3);font-size:var(--fs-m)}

/* ── 号の送り(足元は chrome の全ページ共通) ── */
.gou{display:flex;justify-content:space-between;margin-top:var(--sp-l);font-family:var(--goth);font-size:var(--fs-m);font-weight:700}
.gou-note{margin-top:var(--sp-s);font-family:var(--goth);font-size:var(--fs-m);color:var(--ink-3)}
#paper{padding-bottom:0}
.kyukan{text-align:center;padding:var(--sp-xl) 0;border-bottom:1px solid var(--rule)}
.kyukan h2{font-family:var(--min);font-weight:800;font-size:var(--fs-s);margin-bottom:var(--sp-s)}

/* ── スマホ・狭い画面の並び(左右の列をほどいて order で並べる)── */
@media (max-width:999px){
  .ichimen{display:flex;flex-direction:column;gap:var(--sp-l)}
  .ichimen-main,.rail,.yon{display:contents}
  .ichimen .tayori{margin-top:0}
  .top figure{margin-inline:calc(-1 * var(--edge))}   /* スマホの一面の写真は画面の端まで */
  .kiji{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:var(--sp-s) var(--sp-m);border-top:1px solid var(--hair);padding-top:var(--sh)}
  .kiji .ph{grid-column:2;grid-row:1;align-self:start}
  .kiji .hd{grid-column:1;grid-row:1}
  .kiji .ld,.kiji .honbun{grid-column:1/-1}
  #week{order:2} #giin{order:3} .side{order:4} .short{order:5} .tayori,.ronten{order:6}
  .tv{order:7;border-top:1px solid var(--rule);padding-top:var(--sh)}   /* 記事の並びとテレビの間に線 */ .kyoku{order:8} #shima{order:9}
}
/* ── 段組み(広い画面)── */
@media (min-width:1000px){
  .ichimen{grid-template-columns:var(--cols-ichi);gap:var(--gut)}
  .yon{grid-template-columns:1fr 1fr;column-gap:var(--sp-l)}   /* 一面の下の4本は2列。一面の写真は列の幅、本文は1列(段組みは画面では読みにくい) */
  .ronten-g{grid-template-columns:repeat(4,1fr)}
}

 "青ヶ島", "direction": "青ヶ島発", "time": "", "place": "八丈島行", "ship": "客船 あおがしま丸", "port": "---", "status": "---", "note": "運休日"}]}, "sora": {"status": "就航予定", "reason": "", "url": "https://www.ana.co.jp/fs/dom/jp/", "at": null}, "number": null, "top": {"headline": "早大の菌類研究、国際学会で受賞", "body": ["八丈島に生息する菌類と昆虫の関係を調べた研究が、国際学会「Island Biology 2026」でポスター発表賞を受賞した。学会は2日から6日まで静岡県熱海市で開催され、早稲田大学の曲雅慧さんら6人による研究が、受賞10件の一つに選ばれた。", "研究対象は、八丈島特産の「ヤブニッケイもち病菌」。ヤブニッケイに寄生し、幹や枝から鹿の角のような突起を形成する菌類で、その学名にも八丈島の名が使われている。", "同じ研究チームが今年3月の日本生態学会で発表した要旨によると、2025年5月から2026年1月にかけて八丈島で調査を実施。菌によって形成された「菌えい」から約20種の昆虫を確認した。菌えいの成長に伴い、植物を食べる昆虫から枯れた組織を利用する昆虫へと、群集の構成が変化することが分かった。", "今回の受賞演題は「昆虫群集にとって見過ごされてきた生息地の島としての菌えい」。研究には森林総合研究所、九州大学、佐賀大学の研究者も参加した。"], "sources": [{"label": "Island Biology 2026", "url": "https://sites.google.com/view/island-biology-2026/awards"}], "label": "教育・文化", "audience": "島民", "thread_id": "t20261112-70", "id": "46c97e", "edited": "2026-11-12T12:08:49+09:00", "photo": {"type": "img", "src": "/img/kiji/46c97e.jpg?v=9f1eb3", "og": "/img/kiji/46c97e-og.jpg?v=9f1eb3", "s": "/img/kiji/46c97e-s.jpg?v=9f1eb3", "m": "/img/kiji/46c97e-m.jpg?v=9f1eb3", "caption": "森の中の道を進む", "credit": "", "file": "ac/25894994.jpg"}}, "side": [], "shorts": [{"headline": "八丈高校島民会議、申込は12日", "body": ["都立八丈高等学校は、令和8年度の島民会議の事前申し込みの期限が12日だと案内している。島民会議は21日9時から12時30分まで、八丈高校で開く。時間は変更になることがある。", "島民会議では、高校2年生が八丈島の「価値」と「課題」を地域の方々と協働して深め、解決策を提案する。オープニングセレモニーとして、文化祭で行う予定だった視聴覚ホール前での合唱を予定している。", "申し込みはQRコード、またはページ内のフォームから行う。当日参加もできるが、希望の分科会を見られない場合がある。学校の代表電話は04996-2-1181。住所は八丈町大賀郷3020。", "同校は2023年12月15日、全日制の2学年が主役の島民会議を開いた。2024年3月26日には、令和5年度の島民会議で取り上げた内容をまとめた意見書を八丈町役場に提出し、町長が直接受け取った。今年は7月14日に、2年生を中心に「進路×探究×八丈」をテーマにしたプレ島民会議を実施している。", "広報はちじょう2023年11月号は、同年の島民会議を12月15日に開くと案内し、協働者を募集した。前年度の学校案内も、島民会議を12月の行事として紹介している。"], "sources": [{"label": "東京都立八丈高等学校", "url": "https://x.com/tokyo8jouhs/status/2120427571276046394"}, {"label": "広報はちじょう2023年11月号", "url": "https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/03/23122723/hachijo2311.pdf"}], "label": "教育・文化", "audience": "島民", "thread_id": "t20261102-24", "followup": true, "id": "9e3099", "photo": {"type": "img", "src": "/img/kiji/9e3099.jpg?v=3ebb69", "og": "/img/kiji/9e3099-og.jpg?v=3ebb69", "s": "/img/kiji/9e3099-s.jpg?v=3ebb69", "m": "/img/kiji/9e3099-m.jpg?v=3ebb69", "caption": "東京都立八丈高等学校", "credit": "", "file": "own/hachijo-koko-1.jpg"}}, {"headline": "八丈富士トレッキング販売へ", "body": ["東海汽船株式会社は、八丈富士トレッキングと島めぐりを組み合わせた竹芝発3日間のツアーを、12月25日と2027年2月5日の出発で売り出す。予約は12日12時から受け付ける。", "1日目は竹芝客船ターミナルに21時から22時に集合し、22時30分に大型客船で出港する。2日目は8時55分に八丈島に着き、八丈富士七合目登山口からのトレッキングで山頂と浅間神社を回る。その後、八丈島歴史民俗資料館、大里の玉石垣・陣屋跡、大坂トンネル展望台、樫立向里温泉ふれあいの湯などに立ち寄る。宿泊はリードパークリゾート八丈島で、1泊2食付き。3日目は9時40分ごろに島を出て、19時50分ごろに竹芝に着く。", "トレッキングの歩行時間は約200分。累計標高差は300mを超え、東海汽船は健脚者向けのコースとしている。八丈富士の火口を回るお鉢巡りは行程に入っていない。持ち物はトレッキングシューズ、リュックサック、雨具(上下)、防寒着。", "料金は税込みで、大人が2名1室45,000円、1名1室52,250円。子ども(小学校就学児)は2名1室35,000円。伊豆諸島クラブ会員料金もある。募集は各日20名で、最少催行人員は15名。申込みは出発日の5日前までに、東海汽船お客様センター(03-5472-9999、毎日9時30分から18時)で受け付ける。", "東海汽船は2025年12月11日、八丈富士山頂トレッキングの緊急発売を知らせた。島さんぽシリーズに八丈島が初めて加わった時のことである。今回のツアーは東京諸島観光プランの第3弾にあたる。同プランは2026年10月30日の東京諸島観光きっぷに続き、10日に第2弾の販売が始まった。"], "sources": [{"label": "東海汽船", "url": "https://www.tokaikisen.co.jp/news/843880/"}], "label": "産業", "audience": "来島者", "thread_id": "t20261112-65", "id": "fcd1ed", "photo": {"type": "img", "src": "/img/kiji/fcd1ed.jpg?v=321274", "og": "/img/kiji/fcd1ed-og.jpg?v=321274", "s": "/img/kiji/fcd1ed-s.jpg?v=321274", "m": "/img/kiji/fcd1ed-m.jpg?v=321274", "caption": "風景 東京 竹芝客船ターミナル 橘丸", "credit": "", "file": "ac/28438942.jpg"}}, {"headline": "登記手続の案内、12月8日と9日に", "body": ["東京法務局の職員が12月8日と9日、八丈町役場の相談室5で登記の申請手続を案内する。ウェブ会議システムを通じ、対象は不動産登記と商業・法人登記。完全予約制で、事前に予約した人だけが利用できる。", "相談は午前9時から午後4時まで(正午から午後1時を除く)で、1回20分。12月分の予約は12月7日の正午までで、次回は2027年1月12日と13日。予約の際は「八丈町役場のウェブ会議システムからの利用である」と伝えるよう求めている。", "相続などによる不動産取得の登記申請は、2024年4月1日から義務化され、取得を知った日から3年以内の申請が必要になった。2026年4月1日からは、住所や氏名・名称の変更登記も義務化された。広報はちじょう2025年6月号にも、同種の案内を載せている。", "予約・問い合わせは、不動産登記が東京法務局の不動産登記部門・法規 letters": [], "corrections": [], "column": {"name": "島のたより", "title": "予約した朝のごはん", "body": ["夜、米を研いで炊飯器を予約した。眠いまま水加減を確かめたのは、明日の朝の自分に少し楽をさせるためだ。朝になり蓋を開けると[新米の湯気](https://note.com/rosy_rat/n/n36ae940a98e8)が立ち上った。まだ味噌汁も作っていない台所が、もう半分出来上がったような顔をしていた。", "白い茶碗へご飯をよそい、しゃもじを水に浸す。光を受けた粒はいつもより艶やかで、箸を入れるのが少しもったいない。ふだんなら納豆や卵を探すところだが、まずは何も乗せない一膳を食べることにした。ひと口の中で、米の柔らかさと粒の残り方を確かめる。", "冷蔵庫から漬物を出す。すぐに食べるのではなく、皿へ少しだけ置いておく。最初のひと口には白いご飯だけの場所が欲しい。おかずの用意を後回しにする朝は、手抜きのようでいて少し贅沢だ。", "朝、炊飯器の蓋を開けると、湯気で眼鏡が白くなった。しゃもじを入れ、ひとすくい目を茶碗へ。昨日の夜に決めた時刻どおり、台所に温かい匂いが満ちていた。"]}, "kyoku": {"artist": "時速36km", "title": "七月七日通り", "text": "時速36kmが2018年7月7日にMVを公開した初期の一曲。のちに2026年のメジャー1stアルバムへ改めて収録されました。何年も演奏してきた歌が、新しい作品で再び鳴る。歌い手も客席も変わるから、昔の言葉にも別の光が当たります。古い曲を抱えたまま先へ進むのは、立ち止まることではありません。音楽には、何度でも新しい日付が付くのです。", "art": {"img": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/22/b9/57/22b95774-99a2-21aa-9173-c1bf86e6398a/dj.jalwkspx.jpg/300x300bb.jpg", "album": "まだ俺になる前の俺に。", "url": "https://music.apple.com/jp/album/%E4%B8%83%E6%9C%88%E4%B8%83%E6%97%A5%E9%80%9A%E3%82%8A/1482484176?i=1482484178&uo=4"}}, "ronten": null, "weekly": [], "ichimen_week": [{"date": "2026-11-11", "url": "/2026/11/11/d8fbed/", "headlines": ["ムロアジ漁10月で終了、水揚量減"]}, {"date": "2026-11-10", "url": "/2026/11/10/e538ec/", "headlines": ["スーパーあさぬま 毎週日曜定休へ"]}, {"date": "2026-11-09", "url": "/2026/11/09/c74b34/", "headlines": ["秋の火災予防運動、9日から15日"]}, {"date": "2026-11-08", "url": "/2026/11/08/2e37ea/", "headlines": ["猫の共生条例、15日にセミナー"]}, {"date": "2026-11-07", "url": "/2026/11/07/9d59cc/", "headlines": ["支庁100周年 風景の島民投票"]}, {"date": "2026-11-06", "url": "/2026/11/06/44d450/", "headlines": ["優婆夷例祭 沖山興業より米100キロ"]}, {"date": "2026-11-05", "url": "/2026/11/05/f84924/", "headlines": ["新宿御苑の催し、八丈島から出展"]}], "population": {"as_of": "2026-11-01", "people": 6495, "people_diff": -4, "households": null, "households_diff": null, "url": "https://www.town.hachijo.tokyo.jp/"}, "giin": [{"name": "佐々木丈", "slug": "sasaki-takeshi", "at": "2026-11-11T12:11:25+09:00", "url": "h   return keep.map(r=>{
    const label=`${strip(r.place)}→${r.island}`;
    let note=String(r.note||"").replace(/\d+\/\d+\([^)]*\)発便/,"").trim(), st=/^[-ー―]*$/.test(r.status||"")?"":r.status;
    // 定型の案内文は「条件付き」、運休日や更新予定は状態の列へ(言葉は表のまま)
    if(!st&&JOKEN.test(note)){st="条件付き"; note=note.replace(JOKEN,"").trim();}
    const m=note.match(/運休日|\d+時\d*分?頃更新/); if(!st&&m){st=m[0]; note=note.replace(m[0],"").trim();}
    const t=String(r.time||"").replace(/^0/,"");
    return `<div class="fune"${note?` title="${esc(note)}"`:""}><span>${esc(label)} <small>${t?`${esc(t)}発 `:""}${esc(ship(r.ship))}</small></span><b>${esc(st)}</b></div>`;
  }).join("");
}
function soraRow(f){
  if(!f) return "";
  return `<div class="fune"><span>羽田→八丈島 <small>${esc(f.reason||"")}</small></span><b>${esc(f.status.replace(/の可能性$/,""))}${/の可能性$/.test(f.status)?"<small>の可能性</small>":""}</b></div>`;
}
/* 島のいまの「催し」:先7日の催しを数行(夜に重なりをまとめた desk/korekara)。前の形(today/soon)の号もそのまま並べる */
/* 催しの日:曜日を必ず添える(人は曜日で予定を捉える。2026-10-29 利用者)。発行月なら「31日(土)」、別の月は「11月1日(日)」 */
const evDay=(d,base)=>{const [y,m,dd]=d.split("-").map(Number), w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return `${m===Number(base.slice(5,7))?"":`${m}月`}${dd}日(${w})`;};
function evLines(e){
  const a=e.agenda; if(!a) return [];
  return Array.isArray(a)?a:[...(a.today||[]),...(a.soon||[])].map(x=>({date:x.date,end:x.end,text:x.what,url:x.url}));
}

const MEDAL={"🥇":1,"🥈":2,"🥉":3};
const rankMark = m => MEDAL[m]?`<i class="r${MEDAL[m]}" aria-label="${MEDAL[m]}位">${MEDAL[m]}</i>`:`<i class="r0" aria-hidden="true"></i>`;
/* 議員動静:1日ごと。直近の発信の日が新しい順、同じ日は pt(議員の仕事の日2、ほか1)の多い順に上位5人。日と pt が同じ人は同じメダル。「分類：題材」で1行。1人1行、本人の投稿へのリンク */
function giinSection(e){
  const g=(e.giin||[]); if(!g.some(r=>r.at)) return "";
  return `<section id="giin" aria-labelledby="giin-h"><h2 class="band" id="giin-h"><a href="/chosei/giin/">議員動静</a></h2>
    <ol class="giin">${g.map(r=>{const nm=`${rankMark(r.medal)}<b>${esc(r.name)}</b>`;
      return `<li>${r.slug?`<a class="nm" href="/chosei/giin/${esc(r.slug)}/">${nm}</a>`:`<span class="nm">${nm}</span>`}${r.at?`<a class="ps${r.kind&&!r.duty?" nd":""}" href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.name+" "+(r.kind?r.kind+" ":"")+(r.what||""))}"><time>${esc(r.when)}</time><q>${r.kind?`<span class="ik${r.duty?"":" nd"}">${esc(r.kind)}</span> `:""}${esc(r.what||"")}</q></a>`:`<span class="ps"><time>発信なし</time></span>`}</li>`;}).join("")}</ol><p class="more"><a href="/chosei/gikai/">議員・議会</a><a href="/chosei/giin/" style="margin-left:1.2em">全員の一覧</a></p></section>`;
}
/* 100年前のきょうと、きょう(edition の hyakunen。絵は組むときに作ってある)。上が最高、下が最低 */
function hnBlock(h){
  const cell=(x,now)=>`<div><p class="ago">${esc(x.ago)}</p><p class="dt">${esc(x.dt)}</p>
    <div class="pic">${x.pic||`<span class="no">${esc(x.rn||"")}</span>`}</div>
    <p class="tp"><b class="hi">${esc(x.hi)}</b><b class="lo">${esc(x.lo)}</b></p></div>`;
  return `<div class="hn">${cell(h.then)}${cell(h.now,true)}</div>`;
}
/* 島のいま:注意報・天気・暦・船・人口を1つの欄に。値は発表のまま */
function shimaSection(e){
  const lv=k=>/特別警報/.test(k)?"lv3":/警報/.test(k)?"lv2":"lv1";
  const k=e.koyomi, u=e.unko, p=e.population, fune=funeRows(u), sora=soraRow(e.sora), ev=evLines(e).slice(0,8);
  const diff=n=>n==null?"":`<small>(${n>0?"+":n<0?"−":"±"}${Math.abs(n).toLocaleString()})</small>`;
  const asof=u&&String(u.as_of||"").match(/(\d{1,2}):(\d{2})/);
  const pt=p&&ymd(p.as_of);
  const st=e.sora&&e.sora.at?ymd(e.sora.at.slice(0,10)):null, sh=e.sora&&e.sora.at?hm(e.sora.at):"";
  const notes=[`<a href="https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=130030" target="_blank" rel="noopener">気象庁</a> ${hm(e.weather.issued)}発表`,
    e.hyakunen?`100年前は<a href="${esc(e.hyakunen.src)}" target="_blank" rel="noopener">気象庁</a>の観測(℃)`:"",
    e.sora?`<a href="${esc(e.sora.url)}" target="_blank" rel="noopener">ANA</a>${st?` ${st.d}日${sh}の案内`:""}`:"",
    fune?`<a href="${esc(u.url)}" target="_blank" rel="noopener">東海汽船</a>${asof?` ${Number(asof[1])}時${asof[2]}分現在`:""}`:"",
    p?`<a href="${esc(p.url)}" target="_blank" rel="noopener">八丈町</a> ${pt.m}月${pt.d}日現在`:"",
    p&&p.ido?`内訳は<a href="https://www.town.hachijo.tokyo.jp/chousei/kanshiryou/kouhou-hachijo/kouhachi-new/" target="_blank" rel="noopener">広報はちじょう</a>`:""].filter(Boolean);
  return `<section id="shima" aria-labelledby="shima-h"><h2 class="band" id="shima-h"><a href="/shukusatsu/">島のいま</a></h2>
    ${e.alerts.length?`<p class="keiho" role="status">${e.alerts.map(a=>`<span class="${lv(a.kind)}">${esc(a.kind)}</span>`).join("")}</p>`:""}
    ${e.hyakunen?hnBlock(e.hyakunen):e.weather.days.map(wxRow).join("")}
    <dl class="kurashi">
      ${sora?`<dt>空</dt><dd>${sora}</dd>`:""}
      ${fune?`<dt>船</dt><dd>${fune}</dd>`:""}
      ${k?`<dt>日</dt><dd>日の出 <b>${esc(k.sunrise)}</b> 日の入り <b>${esc(k.sunset)}</b></dd>`:""}
      ${k&&k.tide?`<dt>潮</dt><dd>満潮 <b>${k.tide.high.map(([t])=>esc(t)).join(" ")}</b> 干潮 <b>${k.tide.low.map(([t])=>esc(t)).join(" ")}</b></dd>`:""}
      ${ev.length?`<dt>催し</dt><dd>${ev.map(x=>`<div class="ev" title="${esc(x.text)}"><time datetime="${esc(x.date)}">${evDay(x.date,e.date)}${x.end?"〜":""}</time> ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>`:esc(x.text)}</div>`).join("")}</dd>`:""}
      ${p?`<dt>人口</dt><dd class="jinko"><b>${Number(p.people).toLocaleString()}</b>人${diff(p.people_diff)}${p.households!=null?` <b>${Number(p.households).toLocaleString()}</b>世帯${diff(p.households_diff)}`:""}${p.ido?`<span class="ido">${(pt.m+10)%12+1}月中 転入${p.ido.in}・出生${p.ido.birth}／転出${p.ido.out}・死亡${p.ido.death}(人)</span>`:""}</dd>`:""}
    </dl>
    <p class="note">${notes.map(n=>`<span class="nw">${n}</span>`).join("、")}${p&&p.people_diff!=null?` <span class="nw">※人口の( )は前月比</span>`:""}</p></section>`;
}
/* きょうの一曲:CSV の文章のまま。ジャケットは見つかった日だけ(Apple の画像を Apple Music へのリンクつきで) */
function kyokuSection(k){
  if(!k) return "";
  const q=encodeURIComponent(`${k.artist} ${k.title}`), a=k.art;
  return `<section class="kyoku" id="kyoku" aria-labelledby="kyoku-h"><h2 class="band" id="kyoku-h"><a href="/kyoku/">きょうの一曲</a></h2>
    <div class="kk">${a?`<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.img)}" alt="${esc(a.album||k.title)}のジャケット" width="96" height="96" loading="lazy"></a>`:""}
      <div><h3>${k.day?`<a class="hl" href="${esc(k.day)}kyoku/">${esc(k.title)}</a>`:esc(k.title)}</h3><p class="who">${esc(k.artist)}</p></div></div>
    <p class="txt">${esc(k.text)}</p>
    <p class="kiku"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTubeで聴く</a>${a&&a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Apple Musicで聴く</a>`:""}</p></section>`;
}
/* 島のたより:CSV の文章のまま。本文の [語](URL) だけリンクにする */
const mdLink = t => esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,w,u)=>`<a href="${u}" target="_blank" rel="noopener">${w}</a>`);
function tayoriSection(c){
  if(!c) return "";
  return `<section class="tayori" id="tayori" aria-labelledby="tayori-h"><h2 class="band" id="tayori-h"><a href="/tayori/">${esc(c.name||"島のたより")}</a></h2>
    ${c.title?`<h3>${c.day?`<a class="hl" href="${esc(c.day)}tayori/">${esc(c.title)}</a>`:esc(c.title)}</h3>`:""}<div class="honbun">${(c.body||[]).map(t=>`<p>${mdLink(t)}</p>`).join("")}</div></section>`;
}

function render(e){
  e={...e}; if(!e.top&&e.side.length){e.top=e.side[0]; e.side=e.side.slice(1);}
  if(!e.top&&e.shorts.length){e.top=e.shorts[0]; e.shorts=e.shorts.slice(1);}
  // 最新号(トップ)は題字だけ、日付のページは日付を添える
  document.title = /^\/\d{4}\/\d{2}\/\d{2}\//.test(location.pathname) ? `八丈島新聞 ${hiduke(e.date)}` : "八丈島新聞";
  document.getElementById("paper").innerHTML = `

  <div class="ichimen" id="ichimen">
    <div class="ichimen-main">${e.top?`<article class="top" id="a1">
      ${lbl(e.top)}<h2>${hl(e,e.top)}</h2>
      ${figure(e.top.photo)}
      <div class="honbun">${paras(e.top.body)}${src(e.top.sources)}</div>
    </article>${e.side.length+e.shorts.length?`<div class="yon">${[...e.side.map(s=>[s,"side"]),...e.shorts.map(s=>[s,"short"])].map(([s,c],i)=>{const b=Array.isArray(s.body)?s.body:[s.body];
      return `<article class="kiji ${c}" id="a${i+2}">
      ${thumb(e,s)}<div class="hd">${lbl(s)}<h3>${hl(e,s)}</h3></div>
      ${s.id?`<p class="ld">${esc(b[0])}</p>`:`<div class="honbun">${paras(b)}${src(s.sources)}</div>`}
    </article>`;}).join("")}</div>`:""}`:""}
    ${tayoriSection(e.column&&{...e.column,day:DAY(e)})}
    ${e.ronten?`<section class="men ronten" id="ronten" aria-labelledby="ronten-h">
      <h2 class="band" id="ronten-h">論点</h2>
      <h3 class="ronten-t">${esc(e.ronten.title)}</h3>
      <div class="ronten-g">${e.ronten.sections.map(x=>`<div><h4>${esc(x.h)}</h4><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <p class="note">この欄は本紙の意見ではありません。本紙がこれまでに載せた記事から、続いている話題の論点を整理したものです。</p>
    </section>`:""}
    </div>
    <aside class="rail">
      <section class="tv" aria-label="FM八丈島テレビ">
        <div class="head"><h2 class="band onair"><a href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><i aria-hidden="true"></i>ON AIR</a></h2><a class="chl" href="https://tv.hachijojima.jp/" target="_blank" rel="noopener"><img class="ch" src="/img/fm8tv.png" width="965" height="155" alt="FM八丈島テレビ"></a></div>
        <div style="position:relative;width:100%;height:0;padding-top:calc(56.25% + 44px)"><iframe src="${TV_EMBED}" title="FM八丈島テレビ" style="position:absolute;inset:0;display:block;width:100%;height:100%;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      </section>
      ${(e.ichimen_week||[]).length?`<section id="week" aria-labelledby="week-h">
        <h2 class="band" id="week-h"><a href="/shukusatsu/">今週の一面</a></h2>
        <ol class="week">${e.ichimen_week.map(w=>`<li><a href="${esc(w.url)}"><time datetime="${esc(w.date)}">${tsuki(w.date)}</time>${esc(w.headlines[0])}</a></li>`).join("")}</ol>
      </section>`:""}
      ${giinSection(e)}
      ${kyokuSection(e.kyoku&&{...e.kyoku,day:DAY(e)})}
      ${shimaSection(e)}
    </aside>
  </div>

  <nav class="gou" aria-label="号">${e.prev?`<a href="${esc(e.prev)}">← 前の号</a>`:"<span></span>"}${e.next?`<a href="${esc(e.next)}">次の号 →</a>`:""}</nav>
  ${e.sample||e.proof?`<p class="gou-note">${e.sample?"この紙面は見本データで組んでいます":""}${e.proof?"この号は試し刷りです":""}</p>`:""}`;
}

  <section class="kyukan"><h2>本日は休刊です</h2><p>けさの号を組めませんでした。<a href="/shukusatsu/">バックナンバー</a>で前の号を読めます。</p></section>`;
}

const EMB = document.getElementById("edition").textContent.trim();
function loadEmbeds(){
  const need={instagram:"https://www.instagram.com/embed.js",x:"https://platform.twitter.com/widgets.js"};
  [...new Set([...document.querySelectorAll("figure.embed")].map(f=>f.dataset.provider))].forEach(p=>{
    if(!need[p]) return; const sc=document.createElement("script"); sc.src=need[p]; sc.async=true; document.body.appendChild(sc);
  });
}
if (EMB.startsWith("{")) { render(JSON.parse(EMB)); loadEmbeds(); } else
fetch("edition.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>SAMPLE?render(SAMPLE):kyukan());
</script>
